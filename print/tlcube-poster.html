<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLcube print poster</title>
<style>
  :root {
    --symbol-box: 68mm;
    color-scheme: light;
  }
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #dededc;
    color: #161616;
    font-family: Georgia, "Times New Roman", Times, serif;
  }
  .sheet {
    background: #ffffff;
    color: #161616;
  }
  .headline {
    margin: 0 0 8px;
    font-size: 22pt;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .lede {
    margin: 0 0 18px;
    font-size: 11pt;
    line-height: 1.45;
    max-width: 42em;
  }
  .pair {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10mm;
  }
  .card {
    flex: 1 1 0;
    margin: 0;
    min-width: 0;
  }
  .card figcaption {
    margin: 0 0 4px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10pt;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tagline {
    margin: 0 0 8px;
    font-size: 10.5pt;
    line-height: 1.35;
  }
  .symbol-box {
    width: var(--symbol-box);
    height: var(--symbol-box);
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
  }
  .symbol-box .symbol-render {
    display: block;
    width: 100%;
    height: 100%;
  }
  .gutter {
    flex: 0 0 auto;
    align-self: center;
    padding-top: 28px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 9pt;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6a6a6a;
  }
  .facts {
    margin: 18px 0 0;
    font-size: 9pt;
    line-height: 1.45;
    color: #333;
  }
  @media screen {
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 12px;
    }
    .sheet {
      width: 210mm;
      min-height: 297mm;
      padding: 16mm 16mm 14mm;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
    }
  }
  @media print {
    html, body { background: #ffffff; }
    body { padding: 0; display: block; }
    .sheet {
      width: auto;
      min-height: 0;
      padding: 0;
      box-shadow: none;
    }
    html, body, .sheet, .symbol-box {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>

  <p class="lede">Same link, same printed size. Scan the familiar mark on the left, then the TLcube on the right.</p>
