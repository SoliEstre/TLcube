<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 탭 제목도 언어를 따라간다. 지금 문구는 app.label(main 의 aria-label)과 같지만 **키는
     분리한다** — 붙여 두면 나중에 제목에 설명을 덧붙일 때 스크린리더 라벨까지 장황해진다.
     같은 값이라는 이유로 키를 합치면 두 소비자의 요구가 갈릴 때 되돌리기 어렵다.
     meta(description·og:*)는 안 건다 — 크롤러가 JS 를 안 돌려 런타임 변경이 무의미하다. -->
<title data-i18n="document.title">TLcube 스캐너</title>
<meta name="description" content="TLcube 코드를 카메라나 사진에서 읽는 스캐너입니다.">
<link rel="canonical" href="https://tlscan.estre.so/">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TLcube">
<meta property="og:title" content="TLcube 스캐너 — 카메라로 TLcube 코드 읽기">
<meta property="og:description" content="설치 없이 브라우저에서 TLcube 코드를 읽습니다. 프레임은 기기 안에서만 처리하고 서버로 이미지를 보내지 않아요.">
<meta property="og:url" content="https://tlscan.estre.so/">
<meta property="og:image" content="https://tl.estre.so/assets/type-Y.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "TLcube 스캐너",
  "url": "https://tlscan.estre.so/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any (web browser)",
  "browserRequirements": "HTTPS, 카메라 접근을 지원하는 최신 브라우저",
  "description": "TrilLuminance (cube) 코드를 카메라나 사진에서 읽는 웹 스캐너. 프레임은 기기 안에서만 처리합니다.",
  "isPartOf": { "@type": "WebSite", "name": "TLcube", "url": "https://tl.estre.so/" },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
}
</script>
<link rel="icon" href="../_shared/favicon.svg" type="image/svg+xml">
<!-- PWA — 홈 화면에 설치해서 브라우저 크롬 없이 전체화면으로 쓴다.
     manifest·sw 는 배포 nginx 가 루트로 alias 한다(deploy/.../static.conf). dev 서버에는
     그 경로가 없어 404 가 나는데, 등록 실패는 삼키므로 스캐너 동작에는 영향이 없다. -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS 는 매니페스트 아이콘을 홈 화면에 쓰지 않는다. 이 링크가 없으면 파비콘을
     확대해 저해상도로 나온다(실기기 확인 2026-08-11). PNG 는 tools/make-icons.mjs 가 굽는다. -->
<link rel="apple-touch-icon" sizes="180x180" href="/_shared/icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TLcube">
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000;
    color: #fff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
    background: #000;
  }

  body {
    min-width: 320px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    border: 0;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }

  [hidden] {
    display: none !important;
  }

  .scanner-app {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #000;
  }

  .camera-backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #000;
  }

  .camera-backdrop::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    background:
      linear-gradient(180deg, rgb(0 0 0 / .58), transparent 26%, transparent 64%, rgb(0 0 0 / .7)),
      linear-gradient(90deg, rgb(0 0 0 / .18), transparent 22%, transparent 78%, rgb(0 0 0 / .18));
  }

  #camera-preview {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 180ms ease;
  }

  .camera-backdrop.is-active #camera-preview {
    opacity: 1;
  }

  .scanner-overlay {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding:
      max(18px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
    pointer-events: none;
  }

  .scanner-top,
  .scanner-bottom,
  .site-footer {
    display: flex;
    justify-content: center;
  }

  .scanner-top {
    /* 로고는 왼쪽, 언어 토글은 오른쪽. 사용자 지시로 언어를 우상단으로 옮겼다
       (하단은 «사진에서 스캔» 이 주역이라 컨트롤이 몰리면 탭 표적이 붐빈다). */
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .brand-logo {
    display: inline-flex;
    align-items: baseline;
    padding: 8px 10px;
    border: 1px solid rgb(255 255 255 / .22);
    border-radius: 999px;
    color: #fff;
    background: rgb(0 0 0 / .42);
    box-shadow: 0 8px 24px rgb(0 0 0 / .24);
    font-size: 14px;
    font-weight: 760;
    letter-spacing: -.04em;
    line-height: 1;
    text-decoration: none;
    text-shadow: 0 1px 10px rgb(0 0 0 / .9);
    pointer-events: auto;
  }

  .brand-logo span {
    color: #b7e5ff;
  }

  .scan-center {
    display: grid;
    flex: 1;
    place-items: center;
    padding: 42px 0 24px;
  }

  .scan-guide-wrap {
    display: grid;
    justify-items: center;
    gap: 18px;
  }

  .scan-guide {
    position: relative;
    width: min(72vw, 356px);
    aspect-ratio: 1;
    border: 2px solid rgb(255 255 255 / .44);
    border-radius: 28px;
    box-shadow:
      0 0 0 1px rgb(0 0 0 / .18) inset,
      0 18px 55px rgb(0 0 0 / .22);
  }

  .scan-corner {
    position: absolute;
    width: 38px;
    height: 38px;
    border-color: #d6f2ff;
    border-style: solid;
    filter: drop-shadow(0 1px 8px rgb(0 0 0 / .72));
  }

  .scan-corner.top-left {
    top: -3px;
    left: -3px;
    border-width: 4px 0 0 4px;
    border-radius: 13px 0 0;
  }

  .scan-corner.top-right {
    top: -3px;
    right: -3px;
    border-width: 4px 4px 0 0;
    border-radius: 0 13px 0 0;
  }

  .scan-corner.bottom-right {
    right: -3px;
    bottom: -3px;
    border-width: 0 4px 4px 0;
    border-radius: 0 0 13px;
  }

  .scan-corner.bottom-left {
    bottom: -3px;
    left: -3px;
    border-width: 0 0 4px 4px;
    border-radius: 0 0 0 13px;
  }

  .scan-guide-message {
    max-width: calc(100vw - 40px);
    margin: 0;
    padding: 8px 12px;
    border-radius: 999px;
    color: #fff;
    background: rgb(0 0 0 / .52);
    box-shadow: 0 3px 18px rgb(0 0 0 / .34);
    font-size: clamp(14px, 3.8vw, 16px);
    font-weight: 650;
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  .scanner-bottom {
    display: grid;
    justify-items: center;
    gap: 12px;
    padding-top: 12px;
  }

  .scan-status {
    max-width: min(100%, 460px);
    margin: 0;
    padding: 7px 11px;
    border-radius: 10px;
    color: rgb(255 255 255 / .94);
    background: rgb(0 0 0 / .5);
    box-shadow: 0 3px 16px rgb(0 0 0 / .26);
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  /*
   * 사진 스캔 실패 토스트.
   *
   * 왜 상태줄만으로 부족한가: 실패 문구는 `.scan-status` 에 조용히 갈아끼워지는데, 사진을
   * 고르는 동작 자체가 시스템 파일 선택기를 거쳐 돌아오는 흐름이라 사용자의 시선이 화면
   * 하단에 없다. 아무 일도 안 일어난 것처럼 보인다는 제보(2026-08-12).
   *
   * 왜 위쪽인가: 실패 후 사용자가 바로 할 일은 «다른 사진 고르기» 이고 그 버튼이 하단에
   * 있다. 생성기처럼 하단에 띄우면 눌러야 할 버튼을 토스트가 덮는다.
   *
   * ⚠ 배경이 고정으로 어두우니 글자도 고정 밝은 색이다 — 생성기 토스트와 같은 규칙
   *   (테마 변수를 쓰면 라이트에서 어두운 글자 + 어두운 배경이 된다).
   */
  .scan-toast {
    position: fixed; z-index: 60; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 60px));
    transform: translate(-50%, -12px); width: max-content; max-width: calc(100vw - 32px);
    padding: 11px 15px; border-radius: 999px; background: rgb(21 25 36 / .96);
    /* 스캐너 배경은 카메라 화면이거나 게이트의 거의 검은 오버레이다. 알약과 배경이 둘 다
       어두워 경계가 녹으므로 실선 테두리로 형태를 세운다(실브라우저 확인 2026-08-12). */
    border: 1px solid rgb(255 255 255 / .16);
    color: #f2f5fb; box-shadow: 0 10px 30px rgb(0 0 0 / .38); font-size: 13px;
    line-height: 1.35; text-align: center; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .scan-toast.visible { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { .scan-toast { font-size: 12px; } }

  .photo-button,
  .gate-primary,
  .result-primary,
  .open-url-button {
    min-height: 52px;
    border-radius: 16px;
    color: #061117;
    background: #e7f7ff;
    box-shadow: 0 10px 28px rgb(0 0 0 / .3);
    cursor: pointer;
    font-weight: 760;
    letter-spacing: -.01em;
  }

  .photo-button {
    width: min(100%, 360px);
    padding: 14px 20px;
    pointer-events: auto;
  }

  .photo-button:hover,
  .gate-primary:hover,
  .result-primary:hover,
  .open-url-button:hover {
    background: #fff;
  }

  .site-footer {
    padding-top: 14px;
    color: rgb(255 255 255 / .72);
    font-size: 11px;
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  .site-footer a {
    color: #fff;
    pointer-events: auto;
  }

  /* 빌드 식별자 — 실기기 피드백에서 어느 배포본인지 바로 알기 위한 것. 눈에 띌 필요는
     없지만 읽을 수는 있어야 해서 본문보다 흐리게만 둔다. */
  .build-tag {
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }

  .lang-switch {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 2px;
    padding: 2px;
    border: 1px solid rgb(255 255 255 / .22);
    border-radius: 999px;
    background: rgb(0 0 0 / .42);
    pointer-events: auto;
  }

  .lang-switch button {
    padding: 5px 12px;
    border-radius: 999px;
    background: transparent;
    color: rgb(255 255 255 / .72);
    font-size: 12px;
    cursor: pointer;
  }

  .lang-switch button.active {
    background: rgb(255 255 255 / .92);
    color: #061117;
    font-weight: 700;
  }

  .camera-picker {
    pointer-events: auto;
    margin-top: 10px;
    max-width: min(320px, 80vw);
    padding: 7px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(18, 18, 20, 0.78);
    color: #fff;
    font: inherit;
    font-size: 13px;
  }

  /* 목록이 열렸을 때는 OS 가 그리므로 어두운 배경에 검은 글자가 되지 않도록 명시한다. */
  .camera-picker option {
    background: #17181c;
    color: #fff;
  }

  .camera-gate {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
    background: rgb(0 0 0 / .7);
    backdrop-filter: blur(10px);
  }

  .camera-gate-card {
    width: min(100%, 390px);
    padding: 26px;
    border: 1px solid rgb(255 255 255 / .18);
    border-radius: 24px;
    background: rgb(20 22 24 / .88);
    box-shadow: 0 24px 70px rgb(0 0 0 / .46);
    text-align: center;
  }

  .camera-gate-card h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(23px, 6vw, 29px);
    letter-spacing: -.045em;
    line-height: 1.18;
  }

  .camera-gate-card p {
    margin: 12px 0 0;
    color: rgb(255 255 255 / .76);
    font-size: 15px;
    line-height: 1.55;
  }

  .camera-gate-actions {
    display: grid;
    gap: 10px;
    margin-top: 24px;
  }

  .gate-primary,
  .gate-secondary {
    width: 100%;
    padding: 13px 16px;
  }

  .gate-primary:disabled {
    cursor: not-allowed;
    opacity: .52;
  }

  .gate-secondary,
  .result-secondary,
  .result-close,
  .copy-button {
    color: #fff;
    background: rgb(255 255 255 / .1);
    cursor: pointer;
  }

  .gate-secondary {
    min-height: 48px;
    border: 1px solid rgb(255 255 255 / .19);
    border-radius: 14px;
    font-weight: 680;
  }

  .result-sheet {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: end center;
    padding: 16px;
    background: rgb(0 0 0 / .64);
    backdrop-filter: blur(12px);
  }

  .result-card {
    position: relative;
    width: min(100%, 600px);
    max-height: min(84dvh, 760px);
    overflow: auto;
    padding: 28px 20px 20px;
    border: 1px solid rgb(255 255 255 / .16);
    border-radius: 24px;
    color: #fff;
    background: #141618;
    box-shadow: 0 28px 80px rgb(0 0 0 / .52);
  }

  .result-close {
    position: absolute;
    top: 13px;
    right: 13px;
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 50%;
    font-size: 23px;
    line-height: 1;
  }

  .result-eyebrow {
    margin: 0;
    color: #b7e5ff;
    font-size: 12px;
    font-weight: 760;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .result-card h2 {
    margin: 6px 44px 0 0;
    font-size: clamp(24px, 7vw, 32px);
    letter-spacing: -.045em;
    line-height: 1.17;
  }

  .result-content {
    display: grid;
    gap: 12px;
    margin-top: 22px;
  }

  .result-intro {
    margin: 0;
    color: rgb(255 255 255 / .68);
    font-size: 14px;
    line-height: 1.55;
  }

  .payload-url,
  .text-payload,
  .payload-field {
    overflow-wrap: anywhere;
    border: 1px solid rgb(255 255 255 / .1);
    border-radius: 16px;
    background: rgb(255 255 255 / .055);
  }

  .payload-url,
  .text-payload {
    display: block;
    padding: 15px;
  }

  .payload-url {
    color: #c7ecff;
    font-weight: 650;
    line-height: 1.5;
  }

  .text-payload {
    margin: 0;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.58;
    white-space: pre-wrap;
  }

  .payload-field {
    display: grid;
    gap: 5px;
    padding: 13px;
  }

  .payload-field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .payload-label {
    color: rgb(255 255 255 / .64);
    font-size: 12px;
    font-weight: 700;
  }

  .payload-value {
    min-width: 0;
    color: #fff;
    font-size: 16px;
    font-weight: 650;
    line-height: 1.45;
  }

  a.payload-value {
    color: #c7ecff;
  }

  .copy-button {
    flex: 0 0 auto;
    min-height: 31px;
    padding: 5px 9px;
    border: 1px solid rgb(255 255 255 / .14);
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
  }

  .popup-fallback {
    display: grid;
    gap: 10px;
    padding: 16px;
    border: 1px solid rgb(183 229 255 / .34);
    border-radius: 16px;
    background: rgb(74 121 145 / .18);
  }

  .popup-fallback p {
    margin: 0;
    color: #e5f6ff;
    font-size: 14px;
    line-height: 1.5;
  }

  .open-url-button {
    width: 100%;
    padding: 14px 16px;
  }

  .result-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .result-primary,
  .result-secondary {
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 14px;
    font-weight: 760;
  }

  .result-secondary {
    border: 1px solid rgb(255 255 255 / .16);
  }

  @media (min-width: 560px) {
    .result-sheet {
      place-items: center;
    }

    .result-card {
      padding: 32px 28px 26px;
      border-radius: 28px;
    }

    .result-actions {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* 가로모드 — 세로 쌓기를 버리고 컨트롤을 우측 열로 옮긴다.
     세로 축을 그대로 두면 로고·가이드·버튼·푸터가 \~390px 높이에 전부 쌓여
     하단 버튼과 푸터가 화면 밖으로 잘린다(실기기 확인 2026-08-10).
     가이드 크기만 줄이는 것으로는 부족했다 — 축을 바꿔야 한다. */
  @media (max-height: 620px) and (orientation: landscape) {
    .scanner-overlay {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "top     top"
        "center  actions"
        "center  footer";
      align-items: center;
      column-gap: 16px;
    }

    .scanner-top { grid-area: top; }

    .scan-center {
      grid-area: center;
      min-height: 0;
      padding: 8px 0;
    }

    /* 상태 문구 + "사진에서 스캔" 을 우측에 세로로 세운다. */
    .scanner-bottom {
      grid-area: actions;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }

    .site-footer {
      grid-area: footer;
      justify-content: flex-end;
      align-self: end;
    }

    /* 우측 열이 폭을 가져가므로 가이드는 **높이 기준**으로 잡는다.
       스캔 대상은 클수록 유리하므로 남는 세로 공간을 쓴다 — 다만 가이드 아래
       안내 문구가 같은 열에 들어가므로 100% 를 채우지 않는다. */
    .scan-guide {
      width: min(56vh, 300px);
    }

    .camera-gate-card {
      padding: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<!-- ⚠ aria-hidden 이다. 같은 문구를 `.scan-status`(role=status·aria-live)가 이미 읽어 주므로
     여기까지 live 로 두면 스크린리더가 **두 번** 읽는다. 이건 순수 시각 보조다. -->
<div id="scan-toast" class="scan-toast" aria-hidden="true"></div>
<main class="scanner-app" id="scanner-app" data-i18n-attr="aria-label:app.label" aria-label="TLcube 스캐너">
  <div class="camera-backdrop" id="camera-stage">
    <video id="camera-preview" autoplay muted playsinline data-i18n-attr="aria-label:camera.label" aria-label="TLcube 코드를 비추는 카메라 화면"></video>
  </div>

  <div class="scanner-overlay">
    <header class="scanner-top">
      <a class="brand-logo" href="https://tl.estre.so" target="_blank" rel="noopener noreferrer" data-i18n-attr="aria-label:brand.label" aria-label="TLcube 소개 홈페이지 (새 창)">TL<span>cube</span></a>
      <div class="lang-switch" id="lang-switch" role="group" data-i18n-attr="aria-label:lang.label" aria-label="언어">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
    </header>

    <section class="scan-center" data-i18n-attr="aria-label:guide.label" aria-label="스캔 가이드">
      <div class="scan-guide-wrap">
        <div class="scan-guide" aria-hidden="true">
          <span class="scan-corner top-left"></span>
          <span class="scan-corner top-right"></span>
          <span class="scan-corner bottom-right"></span>
          <span class="scan-corner bottom-left"></span>
        </div>
        <p class="scan-guide-message" data-i18n="guide.message">TLcube 코드를 프레임 안에 맞춰 주세요.</p>
      </div>
    </section>

    <div class="scanner-bottom">
      <p class="scan-status" id="scan-status" role="status" aria-live="polite" aria-atomic="true" data-i18n="status.preparing">카메라를 준비하고 있어요.</p>
      <button class="photo-button" id="choose-image" type="button" data-i18n="button.photo">사진에서 스캔</button>
      <!-- 렌즈가 2개 이상인 기기에서만 나타난다. 초광각이 잡히면 같은 거리에서 코드가
           훨씬 작게 찍혀 셀당 픽셀이 복호 하한 아래로 내려간다. -->
      <select class="camera-picker" id="camera-picker" data-i18n-attr="aria-label:picker.label" aria-label="카메라 렌즈 선택" hidden></select>
      <input id="image-input" type="file" accept="image/*" data-i18n-attr="aria-label:input.label" aria-label="스캔할 사진 선택" hidden>
    </div>

    <footer class="site-footer">
      <small>© 2026 SoliEstre · <a href="https://tl.estre.so" target="_blank" rel="noopener noreferrer" data-i18n="footer.intro">소개</a> · <a href="https://tlcube.estre.so" target="_blank" rel="noopener noreferrer" data-i18n="footer.generator">생성기</a> · <span id="build-tag" class="build-tag">—</span></small>
    </footer>
  </div>

  <section class="camera-gate" id="camera-gate" aria-labelledby="camera-gate-title" aria-describedby="camera-gate-message">
    <div class="camera-gate-card">
      <h1 id="camera-gate-title">카메라를 시작할까요?</h1>
      <p id="camera-gate-message">카메라 권한을 허용하면 바로 스캔해요.</p>
      <div class="camera-gate-actions">
        <button class="gate-primary" id="start-camera" type="button">탭해서 카메라 시작</button>
        <button class="gate-secondary" id="gate-choose-image" type="button" data-i18n="button.photo">사진에서 스캔</button>
      </div>
    </div>
  </section>
</main>

<section class="result-sheet" id="scan-result" hidden role="dialog" aria-modal="true" aria-labelledby="result-title" tabindex="-1">
  <div class="result-card">
    <button class="result-close" id="close-result" type="button" data-i18n-attr="aria-label:result.close" aria-label="스캔 결과 닫기">×</button>
    <p class="result-eyebrow" data-i18n="result.title">스캔 결과</p>
    <!-- 스캔 성공 시 showResult() 가 페이로드 종류에 맞는 제목으로 덮는다. 여기 정적
         문구는 그 전 상태의 기본값이라 거의 안 보이지만, data-i18n 을 걸어 두지 않으면
         패널을 띄우는 경로가 하나라도 생겼을 때 한국어가 샌다. -->
    <h2 id="result-title" data-i18n="result.generic">내용을 읽었어요</h2>
    <div class="result-content" id="result-content"></div>
    <div class="popup-fallback" id="popup-fallback" hidden>
      <p data-i18n="result.popupBlocked">브라우저가 자동으로 새 탭을 열지 못했어요. 아래 버튼을 탭해서 열어 주세요.</p>
      <a class="open-url-button" id="open-url" href="#" target="_blank" rel="noopener noreferrer" role="button" data-i18n="result.openLink">링크 열기</a>
    </div>
    <div class="result-actions">
      <button class="result-primary" id="rescan" type="button" data-i18n="result.rescan">다시 스캔</button>
      <button class="result-secondary" id="close-result-secondary" type="button" data-i18n="result.closeButton">닫기</button>
    </div>
  </div>
</section>

<script type="module" src="scanner.js"></script>
</body>
</html>
