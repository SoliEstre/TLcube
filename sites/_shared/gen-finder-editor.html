|| counts.W !== 24 || counts.SE !== 9) {\n      throw new Error('v0T 블록 분할이 16/9/10/36/24/9 가 아니다: '\n        + [counts.NW, counts.A, counts.ARM, counts.NE, counts.W, counts.SE].join('/'));\n    }\n    // **의도된 비대칭 이중화** (운영자 확정 2026-08-17) — A 9 (L 반전) + SE 6 (R 반전),\n    // 그 밖 0. A 는 L 만 달라야 하고 SE 는 R 만 달라야 한다 (팩 structure 주장).\n    if (asymA !== 9 || asymSe !== 6 || asymElsewhere !== 0) {\n      throw new Error('v0T 비대칭 분포가 A 9 · SE 6 · 그 밖 0 이 아니다: '\n        + [asymA, asymSe, asymElsewhere].join('/'));\n    }\n    for (const [i, j, T, L, R] of V0T_A_CELLS) {\n      if (T !== R || L === T) {\n        throw new Error('v0T A 블록 (' + i + ',' + j + ') 이 «L 만 반전» 이 아니다');\n      }\n    }\n    if (slotCellsFor(CELL_SURFACE_FINAL_V0T, V0T_N).length !== 0) {\n      throw new Error('v0T 에 QR 슬롯이 생겼다 — v0xq · v0wq · v0wy · v0ty 전용이다');\n    }\n  }\n\n  // ①-i v0TY 정본 — 95셀 (v0T − SE 9) · mid 0 · 슬롯 64.\n  //\n  // 정의가 곧 유도다 — V0T_CELLS 의 슬롯 박스 필터. 여기서 재는 것은\n  // ⓐ 필터가 정확히 SE 9 만 걷어냈는가 ⓑ 행 참조가 유지되는가 ⓒ 남은 비대칭이\n  // **A 블록 하나**인가 (의도된 이중화의 실증 — 보충 블록 0 · 마커 이전 0) 다.\n  if (V0TY_CELLS.length !== 95) {\n    throw new Error('v0TY 정본이 95셀이 아니다: ' + V0TY_CELLS.length);\n  }\n  {\n    for (const row of V0TY_CELLS) {\n      if (!V0T_CELLS.includes(row)) {\n        throw new Error('v0TY 에 v0T 밖 행이 있다 — 필터 유도가 아니다');\n      }\n    }\n    // 걷어낸 것 = 정확히 V0W_PHASE_CELLS (v0T SE) 9행이고, 전부 슬롯 안이다.\n    const removed = V0T_CELLS.filter((row) => !V0TY_CELLS.includes(row));\n    if (removed.length !== 9 || removed.some((row, index) => row !== V0W_PHASE_CELLS[index])) {\n      throw new Error('v0TY 필터가 걷어낸 것이 v0T SE (v0W PHASE) 9행이 아니다');\n    }\n    const slotKeys = new Set(slotCellsFor(CELL_SURFACE_FINAL_V0TY, V0TY_N)\n      .map((cell) => cellKey(cell.i, cell.j)));\n    if (!removed.every(([i, j]) => slotKeys.has(cellKey(i, j)))) {\n      throw new Error('v0T SE 블록이 v0TY 슬롯 안에 다 들어 있지 않다');\n    }\n    for (const [i, j] of V0TY_CELLS) {\n      if (i >= V0TY_BLOCKS.SLOT.iMin && j >= V0TY_BLOCKS.SLOT.jMin) {\n        throw new Error('v0TY 파인더 셀 (' + i + ',' + j + ') 이 먼 코너 QR 슬롯 안이다');\n      }\n    }\n    // 남은 방향 판별자 = A 블록 (L 반전 9셀) **하나** — 보충 블록 신설 금지의 회귀.\n    const asym = V0TY_CELLS.filter(([, , T, L, R]) => !(T === L && L === R));\n    if (asym.length !== 9 || asym.some((row) => !V0T_A_CELLS.includes(row))) {\n      throw new Error('v0TY 의 비대칭이 A 블록 9셀만이 아니다: ' + asym.length);\n    }\n    // 슬롯 규약 — 크기는 v0WQ·v0WY 와 같아야 (운영자 스펙) 하고 자리는 far 앵커다.\n    if (CENTER_QR_SLOT_CELLS_V0TY !== CENTER_QR_SLOT_CELLS_V0WQ) {\n      throw new Error('v0TY 슬롯 한 변이 v0WQ 와 다르다 — 운영자 스펙은 «동일 크기» 다');\n    }\n    const tyOrigin = centerQrSlotOriginFor(CELL_SURFACE_FINAL_V0TY, V0TY_N);\n    if (tyOrigin.i !== V0TY_N - CENTER_QR_SLOT_CELLS_V0TY || tyOrigin.i !== tyOrigin.j) {\n      throw new Error('v0TY 슬롯이 먼 코너에 앵커되지 않았다: ' + tyOrigin.i + ',' + tyOrigin.j);\n    }\n  }\n\n  // ①-j v0TR 정본 — 102셀 (중앙 16 + **A 9** + NE 68 + SE 9) · mid 0 · 비대칭 15 · 슬롯 0.\n  //\n  // A 블록은 2026-08-18 운영자 지적으로 편입됐다 (최초 정본에 빠져 있었다).\n  // 없으면 v0TRY 에서 슬롯이 SE 를 삼킨 뒤 방향 판별자가 0 이 된다 (§V0TR_CELLS).\n  //\n  // 전사가 한 줄도 없는 구조라 여기서 재는 것은 «유도가 실제로 정본 배열을 물고\n  // 있는가» 다: 중앙·바깥 사각·SE 는 **행 참조 동일성**으로, 안쪽 사각은\n  // **평행이동 사상**으로 못 박는다. 물린 배열이 조용히 바뀌면 여기서 터진다.\n  if (V0TR_CELLS.length !== 102) {\n    throw new Error('v0TR 정본이 102셀이 아니다: ' + V0TR_CELLS.length);\n  }\n  {\n    // ⓐ 중앙 16 = V0T_CENTRE_CELLS 행 참조 그대로 (새 배열 신설 금지 규약).\n    if (V0TR_CELLS.slice(0, V0T_CENTRE_CELLS.length)\n      .some((row, index) => row !== V0T_CENTRE_CELLS[index])) {\n      throw new Error('v0TR 중앙이 V0T_CENTRE_CELLS 행 참조가 아니다');\n    }\n    // ⓐ' A 9 = V0T_A_CELLS 행 참조 그대로 (v0T 와 문자 그대로 같은 셀·같은 톤).\n    const aStart = V0T_CENTRE_CELLS.length;\n    if (V0TR_CELLS.slice(aStart, aStart + V0T_A_CELLS.length)\n      .some((row, index) => row !== V0T_A_CELLS[index])) {\n      throw new Error('v0TR A 블록이 V0T_A_CELLS 행 참조가 아니다');\n    }\n    // ⓑ NE 바깥 36 = V0XQ_CORNER_CELLS 행 참조 그대로 (= v0T NE 와 같은 배열).\n    const outerStart = V0T_CENTRE_CELLS.length + V0T_A_CELLS.length;\n    if (V0TR_CELLS.slice(outerStart, outerStart + V0XQ_CORNER_CELLS.length)\n      .some((row, index) => row !== V0XQ_CORNER_CELLS[index])) {\n      throw new Error('v0TR NE 바깥 사각이 V0XQ_CORNER_CELLS 행 참조가 아니다');\n    }\n    // ⓒ SE 9 = V0W_PHASE_CELLS 행 참조 그대로.\n    if (V0TR_CELLS.slice(V0TR_CELLS.length - V0W_PHASE_CELLS.length)\n      .some((row, index) => row !== V0W_PHASE_CELLS[index])) {\n      throw new Error('v0TR SE 가 V0W_PHASE_CELLS 행 참조가 아니다');\n    }\n    // ⓓ NE 합집합 68 = 36 + 36 − 겹침 4, 그리고 겹치는 4셀은 **톤까지 같다**\n    //    (같지 않으면 «안쪽 사본을 빼고 바깥을 남긴다» 는 선택이 정보를 죽인다).\n    if (V0TR_NE_CELLS.length !== 68) {\n      throw new Error('v0TR NE 합집합이 68셀이 아니다: ' + V0TR_NE_CELLS.length);\n    }\n    const outerByKey = new Map(V0XQ_CORNER_CELLS.map((row) => [cellKey(row[0], row[1]), row]));\n    let shared = 0;\n    for (const [i, j, T, L, R] of V0TR_INNER_CELLS) {\n      const twin = outerByKey.get(cellKey(i, j));\n      if (!twin) continue;\n      shared += 1;\n      if (twin[2] !== T || twin[3] !== L || twin[4] !== R) {\n        throw new Error('v0TR 두 동심 사각의 겹침 셀 톤이 다르다: ' + cellKey(i, j));\n      }\n    }\n    if (shared !== 4) {\n      throw new Error('v0TR 두 동심 사각의 겹침이 4셀이 아니다: ' + shared);\n    }\n    // ⓔ 안쪽 사각이 정말 바깥 사각의 평행이동인가 (사상 전수 — 톤 변경 0).\n    if (V0TR_INNER_CELLS.length !== V0XQ_CORNER_CELLS.length) {\n      throw new Error('v0TR 안쪽 사각 셀 수가 바깥과 다르다');\n    }\n    for (let index = 0; index < V0TR_INNER_CELLS.length; index += 1) {\n      const [i, j, T, L, R] = V0TR_INNER_CELLS[index];\n      const [oi, oj, oT, oL, oR] = V0XQ_CORNER_CELLS[index];\n      if (i !== oi + V0TR_INNER_SHIFT_I || j !== oj + V0TR_INNER_SHIFT_J\n        || T !== oT || L !== oL || R !== oR) {\n        throw new Error('v0TR 안쪽 사각이 바깥 사각의 평행이동이 아니다: ' + cellKey(i, j));\n      }\n    }\n    // ⓕ 블록 상자 전수 — 102셀이 정확히 다섯 상자(NW·A·NE 바깥·NE 안쪽·SE) 안에\n    //    있고, 상자마다 기대 셀 수를 갖는가. 상자 밖 셀이 하나라도 있으면 터진다.\n    const box = { NW: 0, A: 0, NE_OUTER: 0, NE_INNER: 0, SE: 0 };\n    for (const [i, j] of V0TR_CELLS) {\n      const homes = [];\n      if (i <= V0TR_BLOCKS.NW.iMax && j <= V0TR_BLOCKS.NW.jMax) homes.push('NW');\n      if (i >= V0TR_BLOCKS.A.iMin && i <= V0TR_BLOCKS.A.iMax\n        && j >= V0TR_BLOCKS.A.jMin && j <= V0TR_BLOCKS.A.jMax) homes.push('A');\n      if (i <= V0TR_BLOCKS.NE_OUTER.iMax && j >= V0TR_BLOCKS.NE_OUTER.jMin) homes.push('NE_OUTER');\n      if (i >= V0TR_BLOCKS.NE_INNER.iMin && i <= V0TR_BLOCKS.NE_INNER.iMax\n        && j >= V0TR_BLOCKS.NE_INNER.jMin && j <= V0TR_BLOCKS.NE_INNER.jMax) {\n        homes.push('NE_INNER');\n      }\n      if (i >= V0TR_BLOCKS.SE.iMin && j >= V0TR_BLOCKS.SE.jMin) homes.push('SE');\n      if (homes.length === 0) {\n        throw new Error('v0TR 셀이 어느 블록에도 없다: ' + cellKey(i, j));\n      }\n      for (const home of homes) box[home] += 1;\n    }\n    if (box.NW !== 16 || box.A !== 9 || box.NE_OUTER !== 36\n      || box.NE_INNER !== 36 || box.SE !== 9) {\n      throw new Error('v0TR 블록 분할이 16/9/36/36/9 가 아니다: ' + JSON.stringify(box));\n    }\n    // ⓖ 비대칭 15 = A 9 (L 반전) + SE 6 (R 반전) — **의도된 이중화**를 못 박는다.\n    //\n    // ⚠ **정정 (2026-08-18)**: 여기에는 «비대칭은 SE 6셀뿐 — A 블록이 없다는 사실을\n    // 회귀로 못 박는다» 가 있었다. 그건 레인이 규약을 어긴 게 아니라 **내 브리프가\n    // «보충 블록 신설 금지» 를 지시한 결과**였다 — 레인은 그대로 지켰고 부재를\n    // 정직하게 잠가 뒀다. 그러나 그 상태로는 v0TRY 가 성립하지 않는다(슬롯이 SE 를\n    // 삼키면 판별자 0). 운영자 지적으로 A 를 편입하며 이 회귀도 뒤집는다.\n    // A 는 «신설» 이 아니라 v0T 정본의 **행 참조 재사용**이라 금지 규약과도 맞는다.\n    const asym = V0TR_CELLS.filter(([, , T, L, R]) => !(T === L && L === R));\n    const asymA = asym.filter((row) => V0T_A_CELLS.includes(row));\n    const asymSe = asym.filter((row) => V0W_PHASE_CELLS.includes(row));\n    if (asym.length !== 15 || asymA.length !== 9 || asymSe.length !== 6) {\n      throw new Error('v0TR 비대칭이 A 9 + SE 6 이 아니다: '\n        + JSON.stringify({ total: asym.length, A: asymA.length, SE: asymSe.length }));\n    }\n    if (slotCellsFor(CELL_SURFACE_FINAL_V0TR, V0TR_N).length !== 0) {\n      throw new Error('v0TR 에 QR 슬롯이 생겼다 — 슬롯은 v0trq 쪽이다');\n    }\n  }\n\n  // ①-k v0TRQ 정본 — 77셀 (v0TR − 중앙 16 − A 9) · 슬롯 64 · 비대칭 6.\n  // v0TY 와 같은 규약: 정의가 곧 유도(슬롯 박스 필터)이므로 여기서 재는 것은\n  // ⓐ 필터가 정확히 중앙 16 + A 9 를 걷어냈는가 ⓑ 행 참조 유지 ⓒ 슬롯 규약이다.\n  //\n  // ⚠ A 블록 (4..6)×(3..5) 은 중앙 슬롯 상자 (0..7)² **안에 완전히 들어간다** —\n  // 즉 v0TRQ 에서는 A 가 QR 밑에 깔려 셀 수·비대칭이 A 편입 전과 **같다**.\n  // 방향은 SE 6 이 준다 (중앙이 QR 이므로 «안쪽이든 면 코너든 하나는 가려도 된다»\n  // 는 운영자 이중화 설계 그대로다). v0TRY 는 반대로 SE 를 잃고 A 가 남는다.\n  if (V0TRQ_CELLS.length !== 77) {\n    throw new Error('v0TRQ 정본이 77셀이 아니다: ' + V0TRQ_CELLS.length);\n  }\n  {\n    for (const row of V0TRQ_CELLS) {\n      if (!V0TR_CELLS.includes(row)) {\n        throw new Error('v0TRQ 에 v0TR 밖 행이 있다 — 필터 유도가 아니다');\n      }\n    }\n    const removed = V0TR_CELLS.filter((row) => !V0TRQ_CELLS.includes(row));\n    const expectedRemoved = [...V0T_CENTRE_CELLS, ...V0T_A_CELLS];\n    if (removed.length !== expectedRemoved.length\n      || removed.some((row, index) => row !== expectedRemoved[index])) {\n      throw new Error('v0TRQ 필터가 걷어낸 것이 v0T 중앙 16 + A 9 행이 아니다: '\n        + removed.length);\n    }\n    const slotKeys = new Set(slotCellsFor(CELL_SURFACE_FINAL_V0TRQ, V0TRQ_N)\n      .map((cell) => cellKey(cell.i, cell.j)));\n    if (slotKeys.size !== 64) {\n      throw new Error('v0TRQ 슬롯이 64셀이 아니다: ' + slotKeys.size);\n    }\n    if (!removed.every(([i, j]) => slotKeys.has(cellKey(i, j)))) {\n      throw new Error('v0TR 중앙 16셀이 v0TRQ 슬롯 안에 다 들어 있지 않다');\n    }\n    for (const [i, j] of V0TRQ_CELLS) {\n      if (i <= V0TRQ_BLOCKS.SLOT.iMax && j <= V0TRQ_BLOCKS.SLOT.jMax) {\n        throw new Error('v0TRQ 파인더 셀 (' + i + ',' + j + ') 이 중앙 QR 슬롯 안이다');\n      }\n    }\n    // 남은 방향 판별자 = SE 마커뿐 (v0TR 과 같은 6셀 — 슬롯이 삼킨 것은 대칭 중앙이다).\n    const asym = V0TRQ_CELLS.filter(([, , T, L, R]) => !(T === L && L === R));\n    if (asym.length !== 6 || asym.some((row) => !V0W_PHASE_CELLS.includes(row))) {\n      throw new Error('v0TRQ 의 비대칭이 SE 6셀만이 아니다: ' + asym.length);\n    }\n    // 슬롯 규약 — 크기는 v0WQ 참조 사슬, 자리는 seam 앵커 (0,0).\n    if (CENTER_QR_SLOT_CELLS_V0TRQ !== CENTER_QR_SLOT_CELLS_V0WQ) {\n      throw new Error('v0TRQ 슬롯 한 변이 v0WQ 와 다르다 — 같은 참조 사슬이어야 한다');\n    }\n    const trqOrigin = centerQrSlotOriginFor(CELL_SURFACE_FINAL_V0TRQ, V0TRQ_N);\n    if (trqOrigin.i !== 0 || trqOrigin.j !== 0) {\n      throw new Error('v0TRQ 슬롯이 Y-심(0,0) 에 앵커되지 않았다: '\n        + trqOrigin.i + ',' + trqOrigin.j);\n    }\n    if (centerQrSlotPlacementFor(CELL_SURFACE_FINAL_V0TRQ).flip !== false) {\n      throw new Error('v0TRQ 슬롯은 seam 앵커라 뒤집기가 없어야 한다');\n    }\n  }\n\n  // ①-l v0TRY 정본 — 93셀 (v0TR − SE 9) · 슬롯 64 · **비대칭 9 = A 블록**.\n  //\n  // v0TY 와 같은 규약: 정의가 곧 유도(슬롯 박스 필터)이므로 여기서 재는 것은\n  // ⓐ 필터가 정확히 SE 9 를 걷어냈는가 ⓑ 행 참조 유지 ⓒ 슬롯 규약 ⓓ **판별자 잔존**.\n  //\n  // ⚠ ⓓ 가 이 블록의 존재 이유다. A 블록 편입(`00936ce`) 전 v0TR 이었다면 여기서\n  // 비대칭 0 이 나와 터졌을 것이다 — «슬롯이 SE 를 삼키면 방향 판별자가 사라진다» 를\n  // 회귀가 아니라 **로드 시**에 잠근다. 나중에 누가 A 를 다시 빼면 여기서 즉사한다.\n  if (V0TRY_CELLS.length !== 93) {\n    throw new Error('v0TRY 정본이 93셀이 아니다: ' + V0TRY_CELLS.length);\n  }\n  {\n    for (const row of V0TRY_CELLS) {\n      if (!V0TR_CELLS.includes(row)) {\n        throw new Error('v0TRY 에 v0TR 밖 행이 있다 — 필터 유도가 아니다');\n      }\n    }\n    const removed = V0TR_CELLS.filter((row) => !V0TRY_CELLS.includes(row));\n    if (removed.length !== V0W_PHASE_CELLS.length\n      || removed.some((row, index) => row !== V0W_PHASE_CELLS[index])) {\n      throw new Error('v0TRY 필터가 걷어낸 것이 SE 9행(V0W_PHASE_CELLS)이 아니다: '\n        + removed.length);\n    }\n    const slotKeys = new Set(slotCellsFor(CELL_SURFACE_FINAL_V0TRY, V0TRY_N)\n      .map((cell) => cellKey(cell.i, cell.j)));\n    if (slotKeys.size !== 64) {\n      throw new Error('v0TRY 슬롯이 64셀이 아니다: ' + slotKeys.size);\n    }\n    if (!removed.every(([i, j]) => slotKeys.has(cellKey(i, j)))) {\n      throw new Error('v0TR SE 9셀이 v0TRY 슬롯 안에 다 들어 있지 않다');\n    }\n    for (const [i, j] of V0TRY_CELLS) {\n      if (i >= V0TRY_BLOCKS.SLOT.iMin && j >= V0TRY_BLOCKS.SLOT.jMin) {\n        throw new Error('v0TRY 파인더 셀 (' + i + ',' + j + ') 이 먼 코너 QR 슬롯 안이다');\n      }\n    }\n    // ⓓ 남은 방향 판별자 = A 블록 9셀뿐. **0 이면 이 파생 자체가 성립하지 않는다.**\n    const asym = V0TRY_CELLS.filter(([, , T, L, R]) => !(T === L && L === R));\n    if (asym.length !== 9 || asym.some((row) => !V0T_A_CELLS.includes(row))) {\n      throw new Error('v0TRY 의 비대칭이 A 블록 9셀만이 아니다: ' + asym.length);\n    }\n    // 슬롯 규약 — 크기·앵커·뒤집기 **전부 v0TY 재사용** (새 상수 신설 0).\n    if (centerQrSlotCellsFor(CELL_SURFACE_FINAL_V0TRY)\n      !== centerQrSlotCellsFor(CELL_SURFACE_FINAL_V0TY)) {\n      throw new Error('v0TRY 슬롯 한 변이 v0TY 와 다르다 — 같은 값을 재사용해야 한다');\n    }\n    const tryOrigin = centerQrSlotOriginFor(CELL_SURFACE_FINAL_V0TRY, V0TRY_N);\n    if (tryOrigin.i !== V0TRY_SLOT_MIN || tryOrigin.i !== tryOrigin.j) {\n      throw new Error('v0TRY 슬롯이 먼 코너 (13,13) 에 앵커되지 않았다: '\n        + tryOrigin.i + ',' + tryOrigin.j);\n    }\n    const tryPlacement = centerQrSlotPlacementFor(CELL_SURFACE_FINAL_V0TRY);\n    const tyPlacement = centerQrSlotPlacementFor(CELL_SURFACE_FINAL_V0TY);\n    if (tryPlacement.anchor !== tyPlacement.anchor || tryPlacement.flip !== tyPlacement.flip) {\n      throw new Error('v0TRY 슬롯 배치 규약이 v0TY 와 다르다 — 재사용이어야 한다');\n    }\n    // 코어 반경 불변 — 슬롯은 SE 쪽이라 NE 바깥 사각이 한 셀도 안 줄어야 한다.\n    const outerBefore = V0TR_CELLS.filter(([i, j]) => i <= V0TR_BLOCKS.NE_OUTER.iMax\n      && j >= V0TR_BLOCKS.NE_OUTER.jMin).length;\n    const outerAfter = V0TRY_CELLS.filter(([i, j]) => i <= V0TR_BLOCKS.NE_OUTER.iMax\n      && j >= V0TR_BLOCKS.NE_OUTER.jMin).length;\n    if (outerBefore !== outerAfter) {\n      throw new Error('v0TRY 슬롯이 NE 바깥 사각을 건드렸다 — 코어 반경이 갈린다: '\n        + outerBefore + ' → ' + outerAfter);\n    }\n  }\n\n  // ② formatIndex 쌍 불변식 + cube 축 기사용 슬롯 전수 대조 (겹치면 로드 시 throw).\n  if (CELL_SURFACE_FINAL_FORMAT_INDEX[3] !== CELL_SURFACE_FINAL_FORMAT_INDEX[2] + 2) {\n    throw new Error('신세대 셀 표면 3톤 formatIndex 는 2톤 + 2 이어야 한다');\n  }\n  {\n    const used = new Set(VERSIONS_Y.map((spec) => spec.formatIndex));\n    used.add(LEGACY_CS_INDEX_2T);\n    used.add(LEGACY_CS_INDEX_3T);\n    for (const draftId of DRAFT_LAYOUT_IDS) {\n      const table = DRAFT_LAYOUT_FORMAT_INDEX[draftId];\n      used.add(table[2]);\n      used.add(table[3]);\n    }\n    for (const index of [CELL_SURFACE_FINAL_FORMAT_INDEX[2], CELL_SURFACE_FINAL_FORMAT_INDEX[3]]) {\n      if (used.has(index)) {\n        throw new Error(\n          '신세대 셀 표면 formatIndex ' + index + ' 가 cube 축 기사용 슬롯과 겹친다: '\n          + [...used].sort((a, b) => a - b).join(','),\n        );\n      }\n      if (!Number.isInteger(index) || index < 0 || index > 15) {\n        throw new Error('formatIndex ' + index + ' 가 4bit 범위를 벗어난다');\n      }\n    }\n  }\n\n  // ④ **전 정본 mid 금지** — 어느 레이아웃 정의든 조용히 mid 를 얻으면 여기서 throw.\n  // (v0X 정규화 2026-08-16 로 레이아웃별 예외가 사라졌다. buildLocatorCells 도 같은\n  // 규칙이지만 그쪽은 인스턴스화된 rows 만 보므로, 여기서 원시 배열도 명시로 훑는다.\n  // v2r2 중앙은 V1R2_CELLS 필터 유도, v0xq 는 V0X_CELLS 유도라 중복이지만 —\n  // **이 표가 «전 정본» 의 목록이다.** 새 레이아웃이 여기 빠지면 규칙 밖으로 샌다.)\n  for (const [id, rows] of [\n    [CELL_SURFACE_FINAL_V0, V0_CELLS],\n    [CELL_SURFACE_FINAL_V1R2, V1R2_CELLS],\n    [CELL_SURFACE_FINAL_V0X, V0X_CELLS],\n    [CELL_SURFACE_FINAL_V0XQ, V0XQ_CELLS],\n    [CELL_SURFACE_FINAL_V0W, V0W_CELLS],\n    [CELL_SURFACE_FINAL_V0WQ, V0WQ_CELLS],\n    [CELL_SURFACE_FINAL_V0W2, V0W2_CELLS],\n    [CELL_SURFACE_FINAL_V0WY, V0WY_CELLS],\n    [CELL_SURFACE_FINAL_V0T, V0T_CELLS],\n    [CELL_SURFACE_FINAL_V0TY, V0TY_CELLS],\n    [CELL_SURFACE_FINAL_V0TR, V0TR_CELLS],\n    [CELL_SURFACE_FINAL_V0TRQ, V0TRQ_CELLS],\n    [CELL_SURFACE_FINAL_V0TRY, V0TRY_CELLS],\n    [CELL_SURFACE_FINAL_V2R2, V2R2_FAR_BASE_CELLS],\n    [CELL_SURFACE_FINAL_V2R2, V2R2_CENTER_CELLS],\n  ]) {\n    for (const [i, j, T, L, R] of rows) {\n      for (const tone of [T, L, R]) {\n        if (tone === 1) throw new Error(id + ' 정본에 mid 면이 생겼다: ' + i + ',' + j);\n      }\n    }\n  }\n\n  // ③ 다섯 인스턴스 회계 — 사용 심볼·잔여 셀이 확정 수치와 일치해야 한다.\n  // (v2r2 는 2026-08-16 중앙 개정 수치 — painted 74. 포맷 v2 전환으로 data −3 전파.)\n  //   v0@13   169 − 30 − 12 − 18 = 109 · S=36  · 잔여 1  (v1: 112 · 37 · 1)\n  //   v2r2@21 441 − 74 − 12 − 18 = 337 · S=112 · 잔여 1  (v1: 340 · 113 · 1)\n  //   v2r2@25 625 − 74 − 12 − 18 = 521 · S=173 · 잔여 2  (v1: 524 · 174 · 2)\n  //   v1r2@21 441 − 80 − 12 − 18 = 331 · S=110 · 잔여 1  (v1: 334 · 111 · 1)\n  //   v0x@21  441 − 65 − 12 − 18 = 346 · S=115 · 잔여 1  (v1: 349 · 116 · 1)\n  // 레거시 세대(포맷 v1 · 15셀)는 **판독 전용**이지만 회계는 같은 자로 잰다 —\n  // 폴백이 조용히 다른 좌표를 쓰면 여기서 잡는다.\n  const expected = {\n    'v0@13': { symbols: 36, residual: 1, locator: 30, legacy: { symbols: 37, residual: 1 } },\n    'v2r2@21': { symbols: 112, residual: 1, locator: 74, legacy: { symbols: 113, residual: 1 } },\n    'v2r2@25': { symbols: 173, residual: 2, locator: 74, legacy: { symbols: 174, residual: 2 } },\n    'v1r2@21': { symbols: 110, residual: 1, locator: 80, legacy: { symbols: 111, residual: 1 } },\n    'v0x@21': { symbols: 115, residual: 1, locator: 65, legacy: { symbols: 116, residual: 1 } },\n    //   v0xq@21 441 − 42 − 81(슬롯) − 12 − 18 = 288 · S=96 · 잔여 0 (v1: 291 · 97 · 0)\n    'v0xq@21': { symbols: 96, residual: 0, locator: 42, legacy: null },\n    //   v0w@21  441 − 70 − 12 − 18 = 341 · S=113 · 잔여 2 (레거시 없음 — 신설)\n    'v0w@21': { symbols: 113, residual: 2, locator: 70, legacy: null },\n    //   v0wq@21 441 − 45 − 64(슬롯 8²) − 12 − 18 = 302 · S=100 · 잔여 2 (레거시 없음)\n    'v0wq@21': { symbols: 100, residual: 2, locator: 45, legacy: null },\n    //   v0w2@21 441 − 97 − 12 − 18 = 314 · S=104 · 잔여 2 (레거시 없음 — 신설)\n    'v0w2@21': { symbols: 104, residual: 2, locator: 97, legacy: null },\n    //   v0wy@21 441 − 67 − 64(먼 코너 슬롯 8²) − 12 − 18 = 280 · S=93 · 잔여 1 (레거시 없음)\n    'v0wy@21': { symbols: 93, residual: 1, locator: 67, legacy: null },\n    //   v0t@21  441 − 104 − 12 − 18 = 307 · S=102 · 잔여 1 (레거시 없음 — 신설)\n    'v0t@21': { symbols: 102, residual: 1, locator: 104, legacy: null },\n    //   v0ty@21 441 − 95 − 64(먼 코너 슬롯 8²) − 12 − 18 = 252 · S=84 · 잔여 0 (레거시 없음)\n    'v0ty@21': { symbols: 84, residual: 0, locator: 95, legacy: null },\n    //   v0tr@21  441 − 102 − 12 − 18 = 309 · S=103 · 잔여 0 (레거시 없음 — 신설)\n    'v0tr@21': { symbols: 103, residual: 0, locator: 102, legacy: null },\n    //   v0trq@21 441 − 77 − 64(중앙 슬롯 8²) − 12 − 18 = 270 · S=90 · 잔여 0 (레거시 없음)\n    'v0trq@21': { symbols: 90, residual: 0, locator: 77, legacy: null },\n    //   v0try@21 441 − 93 − 64(먼 코너 슬롯 8²) − 12 − 18 = 254 · S=84 · **잔여 2**\n    //   (레거시 없음 — 신설). 잔여 2 는 v0w·v0wq·v0w2 와 같은 값이고 라인업에 전례가 있다.\n    'v0try@21': { symbols: 84, residual: 2, locator: 93, legacy: null },\n  };\n  for (const [key, want] of Object.entries(expected)) {\n    const [id, raw] = key.split('@');\n    const n = Number(raw);\n    const surface = cellSurfaceFinal(n, id);\n    if (surface.locatorCount !== want.locator) {\n      throw new Error(key + ' locator ' + surface.locatorCount + ' !== ' + want.locator);\n    }\n    if (surface.usedSymbols !== want.symbols || surface.residualCells !== want.residual) {\n      throw new Error(\n        key + ' 회계 불일치: S=' + surface.usedSymbols + '/' + want.symbols\n        + ' 잔여=' + surface.residualCells + '/' + want.residual,\n      );\n    }\n    const scan = dataCellsInScanOrderCellSurfaceFinal(n, id);\n    if (scan.length !== surface.declaredDataCells) {\n      throw new Error(key + ': data 선언과 scan 이 어긋난다');\n    }\n    if (want.legacy === null) {\n      // 레거시 세대가 없는 레이아웃 — «없는 조합» 으로 거부되는지까지 확인한다.\n      if (hasLegacyFormatWire(id)) {\n        throw new Error(key + ': legacy null 인데 레거시 목록에 들어 있다');\n      }\n      let rejected = false;\n      try {\n        cellSurfaceFinal(n, id, CELL_SURFACE_FINAL_FORMAT_WIRE_LEGACY);\n      } catch (error) {\n        rejected = error instanceof RangeError;\n      }\n      if (!rejected) throw new Error(key + ': 레거시 세대가 조용히 생겼다');\n      continue;\n    }\n    const legacy = cellSurfaceFinal(n, id, CELL_SURFACE_FINAL_FORMAT_WIRE_LEGACY);\n    if (legacy.formatCells.length !== 15) {\n      throw new Error(key + ' 레거시 포맷 셀이 15 가 아니다: ' + legacy.formatCells.length);\n    }\n    if (legacy.usedSymbols !== want.legacy.symbols\n      || legacy.residualCells !== want.legacy.residual) {\n      throw new Error(\n        key + ' 레거시 회계 불일치: S=' + legacy.usedSymbols + '/' + want.legacy.symbols\n        + ' 잔여=' + legacy.residualCells + '/' + want.legacy.residual,\n      );\n    }\n    // 두 세대는 파인더·reference 가 **같아야** 한다 — 달라지면 폴백이 다른 프레임을 읽는다.\n    if (legacy.locatorCount !== surface.locatorCount) {\n      throw new Error(key + ': 세대 간 파인더 셀 수가 다르다');\n    }\n    const refKey = (cells) => cells.map((cell) => cell.i + ',' + cell.j).join(' ');\n    if (refKey(legacy.referenceCells) !== refKey(surface.referenceCells)) {\n      throw new Error(key + ': 세대 간 reference 좌표가 다르다');\n    }\n  }\n  const legacyExpected = Object.values(expected).filter((want) => want.legacy !== null).length;\n  if (Object.keys(SURFACES).length !== Object.keys(expected).length\n    || Object.keys(SURFACES_LEGACY).length !== legacyExpected) {\n    throw new Error('최종 라인업 인스턴스 수가 회계 표와 다르다');\n  }\n\n  // ⑤ 인코더 정합 — (레이아웃 × ECC 레벨) 15조합 전부가 실제로 인코딩 가능해야 한다.\n  // 선언 dataBytes 를 base-211 청크 패커에 되물어 dataSymbols 와 정확히 맞는지 본다.\n  // (포맷 v2 전환에서 v0X@21 ECC-M 이 여기 걸렸고 packableBytesForSymbols 로 고쳤다.)\n  // 레거시 세대도 같이 훑는다 — 폴백 복호가 RS 파라미터를 스스로 유도하기 때문이다.\n  for (const key of Object.keys(SURFACES)) {\n    const [id, raw] = key.split('@');\n    const n = Number(raw);\n    for (const level of ['L', 'M', 'H']) {\n      for (const wire of CELL_SURFACE_FINAL_FORMAT_WIRES) {\n        if (wire === CELL_SURFACE_FINAL_FORMAT_WIRE_LEGACY && !hasLegacyFormatWire(id)) continue;\n        const capacity = capacityForCellSurfaceFinal(n, level, 2, id, wire);\n        const need = symbolCountForByteLength(capacity.dataBytes);\n        if (need !== capacity.dataSymbols) {\n          throw new Error(\n            key + ' ECC-' + level + ' (포맷 v' + wire + '): dataBytes ' + capacity.dataBytes\n            + ' 는 ' + need + ' 심볼을 요구하는데 예산은 ' + capacity.dataSymbols + ' 다',\n          );\n        }\n      }\n    }\n  }\n}\n"],
  ["tonemap", "// tonemap.js — Type Y 2톤(면당 2채널) 배정표 · 등급 iii 분류기 · 분리 계약\n// (SPEC §14, ADR 0003 v3.1 §4b D9 · U14 · U17)\n//\n// 2톤 메인 전환의 와이어 계약 원본. 3톤(순위 3! 배정)은 lehmer.js 소관 그대로이고,\n// 이 모듈은 2톤 전용(면당 밝음/어두움 2상태) 배정표 · 분류기 · 분리 하한만 다룬다.\n// sceneY.js(인코딩→색) · verifyY.js(관측→복호) 양쪽이 이 모듈 하나만 참조한다\n// (배정표 이중정의 금지 — D9 신규 와이어 계약).\n//\n// 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date/hypot/삼각함수 금지 —\n// 결정성 계약, AGENTS.md 공통 규약. Math.sqrt/Math.log/Math.exp 는 삼각함수가 아니라\n// 허용 대상이다).\n\n/**\n * D9 배정표 — digit(0..5) → (T,L,R) 비트, 이 순서 고정. 1=밝음, 0=어두움.\n * d<3 = 단독 밝음 면(그 면만 1) · d>=3 = 단독 어두움 면(그 면만 0, =d-3 의 보수) ·\n * 보수쌍 d<->d+3. 전부-밝음(1,1,1)·전부-어두움(0,0,0) 은 표에 없다 — 불법 트리플이다.\n * @type {ReadonlyArray<ReadonlyArray<number>>}\n */\nexport const TONE_PATTERNS = Object.freeze([\n  Object.freeze([1, 0, 0]), // d0 — T만 밝음\n  Object.freeze([0, 1, 0]), // d1 — L만 밝음\n  Object.freeze([0, 0, 1]), // d2 — R만 밝음\n  Object.freeze([0, 1, 1]), // d3 — T만 어두움 (d0 의 보수)\n  Object.freeze([1, 0, 1]), // d4 — L만 어두움 (d1 의 보수)\n  Object.freeze([1, 1, 0]), // d5 — R만 어두움 (d2 의 보수)\n]);\n\n/** 심볼 알파벳 크기 = 6 (lehmer.js RADIX 와 동일 채널, 여기서는 독립 상수로 둔다 —\n * tonemap.js 가 lehmer.js 를 참조하지 않는다: 2톤 배정표는 순열이 아니라 직접\n * 열거된 표이므로 3! 유도 경로가 필요 없다). */\nconst RADIX = TONE_PATTERNS.length;\n\n/** \"TLR 비트 문자열\" → digit 역방향 조회. 모듈 로드 시 1회 구성. */\nconst PATTERN_TO_DIGIT = new Map();\nTONE_PATTERNS.forEach((pattern, digit) => {\n  PATTERN_TO_DIGIT.set(pattern.join(''), digit);\n});\n\nfunction assertDigit(digit) {\n  if (!Number.isInteger(digit) || digit < 0 || digit >= RADIX) {\n    throw new RangeError(`digit 범위 위반: ${digit} (허용 0..${RADIX - 1})`);\n  }\n}\n\nfunction assertBit(bit, label) {\n  if (bit !== 0 && bit !== 1) {\n    throw new RangeError(`${label} 는 0 또는 1 이어야 한다: ${bit}`);\n  }\n}\n\n/**\n * digit → (T,L,R) 비트 객체(1=밝음). sceneY.js 가 face 문자열로 바로 인덱싱할 수\n * 있도록 배열이 아니라 객체로 노출한다.\n * @param {number} digit 0..5\n * @returns {{T:number, L:number, R:number}}\n */\nexport function digitToPattern(digit) {\n  assertDigit(digit);\n  const [t, l, r] = TONE_PATTERNS[digit];\n  return { T: t, L: l, R: r };\n}\n\n/**\n * (T,L,R) 비트 → digit. 전부-밝음(1,1,1)·전부-어두움(0,0,0) 은 표에 없는 불법\n * 트리플이므로 `null` 을 반환한다(throw 하지 않는다 — 디코더 정상 경로, 자기표식\n * 소거 후보로 다루는 것이 호출측(verifyY.js)의 몫이다, U18).\n * @param {number} bitsT 0|1\n * @param {number} bitsL 0|1\n * @param {number} bitsR 0|1\n * @returns {number|null}\n */\nexport function patternToDigit(bitsT, bitsL, bitsR) {\n  assertBit(bitsT, 'bitsT');\n  assertBit(bitsL, 'bitsL');\n  assertBit(bitsR, 'bitsR');\n  const found = PATTERN_TO_DIGIT.get(`${bitsT}${bitsL}${bitsR}`);\n  return found === undefined ? null : found;\n}\n\n/**\n * U14 — 면별 임계 θ_f 산출: **D2 필드 정규화 후 앵커 적합치**(obsLo, obsHi) 의\n * 로그 중점 √(obsLo·obsHi) (등급 iii). 모델 상수 임계((obsLo+obsHi)/2, 산술 중점)는\n * 규약상 금지 — 이 함수만이 θ_f 산출 경로다(ADR 0003 v3.1 D9).\n * @param {number} obsLo 어두운 앵커 적합치 (정규화 후, 양수)\n * @param {number} obsHi 밝은 앵커 적합치 (정규화 후, 양수)\n * @returns {number}\n */\nexport function thetaFromAnchors(obsLo, obsHi) {\n  if (!(obsLo > 0) || !(obsHi > 0)) {\n    throw new RangeError(`앵커 적합치는 양수여야 한다: obsLo=${obsLo}, obsHi=${obsHi}`);\n  }\n  return Math.sqrt(obsLo * obsHi);\n}\n\n/**\n * 면별 관측값(정규화 후) vs 면별 임계 θ_f 로 트리플을 분류한다. face 값 >\n * theta_f 이면 그 면은 밝음(1). 불법 트리플(전부-밝음/전부-어두움)은\n * `{digit: null, illegal: true}` — mismatch 가 아니라 소거 후보다.\n * @param {{T:number, L:number, R:number}} values 면별 관측(정규화 후)\n * @param {{T:number, L:number, R:number}} theta 면별 θ_f\n * @returns {{digit: number|null, illegal: boolean}}\n */\nexport function classifyTriple(values, theta) {\n  const bitsT = values.T > theta.T ? 1 : 0;\n  const bitsL = values.L > theta.L ? 1 : 0;\n  const bitsR = values.R > theta.R ? 1 : 0;\n  const digit = patternToDigit(bitsT, bitsL, bitsR);\n  return { digit, illegal: digit === null };\n}\n\n/**\n * U17 — 2톤 분리 계약 하한. ρ = y_hi/y_lo >= RHO_MIN 이면 √ρ >= 3.162 로, 3톤\n * 실현 결정 마진(3.161, ADR 0003 §4b) 이상을 보장한다. slate 프리셋 실측 ρ ≈ 12.59\n * (levels[0] vs levels[2]) — 여유 있게 통과.\n */\nexport const RHO_MIN = 10;\n\n/**\n * 팔레트 2톤 분리 게이트(U17). ρ = yHi/yLo < RHO_MIN 이면 RangeError.\n * @param {number} yLo 어두운 레벨(levels[0]) 상대휘도\n * @param {number} yHi 밝은 레벨(levels[2]) 상대휘도\n */\nexport function assertToneSeparation(yLo, yHi) {\n  if (!(yLo > 0) || !(yHi > 0)) {\n    throw new RangeError(`분리 검증 대상은 양수여야 한다: yLo=${yLo}, yHi=${yHi}`);\n  }\n  const rho = yHi / yLo;\n  if (!(rho >= RHO_MIN)) {\n    throw new RangeError(\n      `2톤 분리비 ρ=${rho} 가 RHO_MIN(${RHO_MIN}) 미달이다 (U17: yLo=${yLo}, yHi=${yHi})`,\n    );\n  }\n}\n"],
  ["encodeY", "// encodeY.js — Type Y 인코더 파이프라인 통합 (SPEC §14, encode.js 대칭)\n//\n// UTF-8 페이로드 → 길이 헤더 1B 부착 → 0x00 패딩(고정 dataBytes까지) → base-211 심볼\n// 변환(27B↔28심볼, MSD-first) → RS(GF(211)) 패리티 → 코드워드 = 심볼 열 S개 →\n// 심볼 → 3 digit(MSD-first) → 마스크 가산 → scan order-Y 로 셀 배치 → 잔여 셀에\n// 필러(프리마스크 0 + 마스크) → digit 확정까지. 배정(digit → 3면 색 — 2톤 패턴 또는\n// 3톤 순위)·렌더는 다른 모듈 몫이다 — 여기서는 셀별 digit 확정까지만 한다.\n//\n// 이 모듈은 새 규약을 만들지 않는다 — capacityY.js/header.js/base211.js/rs211.js/\n// mask.js/formatinfo.js/layoutY.js/placementY.js 가 이미 확정한 조각을 파이프라인\n// 순서대로 조합만 한다. nsym 은 rs211.js 의 NSYM_TABLE(Type O)이 아니라 capacityY.js\n// 의 NSYM_TABLE_Y(Type Y, [U3] 잠정)를 쓴다 — capacityForY 가 이미 그 표를 참조한다.\n//\n// [v3.1 §4b 2톤 메인 전환] tones 옵션(기본 2)이 데이터 파이프라인 자체(마스크·\n// scan order·RS·심볼 변환)에는 영향을 주지 않는다 — capacityY.js 주석대로 용량 회계가\n// tones 무관이기 때문. tones 가 바꾸는 것은 딱 둘: ① 레퍼런스 조 digit 배정\n// (placementY.referenceCellsAll 이 tones 를 받는다) ② 포맷 정보 버전 인덱스\n// (versionSpecY 가 반환하는 spec.formatIndex — Y1/Y2=8/9, Y1T/Y2T=10/11).\n\nimport {\n  VERSIONS_Y, capacityForY, versionSpecY,\n  capacityForY2Window, windowedReferenceCellsY, windowedFormatCellsY, windowExcludedCellsY,\n  WINDOW_SUPPORTED_N, WINDOW_SUPPORTED_TONES,\n} from './capacityY.js';\nimport { frame, payloadByteLength } from './header.js';\nimport { bytesToSymbols, unpackSymbolsToCellDigits } from './base211.js';\nimport { rsEncode } from './rs211.js';\nimport { maskAdd, DEFAULT_MASK_INDEX, assertMaskIndex } from './mask.js';\nimport {\n  encodeReplicated, encodeReplicatedV2, FORMAT_CELLS_V2, ECC_LEVEL,\n} from './formatinfo.js';\nimport { dataCellsInScanOrder, fillerCells } from './layoutY.js';\nimport {\n  REFERENCE_GROUP_DIGITS_2T,\n  REFERENCE_GROUP_DIGITS_3T,\n  referenceCellsAll,\n  formatCells,\n} from './placementY.js';\nimport {\n  CELL_SURFACE_N,\n  CELL_SURFACE_PROFILE_ID,\n  CELL_SURFACE_VERSION,\n  assertCellSurfaceArm,\n  assertCellSurfaceTones,\n  capacityForCellSurfaceY,\n  dataCellsInScanOrderCellSurface,\n  fillerCellsCellSurface,\n  formatCellsCellSurface,\n  formatIndexCellSurface,\n  locatorCellsCellSurface,\n} from './cellSurfaceY.js';\nimport {\n  CELL_SURFACE_LAYOUT_VERSION,\n  assertCellSurfaceLayoutId,\n  assertCellSurfaceLayoutTones,\n  capacityForCellSurfaceLayout,\n  cellSurfaceLayout,\n  dataCellsInScanOrderCellSurfaceLayout,\n  fillerCellsCellSurfaceLayout,\n  formatIndexCellSurfaceLayout,\n  locatorCellsCellSurfaceLayout,\n} from './cellSurfaceLayouts.js';\nimport {\n  CELL_SURFACE_FINAL_NS,\n  CELL_SURFACE_FINAL_V0,\n  CELL_SURFACE_FINAL_V2R2,\n  assertCellSurfaceFinalTones,\n  capacityForCellSurfaceFinal,\n  cellSurfaceFinal,\n  dataCellsInScanOrderCellSurfaceFinal,\n  fillerCellsCellSurfaceFinal,\n  formatIndexCellSurfaceFinal,\n  isCellSurfaceFinalId,\n  locatorCellsCellSurfaceFinal,\n  slotCellsCellSurfaceFinal,\n  versionForFinalN,\n} from './cellSurfaceFinal.js';\n\nfunction cellKey(i, j) {\n  return `${i},${j}`;\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 면 내 QR 윈도 β (ADR 0003 D1 + [C7 Q7]) — Y2(n=25)·tones=2 전용, scan order\n// ─────────────────────────────────────────────────────────────────────────\n//\n// layoutY.js(dataCellsInScanOrder)는 윈도를 모른다(placementY.js 의 베이스\n// 레퍼런스/포맷 좌표만 안다) — 이 lane 은 layoutY.js/placementY.js 를 고치지\n// 않으므로(과제 지침, 파일 목록 밖 금지), 윈도 모드의 scan order 는 여기서 로컬로\n// 재구성한다: capacityY.js 의 윈도 재배치 좌표(reference/format) + 윈도 배제\n// 좌표(windowExcludedCellsY)를 역할표로 삼아 layoutY 와 동일한 래스터 규약(D5:\n// j 오름차순 바깥, i 오름차순 안쪽, role==='data' 만)을 그대로 적용한다.\n\nfunction windowRoleSetsY(n, tones) {\n  const reference = new Set(\n    windowedReferenceCellsY(n, tones).map((c) => cellKey(c.i, c.j)),\n  );\n  const format = new Set(windowedFormatCellsY(n).map((c) => cellKey(c.i, c.j)));\n  const excluded = new Set(windowExcludedCellsY(n).map((c) => cellKey(c.i, c.j)));\n  return { reference, format, excluded };\n}\n\n/** layoutY.dataCellsInScanOrder(n) 의 윈도 변형 — D5 래스터 규약 그대로, 윈도\n * 배제 좌표까지 함께 스킵한다(제외 좌표는 세 면 전부 데이터에서 뺀다, D1). */\nfunction windowedDataCellsInScanOrder(n, tones) {\n  const { reference, format, excluded } = windowRoleSetsY(n, tones);\n  const out = [];\n  for (let j = 0; j < n; j += 1) {\n    for (let i = 0; i < n; i += 1) {\n      const k = cellKey(i, j);\n      if (reference.has(k) || format.has(k) || excluded.has(k)) continue;\n      out.push({ i, j });\n    }\n  }\n  return out;\n}\n\n/** layoutY.fillerCells(n) 의 윈도 변형 — scan order 꼬리의 (C mod 3) 개(§5.6 준용). */\nfunction windowedFillerCellsY(n, tones) {\n  const scan = windowedDataCellsInScanOrder(n, tones);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n/**\n * 페이로드 바이트 길이가 들어가는 최소 VERSIONS_Y 항목을 고른다(같은 tones 안에서만\n * 후보로 삼는다). 마지막 항목도 초과하면 RangeError.\n * @param {string} text\n * @param {'L'|'M'|'H'} [eccLevel]\n * @param {2|3} [tones] 기본 2(2톤 메인).\n * @returns {{name:string, version:number, n:number, tones:2|3, formatIndex:number, overhead:number, symbolKey:string}} VERSIONS_Y 원소\n */\nexport function chooseVersionY(text, eccLevel = 'M', tones = 2) {\n  const byteLength = payloadByteLength(text);\n  const candidates = VERSIONS_Y.filter((v) => v.tones === tones);\n  if (candidates.length === 0) {\n    throw new RangeError(`지원하지 않는 tones: ${tones} (허용 ${[...new Set(VERSIONS_Y.map((v) => v.tones))].join(', ')})`);\n  }\n  for (const spec of candidates) {\n    const capacity = capacityForY(spec, eccLevel);\n    if (byteLength <= capacity.maxPayloadBytes) return spec;\n  }\n  const last = candidates[candidates.length - 1];\n  throw new RangeError(\n    `페이로드 ${byteLength} B 는 ${last.name}(ECC-${eccLevel}) 용량을 초과한다`,\n  );\n}\n\n/**\n * Type Y 인코더 파이프라인 진입점 (SPEC §14). version 을 생략하면\n * `chooseVersionY` 로 자동 선택한다.\n * @param {string} text UTF-8 페이로드\n * @param {{version?: number, eccLevel?: 'L'|'M'|'H', tones?: 2|3, window?: boolean, cellSurface?: boolean, cellSurfaceLayout?: 'v1r2'|'v2', locatorArm?: 'A'|'B'}} [options]\n *   tones 기본 2(2톤 메인, ADR 0003 v3.1 § n    fillerDigits[i] = maskAdd(0, c.i, c.j);\n  }\n\n  const eccLevelValue = ECC_LEVEL[eccLevel];\n  if (eccLevelValue === undefined || eccLevelValue === ECC_LEVEL.RESERVED) {\n    throw new RangeError('알 수 없는 ECC 레벨: ' + eccLevel);\n  }\n  const formatIndex = formatIndexCellSurface(tones);\n  const formatReplicas = encodeReplicated({\n    version: formatIndex,\n    eccLevel: eccLevelValue,\n  });\n  const formatDigits = formatReplicas.flat();\n\n  const cellDigits = new Map();\n  for (const c of locatorCellsCellSurface(arm)) {\n    cellDigits.set(cellKey(c.i, c.j), {\n      digit: null,\n      role: 'locator',\n      tones: { T: c.T, L: c.L, R: c.R },\n    });\n  }\n\n  const formatCoords = formatCellsCellSurface();\n  for (let i = 0; i < formatCoords.length; i += 1) {\n    const c = formatCoords[i];\n    cellDigits.set(cellKey(c.i, c.j), { digit: formatDigits[i], role: 'format' });\n  }\n\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    cellDigits.set(cellKey(c.i, c.j), { digit: dataDigits[i], role: 'data' });\n  }\n\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    cellDigits.set(cellKey(c.i, c.j), { digit: fillerDigits[i], role: 'filler' });\n  }\n\n  return {\n    version: CELL_SURFACE_VERSION,\n    n,\n    eccLevel,\n    tones,\n    formatIndex,\n    window: false,\n    cellSurface: true,\n    locatorProfile: CELL_SURFACE_PROFILE_ID,\n    locatorArm: arm,\n    capacity,\n    codewordSymbols,\n    dataDigits,\n    fillerDigits,\n    formatDigits,\n    cellDigits,\n  };\n}\n\nfunction encodeYCellSurfaceLayout(text, eccLevel, tones, layoutId) {\n  const id = assertCellSurfaceLayoutId(layoutId);\n  const layout = cellSurfaceLayout(id);\n  const capacity = capacityForCellSurfaceLayout(id, eccLevel, tones);\n  const n = layout.n;\n  const framed = frame(text, capacity.dataBytes);\n  const symbols = bytesToSymbols(framed);\n  if (symbols.length !== capacity.dataSymbols) {\n    throw new RangeError(\n      '심볼 개수 불일치: bytesToSymbols() ' + symbols.length\n      + ' !== capacity.dataSymbols ' + capacity.dataSymbols,\n    );\n  }\n\n  const codewordSymbols = rsEncode(symbols, capacity.nsym);\n  if (codewordSymbols.length !== capacity.usedSymbols) {\n    throw new RangeError(\n      '코드워드 심볼 개수 불일치: rsEncode() ' + codewordSymbols.length\n      + ' !== capacity.usedSymbols ' + capacity.usedSymbols,\n    );\n  }\n\n  const preMaskDataDigits = unpackSymbolsToCellDigits(codewordSymbols);\n  const scanCells = dataCellsInScanOrderCellSurfaceLayout(id);\n  if (scanCells.length !== capacity.dataCells) {\n    throw new RangeError(\n      'scan order-Y(cell-surface-layout) 셀 수 불일치: '\n      + scanCells.length + ' !== capacity.dataCells ' + capacity.dataCells,\n    );\n  }\n  const dataCellCoords = scanCells.slice(0, preMaskDataDigits.length);\n  const dataDigits = new Uint8Array(preMaskDataDigits.length);\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    dataDigits[i] = maskAdd(preMaskDataDigits[i], c.i, c.j);\n  }\n\n  const fillerCoords = fillerCellsCellSurfaceLayout(id);\n  if (fillerCoords.length !== capacity.residualCells) {\n    throw new RangeError(\n      '필러 셀 수 불일치: fillerCellsCellSurfaceLayout() '\n      + fillerCoords.length + ' !== capacity.residualCells ' + capacity.residualCells,\n    );\n  }\n  const fillerDigits = new Uint8Array(fillerCoords.length);\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    fillerDigits[i] = maskAdd(0, c.i, c.j);\n  }\n\n  const eccLevelValue = ECC_LEVEL[eccLevel];\n  if (eccLevelValue === undefined || eccLevelValue === ECC_LEVEL.RESERVED) {\n    throw new RangeError('알 수 없는 ECC 레벨: ' + eccLevel);\n  }\n  const formatIndex = formatIndexCellSurfaceLayout(id, tones);\n  const formatReplicas = encodeReplicated({\n    version: formatIndex,\n    eccLevel: eccLevelValue,\n  });\n  const formatDigits = formatReplicas.flat();\n\n  const c   ["centralBeaconWire", "/**\n * centralBeaconWire.js — 중앙 비컨의 **와이어 계약**(표식 + 기하)만 담는 얇은 모듈.\n * 의존은 finder-patterns 하나 — 기하 축소비를 3톤 큐브 패턴 표에서 유도하기 위해서다.\n *\n * 왜 분리했나: 매직의 소비자가 둘이다 — 인코더 쪽(centralBeacon.js, encodeY 체인을\n * 끈다)과 **스캐너 표시 경로**(sites/tlscan/scanner.js). 스캐너가 표식 2바이트를\n * 보려고 인코더 체인 전체를 번들에 끌고 오는 것은 잘못이라 표식만 여기로 내렸다.\n * centralBeacon.js 가 re-export 하므로 정본은 여전히 하나다.\n *\n * **「나는 페이로드가 아니다」 구분자** (계약 `central-v0-beacon.md` §4.1).\n *\n * 중앙 비컨은 **문법적으로 완전한 Type Y v0 코드**다. 그래서 스캐너가 중앙 블록만\n * 잡으면 그것을 독립 코드로 복호해 **성공하고**, 사용자에게 메타데이터 바이트를\n * 「내용」으로 보여준다 — 매직이 제어문자라 **빈 텍스트**로 보인다\n * (실기기 재현 2026-08-22, 운영자 보고). 실패가 조용한 종류다.\n *\n * 왜 제어문자인가 — 이 페이로드 경로는 `packBeaconText` 가 `String.fromCharCode` 로\n * 만들고 `unpackBeaconText` 가 **ASCII 7bit 밖을 거부**한다. 그래서 「UTF-8 선두로\n * 불가능한 바이트(0xF5\\~0xFF)」 같은 **구조적** 보장은 쓸 수 없다. 대신 생성기의\n * 페이로드 경로(URL · 텍스트 · Wi-Fi · vCard)가 만들어 낼 수 없는 제어문자를 쓴다.\n *\n * 매직만 믿지 않는다 — `unpackBeaconBytes` 의 복합 검사(길이 == 순 페이로드 ·\n * 예약 바이트 전부 0 · 계열/파인더 인덱스 유효 · 포맷 digit < 6)가 2차 방어다.\n * 매직 2바이트는 그 앞에 두는 **싼 1차 관문**이고, 예산에서 2 B 는 예약분으로 낸다.\n */\nimport {\n  THREE_TONE_CUBE_FINDER_PATTERN_ID, getFinderPattern,\n} from './finder-patterns.js';\n\nexport const BEACON_MAGIC = Object.freeze([0x01, 0x0f]); // SOH · SI\n\n/**\n * 비컨 기하 — 렌더러(scene.js)와 역산기(decoder/central-beacon-adapt.js)가 **같은\n * 값**을 물어야 하는 축소비. 2026-08-22 실기기 판정에서 «꽉 채움» 이 기각되고\n * (운영자: 기존 3톤 큐브처럼 크기 맞춰 거리를 띄워라) 3톤 큐브 규약으로 갔다:\n *\n *   비컨 지지 반지름 = 슬롯 지지 반지름 × (radiusCells / slotRadiusCells)\n *\n * 값 0.875 를 손으로 적지 않는다 — 큐브 패턴 표가 바뀌면 렌더와 역산이 **함께**\n * 따라가야 하고, 한쪽만 따라가면 포즈가 그 비율만큼 어긋난다. 실제로 렌더에만\n * 축소비가 들어가고 역산이 «꽉 채움» 전제로 남아 1.143배 어긋난 적이 있다\n * (같은 날, 레인 병행 작업 중 — 이 함수가 그 재발 방지다).\n */\nexport function centralBeaconGeometry() {\n  const cube = getFinderPattern(THREE_TONE_CUBE_FINDER_PATTERN_ID);\n  const shrink = cube.radiusCells / cube.slotRadiusCells;\n  if (!(shrink > 0 && shrink < 1)) {\n    throw new Error(`비컨 축소비가 (0,1) 밖이다: ${shrink} — 큐브 패턴 표를 확인하라`);\n  }\n  return Object.freeze({\n    shrink,\n    radiusCells: cube.radiusCells,\n    slotRadiusCells: cube.slotRadiusCells,\n  });\n}\n\n/**\n * 복호된 텍스트가 비컨인가 — 스캐너 표시 경로의 1차 관문. 여기서 true 면 그\n * 텍스트를 사용자에게 보여주면 안 된다 (내용이 아니라 바깥 코드의 신호다).\n */\nexport function textStartsWithBeaconMagic(text) {\n  if (typeof text !== 'string' || text.length < BEACON_MAGIC.length) return false;\n  for (let i = 0; i < BEACON_MAGIC.length; i += 1) {\n    if (text.charCodeAt(i) !== BEACON_MAGIC[i]) return false;\n  }\n  return true;\n}\n"],
  ["centralBeacon", "/**\n * centralBeacon.js — O/G 중앙 슬롯에 심는 Type Y v0 자기기술 비컨.\n *\n * 바깥 코드의 페이로드는 싣지 않는다. 스키마·계열·바깥 포맷 워드·파인더 정체·\n * 마커 플래그만 20 B 안에 넣고, 인코딩은 `encodeY` 를 그대로 부른다.\n *\n * 인덱스는 손 목록이 아니다. 계열 글자는 OAK 라인업·markerG 표·셀 표면 활성 id 에서,\n * 파인더 id 는 finder-selection + FINDER_PATTERNS + OAK + daehan 표에서,\n * ECC·포맷 워드는 formatinfo 정본에서 유도한다.\n *\n * ⚠ 이 모듈은 `src/beacon.js`(사용 이벤트 전송) 와 다른 축이다. 이름을 합치지 않는다.\n */\n\nimport { encodeY } from './encodeY.js';\nimport { BEACON_MAGIC } from './centralBeaconWire.js';\nimport {\n  DIGIT_COUNT, ECC_LEVEL,\n} from './formatinfo.js';\nimport {\n  CENTER_QR_FINDER_PATTERN_ID, CENTRAL_V0_FINDER_PATTERN_ID,\n} from './finder-selection.js';\nimport {\n  FINDER_PATTERNS, LEGACY_FINDER_PATTERN_ID,\n} from './finder-patterns.js';\nimport { OAK_LINEUP } from './finder-oak-lineup.js';\nimport { OAK_ALL_FINDER_PATTERNS } from './finder-oak-patterns.js';\nimport { DAEHAN_FINDER_PATTERN_IDS } from './finder-daehan.js';\nimport { MARKER_G_FORMAT_INDEX } from './markerG.js';\nimport {\n  CELL_SURFACE_FINAL_ACTIVE_IDS,\n  CELL_SURFACE_FINAL_V0,\n  CENTRAL_V0_SOURCE_N,\n  capacityForCellSurfaceFinal,\n  dataCellsInScanOrderCellSurfaceFinal,\n  versionForFinalN,\n} from './cellSurfaceFinal.js';\nimport { DIGITS_PER_SYMBOL, packCellDigitsToSymbols, symbolsToBytes } from './base211.js';\nimport { rsDecode } from './rs211.js';\nimport { maskSub } from './mask.js';\nimport { unframe } from './header.js';\n\n// 매직(«나는 페이로드가 아니다» 구분자)의 정본은 centralBeaconWire.js 다 — 스캐너\n// 표시 경로가 같은 표식을 봐야 하는데 이 모듈은 encodeY 체인을 끌어 스캐너 번들에\n// 넣기엔 무겁다. 여기서 re-export 하므로 기존 소비자의 import 는 그대로다.\nexport { BEACON_MAGIC, textStartsWithBeaconMagic } from './centralBeaconWire.js';\n\n/** 이 계약의 스키마. 자리가 남아 있어야 진화할 수 있다. */\nexport const BEACON_SCHEMA_VERSION = 0;\n\n/**\n * 비컨 데이터 톤 = 3 (Y0T). **운영자 지시 2026-08-22 — «컬러 3톤 + 입체감».**\n * 3톤이면 데이터 셀이 digitToRanks 순위 삼중으로 그려져 바깥 셀과 같은\n * 아이소메트릭 큐브 문법이 된다. 2톤(Y0)은 면당 명/암 이진이라 평평한 QR 처럼\n * 보였다. 용량은 동일하다 — 둘 다 셀당 base-6 dig ngth > 0) letters.add('Y');\n  return Object.freeze([...letters].sort());\n}\n\n/**\n * 파인더 id 표 — **와이어 순번 표** (비컨 바이트 OFF_FINDER 가 이 목록의 순번이다).\n *\n * ⚠ 동결 접두 (2026-08-23 정정): 발행된 비컨이 이 순번을 들고 있으므로 접두 구간은\n *   **재배열·삽입 금지, 추가는 말미에만** 이다. 신규 2종(oak-footprint ·\n *   oak-taegeuk-solo)을 유도 순서(OAK 표 스프레드)대로 daehan **앞에** 끼웠더니\n *   daehan 순번이 19/20/21 → 21/22/23 으로 밀려 기존 비컨이 오독될 뻔했다 —\n *   와이어 표는 유도가 아니라 표 주도다 (turnA·markerG 와 같은 규율).\n *\n * 렌더 전용 후보(oak-taegeuk-solo)도 정체 표에는 있다 — 비컨은 «이 코드가 어떤\n * 파인더를 쓰는가» 를 말하는 표이지 검출 라인업이 아니고, 생성기가 그릴 수 있는\n * 파인더는 전부 이름을 가져야 인코딩 시 finderIndex 가 던지지 않는다.\n */\nconst WIRE_FROZEN_FINDER_ORDER = Object.freeze([\n  // 0..2 슬롯 id → 3..15 FINDER_PATTERNS(13) → 16..18 OAK 초판 3 → 19..21 daehan.\n  // 이 배열은 2026-08-22 발행분까지의 finderIdentityIds() 실측 순서 그대로다.\n  'bullseye', 'center-qr', 'central-v0',\n  'pinwheel-3-0101-cw-missing-solid', 'gap-ring-01-2-1-solid',\n  'flower-7-0020-coprime-offset', 'swirl-2-200', 'pinwheel-c2-2-1100-cw',\n  'gap-ring-01-2-1-open', 'flower-7-1020-coprime-offset', 'swirl-c2-5-5-11-both',\n  'tristar-refined-h3', 'tree-refined-h3', 'cats-refined-h3',\n  'central-cube-3tone', 'cube-bullseye',\n  'oak-nitrogen-r2', 'oak-aspirin', 'oak-benzene',\n  'oak-daehan-k6', 'oak-daehan-k8', 'oak-daehan-k10',\n  // 22..23 — 2026-08-23 추가분 (W2 후보 2종). 출하와 동시에 동결.\n  'oak-footprint', 'oak-taegeuk-solo',\n]);\n\nexport function finderIdentityIds() {\n  const ids = [];\n  const seen = new Set();\n  for (const id of WIRE_FROZEN_FINDER_ORDER) addUnique(ids, seen, id);\n  // 신선도 자기검증 — 동결 표가 렌더 표들과 어긋나면(오탈자·누락) 즉시 죽는다.\n  // 살아있는 id 집합은 유도로 만들고, **순번만** 동결 표가 정한다.\n  const live = new Set([\n    LEGACY_FINDER_PATTERN_ID, CENTER_QR_FINDER_PATTERN_ID, CENTRAL_V0_FINDER_PATTERN_ID,\n    ...FINDER_PATTERNS.map((pattern) => pattern.id),\n    ...OAK_ALL_FINDER_PATTERNS.map((pattern) => pattern.id),\n    ...DAEHAN_FINDER_PATTERN_IDS,\n  ]);\n  for (const id of WIRE_FROZEN_FINDER_ORDER) {\n    if (!live.has(id)) {\n      throw new RangeError('와이어 동결 파인더가 렌더 표에 없다: ' + id\n        + ' — 드랍은 차단이지 삭제가 아니다. 표에서 지우지 말고 차단하라');\n    }\n  }\n  // 동결 구간 밖의 신규는 **말미에** 유도 순서로 잇는다 (2026-08-23: oak-footprint 22\n  // · oak-taegeuk-solo 23). 미래 추가도 여기로 흘러 순번이 안정된다.\n  for (const id of live) addUnique(ids, seen, id);\n  return Object.freeze(ids);\n}\n\nconst FAMILY_ALPHABET = familyAlphabet();\nconst FINDER_IDS = finderIdentityIds();\n\nexport function familyIndex(family) {\n  const index = FAMILY_ALPHABET.indexOf(family);\n  if (index < 0) {\n    throw new RangeError('알 수 없는 코드 계열: ' + family);\n  }\n  return index;\n}\n\nexport function familyFromIndex(index) {\n  if (!Number.isInteger(index) || index < 0 || index >= FAMILY_ALPHABET.length) {\n    throw new RangeError('계열 인덱스가 알파벳 밖이다: ' + index);\n  }\n  return FAMILY_ALPHABET[index];\n}\n\nexport function finderIndex(finderPatternId) {\n  const index = FINDER_IDS.indexOf(finderPatternId);\n  if (index < 0) {\n    throw new RangeError('알 수 없는 파인더 id: ' + finderPatternId);\n  }\n  return index;\n}\n\nexport function finderIdFromIndex(index) {\n  if (!Number.isInteger(index) || index < 0 || index >= FINDER_IDS.length) {\n    throw new RangeError('파인더 인덱스가 표 밖이다: ' + index);\n  }\n  return FINDER_IDS[index];\n}\n\nexport function familyLetterFromEncoded(encoded) {\n  if (encoded.cellSurfaceLayout\n    || (Number.isInteger(encoded.n) && !Number.isInteger(encoded.k))) {\n    return 'Y';\n  }\n  // ⚠ A 판별이 cornerMarker 보다 **먼저**다 (2026-08-22, A 개방). encodeA 도\n  // cornerMarker(A-CM)를 가질 수 있는데, 순서가 반대면 A-CM 비컨이 'G' 로 읽혀\n  // 검출기가 hex 를 시딩한다 — 실루엣은 삼각(tri)인데. A 의 표식은 turnA 필드의\n  // **존재**다 (encodeA 만 이 키를 돌려준다).\n  if (Object.prototype.hasOwnProperty.call(encoded, 'turnA')) return 'A';\n  if (encoded.cornerMarker) return 'G';\n  return 'O';\n}\n\nexport function packBeaconFlags(meta) {\n  let flags = 0;\n  for (let i = 0; i < BEACON_FLAG_NAMES.length; i += 1) {\n    if (meta[BEACON_FLAG_NAMES[i]]) flags |= 1 << i;\n  }\n  return flags;\n}\n\nexport function unpac   ["gf256", "// ⚠ @deprecated (2026-08-08, ADR 0001) — GF(2⁸) 경로는 사장됐다. 신규 코드는 gfp.js(GF 211)\n// 를 쓴다. 이 파일은 ADR 비교 기준·회귀 대조군으로만 유지한다. 수정 금지.\n/**\n * gf256.js — GF(2^8) 유한체 산술 + 다항식 연산\n *\n * SPEC §6: 오류 정정은 GF(2^8) 위의 Reed-Solomon 으로 한다. 이 모듈은 그\n * 아래층인 체(field) 산술만 담당하고, RS 부호 자체는 `rs.js` 가 담는다.\n *\n * 의존성 0. 브라우저에서 `<script type=\"module\">` 로 그대로 로드된다\n * (Node 전용 API 없음).\n *\n * ── 다항식 표현 규약 (중요) ─────────────────────────────────────────────\n * 이 모듈의 poly* 함수는 **big-endian(내림차순)** 계수 배열을 쓴다.\n *   poly[0] = 최고차항 계수, poly[poly.length - 1] = 상수항\n *   예) [1, 2, 3] = x^2 + 2x + 3\n * 이유: RS 코드워드가 \"메시지 ‖ 패리티\" 순서로 그대로 다항식 계수가 되어\n *       체계적 부호화에서 인덱스 변환이 필요 없다.\n * (rs.js 내부의 오류위치 다항식 Λ(x)·Ω(x) 만 little-endian 을 쓰며,\n *  그쪽 파일에 별도로 명시돼 있다.)\n */\n\n/**\n * 원시 다항식: x^8 + x^4 + x^3 + x^2 + 1 = 0x11D\n *\n * 선택 근거:\n * - QR Code(ISO/IEC 18004), DataMatrix, CCSDS 텔레메트리 등이 쓰는 사실상의\n *   관례값이라 외부 레퍼런스·테스트 벡터·교차검증 자료가 가장 풍부하다.\n *   본 프로젝트는 RS 를 직접 구현하므로(architecture.md §2) 검증 자료의\n *   양이 곧 위험 감소다.\n * - AES 의 0x11B 도 기약이지만 그 체에서 x(=2) 는 원시원소가 아니다(위수 51).\n *   RS 는 α^i 를 훑어야 하므로 \"α = 2 가 원시원소\"인 0x11D 가 편하다.\n *\n * 하드코딩이 아니다: 아래 `createField(poly, generator)` 로 다른 원시 다항식\n * 위의 체를 언제든 만들 수 있고, 원시원소가 아닌 생성원을 주면 예외로 막는다.\n */\nexport const PRIMITIVE_POLY = 0x11d;\n\n/** 생성원 α = 2 (= 다항식 x). 0x11D 에 대해 곱셈군 위수 255 의 원시원소다. */\nexport const GENERATOR = 0x02;\n\n/** 체 원소 개수 |GF(2^8)| = 256 */\nexport const FIELD_SIZE = 256;\n\n/** 곱셈군 위수 |GF(2^8)^*| = 255 */\nexport const MULTIPLICATIVE_ORDER = 255;\n\n/**\n * 테이블 없이 GF(2^8) 곱을 계산한다 (carry-less 곱 → 원시 다항식으로 축약).\n * log/antilog 테이블을 **생성**하는 데만 쓰인다. 런타임 곱은 테이블을 쓴다.\n */\nfunction clmulReduce(a, b, poly) {\n  let x = a & 0xff;\n  let y = b & 0xff;\n  let p = 0;\n  while (y !== 0) {\n    if ((y & 1) !== 0) p ^= x;\n    y >>= 1;\n    x <<= 1;\n  }\n  // 곱의 최대 차수는 7 + 7 = 14. 높은 항부터 poly 를 XOR 해 8비트로 내린다.\n  for (let bit = 14; bit >= 8; bit--) {\n    if ((p & (1 << bit)) !== 0) p ^= poly << (bit - 8);\n  }\n  return p     return EXP[LOG[aa] + LOG[bb]];\n  };\n\n  const div = (a, b) => {\n    const aa = a & 0xff;\n    const bb = b & 0xff;\n    if (bb === 0) throw new RangeError('GF(2^8) 0 으로 나눌 수 없다');\n    if (aa === 0) return 0;\n    // + 255 로 음수 색인을 피한다. 최대 254 + 255 = 509 < EXP.length.\n    return EXP[LOG[aa] + MULTIPLICATIVE_ORDER - LOG[bb]];\n  };\n\n  const inverse = (a) => {\n    const aa = a & 0xff;\n    if (aa === 0) throw new RangeError('GF(2^8) 0 의 역원은 없다');\n    return EXP[MULTIPLICATIVE_ORDER - LOG[aa]];\n  };\n\n  /** 이산로그. log(0) 은 정의되지 않으므로 예외. */\n  const log = (a) => {\n    const aa = a & 0xff;\n    if (aa === 0) throw new RangeError('GF(2^8) log(0) 은 정의되지 않는다');\n    return LOG[aa];\n  };\n\n  /** α^n. n 은 음수·255 이상도 허용 (mod 255 로 감싼다). */\n  const alphaPow = (n) => {\n    if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n    const e = ((n % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n    return EXP[e];\n  };\n\n  /**\n   * 거듭제곱 a^n. n 은 음수 허용.\n   * 관례: 0^0 = 1 (빈 곱), 0^n (n>0) = 0, 0^n (n<0) 은 예외.\n   */\n  const pow = (a, n) => {\n    if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n    const aa = a & 0xff;\n    if (aa === 0) {\n      if (n === 0) return 1;\n      if (n < 0) throw new RangeError('GF(2^8) 0 의 음수 거듭제곱은 정의되지 않는다');\n      return 0;\n    }\n    const e = ((LOG[aa] * n) % MULTIPLICATIVE_ORDER + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n    return EXP[e];\n  };\n\n  // ── 다항식 연산 (big-endian: index 0 = 최고차) ────────────────────────\n\n  /** p(x) * scalar */\n  const polyScale = (p, scalar) => {\n    const out = new Uint8Array(p.length);\n    for (let i = 0; i < p.length; i++) out[i] = mul(p[i], scalar);\n    return out;\n  };\n\n  /** p(x) + q(x). 길이가 다르면 **상수항 기준(오른쪽)** 으로 정렬해 XOR. */\n  const polyAdd = (p, q) => {\n    const len = Math.max(p.length, q.length);\n    const out = new Uint8Array(len);\n    for (let i = 0; i < p.length; i++) out[i + len - p.length] ^= p[i] & 0xff;   ["rs", "// ⚠ @deprecated (2026-08-08, ADR 0001) — GF(2⁸) RS 경로는 사장됐다. 신규 코드는 rs211.js\n// 를 쓴다. 이 파일은 ADR 비교 기준·회귀 대조군으로만 유지한다. 수정 금지.\n/**\n * rs.js — Reed-Solomon 부호 over GF(2^8)\n *\n * SPEC §6: RS 는 **바이트 스트림 단계** 에 적용한다 (base-6 변환 *전*).\n * 즉 이 모듈의 입출력은 순수 바이트 배열이고, base-6 / 셀 배치는 모른다.\n *\n * 체계적(systematic) 부호: 코드워드 = 메시지 ‖ 패리티.\n * 생성 다항식 g(x) = ∏_{i=0}^{nsym-1} (x - α^(fcr+i)).\n * 표수 2 이므로 뺄셈 = 덧셈 = XOR.\n *\n * 복호는 신드롬 → Berlekamp-Massey → Chien 탐색 → Forney 의 표준 4단이며\n * t = ⌊nsym/2⌋ 개까지 정정한다.\n *\n * ── 실패 규약 ─────────────────────────────────────────────────────────\n * `rsDecode` 는 절대 던지지 않고 `{ ok: false, reason }` 을 돌려준다.\n * `rsDecodeMessage` 는 실패 시 `RSDecodeError` 를 던진다.\n * 둘 다 \"조용히 틀린 값\" 을 돌려주지 않는다 — 단, 오류가 t 개를 넘으면\n * 수신어가 **다른 유효 코드워드** 의 반경 t 안에 들어갈 수 있고 그때는\n * 어떤 RS 복호기도 원리적으로 구분할 수 없다(오정정, miscorrection).\n * 그 경우 `ok: true` 지만 값이 다르다. 이는 부호의 한계이지 버그가 아니며,\n * 상위 계층(SPEC §5.4 포맷 CRC 등)이 최종 방어선이다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다.\n */\n\nimport {\n  mul,\n  div,\n  inverse,\n  alphaPow,\n  polyMul,\n  polyDiv,\n  polyEval,\n  MULTIPLICATIVE_ORDER,\n} from './gf256.js';\n\n/** 코드워드 최대 길이 = 곱셈군 위수 (GF(2^8) RS 의 자연 블록 길이) */\nexport const MAX_CODEWORD_LEN = MULTIPLICATIVE_ORDER; // 255\n\n/** 기본 first consecutive root. g(x) = ∏(x - α^(fcr+i)), i = 0..nsym-1 */\nexport const DEFAULT_FCR = 0;\n\n/**\n * ECC 레벨 → 패리티 비율 (SPEC §6: L ~12% / M ~25% / H ~40%).\n * 비율의 **기준(basis)** 은 SPEC 에 명시돼 있지 않다 → `nsymForLevel` 의\n * `basis` 옵션으로 노출하고 기본값 근거를 거기에 적어 뒀다.\n */\nexport const ECC_LEVELS = Object.freeze({ L: 0.12, M: 0.25, H: 0.4 });\n\n/** SPEC §6: 기본 M */\nexport const DEFAULT_ECC_LEVEL = 'M';\n\n/** 복호 실패 예외. `reason` / `syndromes` 를 함께 싣는다. */\nexport class RSDecodeError extends Error {\n  constructor(message, details = {}) {\n    super(message);\n    this.name = 'RSDecodeError';\n    Object.assign(this, details);\n  }\n}\n\n// ── 입력 검증 ───────────────────────────────────────────────────────────\n\nfunction toBytes(input, label) {\n  if (i
