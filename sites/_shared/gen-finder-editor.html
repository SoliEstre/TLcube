  ["encodeA", "// encodeA.js — Type A 인코더 파이프라인 통합 (ADR 0005, encode.js 대칭)\n//\n// UTF-8 페이로드 → 길이 헤더 1B 부착 → 0x00 패딩(고정 dataBytes까지) → base-211\n// 심볼 변환(27B↔28심볼, MSD-first) → RS(GF(211)) 패리티 → 코드워드 = 심볼 열 S개\n// → 심볼 → 3 digit(MSD-first) → 마스크 가산 → scan order-A(T3) 로 셀 배치 →\n// 잔여 셀에 필러(프리마스크 0 + 마스크) → digit 확정까지. 배정(digit → (T,L,R)\n// rank)·렌더는 다른 모듈 몫이다 — 여기서는 셀별 digit 확정까지만 한다.\n//\n// 이 모듈은 새 규약을 만들지 않는다 — capacityA.js/header.js/base211.js/rs211.js/\n// mask.js/formatinfo.js/layoutA.js/placementA.js/placement.js(육각부 무수정 재사용)\n// 가 이미 확정한 조각을 파이프라인 순서대로 조합만 한다.\n//\n// [D6 centerQr] formatIndex 는 VERSIONS_A 의 12(A1)/13(A2)에서 centerQr=true 면\n// +2 오프셋(14=A1Q·15=A2Q) — 중앙 QR 파인더 변형(ADR 0004 §1-3 규약 승계, D7).\n// 오버헤드·용량 수치는 centerQr 무관 동일하다(19셀 슬롯 기하 동일, D5 근거).\n\nimport { VERSIONS_A, VERSIONS_A_DAEHAN, capacityForA, capacityForADaehan, versionSpecA } from './capacityA.js';\nimport { turnASpec } from './turnA.js';\nimport { markerGSpec } from './markerG.js';\nimport { frame, payloadByteLength } from './header.js';\nimport { bytesToSymbols, unpackSymbolsToCellDigits } from './base211.js';\nimport { rsEncode } from './rs211.js';\nimport { maskAdd } from './mask.js';\nimport { encodeReplicated, ECC_LEVEL } from './formatinfo.js';\nimport { dataCellsInScanOrderA, fillerCellsA } from './layoutA.js';\nimport { centralSlotCells } from './layout.js';\nimport { daehanReservedCells } from './finder-daehan.js';\nimport { anchorCells, referenceCellsAll, formatCells, REFERENCE_DIGIT } from './placement.js';\nimport { vertexAnchors, patchReferenceCells } from './placementA.js';\nimport {\n  VERSIONS_ACM,\n  capacityForAMarker,\n  markerCellsA,\n  h2oTonesByKeyA,\n  patchReferenceCellsAMarker,\n  dataCellsInScanOrderAMarker,\n  fillerCellsAMarker,\n} from './markerA.js';\nimport { no2SeatMarkerCellsA, no2SeatAnchorCellsA, NO2_NAME } from './finder-NO2.js';\n\n/**\n * 레이아웃 공급자 — 레거시 A 와 A-CM(코너 마커)의 차이를 여기 한 곳에 모은다.\n * 파이프라인(헤더·base211·RS·마스크·포맷 정보)은 두 경로가 완전히 같다.\n * encode.js(Type O)의 `layoutProviderFor` 와 같은 구조다.\n *\n * `turnA` 는 **자리의 기본 심볼**만 가른다 (A-CM = H2O · V-CM = NO2). 회계\n * (versions·capacity·scan·filler·patchReference)는 두 자리가 완전히 같다 —\n * V-CM 은 A-CM 의 턴A 사상이고, NO2 의 마커 6셀은 A-CM 마커 21셀의 부분집합이다.\n */\nfunction layoutProviderForA(cornerMarker, daehanFinder = false, turnA = false) {\n  if (daehanFinder) {\n    // daehan (2026-08-19) — 육각 코어는 Type O 와 좌표가 같고, 예약 셀은 패치에\n    // 0개다 (실측). 그래서 layoutA 의 선택 인자로 넘기면 패치 꼬리는 그대로다.\n    return {\n      versions: VERSIONS_A_DAEHAN,\n      capacity: capacityForADaehan,\n      scan: (k) => dataCellsInScanOrderA(k, daehanReservedCells(k)),\n      filler: (k) => fillerCellsA(k, daehanReservedCells(k)),\n      patchReference: patchReferenceCells,\n      marker: () => [],\n    };\n  }\n  if (!cornerMarker) {\n    return {\n      versions: VERSIONS_A,\n      capacity: capacityForA,\n      scan: dataCellsInScanOrderA,\n      filler: fillerCellsA,\n      patchReference: patchReferenceCells,\n      marker: () => [],\n    };\n  }\n  return {\n    versions: VERSIONS_ACM,\n    capacity: capacityForAMarker,\n    scan: dataCellsInScanOrderAMarker,\n    filler: fillerCellsAMarker,\n    patchReference: patchReferenceCellsAMarker,\n    // 정본 H2O 톤을 싣는다 — Type A **자리 예약**에 들어가는 기본 파인더의 심볼이다\n    // (비-순열 조합이라 데이터 셀이 만들 수 없는 무늬가 나온다). 2026-08-20 에 한 번\n    // 껐다가 2026-08-21 에 되살렸다.\n    //\n    // ⚠ 그때 껐던 이유는 톤 자체가 아니라 **팔레트**였다 — 마커를 파인더 축\n    // (bullseyeLight = 순백)으로 그려서 안전영역·흰 지면과 구별이 안 돼 실루엣에\n    // 구멍이 났다. 고칠 곳은 `scene.js` 의 색이었고, 끄면서 **심볼까지 같이 지웠다.**\n    // 지금은 색은 데이터와 같고(palette.levels) 무늬만 다르다 — 운영자 지시 그대로다.\n    // H2O 는 확장 영역 파인더이지 중앙 3톤 큐브가 아니다. A-CM 이 H2O 의 중앙\n    // 파인더를 버린 것이 아니다.\n    //\n    // ── V-CM (턴A 자리) 은 **NO2** 를 싣는다 (운영자 작화 2026-08-24 · 편입 같은 날).\n    // 자리 21셀의 좌표·digit·역할은 A-CM 과 바이트 동일이고 (회계 불변), NO2 가\n    // 덮는 마커 6셀만 tones 를 든다. 나머지 15셀은 **digit-only** — 정본에 그 자리의\n    // 톤이 없어서다. 없는 값을 H2O 에서 빌려 오면 «한 자리에 심볼 두 개» 가 된다.\n    //\n    // ⚠ 이 전환은 검출을 **살렸다**: H2O 21셀 톤을 V-CM 에 그대로 싣던 종전 경로는\n    // V0CM(k=6)이 전 해상도 no-anchors 였는데, NO2 로 바꾸자 ppu 10\\~32 중 8/9 에서\n    // 원문까지 돌아온다 (`test/turnA-roundtrip.test.js` V-CM 왕복이 값으로 잠근다).\n    marker: turnA\n      ? no2SeatMarkerCellsA\n      : (k) => markerCellsA(k, h2oTonesByKeyA(k)),\n  };\n}\n\nfunction cellKey(q, r) {\n  return `${q},${r}`;\n}\n\n/**\n * 페이로드 바이트 길이가 들어가는 최소 VERSIONS_A 항목을 고른다.\n * A2(ECC-eccLevel) 도 초과하면 RangeError.\n * @param {string} text\n * @param {'L'|'M'|'H'} [eccLevel]\n * @returns {{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}}\n */\nexport function chooseVersionA(text, eccLevel = 'M') {\n  const byteLength = payloadByteLength(text);\n  for (const spec of VERSIONS_A) {\n    const capacity = capacityForA(spec, eccLevel);\n    if (byteLength <= capacity.maxPayloadBytes) return spec;\n  }\n  const last = VERSIONS_A[VERSIONS_A.length - 1];\n  throw new RangeError(\n    `페이로드 ${byteLength} B 는 ${last.name}(ECC-${eccLevel}) 용량을 초과한다`,\n  );\n}\n\n/**\n * Type A 인코더 파이프라인 진입점. version 을 생략하면 `chooseVersionA` 로\n * 자동 선택한다.\n * @param {string} text UTF-8 페이로드\n * @param {{version?: number, eccLevel?: 'L'|'M'|'H', centerQr?: boolean, daehanFinder?: boolean,\n *          no2AnchorTones?: boolean}} [options]\n *   `no2AnchorTones` — V-CM 기본 심볼 NO2 의 꼭짓점 앵커 3셀 톤까지 싣는다 (opt-in,\n *   자리 필수). 기본 적재는 마커 6셀뿐이다 — 앵커 피복은 앵커 검출을 죽인다.\n * @returns {{\n *   version: number, k: number, eccLevel: 'L'|'M'|'H', centerQr: boolean, daehanFinder: boolean, no2AnchorTones: boolean, formatIndex: number,\n *   capacity: object,\n *   codewordSymbols: Uint8Array,\n *   dataDigits: Uint8Array,\n *   fillerDigits: Uint8Array,\n *   formatDigits: number[],\n *   cellDigits: Map<string, {digit:number, role:'anchor'|'reference'|'format'|'data'|'filler'}>,\n * }}\n */\nexport function encodeA(text, options = {}) {\n  // encode.js(Type O) 전례: version 명시 경로가 chooseVersionA(→ payloadByteLength\n  // 의 타입 검사)를 건너뛰면 TextEncoder 가 undefined → '' 로 조용히 강제 변환한다.\n  // 두 경로의 판정을 여기서 먼저 일치시킨다.\n  if (typeof text !== 'string') {\n    throw new TypeError(`페이로드는 문자열이어야 한다: ${typeof text}`);\n  }\n  const {\n    version, eccLevel = 'M', centerQr = false, centralV0 = false,\n    cornerMarker = false, turnA = false,\n    daehanFinder = false, no2AnchorTones = false,\n  } = options;\n  if (typeof turnA !== 'boolean') {\n    throw new TypeError(`turnA 는 boolean 이어야 한다: ${typeof turnA}`);\n  }\n  if (typeof daehanFinder !== 'boolean') {\n    throw new TypeError(`daehanFinder 는 boolean 이어야 한다: ${typeof daehanFinder}`);\n  }\n  // turnA × cornerMarker — **개설됐다** (V-CM, 2026-08-24 배타 개설 정형 3단):\n  //   ① 근거 실측 — 마커 21셀은 전부 패치 안(A-CM §4)이고 턴A 사상(배치 반전,\n  //      셀 정립)은 배치의 서로소성을 보존한다 (markerA ④ 자기검증 + 렌더 왕복 실측).\n  //   ② 표 명시 확장 — V 표 말미 V0CM/V1CM/V2CM (turnA.js, 잔여 3칸 정확 소진).\n  //   ③ 구 락(여기 있던 «배치 검증 미실시» 던짐)을 이 양성 경로로 전환.\n  // ⚠ V-CMQ(+centerQr)는 **보류** — (값,k) 잔여 0 (markerG 로드 자기검증이 잰다).\n  if (turnA && cornerMarker && centerQr) {\n    throw new RangeError('turnA + cornerMarker + centerQr(V-CMQ) 는 보류다 — 포맷 인덱스 잔여 칸 0 (turnA.js §V-CM 회계)');\n  }\n  if (turnA && daehanFinder) {\n    throw new RangeError('turnA 와 daehanFinder 를 동시에 켤 수 없다 — 배치 검증 미실시 조합이다');\n  }\n  // no2AnchorTones — V-CM 기본 심볼 NO2 의 **꼭짓점 앵커 3셀** 톤을 추가로 싣는다.\n  // 정본에는 그 3셀 톤이 있는데 **기본은 안 싣는다**: 앵커에 절대 톤을 실은 프레임은\n  // digit 기반 앵커 검출이 거의 못 읽는다 (실측 2026-08-24 — 페이로드 4 × 버전 3 ×\n  // ppu 2 = 24칸 중 2칸만 성공, 실패 20 이 no-anchors. 같은 격자에서 기본 적재는\n  // 24/24). H 가 tetrad A 를 덮어 같은 공백을 가졌던 것과 정확히 같은 축이라\n  // (`finder-H.js` §4 · `encode.js` markerTones) 같은 처방 — **opt-in** 으로 둔다.\n  // 기본값 전환은 검출기 배선(통합자 몫)이 선 다음이다. 공백 잠금 finder-NO2.test ⑥.\n  if (typeof no2AnchorTones !== 'boolean') {\n    throw new TypeError(`no2AnchorTones 는 boolean 이어야 한다: ${typeof no2AnchorTones}`);\n  }\n  if (no2AnchorTones && !(turnA && cornerMarker)) {\n    throw new RangeError(\n      'no2AnchorTones 는 ' + NO2_NAME + ' 의 자리(V-CM = turnA + cornerMarker) 없이 못 켠다',\n    );\n  }\n  if (typeof centerQr !== 'boolean') {\n    throw new TypeError(`centerQr 는 boolean 이어야 한다: ${typeof centerQr}`);\n  }\n  if (typeof cornerMarker !== 'boolean') {\n    throw new TypeError(`cornerMarker 는 boolean 이어야 한다: ${typeof cornerMarker}`);\n  }\n  // cornerMarker × centerQr — 배치 검증 후 개설 (C2a 2026-08-23, encode.js 와 동일\n  // 근거 · 와이어는 markerG CMQ 변형). test/markerG-centerqr.test.js 가 잠근다.\n  if (daehanFinder && centerQr) {\n    throw new RangeError('daehanFinder 와 centerQr 를 동시에 켤 수 없다 — 중앙 슬롯을 둘 다 먹는다');\n  }\n  if (daehanFinder && cornerMarker) {\n    throw new RangeError('daehanFinder 와 cornerMarker 를 동시에 켤 수 없다 — 배치 검증 미실시 조합이다');\n  }\n  // 중앙 v0 비컨 (2026-08-22 운영자 지시 «타입 OAK 모두») — A 의 육각 코어는 Type O\n  // 와 좌표까지 같아(2026-08-19 실측, daehan 편입 근거) 중앙 19셀 슬롯 규약이 그대로\n  // 성립한다. 회계도 O 와 같은 이유로 불변이다: 슬롯 셀은 애초에 어느 목록에도 없다.\n  if (typeof centralV0 !== 'boolean') {\n    throw new TypeError(`centralV0 는 boolean 이어야 한다: ${typeof centralV0}`);\n  }\n  if (centralV0 && centerQr) {\n    throw new RangeError('centralV0 와 centerQr 를 동시에 켤 수 없다 — 중앙 슬롯 점유자는 하나다');\n  }\n  if (centralV0 && daehanFinder) {\n    throw new RangeError('centralV0 와 daehanFinder 를 동시에 켤 수 없다 — 중앙 슬롯 점유자는 하나다');\n  }\n  // centralV0 × turnA — **개설** (2026-08-24, 운영자 아침 검수 3차). 막던 근거는\n  // «배치 검증 미실시» 였는데 턴A 기하가 «배치만 180° 회전·셀 정립» 으로 확정되며\n  // 해소됐다: 비컨 슬롯은 중앙(회전 불변 위치)이고 회계상 셀 밖이라 turn 이 배치를\n  // 건드릴 수 없다 (배치 검증 = 왕복 테스트 test/turnA-roundtrip.test.js ▽+비컨).\n  const provider = layoutProviderForA(cornerMarker, daehanFinder, turnA);\n\n  let spec;\n  if (version === undefined) {\n    spec = provider.versions.find((v) => payloadByteLength(text) <= provider.capacity(v, eccLevel).maxPayloadBytes);\n    if (!spec) {\n      const last = provider.versions[provider.versions.length - 1];\n      throw new RangeError(\n        `페이로드 ${payloadByteLength(text)} B 는 ${last.name}(ECC-${eccLevel}) 용량을 초과한다`,\n      );\n    }\n  } else {\n    spec = provider.versions.find((v) => v.version === version);\n    if (!spec) {\n      throw new RangeError(`알 수 없는 Type A 버전 또는 용량 초과: ${version}`);\n    }\n  }\n\n  const capacity = provider.capacity(spec, eccLevel);\n  const { k } = spec;\n\n  // 길이 헤더 + 0x00 패딩 (header.js) → base-211 심볼 (base211.js).\n  const framed = frame(text, capacity.dataBytes);\n  const symbols = bytesToSymbols(framed);\n  if (symbols.length !== capacity.dataSymbols) {\n    // 조용히 맞추지 않는다 — 파이프라인 자기검증(과제 지침 절대 규칙).\n    throw new RangeError(\n      `심볼 개수 불일치: bytesToSymbols() ${symbols.length} !== capacity.dataSymbols ${capacity.dataSymbols}`,\n    );\n  }\n\n  // RS(GF(211)) 패리티 부착 → 코드워드 = 데이터 심볼 ‖ 패리티, 길이 S(=usedSymbols).\n  const codewordSymbols = rsEncode(symbols, capacity.nsym);\n  if (codewordSymbols.length !== capacity.usedSymbols) {\n    throw new RangeError(\n      `코드워드 심볼 개수 불일치: rsEncode() ${codewordSymbols.length} !== capacity.usedSymbols ${capacity.usedSymbols}`,\n    );\n  }\n\n  // 심볼 → 3 digit(MSD-first, 프리마스크) → scan order-A 좌표에 마스크 가산.\n  //\n  // `dataCellsInScanOrderA(k)` 는 role === 'data' 인 셀 **전부**(= dataCells 개,\n  // capacity.dataCells)를 돌려준다 — 그중 앞 3S 개가 실제 심볼 3-digit 그룹이고\n  // 나머지(residualCells 개, = `fillerCellsA(k)` 와 정확히 같은 셀)가 필러다\n  // (layoutA.js `symbolCellGroupsA`/`fillerCellsA` 의 분할과 동일하게 슬라이스한다).\n  const preMaskDataDigits = unpackSymbolsToCellDigits(codewordSymbols); // 길이 3S\n  const scanCells = provider.scan(k);\n  if (scanCells.length !== capacity.dataCells) {\n    throw new RangeError(\n      `scan order-A 셀 수 불일치: dataCellsInScanOrderA() ${scanCells.length} !== capacity.dataCells ${capacity.dataCells}`,\n    );\n  }\n  const dataCellCoords = scanCells.slice(0, preMaskDataDigits.length);\n  const dataDigits = new Uint8Array(preMaskDataDigits.length);\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    dataDigits[i] = maskAdd(preMaskDataDigits[i], c.q, c.r);\n  }\n\n  // 잔여 셀 = 프리마스크 0 에 마스크 가산(§5.6 준용). scan order-A 의 꼬리와 동일 셀.\n  const fillerCoords = provider.filler(k);\n  if (fillerCoords.length !== capacity.residualCells) {\n    throw new RangeError(\n      `필러 셀 수 불일치: fillerCellsA() ${fillerCoords.length} !== capacity.residualCells ${capacity.residualCells}`,\n    );\n  }\n  const fillerDigits = new Uint8Array(fillerCoords.length);\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    fillerDigits[i] = maskAdd(0, c.q, c.r);\n  }\n\n  // 포맷 정보(§5.4 승계, D6 네임스페이스): formatIndex(12~15) = spec.formatIndex +\n  // centerQr(2) 오프셋 — 12=A1·13=A2·14=A1Q·15=A2Q. 이 인덱스는 파인더 종류\n  // (불스아이 vs 중앙 QR)·실루엣(삼각 vs 육각)의 **사후 검증** 축이다(ADR 0004\n  // \"인덱스=사후 검증\" 규약 승계, D6) — 인코더 쪽은 부착까지만 한다.\n  const eccLevelValue = ECC_LEVEL[eccLevel];\n  if (eccLevelValue === undefined || eccLevelValue === ECC_LEVEL.RESERVED) {\n    throw new RangeError(`알 수 없는 ECC 레벨: ${eccLevel}`);\n  }\n  /*\n   * formatIndex 산출 — 세 규약이 공존한다.\n   *\n   * ⓐ 정삼각 A (기본): `spec.formatIndex + centerQr*2` **산술 유도**.\n   *    이것이 **발행 규약**이다 (A0 1 · A0Q 3 · A1 12 · A1Q 14 · A2 13 · A2Q 15).\n   *    이미 돌아다니는 A 코드가 이 값으로 읽히므로 **한 자리도 못 바꾼다** —\n   *    `test/turnA-wire-regression.test.js` 가 6벡터를 고정한다.\n   *\n   * ⓑ 턴A (역삼각 옵션): **표 주도**(`src/turnA.js`). 산술이 원리적으로 불가능하다 —\n   *    A1=12 에 균일 오프셋 +4 를 주면 16 이라 4bit 를 넘친다. 그래서 표가 전부다.\n   *\n   * ⓒ 코너 마커 (내부 타입 G, A-CM): **표 주도**(`src/markerG.js`, 운영자 확정\n   *    2026-08-20). 레거시 인덱스를 그대로 실으면 디코더가 마커 회계(21셀 차이)를\n   *    와이어에서 구분할 수 없다 — 「코너 마커 코드가 스캔 불가」의 근본 원인.\n   *    centerQr 와는 위 배타 가드가 조합을 막으므로 G 표에 Q 변형은 없다.\n   *\n   * 세 규약이 충돌하지 않는 이유: formatIndex 는 **(값, k) 쌍으로** 유일하면 되고\n   *    (`decode.js` 의 typeO/typeA/typeY 별 해석 함수 + hex·tri 공유축 회계),\n   *    턴A 는 역삼각 실루엣이라 정삼각 A 와 기하로 먼저 갈린다. G 는 빈 (값, k)\n   *    칸만 쓴다 — `test/markerG.test.js` 의 코드-유도 충돌 테스트가 지킨다.\n   *    운영자 확정 — «별도 타입처럼 취급하되 UI 상에만 같은 타입» (2026-08-18 턴A,\n   *    2026-08-20 G 승계).\n   */\n  // ⚠ 중앙 v0 비컨은 formatIndex 에 손대지 않는다 — O 와 같은 결정이다 (와이어는\n  //   표시층 불변, 「어떤 중앙 점유자인가」의 사후 검증 축은 비컨 메타 자신이 담당).\n  // ⓑ′ V-CM (턴A + 코너 자리 예약): V 표 말미 행 — 회계·레이아웃은 A-CM 과 같고\n  //     (provider 가 cornerMarker 로 이미 갈랐다) 와이어 값만 V 표가 가른다.\n  const formatIndex = turnA\n    ? turnASpec(spec.version, { centerQr, cornerMarker }).formatIndex\n    : cornerMarker\n      ? markerGSpec('tri', spec.version, centerQr).formatIndex\n      : spec.formatIndex + (centerQr ? 2 : 0);\n  const formatReplicas = encodeReplicated({ version: formatIndex, eccLevel: eccLevelValue });\n  const formatDigits = formatReplicas.flat(); // 길이 15, formatCells(k) 순서와 정합\n\n  // 셀별 digit + role 맵 (불스아이 셀은 애초에 어느 목록에도 없으므로 자동 제외).\n  const cellDigits = new Map();\n\n  // 앵커 = 육각 코너 3셀(보조, placement.js 무수정) + 꼭짓점 3셀(주, D2) = 6.\n  const anchors = [...anchorCells(k), ...vertexAnchors(k)];\n  for (const c of anchors) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: c.digit, role: 'anchor' });\n  }\n\n  // NO2 앵커 톤 오버레이 (opt-in) — digit 은 그대로 두고 `tones` 만 얹는다.\n  // digit 은 와이어·알파벳 계약이고 tones 는 심볼 오버레이라 층이 다르다.\n  if (no2AnchorTones) {\n    for (const c of no2SeatAnchorCellsA(k)) {\n      const kk = cellKey(c.q, c.r);\n      const entry = cellDigits.get(kk);\n      if (!entry || entry.role !== 'anchor' || entry.digit !== c.digit) {\n        throw new Error(NO2_NAME + ' 앵커 톤 대상 ' + kk + ' 이 꼭짓점 앵커가 아니다');\n      }\n      cellDigits.set(kk, { ...entry, tones: c.tones });\n    }\n  }\n\n  // 레퍼런스 = 육각 2(k-2)셀 + 패치 레퍼런스(규칙 R, D4) — 전부 REFERENCE_DIGIT.\n  const references = [...referenceCellsAll(k), ...provider.patchReference(k)];\n  for (const c of references) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: REFERENCE_DIGIT, role: 'reference' });\n  }\n\n  // 코너 마커 21셀 (A-CM 에서만) — 고정 digit, 마스크 없음. 꼭짓점 앵커와 안 겹친다.\n  for (const c of provider.marker(k)) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: c.digit, tones: c.tones, role: 'marker' });\n  }\n\n  const formatCoords = formatCells(k); // 육각부 무수정 재사용(D7)\n  for (let i = 0; i < formatCoords.length; i += 1) {\n    const c = formatCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: formatDigits[i], role: 'format' });\n  }\n\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: dataDigits[i], role: 'data' });\n  }\n\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: fillerDigits[i], role: 'filler' });\n  }\n\n  // 중앙 v0: 슬롯 19셀이 payload 로 되살아나지 않았음을 인코더 경계에서 직접 단언\n  // (encode.js 의 O 경로와 같은 방어 — 좌표 정본은 layout.js 하나).\n  if (centralV0) {\n    for (const cell of centralSlotCells()) {\n      if (cellDigits.has(cellKey(cell.q, cell.r))) {\n        throw new Error(`centralV0 중앙 슬롯 셀이 데이터에 남았다: ${cellKey(cell.q, cell.r)}`);\n      }\n    }\n  }\n\n  return {\n    version: spec.version,\n    k,\n    eccLevel,\n    centerQr,\n    centralV0,\n    cornerMarker,\n    turnA,\n    daehanFinder,\n    no2AnchorTones,\n    formatIndex,\n    capacity,\n    codewordSymbols,\n    dataDigits,\n    fillerDigits,\n    formatDigits,\n    cellDigits,\n  };\n}\n"],
  ["luminance", "/**\n * luminance.js — 휘도 레벨 프리셋 (SPEC §4.4, §5.1, §7.2)\n *\n * SPEC §4.4 계약 요지:\n * - 면의 휘도값은 §7.2 샘플 원판(내접원 부분 영역) 안의 상대휘도 **median** 이다.\n *   면 평균이 아니다. 이 모듈의 프리셋은 면을 평면 단색으로 채우는 것을 전제하므로\n *   (렌더러 책임 — 그라디언트·텍스처 없음) 원판 median = 그 색 자체의 상대휘도와 같다.\n *   즉 여기서 정의하는 레벨 Y 값이 곧 §7.2 계약 통계다.\n * - 순위 간 최소 분리폭: sRGB 상대휘도 Y 기준 Δmin >= 0.12 (0..1). 절대값·색상 선택은\n *   자유(§9) — 계약은 median 기준 순서와 분리폭뿐이다.\n * - SPEC §5.1: 불스아이는 파인더 마커라 Δmin 계약과 무관. 최대 대비 0.0/1.0 고정.\n *\n * RGB 리터럴은 런타임 솔버가 아니라 스크래치 계산(node -e, repo 밖)으로 실측해\n * 요건을 만족시킨 뒤 상수로 박아 넣었다 (결정성 — M0 완료 기준). 유도 근거는\n * 각 리터럴 옆 주석에 남긴다.\n */\n\nimport { digitToRanks } from './lehmer.js';\n\n/** SPEC §4.4 계약: 순위 간 최소 분리폭 (sRGB 상대휘도 Y, 0..1). */\nexport const DELTA_MIN_CONTRACT = 0.12;\n\n/**\n * 프리셋 저자 품질 바 — SPEC 최소치(0.12)보다 여유를 둔 내부 기준. 기존\n * 'slate' 테스트가 이미 이 값을 관례로 썼다(>= 0.15) — 신규 프리셋도 동일 바를\n * 모듈 로드 시 자동 단언한다(수기 스크래치 검증에 의존하지 않는다).\n */\nexport const PRESET_DELTA_MIN = 0.15;\n\n/** SPEC §14 U17: 2톤 렌더용 최소 대비비 ρ = Y(levels[2]) / Y(levels[0]). */\nexport const RHO_MIN_CONTRACT = 10;\n\n/** 프리셋 배경과 각 레벨 사이 최소 분리 (Y, 0..1) — 기존 slate 관례를 일반화. */\nexport const PRESET_BG_SEPARATION_MIN = 0.05;\n\n/** SPEC §5.1: 불스아이 파인더 마커 — 최대 대비, Δmin 계약과 무관. */\nexport const BULLSEYE_DARK = Object.freeze({ r: 0, g: 0, b: 0 });\nexport const BULLSEYE_LIGHT = Object.freeze({ r: 255, g: 255, b: 255 });\n\n/**\n * 3레벨 셀 파인더의 **중간톤** (2026-08-18, OAK 편입).\n *\n * 왜 188 인가 — 디코더는 **선형 상대휘도**로 본다(`relativeLuminance`). 검출기의\n * 목표값이 0 · 0.5 · 1 이므로 중간톤은 «8비트의 절반»(128)이 아니라 **선형 0.5 인\n * 값**이어야 한다. 128 의 상대휘도는 0.2159 로 절반 근처도 아니다 — 감마를 잊으면\n * 중간톤이 어두운 쪽에 붙어 대비가 무너진다.\n *   · 188 → Y = 0.502886 (오차 2.9e-3, 8비트 격자에서 가능한 최소)\n *   · DARK(0) → Y = 0 · LIGHT(255) → Y = 1\n *\n * 위 두 상수와 같은 규약으로 **프리셋을 따르지 않는다** — 파인더는 검출 기구다.\n */\nexport const BULLSEYE_MID = Object.freeze({ r: 188, g: 188, b: 188 });\n\n/**\n * 중앙 3톤 큐브 파인더의 세 면 색 — **프리셋과 무관한 포맷 상수**다.\n *\n * 처음엔 데이터 레벨(`palette.levels[rank]`)을 그대로 썼다. 「데이터와 같은 알파벳을\n * 쓴다」가 설계 의도였지만 실촬영에서 그게 결함이 됐다(2026-08-12, 통제 실험 큐브 0/6 ·\n * 불스아이 5/6):\n *\n *   최상위 면이 levels[2] 라 밝은 배경과의 분리가 slate 0.230 · **mono 0.087** 뿐이다.\n *   자기 이웃 면(0.244)보다 배경(1.0)에 가까워서, 화면 반사·글레어가 끼면 그 면이\n *   배경 모델에 흡수된다. 그러면 큐브가 **2면 쐐기**가 되고 hull 의 대각이 안 모여\n *   (잔차 0.70 vs 임계 0.14) 실루엣 후보에서 탈락한다 — 실패 사진 5장에는 큐브 크기의\n *   연결요소가 아예 없었다.\n *\n * 그래서 휘도를 **범위 안쪽으로** 당겼다. 색조는 slate 계열을 유지해 인상은 보존한다.\n * 세 지표가 모두 좋아진다(상대휘도):\n *\n *   흰 배경 ↔ 최상위 면 여유 : 0.230 → 0.380\n *   검은 배경 ↔ 최하위 면 여유: 0.061 → 0.101\n *   면 간 최소 간격          : 0.182 → 0.198\n *\n * ⚠ 프리셋을 따라가면 안 되는 이유: 파인더는 **검출 기구**다. 프리셋마다 분리가 달라지면\n *   (mono 가 특히 나빴다) 같은 검출기가 프리셋에 따라 되고 안 되고 한다. 데이터 셀은\n *   프리셋을 따르고, 파인더는 따르지 않는다 — 불스아이가 이미 그 규약이다(위 두 상수).\n *\n * 순서는 rank 인덱스와 같다: [0] = 가장 어두움 · [1] = 중간 · [2] = 가장 밝음.\n */\n/**\n * 3톤 큐브 파인더의 **Y심(면 경계선)** 색. `FINDER_CUBE_TONES` 와 같은 이유로 프리셋을\n * 따르지 않는다 — 심도 검출 기구의 일부다.\n *\n * ⚠ 왜 순검정이 아닌가 (2026-08-20 실측). 종전에는 `palette.bullseyeDark`(순검정, Y=0)를\n * 썼는데, 전경 마스크가 **테두리 k-means + tolerance = max(0.018, 2.5·MAD)** 로 갈리고\n * 기본 프리셋 배경이 Y≈0.0053 이라 |0 − 0.0053| = 0.0053 이 허용오차 **안**에 들어갔다.\n * 즉 **심이 마스크에서 배경으로 분류됐다.** ppu 가 커지면 심 폭(0.15셀)이 3×3 close 로\n * 못 메울 만큼 넓어져 중앙 큐브가 **세 마름모로 갈라지고**, 육각 후보가 0개가 되어\n * `no-positive-hex-y-junction` 으로 죽는다 — 합성 ppu 24\\~30 전패가 그것이다.\n * (ppu 32 가 살던 것은 해상도 덕이 아니라 짧은 변이 1024 를 넘어 다운샘플 factor=2 로\n *  이 대역을 빠져나가기 때문이었다.)\n *\n * 이 값(Y=0.0261)은 두 제약을 **동시에** 만족하는 자리다:\n *   · 배경과의 차 0.0208 > 허용오차 0.018  → 마스크에서 전경으로 남는다\n *   · 가장 어두운 면(Y=0.1008)과의 차 0.0747 → 심이 그 면에 먹히지 않는다\n *\n * ⚠ **중간값이면 되는 게 아니다.** 후보 `#1a1f30`(Y 0.0141)은 배경과 0.0088 로 허용오차의\n * 절반에 그쳐 ppu 26 이상에서 그대로 죽었다. 허용오차는 **넘어야 하는 이산 문턱**이지\n * 밝힐수록 좋아지는 연속 축이 아니다. 이 상수를 만질 일이 생기면 그 문턱부터 다시 재라.\n *\n * ⚠ 불스아이 링은 `BULLSEYE_DARK`(순검정) 그대로다. 링은 교대 구조라 한 밴드가 배경에\n * 먹혀도 경계가 남는다 — 실제로 잘 검출되고 있고, 건드릴 근거가 없다.\n */\nexport const FINDER_CUBE_SEAM = Object.freeze({ r: 0x26, g: 0x2c, b: 0x42 });\n\nexport const FINDER_CUBE_TONES = Object.freeze([\n  Object.freeze({ r: 0x4a, g: 0x57, b: 0x89 }),\n  Object.freeze({ r: 0x79, g: 0x94, b: 0xd1 }),\n  Object.freeze({ r: 0xc8, g: 0xcf, b: 0xda }),\n]);\n\n/**\n * sRGB 8bit 채널 → 선형 채널. IEC 61966-2-1 (sRGB 표준 EOTF).\n * @param {number} v8 0..255 정수\n * @returns {number} 0..1\n */\n/**\n * 0..255 정수 입력에 대한 사전 계산 표.\n *\n * 정의역이 **정확히 256개**라 표가 실수 계산을 완전히 대체한다 — 근사가 아니라 같은 식을\n * 미리 돌려 담은 것이므로 **비트 단위로 동일**하다.\n *\n * 왜 필요한가: 복호는 픽셀마다 이 함수를 3번 부른다. 1440×1920 프레임이면 약 830만 번의\n * `Math.pow` 다. 실측 프로파일에서 이 함수 하나가 self 7.5% 를 먹었다(2026-08-11).\n */\nconst SRGB_TO_LINEAR = new Float64Array(256);\nfor (let v = 0; v < 256; v += 1) {\n  const c = v / 255;\n  SRGB_TO_LINEAR[v] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;\n}\n\nexport function srgbChannelToLinear(v8) {\n  // 표는 0..255 **정수**에만 쓴다. 렌더 경로(sceneY 의 게인 보정 등)가 소수를 넘길 수\n  // 있는데, 그때 반올림해서 표를 쓰면 값이 조용히 달라진다.\n  if (Number.isInteger(v8) && v8 >= 0 && v8 <= 255) return SRGB_TO_LINEAR[v8];\n  const c = v8 / 255;\n  return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;\n}\n\n/**\n * sRGB 8bit {r,g,b} → 상대휘도 Y (ITU-R BT.709 계수, 선형화 후 가중합).\n * SPEC §4.4 의 \"sRGB 상대휘도\" 정의.\n * @param {{r: number, g: number, b: number}} rgb\n * @returns {number} 0..1\n */\nexport function relativeLuminance(rgb) {\n  return (\n    0.2126 * srgbChannelToLinear(rgb.r) +\n    0.7152 * srgbChannelToLinear(rgb.g) +\n    0.0722 * srgbChannelToLinear(rgb.b)\n  );\n}\n\n/**\n * `relativeLuminance` 의 8비트 전용 진입점 — 채널을 **0..255 정수로 이미 아는**\n * 자리에서만 쓴다 (canvas RGBA 등).\n *\n * 같은 `SRGB_TO_LINEAR` 표와 같은 계수·같은 덧셈 순서를 쓰므로 정수 입력에 대해\n * `relativeLuminance({r,g,b})` 와 **비트 단위로 같은 값**이다. 차이는 채널마다\n * 하던 `Number.isInteger` 가드와 인자 객체가 없다는 것뿐이다 — 픽셀당 3회씩,\n * 1440×1920 이면 830만 번의 가드였다.\n */\nexport function relativeLuminance8(r8, g8, b8) {\n  return (\n    0.2126 * SRGB_TO_LINEAR[r8] +\n    0.7152 * SRGB_TO_LINEAR[g8] +\n    0.0722 * SRGB_TO_LINEAR[b8]\n  );\n}\n\n/**\n * slate 프리셋 — 단색조 슬레이트 블루. 파랑 채널 우세·저채도로 \"어두운 배경 위에\n * 뜬 아이소메트릭 큐브 필드\" 인상을 노린다. 최상위 레벨(rank 2)은 흰색 쪽으로\n * 탈채도해 Y 를 끌어올렸다 (파랑 우세 색만으로는 Y 0.72 이상이 물리적으로 불가 —\n * 청색 BT.709 계수가 0.0722 로 가장 작기 때문).\n *\n * 실측 Y (node -e 스크래치 계산, repo 밖):\n *   background {14,16,24}   → Y ≈ 0.0053\n *   levels[0]  {58,68,108}  → Y ≈ 0.0612   (background 와 분리 ≈ 0.0559 >= 0.05)\n *   levels[1]  {110,135,190}→ Y ≈ 0.2436   (levels[0] 과 분리 ≈ 0.1824 >= 0.15)\n *   levels[2]  {220,228,240}→ Y ≈ 0.7699   (levels[1] 과 분리 ≈ 0.5263 >= 0.15)\n * presetDeltaMin('slate') = min(0.1824, 0.5263) ≈ 0.1824 >= 0.15 (계약 0.12 + 여유).\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.7699/0.0612 ≈ 12.58 >= 10 (U17).\n */\nconst SLATE = Object.freeze({\n  name: 'slate',\n  label: '슬레이트 블루 (Slate Blue)',\n  background: Object.freeze({ r: 14, g: 16, b: 24 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 58, g: 68, b: 108 }), // rank 0 (어두움)\n    Object.freeze({ r: 110, g: 135, b: 190 }), // rank 1 (중간)\n    Object.freeze({ r: 220, g: 228, b: 240 }), // rank 2 (밝음)\n  ]),\n});\n\n/**\n * ember 프리셋 — 웜 앰버·다크 브라운. 노을/불빛 톤 인상. 실측 Y (node -e 스크래치,\n * repo 밖):\n *   background {18,11,7}    → Y ≈ 0.0038\n *   levels[0]  {108,52,16}  → Y ≈ 0.0568  (bg 분리 ≈ 0.0530 >= 0.05)\n *   levels[1]  {200,120,40} → Y ≈ 0.2587  (levels[0] 분리 ≈ 0.2018)\n *   levels[2]  {255,210,140}→ Y ≈ 0.6925  (levels[1] 분리 ≈ 0.4338)\n * presetDeltaMin('ember') = min(0.2018, 0.4338) ≈ 0.2018 >= 0.15.\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.6925/0.0568 ≈ 12.19 >= 10 (U17).\n */\nconst EMBER = Object.freeze({\n  name: 'ember',\n  label: '엠버 (Ember)',\n  background: Object.freeze({ r: 18, g: 11, b: 7 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 108, g: 52, b: 16 }), // rank 0 (어두움)\n    Object.freeze({ r: 200, g: 120, b: 40 }), // rank 1 (중간)\n    Object.freeze({ r: 255, g: 210, b: 140 }), // rank 2 (밝음)\n  ]),\n});\n\n/**\n * mono 프리셋 — 무채색 그레이. 인쇄 안전(단색 인쇄에서도 순위 판별 가능). 실측 Y\n * (node -e 스크래치, repo 밖):\n *   background {16,16,16}   → Y ≈ 0.0052\n *   levels[0]  {70,70,70}   → Y ≈ 0.0612  (bg 분리 ≈ 0.0561 >= 0.05)\n *   levels[1]  {150,150,150}→ Y ≈ 0.3050  (levels[0] 분리 ≈ 0.2437)\n *   levels[2]  {245,245,245}→ Y ≈ 0.9131  (levels[1] 분리 ≈ 0.6081)\n * presetDeltaMin('mono') = min(0.2437, 0.6081) ≈ 0.2437 >= 0.15.\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.9131/0.0612 ≈ 14.91 >= 10 (U17).\n */\nconst MONO = Object.freeze({\n  name: 'mono',\n  label: '모노 (Mono, 인쇄 안전)',\n  background: Object.freeze({ r: 16, g: 16, b: 16 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 70, g: 70, b: 70 }), // rank 0 (어두움)\n    Object.freeze({ r: 150, g: 150, b: 150 }), // rank 1 (중간)\n    Object.freeze({ r: 245, g: 245, b: 245 }), // rank 2 (밝음)\n  ]),\n});\n\nexport const PRESETS = Object.freeze({\n  slate: SLATE,\n  ember: EMBER,\n  mono: MONO,\n});\n\n/** 기본 프리셋 이름. */\nexport const DEFAULT_PRESET = 'slate';\n\n/**\n * 프리셋 조회.\n * @param {string} name\n * @returns {{name: string, label: string, background: {r,g,b}, levels: {r,g,b}[]}}\n */\nexport function getPreset(name) {\n  if (!Object.prototype.hasOwnProperty.call(PRESETS, name)) {\n    throw new RangeError(`등록되지 않은 프리셋: ${name} (허용: ${Object.keys(PRESETS).join(', ')})`);\n  }\n  return PRESETS[name];\n}\n\n/**\n * 프리셋의 레벨 3개를 실측 상대휘도로 변환. rank 0→2 순서(오름차순)를 유지한다.\n * @param {string} name\n * @returns {[number, number, number]}\n */\nexport function presetLuminances(name) {\n  const preset = getPreset(name);\n  return preset.levels.map((rgb) => relativeLuminance(rgb));\n}\n\n/**\n * 프리셋의 인접 순위 간 최소 분리폭 (SPEC §4.4 Δmin 계약 검증용).\n * @param {string} name\n * @returns {number}\n */\nexport function presetDeltaMin(name) {\n  const [y0, y1, y2] = presetLuminances(name);\n  return Math.min(y1 - y0, y2 - y1);\n}\n\n/**\n * 프리셋의 2톤 대비비 ρ = Y(levels[2]) / Y(levels[0]) (SPEC §14 U17 계약 검증용).\n * @param {string} name\n * @returns {number}\n */\nexport function presetRho(name) {\n  const [y0, , y2] = presetLuminances(name);\n  return y2 / y0;\n}\n\n/**\n * 프리셋 배경과 레벨들 사이 최소 분리 (Y, 0..1).\n * @param {string} name\n * @returns {number}\n */\nexport function presetBackgroundSeparation(name) {\n  const preset = getPreset(name);\n  const bgY = relativeLuminance(preset.background);\n  const ys = presetLuminances(name);\n  return Math.min(...ys.map((y) => y - bgY));\n}\n\n/**\n * 프리셋 계약 3종을 단언한다 (① 3톤 Δmin >= PRESET_DELTA_MIN ② 2톤 ρ >=\n * RHO_MIN_CONTRACT ③ 배경 분리 >= PRESET_BG_SEPARATION_MIN). 위반 시 던진다 —\n * 모듈 로드 시(아래) 전 프리셋에 대해 자동 실행되므로, 신규 프리셋을 추가하면서\n * 계약을 어기면 import 시점에 즉시 드러난다(수기 스크래치 검증에만 의존하지 않는다).\n * @param {string} name\n */\nexport function assertPresetContract(name) {\n  const deltaMin = presetDeltaMin(name);\n  if (!(deltaMin >= PRESET_DELTA_MIN)) {\n    throw new Error(`프리셋 '${name}': Δmin=${deltaMin} 가 PRESET_DELTA_MIN(${PRESET_DELTA_MIN}) 미만이다`);\n  }\n  const rho = presetRho(name);\n  if (!(rho >= RHO_MIN_CONTRACT)) {\n    throw new Error(`프리셋 '${name}': ρ=${rho} 가 RHO_MIN_CONTRACT(${RHO_MIN_CONTRACT}) 미만이다`);\n  }\n  const bgSep = presetBackgroundSeparation(name);\n  if (!(bgSep >= PRESET_BG_SEPARATION_MIN)) {\n    throw new Error(`프리셋 '${name}': 배경 분리=${bgSep} 가 PRESET_BG_SEPARATION_MIN(${PRESET_BG_SEPARATION_MIN}) 미만이다`);\n  }\n}\n\n// 모듈 로드 시 전 프리셋 자동 단언 — 등록된 프리셋이 계약을 어기면 import 시점에\n// 즉시 터진다(런타임 호출 전에 잡는다, sceneY.js의 DEFAULT_FACE_GAINS 자기단언과\n// 동일 패턴).\nfor (const presetName of Object.keys(PRESETS)) {\n  assertPresetContract(presetName);\n}\n\n/**\n * digit → 각 면의 실제 색상. digitToRanks(digit) 로 (T,L,R) 순위를 얻어\n * 프리셋의 levels[rank] 에 매핑한다.\n * @param {number} digit 0..5\n * @param {string} name 프리셋 이름\n * @returns {{T: {r,g,b}, L: {r,g,b}, R: {r,g,b}}}\n */\nexport function faceColors(digit, name) {\n  const preset = getPreset(name);\n  const ranks = digitToRanks(digit);\n  return {\n    T: preset.levels[ranks.T],\n    L: preset.levels[ranks.L],\n    R: preset.levels[ranks.R],\n  };\n}\n"],
  ["export-filename", "// export-filename.js — 다운로드 파일명 규약 (브라우저 의존 없음)\n//\n// 생성물이 여러 번 저장될 때 운영체제의 중복 파일명 확인창을 피하면서, 파일명 자체가\n// 실험 라벨이 되도록 한다. 렌더 바이트의 결정성 계약과는 별개로, 이 모듈은 사용자가\n// 저장하는 순간의 로컬 시각과 페이지 안의 순번을 소비한다.\n\nconst FORBIDDEN_FILENAME_CHARS = /[<>:\"/\\\\|?*\\u0000-\\u001f]+/g;\nconst NON_PORTABLE_FILENAME_CHARS = /[^A-Za-z0-9._-]+/g;\nconst WINDOWS_RESERVED_BASENAMES = new Set([\n  'CON', 'PRN', 'AUX', 'NUL',\n  'COM1', 'COM2', 'COM3', 'COM4', 'COM5', 'COM6', 'COM7', 'COM8', 'COM9',\n  'LPT1', 'LPT2', 'LPT3', 'LPT4', 'LPT5', 'LPT6', 'LPT7', 'LPT8', 'LPT9',\n]);\n\nfunction pad2(value) {\n  return String(value).padStart(2, '0');\n}\n\n/** 사용자의 로컬 시각을 파일 시스템 안전한 `YYYYMMDD_HHMMSS`로 만든다. */\nexport function formatExportTimestamp(date) {\n  if (!(date instanceof Date) || !Number.isFinite(date.getTime())) {\n    throw new TypeError('유효한 Date가 필요하다');\n  }\n  return String(date.getFullYear())\n    + pad2(date.getMonth() + 1)\n    + pad2(date.getDate())\n    + '_'\n    + pad2(date.getHours())\n    + pad2(date.getMinutes())\n    + pad2(date.getSeconds());\n}\n\n/**\n * Windows·macOS·Linux 어디에서도 안전하게 쓸 짧은 파일명 조각.\n * 파일 시스템마다 해석이 갈리는 공백·제어문자·예약명도 제거해 다운로드명을 이식 가능하게 한다.\n */\nexport function sanitizeExportFilenamePart(value, fallback = 'code') {\n  const cleaned = String(value === undefined || value === null ? '' : value)\n    .normalize('NFKD')\n    .replace(FORBIDDEN_FILENAME_CHARS, '-')\n    .replace(NON_PORTABLE_FILENAME_CHARS, '-')\n    .replace(/[-_.]+/g, '-')\n    .replace(/^-+|-+$/g, '');\n  const safe = cleaned || fallback;\n  return WINDOWS_RESERVED_BASENAMES.has(safe.toUpperCase()) ? `${safe}-file` : safe;\n}\n\nfunction safeExtension(extension) {\n  return sanitizeExportFilenamePart(String(extension || '').replace(/^\\.+/, ''), 'bin');\n}\n\n/**\n * 동일 초·동일 실험 라벨에서 이어지는 저장은 `_02`, `_03` …을 붙인다.\n * 확장자가 달라도 같은 stem은 순번을 공유해 PNG와 SVG를 연달아 눌러도 이름이 겹치지 않는다.\n */\nexport function createExportFilenameFactory(now = () => new Date()) {\n  if (typeof now !== 'function') throw new TypeError('now는 함수여야 한다');\n  const countsByStem = new Map();\n\n  return function nextExportFilename({ extension, type, version, finder } = {}) {\n    const timestamp = formatExportTimestamp(now());\n    const stem = [\n      'TLcube',\n      timestamp,\n      sanitizeExportFilenamePart(type, 'code'),\n      sanitizeExportFilenamePart(version, 'v'),\n      'finder-' + sanitizeExportFilenamePart(finder, 'default'),\n    ].join('_');\n    const count = (countsByStem.get(stem) || 0) + 1;\n    countsByStem.set(stem, count);\n    const ordinal = count === 1 ? '' : '_' + String(count).padStart(2, '0');\n    return `${stem}${ordinal}.${safeExtension(extension)}`;\n  };\n}\n"],
  ["finder-selection", "// finder-selection.js — Type O/A 중앙 파인더와 QR 위치의 양방향 상태 계약\n\nexport const CENTER_QR_FINDER_PATTERN_ID = 'center-qr';\nexport const CENTRAL_V0_FINDER_PATTERN_ID = 'central-v0';\nexport const DEFAULT_OUTER_QR_POSITION = 'TL';\n\nexport function isCentralV0FinderPatternId(id) {\n  return id === CENTRAL_V0_FINDER_PATTERN_ID;\n}\n\nconst profileFamily = (type) => type === 'Y' ? 'Y' : 'OA';\n\n/**\n * O/A는 중앙 QR을 기본 파인더로, Y는 종전의 바깥 QR을 기본으로 쓴다.\n *\n * 공용 qrPosition 하나만 두고 타입을 바꾸면 O/A의 `inner`가 Y의 윈도 β로 새거나,\n * 반대로 Y의 코너 선택이 O/A 기본값을 덮는다. 타입군별 스냅샷을 별도로 들고 전환할 때만\n * 공용 렌더 상태로 올린다. 스냅샷은 불변 객체처럼 교체하며 직접 수정하지 않는다.\n */\nexport function createFinderQrProfiles(defaultFinderPatternId) {\n  if (typeof defaultFinderPatternId !== 'string' || defaultFinderPatternId === '') {\n    throw new TypeError('기본 파인더 id가 필요하다');\n  }\n  return Object.freeze({\n    OA: Object.freeze({\n      qrPosition: 'inner',\n      finderPatternId: CENTER_QR_FINDER_PATTERN_ID,\n      previousFinderPatternId: defaultFinderPatternId,\n      previousOuterQrPosition: DEFAULT_OUTER_QR_POSITION,\n      qrFacePlacement: 'seam',\n    }),\n    Y: Object.freeze({\n      qrPosition: DEFAULT_OUTER_QR_POSITION,\n      finderPatternId: defaultFinderPatternId,\n      previousFinderPatternId: defaultFinderPatternId,\n      previousOuterQrPosition: DEFAULT_OUTER_QR_POSITION,\n      qrFacePlacement: 'seam',\n    }),\n  });\n}\n\nfunction finderQrSnapshot(state) {\n  return Object.freeze({\n    qrPosition: state.qrPosition,\n    finderPatternId: state.finderPatternId,\n    previousFinderPatternId: state.previousFinderPatternId,\n    previousOuterQrPosition: state.previousOuterQrPosition,\n    // QR 면 배치 (W2 C3) — Y 전용 축이지만 스냅샷은 타입군 공용 형태라 함께 담는다.\n    // O/A 는 이 값을 안 읽으므로 실어도 무해하고, Y 왕복에서 배치 선택이 보존된다.\n    qrFacePlacement: state.qrFacePlacement,\n  });\n}\n\n/** 타입을 바꾸면서 현재 타입군 선택을 저장하고 대상 타입군 선택을 복원한다. */\nexport function selectGeneratorType(state, type, defaultFinderPatternId) {\n  if (!['O', 'A', 'Y'].includes(type)) {\n    throw new RangeError('알 수 없는 생성기 타입: ' + type);\n  }\n  const defaults = createFinderQrProfiles(defaultFinderPatternId);\n  const sourceFamily = profileFamily(state.type);\n  const targetFamily = profileFamily(type);\n  const currentProfiles = state.finderQrProfiles || defaults;\n  const finderQrProfiles = Object.freeze({\n    ...currentProfiles,\n    [sourceFamily]: finderQrSnapshot(state),\n  });\n  const target = finderQrProfiles[targetFamily] || defaults[targetFamily];\n  return normalizeFinderQrState({\n    ...state,\n    ...target,\n    type,\n    finderQrProfiles,\n  }, type, defaultFinderPatternId);\n}\n\nfunction previousFinderOrDefault(state, defaultFinderPatternId) {\n  const previous = state.previousFinderPatternId;\n  return previous && previous !== CENTER_QR_FINDER_PATTERN_ID\n    && previous !== CENTRAL_V0_FINDER_PATTERN_ID\n    ? previous\n    : defaultFinderPatternId;\n}\n\n/**\n * O/A 에서만 중앙 QR ↔ 안쪽을 하나의 상태로 정규화한다.\n * Type Y 의 안쪽은 Y2 윈도이므로 파인더 상태를 절대 건드리지 않는다.\n */\nexport function normalizeFinderQrState(state, type, defaultFinderPatternId) {\n  const next = { ...state };\n  // 하위호환 (W2 C3): 구 'plane'(«면») 값은 «안쪽 + 코너측» 으로 정규화한다 —\n  // plane 카드는 (안쪽 여부) × (면 배치) 분해로 삭제됐다 (generator-state.js\n  // §qrFacePlacement). 생성기 상태는 저장되지 않으므로 이 매핑은 방어선이다 —\n  // 한 릴리스 뒤 제거 후보.\n  if (next.qrPosition === 'plane') {\n    next.qrPosition = 'inner';\n    next.qrFacePlacement = 'far';\n  }\n  if (next.previousOuterQrPosition === 'plane') {\n    next.previousOuterQrPosition = DEFAULT_OUTER_QR_POSITION;\n  }\n  // 하위호환 (W2 C4): 구 `cornerMarker: boolean` → 타입별 seat 이관 — 스키마에서\n  // 내린 필드가 어떤 경로로 들어와도 새 축(innerSeat/outerSeat)으로 옮기고 걷는다\n  // (plane 매핑과 같은 방어선 지위. Y 는 대상 밖 — 필드만 걷는다).\n  if ('cornerMarker' in next) {\n    if (next.cornerMarker === true) {\n      if (type === 'O') next.innerSeat = 'o-cm';\n      if (type === 'A') next.outerSeat = 'a-cm';\n    }\n    delete next.cornerMarker;\n  }\n  if (type === 'Y') return next;\n\n  // **의도적 개방 (2026-08-22 운영자 지시 «타입 OAK 모두»)**: 중앙 v0(비컨)는 이제\n  // Type A 에서도 유효하다 — A 의 육각 코어는 O 와 좌표까지 같아 슬롯 규약이 그대로\n  // 성립하고, encodeA 가 centralV0 회계·배타를 O 와 같은 규칙으로 든다. 예전의\n  // 「A 는 기본 파인더로 되돌린다」 리셋은 여기 있었다 — 되살리면 카드가 사라진다.\n\n  const inner = next.qrPosition === 'inner';\n  const centerQr = next.finderPatternId === CENTER_QR_FINDER_PATTERN_ID;\n  if (inner && !centerQr) {\n    next.previousFinderPatternId = next.finderPatternId;\n    next.finderPatternId = CENTER_QR_FINDER_PATTERN_ID;\n  } else if (!inner && centerQr) {\n    next.finderPatternId = previousFinderOrDefault(next, defaultFinderPatternId);\n  }\n  return next;\n}\n\n/**\n * 파인더/QR 전환을 하나의 커밋 경계로 묶는다.\n * 예약 렌더를 먼저 취소하고, 정규 상태를 반영한 뒤 렌더 콜백을 정확히 한 번 호출한다.\n */\nexport function commitFinderQrTransition(\n  state, nextState, type, defaultFinderPatternId, lifecycle,\n) {\n  const { cancelPendingRender, render } = lifecycle || {};\n  if (typeof cancelPendingRender !== 'function' || typeof render !== 'function') {\n    throw new TypeError('cancelPendingRender 와 render 콜백이 필요하다');\n  }\n\n  cancelPendingRender();\n  const committed = normalizeFinderQrState(nextState, type, defaultFinderPatternId);\n  Object.assign(state, committed);\n  render(state);\n  return state;\n}\n\n/** 파인더 카드 선택. 중앙 QR은 안쪽을 고르고, 다른 파인더는 직전 바깥 QR 위치를 복원한다. */\nexport function selectFinderPattern(state, finderPatternId, type, defaultFinderPatternId) {\n  const next = { ...state, finderPatternId };\n  if (finderPatternId !== CENTER_QR_FINDER_PATTERN_ID) {\n    next.previousFinderPatternId = finderPatternId;\n  }\n  if (type !== 'Y') {\n    if (finderPatternId === CENTER_QR_FINDER_PATTERN_ID) {\n      if (state.finderPatternId !== CENTER_QR_FINDER_PATTERN_ID) {\n        next.previousFinderPatternId = state.finderPatternId;\n      }\n      next.qrPosition = 'inner';\n    } else if (state.qrPosition === 'inner') {\n      next.qrPosition = state.previousOuterQrPosition || DEFAULT_OUTER_QR_POSITION;\n    }\n  }\n  return normalizeFinderQrState(next, type, defaultFinderPatternId);\n}\n\n/** QR 위치 선택. O/A 안쪽은 중앙 QR을 고르고, 바깥으로 나가면 직전 파인더를 복원한다. */\nexport function selectQrPosition(state, qrPosition, type, defaultFinderPatternId) {\n  const next = { ...state, qrPosition };\n  if (qrPosition !== 'inner') next.previousOuterQrPosition = qrPosition;\n  return normalizeFinderQrState(next, type, defaultFinderPatternId);\n}\n"],
  ["ygrid", "/**\n * ygrid.js — Type Y (단일 큐브) 면 격자 기하 (SPEC §14, docs/adr/0003_typeY_layout.md)\n *\n * 좌표 규약 (와이어 계약 — 여기서 못 박고 전 모듈이 따른다):\n *\n * - 큐브 실루엣 = pointy-top 정육각형. hexgrid.js 의 `CORNER_UNIT_OFFSETS` 를 그대로\n *   재사용한다(삼각함수 재계산 금지 — 닫힌 형태 상수라야 결정적이다).\n * - **Y-심**(세 면이 만나는 중심 꼭짓점) = 육각형 중심 = 이 모듈의 원점(layout 의\n *   `(originX, originY)`).\n * - 세 면은 hexgrid 코너 인덱스로 정의한다:\n *     T = [Y심, C5, C0, C1]   L = [Y심, C3, C4, C5]   R = [Y심, C1, C2, C3]\n * - 면 로컬 좌표 `(i, j)` 는 0-based, `n × n`. `(0,0)` 모듈이 Y-심 코너다.\n * - 축 규약: **i 축 = 시계방향(다음 라벨) 이웃 면과 공유하는 변 방향**,\n *   **j 축 = 반시계방향(이전 라벨) 이웃 면과 공유하는 변 방향**. 화면 기준:\n *     T: i → C1(우상)  j → C5(좌상)\n *     R: i → C3(하)    j → C1(우상)\n *     L: i → C5(좌상)  j → C3(하)\n *   즉 T→R→L→T 순서로 코너 인덱스가 +2(=120°) 씩 밀린다 — 이것이 아래 회전\n *   공변성 테스트의 근거다.\n * - 모듈 `(f, i, j)` = 변 길이 `m`(=`layout.size`) 의 60/120 마름모. 네 꼭짓점은\n *   `Y심 + (a·e_i + b·e_j)·m`, `(a,b) ∈ {(i,j), (i+1,j), (i+1,j+1), (i,j+1)}`.\n *   모듈 내접원 반지름은 Type O 면과 같은 형상이므로 `hexgrid.FACE_INRADIUS_COEFF`\n *   를 그대로 재사용한다: `(√3/4)·m`.\n * - 샘플 원판: §7.2 기본 규약 승계. 중심 = 마름모 중심(대각선 교점), 반지름 =\n *   `fraction · 내접원반지름`(기본 0.5, hexgrid 의 `SAMPLE_FRACTION_DEFAULT` 재사용).\n *\n * 이 모듈도 순수 기하만 다룬다 — node 전용 API 없음, 브라우저 ESM 로드 가능.\n */\n\nimport {\n  CORNER_UNIT_OFFSETS,\n  FACE_AREA_COEFF,\n  FACE_INRADIUS_COEFF,\n  HEX_AREA_COEFF,\n  SAMPLE_FRACTION_DEFAULT,\n  SAMPLE_FRACTION_OF_DEFAULT,\n  SAMPLE_FRACTION_MODES,\n  normalizeLayout,\n} from './hexgrid.js';\n\n/** Type Y 면 라벨. SPEC §14 순서(T, L, R)와 동일하게 고정한다. */\nexport const YFACES = Object.freeze(['T', 'L', 'R']);\n\n/**\n * 면 → (e_i, e_j) 단위 벡터. hexgrid 의 `CORNER_UNIT_OFFSETS` 원소를 그대로 참조한다\n * (그 배열의 각 원소는 이미 freeze 된 `{x, y}` 라 재사용해도 안전하다).\n *\n * 코너 인덱스 매핑 (SPEC §14 규범):\n *   T: e_i = C1(우상), e_j = C5(좌상)\n *   R: e_i = C3(하),   e_j = C1(우상)\n *   L: e_i = C5(좌상), e_j = C3(하)\n */\nconst FACE_BASIS = Object.freeze({\n  T: Object.freeze({ ei: CORNER_UNIT_OFFSETS[1], ej: CORNER_UNIT_OFFSETS[5] }),\n  R: Object.freeze({ ei: CORNER_UNIT_OFFSETS[3], ej: CORNER_UNIT_OFFSETS[1] }),\n  L: Object.freeze({ ei: CORNER_UNIT_OFFSETS[5], ej: CORNER_UNIT_OFFSETS[3] }),\n});\n\nfunction assertFace(face) {\n  if (!Object.prototype.hasOwnProperty.call(FACE_BASIS, face)) {\n    throw new RangeError(`면 라벨은 T | L | R 이어야 한다: ${face}`);\n  }\n  return face;\n}\n\nfunction assertModuleIndex(v, label) {\n  if (!Number.isInteger(v) || v < 0) {\n    throw new RangeError(`${label} 는 0 이상의 정수여야 한다: ${v}`);\n  }\n  return v;\n}\n\nfunction assertSide(n) {\n  if (!Number.isInteger(n) || n <= 0) {\n    throw new RangeError(`n 은 1 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n/**\n * 면의 (e_i, e_j) 단위 벡터.\n * @param {'T'|'L'|'R'} face\n * @returns {{ei: {x:number,y:number}, ej: {x:number,y:number}}}\n */\nexport function faceBasis(face) {\n  assertFace(face);\n  return FACE_BASIS[face];\n}\n\n/**\n * Y-심(layout 원점) 기준 (a·e_i + b·e_j)·size 절대 픽셀 좌표.\n * `a`, `b` 는 정수뿐 아니라 반정수(중심 계산용)도 받는다.\n */\nfunction facePoint(face, a, b, norm) {\n  const { ei, ej } = faceBasis(face);\n  return {\n    // `+ 0` 은 -0 정규화 — a 또는 b 가 0 이고 벡터 성분이 음수면 0 * (음수) = -0 이 된다.\n    x: norm.originX + (a * ei.x + b * ej.x) * norm.size + 0,\n    y: norm.originY + (a * ei.y + b * ej.y) * norm.size + 0,\n  };\n}\n\n/**\n * 모듈 (face, i, j) 의 마름모 꼭짓점 4개.\n * 정점 순서: [Y심측, +e_i, +e_i+e_j, +e_j] (세 면 모두 같은 감김).\n * @param {'T'|'L'|'R'} face\n * @param {number} i\n * @param {number} j\n * @param {object} [layout]\n * @returns {{x:number,y:number}[]} 길이 4\n */\nexport function moduleQuad(face, i, j, layout) {\n  assertFace(face);\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const norm = normalizeLayout(layout);\n  return [\n    facePoint(face, i, j, norm),\n    facePoint(face, i + 1, j, norm),\n    facePoint(face, i + 1, j + 1, norm),\n    facePoint(face, i, j + 1, norm),\n  ];\n}\n\n/** 모듈 (face, i, j) 의 중심(두 대각선의 교점) 절대 픽셀 좌표. */\nexport function moduleCenter(face, i, j, layout) {\n  assertFace(face);\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const norm = normalizeLayout(layout);\n  return facePoint(face, i + 0.5, j + 0.5, norm);\n}\n\n/** 모듈 내접원 반지름 = (√3/4)·size. Type O 면과 동일 형상(hexgrid 재사용). */\nfunction moduleInradius(size) {\n  return FACE_INRADIUS_COEFF * size;\n}\n\n/** 모듈 넓이 = (√3/2)·size². Type O 면과 동일 형상(hexgrid 재사용). */\nfunction moduleArea(size) {\n  return FACE_AREA_COEFF * size * size;\n}\n\n/**\n * 모듈의 샘플링 원판. hexgrid.faceSampleDisc 와 동일한 규약(§7.2)을 승계한다 —\n * 반지름은 항상 모듈 내접원 반지름으로 클램프된다.\n *\n * @param {'T'|'L'|'R'} face\n * @param {number} i\n * @param {number} j\n * @param {object} [layout]\n * @param {{fraction?: number, fractionOf?: 'radius'|'incircleArea'|'faceArea'}} [options]\n * @returns {{x:number,y:number,radius:number,clamped:boolean}}\n */\nexport function moduleSampleDisc(face, i, j, layout, options) {\n  assertFace(face);\n  const norm = normalizeLayout(layout);\n  const opts = options || {};\n  const fraction =\n    opts.fraction === undefined ? SAMPLE_FRACTION_DEFAULT : opts.fraction;\n  const fractionOf =\n    opts.fractionOf === undefined ? SAMPLE_FRACTION_OF_DEFAULT : opts.fractionOf;\n\n  if (!Number.isFinite(fraction) || fraction <= 0 || fraction > 1) {\n    throw new RangeError(`fraction 은 (0, 1] 범위여야 한다: ${fraction}`);\n  }\n  if (!SAMPLE_FRACTION_MODES.includes(fractionOf)) {\n    throw new RangeError(\n      `fractionOf 는 ${SAMPLE_FRACTION_MODES.join(' | ')} 중 하나여야 한다: ${fractionOf}`,\n    );\n  }\n\n  const inradius = moduleInradius(norm.size);\n  let radius;\n  if (fractionOf === 'radius') {\n    radius = fraction * inradius;\n  } else if (fractionOf === 'incircleArea') {\n    radius = Math.sqrt(fraction) * inradius;\n  } else {\n    radius = Math.sqrt((fraction * moduleArea(norm.size)) / Math.PI);\n  }\n\n  const clamped = radius > inradius;\n  if (clamped) radius = inradius;\n\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const { ei, ej } = FACE_BASIS[face];\n  // moduleCenter → facePoint의 산술 순서를 그대로 펼쳐 재정규화·중복 검증을 없앤다.\n  const a = i + 0.5;\n  const b = j + 0.5;\n  const x = norm.originX + (a * ei.x + b * ej.x) * norm.size + 0;\n  const y = norm.originY + (a * ei.y + b * ej.y) * norm.size + 0;\n  return { x, y, radius, clamped };\n}\n\n/**\n * 변당 n 모듈인 Type Y 큐브 실루엣(정육각형)의 축정렬 바운딩 박스.\n * 닫힌 형태: 반폭 = √3/2·n·size, 반높이 = n·size (Y-심 = 육각형 중심 = layout 원점).\n * @param {number} n\n * @param {object} [layout]\n * @returns {{minX,minY,maxX,maxY,width,height}}\n */\nexport function cubeBounds(n, layout) {\n  assertSide(n);\n  const { size, originX, originY } = normalizeLayout(layout);\n  const halfW = (Math.sqrt(3) / 2) * n * size;\n  const halfH = n * size;\n  return {\n    minX: originX - halfW,\n    minY: originY - halfH,\n    maxX: originX + halfW,\n    maxY: originY + halfH,\n    width: 2 * halfW,\n    height: 2 * halfH,\n  };\n}\n\n/**\n * 변당 n 모듈인 Type Y 큐브를 여백 `margin` 과 함께 담는 캔버스 레이아웃.\n * 반환값을 그대로 layout 으로 넘길 수 있다 (size/originX/originY 포함).\n *\n * @param {number} n\n * @param {{size?: number, margin?: number}} [options]\n * @returns {{size, originX, originY, width, height, n}}\n */\nexport function layoutForCube(n, options) {\n  assertSide(n);\n  const opts = options || {};\n  const size = opts.size === undefined ? 1 : opts.size;\n  if (!Number.isFinite(size) || size <= 0) {\n    throw new RangeError(`size 는 유한한 양수여야 한다: ${size}`);\n  }\n  const margin = opts.margin === undefined ? 2 * size : opts.margin;\n  if (!Number.isFinite(margin) || margin < 0) {\n    throw new RangeError(`margin 은 0 이상이어야 한다: ${margin}`);\n  }\n  const b = cubeBounds(n, { size, originX: 0, originY: 0 });\n  return {\n    size,\n    originX: margin - b.minX,\n    originY: margin - b.minY,\n    width: b.width + 2 * margin,\n    height: b.height + 2 * margin,\n    n,\n  };\n}\n"],
  ["type-y-cell-editor", "/**\n * type-y-cell-editor.js — Type Y 시험판 셀·데이터 마스크 편집기 (순수 상태)\n *\n * /lab/ 생성기에서 다음 검출기 패턴을 설계하기 위한 도구다. encodeY·용량·와이어·\n * 정식 생성기 출력과 섞지 않는다. 세 면은 같은 (i,j) 데이터 마스크를 공유하고,\n * 톤만 면별로 덮을 수 있다.\n *\n * roleSets 계약: {reference:Set, format:Set, occupied?:Set}. occupied 는 **선택한\n * 검출기(파인더)가 점유한 좌표**다 — 호출자가 정본(cellSurfaceFinal painted 셀)에서\n * 런타임 유도해 넘긴다(손 좌표표 금지). occupied 좌표는 detector 로 분류되고 데이터\n * 합집합·마스크 토글에서 빠진다. 생략하면 기존(무점유) 동작 그대로다.\n *\n * 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date 금지).\n */\n\nimport { roleOf, buildRoleSets } from './placementY.js';\nimport { YFACES, moduleQuad } from './ygrid.js';\n\nexport const CELL_EDITOR_SCHEMA = 'tlcube-y-cell-editor/v1';\nexport const CELL_EDITOR_MODE_TONE = 'tone';\nexport const CELL_EDITOR_MODE_MASK = 'mask';\nexport const CELL_EDITOR_MODES = Object.freeze([\n  CELL_EDITOR_MODE_TONE, CELL_EDITOR_MODE_MASK,\n]);\nexport const DEFAULT_CELL_TONE = 1;\nexport const TONE_DARKEN = -1;\nexport const TONE_BRIGHTEN = 1;\nexport const CELL_EDITOR_FACES = YFACES;\nexport const TONE_LEVELS = Object.freeze({\n  0: 'dark',\n  1: 'mid',\n  2: 'bright',\n});\nexport const BOUNDARY_EDGES = Object.freeze(['i+', 'i-', 'j+', 'j-']);\n\nconst FACE_ORDER = Object.freeze({ T: 0, L: 1, R: 2 });\n\nfunction assertN(n) {\n  if (!Number.isInteger(n) || n < 11) {\n    throw new RangeError(`n 은 11 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\nfunction assertFace(face) {\n  if (!Object.prototype.hasOwnProperty.call(FACE_ORDER, face)) {\n    throw new RangeError(`면 라벨은 T | L | R 이어야 한다: ${face}`);\n  }\n  return face;\n}\n\nfunction assertIndex(v, label, n) {\n  if (!Number.isInteger(v) || v < 0 || v >= n) {\n    throw new RangeError(`${label} 는 0 이상 ${n} 미만의 정수여야 한다: ${v}`);\n  }\n  return v;\n}\n\nfunction assertTone(tone) {\n  if (!Number.isInteger(tone) || tone < 0 || tone > 2) {\n    throw new RangeError(`톤은 0 | 1 | 2 여야 한다: ${tone}`);\n  }\n  return tone;\n}\n\nfunction assertMode(mode) {\n  if (!CELL_EDITOR_MODES.includes(mode)) {\n    throw new RangeError(`모드는 ${CELL_EDITOR_MODES.join(' | ')} 여야 한다: ${mode}`);\n  }\n  return mode;\n}\n\nfunction assertDirection(direction) {\n  if (direction !== TONE_DARKEN && direction !== TONE_BRIGHTEN) {\n    throw new RangeError(`방향은 ${TONE_DARKEN} 또는 ${TONE_BRIGHTEN} 이어야 한다: ${direction}`);\n  }\n  return direction;\n}\n\nexport function coordKey(i, j) {\n  return `${i},${j}`;\n}\n\nexport function toneKey(face, i, j) {\n  return `${face},${i},${j}`;\n}\n\nfunction parseCoordKey(key) {\n  const [i, j] = key.split(',').map(Number);\n  return { i, j };\n}\n\nfunction parseToneKey(key) {\n  const [face, i, j] = key.split(',');\n  return { face, i: Number(i), j: Number(j) };\n}\n\nfunction cmpCoord(a, b) {\n  return a.i - b.i || a.j - b.j;\n}\n\nfunction cmpTone(a, b) {\n  return (FACE_ORDER[a.face] - FACE_ORDER[b.face]) || a.i - b.i || a.j - b.j;\n}\n\nfunction setsOf(n, roleSets) {\n  return roleSets || buildRoleSets(n);\n}\n\n/** 3단계 순환. 어두워짐(−1): 2→1→0→2, 밝아짐(+1): 0→1→2→0. */\nexport function cycleCellTone(tone, direction) {\n  assertTone(tone);\n  assertDirection(direction);\n  return (tone + direction + 3) % 3;\n}\n\nexport function createCellEditorState(n) {\n  assertN(n);\n  return {\n    n,\n    mode: CELL_EDITOR_MODE_TONE,\n    userNonData: new Set(),\n    tones: new Map(),\n  };\n}\n\n/** n별 상태를 보존하는 저장소. 모드는 n 공통. */\nexport function createCellEditorStore() {\n  return {\n    byN: new Map(),\n    mode: CELL_EDITOR_MODE_TONE,\n  };\n}\n\nexport function editorStateForN(store, n) {\n  assertN(n);\n  let state = store.byN.get(n);\n  if (!state) {\n    state = createCellEditorState(n);\n    store.byN.set(n, state);\n  }\n  state.mode = store.mode;\n  return state;\n}\n\nexport function setEditorMode(store, mode) {\n  assertMode(mode);\n  store.mode = mode;\n  for (const state of store.byN.values()) state.mode = mode;\n  return store;\n}\n\nexport function resetCellEditorState(state) {\n  state.userNonData.clear();\n  state.tones.clear();\n  return state;\n}\n\nexport function isFixedNonData(i, j, n, roleSets) {\n  return roleOf(i, j, n, setsOf(n, roleSets)) !== 'data';\n}\n\n/** 선택한 검출기(파인더)가 점유한 좌표인지 — roleSets.occupied 는 선택적이다. */\nexport function isOccupiedNonData(i, j, n, roleSets) {\n  const sets = setsOf(n, roleSets);\n  return sets.occupied instanceof Set && sets.occupied.has(coordKey(i, j));\n}\n\nexport function isUserNonData(state, i, j) {\n  return state.userNonData.has(coordKey(i, j));\n}\n\nexport function isDataCoord(state, i, j, roleSets) {\n  const sets = setsOf(state.n, roleSets);\n  if (isFixedNonData(i, j, state.n, sets)) return false;\n  if (isOccupiedNonData(i, j, state.n, sets)) return false;\n  return !isUserNonData(state, i, j);\n}\n\n/** data | detector | fixed — 범례와 동일한 세 갈래. 파인더 점유는 detector 다. */\nexport function classifyCoord(state, i, j, roleSets) {\n  const sets = setsOf(state.n, roleSets);\n  const role = roleOf(i, j, state.n, sets);\n  if (role === 'reference' || role === 'format') return 'fixed';\n  if (isOccupiedNonData(i, j, state.n, sets) || isUserNonData(state, i, j)) return 'detector';\n  return 'data';\n}\n\nexport function cellTone(state, face, i, j) {\n  assertFace(face);\n  const key = toneKey(face, i, j);\n  return state.tones.has(key) ? state.tones.get(key) : DEFAULT_CELL_TONE;\n}\n\nfunction setCellTone(state, face, i, j, tone) {\n  const key = toneKey(face, i, j);\n  if (tone === DEFAULT_CELL_TONE) state.tones.delete(key);\n  else state.tones.set(key, tone);\n}\n\n/**\n * 기본(톤) 모드. 해당 면만 순환하고, 고정 역할이 아니면 (i,j) 를 세 면 공통\n * 데이터에서 제외한다.\n */\nexport function applyToneEdit(state, face, i, j, direction, roleSets) {\n  assertFace(face);\n  assertIndex(i, 'i', state.n);\n  assertIndex(j, 'j', state.n);\n  const next = cycleCellTone(cellTone(state, face, i, j), direction);\n  setCellTone(state, face, i, j, next);\n  if (!isFixedNonData(i, j, state.n, roleSets)) {\n    state.userNonData.add(coordKey(i, j));\n  }\n  return state;\n}\n\n/**\n * 마스크 모드. 색은 그대로 두고 (i,j) 포함/제외만 토글.\n * reference/format 은 데이터로 되돌릴 수 없고, 파인더 점유(occupied)도 마찬가지다.\n */\nexport function applyMaskToggle(state, i, j, roleSets) {\n  assertIndex(i, 'i', state.n);\n  assertIndex(j, 'j', state.n);\n  if (isFixedNonData(i, j, state.n, roleSets)) {\n    return { state, changed: false, reason: 'fixed' };\n  }\n  if (isOccupiedNonData(i, j, state.n, roleSets)) {\n    return { state, changed: false, reason: 'occupied' };\n  }\n  const key = coordKey(i, j);\n  if (state.userNonData.has(key)) state.userNonData.delete(key);\n  else state.userNonData.add(key);\n  return { state, changed: true, reason: 'ok' };\n}\n\nexport function applyCellEdit(state, face, i, j, direction, roleSets) {\n  if (state.mode === CELL_EDITOR_MODE_MASK) {\n    return applyMaskToggle(state, i, j, roleSets);\n  }\n  applyToneEdit(state, face, i, j, direction, roleSets);\n  return { state, changed: true, reason: 'ok' };\n}\n\nexport function countEditorCoords(state, roleSets) {\n  const sets = setsOf(state.n, roleSets);\n  let data = 0;\n  let userNonData = 0;\n  let occupied = 0;\n  for (let i = 0; i < state.n; i += 1) {\n    for (let j = 0; j < state.n; j += 1) {\n      const kind = classifyCoord(state, i, j, sets);\n      if (kind === 'data') data += 1;\n      else if (kind === 'detector') {\n        // 파인더 점유는 사용자 제외와 별도 회계 — data 가 인코더 회계와 일치해야 한다.\n        if (isOccupiedNonData(i, j, state.n, sets)) occupied += 1;\n        else userNonData += 1;\n      }\n    }\n  }\n  return { data, userNonData, occupied };\n}\n\nfunction neighbor(i, j, edge) {\n  if (edge === 'i+') return { i: i + 1, j };\n  if (edge === 'i-') return { i: i - 1, j };\n  if (edge === 'j+') return { i, j: j + 1 };\n  return { i, j: j - 1 };\n}\n\n/**\n * 데이터 합집합의 실제 변. bbox 가 아니라 셀 한 변 단위다.\n * 바깥 둘레와 비데이터 구멍(고정 역할·사용자 제외)을 모두 포함한다.\n * 세 면은 같은 (i,j) 마스크를 쓰므로 평면 변을 면마다 복제한다.\n */\nexport function dataBoundaryEdges(state, roleSets) {\n  const sets = setsOf(state.n, roleSets);\n  const n = state.n;\n  const dataAt = (i, j) =>\n    i >= 0 && i < n && j >= 0 && j < n && isDataCoord(state, i, j, sets);\n  const planar = [];\n  for (let i = 0; i < n; i += 1) {\n    for (let j = 0; j < n; j += 1) {\n      if (!dataAt(i, j)) continue;\n      for (const edge of BOUNDARY_EDGES) {\n        const nb = neighbor(i, j, edge);\n        if (!dataAt(nb.i, nb.j)) planar.push({ i, j, edge });\n      }\n    }\n  }\n  const out = [];\n  for (const face of CELL_EDITOR_FACES) {\n    for (const item of planar) out.push({ face, i: item.i, j: item.j, edge: item.edge });\n  }\n  return out;\n}\n\n/** 모듈 마름모에서 경계 변의 두 끝점. 정점 순서 = moduleQuad. */\nexport function edgeEndpoints(face, i, j, edge, layout) {\n  const q = moduleQuad(face, i, j, layout);\n  if (edge === 'i-') return [q[0], q[3]];\n  if (edge === 'i+') return [q[1], q[2]];\n  if (edge === 'j-') return [q[0], q[1]];\n  if (edge === 'j+') return [q[3], q[2]];\n  throw new RangeError(`알 수 없는 변: ${edge}`);\n}\n\nfunction listedUserNonData(state, roleSets) {\n  const sets = setsOf(state.n, roleSets);\n  const listed = [];\n  for (const key of state.userNonData) {\n    const { i, j } = parseCoordKey(key);\n    if (i < 0 || j < 0 || i >= state.n || j >= state.n) continue;\n    if (isFixedNonData(i, j, state.n, sets)) continue;\n    listed.push({ i, j });\n  }\n  listed.sort(cmpCoord);\n  return listed;\n}\n\nfunction listedToneOverrides(state) {\n  const listed = [];\n  for (const [key, tone] of state.tones) {\n    if (tone === DEFAULT_CELL_TONE) continue;\n    const parsed = parseToneKey(key);\n    if (!Object.prototype.hasOwnProperty.call(FACE_ORDER, parsed.face)) continue;\n    if (parsed.i < 0 || parsed.j < 0 || parsed.i >= state.n || parsed.j >= state.n) continue;\n    listed.push({ face: parsed.face, i: parsed.i, j: parsed.j, tone });\n  }\n  listed.sort(cmpTone);\n  return listed;\n}\n\nexport function serializeCellEditor(state, roleSets) {\n  const userNonData = listedUserNonData(state, roleSets);\n  const toneOverrides = listedToneOverrides(state);\n  const counts = countEditorCoords(state, roleSets);\n  return {\n    schema: CELL_EDITOR_SCHEMA,\n    n: state.n,\n    toneLevels: { 0: TONE_LEVELS[0], 1: TONE_LEVELS[1], 2: TONE_LEVELS[2] },\n    userNonData,\n    toneOverrides,\n    counts: {\n      data: counts.data,\n      userNonData: counts.userNonData,\n      occupied: counts.occupied,\n    },\n  };\n}\n\nexport function stringifyCellEditor(state, roleSets) {\n  return JSON.stringify(serializeCellEditor(state, roleSets), null, 2);\n}\n\nfunction readCoord(entry) {\n  if (Array.isArray(entry) && entry.length >= 2) {\n    return { i: entry[0], j: entry[1] };\n  }\n  if (entry && typeof entry === 'object') return { i: entry.i, j: entry.j };\n  throw new TypeError('userNonData 항목은 {i,j} 또는 [i,j] 여야 한다');\n}\n\nfunction readTone(entry) {\n  if (Array.isArray(entry) && entry.length >= 4) {\n    return { face: entry[0], i: entry[1], j: entry[2], tone: entry[3] };\n  }\n  if (entry && typeof entry === 'object') {\n    return { face: entry.face, i: entry.i, j: entry.j, tone: entry.tone };\n  }\n  throw new TypeError('toneOverrides 항목은 {face,i,j,tone} 또는 [face,i,j,tone] 여야 한다');\n}\n\n/**\n * `toneOverrides` 의 면 키 방언 `{\"T\":[[i,j,tone],…],\"L\":…,\"R\":…}` → 평평한 목록.\n *\n * 정본 규칙은 cell-editor-core.js `normalizeToneOverrideList` 다. 이 모듈은 스캐너\n * 번들(lab-scan)에 실리므로 core 를 끌어들이지 않고 규칙만 복제한다 (F6 해소 —\n * 2026-08-17 스캐너 스탬프 상승과 동반). 두 구현이 갈라지면\n * cell-editor-core.test.js 가 같은 문서로 양쪽 파서를 묶어 잡는다.\n */\nfunction normalizeToneOverrides(raw) {\n  if (Array.isArray(raw)) return raw;\n  if (raw === null || typeof raw !== 'object') return [];\n  const flat = [];\n  for (const face of Object.keys(raw)) {\n    const entries = raw[face];\n    if (!Array.isArray(entries)) continue;\n    for (const entry of entries) {\n      if (Array.isArray(entry)) flat.push([face, ...entry]);\n      else if (entry !== null && typeof entry === 'object') flat.push({ face, ...entry });\n    }\n  }\n  return flat;\n}\n\nexport function parseCellEditor(input) {\n  const obj = typeof input === 'string' ? JSON.parse(input) : input;\n  if (!obj || typeof obj !== 'object') {\n    throw new TypeError('셀 편집기 JSON 객체가 필요하다');\n  }\n  if (obj.schema !== CELL_EDITOR_SCHEMA) {\n    throw new RangeError(`지원하지 않는 스키마: ${obj.schema}`);\n  }\n  const state = createCellEditorState(obj.n);\n  const sets = buildRoleSets(state.n);\n  const rawNonData = Array.isArray(obj.userNonData) ? obj.userNonData : [];\n  for (const entry of rawNonData) {\n    const { i, j } = readCoord(entry);\n    if (!Number.isInteger(i) || !Number.isInteger(j)) continue;\n    if (i < 0 || j < 0 || i >= state.n || j >= state.n) continue;\n    if (isFixedNonData(i, j, state.n, sets)) continue;\n    state.userNonData.add(coordKey(i, j));\n  }\n  const rawTones = normalizeToneOverrides(obj.toneOverrides);\n  for (const entry of rawTones) {\n    const item = readTone(entry);\n    if (!Object.prototype.hasOwnProperty.call(FACE_ORDER, item.face)) continue;\n    if (!Number.isInteger(item.i) || !Number.isInteger(item.j)) continue;\n    if (item.i < 0 || item.j < 0 || item.i >= state.n || item.j >= state.n) continue;\n    if (!Number.isInteger(item.tone) || item.tone < 0 || item.tone > 2) continue;\n    if (item.tone === DEFAULT_CELL_TONE) continue;\n    state.tones.set(toneKey(item.face, item.i, item.j), item.tone);\n  }\n  return state;\n}\n"],
  ["layoutY", "// layoutY.js — Type Y scan order-Y + 레이아웃 통합 파사드 (SPEC §14, ADR 0003 D5·U7)\n//\n// placementY.js 가 이미 확정한 \"어디에 무엇을 놓는가\"(레퍼런스 4조·포맷 15셀) 위에\n// **데이터 셀의 순회 순서**(scan order-Y)만 얹는다. layout.js(Type O) 와 대칭 구조 —\n// 소비자가 placementY 를 따로 import 하지 않도록 재-export 파사드를 겸한다.\n//\n// 캐노니컬 정의 (와이어 계약, ADR 0003 D5 \"좌표-국소 래스터\"의 구체화):\n//   j = 0..n-1 오름차순(행), 행 안에서 i = 0..n-1 오름차순, role === 'data' 인\n//   셀만(레퍼런스·포맷 스킵). 연속 3셀 = RS 심볼 1개 (d0,d1,d2 MSD-first, §4.2 승계).\n//   필러 = 마지막 (C mod 3) 개(§5.6 준용).\n//\n// 좌표-국소 래스터를 쓰는 이유(ADR D5): 분산 배치 대비 포화 글레어 임계 면적이\n// 3.95%→12%로 3배 커진다 — \"연속 3셀 = 1심볼 + 공간 인접\" 원칙(Type O §5.7)의 Type Y\n// 승계.\n// ⚠ 12% 는 \"심볼의 3셀 전멸\" 이상 모델의 상한이다. 부분 터치(셀 1개만 스쳐도 심볼\n// 오염) 기준 원판형 글레어 최악 배치 실측 임계는 Y1 7.12% / Y2 8.17% (검증 라운드\n// 실측 — 이상적 행내 그룹핑과의 격차는 0.2pp 이하라 국소성 자체는 실질 성립).\n// 리스크 등록·게이트에는 12% 가 아니라 이 실측 임계를 쓴다.\n//\n// 런타임 의존성 0 · ESM.\n\nimport {\n  buildRoleSets,\n  roleOf,\n  referenceGroups,\n  referenceCellsAll,\n  formatCells,\n} from './placementY.js';\n\nfunction key(i, j) {\n  return `${i},${j}`;\n}\n\nfunction assertSize(n) {\n  if (!Number.isInteger(n) || n < 9) {\n    throw new RangeError(`n 은 9 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order-Y\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 데이터 셀을 캐노니컬 scan order-Y 로. j 오름차순(행), 행 안에서 i 오름차순,\n * role === 'data' 인 셀만.\n * @param {number} n\n * @returns {{i:number, j:number}[]} 길이 = 데이터 셀 수\n */\nexport function dataCellsInScanOrder(n) {\n  assertSize(n);\n  const roleSets = buildRoleSets(n);\n  const out = [];\n  for (let j = 0; j < n; j += 1) {\n    for (let i = 0; i < n; i += 1) {\n      if (roleOf(i, j, n, roleSets) === 'data') out.push({ i, j });\n    }\n  }\n  return out;\n}\n\n/**\n * scan order-Y 의 연속 3셀씩 묶은 심볼 그룹. 그룹 내부 순서 = (d0,d1,d2),\n * §4.2 MSD-first 규약 그대로. 마지막 (C mod 3) 개는 그룹에 들지 않고\n * `fillerCells` 로 간다.\n * @param {number} n\n * @returns {{i:number, j:number}[][]} 길이 = ⌊데이터 셀 수 / 3⌋\n */\nexport function symbolCellGroups(n) {\n  const scan = dataCellsInScanOrder(n);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let g = 0; g < groupCount; g += 1) {\n    groups.push([scan[3 * g], scan[3 * g + 1], scan[3 * g + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order-Y 의 마지막 (C mod 3) 개 (§5.6 준용). scan order 꼬리에 온다.\n * @param {number} n\n * @returns {{i:number, j:number}[]}\n */\nexport function fillerCells(n) {\n  const scan = dataCellsInScanOrder(n);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점, layout.js `layoutMap` 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * n×n 인덱스 격자 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - reference → `placementY.referenceCellsAll(n)` 순서(조 순 · 조 내 순)\n *   - format    → `placementY.formatCells(n)` 순서(복제 순 · 복제 내 순)\n *   - data      → `dataCellsInScanOrder(n)` 순서(= scan order-Y 인덱스, 심볼\n *                 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는 `index % 3`)\n *\n * @param {number} n\n * @returns {Map<string, {role: 'reference'|'format'|'data', index: number}>}\n */\nexport function layoutMapY(n) {\n  assertSize(n);\n  const map = new Map();\n\n  referenceCellsAll(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'reference', index: i }));\n  formatCells(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'format', index: i }));\n  dataCellsInScanOrder(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placementY 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport { roleOf, referenceGroups, referenceCellsAll, formatCells };\n"],
  ["capacityY", "// capacityY.js — Type Y 버전별 용량 산출 (SPEC §14, ADR 0003 D7·U3·U9·v3.1§4b — capacity.js 대칭)\n//\n// **이 모듈이 SPEC §14 생성물 표의 소스다.** 수기로 유지하지\n// 않는다.\n//\n// [v3.1 §4b 2톤 메인 전환] VERSIONS_Y 는 이제 4항목이다 — n=21·25 각각에 톤 모드\n// (tones=2 2톤 메인 · tones=3 Y-T 옵션)가 곱해진다. **용량 회계는 tones 무관 동일**\n// (동일 base-6 심볼 알파벳 — 오버헤드·NSYM_TABLE_Y·페이로드 전부 n 에만 의존, tones\n// 는 digit→면 매핑(sceneY.js/tonemap.js/verifyY.js)만 바꾼다). 그래서 Y1 과 Y1T,\n// Y2 와 Y2T 는 formatIndex 만 다르고 나머지 용량 수치는 항상 완전히 같다 — 이 항등을\n// capacityY.test.js 가 회귀로 고정한다.\n//\n// [U3 ✅ 확정 — 사용자 비준 (ADR 0003 v3.1, 2026-08-09)] `NSYM_TABLE_Y` 는 Type O V3 전례(ADR 0001 §3.3.3: 오정정\n// 검출 여유 +1 로 홀수 nsym)를 따라 산출한 확정표다. 절차 (재현 가능 — 검증 라운드 정정):\n// **M = Math.round(0.25·S) (JS half-up), 결과가 짝수면 +1 홀수화 (홀수면 유지)**:\n//   Y0 S=47  → round(11.75) = 12 (짝수 → +1) = 13   [ADR 0006 D5, 2026-08-09 비준]\n//   Y1 S=138 → round(34.5) = 35 (홀수 → 유지)\n//   Y2 S=199 → round(49.75) = 50 (짝수 → +1) = 51\n// L = round(0.12·S), H = round(0.40·S) (반올림, 홀짝 보정 없음 — Type O NSYM_TABLE 의\n// L/H 열도 동일 절차).\n//\n// 회계는 capacity.js 와 동형이다(심볼 도메인):\n//   총 좌표(셀)     total = n²  (Type Y 는 3면 공통 좌표 격자 — 기하 곱셈 없이 n×n)\n//   오버헤드         overhead = placementY 레퍼런스 12셀 + 포맷 15셀 실계산 합(=27)\n//   데이터 심볼(셀)  C = total − overhead\n//   사용 심볼        S = ⌊C / 3⌋  (잔여 셀 = C − 3S)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE_Y 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (capacity.js 의\n//                     `maxBytesForSymbols` 를 그대로 재사용 — BigInt 정확 계산, Type Y\n//                     전용으로 다시 구현하지 않는다)\n//   순 페이로드       = K − 1  (헤더 1B, header.js 승계)\n\nimport { maxBytesForSymbols } from './capacity.js';\nimport { errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\nimport {\n  referenceCellsAll, formatCells, referenceGroups, FORMAT_BLOCK_LENGTH,\n} from './placementY.js';\n\n/**\n * Type Y 오버헤드 실계산(레퍼런스 12셀 + 포맷 15셀). capacity.js 의\n * `overheadBreakdown(k).total` 과 동형 — 하드코딩 27 이 아니라 placementY 실계산이다.\n * @param {number} n\n * @returns {{n:number, reference:number, format:number, total:number}}\n */\nexport function overheadBreakdownY(n) {\n  const reference = referenceCellsAll(n).length;\n  const format = formatCells(n).length;\n  return { n, reference, format, total: reference + format };\n}\n\n/**\n * [U3 ✅ 확정] Type Y 사용 심볼 수 대비 ECC 레벨별 nsym 표. 산출 근거는 위 모듈 헤더 주석.\n * @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>}\n */\nexport const NSYM_TABLE_Y = Object.freeze({\n  Y0: Object.freeze({\n    symbols: 47, L: 6, M: 13, H: 19,\n  }),\n  Y1: Object.freeze({\n    symbols: 138, L: 17, M: 35, H: 55,\n  }),\n  Y2: Object.freeze({\n    symbols: 199, L: 24, M: 51, H: 80,\n  }),\n});\n\n/**\n * 버전 정의. `overhead` 는 `overheadBreakdownY(n).total` 로 유도한다(하드코딩 아님).\n * 포맷 정보 버전 인덱스는 **cube 패밀리 표**의 값이다(ADR 0006 D1 — 4bit 는 격자\n * 수립 경로별 독립 표다): 0·8·9 = Y0·Y1·Y2(tones=2, 2톤 메인) · 2·10·11 =\n * Y0T·Y1T·Y2T(tones=3, Y-T 옵션). **변형(T)은 기본형 + 2** (ADR 0006 D3-5 쌍\n * 불변식). cube 는 불스아이도 중앙 QR 도 없어 hex/tri 가설이 격자를 못 세우므로\n * 축 분리 검사가 면제된다(D3-1) — 그래서 Y0 가 hex V1 과 같은 값 0 을 써도 안전하다.\n * `symbolKey` 는 NSYM_TABLE_Y 조회 키 — n 이 같으면(=용량 회계가 같으면) tones 와\n * 무관하게 같은 키를 쓴다(Y1T 도 'Y1').\n *\n * 배열 순서는 **tones 별 용량 오름차순** — `chooseVersionY` 가 앞에서부터 훑어\n * 최소 버전을 고르므로 Y0 가 각 tones 블록의 선두여야 한다.\n * @type {ReadonlyArray<{name:string, version:number, n:number, tones:2|3, formatIndex:number, overhead:number, symbolKey:string}>}\n */\nexport const VERSIONS_Y = Object.freeze([\n  Object.freeze({\n    name: 'Y0', version: 0, n: 13, tones: 2, formatIndex: 0, overhead: overheadBreakdownY(13).total, symbolKey: 'Y0',\n  }),\n  Object.freeze({\n    name: 'Y1', version: 1, n: 21, tones: 2, formatIndex: 8, overhead: overheadBreakdownY(21).total, symbolKey: 'Y1',\n  }),\n  Object.freeze({\n    name: 'Y2', version: 2, n: 25, tones: 2, formatIndex: 9, overhead: overheadBreakdownY(25).total, symbolKey: 'Y2',\n  }),\n  Object.freeze({\n    name: 'Y0T', version: 0, n: 13, tones: 3, formatIndex: 2, overhead: overheadBreakdownY(13).total, symbolKey: 'Y0',\n  }),\n  Object.freeze({\n    name: 'Y1T', version: 1, n: 21, tones: 3, formatIndex: 10, overhead: overheadBreakdownY(21).total, symbolKey: 'Y1',\n  }),\n  Object.freeze({\n    name: 'Y2T', version: 2, n: 25, tones: 3, formatIndex: 11, overhead: overheadBreakdownY(25).total, symbolKey: 'Y2',\n  }),\n]);\n\n/**\n * (version, tones) → VERSIONS_Y 항목. 인코더/디코더가 모드를 명시했을 때의\n * 단일 조회 진입점 — 필드 4개(name/tones/formatIndex 포함)를 재조합하지 않는다.\n * @param {number} version 0 | 1 | 2\n * @param {2|3} [tones] 기본 2(2톤 메인).\n * @returns {{name:string, version:number, n:number, tones:2|3, formatIndex:number, overhead:number, symbolKey:string}}\n */\nexport function versionSpecY(version, tones = 2) {\n  const spec = VERSIONS_Y.find((v) => v.version === version && v.tones === tones);\n  if (!spec) {\n    throw new RangeError(\n      `알 수 없는 Type Y 버전/모드: version=${version}, tones=${tones} `\n      + `(허용 ${VERSIONS_Y.map((v) => `${v.name}(v${v.version}/t${v.tones})`).join(', ')})`,\n    );\n  }\n  return spec;\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 면 내 QR 윈도 β (ADR 0003 D1 + [C7 Q7]) — Y2(n=25)·tones=2 전용\n// ─────────────────────────────────────────────────────────────────────────\n//\n// 윈도 좌표(와이어, 스냅샷 고정): 상단면(T) 의 바깥 꼭짓점 코너 — (i,j) ∈\n// [n-13, n-1]² (W=13 — ½피치 v1 QR: 21 QR모듈 + 안쪽 2변 콰이어트 4 QR모듈 = 25\n// QR모듈 = 12.5 데이터 피치, 바깥 2변 콰이어트는 실루엣 밖 배경이 제공, ADR 0003\n// D1). **제외 좌표는 세 면 전부 데이터에서 뺀다** — window===true 인코딩은 이\n// 좌표들을 cellDigits 에 아예 싣지 않는다.\n//\n// [C7 부속 계약 ① — 실계산으로 확인, ADR 원문이 명시한 것보다 넓다] n=25 에서\n// 윈도 [12,24]² 와 겹치는 것은 **레퍼런스 앵커 (n-3,n-3)=(22,22) 조 전체(3셀)\n// 뿐 아니라 포맷 정보 복제 2(i=n-8..n-4, j=n-2 — 5셀 전부)도 겹친다** (ADR\n// 0003b 자문 원문은 레퍼런스만 짚었다 — 이 lane 이 실계산으로 포맷 복제 2 충돌을\n// 추가로 발견했다, 아래 모듈 로드 시점 자기검증 참조). 조용히 옮기지 않고\n// 결정적 탐색으로 해소한다: |shift| 오름차순으로 j축 평행이동을 먼저 시도하고\n// (윈도가 항상 (n-13..n-1) 코너에 있으므로 j 감소가 항상 벗어나는 방향이다),\n// 실패하면 i축을 시도해 \"윈도 밖·격자 내·미점유\"인 최초 해를 그 그룹 전체(조/\n// 복제, 구조·상대좌표·digit 배정 순서 불변)에 적용한다. n=25/tones=2 결과\n// (스냅샷, encodeY.test.js 가 회귀로 고정):\n//   레퍼런스 조 D: (22,22)→(22,10) · (23,22)→(23,10) · (22,23)→(22,11) (j축 −12)\n//   포맷 복제 2:   (17,23)→(7,23) · (18,23)→(8,23) · (19,23)→(9,23) ·\n//                  (20,23)→(10,23) · (21,23)→(11,23) (i축 −10)\n\n/** 윈도 한 변의 데이터 셀 폭 W (ADR 0003 D1). */\nexport const WINDOW_SIZE_Y = 13;\n\n/** 윈도가 지원되는 유일한 (version, n, tones) — Y2/2톤(D1 조건 ②: n≥25, Y1 은 불가). */\nexport const WINDOW_SUPPORTED_N = 25;\nexport const WINDOW_SUPPORTED_TONES = 2;\nexport const WINDOW_SUPPORTED_VERSION = 2;\n\n/** 윈도 경계(포함) — (i,j) ∈ [lo, hi]² 이면 윈도 안. */\nexport function windowBoundsY(n) {\n  return { lo: n - WINDOW_SIZE_Y, hi: n - 1 };\n}\n\n/** 좌표 (i,j) 가 윈도 안인가. */\nexport function inWindowY(i, j, n) {\n  const { lo, hi } = windowBoundsY(n);\n  return i >= lo && i <= hi && j >= lo && j <= hi;\n}\n\nfunction cellKeyY(i, j) {\n  return `${i},${j}`;\n}\n\nfunction translateCellsY(cells, di, dj) {\n  return cells.map((c) => ({ ...c, i: c.i + di, j: c.j + dj }));\n}\n\nfunction cellsClearOfWindow(cells, n, occupied) {\n  for (const c of cells) {\n    if (c.i < 0 || c.i > n - 1 || c.j < 0 || c.j > n - 1) return false;\n    if (inWindowY(c.i, c.j, n)) return false;\n    if (occupied.has(cellKeyY(c.i, c.j))) return false;\n  }\n  return true;\n}\n\n/**\n * 결정적 탐색 — |shift| 오름차순, 매 shift 에서 j축 평행이동을 먼저 시도하고\n * 실패하면 i축을 시도한다. 그룹(조/복제)을 통째로 옮긴다(구조·상대좌표 불변).\n * 위 모듈 헤더 주석의 n=25 결과가 이 탐색의 산출물이다(재현 가능, 하드코딩 아님).\n */\nfunction relocateGroupOutOfWindow(cells, n, occupied, maxShift) {\n  for (let shift = 1; shift <= maxShift; shift += 1) {\n    const byJ = translateCellsY(cells, 0, -shift);\n    if (cellsClearOfWindow(byJ, n, occupied)) return byJ;\n    const byI = translateCellsY(cells, -shift, 0);\n    if (cellsClearOfWindow(byI, n, occupied)) return byI;\n  }\n  throw new RangeError(`n=${n}: 윈도 충돌 그룹을 재배치할 탐색 범위(${maxShift}) 안에서 못 찾았다`);\n}\n\n/**\n * 윈도 배제 후 레퍼런스 4조. 윈도와 안 겹치는 조는 그대로, 겹치는 조(3셀 전부\n * 윈도 안이어야 함 — 부분 겹침은 결정 규칙 밖이라 throw)는 통째 재배치한다.\n * @param {number} n\n * @param {2|3} [tones]\n * @returns {{cells:{i:number,j:number}[], digits:number[]}[]} 길이 4\n */\nexport function windowedReferenceGroupsY(n, tones = 2) {\n  const groups = referenceGroups(n, tones);\n  const occupied = new Set();\n  for (const g of groups) {\n    for (const c of g.cells) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\n  }\n  for (const c of formatCells(n)) {\n    if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\n  }\n\n  return groups.map((g) => {\n    const flags = g.cells.map((c) => inWindowY(c.i, c.j, n));\n    if (flags.every((f) => !f)) return g; // 안 겹침 — 그대로.\n    if (!flags.every(Boolean)) {\n      throw new RangeError(`n=${n}: 레퍼런스 조가 윈도와 부분 겹침 — 결정 규칙 밖 (${JSON.stringify(g.cells)})`);\n    }\n    const relocated = relocateGroupOutOfWindow(g.cells, n, occupied, n);\n    relocated.forEach((c) => occupied.add(cellKeyY(c.i, c.j)));\n    return { cells: relocated, digits: g.digits };\n  });\n}\n\n/** 윈도 배제 후 레퍼런스 12셀 전부(조 순·조 내 순 평탄화), digit 포함. */\nexport function windowedReferenceCellsY(n, tones = 2) {\n  const out = [];\n  for (const group of windowedReferenceGroupsY(n, tones)) {\n    group.cells.forEach((cell, idx) => out.push({ ...cell, digit: group.digits[idx] }));\n  }\n  return out;\n}\n\n/**\n * 윈도 배제 후 포맷 정보 15셀. 복제 단위(FORMAT_BLOCK_LENGTH=5셀 연속 런)로\n * 전부/전무만 허용 — 부분 겹침은 결정 규칙 밖(throw).\n * @param {number} n\n * @returns {{i:number,j:number}[]} 길이 15\n */\nexport function windowedFormatCellsY(n) {\n  const cells = formatCells(n);\n  const occupied = new Set();\n  for (const c of cells) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\n  for (const c of referenceCellsAll(n)) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\n\n  const out = [];\n  for (let r = 0; r < cells.length; r += FORMAT_BLOCK_LENGTH) {\n    const run = cells.slice(r, r + FORMAT_BLOCK_LENGTH);\n    const flags = run.map((c) => inWindowY(c.i, c.j, n));\n    if (flags.every((f) => !f)) {\n      out.push(...run);\n      continue;\n    }\n    if (!flags.every(Boolean)) {\n      throw new RangeError(`n=${n}: 포맷 복제가 윈도와 부분 겹침 — 결정 규칙 밖 (${JSON.stringify(run)})`);\n    }\n    const relocated = relocateGroupOutOfWindow(run, n, occupied, n);\n    relocated.forEach((c) => occupied.add(cellKeyY(c.i, c.j)));\n    out.push(...relocated);\n  }\n  return out;\n}\n\n/** 윈도가 배제하는 W² 좌표 전부(재배치 후에는 순수 데이터-제외 영역이 된다). */\nexport function windowExcludedCellsY(n) {\n  const { lo, hi } = windowBoundsY(n);\n  const out = [];\n  for (let j = lo; j <= hi; j += 1) {\n    for (let i = lo; i <= hi; i += 1) out.push({ i, j });\n  }\n  return out;\n}\n\n/**\n * 윈도 후 오버헤드 — 레퍼런스 12 + 포맷 15(재배치로 위치만 바뀔 뿐 개수는 불변)\n * + 윈도 배제 W². overhead(=27) 는 표시용이 아니라 실제 역할 셀 수 그대로 두고,\n * windowExcluded 를 별도 필드로 노출한다(오버헤드 정의 자체를 바꾸지 않는다).\n */\nexport function overheadBreakdownY2Window() {\n  const base = overheadBreakdownY(WINDOW_SUPPORTED_N);\n  return { ...base, windowExcluded: WINDOW_SIZE_Y * WINDOW_SIZE_Y };\n}\n\n/**\n * [✅ 확정 — 사용자 비준 2026-08-09, hb-20260809-tlrat1] Y2W 사용 심볼(143) 대비 ECC 레벨별 nsym. capacityForY2Window() 가\n * 실계산하는 dataCells(429)/usedSymbols(143) 에 대해 NSYM_TABLE_Y 와 동일 절차\n * (M = round(0.25·S), 짝수면 +1 홀수화 · L = round(0.12·S) · H = round(0.40·S)):\n *   S=143 → M: round(35.75)=36(짝) → 37 · L: round(17.16)=17 · H: round(57.2)=57\n */\nexport const NSYM_TABLE_Y2W = Object.freeze({ symbols: 143, L: 17, M: 37, H: 57 });\n\n/**\n * Y2W(면 내 QR 윈도 채택) 용량. version=2/tones=2 전용 — `capacityForY` 의 창\n * 배제 변형. **formatIndex 는 Y2 와 동일(9)** — 윈도 유/무는 와이어(포맷 정보)가\n * 아니라 광학 검출 + 사후 RS/CRC 로 구분한다(ADR 0003 [C7 Q7], β 출하는 와이어\n * 무변경).\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForY2Window(level = 'M') {\n  const n = WINDOW_SUPPORTED_N;\n  const totalCells = n * n;\n  const { total: overhead, windowExcluded } = overheadBreakdownY2Window();\n  const dataCells = totalCells - overhead = windowedFormatCellsY(n);\n  if (relocatedRef.length !== 12 || relocatedFmt.length !== 15) {\n    throw new Error('n=25: 윈도 재배치 후 레퍼런스/포맷 셀 수가 12/15 가 아니다');\n  }\n  const seen = new Set();\n  for (const c of [...relocatedRef, ...relocatedFmt]) {\n    if (inWindowY(c.i, c.j, n)) {\n      throw new Error(`n=25: 재배치 후에도 윈도 안 좌표가 남아 있다: (${c.i},${c.j})`);\n    }\n    const k = cellKeyY(c.i, c.j);\n    if (seen.has(k)) throw new Error(`n=25: 재배치된 레퍼런스/포맷 셀이 충돌한다: (${c.i},${c.j})`);\n    seen.add(k);\n  }\n}\n\n/**\n * 한 버전의 용량 전체. capacity.js `capacityFor` 회계를 그대로 승계한다.\n * @param {{version:number, n:number, overhead:number, symbolKey:string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForY(spec, level = 'M') {\n  const label = spec.name || `Y${spec.version}`;\n  const totalCells = spec.n * spec.n;\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`${label}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE_Y[spec.symbolKey];\n  if (!table) {\n    throw new RangeError(`${label}: NSYM_TABLE_Y 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 조용히 맞추지 않고 던진다\n    // (capacity.js `capacityFor` 와 동일한 규약 · 과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `${label}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE_Y.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/n(${spec.n}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`${label}: NSYM_TABLE_Y.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`${label}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbol
