${tableName}.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`${label}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n\n  // [발견 — 검증 라운드 2026-08-09] \"S개 심볼 = 하나의 큰 base-211 수\" K 산정과\n  // base211.js 의 27B↔28심볼 청크 인코더는 효율이 미세하게 달라, K 를 실제 청크\n  // 인코딩하면 dataSymbols 와 어긋나는 조합이 존재할 수 있다 (구 A2/H=57 이 그랬고,\n  // A-U1 비준으로 59 로 교체해 현행 표는 전 조합 정렬이다). 그런 조합은 encodeA.js\n  // 자기검증이 throw 하므로 **생산 불가**다 — 표가 미래에 다시 어긋나면 소비자가\n  // 정상 용량으로 게시하지 않도록 플래그를 유지한다 (가드).\n  const chunkAligned = symbolCountForByteLength(dataBytes) === dataSymbols;\n\n  return {\n    name: spec.name,\n    version: spec.version,\n    k: spec.k,\n    formatIndex: spec.formatIndex,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    chunkAligned,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/**\n * 전 버전 용량표.\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityTableA(level = 'M') {\n  return VERSIONS_A.map((v) => capacityForA(v, level));\n}\n\n/**\n * Type A + daehan nsym 표.\n *\n * O daehan 과 같은 정책: **절대 정정능력(부모 버전의 nsym)을 승계**한다.\n * A0D/A1D 는 부모 값 그대로 청크 정렬이다. A2D/M 만 부모 37 이 비정렬이라\n * A2/H 전례(57→59, +2 · 홀수)를 따라 **39** 로 올렸다 — t 를 줄이지 않는다.\n * 실측 (2026-08-19, measure-daehan-a.mjs): A0D 38심볼 · A1D 75 · A2D 123.\n */\nexport const NSYM_TABLE_A_DAEHAN = Object.freeze({\n  A0D: Object.freeze({ symbols: 38, L: 5, M: 11, H: 18 }),\n  A1D: Object.freeze({ symbols: 75, L: 11, M: 23, H: 36 }),\n  A2D: Object.freeze({ symbols: 123, L: 17, M: 39, H: 59 }),\n});\n\n/**\n * Type A daehan 버전. formatIndex 는 레거시 A 와 같다 (전용 와이어를 안 만든다 —\n * O daehan `capacityDaehan.js` 헤더 §와이어와 같은 계약). version 도 A0/A1/A2 의\n * 0/1/2 를 공유하므로 **이 배열을 VERSIONS_A 와 합치면 안 된다.**\n */\nexport const VERSIONS_A_DAEHAN = Object.freeze([\n  Object.freeze({\n    name: 'A0D', version: 0, k: 6, formatIndex: 1,\n    overhead: overheadBreakdownA(6, daehanReservedCells(6).length).total,\n    symbolKey: 'A0D',\n  }),\n  Object.freeze({\n    name: 'A1D', version: 1, k: 8, formatIndex: 12,\n    overhead: overheadBreakdownA(8, daehanReservedCells(8).length).total,\n    symbolKey: 'A1D',\n  }),\n  Object.freeze({\n    name: 'A2D', version: 2, k: 10, formatIndex: 13,\n    overhead: overheadBreakdownA(10, daehanReservedCells(10).length).total,\n    symbolKey: 'A2D',\n  }),\n]);\n\nexport function capacityForADaehan(spec, level = 'M') {\n  const base = capacityForA(spec, level, NSYM_TABLE_A_DAEHAN);\n  return { ...base, daehanFinder: true };\n}\n\nexport function capacityTableADaehan(level = 'M') {\n  return VERSIONS_A_DAEHAN.map((v) => capacityForADaehan(v, level));\n}\n\n{\n  const EXPECT = {\n    A0D: { k: 6, overhead: 74, dataCells: 116, symbols: 38, payload: { L: 30, M: 25, H: 18 } },\n    A1D: { k: 8, overhead: 98, dataCells: 227, symbols: 75, payload: { L: 60, M: 49, H: 36 } },\n    A2D: { k: 10, overhead: 125, dataCells: 371, symbols: 123, payload: { L: 101, M: 80, H: 60 } },\n  };\n  for (const spec of VERSIONS_A_DAEHAN) {\n    const want = EXPECT[spec.name];\n    if (!want) throw new Error('capacityA daehan: 기대표에 없는 키 ' + spec.name);\n    if (spec.k !== want.k || spec.overhead !== want.overhead) {\n      throw new Error(spec.name + ': k/오버헤드가 확정값과 다르다 — k=' + spec.k\n        + ' overhead=' + spec.overhead);\n    }\n    for (const level of ['L', 'M', 'H']) {\n      const cap = capacityForADaehan(spec, level);\n      if (cap.dataCells !== want.dataCells || cap.usedSymbols !== want.symbols) {\n        throw new Error(spec.name + '/' + level + ': 데이터 셀·심볼이 확정값과 다르다');\n      }\n      if (cap.maxPayloadBytes !== want.payload[level]) {\n        throw new Error(spec.name + '/' + level + ': 순 페이로드 ' + cap.maxPayloadBytes\n          + ' B 가 확정값 ' + want.payload[level] + ' B 와 다르다');\n      }\n      if (cap.chunkAligned !== true) {\n        throw new Error(spec.name + '/' + level + ': 청크 비정렬 — 생산 불가');\n      }\n    }\n  }\n}\n\n/**\n * SPEC 에 붙일 마크다운 표(향후 §14 대칭 절 생성용). 단일 물결표는 쓰지 않는다\n * (규약 §6.11).\n * @param {'L'|'M'|'H'} [level]\n * @returns {string}\n */\nexport function renderMarkdownTableA(level = 'M') {\n  const rows = capacityTableA(level);\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\n  const body = rows.map((r) => `| ${r.name} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B**`\n    + `${r.chunkAligned ? '' : ' ⚠ 청킹 비정렬 — 인코딩 불가 (nsym 재조정 필요)'} |`);\n  return [head, sep, ...body].join('\\n');\n}\n\n// 대조용: hexgrid.cellCount 는 육각부만(패치 미포함) 계산한다 — capacityA.test.js\n// 가 \"totalCells - cellCount(k) === 3*k*(k+1)/2(패치 셀 수)\" 항등을 검증할 때 쓴다.\nexport { cellCount as hexCellCount };\n"],
  ["turnA", "/**\n * turnA.js — 내부 타입 **V** (턴A · 타입 A 역삼각) formatIndex 배정 «표» — 유일한 진실.\n *\n * 운영자 확정 (2026-08-24): **턴A = 내부 타입 V** — 내부 타입 G(코너 자리 예약,\n * `markerG.js`)와 동형이다: UI·분류상은 타입 A 그대로, formatIndex 만 전용 표.\n * ⚠ 015 §16 의 초판 문구 «별도 타입이 아니라 A 의 옵션, 배정은 tri 표 안에서 소요»\n * 는 이 확정으로 **대체**됐다 (G 도 «신설 안 함» 초판이 8/20 에 반증·대체된 전례 —\n * 배타 개설 정형). 와이어 값은 **동결**: 기존 6칸의 값·k·centerQr 은 발행분이라\n * 한 자리도 안 움직였고, **이름만** V 체계(V0/V0Q/V1/V1Q/V2/V2Q)로 재명명했다.\n * 배정은 **반드시 표 주도**다 — A1=12 · A2=13 에 균일 오프셋을 주면 4bit(0..15) 를\n * 넘치므로 (12+4=16 — `test/turnA.test.js` 가 실측 고정) 산술 유도는 금지된다.\n * 이 표가 배정의 전부이며, 인코더·디코더 배선은 이 표를 읽는다.\n *\n * 배정 원리 (실측 회계 — `test/output/lanes/claude-oak-turna-probe.out.txt`):\n *   · hex(O)·tri(A) 는 **한 4bit 공간을 k 로 갈라 쓰는 축**이다 — 정본 전례:\n *     O V2=1(k8) 과 A0=1(k6) 이 같은 값을 쓴다 (decode.js «두 해석 만들고 k 로\n *     가른다»). 턴A 도 같은 기제만 쓴다 — **같은 (값, k) 쌍은 절대 겹치지 않는다.**\n *   · 7 은 쓰지 않는다 — K1 배정 잠정 확정 (015 §16).\n *   · 8·9·10·11 은 쓰지 않는다 — cube 축 값과 겹치고, tri↔cube 격자 수립 경로\n *     분리는 아직 실측 전 가설이다 (claude-k-contract.md §K-7).\n *   · 현행 tri 실점유 = {1(A0·k6), 3(A0Q·k6), 12(A1·k8), 14(A1Q·k8),\n *     13(A2·k10), 15(A2Q·k10)} — A0Q 는 실재한다 (encodeA(version 0, centerQr)\n *     실호출 확인). 따라서 턴A 최악 소요는 T×Q 전조합 = **6값**이다\n *     (015 §16 의 «최악 5값 ≤ 빈 값 11» 은 양쪽 수치가 실측과 다르다 — 무경합\n *     결론 자체는 유지된다. 정정 회계는 oak 프로그램 문서 ⑦).\n *   · {7, 8..11} 밖에서 hex·tri 가 전혀 안 쓰는 값은 {0,2,4,5,6} 5개뿐이라\n *     6번째 항목 하나는 tri 내부 값 재사용이 불가피하다 — V2Q=3 이 유일한\n *     tri 내부 공유이고 A0Q(k6) 와 k 로 갈린다.\n *\n * 결과 표 (k6 행이 0..5 를 빈틈없이 채운다):\n *   k6 : 0=O V1 · 1=A0 · 2=**V0** · 3=A0Q · 4=O V1Q · 5=**V0Q**\n *   k8 : 1=O V2 · 4=**V1** · 5=O V2Q · 6=**V1Q** · 12=A1 · 14=A1Q\n *   k10: 0=**V2** · 2=O V3 · 3=**V2Q** · 6=O V3Q · 13=A2 · 15=A2Q\n */\n\nimport { VERSIONS_A } from './capacityA.js';\nimport { VERSIONS } from './capacity.js';\n\n/** 내부 타입 V 배정 표 — 항목마다 값이 «표에 직접» 적혀 있다. 산술 유도 금지.\n *  값·k·centerQr 은 발행 와이어라 **동결**이다 (2026-08-24 재명명 — 구명\n *  A0T/A0TQ/A1T/A1TQ/A2T/A2TQ 에서 이름 층만 V 체계로. 값 이동 0). */\nexport const TURN_A_FORMAT_INDEX = Object.freeze([\n  Object.freeze({ name: 'V0', version: 0, k: 6, centerQr: false, formatIndex: 2 }),\n  Object.freeze({ name: 'V0Q', version: 0, k: 6, centerQr: true, formatIndex: 5 }),\n  Object.freeze({ name: 'V1', version: 1, k: 8, centerQr: false, formatIndex: 4 }),\n  Object.freeze({ name: 'V1Q', version: 1, k: 8, centerQr: true, formatIndex: 6 }),\n  Object.freeze({ name: 'V2', version: 2, k: 10, centerQr: false, formatIndex: 0 }),\n  Object.freeze({ name: 'V2Q', version: 2, k: 10, centerQr: true, formatIndex: 3 }),\n  /*\n   * ── V-CM (턴A + 코너 자리 예약, 2026-08-24 말미 추가) ──────────────────────\n   *\n   * A-CM(markerG family=tri)의 턴A 대응 — 회계는 A-CM 과 동일(21셀 마커, VERSIONS_ACM)\n   * 이고 기하만 턴A 사상(배치 180° 반전)이다 (markerA.markerCellsTurnA 대칭 유도).\n   *\n   * 값 배정 — markerG 반영 후 잔여 3칸이 정확히 이 셋이다 (markerG.js 헤더 §결과\n   * 점유: k6 {14} · k8 {3} · k10 {5}). 아래 자기검증이 «이 배정 뒤 잔여 0» 을 잰다.\n   *\n   * ⚠ **V-CMQ 는 보류다** — 잔여 0 이라 앉힐 칸이 없다 (K1=7·cube 8..11 예약 침범\n   *   금지). 그래서 turnA × cornerMarker × centerQr 조합은 인코더가 막는다\n   *   (encodeA — G 의 CMQ 이전(pre-C2a) 상태와 같은 문법). 개설하려면 예약 축\n   *   해제 또는 포맷 공간 확장이 선행돼야 한다 — 레인 T 보고서 §V-CMQ 회계.\n   */\n  Object.freeze({ name: 'V0CM', version: 0, k: 6, centerQr: false, cornerMarker: true, formatIndex: 14 }),\n  Object.freeze({ name: 'V1CM', version: 1, k: 8, centerQr: false, cornerMarker: true, formatIndex: 3 }),\n  Object.freeze({ name: 'V2CM', version: 2, k: 10, centerQr: false, cornerMarker: true, formatIndex: 5 }),\n]);\n\n/** K1 예약 (015 §16 잠정 확정) — 턴A 가 침범하면 안 되는 값. */\nexport const K1_RESERVED_FORMAT_INDEX = 7;\n/** cube 축 점유 값 — tri↔cube 분리 실측 전이라 턴A 는 피한다. */\nexport const CUBE_AXIS_FORMAT_INDEXES = Object.freeze([8, 9, 10, 11]);\n\n/**\n * 현행 hex·tri 축 점유를 (formatIndex, k) 쌍으로 전수 열거한다 — 코드 정본에서\n * 실계산 (capacity.VERSIONS 의 version−1/+4Q · capacityA.VERSIONS_A 의 기본/+2Q).\n */\nexport function hexTriAxisOccupancy() {\n  const out = [];\n  for (const spec of VERSIONS) {\n    out.push({ owner: 'O V' + spec.version, formatIndex: spec.version - 1, k: spec.k });\n    out.push({ owner: 'O V' + spec.version + 'Q', formatIndex: spec.version - 1 + 4, k: spec.k });\n  }\n  for (const spec of VERSIONS_A) {\n    out.push({ owner: spec.name, formatIndex: spec.formatIndex, k: spec.k });\n    out.push({ owner: spec.name + 'Q', formatIndex: spec.formatIndex + 2, k: spec.k });\n  }\n  return out;\n}\n\n/** 턴A 항목 조회 — version + centerQr (+cornerMarker) 로. 없으면 RangeError.\n *  cornerMarker=true + centerQr=true (V-CMQ) 는 잔여 칸 0 으로 **보류**라 항목이\n *  없다 — 조용한 폴백 없이 던진다 (표 헤더 §V-CM 회계). */\nexport function turnASpec(version, options = {}) {\n  const centerQr = options.centerQr === true;\n  const cornerMarker = options.cornerMarker === true;\n  const spec = TURN_A_FORMAT_INDEX.find(\n    (entry) => entry.version === version && entry.centerQr === centerQr\n      && (entry.cornerMarker === true) === cornerMarker,\n  );\n  if (!spec) {\n    throw new RangeError('알 수 없는 턴A 버전: ' + version\n      + (centerQr ? '+centerQr' : '') + (cornerMarker ? '+cornerMarker' : ''));\n  }\n  return spec;\n}\n\n/** formatIndex + k → 턴A 항목 (디코더 측 역해석용). 없으면 null. */\nexport function turnASpecFromFormatIndex(formatIndex, k) {\n  return TURN_A_FORMAT_INDEX.find(\n    (entry) => entry.formatIndex === formatIndex && entry.k === k,\n  ) || null;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 (markerO 전례) — 표의 무경합 주장이 거짓이면 즉시 throw\n// ─────────────────────────────────────────────────────────────────────────────\n{\n  const seen = new Map(); // \"formatIndex|k\" → owner\n  const claim = (owner, formatIndex, k) => {\n    if (!Number.isInteger(formatIndex) || formatIndex < 0 || formatIndex > 15) {\n      throw new Error('turnA: formatIndex 4bit 범위 위반 — ' + owner + '=' + formatIndex);\n    }\n    const key = formatIndex + '|' + k;\n    if (seen.has(key)) {\n      throw new Error('turnA: (값,k) 경합 — ' + owner + ' 와 ' + seen.get(key)\n        + ' 이 (' + formatIndex + ', k' + k + ') 를 겹쳐 쓴다');\n    }\n    seen.set(key, owner);\n  };\n  for (const occ of hexTriAxisOccupancy()) claim(occ.owner, occ.formatIndex, occ.k);\n  for (const entry of TURN_A_FORMAT_INDEX) {\n    if (entry.formatIndex === K1_RESERVED_FORMAT_INDEX) {\n      throw new Error('turnA: K1 예약값 7 침범 — ' + entry.name);\n    }\n    if (CUBE_AXIS_FORMAT_INDEXES.includes(entry.formatIndex)) {\n      throw new Error('turnA: cube 축 값 침범 — ' + entry.name + '=' + entry.formatIndex);\n    }\n    claim(entry.name, entry.formatIndex, entry.k);\n  }\n  // 표의 k 는 기저 A 버전의 k 와 같아야 한다 (턴A 는 «옵션» — 격자 크기 동일)\n  for (const entry of TURN_A_FORMAT_INDEX) {\n    const base = VERSIONS_A.find((v) => v.version === entry.version);\n    if (!base || base.k !== entry.k) {\n      throw new Error('turnA: ' + entry.name + ' 의 k=' + entry.k\n        + ' 가 기저 ' + (base ? base.name + ' k=' + base.k : '없음') + ' 과 다르다');\n    }\n  }\n}\n"],
  ["markerG", "/**\n * markerG.js — 내부 타입 G (코너 **자리 예약**) formatIndex 배정 «표» — 유일한 진실.\n *\n * ⚠ 2026-08-21 운영자 정정: G 자체는 파인더가 아니다. O-CM / A-CM 자리 예약의\n *   와이어 인덱스 표다. 그 자리에 들어가는 기본 파인더는 Type G → **H**,\n *   Type A → **H2O**.\n *\n * 운영자 확정 (2026-08-20): 코너 자리 예약(O-CM / A-CM)은 **내부 타입 G** 로 분리한다.\n * 선례는 턴A 다 (`src/turnA.js`) — UI·분류상으로는 O/A 그대로지만 **내부적으로 자기\n * formatIndex 배정을 갖는다.** 이 표가 markerO.js §4 의 옛 계약(«formatIndex 를\n * 신설하지 않는다, 광학 검출 + 사후 RS/CRC 로 가른다»)을 **뒤집는다**: 실기 보고\n * 「코너 마커로 만든 코드가 스캔이 안 된다」의 근본 원인이 그 계약이었다 — CM 은\n * 레거시와 같은 인덱스를 실으므로 디코더가 마커 유무(= 회계·scan order 차이)를\n * 와이어에서 구분할 수 없었다. 019 의 교훈 그대로, 검출기 배선만으로는 효과가 0 이다.\n *\n * ⚠ 글자는 **G** 다. `Q` 를 쓰지 마라 — 이 저장소에서 Q 는 centerQr 를 뜻한다\n *   (A0Q · O V1Q · V2Q(턴A) 실재). 그리고 **포맷 v2 / 예비 비트(RESERVED_BITS_V2)로\n *   우회하지 않는다** — 그 경로는 hex 링 3 의 «15 포맷 + 2 레퍼런스» 계약을 깨고,\n *   검증되지 않은 «hex/tri 폴백 오독 0» 전제에 의존해 기각됐다 (운영자 결정).\n *\n * 배정 원리 (턴A 헤더의 기제 승계):\n *   · hex(O)·tri(A) 는 한 4bit 공간을 **(formatIndex, k) 쌍**으로 갈라 쓴다 —\n *     정본 전례: O V2=1(k8) 과 A0=1(k6). 값은 겹쳐도 (값, k) 쌍은 절대 안 겹친다.\n *   · **표 주도, 산술 유도 금지** — 턴A 가 실측으로 고정했듯(A1=12 에 균일 오프셋\n *     +4 는 4bit 를 넘친다) 이 공간엔 균일 규칙이 살아남을 자리가 없다. 값은 아래\n *     표에 직접 적혀 있고, 정합성은 로드 시점 자기검증 + `test/markerG.test.js` 의\n *     코드-유도 충돌 테스트가 지킨다 (목록 손 관리 금지 — 이 저장소 최다 결함).\n *   · 7 은 쓰지 않는다 — K1 예약 (015 §16). 8..11 은 쓰지 않는다 — cube 축.\n *   · **Q(centerQr) 변형 — 있다** (C2a, 2026-08-23 · PM/022 항목 1ⓑ): 원판은\n *     «배치 검증 미실시 조합» 이라 인코더가 던졌는데, 배치 검증이 끝났다 —\n *     centerQr 는 셀 회계를 바꾸지 않고(중앙 슬롯은 애초에 셀 밖 — V*Q 전례),\n *     마커 tetrad(링 k·k−1)와 중앙 슬롯(ring ≤2)은 전 k 에서 서로소이며,\n *     OMarker/AMarker 의 재배치 format·reference 셀이 중앙 슬롯을 침범하지 않음을\n *     `test/markerG-centerqr.test.js` 가 전 k 실측으로 잠근다. 그래서 타입당\n *     3칸(CM) + 3칸(CMQ) = 6칸씩이다.\n *\n * O-CM / A-CM 을 **가른다** (6칸, 묶으면 3칸):\n *   현행 점유는 (formatIndex, k) 쌍마다 소유자가 정확히 하나다 — 패밀리는 키에\n *   없다 (`formatindex-occupancy.mjs` 실측: hex·tri 합산 충돌 0). O-CM 과 A-CM 을\n *   같은 값에 묶으면 같은 (값, k) 쌍에 두 패밀리 소유자가 생겨 이 관례가 처음으로\n *   깨지고, 역조회(`markerGSpecFromFormatIndex`)와 점유 회계 전부에 패밀리 축을\n *   새로 끼워야 한다. 빈 칸 15개에 6칸은 넉넉하므로(잔여 9) 관례 보존이 싸다.\n *\n * 값 선택 (빈 칸: k6 {6,12,13,14,15} · k8 {0,2,3,13,15} · k10 {1,4,5,12,14}):\n *   · hex(O-CM) 는 레거시 O 가 사는 **저대역(0..6)** 에 둔다 — V1CM=6 은 k6 의\n *     유일한 저대역 빈 칸이고(k6 행 0..5 는 턴A 가 채웠다), V2CM=0 · V3CM=1 은\n *     각 k 의 최소 빈 값이다. 덤으로 값 0 행(O V1·V2(턴A))과 1 행(A0·O V2)이 가득 찬다.\n *   · tri(A-CM) 는 레거시 A 기저(A1=12·A2=13)가 사는 **고대역(12..15)** 에서\n *     **연속 배정 12+version** 으로 둔다 — A0CM=12(k6) · A1CM=13(k8) ·\n *     A2CM=14(k10). 외우기 쉽고, 점유표에서 패밀리 대역이 눈으로 갈린다.\n *\n * CMQ 값 선택 (C2a — CM 반영 후 빈 칸 9 = k6 {13,14,15} · k8 {2,3,15} · k10 {4,5,12}):\n *   · hex(O-CM+Q) 는 각 k 의 **최소 빈 값** — V1CMQ=13(k6, 저대역이 이미 만석) ·\n *     V2CMQ=2(k8) · V3CMQ=4(k10).\n *   · tri(A-CM+Q) 는 **고대역** — A0CMQ=15(k6) · A1CMQ=15(k8) · A2CMQ=12(k10,\n *     A 기저 대역 12..15 안).\n *\n * 결과 점유 (CM+CMQ 반영 후): 빈 칸 3 = k6 {14} · k8 {3} · k10 {5}.\n */\n\nimport { VERSIONS } from './capacity.js';\nimport { VERSIONS_A } from './capacityA.js';\nimport {\n  TURN_A_FORMAT_INDEX,\n  K1_RESERVED_FORMAT_INDEX,\n  CUBE_AXIS_FORMAT_INDEXES,\n  hexTriAxisOccupancy,\n} from './turnA.js';\n\n/** 내부 타입 G 배정 표 — 항목마다 값이 «표에 직접» 적혀 있다. 산술 유도 금지.\n *\n * `defaultFinder` (운영자 결정 2026-08-21): CM 은 파인더가 아니라 **자리 예약**이고,\n * 그 자리에 들어가는 **심볼**이 기본 파인더다 — hex(O-CM 12셀 자리)는 **H**\n * (`finder-H.js`), tri(A-CM 21셀 자리)는 **H2O** (`markerA.js` H2O_LOCAL_TONES_A).\n * 톤 표는 각 모듈이 유일한 진실이고, 여기는 배정만 든다 (finder-H 로드 자기검증이\n * hex 열을, 아래 자기검증이 패밀리 내 일관성을 강제한다). */\nexport const MARKER_G_FORMAT_INDEX = Object.freeze([\n  Object.freeze({ name: 'V1CM', family: 'hex', version: 1, k: 6, formatIndex: 6, centerQr: false, defaultFinder: 'H' }),\n  Object.freeze({ name: 'V2CM', family: 'hex', version: 2, k: 8, formatIndex: 0, centerQr: false, defaultFinder: 'H' }),\n  Object.freeze({ name: 'V3CM', family: 'hex', version: 3, k: 10, formatIndex: 1, centerQr: false, defaultFinder: 'H' }),\n  Object.freeze({ name: 'A0CM', family: 'tri', version: 0, k: 6, formatIndex: 12, centerQr: false, defaultFinder: 'H2O' }),\n  Object.freeze({ name: 'A1CM', family: 'tri', version: 1, k: 8, formatIndex: 13, centerQr: false, defaultFinder: 'H2O' }),\n  Object.freeze({ name: 'A2CM', family: 'tri', version: 2, k: 10, formatIndex: 14, centerQr: false, defaultFinder: 'H2O' }),\n  // CM+Q (C2a, 2026-08-23) — 자리 예약 + 중앙 QR. 회계는 CM 과 동일(중앙은 셀 밖),\n  // 와이어만 가른다. defaultFinder 는 자리(코너) 심볼이라 CM 과 같다 — 중앙은 QR.\n  Object.freeze({ name: 'V1CMQ', family: 'hex', version: 1, k: 6, formatIndex: 13, centerQr: true, defaultFinder: 'H' }),\n  Object.freeze({ name: 'V2CMQ', family: 'hex', version: 2, k: 8, formatIndex: 2, centerQr: true, defaultFinder: 'H' }),\n  Object.freeze({ name: 'V3CMQ', family: 'hex', version: 3, k: 10, formatIndex: 4, centerQr: true, defaultFinder: 'H' }),\n  Object.freeze({ name: 'A0CMQ', family: 'tri', version: 0, k: 6, formatIndex: 15, centerQr: true, defaultFinder: 'H2O' }),\n  Object.freeze({ name: 'A1CMQ', family: 'tri', version: 1, k: 8, formatIndex: 15, centerQr: true, defaultFinder: 'H2O' }),\n  Object.freeze({ name: 'A2CMQ', family: 'tri', version: 2, k: 10, formatIndex: 12, centerQr: true, defaultFinder: 'H2O' }),\n]);\n\n/**\n * G 항목 조회 — 인코더 측. family('hex'|'tri') + version + centerQr(기본 false —\n * 기존 소비자 무변경). 없으면 RangeError — 조용한 레거시 폴백은 «와이어에 신호가\n * 없다» 는 원래 결함의 재생산이다.\n */\nexport function markerGSpec(family, version, centerQr = false) {\n  const spec = MARKER_G_FORMAT_INDEX.find(\n    (entry) => entry.family === family && entry.version === version\n      && entry.centerQr === centerQr,\n  );\n  if (!spec) {\n    throw new RangeError('알 수 없는 내부 타입 G 항목: ' + family + ' version ' + version\n      + (centerQr ? ' (+Q)' : ''));\n  }\n  return spec;\n}\n\n/**\n * formatIndex + k → G 항목 (디코더 측 역해석). 없으면 null.\n * (formatIndex, k) 쌍은 전 표(hex·tri 실배선 + 턴A + G) 에서 유일하므로 패밀리\n * 없이 결정된다 — 호출자는 entry.family 로 자기 패밀리 소유인지 대조한다.\n */\nexport function markerGSpecFromFormatIndex(formatIndex, k) {\n  return MARKER_G_FORMAT_INDEX.find(\n    (entry) => entry.formatIndex === formatIndex && entry.k === k,\n  ) || null;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 (턴A 전례) — 표의 무경합 주장이 거짓이면 즉시 throw\n// ─────────────────────────────────────────────────────────────────────────────\n{\n  const seen = new Map(); // \"formatIndex|k\" → owner\n  const claim = (owner, formatIndex, k) => {\n    if (!Number.isInteger(formatIndex) || formatIndex < 0 || formatIndex > 15) {\n      throw new Error('markerG: formatIndex 4bit 범위 위반 — ' + owner + '=' + formatIndex);\n    }\n    const key = formatIndex + '|' + k;\n    if (seen.has(key)) {\n      throw new Error('markerG: (값,k) 경합 — ' + owner + ' 와 ' + seen.get(key)\n        + ' 이 (' + formatIndex + ', k' + k + ') 를 겹쳐 쓴다');\n    }\n    seen.set(key, owner);\n  };\n  for (const occ of hexTriAxisOccupancy()) claim(occ.owner, occ.formatIndex, occ.k);\n  for (const entry of TURN_A_FORMAT_INDEX) claim(entry.name, entry.formatIndex, entry.k);\n  for (const entry of MARKER_G_FORMAT_INDEX) {\n    if (entry.formatIndex === K1_RESERVED_FORMAT_INDEX) {\n      throw new Error('markerG: K1 예약값 7 침범 — ' + entry.name);\n    }\n    if (CUBE_AXIS_FORMAT_INDEXES.includes(entry.formatIndex)) {\n      throw new Error('markerG: cube 축 값 침범 — ' + entry.name + '=' + entry.formatIndex);\n    }\n    claim(entry.name, entry.formatIndex, entry.k);\n  }\n  // 표의 k 는 기저 버전의 k 와 같아야 한다 (G 는 «옵션» — 격자 크기 동일, 턴A 전례).\n  for (const entry of MARKER_G_FORMAT_INDEX) {\n    const base = entry.family === 'hex'\n      ? VERSIONS.find((v) => v.version === entry.version)\n      : VERSIONS_A.find((v) => v.version === entry.version);\n    if (!base || base.k !== entry.k) {\n      throw new Error('markerG: ' + entry.name + ' 의 k=' + entry.k\n        + ' 가 기저 버전 k=' + (base ? base.k : '없음') + ' 와 다르다');\n    }\n  }\n  // 포맷 공간 회계 (2026-08-24 V-CM 편입) — G 12칸 + 턴A V 표(6 + V-CM 3) 반영 후\n  // **잔여 0** 을 못 박는다. V-CMQ 보류의 산술 근거가 이 단언이다: 다음 소비자는\n  // 여기가 던지는 것을 보고 «빈 칸이 없다» 를 코드에서 확인하게 된다.\n  {\n    const banned = new Set([K1_RESERVED_FORMAT_INDEX, ...CUBE_AXIS_FORMAT_INDEXES]);\n    for (const k of [6, 8, 10]) {\n      let free = 0;\n      for (let value = 0; value <= 15; value += 1) {\n        if (banned.has(value)) continue;\n        if (!seen.has(value + '|' + k)) free += 1;\n      }\n      if (free !== 0) {\n        throw new Error('markerG: k' + k + ' 잔여 칸이 ' + free\n          + ' — 점유 회계가 «잔여 0» 주장과 다르다 (V-CMQ 보류 근거 재검토)');\n      }\n    }\n  }\n  // (family, version, centerQr) 커버리지 — 기저 버전×Q축마다 정확히 한 항목\n  // (빠지면 인코더가 던진다).\n  for (const spec of VERSIONS) {\n    markerGSpec('hex', spec.version, false);\n    markerGSpec('hex', spec.version, true);\n  }\n  for (const spec of VERSIONS_A) {\n    markerGSpec('tri', spec.version, false);\n    markerGSpec('tri', spec.version, true);\n  }\n  // defaultFinder — 항목마다 비어 있지 않고, 같은 패밀리(= 같은 자리 모양)는 같은\n  // 심볼을 든다. 값 자체(H·H2O)는 심볼 모듈의 로드 자기검증이 대조한다.\n  for (const entry of MARKER_G_FORMAT_INDEX) {\n    if (typeof entry.defaultFinder !== 'string' || entry.defaultFinder === '') {\n      throw new Error('markerG: ' + entry.name + ' 의 defaultFinder 가 비었다');\n    }\n  }\n  for (const family of ['hex', 'tri']) {\n    const symbols = new Set(MARKER_G_FORMAT_INDEX\n      .filter((entry) => entry.family === family)\n      .map((entry) => entry.defaultFinder));\n    if (symbols.size !== 1) {\n      throw new Error('markerG: ' + family + ' 패밀리의 defaultFinder 가 갈린다 — ' + [...symbols].join(','));\n    }\n  }\n}\n"],
  ["markerO", "/**\n * markerO.js — Type O 코너 **자리 예약** (O-CM) 레이아웃.\n *\n * ⚠ 2026-08-21 운영자 정정: O-CM 은 **파인더가 아니다.** 꼭짓점 자리 예약이다.\n *   그 자리에 들어가는 기본 파인더는 Type G → **H**. H 의 디자인은 여기서 짓지\n *   않는다 — 정본은 `src/finder-H.js` 다 (2026-08-21 편입: 코너 3 × 로컬 라벨\n *   A·B·C·D 의 면 톤 표. 좌표는 아래 `markerCells(k)` 에서 유도되므로 그 모듈에\n *   손 좌표가 없다). 이 모듈은 **자리**만 정하고 **심볼**은 finder-H 가 든다.\n *\n *   ⚠ 톤 적재는 **opt-in** (`markerTones`) 이다 — H 는 tetrad A(= 레거시 앵커\n *   3셀)까지 덮으므로 톤을 실은 프레임은 digit 기반 앵커 검출이 못 읽는다.\n *   `markerTones` 없이 부르면 인코더는 digit-only 마름모를 `palette.levels` 로\n *   칠하고, 그 경로는 편입 전과 바이트 동일이다.\n *\n *   ⚠ **분류상 H 는 분류 2** (OAK 공통 육각 영역 내 셀 표면 파인더 · 꼭짓점\n *   기준, 운영자 확정 2026-08-23) — H 12셀이 곧 이 모듈의 육각 경계 tetrad 라\n *   자리(o-cm)와 같은 칸이다. ~~분류 3 (VAK 확장 영역)~~ 은 편입 초기 표기다.\n *   `finder-taxonomy.js` 의 H **행 데이터**는 아직 class 3 이다 (SPEC.md §13 TBD).\n *\n * 운영자 지시: «O/K/A 타입도 마커 구현 필요. 인식 여건을 Y 계열과 같은 수준으로.»\n * Y 의 v0/v0X 코너 마커 문법을 육각 격자로 옮긴 것이다. **중앙 불스아이는 그대로\n * 두고** 코너 자리 예약은 «보조 앵커» 로만 쓴다 — 왜곡 시 호모그래피 보강 + 방향 확정.\n * (claude-oak-review.md §2.4: central-finder 는 no-go, 중앙 슬롯 교체 금지.)\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 1. 왜 «tetrad» 인가 — 측정이 정한 모양\n * ─────────────────────────────────────────────────────────────────────────\n * 육각 코너 셀은 영역 안 이웃이 정확히 3개다(6 중 3은 영역 밖). 그래서 «코너 셀 +\n * 영역 내 이웃 전부» 는 자동으로 4셀이고, 이보다 작으면 마커가 아니라 앵커이며\n * 이보다 크면 링을 따라 임의로 늘리는 선택이 된다. 이 4셀 묶음을 tetrad 라 한다.\n *\n * 교대 코너 3개(세트 A = `ANCHOR_CORNER_INDICES`)에만 놓는다. 실측 결과(전 k 공통):\n *\n *   | 가설 | 마커 12셀 중 마커로 되돌아오는 셀 |\n *   |---|---|\n *   | 항등 · 120° · 240° | **12/12** |\n *   | **60° · 180° · 300°** | **0/12** |\n *   | 거울 m0/m1/m2 (변 중점 축) | **0/12** |\n *   | 거울 m3/m4/m5 (코너 관통 축) | 12/12 |\n *\n * 즉 **60°급 오가설과 절반의 거울 가설은 톤을 보기도 전에 «위치» 로 죽는다** —\n * 그 가설에서 마커가 있어야 할 자리는 홀수 코너이고 거기엔 데이터가 있다.\n * claude-oak-review.md §1.3 이 «margin 이 커버하지 않는 클래스» 라 적은 바로 그\n * 60° 급을, 이 배치는 구조로 제거한다. 남는 것은 코너 관통 거울 3개뿐이고 그것은\n * 톤(면 배정)이 가른다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 2. 왜 «같은 로컬 튜플을 세 코너에 그대로 복사» 하는가 — 회전 margin 0.9444\n * ─────────────────────────────────────────────────────────────────────────\n * 물리 120° 회전은 «좌표 회전(rotate120) ∘ 면 순환(T→R→L)» 합성이다\n * (claude-oak-review.md §1.1, 이 모듈이 σ=[4,5,1,0,3,2] 로 독립 재현했고\n * `decoder/anchor-detect.js` 의 SIGMA_CW 와 값이 같다).\n *\n * 로컬 라벨(A,B,C,D)은 ρ-동변이다: ρ(T0.X) = T2.X, ρ²(T0.X) = T4.X. 그래서 세\n * tetrad 에 **같은 로컬 digit 튜플을 σ 없이 그대로** 쓰면, 회전한 코드가 내는 digit\n * 은 σ(d) 인데 정본은 d 라서 어긋난다. 그리고 **모든 d 에서 σ(d) 와 d 는 세 면이\n * 전부 다르다** — σ 가 고정점 없는 3-순환이고 digit→ranks 는 단사라 rank 가 같은\n * 면이 존재할 수 없다(대수적으로 증명되고 아래 자기검증이 실행 시 확인한다).\n *\n * 결과: 마커 12셀 × 3면 = 36 슬롯 중 **레거시 앵커 digit(5,0,0) 이 강제하는 2 슬롯만**\n * 회전 공변이고 나머지 34 는 전부 어긋난다 → **방향 margin = 1 − 2/36 = 0.9444.**\n * (대조: H2O(A) 0.6667 · H2CO3(K) 0.4667 · Benzene(O) 0.386 · v2r2 게이트 0.035.)\n * 전수 탐색으로 이 값이 «앵커 digit 을 유지하는 배정의 최대» 임을 확인했다(동률 1728).\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 3. 레거시 계약 보존\n * ─────────────────────────────────────────────────────────────────────────\n * - 코너 셀 A 는 **앵커 그대로** (digit 5/0/0, `placement.anchorCells`). 따라서\n *   `decoder/anchor-detect.js` 의 3점 앵커 판정은 **한 줄도 안 고치고** O-CM 에서도\n *   그대로 성립한다. 마커는 앵커를 대체하지 않고 **감싼다.**\n * - 불스아이(hexDistance ≤ 2) 무변경 — 실사 24/24 기준선을 건드리지 않는다.\n * - format/reference 는 `autoplaceHex.placeReservedCellsHex` 가 마커 점유를 피해\n *   재배치한다. 마커 없이 부르면 레거시 좌표와 바이트 동일이다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 4. 와이어 (formatIndex) — 내부 타입 G 전용 인덱스 (운영자 확정 2026-08-20)\n * ─────────────────────────────────────────────────────────────────────────\n * ~~O-CM 은 formatIndex 를 새로 만들지 않는다~~ — **뒤집혔다.** 옛 계약(«광학 검출 +\n * 사후 RS/CRC», Y2W 전례)은 실기에서 「코너 마커 코드가 스캔이 안 된다」로 반증됐다:\n * 레거시와 같은 인덱스로는 디코더가 마커 회계(scan order·오버헤드 차이)를 와이어에서\n * 구분할 수 없다. 운영자 확정으로 코너 마커는 **내부 타입 G** 다 — 턴A 전례를 따라\n * UI·분류상은 타입 O 그대로, formatIndex 만 전용 값을 싣는다. 배정 표는\n * `src/markerG.js` 가 유일한 진실이고, 아래 VERSIONS_OCM 의 formatIndex 는 그 표에서\n * 유도된다 (V1CM=6·V2CM=0·V3CM=1 — 값 근거·충돌 회계는 markerG 헤더).\n *\n * 런타임 의존성 0 · 순수 ESM.\n */\n\nimport { hexDistance, neighbors } from './hexgrid.js';\nimport {\n  FORMAT_RING,\n  ANCHOR_CORNER_INDICES,\n  corners,\n  anchorCells,\n  ringWalk,\n  rotate120,\n  rotate240,\n} from './placement.js';\nimport { occupiedCells as bullseyeCells } from './bullseye.js';\nimport { placeReservedCellsHex } from './autoplaceHex.js';\nimport { digitToRanks, ranksToDigit } from './lehmer.js';\nimport { markerGSpec } from './markerG.js';\nimport { maxBytesForSymbols } from './capacity.js';\nimport { errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\n\nconst MIN_K = FORMAT_RING + 1;\n\nfunction key(q, r) {\n  return q + ',' + r;\n}\n\nfunction assertK(k) {\n  if (!Number.isInteger(k) || k < MIN_K) {\n    throw new RangeError('k 는 ' + MIN_K + ' 이상의 정수여야 한다: ' + k);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// σ — 물리 120° CW 회전의 digit 치환 (면 내용이 T→R→L 로 간다)\n// ─────────────────────────────────────────────────────────────────────────\n\n/** digit d 를 물리 120° CW 회전 후의 digit 으로. `anchor-detect.SIGMA_CW` 와 동일. */\nexport function rotateDigitCw(d) {\n  const r = digitToRanks(d);\n  return ranksToDigit({ T: r.L, L: r.R, R: r.T });\n}\n\n/** digit d 를 물리 240°(= CCW 120°) 회전 후의 digit 으로. */\nexport function rotateDigitCcw(d) {\n  return rotateDigitCw(rotateDigitCw(d));\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// tetrad 기하 — 로컬 라벨 A(코너) · B · C · D\n// ─────────────────────────────────────────────────────────────────────────\n\n/** 로컬 라벨 순서 (마커 셀 나열·digit 튜플의 정준 순서). */\nexport const MARKER_LABELS = Object.freeze(['A', 'B', 'C', 'D']);\n\n/**\n * 코너 0(= (k,0)) tetrad 의 로컬 좌표. 나머지 두 코너는 ρ / ρ² 상이다.\n *   A = (k, 0)   코너 셀 (= 레거시 앵커)\n *   B = (k, −1)  링 k 이웃\n *   C = (k−1, 1) 링 k 이웃\n *   D = (k−1, 0) 링 k−1 이웃 (안쪽)\n * @param {number} k\n */\nexport function tetradBase(k) {\n  assertK(k);\n  return Object.freeze({\n    A: Object.freeze({ q: k, r: 0 }),\n    B: Object.freeze({ q: k, r: -1 }),\n    C: Object.freeze({ q: k - 1, r: 1 }),\n    D: Object.freeze({ q: k - 1, r: 0 }),\n  });\n}\n\n/**\n * 절대 톤 표 조회 — 마커 셀 «전부» 의 톤이 있어야 한다. 누락을 조용한 digit 폴백으로\n * 덮지 않고 즉시 던진다 (`markerA.toneTripleFrom` 과 같은 계약).\n */\nfunction toneTripleFrom(tonesByKey, q, r) {\n  const kk = key(q, r);\n  const raw = tonesByKey instanceof Map ? tonesByKey.get(kk) : tonesByKey[kk];\n  if (!raw || typeof raw !== 'object') {\n    throw new RangeError('markerO: 톤 표에 ' + kk + ' 가 없다 — 마커 셀 전부의 톤이 필요하다');\n  }\n  const tones = {};\n  for (const face of ['T', 'L', 'R']) {\n    const tone = raw[face];\n    if (tone !== 0 && tone !== 1 && tone !== 2) {\n      throw new RangeError('markerO: ' + kk + '.' + face + ' 톤이 0/1/2 가 아니다: ' + tone);\n    }\n    tones[face] = tone;\n  }\n  return tones;\n}\n\n/**\n * 마커 로컬 digit 튜플 (B, C, D). A 는 앵커 digit 이라 여기 없다.\n *\n * 선택 규칙 (전수 후보 1728 중에서, 아래 셋으로 유일하게 좁혀진다):\n *   ① A·B·C·D 네 digit 이 서로 다르다 — 코너 셀 A 가 코너 0 에서 5, 코너 2·4 에서\n *      0 이므로 {0,5} 를 피한다 → B,C,D ∈ {1,2,3,4}.\n *   ② tetrad 안에서 세 면 {A.L, C.T, D.R} 은 **한 꼭짓점에 모이는 3-마름모**다\n *      (면 폴리곤 변 공유로 실측). 이 셋의 rank 를 서로 다르게 두면 마커마다\n *      «중앙 불스아이와 같은 3톤 큐브» 가 하나씩 생긴다 — 연속 회전각을 읽을 수 있는\n *      Y-접합이고(`decoder/cube-bullseye.readCubeOrientation` 과 같은 계열),\n *      국소 정합의 기준점이 된다.\n *   ③ ①+② 를 동시에 만족하는 것은 (C,D) = (1,2) 또는 (3,4) 두 갈래뿐이고, 남는\n *      B 는 각각 {3,4} · {1,2} 다.\n * 그중 **B=4 · C=1 · D=2** 를 채택한다 — 두 갈래의 3톤 큐브 위상이 서로 거울이고\n * (1,2,0) 쪽이 중앙 불스아이 큐브의 정본 위상(`finder-oak-candidates.json`\n * toneRanks T2·L1·R0 의 순환 방향)과 같은 손잡이라 코드 전체의 큐브 방향이 통일된다.\n *\n * @type {Readonly<{B:number, C:number, D:number}>}\n */\nexport const MARKER_LOCAL_DIGITS = Object.freeze({ B: 4, C: 1, D: 2 });\n\nfunction applyRotation(cell, times) {\n  if (times === 0) return { q: cell.q, r: cell.r };\n  if (times === 1) return rotate120(cell.q, cell.r);\n  return rotate240(cell.q, cell.r);\n}\n\n/**\n * 마커 12셀 — 코너 3개 × tetrad 4셀. 각 원소는 좌표 + digit + 로컬 라벨 + 코너 인덱스.\n * 순서는 코너(세트 A 열거 순) → 라벨(A,B,C,D) 로 결정적이다.\n *\n * `tonesByKey`(\"q,r\" → {T,L,R}, Map 또는 평범한 객체)를 주면 각 셀에 절대 톤\n * `tones: {T,L,R}` (0/1/2)가 실린다 — `markerCellsA` 와 같은 계약 (누락·범위 밖은\n * 즉시 RangeError, 조용한 digit 폴백 금지). 무인자 호출 산출은 바이트 동일하다.\n * @param {number} k\n * @param {Map<string,{T:number,L:number,R:number}>|Record<string,{T:number,L:number,R:number}>} [tonesByKey]\n * @returns {{q:number, r:number, digit:number, label:string, corner:number, role:'anchor'|'marker', tones?:{T:number,L:number,R:number}}[]}\n */\nexport function markerCells(k, tonesByKey) {\n  assertK(k);\n  const base = tetradBase(k);\n  const anchors = anchorCells(k);\n  const out = [];\n  for (let m = 0; m < ANCHOR_CORNER_INDICES.length; m += 1) {\n    const cornerIndex = ANCHOR_CORNER_INDICES[m];\n    const anchor = anchors[m];\n    for (const label of MARKER_LABELS) {\n      const p = applyRotation(base[label], m);\n      if (label === 'A') {\n        if (p.q !== anchor.q || p.r !== anchor.r) {\n          throw new Error('markerO: tetrad A 가 앵커 좌표와 어긋난다 — ρ 궤도 가정 위반');\n        }\n        out.push({\n          q: p.q, r: p.r, digit: anchor.digit, label, corner: cornerIndex, role: 'anchor',\n        });\n      } else {\n        out.push({\n          q: p.q,\n          r: p.r,\n          digit: MARKER_LOCAL_DIGITS[label],\n          label,\n          corner: cornerIndex,\n          role: 'marker',\n        });\n      }\n    }\n  }\n  if (tonesByKey === undefined) return out;\n  return out.map((cell) => ({ ...cell, tones: toneTripleFrom(tonesByKey, cell.q, cell.r) }));\n}\n\n/** 마커가 점유하는 좌표 집합 (앵커 3셀 포함, 12개). */\nexport function markerPositionSet(k) {\n  return new Set(markerCells(k).map((c) => key(c.q, c.r)));\n}\n\n/** 코너별 tetrad — 검출기가 «코너 단위» 로 다루기 위한 묶음.\n *  `tonesByKey` 는 `markerCells` 로 그대로 승계된다 (절대 톤 검증용). */\nexport function markerTetrads(k, tonesByKey) {\n  const cells = markerCells(k, tonesByKey);\n  const byCorner = new Map();\n  for (const c of cells) {\n    if (!byCorner.has(c.corner)) byCorner.set(c.corner, []);\n    byCorner.get(c.corner).push(c);\n  }\n  return Array.from(byCorner.entries()).map(([cornerIndex, list]) => ({\n    corner: cornerIndex,\n    cells: list,\n  }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 배치 — autoplaceHex 로 format/reference 재유도\n// ─────────────────────────────────────────────────────────────────────────\n\n/** 검출기 점유 = 불스아이 풋프린트(19) + 마커 12셀. */\nexport function reservedOccupiedOMarker(k) {\n  assertK(k);\n  const out = bullseyeCells().map((c) => ({ q: c.q, r: c.r }));\n  for (const c of markerCells(k)) out.push({ q: c.q, r: c.r });\n  return out;\n}\n\nconst placementCache = new Map();\n\n/** O-CM 의 format 15 · reference 2(k−2) 배치 (autoplaceHex 산출, k 당 1회 캐시). */\nexport function placementOMarker(k) {\n  assertK(k);\n  if (!placementCache.has(k)) {\n    placementCache.set(k, placeReservedCellsHex(k, reservedOccupiedOMarker(k)));\n  }\n  return placementCache.get(k);\n}\n\nexport function formatCellsOMarker(k) {\n  return placementOMarker(k).formatCells;\n}\n\nexport function referenceCellsOMarker(k) {\n  return placementOMarker(k).referenceCells;\n}\n\n/**\n * 역할 집합. 'marker' 는 앵커와 별개 역할이다 — 코너 셀 A 는 계속 'anchor' 이고\n * B·C·D 만 'marker' 다 (레거시 앵커 계약 보존, 모듈 헤더 §3).\n * @param {number} k\n */\nexport function buildRoleSetsOMarker(k) {\n  assertK(k);\n  const anchor = new Set();\n  const marker = new Set();\n  for (const c of markerCells(k)) {\n    (c.role === 'anchor' ? anchor : marker).add(key(c.q, c.r));\n  }\n  const format = new Set(formatCellsOMarker(k).map((c) => key(c.q, c.r)));\n  const reference = new Set(referenceCellsOMarker(k).map((c) => key(c.q, c.r)));\n  return {\n    anchor, marker, format, reference,\n  };\n}\n\n/**\n * 셀 역할 — `placement.roleOf` 와 같은 값 집합에 'marker' 만 추가된다.\n * @returns {'bullseye'|'anchor'|'marker'|'format'|'reference'|'data'}\n */\nexport function roleOfOMarker(q, r, k, roleSets) {\n  if (hexDistance(q, r) <= 2) return 'bullseye';\n  const sets = roleSets || buildRoleSetsOMarker(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.marker.has(kk)) return 'marker';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n\n/** 데이터 셀 scan order — `layout.dataCellsInScanOrder` 와 같은 규칙(링 major 3..k). */\nexport function dataCellsInScanOrderOMarker(k) {\n  assertK(k);\n  const sets = buildRoleSetsOMarker(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) {\n    for (const cell of ringWalk(r)) {\n      if (roleOfOMarker(cell.q, cell.r, k, sets) === 'data') out.push(cell);\n    }\n  }\n  return out;\n}\n\n/** 필러 셀 — scan order 꼬리 (C mod 3). */\nexport function fillerCellsOMarker(k) {\n  const scan = dataCellsInScanOrderOMarker(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n/** 오버헤드 실계산 — 불스아이 + 앵커 + 마커(9) + 포맷 + 레퍼런스. */\nexport function overheadBreakdownOMarker(k) {\n  assertK(k);\n  const cells = markerCells(k);\n  const anchor = cells.filter((c) => c.role === 'anchor').length;\n  const marker = cells.filter((c) => c.role === 'marker').length;\n  const bullseye = bullseyeCells().length;\n  const format = formatCellsOMarker(k).length;\n  const reference = referenceCellsOMarker(k).length;\n  return {\n    k,\n    bullseye,\n    anchor,\n    marker,\n    format,\n    reference,\n    total: bullseye + anchor + marker + format + reference,\n  };\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 용량 — Y2W 전례를 따른 «변형 표»\n// ─────────────────────────────────────────────────────────────────────────\n//\n// 산출 절차는 `capacityY.js` NSYM_TABLE_Y 헤더가 적은 것과 **완전히 같다**:\n//   M = round(0.25·S) (JS half-up), 짝수면 +1 홀수화 · L = round(0.12·S) · H = round(0.40·S)\n//   V1CM S=24  → M round(6)=6(짝) → 7    · L round(2.88)=3  · H round(9.6)=10\n//   V2CM S=53  → M round(13.25)=13(홀)   · L round(6.36)=6  · H round(21.2)=21\n//   V3CM S=89  → M round(22.25)=22(짝)→23 · L round(10.68)=11 · H round(35.6)=36\n// 이 표는 **제안**이다 — 확정(비준)은 운영자 몫이고, 그 전까지 O-CM 은 실험 경로다.\n\n/** @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>} */\nexport const NSYM_TABLE_OCM = Object.freeze({\n  V1CM: Object.freeze({\n    symbols: 24, L: 3, M: 7, H: 10,\n  }),\n  V2CM: Object.freeze({\n    symbols: 53, L: 6, M: 13, H: 21,\n  }),\n  V3CM: Object.freeze({\n    symbols: 89, L: 11, M: 23, H: 36,\n  }),\n});\n\n/** O-CM 버전 정의 — formatIndex 는 내부 타입 G 표(`markerG.js`)에서 유도한다(모듈 헤더 §4). */\nexport const VERSIONS_OCM = Object.freeze([\n  Object.freeze({\n    name: 'V1CM', version: 1, k: 6, formatIndex: markerGSpec('hex', 1).formatIndex, overhead: overheadBreakdownOMarker(6).total, symbolKey: 'V1CM',\n  }),\n  Object.freeze({\n    name: 'V2CM', version: 2, k: 8, formatIndex: markerGSpec('hex', 2).formatIndex, overhead: overheadBreakdownOMarker(8).total, symbolKey: 'V2CM',\n  }),\n  Object.freeze({\n    name: 'V3CM', version: 3, k: 10, formatIndex: markerGSpec('hex', 3).formatIndex, overhead: overheadBreakdownOMarker(10).total, symbolKey: 'V3CM',\n  }),\n]);\n\n/**\n * O-CM 한 버전의 용량. `capacity.capacityFor` 회계를 그대로 승계한다 — 표와 실계산이\n * 어긋나면 조용히 맞추지 않고 던진다.\n * @param {{name:string, version:number, k:number, overhead:number, symbolKey:string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForOMarker(spec, level = 'M') {\n  const totalCells = 3 * spec.k * spec.k + 3 * spec.k + 1;\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(spec.name + ': 오버헤드 ' + spec.overhead + ' 가 총 셀 ' + totalCells + ' 이상이다');\n  }\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE_OCM[spec.symbolKey];\n  if (!table) throw new RangeError(spec.name + ': NSYM_TABLE_OCM 에 키 ' + spec.symbolKey + ' 가 없다');\n  if (table.symbols !== usedSymbols) {\n    throw new RangeError(\n      spec.name + ': 실계산 사용 심볼 ' + usedSymbols + ' 이 NSYM_TABLE_OCM.'\n      + spec.symbolKey + '.symbols (' + table.symbols + ') 과 어긋난다',\n    );\n  }\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(spec.name + ': NSYM_TABLE_OCM.' + spec.symbolKey + ' 에 레벨 ' + level + ' 이 없다');\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(spec.name + '/' + level + ': nsym ' + nsym + ' 이 사용 심볼 ' + usedSymbols + ' 이상이다');\n  }\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n  return {\n    name: spec.name,\n    version: spec.version,\n    k: spec.k,\n    cornerMarker: true,\n    formatIndex: spec.formatIndex,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/** 전 버전 O-CM 용량표. */\nexport function capacityTableOMarker(level = 'M') {\n  return VERSIONS_OCM.map((v) => capacityForOMarker(v, level));\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 방향 margin (이상·무노이즈) — 설계 근거 수치를 코드가 낸다\n// ─────────────────────────────────────────────────────────────────────────\n\n/**\n * 마커 12셀 × 3면 = 36 슬롯에서, 물리 회전(좌표 회전 ∘ 면 순환)한 패턴과 원본의\n * 일치율의 최대치를 1 에서 뺀 값. `claude-oak-review.md` §1.2 와 같은 메트릭이다.\n * @param {number} k\n * @returns {{margin:number, slots:number, agree120:number, agree240:number}}\n */\nexport function orientationMarginOMarker(k) {\n  const cells = markerCells(k);\n  const byPos = new Map(cells.map((c) => [key(c.q, c.r), c.digit]));\n  function agreeFor(rotCell, rotDigit) {\n    let agree = 0;\n    for (const c of cells) {\n      const p = rotCell(c.q, c.r);\n      const there = byPos.get(key(p.q, p.r));\n      if (there === undefined) continue; // 위치로 이미 죽은 슬롯 — 톤 비교 대상 아님\n      const moved = digitToRanks(rotDigit(c.digit));\n      const truth = digitToRanks(there);\n      if (moved.T === truth.T) agree += 1;\n      if (moved.L === truth.L) agree += 1;\n      if (moved.R === truth.R) agree += 1;\n    }\n    return agree;\n  }\n  const slots = cells.length * 3;\n  const agree120 = agreeFor((q, r) => rotate120(q, r), rotateDigitCw);\n  const agree240 = agreeFor((q, r) => rotate240(q, r), rotateDigitCcw);\n  return {\n    margin: 1 - Math.max(agree120, agree240) / slots,\n    slots,\n    agree120,\n    agree240,\n  };\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 — 설계 주장이 실행 시 참인지 즉시 확인한다\n// ─────────────────────────────────────────────────────────────────────────\n{\n  // ① σ 는 고정점 없는 3-순환이라 어떤 digit 도 자기 자신과 면이 겹치지 않는다.\n  for (let d = 0; d < 6; d += 1) {\n    const a = digitToRanks(d);\n    for (const s of [rotateDigitCw(d), rotateDigitCcw(d)]) {\n      const b = digitToRanks(s);\n      if (a.T === b.T || a.L === b.L || a.R === b.R) {\n        throw new Error('markerO: σ 가 digit ' + d + ' 에서 면을 고정한다 — 설계 전제 위반');\n      }\n    }\n  }\n  // ② 마커 위치 집합은 ρ-불변이고 60°·180°·300° 에서는 겹침 0 이어야 한다.\n  for (const k of [6, 8, 10]) {\n    const set = markerPositionSet(k);\n    const maps = [\n      ['120', (q, r) => rotate120(q, r), true],\n      ['240', (q, r) => rotate240(q, r), true],\n      ['60', (q, r) => ({ q: -r, r: q + r }), false],\n      ['180', (q, r) => ({ q: -q, r: -r }), false],\n      ['300', (q, r) => ({ q: q + r, r: -q }), false],\n    ];\n    for (const [name, f, wantInvariant] of maps) {\n      let hit = 0;\n      for (const kk of set) {\n        const [q, r] = kk.split(',').map(Number);\n        const p = f(q, r);\n        if (set.has(key(p.q, p.r))) hit += 1;\n      }\n      const want = wantInvariant ? set.size : 0;\n      if (hit !== want) {\n        throw new Error('markerO k=' + k + ': ' + name + '° 겹침 ' + hit + ' 이 기대 ' + want + ' 와 다르다');\n      }\n    }\n    // ③ 마커·포맷·레퍼런스·불스아이가 서로 안 겹친다.\n    const seen = new Set();\n    for (const c of [...markerCells(k), ...formatCellsOMarker(k), ...referenceCellsOMarker(k),\n      ...bullseyeCells()]) {\n      const kk = key(c.q, c.r);\n      if (seen.has(kk)) throw new Error('markerO k=' + k + ': 역할 좌표 충돌 ' + kk);\n      seen.add(kk);\n    }\n    // ④ 회계 항등 — 총 셀 = 오버헤드 + 데이터.\n    const ob = overheadBreakdownOMarker(k);\n    const total = 3 * k * k + 3 * k + 1;\n    const scan = dataCellsInScanOrderOMarker(k).length;\n    if (total !== ob.total + scan) {\n      throw new Error('markerO k=' + k + ': 회계 불일치 total=' + total + ' overhead=' + ob.total + ' data=' + scan);\n    }\n  }\n}\n"],
  ["finder-H", "/**\n * finder-H.js — H 파인더 (타입 G 기본 파인더)의 «톤 정본».\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 1. 지위 — CM 은 «자리 예약», 그 자리의 «심볼» 이 기본 파인더다\n * ─────────────────────────────────────────────────────────────────────────\n * 운영자 결정 (2026-08-21): CM 계열은 파인더가 아니라 자리 예약 개념으로 격하됐고,\n * 그 자리에 들어가는 심볼이 기본 파인더다 — Type A 자리(A-CM 21셀)엔 H2O\n * (`markerA.js` H2O_LOCAL_TONES_A), Type G(= O + 코너 예약) 자리(O-CM 12셀)엔\n * **H** (이 모듈). 배정은 `markerG.js` 표의 `defaultFinder` 열이 든다.\n *\n * H 는 **확장 영역만 쓰는 파인더**다 — 중앙 19셀 슬롯·OAK 공통 영역과 분리된 축이고,\n * `finderStarter: bullseye` 는 「중앙은 불스아이 그대로」라는 기준선 선언이지 대체가\n * 아니다. 실측: 정본 export 의 중앙 `cellMasks` 19개는 `cell-editor-core.js`\n * `bullseyeCellMasks()` 산출과 **바이트 동일**이다 (claude-h-probe ④) — 즉 중앙\n * 슬롯 표현은 이미 있는 것과 정확히 대응하고, 새 중앙 파인더는 만들지 않는다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 2. 정본과 발자국 — 12셀 = markerCells(6), 손 좌표 없음\n * ─────────────────────────────────────────────────────────────────────────\n * 정본: 셀 편집기 v2 export `finder-H.json` (운영자 제공 2026-08-21 · type O ·\n * k=6 · full-surface · starter bullseye). repo 사본: `test/output/lanes/finder-H.json`\n * (바이트 동일). 유도 규약은 OAK 와 같다 — export 에 없는 면은 중간톤(1).\n * toneOverrides 30항목이 닿는 12셀은 **`markerCells(6)` 위치와 완전 일치**한다\n * (12/12 · 어긋남 0, `test/output/lanes/h-footprint-check.mjs` 재현). 그래서 좌표는\n * 이 모듈에 없다 — 아래 표는 코너×로컬라벨(A·B·C·D)로만 적히고, 좌표는 전부\n * `markerO.markerCells(k)` 에서 유도된다 (좌표 손 나열은 이 저장소 최다 결함).\n *\n * 12셀 중 6은 정본 편집기에서도 detector(비-데이터)고 6은 데이터 셀에 톤만 덮은\n * 것이다 (counts.detector 6) — H2O(18 전부 detector)보다 데이터 손실이 작다.\n * O-CM 레이아웃에서는 12셀 전부가 이미 예약석(앵커 3 + 마커 9)이라 회계 무변화다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 3. k=8·10 유도 규칙 — 로컬 라벨 복사 (ringCentersA 전례)\n * ─────────────────────────────────────────────────────────────────────────\n * 정본은 k=6 뿐이다. `markerA.js` 가 「같은 로컬 라벨을 링 중심에 복사」로 전 k 를\n * 유도했듯, H 는 **같은 (코너, 라벨) 튜플을 markerCells(k) 가 주는 그 k 의 tetrad\n * 자리에 복사**한다. tetrad 로컬 구조(A=코너, B·C·D 이웃)는 k 무관하게 동형이고\n * (markerO `tetradBase`), 위치의 영역 안·ρ-불변·역할 무충돌은 markerO 로드\n * 자기검증이 k=6/8/10 전부에서 이미 강제한다. 그래서 규칙은 전 k 에서 성립한다 —\n * 값 확인은 `test/finder-H.test.js` ②.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 4. 렌더 계약 — 팔레트는 palette.levels, 파인더 축 금지\n * ─────────────────────────────────────────────────────────────────────────\n * 셀 entry 에 `tones: {T,L,R}` 를 실으면 `scene.js` faceColor 가 **데이터와 같은\n * `palette.levels`** 로 그린다. 파인더 축(bullseyeLight = 순백)은 금지 — 순백이\n * 안전영역·흰 지면과 구별되지 않아 실루엣에 구멍이 나고 원거리 인식률이 떨어진다\n * (2026-08-20 실기기 실측, `scene.js` faceColor 헤더). 구별은 색이 아니라 «조합»\n * 이다: H 12셀 중 6셀이 비-순열(전면 동톤 3 포함)이라 데이터 셀이 만들 수 없다.\n * digit 층은 그대로 남는다 — digit 은 와이어·알파벳 계약이고 tones 는 심볼 오버레이다.\n *\n * ⚠ 알려진 공백 (실측 2026-08-21, `claude-h-decode-probe.mjs`): H 는 tetrad A\n * (= 레거시 앵커 3셀)까지 덮으므로, 톤을 실은 프레임은 digit 기반 앵커 검출이\n * 못 읽는다 (H2O 는 앵커를 안 덮어 이 공백이 없다). 그래서 `encode.js` 의 톤 적재는\n * **opt-in** (`markerTones`) 이고 기본 digit 렌더는 바이트 동일이다 — 검출기 배선과\n * 기본값 전환은 통합자 몫이다 (`test/finder-H.test.js` ⑥ 이 공백을 잠근다).\n *\n * 런타임 의존성 0 · 순수 ESM.\n */\n\nimport { markerCells, MARKER_LABELS } from './markerO.js';\nimport { ANCHOR_CORNER_INDICES } from './placement.js';\nimport { markerGSpec } from './markerG.js';\nimport { VERSIONS } from './capacity.js';\n\n/** 심볼 이름 — `markerG.js` 표의 `defaultFinder` 값과 같은 문자열. */\nexport const H_NAME = 'H';\n\nfunction key(q, r) {\n  return q + ',' + r;\n}\n\n/**\n * 정본 H 의 면별 톤 — k=6 편집기 export 를 코너(0·2·4) × 로컬 라벨(A·B·C·D)에 고정.\n * 다른 k 는 같은 로컬 라벨을 그 k 의 tetrad 자리에 복사한다 (`hTonesByKeyO`).\n * export 에 없는 면은 중간톤 1 (편집기 v2 규약 — 36면 중 6면이 그렇다).\n * 실측: 비-순열 6셀 (전면 동톤 3셀 포함) · 세 코너 튜플이 서로 다르다.\n */\nexport const H_LOCAL_TONES_O = Object.freeze({\n  0: Object.freeze({\n    A: Object.freeze({ T: 0, L: 0, R: 0 }),\n    B: Object.freeze({ T: 1, L: 0, R: 2 }),\n    C: Object.freeze({ T: 2, L: 0, R: 1 }),\n    D: Object.freeze({ T: 1, L: 0, R: 2 }),\n  }),\n  2: Object.freeze({\n    A: Object.freeze({ T: 0, L: 2, R: 0 }),\n    B: Object.freeze({ T: 0, L: 0, R: 2 }),\n    C: Object.freeze({ T: 2, L: 2, R: 2 }),\n    D: Object.freeze({ T: 2, L: 0, R: 0 }),\n  }),\n  4: Object.freeze({\n    A: Object.freeze({ T: 0, L: 0, R: 0 }),\n    B: Object.freeze({ T: 2, L: 0, R: 1 }),\n    C: Object.freeze({ T: 1, L: 2, R: 0 }),\n    D: Object.freeze({ T: 2, L: 1, R: 0 }),\n  }),\n});\n\n/** 정본 H 톤을 k 의 마커 좌표로 전개한 표 (\"q,r\" → {T,L,R}) — 좌표는 markerCells 유도. */\nexport function hTonesByKeyO(k) {\n  const map = new Map();\n  for (const cell of markerCells(k)) {\n    const corner = H_LOCAL_TONES_O[cell.corner];\n    const tones = corner && corner[cell.label];\n    if (!tones) {\n      throw new Error('finder-H: 로컬 표에 코너 ' + cell.corner + ' 라벨 ' + cell.label + ' 가 없다');\n    }\n    map.set(key(cell.q, cell.r), tones);\n  }\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 (markerA 전례) — 표의 주장들이 거짓이면 즉시 throw\n// ─────────────────────────────────────────────────────────────────────────\n{\n  // ① 표의 키가 정확히 코너 3 × 라벨 4 이고 톤이 0/1/2 다.\n  const corners = Object.keys(H_LOCAL_TONES_O).map(Number).sort((a, b) => a - b);\n  if (corners.join(',') !== [...ANCHOR_CORNER_INDICES].sort((a, b) => a - b).join(',')) {\n    throw new Error('finder-H: 표의 코너가 ANCHOR_CORNER_INDICES 와 다르다: ' + corners);\n  }\n  for (const corner of corners) {\n    const labels = Object.keys(H_LOCAL_TONES_O[corner]).sort();\n    if (labels.join(',') !== [...MARKER_LABELS].sort().join(',')) {\n      throw new Error('finder-H: 코너 ' + corner + ' 의 라벨이 MARKER_LABELS 와 다르다');\n    }\n    for (const label of labels) {\n      for (const face of ['T', 'L', 'R']) {\n        const tone = H_LOCAL_TONES_O[corner][label][face];\n        if (tone !== 0 && tone !== 1 && tone !== 2) {\n          throw new Error('finder-H: ' + corner + '.' + label + '.' + face + ' 톤이 0/1/2 가 아니다');\n        }\n      }\n    }\n  }\n  // ② 전 k 에서 마커 12셀 전부에 톤이 실린다 (markerCells 의 톤 계약이 누락을 던진다).\n  for (const k of [6, 8, 10]) {\n    const cells = markerCells(k, hTonesByKeyO(k));\n    if (cells.length !== 12 || cells.some((c) => !c.tones)) {\n      throw new Error('finder-H k=' + k + ': 톤 적재가 12셀을 다 못 덮는다');\n    }\n  }\n  // ③ 심볼다움 — 비-순열 셀이 실재하고(digit 경로가 못 그리는 이유), 톤이 균일하지\n  //    않으며(검출 가능성, finder-oak-patterns ③ 전례), 세 코너 튜플이 서로 다르다\n  //    (방향 비공변 — O-CM digit 층과 달리 톤 층은 코너 자체로 갈린다).\n  const tuples = corners.map((corner) => MARKER_LABELS\n    .map((label) => ['T', 'L', 'R'].map((face) => H_LOCAL_TONES_O[corner][label][face]).join(''))\n    .join('|'));\n  if (new Set(tuples).size !== 3) {\n    throw new Error('finder-H: 코너 튜플이 서로 같다 — 코너 구별이 죽는다');\n  }\n  let nonPermutation = 0;\n  const seenTones = new Set();\n  for (const corner of corners) {\n    for (const label of MARKER_LABELS) {\n      const t = H_LOCAL_TONES_O[corner][label];\n      seenTones.add(t.T).add(t.L).add(t.R);\n      if (new Set([t.T, t.L, t.R]).size < 3) nonPermutation += 1;\n    }\n  }\n  if (nonPermutation === 0) {\n    throw new Error('finder-H: 비-순열 셀이 없다 — digit 알파벳으로 충분했다는 뜻이 된다');\n  }\n  if (seenTones.size < 2) throw new Error('finder-H: 톤이 균일하다 — 검출 불가');\n  // ④ markerG 표와의 연결 — hex(타입 G) 전 버전의 기본 파인더가 H 로 적혀 있다.\n  for (const spec of VERSIONS) {\n    if (markerGSpec('hex', spec.version).defaultFinder !== H_NAME) {\n      throw new Error('finder-H: markerG hex V' + spec.version + ' 의 defaultFinder 가 H 가 아니다');\n    }\n  }\n}\n"],
  ["markerA", "/**\n * markerA.js — Type A 코너 **자리 예약** (A-CM) 레이아웃.\n *\n * ⚠ 2026-08-21 운영자 정정: A-CM 은 **파인더가 아니다.** 꼭짓점 자리 예약이다.\n *   그 자리에 들어가는 기본 파인더는 **H2O**. H2O 는 확장 영역만 쓰는 파인더이며\n *   `finderStarter`(`central-cube-3tone`) 는 올라탄 기준선이지 H2O 의 내용이\n *   아니다. 「H2O 가 중앙 3톤 큐브를 파인더로 갖는다」·「A-CM 이 H2O 의 중앙\n *   파인더를 버렸다」는 오독이다. 발자국(꼭짓점 2칸 안쪽 링)을 승계한 것과\n *   중앙 슬롯을 버린 것은 다른 축이다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 1. 정본 H2O 의 «발자국» 은 그대로, «톤» 은 못 쓴다 — 실측이 가른 것\n * ─────────────────────────────────────────────────────────────────────────\n * 정본 후보 H2O(`finder-oak-candidates.json`, A·k=4·코너 18셀)를 코드로 되짚었더니\n * 그 18셀은 임의 배치가 아니라 **꼭짓점에서 2칸 안쪽 셀을 중심으로 한 반경-1 육각 링**\n * 3개였다 (집합 동일성 실측: k=4 에서 `userNonData` 18셀과 정확히 일치). 그리고 그\n * 규칙은 k=6·8·10 에서도 전부 영역 안에 들어온다. → **발자국은 정본을 그대로 쓴다.**\n * 중심 3셀까지 더한 21셀이 `claude-oak-review.md` §1.2 가 «슬롯 63» 으로 센 집합이고,\n * 이 모듈도 21셀을 쓴다.\n *\n * 반면 **H2O 의 톤 정본은 Type A 알파벳(순위 순열)으로 표현할 수 없다.** 21셀 중\n * **9셀이 비-순열**이다 (예: 링 중심 (3,−6) = (2,2,2) 전면 밝음 · (2,−6) = (2,2,0)).\n * digit 경로(`digitToRanks` → `palette.levels`)는 그런 셀을 못 그린다.\n *\n * 2026-08-20: **렌더러 계약이 열렸다.** `scene.js` 는 `entry.tones` 가 있으면 면별\n * 절대 톤을 파인더 축(bullseyeLight / BULLSEYE_MID / bullseyeDark)으로 그린다.\n * 이 모듈은 정본 H2O 톤을 `h2oTonesByKeyA(k)` 로 실어 주고, A-CM 검출 진입점\n * (`findACornerMarkerHypotheses`)이 그 표를 기본값으로 관통한다. 무인자\n * `markerCellsA(k)` 산출은 그대로 digit-only 다 — 톤은 명시적으로 실어야 한다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 2. 방향 margin 1.0000 — A 는 O 보다 깨끗하다\n * ─────────────────────────────────────────────────────────────────────────\n * O-CM 은 코너 셀이 레거시 앵커(digit 5/0/0)라 36 슬롯 중 2 가 회전 공변으로 남았다.\n * **A 의 마커는 꼭짓점 앵커를 포함하지 않는다** — 링 중심이 꼭짓점에서 2칸 안쪽이라\n * 링 6셀도 앵커에 안 닿는다. 그래서 앵커 제약이 없고, 63 슬롯 전부를 비공변으로 둘 수 있다.\n *\n * 배정 규칙: ρ 는 링 방향 인덱스를 i → i+2 로 보낸다(`AXIAL_DIRECTIONS` 순서 기준).\n * 그래서 링 digit 을 **인덱스 패리티로만** 정하면(주기 2) 회전 후 비교 대상이 항상\n * 같은 digit 이 되고, `σ(d)` 와 `d` 는 세 면이 전부 다르므 SIONS_A } from './capacityA.js';\nimport { markerGSpec } from './markerG.js';\nimport { rotateDigitCw, rotateDigitCcw } from './markerO.js';\n\nexport const AUTOPLACE_TRI_PATCH_REF = 'AUTOPLACE_TRI_PATCH_REF';\n\nfunction key(q, r) {\n  return q + ',' + r;\n}\n\nfunction assertK(k) {\n  if (!Number.isInteger(k) || k < 4) {\n    throw new RangeError('k 는 4 이상의 정수여야 한다: ' + k);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 기하 — 링 중심 3개 + 반경-1 링 18셀\n// ─────────────────────────────────────────────────────────────────────────\n\n/** 링 중심 3셀 (top → BR → BL, ρ 궤도). 정본 H2O 유도값. */\nexport function ringCentersA(k) {\n  assertK(k);\n  const top = { q: k - 1, r: -2 * k + 2 };\n  const br = rotate120(top.q, top.r);\n  const bl = rotate240(top.q, top.r);\n  return [top, br, bl];\n}\n\n/**\n * 마커 로컬 digit — 중심 Z 와 링 인덱스 패리티 두 값.\n * 링 digit 을 패리티로만 정하는 이유는 모듈 헤더 §2 (ρ 가 i → i+2).\n * 값은 markerO 의 알파벳(4·1·2)과 맞춰 코드 전체에서 마커 digit 어휘를 통일했다.\n */\nexport const MARKER_LOCAL_DIGITS_A = Object.freeze({ ringEven: 4, ringOdd: 1, center: 2 });\n\n/**\n * 정본 H2O 의 면별 톤 — k=4 편집기 export 를 로컬 라벨(Z, R0..R5) × 코너에 고정.\n * 다른 k 는 같은 로컬 라벨을 링 중심에 복사한다 (`h2oTonesByKeyA`).\n * export 에 없는 면은 중간색 1 (편집기 v2 규약). 실측: 비-순열 9셀.\n */\nexport const H2O_LOCAL_TONES_A = Object.freeze({\n  0: Object.freeze({\n    Z: Object.freeze({ T: 2, L: 2, R: 2 }),\n    R0: Object.freeze({ T: 2, L: 0, R: 2 }),\n    R1: Object.freeze({ T: 2, L: 0, R: 2 }),\n    R2: Object.freeze({ T: 2, L: 2, R: 0 }),\n    R3: Object.freeze({ T: 2, L: 2, R: 0 }),\n    R4: Object.freeze({ T: 0, L: 2, R: 2 }),\n    R5: Object.freeze({ T: 0, L: 2, R: 2 }),\n  }),\n  1: Object.freeze({\n    Z: Object.freeze({ T: 0, L: 0, R: 0 }),\n    R0: Object.freeze({ T: 1, L: 2, R: 0 }),\n    R1: Object.freeze({ T: 0, L: 2, R: 1 }),\n    R2: Object.freeze({ T: 0, L: 1, R: 2 }),\n    R3: Object.freeze({ T: 1, L: 0, R: 2 }),\n    R4: Object.freeze({ T: 2, L: 0, R: 1 }),\n    R5: Object.freeze({ T: \n * 풀려난 셀» 을 도로 넣는다. 순회 규칙(boustrophedon 등)을 복제하지 않는 것이 요점이다\n * — 규칙이 두 곳에 있으면 하나가 조용히 낡는다.\n * @param {number} k\n */\nexport function dataCellsInScanOrderAMarker(k) {\n  assertK(k);\n  const sets = buildRoleSetsAMarker(k);\n  const legacySets = buildRoleSetsA(k);\n  const out = [];\n  for (const cell of regionCellsA(k)) {\n    const kk = key(cell.q, cell.r);\n    if (sets.marker.has(kk)) continue;\n    if (sets.anchor.has(kk) || sets.format.has(kk) || sets.reference.has(kk)) continue;\n    if (hexDistance(cell.q, cell.r) <= 2) continue; // 불스아이\n    out.push(cell);\n  }\n  // scan order 는 레거시 순회 순서를 그대로 따른다: 레거시 목록에서 남은 것 + 새로\n  // 데이터가 된 셀(레거시 레퍼런스였다가 재배치로 풀린 셀)을 레거시 순회에 없으므로\n  // 뒤에 붙인다. 실측상 그런 셀은 레거시 패치 레퍼런스 중 마커에 먹힌 것뿐이다.\n  const legacyOrder = dataCellsInScanOrderA(k);\n  const keep = new Set(out.map((c) => key(c.q, c.r)));\n  const ordered = legacyOrder.filter((c) => keep.has(key(c.q, c.r)));\n  const seen = new Set(ordered.map((c) => key(c.q, c.r)));\n  const freed = out.filter((c) => !seen.has(key(c.q, c.r)))\n    .sort((a, b) => a.q - b.q || a.r - b.r);\n  void legacySets;\n  return [...ordered, ...freed];\n}\n\n/** 필러 셀 — scan order 꼬리 (C mod 3). */\nexport function fillerCellsAMarker(k) {\n  const scan = dataCellsInScanOrderAMarker(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 방향 margin\n// ─────────────────────────────────────────────────────────────────────────\n\n/** 마커 21셀 × 3면 = 63 슬롯의 회전 일치율 → margin. */\nexport function orientationMarginAMarker(k) {\n  const cells = markerCellsA(k);\n  const byPos = new Map(cells.map((c) => [key(c.q, c.r), c.digit]));\n  function agreeFor(rotCell, rotDigit) {\n    let agree = 0;\n    for (const c of cells) {\n      const p = rotCell(c.q, c.r);\n      const there = byPos.get(key(p.q, p.r));\n      if (there === undefined) continue;\n      const moved = digitToRanks(rotDigit(c.digit));\n      const truth = digitToRanks(there);\n      if (moved.T === truth.T) agree += 1;\n      if (moved.L === truth.L) agree += 1;\n      if (moved.R === truth.R) agree += 1;\n    }\n    return agree;\n  }\n  const slots = cells.length * 3;\n  const agree120 = agreeFor((q, r) => rotate120(q, r), rotateDigitCw);\n  const agree240 = agreeFor((q, r) => rotate240(q, r), rotateDigitCcw);\n  return {\n    margin: 1 - Math.max(agree120, agree240) / slots, slots, agree120, agree240,\n  };\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 용량 — capacityA 회계 승계, 마커 21셀만큼 데이터가 준다\n// ─────────────────────────────────────────────────────────────────────────\n//\n// NSYM 산출 절차는 capacityY.js NSYM_TABLE_Y 헤더와 같다\n// (M = round(0.25·S), 짝수면 +1 홀수화 · L = round(0.12·S) · H = round(0.40·S)):\n//   A0CM S=38  → M round(9.5)=10(짝) → 11 · L round(4.56)=5  · H round(15.2)=15\n//   A1CM S=82  → M round(20.5)=21(홀)     · L round(9.84)=10 · H round(32.8)=33\n//   A2CM S=136 → M round(34)=34(짝) → 35  · L round(16.32)=16 · H round(54.4)=54\n// ⚠ 제안이다 — 비준은 운영자.\n\nexport const NSYM_TABLE_ACM = Object.freeze({\n  A0CM: Object.freeze({\n    symbols: 38, L: 5, M: 11, H: 15,\n  }),\n  A1CM: Object.freeze({\n    symbols: 82, L: 10, M: 21, H: 33,\n  }),\n  A2CM: Object.freeze({\n    symbols: 136, L: 16, M: 35, H: 54,\n  }),\n});\n\n/** 마커가 먹는 셀 수 (전 k 공통 21). */\nexport const MARKER_CELL_COUNT_A = 21;\n\n// formatIndex 는 레거시 A 가 아니라 **내부 타입 G 표**(`markerG.js`, 운영자 확정\n// 2026-08-20)에서 유도한다 — 레거시 값을 그대로 실으면 디코더가 마커 회계(21셀)를\n// 와이어에서 구분할 수 없다 (실기 「코너 마커 코드 스캔 불가」의 근본 원인).\nexport const VERSIONS_ACM = Object.freeze(VERSIONS_A.map((spec) => Object.freeze({\n  name: spec.name + 'CM',\n  version: spec.version,\n  k: spec.k,\n  formatIndex: markerGSpec('tri', spec.version).formatIndex,\n  overhead: spec.overhead + MARKER_CELL_COUNT_A,\n  symbolKey: spec.name + 'CM',\n})));\n\nexport function capacityForAMarker(spec, level = 'M') {\n  const totalCells = ((3 * spec.k + 1) * (3 * spec.k + 2)) / 2;\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) throw new RangeError(spec.name + ': 오버헤드가 총 셀 이상이다');\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n  const table = NSYM_TABLE_ACM[spec.symbolKey];\n  if (!table) throw new RangeError(spec.name + ': NSYM_TABLE_ACM 에 키가 없다');\n  if (table.symbols !== usedSymbols) {\n    throw new RangeError(\n      spec.name + ': 실계산 사용 심볼 ' + usedSymbols + ' 이 NSYM_TABLE_ACM.'\n      + spec.symbolKey + '.symbols (' + table.symbols + ') 과 어긋난다',\n    );\n  }\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) throw new RangeError(spec.name + ': 레벨 ' + level + ' 이 없다');\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) throw new RangeError(spec.name + '/' + level + ': nsym 이 너무 크다');\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n  return {\n    name: spec.name,\n    version: spec.version,\n    k: spec.k,\n    cornerMarker: true,\n    formatIndex: spec.formatIndex,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\nexport function capacityTableAMarker(level = 'M') {\n  return VERSIONS_ACM.map((spec) => capacityForAMarker(spec, level));\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증\n// ─────────────────────────────────────────────────────────────────────────\n{\n  for (const spec of VERSIONS_A) {\n    const k = spec.k;\n    const cells = markerCellsA(k);\n    if (cells.length !== MARKER_CELL_COUNT_A) {\n      throw new Error('markerA k=' + k + ': 마커 셀 수가 ' + MARKER_CELL_COUNT_A + ' 이 아니다');\n    }\n    // ① 전 셀이 영역 A 안이고 꼭짓점 앵커와 겹치지 않는다.\n    const vertexKeys = new Set(vertexAnchors(k).map((c) => key(c.q, c.r)));\n    for (const c of cells) {\n      if (!isInRegionA(c.q, c.r, k)) throw new Error('markerA k=' + k + ': 마커 셀이 영역 밖 ' + key(c.q, c.r));\n      if (vertexKeys.has(key(c.q, c.r))) throw new Error('markerA k=' + k + ': 마커가 꼭짓점 앵커와 겹친다');\n    }\n    // ② ρ-불변 + 방향 margin 1.0\n    const set = markerPositionSetA(k);\n    for (const rot of [rotate120, rotate240]) {\n      for (const kk of set) {\n        const [q, r] = kk.split(',').map(Number);\n        const p = rot(q, r);\n        if (!set.has(key(p.q, p.r))) throw new Error('markerA k=' + k + ': 마커 집합이 ρ-불변이 아니다');\n      }\n    }\n    const margin = orientationMarginAMarker(k);\n    if (margin.agree120 !== 0 || margin.agree240 !== 0) {\n      throw new Error('markerA k=' + k + ': 회전 공변 슬롯이 남았다 ' + JSON.stringify(margin));\n    }\n    // ③ 재배치된 패치 레퍼런스가 마커와 안 겹치고 개수가 유지된다.\n    const refs = patchReferenceCellsAMarker(k);\n    if (refs.length !== patchReferenceRings(k).length * 3) {\n      throw new Error('markerA k=' + k + ': 패치 레퍼런스 수가 달라졌다');\n    }\n    for (const c of refs) {\n      if (set.has(key(c.q, c.r))) throw new Error('markerA k=' + k + ': 패치 레퍼런스가 마커와 겹친다');\n    }\n    // ④ V-CM 대칭 유도 (2026-08-24) — 사상 정확성: 항목별 (−q,−r), 나머지 필드 불변,\n    //    톤은 canonical 키 조회가 사상 후에도 실려 온다.\n    const turned = markerCellsTurnA(k, h2oTonesByKeyA(k));\n    if (turned.length !== cells.length) {\n      throw new Error('markerA k=' + k + ': V-CM 유도 셀 수가 다르다');\n    }\n    for (let i = 0; i < cells.length; i += 1) {\n      if (turned[i].q !== -cells[i].q || turned[i].r !== -cells[i].r) {\n        throw new Error('markerA k=' + k + ': V-CM 유도가 (−q,−r) 사상이 아니다 [' + i + ']');\n      }\n      if (turned[i].digit !== cells[i].digit || turned[i].label !== cells[i].label\n        || turned[i].corner !== cells[i].corner) {\n        throw new Error('markerA k=' + k + ': V-CM 유도가 digit/label/corner 를 바꿨다 [' + i + ']');\n      }\n      if (!turned[i].tones) {\n        throw new Error('markerA k=' + k + ': V-CM 유도에 톤이 안 실렸다 [' + i + ']');\n      }\n    }\n  }\n}\n"],
  ["finder-NO2", "/**\n * finder-NO2.js — NO2 파인더 (턴A = 내부 타입 V 의 기본 파인더)의 «톤 정본».\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 1. 지위 — V-CM 은 «자리 예약», 그 자리의 «심볼» 이 기본 파인더다\n * ─────────────────────────────────────────────────────────────────────────\n * 운영자 결정 (2026-08-21 CM 격하 · 2026-08-24 NO2 편입): CM 계열은 파인더가 아니라\n * 자리 예약이고, 그 자리에 들어가는 심볼이 기본 파인더다 — Type A 자리(A-CM)엔 H2O\n * (`markerA.js` H2O_LOCAL_TONES_A), Type G 자리(O-CM)엔 H (`finder-H.js`), 그리고\n * **턴A 자리(V-CM)엔 NO2** (이 모듈). 배정은 `finder-taxonomy.SEAT_DEFAULT_FINDER`\n * 의 `'v-cm'` 열이 든다.\n *\n * ⚠ **중앙 파인더와 직교** (운영자 확정 2026-08-24 — «중앙 파인더 관련 없음, 모두\n * 사용 가능»). NO2 는 **자리(V-CM) 심볼**이고 중앙 19셀 슬롯 축과 별개다. 그래서\n * 이 모듈은 `finder-patterns.js`·`finder-selection.js` 를 **import 하지 않는다** —\n * 표가 중앙 파인더 선택에 의존할 방법이 구조적으로 없다는 것이 직교성의 증명이고,\n * `test/finder-NO2.test.js` ⑤ 가 그 사실을 값으로 잠근다 (불스아이·큐브 불스아이·\n * 중앙 3톤 큐브·중앙 v0 비컨 전부에서 NO2 면 색이 바이트 동일).\n *\n * 정본 export 의 `finderPattern.cellMasks` 19개는 `cell-editor-core.js`\n * `bullseyeCellMasks()` 산출과 **바이트 동일**이다 (실측) — 즉 중앙 슬롯 표현은\n * 이미 있는 것과 정확히 대응하고, **새 중앙 파인더를 만들지 않는다.** H 정본이\n * 같은 성질을 가졌던 것과 같은 축이다 (`finder-H.js` §1).\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 2. 정본과 발자국 — 9셀 = 꼭짓점 앵커 3 + «영역 내 이웃» 6, 손 좌표 0\n * ─────────────────────────────────────────────────────────────────────────\n * 정본: 셀 편집기 v2 export (운영자 작화 2026-08-24 **수정본** · type V · k=4 ·\n * starter bullseye). repo 사본: `test/output/lanes/finder-NO2.json` (바이트 동일).\n *\n * 정본이 닿는 9셀을 코드로 되짚었더니 임의 배치가 아니라 **닫힌 규칙**이었다:\n *\n *   NO2 셀 = ⋃ (V 꼭짓점 앵커 a) { a } ∪ { a 의 이웃 중 영역 안인 것 }\n *\n * 그리고 그 «영역 안인 이웃» 은 **전 k 에서 정확히 2개**다 (k=4/6/8/10 실측 —\n * 아래 로드 자기검증 ①이 매 로드마다 다시 잰다). 꼭짓점은 영역의 뾰족한 끝이라\n * 이웃 6 중 4가 영역 밖으로 떨어지기 때문이고, 그래서 이 규칙은 k 무관하게 선다.\n * V 꼭짓점 앵커 자신은 `placementA.vertexAnchors(k)` 의 180° 상이다 (턴A 정의).\n *\n * k=4 정본 대조 (`test/finder-NO2.test.js` ①): 유도한 9셀이 정본\n * `userNonData`(6) ∪ 앵커(3) 와 **전수 일치**하고 톤도 27면 전부 일치한다.\n * 그래서 좌표는 이 모듈에 **하나도 없다** — 아래 표는 코너 × 로컬 라벨(A·N0·N1)\n * 로만 적히고 좌표는 전부 `vertexAnchors` + `neighbors` 에서 유도된다\n * (좌표 손 나열은 이 저장소 최다 결함).\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 3. 톤은 120° 궤도가 **아니다** — 그래서 «코너별 로컬 표»다\n * ─────────────────────────────────────────────────────────────────────────\n * 발자국은 ρ-불변(rotate120/240 으로 자기 자신에 사상)인데 **톤은 아니다**: 코너 0\n * 의 앵커는 (T2,L0,R0) 인데 코너 1·2 의 앵커는 (0,0,0) 이다. `placement.rotate120`\n * + 면 순환 T→R→L 로 궤도 전개를 시도하면 27면 중 6면이 어긋난다 (실측).\n * → 궤도 공식이 아니라 **코너별 로컬 표**로 저장한다. `markerA.js` 의\n * `H2O_LOCAL_TONES_A` 와 `finder-H.js` 의 `H_LOCAL_TONES_O` 가 같은 문법이다.\n *\n * 다른 k 는 **같은 (코너, 라벨) 튜플을 그 k 의 자리에 복사**한다 — 로컬 구조가\n * k 무관하게 동형이기 때문이다 (자기검증 ②가 «코너별 이웃 방향 인덱스 쌍» 이\n * 전 k 에서 같음을 재서 그 동형성을 값으로 확인한다: c0={4,5} · c1={2,3} ·\n * c2={0,1}). 정본에 없는 면은 없다 — 27/27 이 명시돼 있어 중간톤 폴백을 안 쓴다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 4. 회계 — V-CM 자리에서 «셀을 새로 먹지 않는다»\n * ─────────────────────────────────────────────────────────────────────────\n * 실측 (전 k): NO2 의 마커 6셀은 **A-CM 마커 21셀의 부분집합**이고 (꼭짓점에서\n * 2칸 안쪽 링의 바깥쪽 두 셀), 앵커 3셀은 이미 `vertexAnchors` 다. 그래서 V-CM\n * (= A-CM 회계의 턴A 사상) 위에 NO2 를 얹으면 **오버헤드·scan order·용량이 전부\n * 불변**이다 — digit 은 그대로 남고 `tones` 오버레이만 붙는다. 자기검증 ③이 잰다.\n *\n * 반대로 **순수 V**(자리 예약 없는 턴A) 레이아웃에서는 그 6셀이 데이터(k=6 은\n * 데이터 4 + 레퍼런스 2)라 정본 편집기가 `counts.detector = 6` 으로 뺀 것이다.\n * 그것이 정본이 «자리 예약 위» 가 아니라 «맨 V 위» 에 그려진 이유다.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 5. 렌더 계약 — 팔레트는 palette.levels, 파인더 축 금지\n * ─────────────────────────────────────────────────────────────────────────\n * 셀 entry 에 `tones: {T,L,R}` 를 실으면 `scene.js` faceColor 가 **데이터와 같은\n * `palette.levels`** 로 그린다. 파인더 축(bullseyeLight = 순백)은 금지 — 순백이\n * 안전영역·흰 지면과 구별되지 않아 실루엣에 구멍이 난다 (2026-08-20 실기기 실측,\n * `scene.js` faceColor 헤더). 구별은 색이 아니라 «조합»이다: NO2 9셀은 **전부\n * 비-순열**(전면 동톤 2셀 포함)이라 데이터 셀이 만들 수 없는 무늬다.\n *\n * ⚠ **알려진 공백 (실측 2026-08-24)** — NO2 는 **꼭짓점 앵커 3셀까지 덮는다.**\n * 앵커에 절대 톤을 실은 프레임은 digit 기반 앵커 검출이 거의 못 읽는다:\n * 페이로드 4 × 버전 3 × ppu 2 = **24칸 중 2칸만 성공**(실패 20 = `no-anchors`,\n * 2 = `no-format-candidate`)이고 그 2칸은 한 페이로드·한 버전에 몰려 있다 —\n * **페이로드 의존**이라 «가끔 된다» 이지 «된다» 가 아니다 (F-108 과 같은 결).\n * 같은 격자에서 **기본 적재(마커 6셀만)는 24/24** 다. H 가 tetrad A 를 덮어 같은\n * 공백을 가졌던 것과 **정확히 같은 축**이다 (`finder-H.js` §4). 그래서 앵커 톤\n * 적재는 **opt-in**(`encodeA` 의 `no2AnchorTones`)이고 기본은 마커 6셀만 싣는다.\n * 기본값 전환은 검출기 배선(통합자 몫)이 선 다음이다 — 한쪽만 켜면 효과가 음수다.\n * 공백 잠금: `test/finder-NO2.test.js` ⑥.\n *\n * 반면 **마커 6셀 적재는 기본**이고, 그 전환은 V0CM 을 살렸다: A-CM 기본 심볼\n * (H2O) 톤을 V-CM 에 그대로 싣던 종전 경로에서 V0CM(k=6)은 전 해상도 `no-anchors`\n * 였는데, NO2 로 바꾸자 ppu 10\\~32 중 8/9 에서 원문까지 돌아온다 (§왕복 실측).\n *\n * 런타임 의존성 0 · 순수 ESM.\n */\n\nimport { neighbors, AXIAL_DIRECTIONS } from './hexgrid.js';\nimport { vertexAnchors, isInRegionA } from './placementA.js';\nimport { rotate120, rotate240 } from './placement.js';\nimport { markerCellsA, markerPositionSetA } from './markerA.js';\nimport { VERSIONS_A } from './capacityA.js';\n\n/** 심볼 이름 — `finder-taxonomy.SEAT_DEFAULT_FINDER['v-cm']` 값과 같은 문자열. */\nexport const NO2_NAME = 'NO2';\n\n/** 로컬 라벨 — A = 꼭짓점 앵커, N0·N1 = 영역 안 이웃 2 (`neighbors` 순서). */\nexport const NO2_LABELS = Object.freeze(['A', 'N0', 'N1']);\n\n/** 앵커 라벨 (톤 적재가 opt-in 인 셀) 과 마커 라벨 (기본 적재) 의 분할. */\nexport const NO2_ANCHOR_LABEL = 'A';\nexport const NO2_MARKER_LABELS = Object.freeze(['N0', 'N1']);\n\n/** 발자국 개수 — 유도값의 기대치. 자기검증이 매 로드마다 재확인한다. */\nexport const NO2_ANCHOR_COUNT = 3;\nexport const NO2_MARKER_COUNT = 6;\nexport const NO2_CELL_COUNT = NO2_ANCHOR_COUNT + NO2_MARKER_COUNT;\n\nfunction key(q, r) {\n  return q + ',' + r;\n}\n\nfunction assertK(k) {\n  if (!Number.isInteger(k) || k < 4) {\n    throw new RangeError('k 는 4 이상의 정수여야 한다: ' + k);\n  }\n  return k;\n}\n\n/**\n * 정본 NO2 의 면별 톤 — k=4 편집기 export 를 코너(0·1·2) × 로컬 라벨(A·N0·N1)에\n * 고정. 다른 k 는 같은 로컬 라벨을 그 k 의 꼭짓점 자리에 복사한다 (`no2TonesByKeyA`).\n * 27/27 면이 정본에 명시돼 있다 — 중간톤 폴백을 쓰는 면이 없다.\n * 실측: 9셀 **전부** 비-순열 · 세 코너 튜플이 서로 다르다 (방향 비공변).\n *\n * ⚠ 코너 인덱스는 `placementA.vertexAnchors(k)` 배열 순서다 (0 = A 의 위 꼭짓점 →\n *   V 에서는 아래, 1 = A 의 우하 → V 의 좌상, 2 = A 의 좌하 → V 의 우상).\n */\nexport const NO2_LOCAL_TONES_V = Object.freeze({\n  0: Object.freeze({\n    A: Object.freeze({ T: 2, L: 0, R: 0 }),\n    N0: Object.freeze({ T: 0, L: 2, R: 0 }),\n    N1: Object.freeze({ T: 0, L: 0, R: 2 }),\n  }),\n  1: Object.freeze({\n    A: Object.freeze({ T: 0, L: 0, R: 0 }),\n    N0: Object.freeze({ T: 2, L: 2, R: 0 }),\n    N1: Object.freeze({ T: 2, L: 2, R: 0 }),\n  }),\n  2: Object.freeze({\n    A: Object.freeze({ T: 0, L: 0, R: 0 }),\n    N0: Object.freeze({ T: 2, L: 0, R: 2 }),\n    N1: Object.freeze({ T: 2, L: 0, R: 2 }),\n  }),\n});\n\n/**\n * NO2 발자국 9셀 — **canonical(Type A) 좌표**. 인코더가 쓰는 공간이다\n * (`encodeA` 는 canonical 좌표로 cellDigits 를 채우고 `scene.js` 의 turnA 분기가\n * 그리는 자리만 반전한다 — `markerA.markerCellsTurnA` 헤더와 같은 계약).\n *\n * 순서는 코너(0→1→2) × 라벨(A, N0, N1). 손 좌표 0 — `vertexAnchors` + `neighbors`\n * + `isInRegionA` 유도가 전부다.\n *\n * @param {number} k\n * @returns {{q:number,r:number,corner:number,label:string,role:'anchor'|'marker',\n *            tones:{T:number,L:number,R:number}}[]} 길이 9\n */\nexport function no2CellsA(k) {\n  assertK(k);\n  const out = [];\n  vertexAnchors(k).forEach((anchor, corner) => {\n    const table = NO2_LOCAL_TONES_V[corner];\n    if (!table) throw new Error('finder-NO2: 로컬 표에 코너 ' + corner + ' 가 없다');\n    out.push({\n      q: anchor.q,\n      r: anchor.r,\n      corner,\n      label: NO2_ANCHOR_LABEL,\n      role: 'anchor',\n      tones: table[NO2_ANCHOR_LABEL],\n    });\n    const inner = neighbors(anchor.q, anchor.r).filter((c) => isInRegionA(c.q, c.r, k));\n    if (inner.length !== NO2_MARKER_LABELS.length) {\n      throw new Error(\n        'finder-NO2 k=' + k + ': 코너 ' + corner + ' 의 영역 내 이웃이 '\n        + inner.length + ' 개다 — 유도 규칙(정확히 2)의 전제 위반',\n      );\n    }\n    inner.forEach((cell, index) => {\n      const label = NO2_MARKER_LABELS[index];\n      out.push({\n        q: cell.q, r: cell.r, corner, label, role: 'marker', tones: table[label],\n      });\n    });\n  });\n  return out;\n}\n\n/**\n * NO2 발자국 9셀 — **턴A(이미지) 좌표**. 정본 편집기 export 가 쓰는 공간이고\n * (`(q,r) → (−q,−r)`), 검출기·분류 서술·정본 대조가 쓴다. 셀이 정립이라 면별\n * 절대 톤은 사상에서 안 돈다 — `markerCellsTurnA` 와 같은 문법.\n * @param {number} k\n */\nexport function no2CellsTurnA(k) {\n  return no2CellsA(k).map((cell) => ({ ...cell, q: -cell.q, r: -cell.r }));\n}\n\nfunction tonesByKey(cells, labels) {\n  const map = new Map();\n  for (const cell of cells) {\n    if (labels && !labels.includes(cell.label)) continue;\n    map.set(key(cell.q, cell.r), cell.tones);\n  }\n  return map;\n}\n\n/** 정본 NO2 톤을 k 의 **canonical** 좌표로 전개한 표 (\"q,r\" → {T,L,R}) — 9셀. */\nexport function no2TonesByKeyA(k) {\n  return tonesByKey(no2CellsA(k));\n}\n\n/** 정본 NO2 톤을 k 의 **턴A(이미지)** 좌표로 전개한 표 — 9셀 (정본 대조용). */\nexport function no2TonesByKeyTurnA(k) {\n  return tonesByKey(no2CellsTurnA(k));\n}\n\n/**\n * V-CM 자리(A-CM 21셀 레이아웃)에 NO2 심볼을 얹은 **마커 셀 목록**.\n * 21셀의 digit·역할은 `markerCellsA(k)` 그대로이고 (회계 불변), NO2 가 덮는 6셀만\n * `tones` 를 든다. 나머지 15셀은 digit-only — 정본에 그 자리의 톤이 없기 때문이고,\n * 없는 값을 H2O 에서 빌려 오면 «다른 심볼 두 개가 한 자리에» 가 된다.\n * @param {number} k\n */\nexport function no2SeatMarkerCellsA(k) {\n  const toneMap = tonesByKey(no2CellsA(k), NO2_MARKER_LABELS);\n  return markerCellsA(k).map((cell) => {\n    const tones = toneMap.get(key(cell.q, cell.r));\n    return tones ? { ...cell, tones } : { ...cell };\n  });\n}\n\n/**\n * V-CM 자리에서 NO2 가 덮는 **꼭짓점 앵커 3셀** (톤 포함, canonical 좌표).\n * digit 은 `vertexAnchors` 그대로다 — 이 목록은 `tones` 오버레이 전용이다.\n *\n * ⚠ 적재는 opt-in 이다 (모듈 헤더 §5 — 앵커 피복은 digit 기반 앵커 검출을 죽인다).\n * @param {number} k\n */\nexport function no2SeatAnchorCellsA(k) {\n  const byKey = new Map(vertexAnchors(k).map((c) => [key(c.q, c.r), c.digit]));\n  return no2CellsA(k)\n    .filter((cell) => cell.label === NO2_ANCHOR_LABEL)\n    .map((cell) => {\n      const digit = byKey.get(key(cell.q, cell.r));\n      if (digit === undefined) {\n        throw new Error('finder-NO2: 앵커 라벨 셀 ' + key(cell.q, cell.r) + ' 이 꼭짓점 앵커가 아니다');\n      }\n      return { q: cell.q, r: cell.r, digit, corner: cell.corner, tones: cell.tones };\n    });\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 (finder-H·markerA 전례) — 표의 주장들이 거짓이면 즉시 throw\n// ─────────────────────────────────────────────────────────────────────────\n{\n  // ⓪ 표의 모양 — 코너 3 × 라벨 3, 톤은 0/1/2.\n  const corners = Object.keys(NO2_LOCAL_TONES_V).map(Number).sort((a, b) => a - b);\n  if (corners.join(',') !== '0,1,2') {\n    throw new Error('finder-NO2: 표의 코너가 0,1,2 가 아니다: ' + corners);\n  }\n  for (const corner of corners) {\n    const labels = Object.keys(NO2_LOCAL_TONES_V[corner]).sort();\n    if (labels.join(',') !== [...NO2_LABELS].sort().join(',')) {\n      throw new Error('finder-NO2: 코너 ' + corner + ' 의 라벨이 NO2_LABELS 와 다르다');\n    }\n    for (const label of labels) {\n      for (const face of ['T', 'L', 'R']) {\n        const tone = NO2_LOCAL_TONES_V[corner][label][face];\n        if (tone !== 0 && tone !== 1 && tone !== 2) {\n          throw new Error('finder-NO2: ' + corner + '.' + label + '.' + face + ' 톤이 0/1/2 가 아니다');\n        }\n      }\n    }\n  }\n\n  const dirIndexOf = (from, to) => AXIAL_DIRECTIONS.findIndex(\n    (d) => d.q === to.q - from.q && d.r === to.r - from.r,\n  );\n  let dirSignature = null;\n\n  // 전 k («모든 k 대응» — 운영자 지시 2026-08-24). 발행 k 는 VERSIONS_A 표에서\n  // 유도하고, 거기에 **정본 작화 k=4** 를 더한다 — k=4 는 발행 버전이 아니지만\n  // (VERSIONS_A = 6/8/10) 정본이 그 k 로 그려졌으므로 유도 규칙이 반드시 서야 하는\n  // 자리다. `placementA` 의 턴A 자기검증도 같은 이유로 [4,6,8,10] 을 돈다.\n  const CANON_K = 4;\n  const KS = [CANON_K, ...VERSIONS_A.map((spec) => spec.k)];\n  for (const k of KS) {\n    const cells = no2CellsA(k);\n    // ① 마커 6 · 앵커 3 (유도 규칙의 전제 «영역 내 이웃이 정확히 2» 는\n    //    no2CellsA 안에서 이미 던진다 — 여기서는 합계를 다시 센다).\n    if (cells.length !== NO2_CELL_COUNT) {\n      throw new Error('finder-NO2 k=' + k + ': 셀 수가 ' + NO2_CELL_COUNT + ' 이 아니다: ' + cells.length);\n    }\n    const anchorCount = cells.filter((c) => c.role === 'anchor').length;\n    const markerCount = cells.filter((c) => c.role === 'marker').length;\n    if (anchorCount !== NO2_ANCHOR_COUNT || markerCount !== NO2_MARKER_COUNT) {\n      throw new Error(\n        'finder-NO2 k=' + k + ': 앵커/마커 수가 ' + anchorCount + '/' + markerCount\n        + ' 다 — ' + NO2_ANCHOR_COUNT + '/' + NO2_MARKER_COUNT + ' 이어야 한다',\n      );\n    }\n    // 전 셀에 톤이 실린다 (표 누락을 조용한 폴백으로 덮지 않는다).\n    for (const c of cells) {\n      if (!c.tones) throw new Error('finder-NO2 k=' + k + ': ' + key(c.q, c.r) + ' 에 톤이 없다');\n    }\n\n    // ② 로컬 구조 동형 — 코너별 «이웃 방향 인덱스 쌍» 이 전 k 에서 같아야\n    //    «같은 (코너,라벨) 튜플 복사» 라는 k 유도 규칙이 성립한다.\n    const signature = vertexAnchors(k).map((anchor) => neighbors(anchor.q, anchor.r)\n      .filter((c) => isInRegionA(c.q, c.r, k))\n      .map((c) => dirIndexOf(anchor, c)).join('')).join('|');\n    if (dirSignature === null) dirSignature = signature;\n    else if (signature !== dirSignature) {\n      throw new Error(\n        'finder-NO2 k=' + k + ': 로컬 방향 서명이 다르다 (' + signature + ' vs '\n        + dirSignature + ') — 라벨 복사 유도가 k 마다 다른 자리를 가리킨다',\n      );\n    }\n\n    // ③ 자리 회계 — 마커 6셀은 A-CM 마커 21셀 안, 앵커 3셀은 꼭짓점 앵커.\n    //    (이것이 «V-CM 에서 셀을 새로 먹지 않는다» 의 근거다 — 모듈 헤더 §4.)\n    const markerSet = markerPositionSetA(k);\n    const vertexSet = new Set(vertexAnchors(k).map((c) => key(c.q, c.r)));\n    for (const c of cells) {\n      const kk = key(c.q, c.r);\n      if (c.role === 'marker' && !markerSet.has(kk)) {\n        throw new Error('finder-NO2 k=' + k + ': 마커 셀 ' + kk + ' 이 A-CM 마커 21셀 밖이다');\n      }\n      if (c.role === 'anchor' && !vertexSet.has(kk)) {\n        throw new Error('finder-NO2 k=' + k + ': 앵커 셀 ' + kk + ' 이 꼭짓점 앵커가 아니다');\n      }\n      if (!isInRegionA(c.q, c.r, k)) {\n        throw new Error('finder-NO2 k=' + k + ': 셀 ' + kk + ' 이 영역 밖이다');\n      }\n    }\n    // 자리 적재본이 21셀 회계를 그대로 두고 6셀에만 톤을 얹는다.\n    const seat = no2SeatMarkerCellsA(k);\n    const base = markerCellsA(k);\n    if (seat.length !== base.length) {\n      throw new Error('finder-NO2 k=' + k + ': 자리 적재본 셀 수가 A-CM 과 다르다');\n    }\n    let toned = 0;\n    for (let i = 0; i < seat.length; i += 1) {\n      if (seat[i].q !== base[i].q || seat[i].r !== base[i].r || seat[i].digit !== base[i].digit) {\n        throw new Error('finder-NO2 k=' + k + ': 자리 적재본이 A-CM 좌표/digit 을 바꿨다 [' + i + ']');\n      }\n      if (seat[i].tones) toned += 1;\n    }\n    if (toned !== NO2_MARKER_COUNT) {\n      throw new Error('finder-NO2 k=' + k + ': 자리 적재 톤 셀이 ' + toned + ' 개다 — ' + NO2_MARKER_COUNT + ' 이어야 한다');\n    }\n\n    // ④ 발자국 ρ-불변 — 코너 셋이 rotate120/240 궤도로 닫힌다 (방향 판별의 전제).\n    const set = new Set(cells.map((c) => key(c.q, c.r)));\n    for (const rot of [rotate120, rotate240]) {\n      for (const kk of set) {\n        const [q, r] = kk.split(',').map(Number);\n        const p = rot(q, r);\n        if (!set.has(key(p.q, p.r))) {\n          throw new Error('finder-NO2 k=' + k + ': 발자국이 ρ-불변이 아니다 (' + kk + ')');\n        }\n      }\n    }\n\n    // ⑤ 턴A 사상 정확성 — (−q,−r) 이고 나머지 필드는 불변 (셀 정립).\n    const turned = no2CellsTurnA(k);\n    for (let i = 0; i < cells.length; i += 1) {\n      if (turned[i].q !== -cells[i].q || turned[i].r !== -cells[i].r) {\n        throw new Error('finder-NO2 k=' + k + ': 턴A 사상이 (−q,−r) 이 아니다 [' + i + ']');\n      }\n      if (turned[i].label !== cells[i].label || turned[i].corner !== cells[i].corner\n        || turned[i].tones !== cells[i].tones) {\n        throw new Error('finder-NO2 k=' + k + ': 턴A 사상이 라벨/코너/톤을 바꿨다 [' + i + ']');\n      }\n    }\n  }\n\n  // ⑥ 심볼다움 — 비-순열 셀이 실재하고(digit 경로가 못 그리는 이유), 톤이 균일하지\n  //    않으며, 세 코너 튜플이 서로 다르다 (코너 구별이 산다). finder-H ③ 전례.\n  const tuples = corners.map((corner) => NO2_LABELS\n    .map((label) => ['T', 'L', 'R'].map((face) => NO2_LOCAL_TONES_V[corner][label][face]).join(''))\n    .join('|'));\n  if (new Set(tuples).size !== 3) {\n    throw new Error('finder-NO2: 코너 튜플이 서로 같다 — 코너 구별이 죽는다');\n  }\n  let nonPermutation = 0;\n  const seenTones = new Set();\n  for (const corner of corners) {\n    for (const label of NO2_LABELS) {\n      const t = NO2_LOCAL_TONES_V[corner][label];\n      seenTones.add(t.T).add(t.L).add(t.R);\n      if (new Set([t.T, t.L, t.R]).size < 3) nonPermutation += 1;\n    }\n  }\n  if (nonPermutation === 0) {\n    throw new Error('finder-NO2: 비-순열 셀이 없다 — digit 알파벳으로 충분했다는 뜻이 된다');\n  }\n  if (seenTones.size < 2) throw new Error('finder-NO2: 톤이 균일하다 — 검출 불가');\n}\n"],
