  ["finder-editor-pattern", "// finder-editor-pattern.js — 파인더 에디터가 저장·편집하는 공개 표현\n//\n// 3톤 큐브는 19셀 bit mask의 변형이 아니다. finder-patterns.js의 renderKind와\n// toneRanks(0=어두움, 1=중간, 2=밝음) 순열을 그대로 보존해, 에디터에서 만든 값이\n// 렌더러·디코더가 읽는 표현과 갈라지지 않게 한다.\n\nimport { FACES } from './hexgrid.js';\nimport { FINDER_CELL_ORDER } from './finder-patterns.js';\n\nexport const FINDER_EDITOR_RENDER_KINDS = Object.freeze(['cell-mask', 'three-tone-cube']);\n\nfunction assertRenderKind(renderKind) {\n  if (!FINDER_EDITOR_RENDER_KINDS.includes(renderKind)) {\n    throw new RangeError('알 수 없는 파인더 표현: ' + renderKind);\n  }\n}\n\nfunction assertToneRanks(toneRanks) {\n  if (toneRanks === null || typeof toneRanks !== 'object') {\n    throw new TypeError('toneRanks는 객체여야 한다');\n  }\n  const ranks = FACES.map((face) => toneRanks[face]);\n  if (ranks.slice().sort((a, b) => a - b).join(',') !== '0,1,2') {\n    throw new RangeError('toneRanks는 0/1/2 순열이어야 한다');\n  }\n}\n\n/** finder-patterns.js의 두 표현을 에디터가 소유할 가변 사본으로 바꾼다. */\nexport function cloneFinderEditorPattern(pattern) {\n  if (pattern === null || typeof pattern !== 'object') {\n    throw new TypeError('파인더 패턴 객체가 필요하다');\n  }\n  const renderKind = pattern.renderKind || 'cell-mask';\n  assertRenderKind(renderKind);\n  if (renderKind === 'cell-mask') {\n    if (!Array.isArray(pattern.cellMasks) || pattern.cellMasks.length !== FINDER_CELL_ORDER.length) {\n      throw new RangeError('cellMasks는 19개여야 한다');\n    }\n    return { renderKind, cellMasks: [...pattern.cellMasks] };\n  }\n  assertToneRanks(pattern.toneRanks);\n  if (!Number.isFinite(pattern.radiusCells) || pattern.radiusCells <= 0\n      || !Number.isFinite(pattern.slotRadiusCells) || pattern.slotRadiusCells <= 0) {\n    throw new RangeError('3톤 큐브 반지름은 양수여야 한다');\n  }\n  return {\n    renderKind,\n    radiusCells: pattern.radiusCells,\n    slotRadiusCells: pattern.slotRadiusCells,\n    toneRanks: { ...pattern.toneRanks },\n  };\n}\n\n/** 두 표현 중 하나를 직렬화해 finder-patterns.js의 pattern 본문에 그대로 붙일 수 있게 한다. */\nexport function serializeFinderEditorPattern(pattern) {\n  const copy = cloneFinderEditorPattern(pattern);\n  if (copy.renderKind === 'cell-mask') {\n    return 'cellMasks: [' + copy.cellMasks.join(', ') + ']';\n  }\n  return [\n    'renderKind: \"three-tone-cube\",',\n    'radiusCells: ' + copy.radiusCells + ',',\n    'slotRadiusCells: ' + copy.slotRadiusCells + ',',\n    'toneRanks: { T: ' + copy.toneRanks.T + ', L: ' + copy.toneRanks.L + ', R: ' + copy.toneRanks.R + ' },',\n  ].join('\\n');\n}\n\n/**\n * 선택한 면이 실제로 dark → mid → bright (또는 역순)으로 이동하도록 해당 rank의\n * 소유 면과 교환한다. 그래서 매 단계도 중앙 큐브가 요구하는 0/1/2 순열로 남는다.\n */\nexport function cycleCubeToneRanks(toneRanks, face, direction) {\n  assertToneRanks(toneRanks);\n  if (!FACES.includes(face)) throw new RangeError('알 수 없는 큐브 면: ' + face);\n  if (direction !== 1 && direction !== -1) throw new RangeError('방향은 1 또는 -1이어야 한다');\n\n  const current = toneRanks[face];\n  const next = (current + direction + 3) % 3;\n  const otherFace = FACES.find((candidate) => toneRanks[candidate] === next);\n  const result = { ...toneRanks, [face]: next, [otherFace]: current };\n  assertToneRanks(result);\n  return result;\n}\n\nexport function finderEditorPatternsEqual(left, right) {\n  const a = cloneFinderEditorPattern(left);\n  const b = cloneFinderEditorPattern(right);\n  if (a.renderKind !== b.renderKind) return false;\n  if (a.renderKind === 'cell-mask') {\n    return a.cellMasks.every((mask, index) => mask === b.cellMasks[index]);\n  }\n  return a.radiusCells === b.radiusCells\n    && a.slotRadiusCells === b.slotRadiusCells\n    && FACES.every((face) => a.toneRanks[face] === b.toneRanks[face]);\n}\n"],
  ["lehmer", "// lehmer.js — base-6 digit ↔ (T,L,R) 휘도 순위 매핑\n//\n// SPEC §4.1 계약:\n//   셀당 3면(T=상단, L=좌측, R=우측)에 서로 다른 휘도 순위 {0=어두움, 1=중간, 2=밝음}을\n//   배정한다. 3! = 6 가지 → 심볼 알파벳 = base-6 digit {0..5}.\n//\n// 이 모듈은 SPEC §4.1 의 표를 **하드코딩하지 않는다.** 표준 Lehmer 코드\n// (factorial number system) 로부터 알고리즘적으로 유도한다. 유도 규약은 다음 셋의 조합이며,\n// 이 조합만이 SPEC 표 6행 전부를 재현한다 (test/lehmer.test.js 가 이를 단언한다):\n//\n//   (1) factoradic 자릿수는 **최상위 우선**(MSD-first):\n//         d = L[0]·2! + L[1]·1! + L[2]·0!,  L[i] ∈ [0, n-1-i]\n//   (2) 알파벳은 면의 **정준 오름차순** [T, L, R] (인덱스 0,1,2)\n//   (3) Lehmer 가 뽑아낸 순열은 \"**밝은 면부터 어두운 면 순서**\"로 읽는다.\n//         → 위치 i 에 놓인 면의 순위 = (n-1) - i\n//\n// (3) 이 핵심이다. Lehmer 순열을 \"면별 순위\"로 곧이곧대로 읽으면 SPEC 표와 어긋난다\n// (그 둘은 서로 역순열 관계). \"순위별 면의 나열\"로 읽고 내림차순 순위를 배정해야\n// SPEC 표가 나온다.\n//\n// 유도 예 (d=3):\n//   factoradic(3) = [1,1,0]\n//   pool=[T,L,R] → L 선택 → pool=[T,R] → R 선택 → pool=[T] → T\n//   밝기순 나열 = [L, R, T]  → L=2(밝음), R=1(중간), T=0(어두움)\n//   → (T,L,R) = (0,2,1)   == SPEC §4.1 digit 3 ✓\n\n/** 면 라벨 정준 순서. 인덱스가 곧 Lehmer 알파벳의 순서다 (SPEC §3.2). */\nexport const FACES = Object.freeze(['T', 'L', 'R']);\n\n/** 면의 개수 n. 순열 개수 = n! = 6. */\nexport const FACE_COUNT = FACES.length;\n\n/** 심볼 알파벳 크기 = 3! = 6 (SPEC §4.1). */\nexport const RADIX = factorial(FACE_COUNT);\n\n/** 최대 순위 값 (2 = 가장 밝음). */\nexport const MAX_RANK = FACE_COUNT - 1;\n\n/** 팩토리얼. n 이 3 이라 재귀 깊이 걱정 없음. */\nfunction factorial(n) {\n  let acc = 1;\n  for (let i = 2; i <= n; i += 1) acc *= i;\n  return acc;\n}\n\n/**\n * digit → factoradic (Lehmer) 자릿수 배열. 최상위 우선.\n * L[i] ∈ [0, n-1-i], 가중치 (n-1-i)!.\n * @param {number} digit 0..n!-1\n * @param {number} n 원소 개수\n * @returns {number[]} 길이 n 의 Lehmer 코드\n */\nexport function toLehmerCode(digit, n = FACE_COUNT) {\n  assertDigit(digit);\n  const code = new Array(n);\n  let rest = digit;\n  for (let i = 0; i < n; i += 1) {\n    const weight = factorial(n - 1 - i);\n    code[i] = Math.floor(rest / weight);\n    rest -= code[i] * weight;\n  }\n  return code;\n}\n\n/**\n * factoradic (Lehmer) 자릿수 배열 → digit. `toLehmerCode` 의 역.\n * @param {number[]} code\n * @returns {number}\n */\nexport function fromLehmerCode(code) {\n  const n = code.length;\n  let digit = 0;\n  for (let i = 0; i < n; i += 1) {\n    const limit = n - 1 - i;\n    if (!Number.isInteger(code[i]) || code[i] < 0 || code[i] > limit) {\n      throw new RangeError(`Lehmer 코드 자릿수 범위 위반: code[${i}]=${code[i]}, 허용 0..${limit}`);\n    }\n    digit += code[i] * factorial(limit);\n  }\n  return digit;\n}\n\n/**\n * digit → 밝은 면부터 어두운 면 순서로 나열한 **면 인덱스 배열**.\n * 위 규약 (3) 의 중간 산출물이며, 렌더러 디버깅에 유용해 공개한다.\n * @param {number} digit 0..5\n * @returns {number[]} 예: digit 3 → [1, 2, 0]  (L, R, T 순으로 밝음)\n */\nexport function digitToBrightnessOrder(digit) {\n  const code = toLehmerCode(digit, FACE_COUNT);\n  // pool: 아직 배치되지 않은 면 인덱스 (정준 오름차순 유지)\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const order = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    order[i] = pool.splice(code[i], 1)[0];\n  }\n  return order;\n}\n\n/**\n * 밝기순 면 인덱스 배열 → digit. `digitToBrightnessOrder` 의 역.\n * @param {number[]} order\n * @returns {number}\n */\nexport function brightnessOrderToDigit(order) {\n  assertPermutation(order, FACE_COUNT, '밝기 순서');\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const code = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    const at = pool.indexOf(order[i]);\n    code[i] = at;\n    pool.splice(at, 1);\n  }\n  return fromLehmerCode(code);\n}\n\n/**\n * SPEC §4.1: digit → 각 면의 휘도 순위.\n * @param {number} digit 0..5\n * @returns {{T: number, L: number, R: number}} 각 값은 {0,1,2} 의 순열\n */\nexport function digitToRanks(digit) {\n  const order = digitToBrightnessOrder(digit);\n  const byFace = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    // 위치 i 는 i 번째로 밝은 면 → 순위 = MAX_RANK - i\n    byFace[order[i]] = MAX_RANK - i;\n  }\n  // 키 삽입 순서는 반드시 정준 FACES 순서 ['T','L','R'] 여야 한다.\n  // 밝기 순서대로 삽입하면 digit 마다 키 순서가 달라져 (a) Object.values() 가\n  // 어떤 digit 이든 항상 [2,1,0] 을 내고 (b) JSON.stringify 결과가 digit 별로\n  // 갈린다. M0 완료 기준이 \"동일 입력 → 결정적 출력\" 이라 여기가 정확히 함정이다.\n  const ranks = {};\n  for (let i = 0; i < FACE_COUNT; i += 1) ranks[FACES[i]] = byFace[i];\n  return ranks;\n}\n\n/**\n * SPEC §4.1 의 역: 각 면의 휘도 순위 → digit.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number} 0..5\n */\nexport function ranksToDigit(ranks) {\n  const arr = ranksToArray(ranks);\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  // 순위 배열의 역: 순위 r 을 가진 면이 (MAX_RANK - r) 번째로 밝다\n  const order = new Array(FACE_COUNT);\n  for (let f = 0; f < FACE_COUNT; f += 1) {\n    order[MAX_RANK - arr[f]] = f;\n  }\n  return brightnessOrderToDigit(order);\n}\n\n/**\n * 순위 객체 → 정준 순서(T,L,R) 배열. 렌더러/디코더가 배열 형태를 선호할 때 사용.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number[]}\n */\nexport function ranksToArray(ranks) {\n  if (ranks === null || typeof ranks !== 'object') {\n    throw new TypeError('순위는 {T,L,R} 객체여야 한다');\n  }\n  return FACES.map((face) => ranks[face]);\n}\n\n/**\n * 정준 순서(T,L,R) 배열 → 순위 객체.\n * @param {number[]} arr\n * @returns {{T: number, L: number, R: number}}\n */\nexport function arrayToRanks(arr) {\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  const ranks = {};\n  FACES.forEach((face, i) => { ranks[face] = arr[i]; });\n  return ranks;\n}\n\n/**\n * 순위 객체가 유효한가 ({0..2} 의 순열인가).\n * @param {unknown} ranks\n * @returns {boolean}\n */\nexport function isValidRanks(ranks) {\n  try {\n    assertPermutation(ranksToArray(/** @type {any} */ (ranks)), FACE_COUNT, '면 순위');\n    return true;\n  } catch {\n    return false;\n  }\n}\n\n/**\n * 유도된 매핑 표 전체 (digit 0..5). 테스트·문서·디버깅용.\n * @returns {{digit: number, ranks: {T: number, L: number, R: number}}[]}\n */\nexport function mappingTable() {\n  const rows = [];\n  for (let d = 0; d < RADIX; d += 1) rows.push({ digit: d, ranks: digitToRanks(d) });\n  return rows;\n}\n\nfunction assertDigit(digit) {\n  if (!Number.isInteger(digit) || digit < 0 || digit >= RADIX) {\n    throw new RangeError(`digit 범위 위반: ${digit} (허용 0..${RADIX - 1})`);\n  }\n}\n\nfunction assertPermutation(arr, n, what) {\n  if (!Array.isArray(arr) || arr.length !== n) {\n    throw new TypeError(`${what}는 길이 ${n} 배열이어야 한다`);\n  }\n  const seen = new Set();\n  for (const v of arr) {\n    if (!Number.isInteger(v) || v < 0 || v >= n) {\n      throw new RangeError(`${what} 원소 범위 위반: ${v} (허용 0..${n - 1})`);\n    }\n    if (seen.has(v)) throw new RangeError(`${what}에 중복 값: ${v}`);\n    seen.add(v);\n  }\n}\n"],
  ["gfp", "/**\n * gfp.js — 소수체 GF(p), p = 211 산술 + 다항식 연산\n *\n * ADR 0001 §2.3·§6: RS 부호를 셀 도메인(3 digit = 1 심볼, 알파벳 크기 216)에서\n * 직접 걸려면 216 이하 최대 소수인 **211** 위의 체가 필요하다. 6³=216 자체는\n * 소수거듭제곱이 아니라서(2³·3³) 체를 이루지 못한다 — GF(6³) 은 \"비표준\"이\n * 아니라 **존재하지 않는다**.\n *\n * ⚠ 표수가 2 가 아니다. GF(2^8)(`gf256.js`) 습관을 그대로 옮기면 전부 틀린다.\n *   - **뺄셈 ≠ 덧셈.** GF(2^m) 에서는 -a = a (XOR 자기역) 이지만 GF(p), p 홀수\n *     소수에서는 -a = p - a ≠ a (a≠0 일 때). `sub` 를 `add` 로 대체하면 안 된다.\n *   - **부호가 실재한다.** 오류 크기(Forney)·다항식 뺄셈 전부에서 부호를\n *     놓치면 \"조용히\" 틀린 값이 나온다 (XOR 세계와 달리 대칭이 없어 자가진단이\n *     안 된다) — 검증 라운드가 이 함정을 실제로 실증했다(ADR §6 리스크표).\n *   - **형식적 미분 계수도 다르다.** GF(2^m) 은 짝수차항이 미분에서 소멸하는\n *     \"홀수항 트릭\"을 쓰지만, GF(p) 의 형식적 미분은 일반 미적분과 같다:\n *     d/dx (c_k x^k) = (k mod p)·c_k · x^(k-1). 홀수항 트릭을 복사하면 틀린다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다 (Node 전용 API 없음).\n *\n * ── 다항식 표현 규약 ─────────────────────────────────────────────────────\n * `gf256.js` 와 동일하게 **big-endian(내림차순)** 계수 배열을 기본으로 쓴다.\n *   poly[0] = 최고차항 계수, poly[poly.length - 1] = 상수항\n * (RS 복호 내부의 Λ(x)·Ω(x) 는 `rs211.js` 안에서 little-endian 을 따로 쓰며\n *  그 파일에 명시돼 있다 — gfp.js 는 big-endian 만 다룬다.)\n */\n\n/** 체의 위수(소수) — 6³ = 216 이하 최대 소수. ADR 0001 §2.3 근거 2. */\nexport const P = 211;\n\n/** 곱셈군 위수 |GF(211)^*| = 210 = 2·3·5·7 */\nexport const MULTIPLICATIVE_ORDER = P - 1; // 210\n\n/** 210 의 소인수 — 생성원 위수 검증에 쓴다 (210 = 2·3·5·7). */\nconst ORDER_PRIME_FACTORS = Object.freeze([2, 3, 5, 7]);\n\n// ── 스칼라 연산 (테이블 독립, 체 생성보다 먼저 필요) ────────────────────\n\n/** a + b mod p */\nexport function add(a, b) {\n  return (a + b) % P;\n}\n\n/**\n * a - b mod p.\n * **뺄셈 ≠ 덧셈.** JS 의 `%` 는 음수를 남길 수 있으므로 +P 로 보정한다.\n */\nexport function sub(a, b) {\n  return ((a - b) % P + P) % P;\n}\n\n/** a * b mod p */\nexport function mul(a, b) {\n  return (a * b) % P;\n}\n\n/**\n * a^n mod p (n >= 0). 반복 제곱(square-and-multiply).\n * 체 생성(테이블 구축) 이전에도 써야 하므로 테이블에 의존하지 않는다.\n */\nexport function modPow(a, n) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`modPow 의 지수는 0 이상 정수여야 한다: ${n}`);\n  }\n  let base = ((a % P) + P) % P;\n  let exp = n;\n  let result = 1;\n  while (exp > 0) {\n    if (exp & 1) result = mul(result, base);\n    base = mul(base, base);\n    exp >>= 1;\n  }\n  return result;\n}\n\n/**\n * a 의 곱셈 역원. **페르마의 소정리** a^(p-2) ≡ a^-1 (mod p) 를 쓴다.\n *\n * 선택 근거: p 가 작은 소수(211)라 `modPow` 반복제곱이 최대 ~8 회 곱셈으로\n * 끝나 확장 유클리드 호제법과 성능 차이가 무의미하고, 나눗셈 없는 곱셈만\n * 쓰므로 구현이 짧고 부호 실수가 끼어들 자리가 없다(확장 유클리드는 몫·나머지\n * 부호 처리가 또 다른 함정이다 — 이 파일 상단 경고와 같은 종류의 실수).\n */\nexport function inverse(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) 0 의 역원은 없다');\n  return modPow(aa, P - 2);\n}\n\n/** a / b mod p */\nexport function div(a, b) {\n  return mul(a, inverse(b));\n}\n\n// ── 생성원 탐색 + exp/log 테이블 ─────────────────────────────────────────\n\n/**\n * g 가 GF(211)^* (위수 210) 의 원시원소(생성원)인지 판정한다.\n * 정의: g^210 = 1 (페르마 소정리로 항상 참) 이고, 210 의 모든 소인수 q 에\n * 대해 g^(210/q) ≠ 1. 이 조건이 위수가 정확히 210(= 부분군 아님)임을 보장한다.\n */\nfunction isPrimitiveRoot(g) {\n  if (modPow(g, MULTIPLICATIVE_ORDER) !== 1) return false; // 안전망 (항상 참이어야 함)\n  for (const q of ORDER_PRIME_FACTORS) {\n    if (modPow(g, MULTIPLICATIVE_ORDER / q) === 1) return false;\n  }\n  return true;\n}\n\n/**\n * 최소 생성원을 계산으로 찾는다 (외우지 않는다 — ADR 지시).\n * 2..p-1 을 순회하며 `isPrimitiveRoot` 로 검증한 첫 값을 쓴다.\n */\nfunction findGenerator() {\n  for (let g = 2; g < P; g++) {\n    if (isPrimitiveRoot(g)) return g;\n  }\n  throw new Error('GF(211) 에서 원시원소를 찾지 못했다 — 산술 구현 버그');\n}\n\n/** 생성원 α. 계산으로 찾되(=2), 값 자체를 export 해 테스트가 재검증할 수 있게 한다. */\nexport const GENERATOR = findGenerator();\n\n/**\n * EXP[i] = α^i mod p, i = 0..209.\n * LOG[EXP[i]] = i (log(0) 은 정의되지 않음 → -1 센티넬).\n *\n * 주기가 210(= MULTIPLICATIVE_ORDER)이다 — GF(2^8) 의 255 와 다르다.\n * 길이를 2*210 으로 잡아 mul/div 색인에서 mod 없이 더할 수 있게 한다.\n */\nconst EXP = new Uint8Array(2 * MULTIPLICATIVE_ORDER);\nconst LOG = new Int16Array(P).fill(-1);\n\n{\n  let x = 1;\n  for (let i = 0; i < MULTIPLICATIVE_ORDER; i++) {\n    if (LOG[x] !== -1) {\n      throw new Error(`생성원 ${GENERATOR} 검증 실패 — 주기가 210 미만이다 (i=${i})`);\n    }\n    EXP[i] = x;\n    LOG[x] = i;\n    x = mul(x, GENERATOR);\n  }\n  if (x !== 1) {\n    throw new Error('GF(211) 생성원 순환 검증 실패 — α^210 ≠ 1');\n  }\n  for (let i = MULTIPLICATIVE_ORDER; i < EXP.length; i++) {\n    EXP[i] = EXP[i - MULTIPLICATIVE_ORDER];\n  }\n}\n\nexport { EXP, LOG };\n\n/** 이산로그. log(0) 은 정의되지 않으므로 예외. */\nexport function log(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) log(0) 은 정의되지 않는다');\n  return LOG[aa];\n}\n\n/**\n * α^n. n 은 음수·210 이상도 허용한다 (mod 210 으로 감싼다).\n * 테이블 기반이라 `modPow` 보다 빠르고, 체 구축 이후의 정상 경로다.\n */\nexport function alphaPow(n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const e = ((n % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n/**\n * 테이블 기반 거듭제곱 a^n (n 은 음수 허용, a ≠ 0 이어야 함 — 0 은 `modPow` 로).\n * 관례: 0^0 = 1(빈 곱), 0^n(n>0) = 0, 0^n(n<0) 은 예외.\n */\nexport function pow(a, n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) {\n    if (n === 0) return 1;\n    if (n < 0) throw new RangeError('GF(211) 0 의 음수 거듭제곱은 정의되지 않는다');\n    return 0;\n  }\n  const e = (((LOG[aa] * n) % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n// ── 다항식 연산 (big-endian: index 0 = 최고차) ────────────────────────────\n\n/** p(x) * scalar */\nexport function polyScale(p, scalar) {\n  const out = new Uint8Array(p.length);\n  for (let i = 0; i < p.length; i++) out[i] = mul(p[i], scalar);\n  return out;\n}\n\n/** p(x) + q(x). 길이가 다르면 **상수항 기준(오른쪽)** 으로 정렬해 더한다. */\nexport function polyAdd(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = add(out[idx], q[i]);\n  }\n  return out;\n}\n\n/**\n * p(x) - q(x). **표수 2 가 아니므로 `polyAdd` 와 다른 결과다.**\n * (`gf256.js` 에는 이 함수가 없다 — 거기서는 sub === add 라서 불필요했다.)\n */\nexport function polySub(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = sub(out[idx], q[i]);\n  }\n  return out;\n}\n\n/** p(x) * q(x) */\nexport function polyMul(p, q) {\n  if (p.length === 0 || q.length === 0) return new Uint8Array(0);\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) {\n      out[i + j] = add(out[i + j], mul(pi, q[j]));\n    }\n  }\n  return out;\n}\n\n/** 선행 0 계수를 제거한다. 전부 0 이면 [0] 을 돌려준다. */\nexport function polyTrim(p) {\n  let i = 0;\n  while (i < p.length - 1 && p[i] === 0) i++;\n  const out = new Uint8Array(Math.max(p.length - i, 1));\n  for (let j = 0; j < out.length; j++) out[j] = p[i + j] ?? 0;\n  return out;\n}\n\n/**\n * 다항식 나눗셈 (synthetic division).\n * @returns {{quotient: Uint8Array, remainder: Uint8Array}}\n *          remainder 길이 = deg(divisor) (선행 0 포함, 고정 길이)\n */\nexport function polyDiv(dividend, divisor) {\n  const dv = polyTrim(divisor);\n  if (dv.length === 1 && dv[0] === 0) throw new RangeError('0 다항식으로 나눌 수 없다');\n  const degDiv = dv.length - 1;\n  if (dividend.length < dv.length) {\n    const rem = new Uint8Array(degDiv);\n    for (let i = 0; i < dividend.length; i++) {\n      rem[i + degDiv - dividend.length] = dividend[i];\n    }\n    return { quotient: new Uint8Array([0]), remainder: rem };\n  }\n  const work = new Uint8Array(dividend.length);\n  for (let i = 0; i < dividend.length; i++) work[i] = dividend[i];\n  const qLen = dividend.length - degDiv;\n  const dvLeadInv = inverse(dv[0]);\n  for (let i = 0; i < qLen; i++) {\n    const coef = mul(work[i], dvLeadInv);\n    work[i] = coef;\n    if (coef === 0) continue;\n    for (let j = 1; j < dv.length; j++) {\n      if (dv[j] !== 0) work[i + j] = sub(work[i + j], mul(dv[j], coef));\n    }\n  }\n  return { quotient: work.slice(0, qLen), remainder: work.slice(qLen) };\n}\n\n/** Horner 법 평가 p(x) */\nexport function polyEval(p, x) {\n  if (p.length === 0) return 0;\n  let y = p[0];\n  for (let i = 1; i < p.length; i++) y = add(mul(y, x), p[i]);\n  return y;\n}\n"],
  ["rs211", "/**\n * rs211.js — 체계적 Reed-Solomon 부호 over GF(211)\n *\n * ADR 0001 §6 / §8.3: RS 부호화를 **셀 도메인**으로 옮긴다 — RS 심볼 1개 =\n * 셀 3개(digit 3개, base-211). 코드워드 = 메시지 ‖ 패리티, n ≤ 210(체의\n * 곱셈군 위수).\n *\n * ⚠ GF(2^8) 용 `rs.js` 를 그대로 베끼면 안 된다. 표수가 2 가 아니므로:\n *   - 부호화의 \"몫 없이 나머지만\" 트릭에서 XOR 대신 진짜 뺄셈을 쓴다.\n *   - Berlekamp-Massey 의 갱신식이 뺄셈을 쓴다 (XOR 로는 GF(2^m) 에서만 우연히 맞는다).\n *   - Forney 공식에 **음의 부호가 실재한다** — GF(2^m) 은 -1=1 이라 안 보였을 뿐이다.\n *   - 형식적 미분 Λ'(x) 는 \"홀수항만 남는\" GF(2^m) 트릭이 아니라 일반 미적분과\n *     같다: d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1).\n *\n * 복호 실패는 절대 조용히 삼키지 않는다 — `{ ok:false, reason }` 을 돌려주거나\n * `RSDecodeError` 를 던진다. 오류가 t 개를 넘으면 원리적으로 다른 유효\n * 코드워드로 오정정될 수 있고(그때는 ok:true 지만 값이 다름) 이는 부호의\n * 한계이지 버그가 아니다 — 상위 계층(포맷 CRC 등)이 최종 방어선이다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다.\n */\n\nimport { P, MULTIPLICATIVE_ORDER, add, sub, mul, div, inverse, alphaPow, polyEval } from './gfp.js';\n\n/** 코드워드 최대 길이. RS over GF(q) 는 n ≤ q − 1 — GF(211) 에서 210. */\nexport const MAX_CODEWORD_LEN = MULTIPLICATIVE_ORDER;\n\n/** 생성다항식 첫 근 지수 (first consecutive root) 기본값. */\nexport const DEFAULT_FCR = 0;\n\n/**\n * 규범 nsym 표 — **공식으로 유도하지 않는다** (ADR 0001 §3.3.3: 공식+플래그 조합이\n * 비대칭 비교 사고를 두 번 냈다).\n *\n * 출처를 정확히 가른다 (검증 라운드 지적 반영):\n * - **M 값 (7 / 14 / 23): ADR §3.3.2, 2026-07-29 사용자 확정.** V3 = 23 은 같은 t=11 을\n *   주는 22 대신 +1 B 를 오정정 검출 여유로 지출한 명시적 결정이다 (패리티율 정확히 25.0%).\n * - **V3 H = 37: ADR §8.1 ECC-H 실측 행** (nsym=37 · K=53 B · ε@95% 4.5~5.0%).\n * - **L 값 전부와 V1/V2 의 H 값: 오케스트레이터 파생** — SPEC §6 비율(L 12% / H 40%)을\n *   심볼 수에 곱해 반올림한 것 (V1: 27×0.12→3, 27×0.4→11 / V2: 55×0.12→7, 55×0.4→22 /\n *   V3: 92×0.12→11). ADR·PM 문서에는 없다. SPEC §5.5 재생성 시 이 파생값이 표와 함께\n *   규범으로 승격된다 — 그 전까지는 잠정.\n *\n * **M0 T8 오버헤드 대사 (통합자 사전 검산, placement.js `overheadBreakdown(k)` 실계산과\n * 일치)**: V2 의 overhead 가 잠정 50 → 실계산 49 로 정정되며 데이터 셀이 167 → 168 로\n * 늘고(3의 배수), 이에 따라 사용 심볼 S 가 55 → **56** 으로 바뀐다. **nsym(L7/M14/H22) 은\n * 하나도 바뀌지 않는다** — M=14 는 56 기준으로도 패리티율이 정확히 25.0%(14/56)라\n * ADR §3.3.2 확정값을 그대로 재사용해도 비율 요건이 깨지지 않는다. V1(overhead 45→45,\n * symbols 27 불변)·V3(overhead 55→53, dataCells 276→278, residual 0→2 지만 ⌊278/3⌋=92\n * 로 symbols 92 불변)는 usedSymbols 자체가 바뀌지 않아 nsym 표를 그대로 쓴다.\n */\nexport const NSYM_TABLE = Object.freeze({\n  V1: Object.freeze({ symbols: 27, L: 3, M: 7, H: 11 }),\n  V2: Object.freeze({ symbols: 56, L: 7, M: 14, H: 22 }),\n  V3: Object.freeze({ symbols: 92, L: 11, M: 23, H: 37 }),\n});\n\n/**\n * daehan 파인더(79셀 전면) 변형의 nsym 표 — **2026-08-18 운영자 확정**.\n *\n * daehan 은 불스아이 19셀 **밖으로 파인더 셀을 더 쓰는 첫 후보**라 데이터 셀을\n * 실제로 깎는다 (k=6 −20 · k=8 −40 · k=10 −60). 그래서 사용 심볼 S 가 본표와 다르다:\n * 27 → **20** · 56 → **42** · 92 → **72**.\n *\n * **nsym 은 현행 동명 버전의 값을 그대로 승계한다** — 즉 정정능력 t 를 지금과 같게\n * 유지하는 선택이고, 비율(패리티율)이 아니라 **절대 정정능력**을 보존한 것이다.\n * 심볼이 줄었으므로 패리티율은 자동으로 올라간다 (V1D/M = 7/20 = 35.0%, 본표 V1/M\n * 7/27 = 25.9%). 이는 의도된 결과다: 파인더가 커진 만큼 남은 본문이 짧아지므로\n * 같은 t 라도 상대적 보호는 더 두꺼워야 한다.\n *\n * ⚠ **함정 — 절대 본표를 고쳐 재사용하지 마라.**\n *   V1D 의 nsym (3 / 7 / 11) 은 현행 `V1` 과 **문자 그대로 같다**. 그래서 «V1 행에서\n *   symbols 만 27 → 20 으로 고치면 되겠네» 로 읽기 쉽다. 그러면 **이미 발행된 V1\n *   프레임이 전부 깨진다** — `capacityFor` 가 symbols 불일치로 던지거나(운 좋은 경우),\n *   던지지 않으면 데이터 심볼 수가 달라져 조용히 다른 코드가 된다. 별도 키\n *   (`V1D`/`V2D`/`V3D`)로 분리해 둔 이유가 이것이고, 본표 `NSYM_TABLE` 은 daehan\n *   편입으로 **한 값도 바뀌지 않았다**.\n *\n * 결과 순 페이로드 (실측 — `capacityDaehan.js` 가 산출하고 테스트가 값으로 잠근다):\n *   V1D  L 15 B · M 11 B · H 7 B\n *   V2D  L 32 B · M 26 B · H 18 B\n *   V3D  L 57 B · M 46 B · H 32 B\n */\nexport const NSYM_TABLE_DAEHAN = Object.freeze({\n  V1D: Object.freeze({ symbols: 20, L: 3, M: 7, H: 11 }),\n  V2D: Object.freeze({ symbols: 42, L: 7, M: 14, H: 22 }),\n  V3D: Object.freeze({ symbols: 72, L: 11, M: 23, H: 37 }),\n});\n\n/** 복호 실패 예외. `reason` / `syndromes` 를 함께 싣는다. */\nexport class RSDecodeError extends Error {\n  constructor(message, details = {}) {\n    super(message);\n    this.name = 'RSDecodeError';\n    Object.assign(this, details);\n  }\n}\n\n// ── 입력 검증 ───────────────────────────────────────────────────────────\n\nfunction toSymbols(input, label) {\n  if (!Array.isArray(input) && !ArrayBuffer.isView(input)) {\n    throw new TypeError(`${label} 는 배열이어야 한다`);\n  }\n  const out = new Uint8Array(input.length);\n  for (let i = 0; i < input.length; i++) {\n    const v = input[i];\n    if (!Number.isInteger(v) || v < 0 || v >= P) {\n      throw new RangeError(`${label}[${i}] 는 0..${P - 1} 정수여야 한다: ${v}`);\n    }\n    out[i] = v;\n  }\n  return out;\n}\n\nfunction validateNsym(nsym) {\n  if (!Number.isInteger(nsym) || nsym < 1 || nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(`nsym 은 1..${MAX_CODEWORD_LEN} 정수여야 한다: ${nsym}`);\n  }\n}\n\nfunction validateFcr(fcr) {\n  if (!Number.isInteger(fcr) || fcr < 0) {\n    throw new RangeError(`fcr 은 0 이상 정수여야 한다: ${fcr}`);\n  }\n}\n\n// ── 용량 헬퍼 ───────────────────────────────────────────────────────────\n\n/** nsym 패리티로 정정 가능한 최대 심볼 오류 수 t = ⌊nsym/2⌋ */\nexport function errorCapacity(nsym) {\n  validateNsym(nsym);\n  return Math.floor(nsym / 2);\n}\n\n/**\n * 소거(erasure) 만 있을 때 정정 가능한 최대 심볼 수 = nsym.\n * 위치를 아는 소거는 오류 1개당 패리티 1개만 쓴다 — 위치를 모르는 오류가\n * 2개를 쓰는 것과 대비된다. 혼합 한계는 `2·v + s ≤ nsym` (v = 오류, s = 소거).\n */\nexport function erasureCapacity(nsym) {\n  validateNsym(nsym);\n  return nsym;\n}\n\n/** 소거 s 개가 이미 잡혔을 때 추가로 정정 가능한 (위치 미상) 오류 수 ⌊(nsym − s)/2⌋. */\nexport function errorCapacityWithErasures(nsym, erasureCount) {\n  validateNsym(nsym);\n  if (!Number.isInteger(erasureCount) || erasureCount < 0) {\n    throw new RangeError(`erasureCount 는 0 이상 정수여야 한다: ${erasureCount}`);\n  }\n  if (erasureCount > nsym) return -1;\n  return Math.floor((nsym - erasureCount) / 2);\n}\n\n/** 주어진 nsym 에서 한 블록에 실을 수 있는 최대 데이터 심볼 수. n > 210 은 거부된다. */\nexport function maxDataLen(nsym) {\n  validateNsym(nsym);\n  return MAX_CODEWORD_LEN - nsym;\n}\n\n// ── 부호화 ──────────────────────────────────────────────────────────────\n\n/**\n * 생성 다항식 g(x) = ∏_{i=0}^{nsym-1} (x - α^(fcr+i)) — big-endian, 모닉.\n * **뺄셈이 실재한다**: (x - α^k) 의 상수항은 `sub(0, α^k)` = p - α^k 다\n * (`rs.js` 의 GF(2^8) 버전은 이 자리에서 `+`를 썼는데 표수 2 라서 우연히 맞았다).\n * @returns {Uint8Array} 길이 nsym + 1, g[0] === 1\n */\nexport function rsGeneratorPoly(nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  validateNsym(nsym);\n  validateFcr(fcr);\n  let g = Uint8Array.of(1);\n  for (let i = 0; i < nsym; i++) {\n    const root = alphaPow(fcr + i);\n    const factor = Uint8Array.of(1, sub(0, root)); // (x - root)\n    g = polyMulBE(g, factor);\n  }\n  return g;\n}\n\n/** big-endian 다항식 곱 (로컬 — gfp.js 의 polyMul 과 동일하지만 순환 의존 피하려 인라인하지 않고 재사용) */\nfunction polyMulBE(p, q) {\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(pi, q[j]));\n  }\n  return out;\n}\n\n/**\n * 체계적 RS 부호화. 코드워드 = 메시지 ‖ 패리티(nsym 심볼).\n * 표준 LFSR 합성제법: `msg ‖ 0*nsym` 을 g(x) 로 나눈 나머지를 msg 뒤에 붙인다.\n * **`sub` 를 쓴다** — GF(2^8) 판은 XOR 라 add/sub 구분이 없었지만 여기선 다르다.\n * @param {Uint8Array|number[]} msg\n * @param {number} nsym\n * @param {{fcr?: number, generator?: Uint8Array}} [options]\n * @returns {Uint8Array} 길이 msg.length + nsym\n */\nexport function rsEncode(msg, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR, generator } = options;\n  const data = toSymbols(msg, 'msg');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (data.length + nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(\n      `msg.length(${data.length}) + nsym(${nsym}) = ${data.length + nsym} > ${MAX_CODEWORD_LEN}`,\n    );\n  }\n  const g = generator ?? rsGeneratorPoly(nsym, { fcr });\n  if (g.length !== nsym + 1) {\n    throw new RangeError(`generator 차수가 nsym 과 다르다: deg=${g.length - 1}, nsym=${nsym}`);\n  }\n\n  const out = new Uint8Array(data.length + nsym);\n  out.set(data, 0);\n  // 합성 나눗셈: g[0] === 1(모닉)이므로 나눗셈 없이 곱셈만으로 나머지를 구한다.\n  // out 은 P(x) = msg(x)·x^nsym 을 나타내고(꼬리가 0으로 채워져 있으므로),\n  // 이 루프가 끝나면 out[data.length:] 에는 P(x) 를 g(x) 로 나눈 **나머지 r(x)** 가 남는다.\n  for (let i = 0; i < data.length; i++) {\n    const coef = out[i];\n    if (coef === 0) continue;\n    for (let j = 0; j < g.length; j++) {\n      out[i + j] = sub(out[i + j], mul(g[j], coef));\n    }\n  }\n  // 코드워드 = P(x) − r(x) 라야 g(x) 로 나누어떨어진다 → 패리티 = **−r**.\n  // ⚠ 표수 2(GF(2^8))에서는 −r = r 이라 이 부호가 안 보였다. 여기서 빠뜨리면\n  // \"나머지를 그대로 패리티로 쓰는\" 조용한 부호 버그가 된다 — 실제로 처음엔\n  // 이걸 놓쳐서 신드롬이 0이 되지 않았다(개발 중 실측).\n  for (let j = data.length; j < out.length; j++) {\n    out[j] = sub(0, out[j]);\n  }\n  // out[0..data.length) 는 위 루프에서 뭉개졌으므로 원 메시지로 복원한다.\n  out.set(data, 0);\n  return out;\n}\n\n/**\n * 신드롬 S_i = C(α^(fcr+i)), i = 0..nsym-1.\n * 유효 코드워드면 전부 0 이다 (RS 의 정의적 성질) — 이 성질 자체를 테스트로 검증한다.\n * @returns {Uint8Array} 길이 nsym\n */\nexport function rsSyndromes(codeword, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  const cw = toSymbols(codeword, 'codeword');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  const s = new Uint8Array(nsym);\n  for (let i = 0; i < nsym; i++) s[i] = polyEval(cw, alphaPow(fcr + i));\n  return s;\n}\n\n// ── 복호 내부: little-endian 다항식 헬퍼 ────────────────────────────────\n// Λ(x) = 1 + Λ1·x + Λ2·x² + ... 형태가 자연스러운 알고리즘(BM/Forney)만\n// little-endian(index i = x^i 계수) 을 쓴다. gfp.js 의 poly* 는 big-endian.\n\nfunction polyEvalLE(p, x) {\n  let y = 0;\n  let xp = 1;\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] !== 0) y = add(y, mul(p[i], xp));\n    xp = mul(xp, x);\n  }\n  return y;\n}\n\nfunction polyMulLE(p, q) {\n  const out = new Array(p.length + q.length - 1).fill(0);\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(p[i], q[j]));\n  }\n  return out;\n}\n\n/**\n * 형식적 미분 Λ'(x). **GF(p), p ≠ 2 에서는 일반 미적분과 같다** —\n * d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1). GF(2^m) 의 \"홀수항만 남는다\" 트릭은\n * 표수 2 의 우연(짝수 k 는 k mod 2 = 0 이라 소멸)이고 여기서는 성립하지 않는다.\n */\nfunction polyDerivLE(p) {\n  const out = new Array(Math.max(p.length - 1, 1)).fill(0);\n  for (let k = 1; k < p.length; k++) {\n    out[k - 1] = mul(k % P, p[k]);\n  }\n  return out;\n}\n\n/**\n * Berlekamp-Massey. 신드롬열을 만드는 최단 LFSR 의 연결다항식 Λ(x) 를 찾는다.\n * 판별식 d 는 합(연산상 항상 덧셈 — 어느 체에서나 그렇다), 갱신식은 **뺄셈**을 쓴다:\n *   Λ_new(x) = Λ(x) − (d/b)·x^m·B(x)\n * (`rs.js` 의 GF(2^8) 판은 이 자리에서 XOR 를 썼는데 표수 2 라서 우연히 맞았다.)\n * @param {Uint8Array} synd 저차→고차 신드롬\n * @returns {{lambda: number[], L: number}} lambda 는 little-endian, lambda[0] === 1\n */\nfunction berlekampMassey(synd) {\n  let lambda = [1];\n  let B = [1];\n  let L = 0;\n  let m = 1;\n  let b = 1;\n\n  for (let n = 0; n < synd.length; n++) {\n    let d = synd[n];\n    for (let i = 1; i <= L; i++) {\n      if (i < lambda.length && lambda[i] !== 0) d = add(d, mul(lambda[i], synd[n - i]));\n    }\n\n    if (d === 0) {\n      m += 1;\n      continue;\n    }\n\n    const coef = div(d, b);\n    const prev = lambda.slice();\n    const need = B.length + m;\n    if (lambda.length < need) lambda = lambda.concat(new Array(need - lambda.length).fill(0));\n    for (let i = 0; i < B.length; i++) {\n      if (B[i] !== 0) lambda[i + m] = sub(lambda[i + m], mul(coef, B[i]));\n    }\n\n    if (2 * L <= n) {\n      L = n + 1 - L;\n      B = prev;\n      b = d;\n      m = 1;\n    } else {\n      m += 1;\n    }\n  }\n\n  while (lambda.length > 1 && lambda[lambda.length - 1] === 0) lambda.pop();\n  return { lambda, L };\n}\n\n/**\n * Chien 탐색. Λ(x) 의 근 x = X_k^{-1} 를 찾아 **코드워드 배열 인덱스** 로 환산한다.\n * big-endian 코드워드에서 배열 인덱스 j 는 x^(n-1-j) 항이므로 X_k = α^(n-1-j).\n * @returns {number[]} 오름차순 오류 위치(배열 인덱스)\n */\nfunction chienSearch(lambda, n) {\n  const positions = [];\n  for (let j = 0; j < n; j++) {\n    const p = n - 1 - j;\n    if (polyEvalLE(lambda, alphaPow(-p)) === 0) positions.push(j);\n  }\n  return positions;\n}\n\n/**\n * Forney 알고리즘으로 오류 크기를 구한다.\n *   Ω(x) = S(x)·Λ(x) mod x^nsym\n *   Y_k = − X_k^(1-fcr) · Ω(X_k^-1) / Λ'(X_k^-1)\n *\n * ⚠ **음의 부호가 실재한다.** GF(2^m) 판(`rs.js`)의 주석은 \"표수 2 이므로\n * 부호는 사라진다\" 고 적었고 그 자리에서 부호 없이 반환했다 — 여기서 그걸\n * 그대로 베끼면 모든 정정값이 부호 반전으로 틀린다. `sub(0, ...)` 로 반드시 음화한다.\n * @returns {(number|null)[]} positions 와 같은 순서의 오류 크기. 분모가 0 이면 null.\n */\nfunction forney(synd, lambda, positions, n, fcr) {\n  const S = Array.from(synd);\n  const full = polyMulLE(S, lambda);\n  const omega = full.slice(0, synd.length);\n  const dLambda = polyDerivLE(lambda);\n\n  return positions.map((j) => {\n    const p = n - 1 - j;\n    const Xinv = alphaPow(-p);\n    const denom = polyEvalLE(dLambda, Xinv);\n    if (denom === 0) return null;\n    const num = polyEvalLE(omega, Xinv);\n    let scale = 1;\n    const e = 1 - fcr;\n    if (e !== 0) {\n      const ee = ((e % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n      scale = alphaPow(p * ee);\n    }\n    const magnitude = mul(scale, div(num, denom));\n    return sub(0, magnitude); // ← 소수체의 실재하는 부호\n  });\n}\n\n// ── 소거(erasure) 복호 내부 ─────────────────────────────────────────────\n\n/**\n * 소거 위치 목록 정규화. 배열 인덱스(big-endian 코드워드 기준)를 오름차순\n * 중복 제거해 돌려준다. 범위 밖/비정수는 던진다 — 조용히 버리면 «소거를\n * 넣었는데 왜 못 고치지» 가 디버깅 불가능해진다.\n */\nfunction normalizeErasurePositions(erasures, n) {\n  if (erasures === undefined || erasures === null) return [];\n  if (!Array.isArray(erasures) && !ArrayBuffer.isView(erasures)) {\n    throw new TypeError('erasures 는 배열이어야 한다');\n  }\n  const seen = new Set();\n  const out = [];\n  for (let i = 0; i < erasures.length; i++) {\n    const v = erasures[i];\n    if (!Number.isInteger(v) || v < 0 || v >= n) {\n      throw new RangeError(`erasures[${i}] 는 0..${n - 1} 정수여야 한다: ${v}`);\n    }\n    if (seen.has(v)) continue;\n    seen.add(v);\n    out.push(v);\n  }\n  out.sort((a, b) => a - b);\n  return out;\n}\n\n/**\n * 소거 위치자 Γ(x) = ∏(1 − Z_m·x), Z_m = α^(n−1−j_m). little-endian.\n * Chien 탐색이 Λ(X^-1) = 0 을 보는 규약과 같은 규약이다.\n */\nfunction erasureLocator(positions, n) {\n  let gamma = [1];\n  for (const j of positions) {\n    const Z = alphaPow(n - 1 - j);\n    gamma = polyMulLE(gamma, [1, sub(0, Z)]);\n  }\n  return gamma;\n}\n\n/**\n * Forney 신드롬. T(x) = S(x)·Γ(x) mod x^nsym 의 **계수 s..nsym−1** 를 돌려준다\n * (길이 nsym − s). 이 잘라내기가 핵심이다: 앞의 s 개 계수에는 소거 항이\n * 남아 있고, s 번째부터가 «소거를 제거한 신드롬열» 이라 BM 이 남은 오류만 본다.\n *\n * ⚠ GF(2^m) 구현(reedsolo 등)의 `f[j] = f[j]·X ^ f[j+1]` 을 그대로 베끼면 안 된다 —\n * 표수 2 에서만 소거 항 (X + X_k) 가 소멸한다. 소수체에서는 **뺄셈** 이 실재해\n * (X_k − X) 라야 소멸한다. 여기서는 Γ 곱셈으로 그 뺄셈을 자동으로 얻는다.\n */\nfunction forneySyndromes(synd, gamma, erasureCount) {\n  const S = Array.from(synd);\n  const full = polyMulLE(S, gamma);\n  return full.slice(erasureCount, S.length);\n}\n\n/**\n * RS 소거·오류 혼합 복호. `rsDecode(received, nsym, { erasures })` 의 본체다.\n * 한계는 **2·v + s ≤ nsym** (v = 위치 미상 오류, s = 소거).\n *\n * ### 검출 마진 — 소거를 많이 선언할수록 «틀렸다고 말할 능력» 이 줄어든다\n *\n * 이 함수의 4중 관문(한계 검사 · 위치자 차수 · Chien 근수 · 정정 후 신드롬\n * 재검산)은 **잔여 패리티 `nsym − s` 가 있을 때만** 검출력을 가진다. 한계를\n * 넘긴 입력이 «조용한 오정정»(ok:true + 틀린 코드워드) 으로 나가는 비율은 실측상\n * 잔여 패리티에만 의존한다 (2v+s = nsym+2 rung, nsym ∈ {7,11,14,22,23,37} × 300회):\n *\n * | 잔여 `nsym − s` | 0 | 2 | 4 | 6 | ≥ 8 |\n * |---|---|---|---|---|---|\n * | 조용한 오정정 | **100 %** | 약 19 % | 약 2~4 % | 0.3 % 이하 | 0 % |\n *\n * **`s = nsym` 은 확률이 아니라 절벽이다.** 소거 nsym 개면 신드롬 nsym 개와 미지수\n * nsym 개가 정확히 결정계다 — 해가 유일하게 존재하고 그 해는 정의상 모든 신드롬을\n * 0 으로 만든다. 그래서 미선언 오류가 하나라도 섞여 있으면 정정 결과는 «다른 유효\n * 코드워드» 이고, 마지막 관문인 신드롬 재검산이 **구성상 반드시 통과한다**. 실측\n * 3,500/3,500 조용한 오정정 · 정직 실패 0. RS 의 고유 한계이지 이 구현의 결함이\n * 아니다 — 고칠 수 있는 종류가 아니다.\n *\n * 따라서 **`s` 가 nsym 에 붙는 운용점에서 ECC 는 방어선이 아니다.** 그 지점의\n * 방어는 전적으로 상위층(`decode.js` 의 base-211 범위 · 길이 헤더 · UTF-8 유효성 ·\n * 0 패딩) 몫이다. 호출부는 `erasureCount` 를 보고 «ECC 가 여기서 뭘 보증하는가» 를\n * 판단해야 한다. 이 계약은 `test/rs211.test.js` 의 nsym+2 rung 과\n * `test/decode.test.js` 의 상위층 방어선 테스트가 양쪽에서 고정한다.\n */\nfunction rsDecodeErasures(cw, nsym, fcr, erasurePositions) {\n  const n = cw.length;\n  const s = erasurePositions.length;\n  const syndromes = rsSyndromes(cw, nsym, { fcr });\n\n  const fail = (reason) => ({\n    ok: false,\n    reason,\n    syndromes,\n    errorPositions: null,\n    erasurePositions: erasurePositions.slice(),\n    erasureCount: s,\n  });\n  const succeed = (out, changed) => {\n    const erased = new Set(erasurePositions);\n    const errorPositions = changed.filter((position) => !erased.has(position));\n    return {\n      ok: true,\n      codeword: out,\n      message: out.slice(0, n - nsym),\n      parity: out.slice(n - nsym),\n      errorPositions,\n      errorCount: errorPositions.length,\n      erasurePositions: erasurePositions.slice(),\n      erasureCount: s,\n      correctedPositions: changed.slice(),\n      syndromes,\n    };\n  };\n\n  if (s > nsym) {\n    return fail(`소거 개수(${s})가 패리티 심볼 수(${nsym})를 넘었다 — 원리적으로 복구 불가`);\n  }\n\n  let clean = true;\n  for (let i = 0; i < syndromes.length; i++) {\n    if (syndromes[i] !== 0) {\n      clean = false;\n      break;\n    }\n  }\n  // 신드롬이 전부 0 이면 수신어가 이미 유효 코드워드다. 소거로 «표시만» 됐을 뿐\n  // 값이 우연히 맞은 경우이므로 고칠 것이 없다.\n  if (clean) return succeed(cw.slice(), []);\n\n  const gamma = erasureLocator(erasurePositions, n);\n  const fsynd = forneySyndromes(syndromes, gamma, s);\n  const tRemaining = Math.floor((nsym - s) / 2);\n\n  const { lambda, L } = berlekampMassey(fsynd);\n  if (L > tRemaining) {\n    return fail(\n      `소거 ${s} 개를 제외하고도 오류가 한계를 넘었다 `\n      + `(Berlekamp-Massey deg Λ = ${L}, 잔여 t = ${tRemaining})`,\n    );\n  }\n  if (lambda.length - 1 !== L) {\n    return fail(`Λ 차수(${lambda.length - 1})와 LFSR 길이(${L})가 불일치 — 정정 불가`);\n  }\n\n  const psi = polyMulLE(lambda, gamma);\n  while (psi.length > 1 && psi[psi.length - 1] === 0) psi.pop();\n  const degree = psi.length - 1;\n  if (degree !== L + s) {\n    return fail(`errata 위치자 차수(${degree})가 오류 ${L} + 소거 ${s} 와 다르다 — 정정 불가`);\n  }\n\n  const positions = chienSearch(psi, n);\n  if (positions.length !== degree) {\n    return fail(\n      `Chien 탐색이 errata 위치자의 근을 전부 찾지 못했다 (${positions.length}/${degree}) — 정정 불가`,\n    );\n  }\n\n  const magnitudes = forney(syndromes, psi, positions, n, fcr);\n  if (magnitudes.some((m) => m === null)) {\n    return fail('Forney 분모 Ψ′(X^-1) = 0 — 정정 불가');\n  }\n\n  const out = cw.slice();\n  const changed = [];\n  for (let k = 0; k < positions.length; k++) {\n    if (magnitudes[k] === 0) continue;\n    out[positions[k]] = sub(out[positions[k]], magnitudes[k]);\n    changed.push(positions[k]);\n  }\n\n  const after = rsSyndromes(out, nsym, { fcr });\n  for (let i = 0; i < after.length; i++) {\n    if (after[i] !== 0) {\n      return fail('정정 후에도 신드롬이 0 이 아니다 — 2·오류 + 소거 가 nsym 을 넘었다');\n    }\n  }\n\n  return succeed(out, changed);\n}\n\n/**\n * RS 복호. t = ⌊nsym/2⌋ 개까지의 심볼 오류를 정정한다.\n *\n * 실패 검출(조용한 오정정을 막는 4중 관문):\n *   1. L(=degΛ 추정) > t\n *   2. Λ 차수와 BM 이 보고한 L 불일치\n *   3. Chien 탐색이 찾은 근의 개수 ≠ L\n *   4. 정정 적용 후 신드롬 재검산이 0 이 아님\n *\n * `options.erasures` 에 **배열 인덱스** 목록을 주면 소거 복호로 갈아탄다:\n * 한계가 t = ⌊nsym/2⌋ 에서 **2·v + s ≤ nsym** 으로 넓어진다 (소거만이면 nsym 개).\n * 인자를 생략하면 기존 경로와 코드가 문자 그대로 같다 — 소비자 옵트인이다.\n *\n * @param {Uint8Array|number[]} received 수신 코드워드 (메시지 ‖ 패리티)\n * @param {number} nsym\n * @param {{fcr?: number, erasures?: number[]|Uint8Array|Uint16Array}} [options]\n * @returns {{ok:true, codeword:Uint8Array, message:Uint8Array, parity:Uint8Array,\n *            errorPositions:number[], errorCount:number, syndromes:Uint8Array,\n *            erasurePositions?:number[], erasureCount?:number,\n *            correctedPositions?:number[]}\n *         | {ok:false, reason:string, syndromes:Uint8Array, errorPositions:null}}\n */\nexport function rsDecode(received, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR, erasures } = options;\n  const cw = toSymbols(received, 'received');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (cw.length > MAX_CODEWORD_LEN) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 ${MAX_CODEWORD_LEN} 을 넘는다`);\n  }\n  if (cw.length <= nsym) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 nsym(${nsym}) 이하다 — 메시지가 없다`);\n  }\n\n  const erasurePositions = normalizeErasurePositions(erasures, cw.length);\n  if (erasurePositions.length > 0) {\n    return rsDecodeErasures(cw, nsym, fcr, erasurePositions);\n  }\n\n  const n = cw.length;\n  const t = Math.floor(nsym / 2);\n  const syndromes = rsSyndromes(cw, nsym, { fcr });\n\n  const fail = (reason) => ({ ok: false, reason, syndromes, errorPositions: null });\n  const succeed = (out, positions) => ({\n    ok: true,\n    codeword: out,\n    message: out.slice(0, n - nsym),\n    parity: out.slice(n - nsym),\n    errorPositions: positions,\n    errorCount: positions.length,\n    syndromes,\n  });\n\n  let clean = true;\n  for (let i = 0; i < syndromes.length; i++) {\n    if (syndromes[i] !== 0) {\n      clean = false;\n      break;\n    }\n  }\n  if (clean) return succeed(cw.slice(), []);\n\n  const { lambda, L } = berlekampMassey(syndromes);\n  if (L === 0 || L > t) {\n    return fail(`오류 개수가 정정 한계를 넘었다 (Berlekamp-Massey deg Λ = ${L}, t = ${t})`);\n  }\n  if (lambda.length - 1 !== L) {\n    return fail(`Λ 차수(${lambda.length - 1})와 LFSR 길이(${L})가 불일치 — 정정 불가`);\n  }\n\n  const positions = chienSearch(lambda, n);\n  if (positions.length !== L) {\n    return fail(`Chien 탐색이 Λ 의 근을 전부 찾지 못했다 (${positions.length}/${L}) — 정정 불가`);\n  }\n\n  const magnitudes = forney(syndromes, lambda, positions, n, fcr);\n  if (magnitudes.some((m) => m === null)) {\n    return fail('Forney 분모 Λ′(X^-1) = 0 — 정정 불가');\n  }\n\n  const out = cw.slice();\n  const changed = [];\n  for (let k = 0; k < positions.length; k++) {\n    if (magnitudes[k] === 0) continue;\n    // e_k = magnitudes[k] 는 received = true + E 의 오류값이다 → true = received − e_k\n    out[positions[k]] = sub(out[positions[k]], magnitudes[k]);\n    changed.push(positions[k]);\n  }\n\n  const after = rsSyndromes(out, nsym, { fcr });\n  for (let i = 0; i < after.length; i++) {\n    if (after[i] !== 0) {\n      return fail('정정 후에도 신드롬이 0 이 아니다 — 오류가 정정 한계를 넘었다');\n    }\n  }\n\n  return succeed(out, changed);\n}\n\n/**\n * 소거 복호 전용 진입점. `rsDecode(received, nsym, { ...options, erasures })` 와 같다.\n * 소비자가 «소거를 쓰고 있다» 는 사실을 호출부에서 읽히게 하려고 따로 둔다.\n * erasures 가 비면 일반 오류 복호로 그대로 내려간다.\n *\n * @param {Uint8Array|number[]} received\n * @param {number} nsym\n * @param {number[]|Uint8Array|Uint16Array} erasures 배열 인덱스 목록\n * @param {{fcr?: number}} [options]\n */\nexport function rsDecodeWithErasures(received, nsym, erasures, options = {}) {\n  return rsDecode(received, nsym, { ...options, erasures });\n}\n\n/**\n * `rsDecode` 의 예외 던지는 래퍼. 성공 시 메시지 심볼만 돌려준다.\n * @throws {RSDecodeError}\n */\nexport function rsDecodeMessage(received, nsym, options = {}) {\n  const result = rsDecode(received, nsym, options);\n  if (!result.ok) {\n    throw new RSDecodeError(`RS 복호 실패: ${result.reason}`, {\n      reason: result.reason,\n      syndromes: result.syndromes,\n    });\n  }\n  return result.message;\n}\n"],
  ["base211", "// base211.js — 셀 3개 ↔ RS 심볼(GF(211)) 매핑 + 바이트열 ↔ 심볼열 청킹 (ADR 0001 D3′)\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 배경 (ADR 0001, docs/adr/0001_base6_error_amplification.md)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 승인된 새 규약: **3 digit = 1 RS 심볼, RS over GF(211)**.\n// 파이프라인 순서 (§8.2 예정 문안): 바이트 → 심볼(이 모듈의 청커) → RS(심볼 도메인)\n// → digit(이 모듈의 3-digit 패킹, ×3) → 마스크 → scan order 로 셀 배치.\n// 즉 이 모듈은 **서로 다른 두 계층**을 담당한다. 절대 섞지 말 것:\n//\n//   [계층 A] 셀 도메인 ↔ RS 심볼 값 — 3 digit(base-6, {0..5} 각각) ↔ 정수 0..215.\n//            216 = 6^3 상태 중 **211..215 는 GF(211) 밖(불법)**. 인코더는 RS 심볼이\n//            언제나 0..210 이므로 불법값을 만들 수 없다(청커가 보장). 디코더는\n//            셀에서 읽은 3-digit 이 211..215 로 떨어지면 **명시적으로 위치를 보고**한다\n//            (예외를 던지지 않는다 — RS 소거 정정(P4)의 입력이 되기 때문).\n//\n//   [계층 B] 페이로드 바이트열 ↔ RS 심볼열 — RS 부호화 **이전**에 끝나는 자릿수(base-211)\n//            변환. 청크 단위 **27 바이트 ↔ 28 심볼** (211^28 >= 2^216, 211^27 < 2^216 이므로\n//            27 이 상한이자 28 이 최소). 상수 메모리, 청크 독립 변환, big-endian 바이트 →\n//            BigInt → base-211 MSD-first. 꼬리(1..26 바이트)는 ceil(8m / log2 211) 심볼.\n//\n// **오정정보다 무서운 실패는 \"조용한 절단\"이다.** 값이 목표 폭에 들어가지 않으면\n// 반드시 던진다 — 그리고 **출력 버퍼를 오염시키기 전에** 던진다. base6.js 의\n// bigIntToDigits/bigIntToBytes 는 다 쓴 뒤에야 나머지를 검사해 실패 시에도 out 이\n// 이미 절단된 값으로 채워져 있었다(검증에서 잡힌 실패 사례). 이 모듈은 쓰기 전에\n// 크기를 확인한다.\n\n// ── [계층 A] 셀 3-digit ↔ RS 심볼 값 ────────────────────────────────────────────\n\n/** 셀 1개(digit)의 알파벳 크기 (base-6, SPEC §4.1). */\nexport const CELL_DIGIT_BASE = 6;\n\n/** RS 심볼 1개를 구성하는 셀(digit) 개수. */\nexport const DIGITS_PER_SYMBOL = 3;\n\n/** 3-digit 조합이 표현 가능한 전체 상태 수 = 6^3. */\nexport const CELL_TRIPLE_STATES = CELL_DIGIT_BASE ** DIGITS_PER_SYMBOL; // 216\n\n/** RS 심볼이 사는 체 GF(211) 의 위수. 이 값이 GF(211) 안의 합법 심볼 개수다. */\nexport const RS_SYMBOL_BASE = 211;\n\n/** 3-digit 조합 중 GF(211) 밖으로 떨어지는 값의 최솟값 (포함) — 211..215. */\nexport const ILLEGAL_SYMBOL_MIN = RS_SYMBOL_BASE; // 211\n\n/** 3-digit 조합 중 GF(211) 밖으로 떨어지는 값의 최댓값 (포함). */\nexport const ILLEGAL_SYMBOL_MAX = CELL_TRIPLE_STATES - 1; // 215\n\n/**\n * 3-digit(각 0..5) → 정수 값 0..215. MSD-first: v = d0·36 + d1·6 + d2\n * (§4.2 기존 규약과 정합 — 최상위 digit 이 배열 앞).\n * 이 함수는 216 상태 전체에 대한 **전단사**다. GF(211) 합법성은 별도로 `isLegalSymbolValue`\n * 로 판정한다 — 여기서는 판정하지 않는다(디코더가 불법값도 일단 값으로 받아야\n * 위치 보고가 가능하기 때문).\n * @param {number} d0\n * @param {number} d1\n * @param {number} d2\n * @returns {number} 0..215\n */\nexport function cellDigitsToSymbolValue(d0, d1, d2) {\n  assertCellDigit(d0, 0);\n  assertCellDigit(d1, 1);\n  assertCellDigit(d2, 2);\n  return d0 * CELL_DIGIT_BASE * CELL_DIGIT_BASE + d1 * CELL_DIGIT_BASE + d2;\n}\n\n/**\n * 정수 값 0..215 → 3-digit(각 0..5), MSD-first. `cellDigitsToSymbolValue` 의 역함수.\n * @param {number} value 0..215\n * @returns {[number, number, number]}\n */\nexport function symbolValueToCellDigits(value) {\n  if (!Number.isInteger(value) || value < 0 || value >= CELL_TRIPLE_STATES) {\n    throw new RangeError(`심볼 값 범위 위반: ${value} (허용 0..${CELL_TRIPLE_STATES - 1})`);\n  }\n  const d0 = Math.floor(value / (CELL_DIGIT_BASE * CELL_DIGIT_BASE));\n  const rem = value % (CELL_DIGIT_BASE * CELL_DIGIT_BASE);\n  const d1 = Math.floor(rem / CELL_DIGIT_BASE);\n  const d2 = rem % CELL_DIGIT_BASE;\n  return [d0, d1, d2];\n}\n\n/** value 가 GF(211) 안의 합법 RS 심볼인지 (0..210). */\nexport function isLegalSymbolValue(value) {\n  return Number.isInteger(value) && value >= 0 && value < RS_SYMBOL_BASE;\n}\n\nfunction assertCellDigit(d, position) {\n  if (!Number.isInteger(d) || d < 0 || d >= CELL_DIGIT_BASE) {\n    throw new RangeError(\n      `digit 범위 위반 (위치 ${position}): ${d} (허용 0..${CELL_DIGIT_BASE - 1})`,\n    );\n  }\n}\n\n/**\n * 셀 도메인 digit 배열(3의 배수 길이) → RS 심볼 값 배열.\n * **디코더용.** 불법값(211..215)을 만나도 던지지 않고 위치를 함께 보고한다 —\n * RS 소거 정정(P4)의 입력이 되기 때문. 인코더 방향에서는 `unpackSymbolsToCellDigits`\n * 를 쓴다(합법 심볼만 다루므로 불법값이 원천적으로 발생하지 않는다).\n * @param {Uint8Array|number[]} digits 길이가 3의 배수\n * @returns {{ symbols: Uint8Array, illegalIndices: number[] }} illegalIndices 는\n *   symbols 배열 기준 인덱스(셀 인덱스 아님).\n */\nexport function packCellDigitsToSymbols(digits) {\n  if (!digits || typeof digits.length !== 'number') {\n    throw new TypeError('digits 는 배열 유사 객체여야 한다');\n  }\n  if (digits.length % DIGITS_PER_SYMBOL !== 0) {\n    throw new RangeError(\n      `digit 개수는 ${DIGITS_PER_SYMBOL} 의 배수여야 한다: ${digits.length}`,\n    );\n  }\n  const symbolCount = digits.length / DIGITS_PER_SYMBOL;\n  const symbols = new Uint8Array(symbolCount);\n  const illegalIndices = [];\n  for (let i = 0; i < symbolCount; i += 1) {\n    const base = i * DIGITS_PER_SYMBOL;\n    const value = cellDigitsToSymbolValue(digits[base], digits[base + 1], digits[base + 2]);\n    symbols[i] = value; // Uint8Array 는 0..255 를 담으므로 215 까지도 무손실 저장\n    if (!isLegalSymbolValue(value)) illegalIndices.push(i);\n  }\n  return { symbols, illegalIndices };\n}\n\n/**\n * RS 심볼 값 배열(전부 합법, 0..210) → 셀 도메인 digit 배열(길이 = symbols.length × 3).\n * **인코더용.** 심볼이 불법값(>=211)이면 이 함수는 그 자리에서 던진다 — RS 는\n * GF(211) 위에서만 동작하므로 인코더가 불법 심볼을 만드는 것 자체가 상위 버그다.\n * 출력 버퍼를 쓰기 전에 전수 검증하므로 실패 시 out 이 오염되지 않는다.\n * @param {Uint8Array|number[]} symbols 값 0..210\n * @returns {Uint8Array}\n */\nexport function unpackSymbolsToCellDigits(symbols) {\n  if (!symbols || typeof symbols.length !== 'number') {\n    throw new TypeError('symbols 는 배열 유사 객체여야 한다');\n  }\n  for (let i = 0; i < symbols.length; i += 1) {\n    if (!isLegalSymbolValue(symbols[i])) {\n      throw new RangeError(`불법 RS 심볼 값 (인덱스 ${i}): ${symbols[i]} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n  }\n  const out = new Uint8Array(symbols.length * DIGITS_PER_SYMBOL);\n  for (let i = 0; i < symbols.length; i += 1) {\n    const [d0, d1, d2] = symbolValueToCellDigits(symbols[i]);\n    const base = i * DIGITS_PER_SYMBOL;\n    out[base] = d0;\n    out[base + 1] = d1;\n    out[base + 2] = d2;\n  }\n  return out;\n}\n\n// ── [계층 B] 바이트열 ↔ RS 심볼열 청커 (base-211 위치 기수법) ────────────────────\n\n/** 청크당 바이트 수. */\nexport const CHUNK_BYTES = 27;\n\n/** 청크당 심볼 수. 211^28 >= 2^216 이 성립하는 최소값(아래 자기검증 참조). */\nexport const CHUNK_SYMBOLS = 28;\n\nconst SYMBOL_BASE_BIG = 211n;\nconst BYTE_MASK = 0xffn;\n\n/**\n * 배열 구간 [offset, offset+count) 이 실재하는지 검증한다.\n * typed array 는 범위 밖 쓰기를 예외 없이 **조용히 버리므로**, 이 검사 없이는\n * \"조용한 절단 금지\" 계약이 쓰기 경로에서 공허해진다 (검증 라운드 지적).\n * 음수 count 도 여기서 잡는다 — offset > length 일 때 기본 length 인자가 음수가 되어\n * 루프가 0회 돌고 0n 이 반환되는 위장 실패를 막는다.\n */\nfunction assertRange(arr, offset, count, what) {\n  if (!Number.isInteger(offset) || offset < 0) {\n    throw new RangeError(`${what}: offset 은 0 이상 정수여야 한다: ${offset}`);\n  }\n  if (!Number.isInteger(count) || count < 0) {\n    throw new RangeError(`${what}: 개수는 0 이상 정수여야 한다: ${count} (offset ${offset} 이 배열 길이 ${arr.length} 를 넘었는가?)`);\n  }\n  if (offset + count > arr.length) {\n    throw new RangeError(`${what}: 구간 [${offset}, ${offset + count}) 이 배열 길이 ${arr.length} 를 넘는다`);\n  }\n}\n\n// 모듈 로드 시 1회 자기검증: 27B↔28심볼이 무손실 최소 청크인지 BigInt 로 단언.\n// (ADR §6.2 근거 5 · PM/005 요구사항 — \"27 이 상한이자 28 이 최소\".)\n(() => {\n  const bound = 1n << BigInt(8 * CHUNK_BYTES); // 2^216\n  const pow28 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS);\n  const pow27 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS - 1);\n  if (pow28 < bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS} < 2^${8 * CHUNK_BYTES}`);\n  }\n  if (pow27 >= bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS - 1} >= 2^${8 * CHUNK_BYTES} (28 이 최소가 아님)`);\n  }\n})();\n\n/**\n * m 바이트를 손실 없이 담는 **최소** base-211 심볼 수.\n * 정의상 min{ s : 211^s >= 2^(8m) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n * @param {number} m 바이트 수 (>= 0)\n * @returns {number}\n */\nexport function minSymbolsExact(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  const target = 1n << BigInt(8 * m);\n  let s = 0;\n  let pow = 1n;\n  while (pow < target) {\n    pow *= SYMBOL_BASE_BIG;\n    s += 1;\n  }\n  return s;\n}\n\n/**\n * 닫힌 형태 ceil(m·8 / log2 211) 을 부동소수로 계산한 것. `minSymbolsExact` 의 BigInt\n * 정확 계산과 일치해야 한다(테스트가 단언). 정본은 `minSymbolsExact`.\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountFormula(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  return Math.ceil((m * 8) / Math.log2(RS_SYMBOL_BASE));\n}\n\n/** m = 0..CHUNK_BYTES 사전 계산 표 (인덱스 = 바이트 수). */\nconst TAIL_SYMBOLS = Object.freeze(buildTailTable());\n\nfunction buildTailTable() {\n  const table = [];\n  for (let m = 0; m <= CHUNK_BYTES; m += 1) table.push(minSymbolsExact(m));\n  return table;\n}\n\n/**\n * m 바이트에 대응하는 심볼 개수(꼬리표 조회, m = 0..27) 또는 일반식(m > 27).\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountForBytes(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  if (m <= CHUNK_BYTES) return TAIL_SYMBOLS[m];\n  return minSymbolsExact(m);\n}\n\n/**\n * 전체 바이트 길이에 대응하는 심볼 총 개수.\n * @param {number} byteLength\n * @returns {number}\n */\nexport function symbolCountForByteLength(byteLength) {\n  if (!Number.isInteger(byteLength) || byteLength < 0) {\n    throw new RangeError(`바이트 길이는 0 이상 정수여야 한다: ${byteLength}`);\n  }\n  const full = Math.floor(byteLength / CHUNK_BYTES);\n  const tail = byteLength % CHUNK_BYTES;\n  return full * CHUNK_SYMBOLS + TAIL_SYMBOLS[tail];\n}\n\n/** 꼬리 심볼 수 → 꼬리 바이트 수 역인덱스. */\nconst TAIL_SYMBOLS_TO_BYTES = (() => {\n  const map = new Map();\n  for (let m = 0; m < CHUNK_BYTES; m += 1) map.set(TAIL_SYMBOLS[m], m);\n  return map;\n})();\n\n/**\n * 심볼 총 개수 → 바이트 길이. 꼬리 심볼 수가 서로 다르고 모두 28 미만이면 유일하게\n * 역산된다(테스트가 표의 단사성을 확인한다). 정본은 헤더 길이 필드다.\n * @param {number} symbolCount\n * @returns {number}\n */\nexport function byteLengthForSymbolCount(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const full = Math.floor(symbolCount / CHUNK_SYMBOLS);\n  const rem = symbolCount % CHUNK_SYMBOLS;\n  const tailBytes = TAIL_SYMBOLS_TO_BYTES.get(rem);\n  if (tailBytes === undefined) {\n    throw new RangeError(`유효한 청크 분해가 없는 심볼 개수: ${symbolCount} (나머지 ${rem})`);\n  }\n  return full * CHUNK_BYTES + tailBytes;\n}\n\n// ── 청크 단위 원시 변환 (상수 메모리 프리미티브) ─────────────────────────────────\n\n/**\n * 바이트 구간 → BigInt (빅엔디안).\n * @param {Uint8Array|number[]} bytes\n * @param {number} offset\n * @param {number} length\n * @returns {bigint}\n */\nexport function bytesToBigInt(bytes, offset = 0, length = bytes.length - offset) {\n  assertRange(bytes, offset, length, 'bytesToBigInt');\n  let value = 0n;\n  for (let i = 0; i < length; i += 1) {\n    const b = bytes[offset + i];\n    if (!Number.isInteger(b) || b < 0 || b > 255) {\n      throw new RangeError(`바이트 값 범위 위반: index ${offset + i} = ${b}`);\n    }\n    value = (value << 8n) | BigInt(b);\n  }\n  return value;\n}\n\n/**\n * BigInt → 바이트 구간에 기록 (빅엔디안). **쓰기 전에 크기를 검증**해서 실패 시\n * out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {Uint8Array} out\n * @param {number} offset\n * @param {number} length\n */\nexport function bigIntToBytes(value, out, offset, length) {\n  assertRange(out, offset, length, 'bigIntToBytes');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= (1n << BigInt(8 * length))) {\n    throw new RangeError(`값이 ${length} 바이트에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = length - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest & BYTE_MASK);\n    rest >>= 8n;\n  }\n}\n\n/**\n * BigInt → 심볼 배열에 기록 (MSD first). 앞은 0 으로 패딩.\n * **쓰기 전에 크기를 검증**해서 실패 시 out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {number} symbolCount\n * @param {Uint8Array|number[]} out\n * @param {number} offset\n */\nexport function bigIntToSymbols(value, symbolCount, out, offset = 0) {\n  assertRange(out, offset, symbolCount, 'bigIntToSymbols');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= SYMBOL_BASE_BIG ** BigInt(symbolCount)) {\n    throw new RangeError(`값이 심볼 ${symbolCount} 개에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = symbolCount - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest % SYMBOL_BASE_BIG);\n    rest /= SYMBOL_BASE_BIG;\n  }\n}\n\n/**\n * 심볼 구간 → BigInt (MSD first). 심볼 값이 0..210 를 벗어나면 던진다\n * (base-211 위치 기수법의 자릿값 자체가 GF(211) 범위이므로 이 검사가 곧\n * \"RS 심볼 도메인 검증\"이다 — 계층 A 의 셀 불법값 판정과는 별개).\n * @param {Uint8Array|number[]} symbols\n * @param {number} offset\n * @param {number} symbolCount\n * @returns {bigint}\n */\nexport function symbolsToBigInt(symbols, offset = 0, symbolCount = symbols.length - offset) {\n  assertRange(symbols, offset, symbolCount, 'symbolsToBigInt');\n  let value = 0n;\n  for (let i = 0; i < symbolCount; i += 1) {\n    const s = symbols[offset + i];\n    if (!isLegalSymbolValue(s)) {\n      throw new RangeError(`심볼 범위 위반: index ${offset + i} = ${s} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n    value = value * SYMBOL_BASE_BIG + BigInt(s);\n  }\n  return value;\n}\n\n/**\n * 한 청크(1..27 바이트) → 심볼들. 작업 메모리 상수.\n * @param {Uint8Array} bytes\n * @param {number} byteOffset\n * @param {number} byteLength 1..27\n * @param {Uint8Array|number[]} out\n * @param {number} symbolOffset\n * @returns {number} 기록한 심볼 개수\n */\nexport function encodeChunkInto(bytes, byteOffset, byteLength, out, symbolOffset) {\n  if (byteLength < 1 || byteLength > CHUNK_BYTES) {\n    throw new RangeError(`청크 바이트 길이는 1..${CHUNK_BYTES}: ${byteLength}`);\n  }\n  const symbolCount = TAIL_SYMBOLS[byteLength];\n  bigIntToSymbols(bytesToBigInt(bytes, byteOffset, byteLength), symbolCount, out, symbolOffset);\n  return symbolCount;\n}\n\n/**\n * 한 청크의 심볼들 → 바이트. 작업 메모리 상수.\n * @param {Uint8Array|number[]} symbols\n * @param {number} symbolOffset\n * @param {number} byteLength 1..27 (기대 바이트 수 — 헤더 길이 필드에서 온다)\n * @param {Uint8Array} out\n * @param {number} byteOffset\n * @returns {number} 소비한 심볼 개수\n */\nexport function decodeChunkInto(symbols, symbolOffset, byteLength, out, byteOffset) {\n  if (byteLength < 1 || byteLength > CHUNK_BYTES) {\n    throw new RangeError(`청크 바이트 길이는 1..${CHUNK_BYTES}: ${byteLength}`);\n  }\n  const symbolCount = TAIL_SYMBOLS[byteLength];\n  const value = symbolsToBigInt(symbols, symbolOffset, symbolCount);\n  bigIntToBytes(value, out, byteOffset, byteLength);\n  return symbolCount;\n}\n\n// ── 스트림 API ────────────────────────────────────────────────────────────────\n\n/**\n * 바이트열 → RS 심볼열. 27바이트 청크 단위 스트리밍.\n * @param {Uint8Array} bytes\n * @returns {Uint8Array} 심볼 값 {0..210} 의 배열\n */\nexport function bytesToSymbols(bytes) {\n  assertBytes(bytes);\n  const out = new Uint8Array(symbolCountForByteLength(bytes.length));\n  let byteOffset = 0;\n  let symbolOffset = 0;\n  while (byteOffset < bytes.length) {\n    const take = Math.min(CHUNK_BYTES, bytes.length - byteOffset);\n    symbolOffset += encodeChunkInto(bytes, byteOffset, take, out, symbolOffset);\n    byteOffset += take;\n  }\n  return out;\n}\n\n/**\n * RS 심볼열 → 바이트열.\n * @param {Uint8Array|number[]} symbols\n * @param {number} [byteLength] 페이로드 헤더의 바이트 길이 필드(정본). 생략하면\n *   심볼 개수로부터 역산한다.\n * @returns {Uint8Array}\n */\nexport function symbolsToBytes(symbols, byteLength) {\n  if (!symbols || typeof symbols.length !== 'number') {\n    throw new TypeError('symbols 는 배열 유사 객체여야 한다');\n  }\n  const len = byteLength === undefined ? byteLengthForSymbolCount(symbols.length) : byteLength;\n  const expected = symbolCountForByteLength(len);\n  if (symbols.length !== expected) {\n    throw new RangeError(\n      `심볼 개수 불일치: ${symbols.length} 개, 바이트 길이 ${len} 는 ${expected} 개를 요구`,\n    );\n  }\n  const out = new Uint8Array(len);\n  let byteOffset = 0;\n  let symbolOffset = 0;\n  while (byteOffset < len) {\n    const take = Math.min(CHUNK_BYTES, len - byteOffset);\n    symbolOffset += decodeChunkInto(symbols, symbolOffset, take, out, byteOffset);\n    byteOffset += take;\n  }\n  return out;\n}\n\n/**\n * 출력 배열을 통째로 잡지 않는 진짜 스트리밍 변환. 심볼을 하나씩 흘린   ["mask", "// mask.js — 마스크 m(q,r) · 후보 3종 + 선택 (SPEC §4.3 → 마스크 선택 개정)\n//\n// SPEC §4.3(구): 고정 마스크 1종(QR 식 마스크 선택 없음). 데이터 digit 에 m(q,r) 을\n// mod-6 가산해 시각 균일화 + 레퍼런스와의 혼동 방지를 노린다.\n//\n// **개정 (2026-08-16, 운영자 지시)**: 데이터 필드가 파인더로 오인되는 문제\n// (`claude-mimic-rate.md` §2\\~§3 실측 — 검증 통과 히트의 67\\~73 % 가 mimic)에 대응해\n// **후보 3종 중 렌더-스캔 페널티 최소 후보를 인코더가 고른다.** 고른 index 는 포맷\n// v2 의 6번째 digit(마스크 2 bit)에 실린다 — 와이어에 실리므로 디코더가 되읽는다.\n//\n// ── 후보 family — «새 매직넘버 금지» 를 지키는 유도 ─────────────────────────\n//\n// 후보는 **이미 선정된 hash 공식 하나에서만** 파생한다(새 상수 도입 금지):\n// 아발란치 직전 단계에 **그 공식이 이미 쓰는 상수**를 seed 로 XOR 한다.\n//\n//   seed 0 = 0            → XOR 항등 ⇒ **현행 hash 와 바이트 동일** (와이어 보존)\n//   seed 1 = 0x9e3779b1   → 이 공식의 q 계수 (황금비 상수)\n//   seed 2 = 0x85ebca77   → 이 공식의 r 계수 (murmur3 fmix32 상수)\n//\n// seed 는 좌표에 곱해지지 않고 상수로 XOR 되므로 후보 간 관계가 «좌표 평행이동» 이\n// 아니다 — 아발란치(shift-xor · imul)를 통과하며 세 필드가 서로 무상관해진다(§실측표).\n//\n// ── 선정 절차 (순서 고정 — 규칙 먼저, 측정 다음, 선택 마지막) ────────────────\n//\n//   ① 카이제곱 균등성: 측정 영역(regionCells(k) 중 중심 2링 19셀 제외)에서\n//      chi2(df=5) <= 15.086 (alpha=0.01 임계값)\n//   ② 이웃 상관: 6방향을 3 정준 방향으로 축약(대칭 쌍 중복 제거)해 각 방향의\n//      Cramér's V 를 재고, 후보의 대표값은 버전×방향 전체의 **최대값**. 이 최대값이\n//      가장 작은 후보가 승자 후보.\n//   ③ 축 방향 자기상관: 원점을 지나는 세 격자축 직선(t=-100..100)을 따라\n//      주기 <=6 인 반복이 있으면 FAIL. (아핀형은 mod-6 선형이라 필연적으로\n//      period | 6 이므로 여기서 항상 FAIL — 이것이 \"축 밴딩\" 예상 실패 모드다.)\n//\n//   ①③ 을 **둘 다** 통과한 후보만 ② 비교에 들어간다. ①③ 을 통과하는 후보가\n//   하나뿐이면 ② 비교는 자명하게 그 후보가 승자다(TLcube/test/mask.test.js 의\n//   실측이 이 상황임을 재확인한다). 동률이면 공식이 단순한 쪽.\n//\n// ── 실측 결과 요약 (T4 numbers_check 전문 참조) ───────────────────────────\n//\n//   candidate   ①(chi2<=15.086)      ③(주기<=6 없음)   ② maxV(참고, 비교 대상 아님)\n//   affine      PASS (전 버전 <1)     FAIL(선형 필연)    1.0 (탈락이라 무의미)\n//   quadratic   FAIL (전 버전 >>15)   FAIL              0.29~0.35 (탈락이라 무의미)\n//   hash        PASS (전 버전 <9)     PASS               0.12~0.22\n//\n//   → ①③ 을 모두 통과하는 후보는 **hash** 뿐이다. CHOSEN = 'hash'.\n//\n// ── 후보 3종 3관문 재측정 (2026-08-16, `test/output/lanes/mask-gates.mjs`) ──\n//\n//   같은 3관문을 seed 파생 후보 3종에 그대로 돌린 결과. ③ 은 세 후보 모두 주기 없음.\n//\n//   후보(seed)          ① chi2 V1/V2/V3       ①판정   ② maxV(hex)  ② maxV(Y)\n//   mask0 (0x00000000)  8.556 / 5.636 / 4.692  PASS    0.2237       0.1918\n//   mask1 (0x9e3779b1)  4.889 / 8.485 / 9.115  PASS    0.2647       0.1715\n//   mask2 (0x85ebca77)  5.333 / 5.091 / 2.538  PASS    0.2387       0.1975\n//\n//   ② 는 «①③ 통과자 중 하나를 고르는» 타이브레이크였다. 마스크 **선택** 체제에서는\n//   셋 다 남기므로 ② 는 기각 기준이 아니라 참고값이다 — 그래도 세 후보가 모두\n//   affine(1.0)·quadratic(0.29\\~0.35) 대비 낮은 대역(0.14\\~0.27)에 있음을 확인한다.\n//   후보 간 «같은 digit» 비율은 Y1(441셀)에서 0.127 / 0.145 / 0.191 로 무상관\n//   기대치 1/6 ≈ 0.167 부근 — 세 필드가 서로의 평행이동이 아니다.\n//\n// 정수 연산 안전성: q, r 이 |q|,|r| <= 20 범위(V3 k=10 보다 넉넉한 여유)에서\n// ⚠ 첫 곱셈 `q * 0x9e3779b1` 은 int32 를 넘는다 (|q|=20 에서 ~5.3e10). 그래도 안전한\n// 이유: double 은 2^53 까지 정수를 정확히 표현하고(|q|,|r| ≤ 2^21 에서 곱이 2^53 미만),\n// 직후의 `| 0` / `^` 가 ToInt32 로 결정적으로 축약한다. 이후 단계는 `Math.imul` /\n// `>>> ` 로 JS 정수 연산의 브라우저·Node 결정성을 못 박는다.\n\nfunction mod6(n) {\n  return ((n % 6) + 6) % 6;\n}\n\n// ── 후보 ①: 아핀형 (대조군) ────────────────────────────────────────────────\n// (a·q + b·r) mod 6. mod-6 선형이라 계수 조합에 따라 반드시 어떤 축 방향으로\n// 등차수열(주기 | 6)이 나타난다 — 실측 ③이 이를 확인한다. 대조군으로만 남긴다.\nfunction affine(q, r) {\n  return mod6(1 * q + 2 * r);\n}\n\n// ── 후보 ②: 이차형 ─────────────────────────────────────────────────────────\n// (a·q + b·r + c·qr + d·q² + e·r²) mod 6. 짧은 주기는 피하지만(③ 통과 못함 —\n// 이차항도 mod 6 에서 결국 주기적이다) 균등성이 실측상 크게 무너진다(① FAIL).\nfunction quadratic(q, r) {\n  return mod6(1 * q + 2 * r + 3 * q * r + 1 * q * q + 5 * r * r);\n}\n\n// ── 후보 ③: 정수 해시형 (선정) ─────────────────────────────────────────────\n// 곱셈-시프트-XOR. 첫 곱은 double 정밀 정수 곱 + ToInt32 축약(위 헤더 주석 참조),\n// 이후는 `Math.imul` — 전 단계가 IEEE754/ECMA 규정 연산이라 브라우저·Node 동일 결과다\n// (테스트가 이를 단언한다). ⚠ 이 공식은 측정으로 확정됐다(SPEC §4.3) — 수정 금지.\n//\n// `seed` 는 2026-08-16 마스크 선택 개정이 더한 유일한 자유도다. seed=0 이면\n// `h ^ 0 === h` 라 **개정 전 공식과 연산 하나까지 동일**하다 — 구 와이어 보존.\nfunction hashSeeded(q, r, seed) {\n  let h = (q * 0x9e3779b1) ^ (r * 0x85ebca77);\n  h ^= seed;\n  h |= 0;\n  h ^= h >>> 15;\n  h = Math.imul(h, 0xc2b2ae35);\n  h ^= h >>> 13;\n  h |= 0;\n  return mod6(h);\n}\n\nfunction hash(q, r) {\n  return hashSeeded(q, r, 0);\n}\n\n/**\n * 마스크 후보 seed — 새 상수 없음. 0(항등) · hash 공식의 q 계수 · r 계수.\n * 순서가 곧 **마스크 index** 이고 그대로 와이어(포맷 v2 6번째 digit)에 실린다.\n */\nexport const MASK_SEEDS = Object.freeze([0, 0x9e3779b1, 0x85ebca77]);\n\n/** 후보 수. 포맷 v2 의 마스크 필드는 2 bit(0..3) — 3 사용 · 1 예약. */\nexport const MASK_COUNT = MASK_SEEDS.length;\n\n/** 마스크 index 필드 폭 (bit). 포맷 v2 payload 와 공유하는 계약. */\nexport const MASK_INDEX_BITS = 2;\n\n/** 개정 전 동작(마스크 선택 없음)의 index — 생략 시 기본값. */\nexport const DEFAULT_MASK_INDEX = 0;\n\nexport function assertMaskIndex(index) {\n  if (!Number.isInteger(index) || index < 0 || index >= MASK_COUNT) {\n    throw new RangeError(`마스크 index 는 0..${MASK_COUNT - 1}: ${index}`);\n  }\n  return index;\n}\n\n/** 재측정 가능하도록 전 후보를 노출한다 (T4 선정 규칙 재실행용). */\nexport const CANDIDATES = Object.freeze({ affine, quadratic, hash });\n\n/**\n * 마스크 index → 공식. 3관문 재측정(`test/mask.test.js`)이 이 배열을 훑는다.\n * 원소 0 은 `CANDIDATES.hash` 와 **같은 값을 낸다**(seed 0 항등).\n */\nexport const MASK_CANDIDATES = Object.freeze(\n  MASK_SEEDS.map((seed) => Object.freeze((q, r) => hashSeeded(q, r, seed))),\n);\n\n/** 확정된 후보 이름 (family). */\nexport const CHOSEN = 'hash';\n\n/**\n * 마스크 공식. m(q, r) → {0..5}.\n * @param {number} q\n * @param {number} r\n * @param {number} [maskIndex] 0..MASK_COUNT−1. 생략하면 0 = 개정 전 고정 마스크.\n * @returns {number}\n */\nexport function maskValue(q, r, maskIndex = DEFAULT_MASK_INDEX) {\n  return hashSeeded(q, r, MASK_SEEDS[assertMaskIndex(maskIndex)]);\n}\n\n/**\n * 데이터 digit 에 마스크를 mod-6 가산한다 (인코더가 쓴다).\n * @param {number} digit 0..5\n * @param {number} q\n * @param {number} r\n * @param {number} [maskIndex]\n * @returns {number} 마스킹된 digit 0..5\n */\nexport function maskAdd(digit, q, r, maskIndex = DEFAULT_MASK_INDEX) {\n   ["formatinfo", "// formatinfo.js — 포맷 정보: CRC-6 + 12bit ↔ 5digit 변환 + 고정 마스크 + 3중 복제 다수결 (SPEC §5.4)\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 배경 — SPEC §13 TBD 2건을 이 모듈이 확정한다\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 포맷 정보 내용(§5.4): 버전 인덱스 4bit + ECC 레벨 2bit + CRC 6bit = 12bit.\n// 채널이 보는 것은 **digit** 이므로(불스아이 인접 링에 5심볼씩 3중 복제·다수결 판독),\n// CRC 다항식 선정은 bit 도메인이 아니라 **digit 도메인 전쌍 최소 해밍 거리**를\n// 1순위로 삼는다. 64개 유효 페이로드(6bit) 전수에 대해 5개 표준 후보를 전수 비교한\n// 결과는 이 파일 하단 주석 [측정표]에 있다 — 선정 근거가 회귀 테스트로 보호된다\n// (formatinfo.test.js 가 SELECTED_MIN_DIGIT_DISTANCE 를 고정 상수로 단언).\n//\n// **선정 결과: CRC-6/CDMA2000-B (poly 0x07)**.\n//   1순위(digit 최소 거리) 동률 2건 — CRC-6/ITU(0x03) 와 CRC-6/CDMA2000-B(0x07),\n//   둘 다 digit 최소 거리 2. 2순위(bit 최소 거리)로 갈라짐 — CDMA2000-B 는 4,\n//   ITU 는 3. CDMA2000-B 승.\n//\n// CRC 계산 규약: **비반사(non-reflected), MSB-first, init=0, xorout=0**, 6bit\n// 메시지 뒤에 6bit 0 을 붙여 나눈 것과 동일한 표준 bit-serial 나눗셈. 여기서\n// \"CRC-6/CDMA2000-B\" 라는 이름은 다항식 상수(0x07)의 출처 식별자일 뿐, refin/refout\n// 까지 포함한 외부 표준과의 bit-exact 호환을 주장하지 않는다 — 이 필드는 이 포맷\n// 안에서만 왕복하면 되는 폐쇄 채널이다.\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 **v2** (6 digit) — 2026-08-16 운영자 승인 개정, 마스크 선택 도입\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 마스크 선택(`src/mask.js`)이 고른 index 를 와이어에 실어야 한다. 자릿수 예산\n// (`claude-mimic-rate.md` §5.2):\n//\n//   6^5 = 7776 >= 2^12 = 4096 — 그러나 2^13 = 8192 > 7776 이라 **5 digit 에 13번째\n//   비트는 못 넣는다**. 남은 0.92 bit 는 쓸 수 없다.\n//   6^6 = 46656 >= 2^15 = 32768 — **6 digit 이면 15 bit** 까지 들어간다 (+3 bit).\n//\n// **옵션 A 채택** (운영자 지시): 6번째 digit 추가 → 포맷 셀 15 → **18** (3중 복제 × 6).\n//\n//   payload 9 bit = 버전 4 + ECC 2 + **마스크 2** + 예약 1\n//   codeword 15 bit = payload 9 + CRC 6\n//\n// 필드 순서(MSB-first): `version(4) | ecc(2) | mask(2) | reserved(1)`.\n//\n// **왜 A 인가 — 실패의 종류.** 버전 필드를 쪼개는 대안(B/C)은 코드워드 폭이 그대로라\n// 구 디코더가 CRC-6 을 통과시킨 뒤 버전만 틀리게 읽는다(조용한 오독). A 는 포맷 셀\n// 수 자체가 달라져 구 디코더가 **반드시 CRC 에서 떨어진다** — 깨끗한 거부다.\n// 대가는 데이터 셀 −3 = payload −1 B (§회계표).\n//\n// **v1(5 digit) 경로는 그대로 남는다** — 레거시 프레임 판독용. 두 경로는 상수·함수가\n// 완전히 분리돼 있고(`*_V2` 접미사), CRC 다항식·계산 규약·마스크 유도 규칙은 공유한다.\n\n// ── 페이로드 필드 폭 ─────────────────────────────────────────────────────────\n\n/** 버전 인덱스 필드 폭 (bit). */\nexport const VERSION_BITS = 4;\n\n/** ECC 레벨 필드 폭 (bit). */\nexport const ECC_BITS = 2;\n\n/** 페이로드(버전+ECC) 폭 (bit). 유효 워드 2^6 = 64개. */\nexport const PAYLOAD_BITS = VERSION_BITS + ECC_BITS; // 6\n\n/** CRC 폭 (bit). */\nexport const CRC_BITS = 6;\n\n/** 코드워드(페이로드+CRC) 폭 (bit). */\nexport const CODEWORD_BITS = PAYLOAD_BITS + CRC_BITS; // 12\n\n/** 5-digit(base-6) 로 표현 가능한 상태 수. 6^5 = 7776 >= 2^12 = 4096 이 성립해야 한다. */\nexport const DIGIT_COUNT = 5;\n\n/** digit 1개의 알파벳 크기 (base-6, SPEC §4.1 과 동일 채널). */\nexport const DIGIT_BASE = 6;\n\n// 모듈 로드 시 1회 자기검증: 6^5 >= 2^12.\n(() => {\n  const capacity = DIGIT_BASE ** DIGIT_COUNT;\n  const need = 2 ** CODEWORD_BITS;\n  if (capacity < need) {\n    throw new Error(`자기검증 실패: ${DIGIT_BASE}^${DIGIT_COUNT}=${capacity} < 2^${CODEWORD_BITS}=${need}`);\n  }\n})();\n\n/** ECC 레벨 열거값. 3(예약)은 인코더가 거부하고 디코더는 ok:false 로 처리한다 (SPEC §6). */\nexport const ECC_LEVEL = Object.freeze({ L: 0, M: 1, H: 2, RESERVED: 3 });\n\n// ── CRC-6 — 선정된 다항식 (측정표는 파일 하단) ──────────────────────────────\n\n/** 선정된 CRC-6 다항식 (CRC-6/CDMA2000-B, 6bit, 암묵적 최상위 항 제외). */\nexport const CRC_POLY = 0x07;\n\n/** 선정 근거로 고정하는 회귀 상수 — digit 도메인 전쌍 최소 해밍 거리 (64 코드워드). */\nexport const SELECTED_MIN_DIGIT_DISTANCE = 2;\n\n/** 선정 근거로 고정하는 회귀 상수 — bit 도메인 전쌍 최소 해밍 거리 (12bit, 64 코드워드). */\nexport const SELECTED_MIN_BIT_DISTANCE = 4;\n\n/**\n * 표준 비반사 bit-serial CRC. `dataBits` 하위 `dataLen` bit 뒤에 `n` bit 의 0 을\n * 붙여 나눈 것과 동치인 결과를 낸다(명시적 패딩 없이 레지스터 shift 만으로 계산).\n * @param {number} dataBits 메시지 (하위 dataLen bit 사용)\n * @param {number} dataLen 메시지 폭 (bit)\n * @param {number} poly 생성 다항식 (n bit, 암묵적 최상위 항 제외)\n * nfunction assertDigits5(digits) {\n  if (!digits || typeof digits.length !== 'number' || digits.length !== DIGIT_COUNT) {\n    throw new TypeError(`digits 는 길이 ${DIGIT_COUNT} 배열이어야 한다`);\n  }\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const d = digits[i];\n    if (!Number.isInteger(d) || d < 0 || d >= DIGIT_BASE) {\n      throw new RangeError(`digit 범위 위반 (위치 ${i}): ${d} (허용 0..${DIGIT_BASE - 1})`);\n    }\n  }\n}\n\n// ── 고정 출력 마스크 ─────────────────────────────────────────────────────────\n//\n// 유도 과정(매직넘버 금지 — SPEC 요구): 전부 0 페이로드(버전=0, ECC=0)의 CRC 도\n// 0 이므로 마스크가 없으면 코드워드=0, 5digit=[0,0,0,0,0] → 균일 패치로 렌더된다.\n// 마스크 상수는 **이미 선정된 CRC_POLY 하나에서만** 유도한다(새 독립 상수 도입 금지):\n// CRC_POLY(6bit, 0x07)를 12bit 폭으로 두 번 이어붙인 값 (POLY<<6 | POLY) 을\n// 코드워드와 같은 5digit 변환기에 통과시킨 것이 마스크다. POLY 를 그대로 상위\n// 6bit 에 반복해 쓰는 이유는, POLY 한 번만으로는 상위 6bit(=페이로드 폭)가 0으로\n// 남아 5digit 중 앞쪽 자리가 여전히 0에 치우치기 때문 — 반복으로 12bit 전역에\n// CRC_POLY 유래 비트를 퍼뜨린다.\n//\n// 이 마스크는 §4.3 데이터 마스크와 무관한 **별도 상수**다 — 포맷 셀은 데이터\n// 마스크 대상이 아니다(SPEC §5.4 주석).\n\nconst MASK_SEED_12BIT = (CRC_POLY << CRC_BITS) | CRC_POLY;\n\n/** 고정 출력 마스크 (5digit, mod-6 가산). CRC_POLY 유래 — 별도 매직넘버 아님. */\nexport const MASK_DIGITS = Object.freeze(toDigits5(MASK_SEED_12BIT));\n\n/**\n * 5digit 에 고정 마스크를 mod-6 가산한다(인코더 방향).\n * @param {number[]} digits 길이 5\n * @returns {number[]} 길이 5, 마스크 적용됨\n */\nexport function applyMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d + MASK_DIGITS[i]) % DIGIT_BASE);\n}\n\n/**\n * 마스크를 해제한다(디코더 방향). `applyMask` 의 역함수.\n * @param {number[]} digits 길이 5, 마스크 적용된 상태\n * @returns {number[]} 길이 5, 마스크 해제됨\n */\nexport function removeMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d - MASK_DIGITS[i] + DIGIT_BASE) % DIGIT_BASE);\n}\n\n// ── 인코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * {version, eccLevel} → 5digit(base-6, 마스크 적용됨). 이 값을 3곳(120° 간격)에\n * 동일하게 반복 배치하는 것이 §5.4 의 \"3중 복제\" — 배치(레이아웃)는 이 모듈의\n * 소관이 아니라 호출 지 않았다. 아래는 **추가**다.\n\n/** v2 마스크 index 필드 폭 (bit). `src/mask.js` MASK_INDEX_BITS 와 동일해야 한다. */\nexport const MASK_BITS_V2 = 2;\n\n/** v2 예약 필드 폭 (bit). 인코더는 0 만 쓰고 디코더는 0 이 아니면 거부한다. */\nexport const RESERVED_BITS_V2 = 1;\n\n/** v2 페이로드(버전+ECC+마스크+예약) 폭 (bit). 유효 워드 2^9 = 512개. */\nexport const PAYLOAD_BITS_V2 = VERSION_BITS + ECC_BITS + MASK_BITS_V2 + RESERVED_BITS_V2; // 9\n\n/** v2 코드워드(페이로드+CRC) 폭 (bit). */\nexport const CODEWORD_BITS_V2 = PAYLOAD_BITS_V2 + CRC_BITS; // 15\n\n/** v2 digit 수. 6^6 = 46656 >= 2^15 = 32768 이 성립해야 한다. */\nexport const DIGIT_COUNT_V2 = 6;\n\n/** v2 포맷 셀 수 = 3중 복제 × 6 digit. (v1 은 15.) */\nexport const FORMAT_CELLS_V2 = 3 * DIGIT_COUNT_V2; // 18\n\n/** 마스크 index 예약값 — 후보가 3종이라 2bit 중 3 은 미사용이다. */\nexport const MASK_INDEX_RESERVED = 3;\n\n// 모듈 로드 시 1회 자기검증: 6^6 >= 2^15, 그리고 v1 이 그대로인지.\n(() => {\n  const capacity = DIGIT_BASE ** DIGIT_COUNT_V2;\n  const need = 2 ** CODEWORD_BITS_V2;\n  if (capacity < need) {\n    throw new Error(`v2 자기검증 실패: ${DIGIT_BASE}^${DIGIT_COUNT_V2}=${capacity} < 2^${CODEWORD_BITS_V2}=${need}`);\n  }\n  if (DIGIT_COUNT !== 5 || CODEWORD_BITS !== 12) {\n    throw new Error('v1 포맷 상수가 바뀌었다 — 레거시 판독 계약 위반');\n  }\n})();\n\n/**\n * v2 페이로드의 CRC-6. **다항식·계산 규약은 v1 과 같다** (CRC_POLY 0x07, 비반사,\n * MSB-first, init=0, xorout=0) — 폭만 6bit → 9bit 메시지로 늘었다.\n * @param {number} payload9 0..511\n * @returns {number} 0..63\n */\nexport function crc6v2(payload9) {\n  if (!Number.isInteger(payload9) || payload9 < 0 || payload9 >= (1 << PAYLOAD_BITS_V2)) {\n    throw new RangeError(`v2 페이로드는 0..${(1 << PAYLOAD_BITS_V2) - 1}: ${payload9}`);\n  }\n  return crcCompute(payload9, PAYLOAD_BITS_V2, CRC_POLY, CRC_BITS);\n}\n\n// ── [v2 측정표] 같은 5 후보를 9bit 페이로드 / 15bit 코드워드 / 6digit 로 재측정 ──\n//\n// 방법은 v1 과 동일(파일 하단 [측정표] 주석). 512 코드워드 전수 · C(512,2)=130,816 쌍.\n//\n// | 이름              | poly | digit 최소거리 | bit 최소거리 |\n// |-------------------|------|----------------|--------------|\n// | CRC-6/ITU         | 0x03 | 1              | 3 gits[i];\n  return v;\n}\n\nfunction assertDigits6(digits) {\n  if (!digits || typeof digits.length !== 'number' || typeof digits === 'string'\n    || digits.length !== DIGIT_COUNT_V2) {\n    throw new TypeError(`digits 는 길이 ${DIGIT_COUNT_V2} 배열이어야 한다`);\n  }\n  for (let i = 0; i < DIGIT_COUNT_V2; i += 1) {\n    const d = digits[i];\n    if (!Number.isInteger(d) || d < 0 || d >= DIGIT_BASE) {\n      throw new RangeError(`digit 범위 위반 (위치 ${i}): ${d} (허용 0..${DIGIT_BASE - 1})`);\n    }\n  }\n}\n\n// v2 고정 출력 마스크 — v1 과 **같은 유도 규칙**(CRC_POLY 를 코드워드 폭만큼 반복)을\n// 폭 15bit 로 확장한다. 새 상수 없음: (POLY<<12) | (POLY<<6) | POLY.\nconst MASK_SEED_15BIT = (CRC_POLY << (CRC_BITS * 2)) | (CRC_POLY << CRC_BITS) | CRC_POLY;\n\n/** v2 고정 출력 마스크 (6digit, mod-6 가산). CRC_POLY 유래 — 별도 매직넘버 아님. */\nexport const MASK_DIGITS_V2 = Object.freeze(toDigits6(MASK_SEED_15BIT));\n\n/**\n * 6digit 에 v2 고정 마스크를 mod-6 가산한다(인코더 방향).\n * @param {number[]} digits 길이 6\n * @returns {number[]}\n */\nexport function applyMaskV2(digits) {\n  assertDigits6(digits);\n  return digits.map((d, i) => (d + MASK_DIGITS_V2[i]) % DIGIT_BASE);\n}\n\n/**\n * v2 마스크를 해제한다(디코더 방향). `applyMaskV2` 의 역함수.\n * @param {number[]} digits 길이 6\n * @returns {number[]}\n */\nexport function removeMaskV2(digits) {\n  assertDigits6(digits);\n  return digits.map((d, i) => (d - MASK_DIGITS_V2[i] + DIGIT_BASE) % DIGIT_BASE);\n}\n\n/**\n * v2 필드 → 9bit 페이로드. 필드 순서는 MSB-first `version|ecc|mask|reserved`.\n * @param {{version:number, eccLevel:number, maskIndex?:number, reserved?:number}} info\n * @returns {number} 0..511\n */\nexport function packPayloadV2({ version, eccLevel, maskIndex = 0, reserved = 0 }) {\n  if (!Number.isInteger(version) || version < 0 || version >= (1 << VERSION_BITS)) {\n    throw new RangeError(`버전은 0..${(1 << VERSION_BITS) - 1}: ${version}`);\n  }\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    throw new RangeError('ECC 레벨 3(예약값)은 인코더가 거부한다');\n  }\n  if (!Number.isInteger(eccLevel) || eccLevel < 0 || eccLevel >= (1 <<   const payload = codeword >> CRC_BITS;\n  const crcField = codeword & ((1 << CRC_BITS) - 1);\n  const reserved = payload & ((1 << RESERVED_BITS_V2) - 1);\n  const maskIndex = (payload >> RESERVED_BITS_V2) & ((1 << MASK_BITS_V2) - 1);\n  const eccLevel = (payload >> (RESERVED_BITS_V2 + MASK_BITS_V2)) & ((1 << ECC_BITS) - 1);\n  const version = payload >> (RESERVED_BITS_V2 + MASK_BITS_V2 + ECC_BITS);\n  // 값싼 의미론 reject 는 CRC 보다 먼저 — v1 decodeSingle 의 순서를 그대로 따른다.\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    return { version, eccLevel, maskIndex, reserved, ok: false };\n  }\n  if (maskIndex === MASK_INDEX_RESERVED) {\n    return { version, eccLevel, maskIndex, reserved, ok: false };\n  }\n  if (reserved !== 0) {\n    // 예약 bit 를 쓰는 미래 개정본 — **조용히 오독하지 않고 거부**한다.\n    return { version, eccLevel, maskIndex, reserved, ok: false };\n  }\n  if (crc6v2(payload) !== crcField) {\n    return { ...fail };\n  }\n  return { version, eccLevel, maskIndex, reserved, ok: true };\n}\n\n/**\n * v2 digit 위치별 다수결. 3개 읽기 중 2개 이상 일치하는 값을 채택한다.\n * (v1 `majorityVote` 와 같은 구조 — digit 수만 6 이다. 소거 인지 다수결은\n * 다른 레인 소관이라 여기서는 손대지 않는다.)\n * @param {number[][]} reads 길이 3, 각 원소 길이 6\n * @returns {{digits:number[], hasMajority:boolean}}\n */\nexport function majorityVoteV2(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  reads.forEach(assertDigits6);\n  const digits = new Array(DIGIT_COUNT_V2).fill(0);\n  let hasMajority = true;\n  for (let i = 0; i < DIGIT_COUNT_V2; i += 1) {\n    const counts = new Map();\n    for (const r of reads) counts.set(r[i], (counts.get(r[i]) ?? 0) + 1);\n    let bestVal = reads[0][i];\n    let bestCount = 0;\n    for (const [val, count] of counts) {\n      if (count > bestCount) {\n        bestCount = count;\n        bestVal = val;\n      }\n    }\n    if (bestCount < 2) hasMajority = false;\n    digits[i] = bestVal;\n  }\n  return { digits, hasMajority };\n}\n\n/**\n * v2 3중 복제 다수결 복호. 순서는 v1 `decode` 와 동일: ① digit 별 다수결 → CRC 검증,\n * 실패하면 ② 각 복제 개별 시도 첫 성공.\n * @param {number[][]} reads 길이 3, 각 원소 길이 6\n * @returns {{version:number, eccLevel:number, maskIndex:number, reserved:number, ok:boolean}}\n */\nexport function decodeV2(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  const { digits: majorityDigits } = majorityVoteV2(reads);\n  const majorityResult = decodeSingleV2(majorityDigits);\n  if (majorityResult.ok) return majorityResult;\n\n  for (const r of reads) {\n    const single = decodeSingleV2(r);\n    if (single.ok) return single;\n  }\n  return { version: 0, eccLevel: 0, maskIndex: 0, reserved: 0, ok: false };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// [측정표] CRC-6 후보 전수 비교 (64 페이로드, 12bit 코드워드, 5digit 변환 후)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 방법: 각 후보 다항식으로 payload=0..63 전부에 대해 codeword=(payload<<6)|crc6\n// 을 만들고 toDigits5 로 5digit 화. 64개 코드워드의 C(64,2)=2016 쌍 전수에 대해\n// digit 도메인 해밍 거리(0..5)와 bit 도메인 해밍 거리(0..12)의 최솟값을 구함.\n// 검출력은 각 유효 워드에서 단일 복제 내 1-digit(5자리×5값=25종/워드) 및\n// 2-digit(C(5,2)×5×5=250종/워드) 오염을 전수 열거해 CRC(+범위검사)가 잡아내는\n// 비율로 측정(범위 밖 4096..7775 로 튀는 조합은 자동 검출로 함께 집계).\n//\n// | 이름                | poly | digit 최소거리 | bit 최소거리 | 1-digit 검출율 | 2-digit 검출율 |\n// |---------------------|------|-----------------|--------------|------------------|------------------|\n// | CRC-6/ITU           | 0x03 | 2               | 3            | 100.00%          | 99.15%           |\n// | CRC-6/CDMA2000-A    | 0x27 | 1               | 3            | 99.00%           | 98.975%          |\n// | CRC-6/CDMA2000-B    | 0x07 | **2**           | **4**        | **100.00%**      | 99.1125%         |\n// | CRC-6/DARC          | 0x19 | 1               | 4            | 99.375%          | 99.2375%         |\n// | CRC-6/GSM           | 0x2F | 1               | 4            | 98.00%
