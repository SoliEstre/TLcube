GIT_BASE}^${DIGIT_COUNT}=${capacity} < 2^${CODEWORD_BITS}=${need}`);\n  }\n})();\n\n/** ECC 레벨 열거값. 3(예약)은 인코더가 거부하고 디코더는 ok:false 로 처리한다 (SPEC §6). */\nexport const ECC_LEVEL = Object.freeze({ L: 0, M: 1, H: 2, RESERVED: 3 });\n\n// ── CRC-6 — 선정된 다항식 (측정표는 파일 하단) ──────────────────────────────\n\n/** 선정된 CRC-6 다항식 (CRC-6/CDMA2000-B, 6bit, 암묵적 최상위 항 제외). */\nexport const CRC_POLY = 0x07;\n\n/** 선정 근거로 고정하는 회귀 상수 — digit 도메인 전쌍 최소 해밍 거리 (64 코드워드). */\nexport const SELECTED_MIN_DIGIT_DISTANCE = 2;\n\n/** 선정 근거로 고정하는 회귀 상수 — bit 도메인 전쌍 최소 해밍 거리 (12bit, 64 코드워드). */\nexport const SELECTED_MIN_BIT_DISTANCE = 4;\n\n/**\n * 표준 비반사 bit-serial CRC. `dataBits` 하위 `dataLen` bit 뒤에 `n` bit 의 0 을\n * 붙여 나눈 것과 동치인 결과를 낸다(명시적 패딩 없이 레지스터 shift 만으로 계산).\n * @param {number} dataBits 메시지 (하위 dataLen bit 사용)\n * @param {number} dataLen 메시지 폭 (bit)\n * @param {number} poly 생성 다항식 (n bit, 암묵적 최상위 항 제외)\n * @param {number} n CRC 폭 (bit)\n * @returns {number} CRC 값 (0..2^n − 1)\n */\nexport function crcCompute(dataBits, dataLen, poly, n) {\n  const mask = (1 << n) - 1;\n  let reg = 0;\n  for (let i = dataLen - 1; i >= 0; i -= 1) {\n    const inBit = (dataBits >> i) & 1;\n    const msb = (reg >> (n - 1)) & 1;\n    reg = ((reg << 1) | inBit) & mask;\n    if (msb) reg ^= poly;\n  }\n  for (let i = 0; i < n; i += 1) {\n    const msb = (reg >> (n - 1)) & 1;\n    reg = (reg << 1) & mask;\n    if (msb) reg ^= poly;\n  }\n  return reg;\n}\n\n/**\n * 선정된 다항식으로 6bit 페이로드의 CRC-6 을 계산한다.\n * @param {number} payload6 0..63\n * @returns {number} 0..63\n */\nexport function crc6(payload6) {\n  if (!Number.isInteger(payload6) || payload6 < 0 || payload6 >= (1 << PAYLOAD_BITS)) {\n    throw new RangeError(`페이로드는 0..${(1 << PAYLOAD_BITS) - 1}: ${payload6}`);\n  }\n  return crcCompute(payload6, PAYLOAD_BITS, CRC_POLY, CRC_BITS);\n}\n\n// ── 12bit ↔ 5digit (base-6, MSD-first) ──────────────────────────────────────\n\n/**\n * 0..4095 → 5-digit(base-6, MSD-first). §13 TBD \"12bit → 5심볼 변환 규약\" 확정.\n * @param {number} value 0..(6^5 − 1) 범위까지 허용(4096..7775 는 코드워드 도메인\n *   밖이지만 디코더가 마스크 해제 후 범위검사를 하려면 변환 자체는 열려 있어야 한다).\n * @returns {number[]} 길이 5, 각 원소 0..5\n */\nexport function toDigits5(value) {\n  const max = DIGIT_BASE ** DIGIT_COUNT;\n  if (!Number.isInteger(value) || value < 0 || value >= max) {\n    throw new RangeError(`값 범위 위반: ${value} (허용 0..${max - 1})`);\n  }\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let v = value;\n  for (let i = DIGIT_COUNT - 1; i >= 0; i -= 1) {\n    digits[i] = v % DIGIT_BASE;\n    v = Math.floor(v / DIGIT_BASE);\n  }\n  return digits;\n}\n\n/**\n * 5-digit(base-6, MSD-first) → 0..7775. `toDigits5` 의 역함수.\n * @param {number[]} digits 길이 5, 각 원소 0..5\n * @returns {number}\n */\nexport function fromDigits5(digits) {\n  assertDigits5(digits);\n  let v = 0;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) v = v * DIGIT_BASE + digits[i];\n  return v;\n}\n\nfunction assertDigits5(digits) {\n  if (!digits || typeof digits.length !== 'number' || digits.length !== DIGIT_COUNT) {\n    throw new TypeError(`digits 는 길이 ${DIGIT_COUNT} 배열이어야 한다`);\n  }\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const d = digits[i];\n    if (!Number.isInteger(d) || d < 0 || d >= DIGIT_BASE) {\n      throw new RangeError(`digit 범위 위반 (위치 ${i}): ${d} (허용 0..${DIGIT_BASE - 1})`);\n    }\n  }\n}\n\n// ── 고정 출력 마스크 ─────────────────────────────────────────────────────────\n//\n// 유도 과정(매직넘버 금지 — SPEC 요구): 전부 0 페이로드(버전=0, ECC=0)의 CRC 도\n// 0 이므로 마스크가 없으면 코드워드=0, 5digit=[0,0,0,0,0] → 균일 패치로 렌더된다.\n// 마스크 상수는 **이미 선정된 CRC_POLY 하나에서만** 유도한다(새 독립 상수 도입 금지):\n// CRC_POLY(6bit, 0x07)를 12bit 폭으로 두 번 이어붙인 값 (POLY<<6 | POLY) 을\n// 코드워드와 같은 5digit 변환기에 통과시킨 것이 마스크다. POLY 를 그대로 상위\n// 6bit 에 반복해 쓰는 이유는, POLY 한 번만으로는 상위 6bit(=페이로드 폭)가 0으로\n// 남아 5digit 중 앞쪽 자리가 여전히 0에 치우치기 때문 — 반복으로 12bit 전역에\n// CRC_POLY 유래 비트를 퍼뜨린다.\n//\n// 이 마스크는 §4.3 데이터 마스크와 무관한 **별도 상수**다 — 포맷 셀은 데이터\n// 마스크 대상이 아니다(SPEC §5.4 주석).\n\nconst MASK_SEED_12BIT = (CRC_POLY << CRC_BITS) | CRC_POLY;\n\n/** 고정 출력 마스크 (5digit, mod-6 가산). CRC_POLY 유래 — 별도 매직넘버 아님. */\nexport const MASK_DIGITS = Object.freeze(toDigits5(MASK_SEED_12BIT));\n\n/**\n * 5digit 에 고정 마스크를 mod-6 가산한다(인코더 방향).\n * @param {number[]} digits 길이 5\n * @returns {number[]} 길이 5, 마스크 적용됨\n */\nexport function applyMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d + MASK_DIGITS[i]) % DIGIT_BASE);\n}\n\n/**\n * 마스크를 해제한다(디코더 방향). `applyMask` 의 역함수.\n * @param {number[]} digits 길이 5, 마스크 적용된 상태\n * @returns {number[]} 길이 5, 마스크 해제됨\n */\nexport function removeMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d - MASK_DIGITS[i] + DIGIT_BASE) % DIGIT_BASE);\n}\n\n// ── 인코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * {version, eccLevel} → 5digit(base-6, 마스크 적용됨). 이 값을 3곳(120° 간격)에\n * 동일하게 반복 배치하는 것이 §5.4 의 \"3중 복제\" — 배치(레이아웃)는 이 모듈의\n * 소관이 아니라 호출측(hexgrid.js 사용부)의 몫이다.\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[]} 길이 5\n */\nexport function encode({ version, eccLevel }) {\n  if (!Number.isInteger(version) || version < 0 || version >= (1 << VERSION_BITS)) {\n    throw new RangeError(`버전은 0..${(1 << VERSION_BITS) - 1}: ${version}`);\n  }\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    throw new RangeError('ECC 레벨 3(예약값)은 인코더가 거부한다');\n  }\n  if (!Number.isInteger(eccLevel) || eccLevel < 0 || eccLevel >= (1 << ECC_BITS)) {\n    throw new RangeError(`ECC 레벨은 0..${(1 << ECC_BITS) - 1}: ${eccLevel}`);\n  }\n  const payload = (version << ECC_BITS) | eccLevel;\n  const crc = crc6(payload);\n  const codeword = (payload << CRC_BITS) | crc;\n  return applyMask(toDigits5(codeword));\n}\n\n/**\n * `encode` 결과를 3개의 동일한 복제로 반환한다(테스트/편의용 — 실제 위치는\n * 레이아웃 소관).\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[][]} 길이 3, 각 원소 길이 5\n */\nexport function encodeReplicated(info) {\n  const one = encode(info);\n  return [one.slice(), one.slice(), one.slice()];\n}\n\n// ── 디코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * 마스크 적용된 5digit 1개를 단독으로 복호한다(다수결 없이).\n * @param {number[]} maskedDigits 길이 5\n * @returns {{version:number, eccLevel:number, ok:boolean}}\n */\nexport function decodeSingle(maskedDigits) {\n  assertDigits5(maskedDigits);\n  const unmasked = removeMask(maskedDigits);\n  const codeword = fromDigits5(unmasked); // 0..7775 (5digit 전체 상태)\n  if (codeword >= (1 << CODEWORD_BITS)) {\n    // 4096..7775 는 12bit 코드워드 도메인 밖 — digit 조합 자체가 무효.\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  const payload = codeword >> CRC_BITS;\n  const crcField = codeword & ((1 << CRC_BITS) - 1);\n  const version = payload >> ECC_BITS;\n  const eccLevel = payload & ((1 << ECC_BITS) - 1);\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    return { version, eccLevel, ok: false };\n  }\n  const expectedCrc = crc6(payload);\n  if (expectedCrc !== crcField) {\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  return { version, eccLevel, ok: true };\n}\n\n/**\n * digit 위치별 다수결. 3개 읽기 중 2개 이상 일치하는 값을 채택한다.\n * @param {number[][]} reads 길이 3, 각 원소 길이 5\n * @returns {{digits:number[], hasMajority:boolean}} hasMajority 는 5자리 전부\n *   2표 이상 합의가 있었는지\n */\nexport function majorityVote(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  reads.forEach(assertDigits5);\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let hasMajority = true;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const counts = new Map();\n    for (const r of reads) counts.set(r[i], (counts.get(r[i]) ?? 0) + 1);\n    let bestVal = reads[0][i];\n    let bestCount = 0;\n    for (const [val, count] of counts) {\n      if (count > bestCount) {\n        bestCount = count;\n        bestVal = val;\n      }\n    }\n    if (bestCount < 2) hasMajority = false;\n    digits[i] = bestVal;\n  }\n  return { digits, hasMajority };\n}\n\n/**\n * 3중 복제 다수결 복호 (SPEC §5.4). 디코더 진입점.\n * 순서: ① digit 별 다수결 → CRC 검증. 실패하면 ② 각 복제를 개별 시도해 첫 성공을\n * 채택. 전부 실패하면 ok:false.\n * @param {number[][]} reads 길이 3, 각 원소 길이 5 (마스크 적용된 원판독값)\n * @returns {{version:number, eccLevel:number, ok:boolean}}\n */\nexport function decode(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  const { digits: majorityDigits } = majorityVote(reads);\n  const majorityResult = decodeSingle(majorityDigits);\n  if (majorityResult.ok) return majorityResult;\n\n  for (const r of reads) {\n    const single = decodeSingle(r);\n    if (single.ok) return single;\n  }\n  return { version: 0, eccLevel: 0, ok: false };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// [측정표] CRC-6 후보 전수 비교 (64 페이로드, 12bit 코드워드, 5digit 변환 후)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 방법: 각 후보 다항식으로 payload=0..63 전부에 대해 codeword=(payload<<6)|crc6\n// 을 만들고 toDigits5 로 5digit 화. 64개 코드워드의 C(64,2)=2016 쌍 전수에 대해\n// digit 도메인 해밍 거리(0..5)와 bit 도메인 해밍 거리(0..12)의 최솟값을 구함.\n// 검출력은 각 유효 워드에서 단일 복제 내 1-digit(5자리×5값=25종/워드) 및\n// 2-digit(C(5,2)×5×5=250종/워드) 오염을 전수 열거해 CRC(+범위검사)가 잡아내는\n// 비율로 측정(범위 밖 4096..7775 로 튀는 조합은 자동 검출로 함께 집계).\n//\n// | 이름                | poly | digit 최소거리 | bit 최소거리 | 1-digit 검출율 | 2-digit 검출율 |\n// |---------------------|------|-----------------|--------------|------------------|------------------|\n// | CRC-6/ITU           | 0x03 | 2               | 3            | 100.00%          | 99.15%           |\n// | CRC-6/CDMA2000-A    | 0x27 | 1               | 3            | 99.00%           | 98.975%          |\n// | CRC-6/CDMA2000-B    | 0x07 | **2**           | **4**        | **100.00%**      | 99.1125%         |\n// | CRC-6/DARC          | 0x19 | 1               | 4            | 99.375%          | 99.2375%         |\n// | CRC-6/GSM           | 0x2F | 1               | 4            | 98.00%           | 98.925%          |\n//\n// 선정 규칙 적용: 1순위 digit 최소거리 최대 → {ITU(2), CDMA2000-B(2)} 동률.\n// 2순위 bit 최소거리 최대 → CDMA2000-B(4) > ITU(3). **CDMA2000-B(0x07) 채택.**\n// (3순위 \"표준 채택 사례\" 타이브레이크는 2순위에서 이미 갈렸으므로 불필요.)\n"],
  ["header", "// header.js — 페이로드 헤더와 코드워드 프레이밍 (SPEC §4.5)\n//\n// 코드워드는 (버전, ECC) 별 **고정 크기**다:\n//\n//   ┌────────┬──────────────────────┬──────────┬───────────────┐\n//   │ 길이 1B │ UTF-8 페이로드        │ 0x00 패딩 │ RS 패리티      │\n//   └────────┴──────────────────────┴──────────┴───────────────┘\n//   └──────────── RS 적용 범위 ───────────────┘\n//\n// 이 모듈은 RS 적용 **전**의 바이트열(= 길이 + 페이로드 + 패딩)만 만들고 되읽는다.\n// 패리티는 rs.js 소관이고, digit 변환은 base6.js 소관이다.\n//\n// [H1] 길이 필드는 **1 바이트**, 페이로드 바이트 수 0..255.\n//      타입 필드는 두지 않는다 — 페이로드는 UTF-8 텍스트 고정이고 콘텐츠 타입 판별은\n//      소비자 몫이다 (QR byte mode 와 같은 스탠스).\n//\n// [H2] 패딩은 **0x00**. QR 식 0xEC/0x11 교대 패턴을 쓰지 않는 이유: 시각 균일화는\n//      마스크(SPEC §4.3)의 책임이고 여기서 중복할 이유가 없다.\n//\n// [H3] 길이 필드의 **유일한** 역할은 패딩 절단이다. digit 경계·청크 모호성과 무관하다.\n//\n// [H4] 페이로드 인코딩은 UTF-8 고정. 문자 수가 아니라 **바이트 수**가 용량을 정한다 —\n//      한글 1자 = 3 바이트다.\n\n/** 길이 필드 크기 (바이트). */\nexport const HEADER_BYTES = 1;\n\n/** 길이 필드가 표현 가능한 최대 페이로드 바이트 수. */\nexport const MAX_PAYLOAD_BYTES = 255;\n\n/** 패딩 바이트 값. */\nexport const PAD_BYTE = 0x00;\n\nconst encoder = new TextEncoder();\nconst decoder = new TextDecoder('utf-8', { fatal: true });\n\n/**\n * 데이터 영역 크기에서 실을 수 있는 최대 페이로드 바이트 수.\n * @param {number} dataBytes 코드워드에서 RS 패리티를 뺀 크기 (헤더 포함)\n * @returns {number}\n */\nexport function maxPayloadFor(dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  if (dataBytes < HEADER_BYTES) return 0;\n  return Math.min(dataBytes - HEADER_BYTES, MAX_PAYLOAD_BYTES);\n}\n\n/**\n * 문자열을 UTF-8 로 인코딩한 바이트 수. 용량 판정에 쓴다.\n * @param {string} text\n * @returns {number}\n */\nexport function payloadByteLength(text) {\n  if (typeof text !== 'string') throw new TypeError(`문자열이어야 한다: ${typeof text}`);\n  return encoder.encode(text).length;\n}\n\n/**\n * UTF-8 텍스트 → 고정 크기 데이터 영역 (헤더 + 페이로드 + 0x00 패딩).\n * 이 결과가 rs.js 의 메시지 입력이 된다.\n *\n * @param {string} text UTF-8 페이로드\n * @param {number} dataBytes 데이터 영역 고정 크기 (= 코드워드 − 패리티)\n * @returns {Uint8Array} 길이 정확히 dataBytes\n */\nexport function frame(text, dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  const payload = encoder.encode(text);\n\n  if (payload.length > MAX_PAYLOAD_BYTES) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 는 1 바이트 길이 필드로 표현 불가 (최대 ${MAX_PAYLOAD_BYTES} B)`);\n  }\n  const capacity = maxPayloadFor(dataBytes);\n  if (payload.length > capacity) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 가 데이터 영역 ${dataBytes} B 의 용량 ${capacity} B 를 초과한다`);\n  }\n\n  const out = new Uint8Array(dataBytes);   // 기본값이 0 이므로 패딩은 자동\n  out[0] = payload.length;\n  out.set(payload, HEADER_BYTES);\n  return out;\n}\n\n/**\n * 데이터 영역 → UTF-8 텍스트. RS 복호 **후**에 호출한다.\n *\n * 손상된 데이터가 여기까지 오면 길이 필드가 쓰레기일 수 있다. 그 경우 조용히 잘린\n * 문자열을 돌려주지 않고 던진다 — 조용한 오복호가 예외보다 훨씬 나쁘다.\n *\n * @param {Uint8Array} data 고정 크기 데이터 영역\n * @param {{lenient?: boolean}} [options] lenient=true 면 길이 초과를 클램프한다 (디버깅용)\n * @returns {{text: string, payloadLength: number, padding: number}}\n */\nexport function unframe(data, options = {}) {\n  if (!(data instanceof Uint8Array)) throw new TypeError('Uint8Array 여야 한다');\n  if (data.length < HEADER_BYTES) {\n    throw new RangeError(`데이터 영역이 헤더보다 작다: ${data.length} B`);\n  }\n\n  const declared = data[0];\n  const available = data.length - HEADER_BYTES;\n  let length = declared;\n\n  if (declared > available) {\n    if (!options.lenient) {\n      throw new RangeError(\n        `길이 필드 ${declared} B 가 가용 ${available} B 를 초과한다 — 데이터 손상 (RS 복호 실패를 의심하라)`);\n    }\n    length = available;\n  }\n\n  const bytes = data.subarray(HEADER_BYTES, HEADER_BYTES + length);\n  let text;\n  try {\n    text = decoder.decode(bytes);\n  } catch (cause) {\n    throw new RangeError('페이로드가 유효한 UTF-8 이 아니다 — 데이터 손상', { cause });\n  }\n  return { text, payloadLength: length, padding: available - length };\n}\n\nfunction assertSize(n, name) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`${name} 은 0 이상 정수여야 한다: ${n}`);\n  }\n}\n"],
  ["placement", "// placement.js — 앵커 3셀 + 포맷 정보 15셀 + 레퍼런스 셀 배치 맵 (SPEC §5.2, §5.3, §5.4, §13 T6)\n//\n// 이 모듈은 \"어디에 무엇을 놓는가\"만 다룬다. 포맷 정보 12bit → base-6 5심볼 변환(§5.4,\n// T7 하드 블로커)이나 scan order(§13, T8)는 여기서 확정하지 않는다 — 이 모듈이 내는\n// 셀 좌표 목록이 그 두 작업의 입력이 된다.\n//\n// 불스아이 풋프린트는 SPEC 이 이미 고정했다: hexDistance ≤ 2 (19셀). bullseye.js 는\n// 동시 작성 중이라 import 하지 않고 여기서 직접 hexDistance 로 판정한다(과제 지침).\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 앵커 3셀 (§5.2, \"확정할 것 1\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 외곽 6개 코너는 axial 좌표로 (k,0)·(0,k)·(-k,k)·(-k,0)·(0,-k)·(k,-k) 이다. 이 순서를\n// `CORNER_DIRECTIONS` 로 고정한다 — 인접 코너 사이는 60°, 한 칸씩 건너뛰면 120°다.\n//\n// **rhombille 분할은 120° 대칭만 갖는다** (hexgrid.js 헤더 주석: 면 오프셋이 전 셀\n// 동일하고 spine 이 {0,2,4} 꼭짓점에 고정되므로, 60°/180°/240°/300° 회전은 T/L/R 면\n// 배정 자체를 깨뜨린다 — 유효한 대칭군은 항등·120°·240° 뿐이다). 따라서 앵커는\n// **교대(alternating) 3개**를 골라야 \"임의의 유효 회전에서 앵커 3점이 여전히 앵커\n// 위치 집합\"이라는 성질이 성립한다. 후보는 두 세트뿐이다:\n//   세트 A = 코너 인덱스 {0,2,4} = { (k,0), (-k,k), (0,-k) }\n//   세트 B = 코너 인덱스 {1,3,5} = { (0,k), (-k,0), (k,-k) }\n// 어느 쪽이든 120°-불변 성질은 동일하게 성립한다(대칭적인 선택지라 구조적 우열이\n// 없다). **세트 A를 채택한다** — `CORNER_DIRECTIONS` 열거 순서의 첫 코너 (k,0) 를\n// 포함해 \"정준 목록의 짝수 인덱스\"로 서술하기 가장 단순하고, 이후 §5.4 포맷 정보의\n// ring-3 순회 시작점·§5.3 레퍼런스 셀의 충돌 회피 규칙과 같은 인덱스 산술\n// (`ringWalk` 참조)을 그대로 재사용할 수 있어 코드 전체의 회전 산술이 한 가지\n// 공식으로 통일된다.\n//\n// 방향 기준점(어느 코너가 digit 5 인가): 세트 A 의 첫 원소 (k,0) 를 5, 나머지 두\n// 코너를 0 으로 둔다. **왜 유일하게 결정되는가**: 세 앵커 위치의 집합 자체는\n// 120°/240° 회전에 불변이지만, \"이 물리적 좌표에 이 digit 이 찍혀 있다\"는 배정\n// 함수는 항등 회전에서만 자기 자신과 같다 — 120°/240° 만큼 회전한 패턴은 5가 찍힌\n// 위치가 다른 코너로 옮겨가므로 원본과 달라진다(아래 `test/placement.test.js` 가\n// 전수로 단언). 즉 디코더가 \"5 찍힌 앵커가 어디 있는가\"만 읽으면 세 회전 후보 중\n// 정확히 하나만 남는다.\n\nimport { hexDistance, AXIAL_DIRECTIONS } from './hexgrid.js';\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기본 상수\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 불스아이 풋프린트 반경 (SPEC §5.1: hexDistance ≤ 2, 19셀). */\nexport const BULLSEYE_RADIUS = 2;\n\n/**\n * 외곽 6 코너의 단위 방향 (k 를 곱하면 실제 코너 좌표). 60° 간격 정준 순서.\n * @type {ReadonlyArray<{q:number, r:number}>}\n */\nexport const CORNER_DIRECTIONS = Object.freeze([\n  Object.freeze({ q: 1, r: 0 }), //  0: (k, 0)\n  Object.freeze({ q: 0, r: 1 }), //  1: (0, k)\n  Object.freeze({ q: -1, r: 1 }), //  2: (-k, k)\n  Object.freeze({ q: -1, r: 0 }), //  3: (-k, 0)\n  Object.freeze({ q: 0, r: -1 }), //  4: (0, -k)\n  Object.freeze({ q: 1, r: -1 }), //  5: (k, -k)\n]);\n\n/** 앵커로 쓰는 코너 인덱스 — 세트 A(교대 인덱스, 위 주석 근거). */\nexport const ANCHOR_CORNER_INDICES = Object.freeze([0, 2, 4]);\n\n/** 앵커 중 digit 5 를 받는 코너 인덱스(= 방향 기준점). 나머지 앵커는 digit 0. */\nexport const ANCHOR_PRIMARY_INDEX = 0;\n\n/** 앵커 digit 값 (SPEC §5.2: (0,0,5)). */\nexport const ANCHOR_PRIMARY_DIGIT = 5;\nexport const ANCHOR_SECONDARY_DIGIT = 0;\n\n/** 포맷 정보가 사는 링 번호 (불스아이 인접 링, §5.4). */\nexport const FORMAT_RING = 3;\n\n/** 포맷 정보 반복 블록 길이(5셀) · 개수(3, 120° 간격) (§5.4). */\nexport const FORMAT_BLOCK_LENGTH = 5;\nexport const FORMAT_REPLICAS = 3;\n\n/** 레퍼런스 셀에 배정하는 알려진 digit — 앵커 값 {0,5} 와 달라야 한다(§5.3 \"확정할 것 3\"). */\nexport const REFERENCE_DIGIT = 3;\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    // FORMAT_RING(=3) 자체가 데이터 링이려면 앵커 링(k)보다 작아야 한다.\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 회전 (120°/240°, cube 좌표 기반 — rhombille 이 갖는 유일한 비자명 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial (q,r) 를 원점 기준 120° 회전. */\nexport function rotate120(q, r) {\n  return { q: -q - r, r: q };\n}\n\n/** axial (q,r) 를 원점 기준 240° 회전 (= rotate120 두 번). */\nexport function rotate240(q, r) {\n  return { q: r, r: -q - r };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 외곽 코너 · 앵커\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 반경 k 영역의 외곽 코너 6개, `CORNER_DIRECTIONS` 순서대로. */\nexport function corners(k) {\n  assertRadius(k);\n  return CORNER_DIRECTIONS.map((d) => ({ q: d.q * k, r: d.r * k }));\n}\n\n/**\n * 앵커 3셀과 digit 배정.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function anchorCells(k) {\n  const all = corners(k);\n  return ANCHOR_CORNER_INDICES.map((idx) => ({\n    ...all[idx],\n    digit: idx === ANCHOR_CORNER_INDICES[ANCHOR_PRIMARY_INDEX]\n      ? ANCHOR_PRIMARY_DIGIT\n      : ANCHOR_SECONDARY_DIGIT,\n  }));\n}\n\n/** 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function anchorPositionSet(k) {\n  return new Set(anchorCells(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 링 순회 (표준 hex-ring walk, 각도순 — format/reference 인덱스 산술의 기반)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 r 인 링(hexDistance == r)의 셀을, 코너 `CORNER_DIRECTIONS[2]·r` (= `(-r, r)`) 에서 시작해\n * `AXIAL_DIRECTIONS[0..5]` 순서로 각 변을 r 걸음씩 걸어 각도순으로 나열한다.\n * 길이 6r (r=0 이면 [{0,0}] 길이 1). 코너는 정확히 인덱스 0, r, 2r, 3r, 4r, 5r 에 온다\n * (증명: `test/placement.test.js` 가 이 성질과 §5.2 앵커 인덱스 일치를 검증한다).\n * @param {number} r\n * @returns {{q:number, r:number}[]}\n */\nexport function ringWalk(r) {\n  if (!Number.isInteger(r) || r < 0) {\n    throw new RangeError(`링 반경 r 은 0 이상의 정수여야 한다: ${r}`);\n  }\n  if (r === 0) return [{ q: 0, r: 0 }];\n  let cur = { q: AXIAL_DIRECTIONS[4].q * r, r: AXIAL_DIRECTIONS[4].r * r };\n  const cells = [];\n  for (let dir = 0; dir < 6; dir += 1) {\n    for (let step = 0; step < r; step += 1) {\n      cells.push({ q: cur.q, r: cur.r });\n      cur = { q: cur.q + AXIAL_DIRECTIONS[dir].q, r: cur.r + AXIAL_DIRECTIONS[dir].r };\n    }\n  }\n  return cells;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 정보 15셀 (§5.4, \"확정할 것 2\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 시작 위치·진행 방향: `ringWalk(FORMAT_RING)` 인덱스 0 = 코너 `CORNER_DIRECTIONS[2]·3`\n// = `(-3, 3)` 에서 시작해 `AXIAL_DIRECTIONS[0..5]` 순서로 진행한다.\n// (v1 주석은 CORNER_DIRECTIONS[4] 로 잘못 적었었다 — 검증 라운드 정정. 코드가 정본이고\n//  실측 ringWalk(3)[0] = (-3,3) 이다. 이 규약은 인코더/디코더 공통 와이어 계약이다.)\n// 링3 은 18셀(6·3). 5셀 블록 3개(=15셀)를 120° 간격(= 인덱스 +6, 18/3)으로 두면\n// 인덱스 [0-4], [6-10], [12-16] 이 포맷이고 [5, 11, 17] 세 칸이 남는다 — SPEC 이\n// 명시한 \"18셀 중 15개가 포맷, 3개만 남는다\"와 정확히 일치한다.\n\n/** 포맷 블록 하나의 시작 인덱스(링3 순회 기준), 120° 간격 3개. */\nexport function formatBlockStarts() {\n  const ringSize = 6 * FORMAT_RING;\n  const step = ringSize / FORMAT_REPLICAS;\n  return Array.from({ length: FORMAT_REPLICAS }, (_, i) => i * step);\n}\n\n/** 포맷 정보 15셀 (블록 3개 × 5셀, ring3 순회 순서 그대로 이어붙임). */\nexport function formatCells(k) {\n  assertRadius(k);\n  const ring = ringWalk(FORMAT_RING);\n  const cells = [];\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) {\n      cells.push(ring[(start + i) % ring.length]);\n    }\n  }\n  return cells;\n}\n\n/** 포맷 정보가 차지하지 않는 ring3 의 나머지 셀 (18 - 15 = 3개). */\nexport function formatRingLeftoverCells() {\n  const ring = ringWalk(FORMAT_RING);\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ring.length);\n  }\n  return ring.filter((_, idx) => !occupied.has(idx));\n}\n\nfunction formatOccupiedIndexSet() {\n  const ringSize = 6 * FORMAT_RING;\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ringSize);\n  }\n  return occupied;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레퍼런스 셀 (§5.3, \"확정할 것 3\") — 데이터 링(ring 3..k)당 정확히 2개\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 규칙(오직 (k, ring) 으로 결정): `ringWalk(r)` 순회에서 인덱스 0 부터, 그리고\n// 인덱스 `3r`(= 정확히 180° 대척점) 부터 각각 정방향으로 선형 탐색해 \"점유되지\n// 않은\" 첫 인덱스를 잡는다. 점유 판정은 다음 두 경우뿐이다(그 외 링은 아무 것도\n// 점유하지 않으므로 정확히 대척점 쌍이 나온다 — \"각도상 최대 분리\" 요건 충족):\n//   - r === FORMAT_RING(3): 포맷 15셀이 점유 → 위 §5.4 의 occupied 인덱스 집합\n//   - r === k(앵커 링): 앵커 3셀이 점유 → 세트 A 코너가 이 순회에서 정확히\n//     인덱스 {0, 2r, 4r} 에 온다(§5.2 주석 · `ringWalk` docstring 의 코너 인덱스\n//     성질 + ANCHOR_CORNER_INDICES = {0,2,4} 조합)\n// r===3 인 경우 탐색 결과는 항상 {5, 11} 로 수렴한다 — 링3 여유 3칸 {5,11,17} 중\n// 앞의 두 칸. 결정적이며 앵커·포맷과 무충돌임이 알고리즘적으로 보장된다.\n\nfunction ringOccupiedIndexSet(k, r) {\n  const occupied = new Set();\n  if (r === FORMAT_RING) {\n    for (const idx of formatOccupiedIndexSet()) occupied.add(idx);\n  }\n  if (r === k) {\n    const ringSize = 6 * r;\n    for (const idx of ANCHOR_CORNER_INDICES) {\n      // corners()[idx] 는 ringWalk(r) 에서 인덱스 (idx 를 코너-슬롯 순서로 재사상)에\n      // 온다. corners() 순서 [0..5] ↔ ringWalk 코너 인덱스 [2r,r,0,5r,4r,3r]\n      // (docstring 유도: dir4·r 시작 = corners()[2], 이후 dir0 r걸음 = corners()[1], ...).\n      const cornerToRingIndex = [2 * r, r, 0, 5 * r, 4 * r, 3 * r];\n      occupied.add(cornerToRingIndex[idx] % ringSize);\n    }\n  }\n  return occupied;\n}\n\n/**\n * 링 r(3..k)의 레퍼런스 2셀. `ringWalk(r)` 인덱스 기준 0 과 `3r` 에서 점유 인덱스를\n * 건너뛰며 선형 탐색해 결정적으로 고른다.\n * @param {number} k\n * @param {number} r FORMAT_RING(3) 이상 k 이하\n * @returns {{q:number, r:number}[]} 길이 2\n */\nexport function referenceCells(k, r) {\n  assertRadius(k);\n  if (!Number.isInteger(r) || r < FORMAT_RING || r > k) {\n    throw new RangeError(`레퍼런스 링 r 은 ${FORMAT_RING}..${k} 범위여야 한다: ${r}`);\n  }\n  const ring = ringWalk(r);\n  const ringSize = ring.length;\n  const occupied = ringOccupiedIndexSet(k, r);\n\n  const taken = new Set();\n  function pickFrom(startIdx) {\n    for (let step = 0; step < ringSize; step += 1) {\n      const idx = (startIdx + step) % ringSize;\n      if (!occupied.has(idx) && !taken.has(idx)) {\n        taken.add(idx);\n        return idx;\n      }\n    }\n    throw new RangeError(`k=${k} r=${r}: 레퍼런스 셀을 배치할 빈 칸이 없다`);\n  }\n\n  const i1 = pickFrom(0);\n  const i2 = pickFrom(Math.floor(ringSize / 2));\n  return [i1, i2].map((idx) => ({ ...ring[idx], digit: REFERENCE_DIGIT }));\n}\n\n/** 데이터 링 전부(3..k)의 레퍼런스 셀을 이어붙인 목록. */\nexport function referenceCellsAll(k) {\n  assertRadius(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) out.push(...referenceCells(k, r));\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 (§5.4 \"확정할 것 4\")\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체의 역할 분류표를 한 번에 만든다 (roleOf 를 셀마다 다시 계산하지\n * 않도록 Set 을 미리 구성 — 전수 테스트에서 O(k²) 반복이 O(k) 조회가 되게 한다).\n * @param {number} k\n * @returns {{bullseye: Set<string>, anchor: Set<string>, format: Set<string>, reference: Set<string>}}\n */\nexport function buildRoleSets(k) {\n  assertRadius(k);\n  const anchor = anchorPositionSet(k);\n  const format = new Set(formatCells(k).map((c) => key(c.q, c.r)));\n  const reference = new Set(referenceCellsAll(k).map((c) => key(c.q, c.r)));\n  return { anchor, format, reference };\n}\n\n/**\n * 셀 (q,r) 의 역할.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n *   `buildRoleSets(k)` 결과를 미리 넘기면 전수 테스트에서 재계산을 피한다.\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOf(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSets(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 오버헤드 집계 (§5.5 \"확정할 것 5\" — capacity.js 는 절대 건드리지 않는다)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 버전 k 의 비데이터 셀 실계산 합. capacity.js 의 `overhead` 잠정치(45/50/55)와\n * **대조만** 한다 — 이 함수는 capacity.js 를 읽지도 쓰지도 않는다.\n * @param {number} k\n */\nexport function overheadBreakdown(k) {\n  assertRadius(k);\n  const bullseye = 3 * BULLSEYE_RADIUS * BULLSEYE_RADIUS + 3 * BULLSEYE_RADIUS + 1; // cellCount(2)\n  const anchor = ANCHOR_CORNER_INDICES.length;\n  const format = FORMAT_BLOCK_LENGTH * FORMAT_REPLICAS;\n  const reference = 2 * (k - FORMAT_RING + 1); // 링 FORMAT_RING..k, 링당 2개\n  return {\n    k,\n    bullseye,\n    anchor,\n    format,\n    reference,\n    total: bullseye + anchor + format + reference,\n  };\n}\n"],
  ["bullseye", "/**\n * bullseye.js — 중앙 불스아이 파인더 형상·링 수 확정 (SPEC §5.1, T5)\n *\n * MaxiCode 식 동심원 불스아이: 명암 교대 링 3쌍(= 6밴드), 점유 영역은 중심\n * 반경 2링(hexDistance ≤ 2, 19셀). 이 모듈은 그 최대 안전 반지름과 밴드\n * 구조를 hexgrid 기하에서 **계산**으로 유도한다 — 임의 상수를 두지 않는다.\n *\n * R_max 는 두 제약의 min 이다:\n *   1. 19셀 풋프린트(hexDistance ≤ 2) 경계까지의 최소 거리 — 불스아이가\n *      점유 셀 밖으로 새면 인접(비점유) 셀의 렌더링을 침범한다.\n *   2. ring-3 셀(hexDistance = 3)의 샘플 원판(faceSampleDisc, §7.2 기본값)\n *      까지의 최소 여유 — 포맷 정보가 ring 3 에 살므로(§5.4) 그 판독용\n *      샘플 영역을 불스아이가 침범하면 안 된다.\n *\n * 이 모듈은 순수 기하만 다룬다. Node 전용 API 를 쓰지 않는다.\n */\n\nimport {\n  regionCells,\n  hexDistance,\n  hexCorners,\n  faceSampleDisc,\n  FACES,\n  normalizeLayout,\n} from './hexgrid.js';\n\n/** 명암 교대 링 3쌍 = 6밴드 (SPEC §5.1). */\nexport const RING_PAIRS = 3;\nexport const BAND_COUNT = RING_PAIRS * 2;\n\n/** 불스아이 점유 반경(hexDistance 상한). 반경 2링 = 19셀. */\nexport const OCCUPIED_RADIUS = 2;\n\n// 정규화된 기본 셀 크기(1)의 기하 계산은 순수·불변이므로 재사용한다.\n// 공개 API는 새 배열을 계속 반환하며, profileAt 내부만 이 읽기 전용 캐시를 쓴다.\nlet canonicalMaxSafeRadius;\nlet canonicalProfileBandRadii;\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기하 헬퍼 (모듈 내부 전용)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 점 p 에서 선분 ab 까지의 최단 거리. */\nfunction distPointToSegment(p, a, b) {\n  const abx = b.x - a.x;\n  const aby = b.y - a.y;\n  const apx = p.x - a.x;\n  const apy = p.y - a.y;\n  const abLenSq = abx * abx + aby * aby;\n  let t = abLenSq === 0 ? 0 : (apx * abx + apy * aby) / abLenSq;\n  t = Math.max(0, Math.min(1, t));\n  const cx = a.x + t * abx;\n  const cy = a.y + t * aby;\n  // Math.hypot 금지 — ES 규격상 implementation-approximated 라 엔진별 1 ulp 이 갈릴 수\n  // 있고, 이 값이 밴드 반지름을 거쳐 렌더 바이트 결정성에 물린다. sqrt 는 IEEE 754\n  // 정확 반올림이라 결정적이다 (T9 검증 라운드 발견).\n  const dx = p.x - cx;\n  const dy = p.y - cy;\n  return Math.sqrt(dx * dx + dy * dy);\n}\n\n/** 원점에서 원점 기준 정수 axial 셀 (q,r) 까지 — region(k) 소속 판정용. */\nfunction inFootprint(q, r) {\n  return hexDistance(q, r) <= OCCUPIED_RADIUS;\n}\n\n/**\n * 19셀 풋프린트(hexDistance ≤ 2)의 경계까지 원점에서의 최소 거리.\n *\n * 풋프린트 안의 각 셀에 대해 6개 변을 순회하고, 그 변이 (풋프린트 밖의\n * 이웃과 접하는) **경계 변**이면 원점-선분 최단거리를 구해 전체 최소를 취한다.\n * \"경계 변\"인지는 변의 중점을 살짝 바깥으로 밀어 axial 로 반올림해서\n * 그 셀이 풋프린트 밖인지로 판정한다 — 이웃 방향 인덱스 매핑에 기대지\n * 않는 견고한 방식이다.\n */\nfunction footprintBoundaryClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const cells = regionCells(OCCUPIED_RADIUS);\n  let minDist = Infinity;\n\n  for (const { q, r } of cells) {\n    const corners = hexCorners(q, r, layout);\n    const cx = cellSize * Math.sqrt(3) * (q + r / 2);\n    const cy = cellSize * 1.5 * r;\n\n    for (let i = 0; i < 6; i++) {\n      const a = corners[i];\n      const b = corners[(i + 1) % 6];\n      const mx = (a.x + b.x) / 2;\n      const my = (a.y + b.y) / 2;\n      // 셀 중심 → 변 중점 방향으로 살짝(변 길이의 5%) 더 밀어 바깥 셀로 넘긴다.\n      const ox = mx + (mx - cx) * 0.05;\n      const oy = my + (my - cy) * 0.05;\n      const outsideQ = ox / (cellSize * Math.sqrt(3)) - (oy / (cellSize * 1.5)) / 2;\n      const outsideR = oy / (cellSize * 1.5);\n      // axial 반올림 (cube 방식) — hexgrid.axialRound 와 동치이나 이 모듈은\n      // 판정에만 쓰므로 로컬로 계산한다 (수치 안정성 목적 외 의미 없음).\n      const rounded = axialRoundLocal(outsideQ, outsideR);\n      if (!inFootprint(rounded.q, rounded.r)) {\n        const d = distPointToSegment({ x: 0, y: 0 }, a, b);\n        if (d < minDist) minDist = d;\n      }\n    }\n  }\n\n  return minDist;\n}\n\nfunction axialRoundLocal(qf, rf) {\n  const xf = qf;\n  const zf = rf;\n  const yf = -xf - zf;\n  let rx = Math.round(xf);\n  let ry = Math.round(yf);\n  let rz = Math.round(zf);\n  const dx = Math.abs(rx - xf);\n  const dy = Math.abs(ry - yf);\n  const dz = Math.abs(rz - zf);\n  if (dx > dy && dx > dz) rx = -ry - rz;\n  else if (dy > dz) ry = -rx - rz;\n  else rz = -rx - ry;\n  return { q: rx, r: rz };\n}\n\n/**\n * ring-3 셀(hexDistance = 3) 전 셀 × 전 면의 샘플 원판까지, 원점에서의\n * 최소 여유(clearance) = min(원점-원판중심 거리 − 원판 반지름).\n */\nfunction ring3DiscClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const ring3 = regionCells(3).filter(({ q, r }) => hexDistance(q, r) === 3);\n  let minClearance = Infinity;\n\n  for (const { q, r } of ring3) {\n    for (const face of FACES) {\n      const disc = faceSampleDisc(q, r, face, layout);\n      // hypot 대신 sqrt — 위 distPointToSegment 와 같은 결정성 사유.\n      const centerDist = Math.sqrt(disc.x * disc.x + disc.y * disc.y);\n      const clearance = centerDist - disc.radius;\n      if (clearance < minClearance) minClearance = clearance;\n    }\n  }\n\n  return minClearance;\n}\n\n/**\n * 최대 안전 반지름 R_max (cellSize 단위) = min(풋프린트 경계 여유, ring-3\n * 원판 비침범 여유).\n * @param {number} [cellSize=1]\n */\nexport function maxSafeRadius(cellSize) {\n  const size = cellSize === undefined ? 1 : normalizeLayout({ size: cellSize }).size;\n  if (size === 1) {\n    if (canonicalMaxSafeRadius === undefined) {\n      canonicalMaxSafeRadius = Math.min(footprintBoundaryClearance(size), ring3DiscClearance(size));\n    }\n    return canonicalMaxSafeRadius;\n  }\n  return Math.min(footprintBoundaryClearance(size), ring3DiscClearance(size));\n}\n\n// 내부 노출 (numbers_check·테스트 진단용) — 공개 API 계약은 아니다.\nexport const _internals = { footprintBoundaryClearance, ring3DiscClearance };\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 밴드 구조\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 6밴드 경계 반지름(안→밖), 마지막 원소가 R_max.\n *\n * **균등 폭으로 확정** — 선정 규칙: 고정된 R_max 와 밴드 수 N 에 대해, 폭의\n * 합이 R_max 로 고정된 분할 중 \"가장 얇은 밴드의 폭\"(검출 강건성의 병목 —\n * 블러·저해상도에서 가장 먼저 뭉개지는 곳)을 최대화하는 분할은 **균등\n * 분할**이다 (단순 산술: 합이 고정된 N 분할에서 최소 밴드는 평균 이하이고, 등호는 균등 분배에서만 성립하므로 최소값은 균등 분배에서 최댓값을\n * 갖는다). \"중심 원판을 크게\" 대안은 중심 밴드를 넓히는 대신 나머지 5밴드가\n * 더 얇아져 최소 밴드 폭이 반드시 감소한다 — 아래 numbers_check 에서 수치로\n * 대조.\n */\nexport function bandRadii(cellSize) {\n  const R = maxSafeRadius(cellSize);\n  const width = R / BAND_COUNT;\n  const radii = [];\n  // 마지막 원소는 (R/N)·N 재계산이 아니라 R 그 자체 — 정의상 최외곽 경계 = R_max 이고,\n  // FP 재계산은 1 ulp 를 얹어 \"마지막 원소가 R_max\" 계약을 깬다 (T9 검증 라운드 여파).\n  for (let i = 1; i < BAND_COUNT; i++) radii.push(width * i);\n  radii.push(R);\n  return radii;\n}\n\nfunction profileBandRadii(cellSize) {\n  if (cellSize === undefined || cellSize === 1) {\n    if (canonicalProfileBandRadii === undefined) {\n      canonicalProfileBandRadii = bandRadii(1);\n    }\n    return canonicalProfileBandRadii;\n  }\n  return bandRadii(cellSize);\n}\n\n/**\n * distFromCenter 위치의 불스아이 프로파일. 반환값은 상대 순위가 아니라\n * 그 자체로 최대 대비 휘도다(0.0 = 암, 1.0 = 명) — 불스아이는 파인더이지\n * 데이터가 아니므로 §4.4 Δmin 계약과 무관하다.\n *\n * 밴드 0(중심)이 암(0)에서 시작해 교대하고, 밴드 5(최외곽)가 명(1)으로\n * 끝난다. 경계는 반개구간 [하한, 상한) 이고 마지막 밴드만 상한 포함(R_max\n * 그 자체는 불스아이 영역이므로).\n *\n * @param {number} distFromCenter\n * @param {number} [cellSize=1]\n * @returns {0 | 1}\n */\nexport function profileAt(distFromCenter, cellSize) {\n  if (!Number.isFinite(distFromCenter) || distFromCenter < 0) {\n    throw new RangeError(`distFromCenter 는 0 이상의 유한수여야 한다: ${distFromCenter}`);\n  }\n  const radii = profileBandRadii(cellSize);\n  const rMax = radii[radii.length - 1];\n  if (distFromCenter > rMax) {\n    throw new RangeError(\n      `distFromCenter(${distFromCenter}) 가 R_max(${rMax}) 를 벗어난다 — 불스아이 밖`,\n    );\n  }\n  for (let i = 0; i < radii.length; i++) {\n    const isLast = i === radii.length - 1;\n    if (isLast ? distFromCenter <= radii[i] : distFromCenter < radii[i]) {\n      return i % 2 === 0 ? 0 : 1;\n    }\n  }\n  // 도달 불가 (위 루프가 isLast 케이스에서 항상 반환) — 방어적 폴백.\n  /* c8 ignore next */\n  return 1;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 하이브리드 (불스아이 링 + 중앙 3톤 큐브)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 하이브리드에서 3톤 큐브가 **대체하는 안쪽 밴드 수**. 이 상수 하나가 하이브리드\n * 기하 전체를 결정한다 — 큐브 반지름도, 남는 링 밴드도, 검출기가 투표·검증에 쓰는\n * 경계 번호도 전부 여기서 유도된다.\n *\n * 왜 하이브리드인가: 두 파인더가 서로 없는 걸 갖고 있다. 동심원은 롬빌 데이터 필드에\n * 존재하지 않는 시그니처라 **위치·스케일**을 잡는 데 강하고(실사진 6/6), 큐브는 회전\n * 대칭이 없어 **방향**을 준다(단독 검출은 실사진 0/6 — 실루엣을 못 찾는다).\n *\n * 왜 하필 2인가: 밴드 폭이 균등(R_max/6)이라 안쪽 2밴드를 걷어내면 큐브 반지름이\n * R_max/3 ≈ 1.202c 가 되고, 남는 4밴드는 **원래 자리 그대로**다. 즉 canonical 밴드\n * 격자(`bandRadii`)를 하나도 안 바꾸고 «어느 밴드가 살아 있나» 만 달라진다 — 검출기의\n * 정규 기하를 재사용할 수 있는 유일한 분할점이다.\n */\nexport const HYBRID_INNER_CUBE_BANDS = 2;\n\n/** 하이브리드에서 살아 있는 링 밴드 수 (바깥쪽). */\nexport const HYBRID_RING_BAND_COUNT = BAND_COUNT - HYBRID_INNER_CUBE_BANDS;\n\n/** 하이브리드 중앙 큐브의 외접 반지름 = 안쪽 `HYBRID_INNER_CUBE_BANDS` 밴드의 폭 합. */\nexport function hybridCubeRadius(cellSize) {\n  return (maxSafeRadius(cellSize) * HYBRID_INNER_CUBE_BANDS) / BAND_COUNT;\n}\n\n/**\n * 하이브리드가 실제로 그리는 링 경계 반지름(안→밖). 첫 원소가 큐브와 맞닿는\n * 경계(= `hybridCubeRadius`), 마지막이 R_max.\n */\nexport function hybridBandRadii(cellSize) {\n  return bandRadii(cellSize).slice(HYBRID_INNER_CUBE_BANDS - 1);\n}\n\n/**\n * 불스아이가 점유하는 19셀 (hexDistance ≤ 2), 결정적 순서(regionCells 순서\n * 그대로).\n * @returns {{q: number, r: number}[]}\n */\nexport function occupiedCells() {\n  return regionCells(OCCUPIED_RADIUS);\n}\n\n/**\n * 검출기용 기대 방사 시그니처 — 중심(0)에서 R_max 까지 `samples`개 지점을\n * 균등 샘플링한 profileAt 값 배열.\n *\n * @param {number} [cellSize=1]\n * @param {number} [samples=64]\n * @returns {number[]}\n */\nexport function radialSignature(cellSize, samples) {\n  const n = samples === undefined ? 64 : samples;\n  if (!Number.isInteger(n) || n < 2) {\n    throw new RangeError(`samples 는 2 이상의 정수여야 한다: ${n}`);\n  }\n  const rMax = maxSafeRadius(cellSize);\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    // 마지막 표본은 (rMax·i)/(n−1) 재계산이 아니라 rMax 그 자체 — FP 재계산이 1 ulp\n    // 위로 반올림되면 profileAt 의 범위 검사(> rMax)에 걸린다 (bandRadii 와 같은 부류).\n    const d = i === n - 1 ? rMax : (rMax * i) / (n - 1);\n    out.push(profileAt(d, cellSize));\n  }\n  return out;\n}\n"],
  ["layout", "// layout.js — 캐노니컬 scan order + 레이아웃 통합 파사드 (SPEC §4.2, §5.6, §13 T8)\n//\n// 인코더(T9)와 디코더(M1)가 공유하는 단일 진입점. \"어디에 무엇을 놓는가\"의 개별\n// 조각(앵커·포맷·레퍼런스·불스아이)은 placement.js/bullseye.js 가 이미 확정했다 —\n// 이 모듈은 그 위에 **데이터 셀의 순회 순서**(scan order)만 얹고, 소비자가\n// placement/bullseye 를 따로 import 하지 않도록 재-export 파사드를 겸한다.\n//\n// scan order 확정 설계 (통합자 확정, 이 파일이 유일한 구현):\n//   - ring-major 안→밖 (r = FORMAT_RING(3) .. k), 각 링은 `ringWalk(r)` 인덱스\n//     오름차순, **roleOf == 'data' 인 셀만** (앵커·포맷·레퍼런스·불스아이 스킵).\n//   - 근거: 새 규약 0개(ringWalk 재사용) · 결정성 자명 · 연속 3셀 = 1 심볼이\n//     공간적으로도 인접(버스트 → 심볼 집중 → 3t−2 보장과 정합) · 필러(마지막\n//     C mod 3 셀)가 최외곽 링 끝 = 가장자리.\n//   - 심볼 그룹: scan order 의 연속 3셀 (d₀,d₁,d₂) = 심볼 1개, §4.2 MSD-first 규약.\n//\n// 런타임 의존성 0 · ESM.\n\nimport { hexDistance } from './hexgrid.js';\nimport {\n  FORMAT_RING,\n  buildRoleSets,\n  roleOf,\n  ringWalk,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n  overheadBreakdown,\n} from './placement.js';\nimport { occupiedCells } from './bullseye.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 데이터 셀을 캐노니컬 scan order 로. ring-major 안→밖(r = 3..k), 각 링은\n * `ringWalk(r)` 인덱스 오름차순, role == 'data' 인 셀만.\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (예: k=6 → 82)\n */\nexport function dataCellsInScanOrder(k) {\n  assertRadius(k);\n  const roleSets = buildRoleSets(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) {\n    for (const cell of ringWalk(r)) {\n      if (roleOf(cell.q, cell.r, k, roleSets) === 'data') out.push(cell);\n    }\n  }\n  return out;\n}\n\n/**\n * scan order 의 연속 3셀씩 묶은 심볼 그룹. 그룹 내부 순서 = (d₀,d₁,d₂),\n * §4.2 MSD-first 규약 그대로. 마지막 C mod 3 개는 그룹에 들지 않고\n * `fillerCells` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]} 길이 = ⌊데이터 셀 수 / 3⌋\n */\nexport function symbolCellGroups(k) {\n  const scan = dataCellsInScanOrder(k);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order 의 마지막 (C mod 3) 개 (§5.6). 최외곽 링(k) 끝에 온다.\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCells(k) {\n  const scan = dataCellsInScanOrder(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → `placement.anchorCells(k)` 순서\n *   - format    → `placement.formatCells(k)` 순서\n *   - reference → `placement.referenceCellsAll(k)` 순서\n *   - data      → `dataCellsInScanOrder(k)` 순서 (= scan order 인덱스,\n *                 심볼 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는\n *                 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMap(k) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n  anchorCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n  referenceCellsAll(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n  dataCellsInScanOrder(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placement/bullseye 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOf,\n  overheadBreakdown,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\nexport { hexDistance };\n"],
  ["capacity", "// capacity.js — 버전별 용량 산출 (SPEC §5.5, GF(211) 심볼 회계 — ADR 0001)\n//\n// **SPEC §5.5 의 표는 이 모듈의 생성물이다. 수기로 유지하지 않는다.**\n//\n// ADR 0001 §3.3.2/§3.3.3 결정: **nsym 은 공식이 아니라 표**. `rs211.js` 가 export 하는\n// `NSYM_TABLE` (2026-07-29 사용자 확정)을 그대로 입력으로 쓴다. `fitCodeword` 식 탐색과\n// `forceEven` 류 플래그는 여기 두지 않는다 — 그 조합이 ADR 본문에서 비대칭 비교 사고를\n// 두 번 냈다(§3.3.3).\n//\n// 회계는 심볼 도메인이다:\n//   데이터 심볼(셀) C = 총 셀 − 오버헤드\n//   사용 심볼        S = ⌊C / 3⌋   (잔여 셀 = C − 3S, 3의 배수가 안 되는 나머지 셀)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (BigInt 정확 계산)\n//   순 페이로드       = K − 1  (헤더 1 B, header.js 의 maxPayloadFor 와 정합)\n//\n// [T8 완료] `overhead` 는 더 이상 잠정 상수가 아니다 — 불스아이(§5.1)·앵커(§5.2)·\n//      포맷 정보(§5.4)·레퍼런스 셀(§5.3) 배치가 전부 확정됐으므로 `placement.js` 의\n//      `overheadBreakdown(k)` 실계산 합을 그대로 쓴다(구성요소별 유도, 아래 참조).\n\nimport { cellCount } from './hexgrid.js';\nimport { NSYM_TABLE, errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\nimport { overheadBreakdown } from './placement.js';\n\n/**\n * 버전 정의. `overhead` 는 `placement.overheadBreakdown(k).total` 로 **유도**한다\n * (T8 이전엔 잠정 상수였다 — [P1] 이력 참조, 이제 내려감). `symbolKey` 는 `rs211.js` 의\n * `NSYM_TABLE` 조회 키.\n * @type {ReadonlyArray<{version: number, k: number, overhead: number, symbolKey: string}>}\n */\nexport const VERSIONS = Object.freeze([\n  Object.freeze({\n    version: 1, k: 6, overhead: overheadBreakdown(6).total, symbolKey: 'V1',\n  }),\n  Object.freeze({\n    version: 2, k: 8, overhead: overheadBreakdown(8).total, symbolKey: 'V2',\n  }),\n  Object.freeze({\n    version: 3, k: 10, overhead: overheadBreakdown(10).total, symbolKey: 'V3',\n  }),\n]);\n\n/**\n * S 개의 GF(211) 심볼이 손실 없이 담는 **최대** 바이트 수 K.\n * 정의: K = max{ k : 211^S >= 2^(8k) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n *\n * 주의: 이것은 base211.js 의 청크 회계(27 B ↔ 28 심볼 단위)가 아니라 **RS 데이터 심볼\n * 전체를 하나의 큰 자릿수로 본 직접 부등식**이다 — ADR §3.3.2/§3.3.3 이 정의한 K 가 이 값이다.\n *\n * @param {number} symbolCount S (0 이상 정수)\n * @returns {number} K (0 이상 정수)\n */\nexport function maxBytesForSymbols(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const cap = 211n ** BigInt(symbolCount);\n  let k = 0;\n  while ((1n << BigInt(8 * (k + 1))) <= cap) k += 1;\n  return k;\n}\n\n/**\n * 한 버전의 용량 전체.\n * @param {{version: number, k: number, overhead: number, symbolKey: string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityFor(spec, level = 'M') {\n  const totalCells = cellCount(spec.k);\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`V${spec.version}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE[spec.symbolKey];\n  if (!table) {\n    throw new RangeError(`V${spec.version}: rs211.js NSYM_TABLE 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 오버헤드·k 가 표와 따로 놀고 있다는\n    // 신호다. 조용히 맞추지 않고 여기서 던진다(과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `V${spec.version}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`V${spec.version}: NSYM_TABLE.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`V${spec.version}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n\n  return {\n    version: spec.version,\n    k: spec.k,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/**\n * 전 버전 용량표.\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityTable(level = 'M') {\n  return VERSIONS.map((v) => capacityFor(v, level));\n}\n\n/**\n * SPEC §5.5 에 붙일 마크다운 표. 단일 물결표는 쓰지 않는다 (규약 §6.11).\n * @param {'L'|'M'|'H'} [level]\n * @returns {string}\n */\nexport function renderMarkdownTable(level = 'M') {\n  const rows = capacityTable(level);\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\n  const body = rows.map((r) => `| V${r.version} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B** |`);\n  return [head, sep, ...body].join('\\n');\n}\n"],
  ["placementA", "// placementA.js — Type A(삼각 실루엣) 영역·꼭짓점 앵커·패치 레퍼런스 배치\n// (ADR 0005 D1·D2·D4, docs/adr/0005_typeA_layout.md v1.1)\n//\n// Type A 는 육각 영역(반경 k)의 세 교대 방향에 삼각 코너 패치를 붙여 실루엣을\n// 정삼각형(△, 위 꼭짓점)으로 닫는 변형이다. 데이터 계약(§4.1 순위 3튜플·GF(211)·\n// §4.3 마스크)은 Type O 를 전부 승계하고 **레이아웃만** 확장한다.\n//\n// [D2 안 1 채택 — 무수정 공유 계약] 육각부의 역할 지도(앵커 3셀·포맷 15셀·레퍼런스\n// 2(k-2)셀)는 Type O 와 **바이트 동일**이다 — 이 모듈은 `placement.js`/`hexgrid.js`\n// 를 import 만 하고 절대 수정하지 않는다. 육각 코너 3셀 (0,0,5) 은 보조 앵커로\n// 그대로 남고, 꼭짓점 3셀이 주 앵커로 추가되어 앵커 총 6개가 된다.\n//\n// cube 좌표 (x,y,z) = (q, −q−r, r) 에서:\n//   영역 A(k)  = { x≤k ∧ y≤k ∧ z≤k } ⇔ axial q≤k ∧ r≤k ∧ q+r≥−k\n//   육각부     = 여기에 min(x,y,z)≥−k 를 더한 것 (= 기존 hexDistance≤k 와 전수 일치)\n//   패치       = 정확히 하나의 cube 좌표가 <−k 인 셀\n//     top(상단) 패치: r < −k (z < −k)\n//     BL(좌하) 패치:  q < −k (x < −k)\n//     BR(우하) 패치:  q+r > k (y < −k)\n// 세 패치는 `rotate120` 궤도(top → BR → BL)로 서로 사상된다 — placement.js 의\n// 120°/240° 회전(rhombille 이 갖는 유일한 비자명 대칭)을 그대로 재사용한다.\n//\n// 셀 수 검산: (3k+1)(3k+2)/2 — k=8 → 325 · k=10 → 496 (placementA.test.js 전수 검산).\n//\n// 런타임 의존성 0 · 순수 ESM.\n\nimport { hexDistance, regionCells } from './hexgrid.js';\nimport {\n  BULLSEYE_RADIUS,\n  REFERENCE_DIGIT,\n  ANCHOR_PRIMARY_DIGIT,\n  ANCHOR_SECONDARY_DIGIT,\n  FORMAT_RING,\n  rotate120,\n  rotate240,\n  ringWalk,\n  buildRoleSets,\n} from './placement.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  // 육각부 재사용(placement.js/hexgrid.js)이 요구하는 최소 반경을 그대로 승계한다\n  // (FORMAT_RING=3 이 데이터 링이려면 앵커 링(k) 보다 작아야 한다). 패치 레퍼런스\n  // 링 공식(k+2 .. 2k-1)도 k≥3 만 있으면 성립하므로 이 하한이 더 좁혀 잡는다.\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 영역 정의 (D1)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 영역 A(k) 소속 판정 — cube 좌표 x,y,z ≤ k (⇔ axial q≤k ∧ r≤k ∧ −q−r≤k). */\nexport function isInRegionA(q, r, k) {\n  return q <= k && r <= k && (-q - r) <= k;\n}\n\n/**\n * 패치 판별 — 정확히 하나의 cube 좌표가 <−k 인 셀만 패치다. 호출자는 (q,r) 이\n * 이미 `isInRegionA(q,r,k)` 를 만족하는 셀임을 보장해야 한다(역할 분류·레퍼런스\n * arc 필터링 등 내부 소비처가 전부 그렇다) — 임의 좌표에 대한 독립 판정이 아니다.\n */\nexport function isTopPatch(q, r, k) {\n  return isInRegionA(q, r, k) && r < -k;\n}\n\nexport function isBLPatch(q, r, k) {\n  return isInRegionA(q, r, k) && q < -k;\n}\n\nexport function isBRPatch(q, r, k) {\n  return isInRegionA(q, r, k) && (q + r) > k;\n}\n\n/** 셀의 패치 소속 — 'top' | 'BL' | 'BR' | null(육각부 또는 영역 밖). */\nexport function patchOfA(q, r, k) {\n  if (!isInRegionA(q, r, k)) return null;\n  if (isTopPatch(q, r, k)) return 'top';\n  if (isBLPatch(q, r, k)) return 'BL';\n  if (isBRPatch(q, r, k)) return 'BR';\n  return null; // 육각부\n}\n\n// top 패치 셀 — 행 j=1..k (r=−k−j), 행 내 q∈[j,k], 오름차순 고정(레이아웃-무관\n// 원시 나열). scan order(T3)의 boustrophedon 은 layoutA.js 소관이라 여기서 다루지\n// 않는다 — placementA.js 는 \"무엇이 패치 셀인가\"만 답한다.\nfunction topPatchCellsAscending(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    for (let q = j; q <= k; q += 1) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 영역 A(k) 전 셀, 결정적 순서 — 육각부 `regionCells(k)` 접두 그대로 + 패치 셀\n * (top → BR(rotate120) → BL(rotate240), 각 패치 내부는 행 j=1..k 오름차순 q).\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 (3k+1)(3k+2)/2\n */\nexport function regionCellsA(k) {\n  assertRadius(k);\n  const hexPart = regionCells(k);\n  const top = topPatchCellsAscending(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...hexPart, ...top, ...br, ...bl];\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 꼭짓점 앵커 3셀 (D2)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 닫힌 형태: cube 좌표에서 두 개가 +k, 하나가 −2k 인 세 점.\n//   (k,−2k) 위 꼭짓점 · (k,k) 우하 꼭짓점 · (−2k,k) 좌하 꼭짓점\n// digit 규약(§5.2 승계): digit 5 = 위 꼭짓점 (Type A 명명 근거 △ 와 일치하는 방향\n// 기준점), 나머지 두 꼭짓점 = digit 0. rotate120 이 top→BR→BL 순으로 사상하므로\n// 이 배열 순서 자체가 그 궤도를 반영한다.\n\n/**\n * 삼각 꼭짓점 3셀과 digit 배정 (D2 주 앵커). 기존 육각 코너 앵커(`placement.\n * anchorCells(k)`, 보조 앵커로 유지)와 합쳐야 앵커 총 6개다 — 이 함수는 꼭짓점\n * 3개만 낸다.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function vertexAnchors(k) {\n  assertRadius(k);\n  return [\n    { q: k, r: -2 * k, digit: ANCHOR_PRIMARY_DIGIT }, // 위 꼭짓점\n    { q: k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, //     우하 꼭짓점 (BR)\n    { q: -2 * k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, // 좌하 꼭짓점 (BL)\n  ];\n}\n\n/** 꼭짓점 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function vertexAnchorPositionSet(k) {\n  return new Set(vertexAnchors(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 패치 레퍼런스 셀 — 규칙 R (D4)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 패치 링 ρ ∈ {k+2, k+5, k+8, …} (ρ ≤ 2k−1) 에서 top 패치 arc(**= ringWalk(ρ) 중\n// 영역 A(k) 내 top 패치 셀만** — [C7] 자문 정정: \"r_ax<−k 만\"으로는 영역 밖 셀이\n// 섞이는 구현 함정이 있었다. `isTopPatch` 가 이미 `isInRegionA` 를 내부에서\n// 검사하므로 이 필터 한 줄로 두 조건을 동시에 만족한다)의 **중앙 셀**\n// (⌊(len−1)/2⌋) 을 잡고 rotate120/240 으로 복제한다 — 링당 3개.\n//\n// 랩어라운드 무관: 대칭 복제라 arc 인덱스 산술이 top 패치에서만 필요하고,\n// top 패치는 ringWalk 순회에서 절대 인덱스 0/끝을 걸치지 않는다(경험적으로\n// [C7] 독립 재구현이 재확인 — placementA.test.js 가 KAT 좌표로 회귀 고정한다).\n\n/** 패치 레퍼런스가 사는 링 반경 목록 — k+2 부터 2k−1 까지 3씩. */\nexport function patchReferenceRings(k) {\n  assertRadius(k);\n  const rings = [];\n  for (let rho = k + 2; rho <= 2 * k - 1; rho += 3) rings.push(rho);\n  return rings;\n}\n\n/**\n * 패치 레퍼런스 셀 전부(규칙 R). 링마다 top arc 중앙 + rotate120(→BR) +\n * rotate240(→BL) 3개, digit 은 `REFERENCE_DIGIT`(placement.js §5.3 값 3 승계).\n * k=8 KAT: (5,−10)·(7,−13) + 회전상(총 6). k=10 KAT: (6,−12)·(8,−15)·(9,−18) +\n * 회전상(총 9). (placementA.test.js 가 좌표를 그대로 회귀 고정한다.)\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]}\n */\nexport function patchReferenceCells(k) {\n  assertRadius(k);\n  const out = [];\n  for (const rho of patchReferenceRings(k)) {\n    const arc = ringWalk(rho).filter((c) => isTopPatch(c.q, c.r, k));\n    if (arc.length === 0) {\n      throw new RangeError(`k=${k} rho=${rho}: 패치 레퍼런스 arc 가 비었다 — 규칙 R 전제 위반`);\n    }\n    const center = arc[Math.floor((arc.length - 1) / 2)];\n    const br = rotate120(center.q, center.r);\n    const bl = rotate240(center.q, center.r);\n    out.push({ q: center.q, r: center.r, digit: REFERENCE_DIGIT });\n    out.push({ q: br.q, r: br.r, digit: REFERENCE_DIGIT });\n    out.push({ q: bl.q, r: bl.r, digit: REFERENCE_DIGIT });\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 — 육각부(placement.js 무수정) + 꼭짓점 앵커 + 패치 레퍼런스\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체(육각부 + 패치)의 역할 분류표. 육각부는 `placement.\n * buildRoleSets(k)` 를 그대로 재사용(D2 안 1 계약 — 바이트 동일)하고, 꼭짓점\n * 앵커·패치 레퍼런스만 그 위에 얹는다.\n * @param {number} k\n * @returns {{anchor: Set<string>, format: Set<string>, reference: Set<string>}}\n */\nexport function buildRoleSetsA(k) {\n  assertRadius(k);\n  const hexSets = buildRoleSets(k);\n  const anchor = new Set(hexSets.anchor);\n  for (const c of vertexAnchors(k)) anchor.add(key(c.q, c.r));\n  const reference = new Set(hexSets.reference);\n  for (const c of patchReferenceCells(k)) reference.add(key(c.q, c.r));\n  return { anchor, format: hexSets.format, reference };\n}\n\n/**\n * 셀 (q,r) 의 역할. 육각부는 `placement.roleOf` 와 완전히 동일한 판정을 낸다\n * (앵커·포맷·레퍼런스 좌표가 그대로이므로) — 패치 좌표만 anchor/reference/data 로\n * 새로 갈린다.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOfA(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSetsA(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n"],
  ["layoutA", "// layoutA.js — Type A scan order-A(T3) + 레이아웃 통합 파사드\n// (ADR 0005 D3, docs/adr/0005_typeA_layout.md v1.1 / 0005b §3)\n//\n// placementA.js 가 이미 확정한 \"어디에 무엇을 놓는가\"(꼭짓점 앵커·패치 레퍼런스)\n// 위에 **데이터 셀의 순회 순서**만 얹는다. layout.js(Type O) 와 대칭 구조 —\n// 소비자가 placementA/placement 를 따로 import 하지 않도록 재-export 파사드를\n// 겸한다.\n//\n// [D3 채택 — T3 행 boustrophedon] scan order-A = 육각부 §5.7 순서(=\n// `layout.dataCellsInScanOrder(k)`) 그대로 접두 + 패치 꼬리 [top → BR → BL]:\n//   top 패치는 행 j=1..k (r=−k−j), 행 내 q∈[j,k], **홀수 행 오름차순·짝수 행\n//   내림차순(boustrophedon)**; BR = rotate120(top 순서) · BL = rotate240(top 순서).\n//   role === 'data' 인 셀만(앵커·레퍼런스 스킵).\n// 후보 4개(T1 링 연장·T2 행 고정방향·T3·B 전역 행 우선) 실측 비교에서 T3 만\n// 유일하게 양쪽 k(8·10)에서 \"전 그룹 인접쌍 보유 100%\" 계약을 보존하고 변\n// 스크레이프 터치 심볼도 최소였다(0005b §3 표). 하기 실계산이 그 채택 근거를\n// 회귀로 고정한다(layoutA.test.js sha256 스냅샷).\n//\n// 필러: A1(k=8) 잔여 0(필러 없음) · A2(k=10) 잔여 2 → scan 꼬리 마지막 2셀 =\n// (−19,10)·(−19,9) = BL 패치 최외곽 행(실루엣 가장자리, §5.6 취지 유지).\n//\n// 런타임 의존성 0 · ESM.\n\nimport { dataCellsInScanOrder as hexDataCellsInScanOrder } from './layout.js';\nimport { rotate120, rotate240 } from './placement.js';\nimport { occupiedCells } from './bullseye.js';\nimport {\n  buildRoleSetsA,\n  roleOfA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n} from './placementA.js';\nimport {\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n} from './placement.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < 4) {\n    throw new RangeError(`k 는 4 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order-A (T3)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * top 패치를 행 j=1..k 로 훑되, 홀수 행은 q 오름차순 · 짝수 행은 q 내림차순\n * (boustrophedon). D3 이 채택한 T3 규칙의 핵심 — 인접 행끼리 끝점이 맞물려\n * 연속쌍 인접률이 T2(행 고정방향)보다 높다(0005b §3 실측표).\n */\nfunction topPatchBoustrophedon(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    const rowQs = [];\n    for (let q = j; q <= k; q += 1) rowQs.push(q);\n    if (j % 2 === 0) rowQs.reverse();\n    for (const q of rowQs) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 패치 꼬리(top → BR → BL, T3 boustrophedon) 중 role === 'data' 인 셀만.\n * 꼭짓점 앵커·패치 레퍼런스는 스킵된다.\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} roleSets\n */\nfunction patchDataTail(k, roleSets) {\n  const top = topPatchBoustrophedon(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...top, ...br, ...bl].filter((c) => roleOfA(c.q, c.r, k, roleSets) === 'data');\n}\n\n/**\n * 데이터 셀을 캐노니컬 scan order-A(T3) 로. 육각부 접두(`layout.\n * dataCellsInScanOrder(k)`, 바이트 동일) + 패치 꼬리(top→BR→BL, boustrophedon,\n * role=='data' 만).\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (A1(k=8) → 267 · A2(k=10) → 431)\n */\nexport function dataCellsInScanOrderA(k) {\n  assertRadius(k);\n  const hexPrefix = hexDataCellsInScanOrder(k);\n  const roleSets = buildRoleSetsA(k);\n  const tail = patchDataTail(k, roleSets);\n  return [...hexPrefix, ...tail];\n}\n\n/**\n * scan order-A 의 연속 3셀씩 묶은 심볼 그룹. §4.2 MSD-first 규약 그대로. 마지막\n * (C mod 3) 개는 그룹에 들지 않고 `fillerCellsA` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]}\n */\nexport function symbolCellGroupsA(k) {\n  const scan = dataCellsInScanOrderA(k);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order-A 의 마지막 (C mod 3) 개 (§5.6 준용). A1 은 0개, A2 는\n * 2개 = (−19,10)·(−19,9)(BL 패치 최외곽 행, D3 KAT).\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCellsA(k) {\n  const scan = dataCellsInScanOrderA(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점, layout.js `layoutMap` 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 영역 A(k) 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → 육각 코너 3셀(`placement.anchorCells(k)`) + 꼭짓점 3셀\n *                 (`placementA.vertexAnchors(k)`), 이 순서로 이어붙여 인덱스 0..5\n *   - format    → `placement.formatCells(k)` 순서 (육각부 재사용, 무변경)\n *   - reference → 육각 레퍼런스(`placement.referenceCellsAll(k)`) + 패치\n *                 레퍼런스(`placementA.patchReferenceCells(k)`), 이 순서로 이어붙임\n *   - data      → `dataCellsInScanOrderA(k)` 순서 (= scan order-A 인덱스, 심볼\n *                 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMapA(k) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n\n  const anchors = [...anchorCells(k), ...vertexAnchors(k)];\n  anchors.forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n\n  const references = [...referenceCellsAll(k), ...patchReferenceCells(k)];\n  references.forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n\n  dataCellsInScanOrderA(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placementA/placement 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOfA,\n  buildRoleSetsA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\n"],
  ["capacityA", "// capacityA.js — Type A 버전별 용량 산출 (ADR 0005 D5·D6, capacity.js/capacityY.js 대칭)\n//\n// **이 모듈이 SPEC 생성물 표의 소스다.** 수기로 유지\n// 하지 않는다.\n//\n// [A-U1 ✅ 확정 — 사용자 비준 2026-08-09, hb-20260809-tlrat1] `NSYM_TABLE_A` 는\n// ADR 0005 D5 실계산 절차(기존 rs211.js NSYM_TABLE 표 규칙 승계: M = round(0.25·S),\n// 짝수면 +1 홀수화 / L = round(0.12·S) / H = round(0.40·S))를 따르되, **A2/H 만\n// 절차값 57 대신 59** 다 — 57·58 은 base-211 청킹 비정렬로 생성 불가(아래 chunkAligned\n// 참조), 59 는 정렬·홀수·절차 최근접(|59−57.2|=1.8) 3조건 동시 만족 (비준 확정값):\n//   A0 S=45  → L 5 · M 11 (24.4%) · H 18   [ADR 0006 D6, 2026-08-09 비준]\n//   A1 S=89  → L 11 · M 23 (25.8%) · H 36\n//   A2 S=143 → L 17 · M 37 (25.9%) · H 59 (41.3% — 절차값 57 은 비정렬로 대체)\n//\n// [ADR 0006 D6 — A0 변 스크레이프 딱지] A0(k=6) 는 변 하나(각 19셀 = 3k+1)가 통째로\n// 소실되면 터치 RS 심볼이 **9/8/10** (R/B/L 변)이라 **t(H)=9 로도 L 변을 못 산다** —\n// 어떤 ECC 레벨도 변 전체 소실을 오류-전용 복호로 보장하지 못한다. H 강제의 유일한\n// 명분이 변 방어인데 그걸 못 사면서 순 페이로드만 31→25 B 로 과세하므로 **기본 M 유지**\n// (A1 전례 승계). 소거 회계로는 e ≤ nsym 이라 M(11) ≥ 10 — **P4(소거 복호) 구현이\n// A0 변 방어의 전제 조건**이다. M1-A 결합 스윕에 A0 를 포함한다.\n//\n// 회계는 capacity.js 와 동형이다(심볼 도메인):\n//   총 셀           total = (3k+1)(3k+2)/2  (D1 — 육각 3k²+3k+1 + 패치 3·k(k+1)/2)\n//   오버헤드         overhead = 불스아이 19 + 포맷 15 + 앵커 6(육각3+꼭짓점3) +\n//                     육각 레퍼런스 2(k−2) + 패치 레퍼런스(규칙 R, D4) — 실계산 합\n//                     (k=8 → 58 · k=10 → 65, D5 검산값과 정확히 일치해야 한다)\n//   데이터 심볼(셀)  C = total − overhead\n//   사용 심볼        S = ⌊C / 3⌋  (잔여 셀 = C − 3S)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE_A 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (capacity.js 의\n//                     `maxBytesForSymbols` 재사용 — BigInt 정확 계산, 전용 재구현 아님)\n//   순 페이로드       = K − 1  (헤더 1B, header.js 승계)\n//\n// [ADR 0006 D3 네임스페이스 — 2026-08-09 비준] formatIndex 는 **tri 패밀리 표**의\n// 값이다(4bit 는 격자 수립 경로별 독립 표). 1=A0 · 12=A1 · 13=A2, 중앙 QR 변형은\n// +2 오프셋으로 3=A0Q · 14=A1Q · 15=A2Q (encodeA.js 가 centerQr 옵션으로 적용).\n//\n// **A0 가 0 이 아닌 이유 (설계 불변식)**: tri 는 hex 코어를 좌표까지 그대로 포함\n// 한다(`dataCellsInScanOrder(6)` 82셀 == `dataCellsInScanOrderA(6)` 접두). 그래서\n// A0(k=6) 를 hex 표의 k=6 값에 배정하면 삼각 패치가 마모·가림됐을 때 hex 로 오판된\n// 가설이 격자·앵커·포맷·CRC·인덱스를 전부 \"정상 V1\"으로 통과시키고 페이로드를 그대로\n// 읽는다 — 완전 도플갱어 (몬테카를로 실측 오수락 2.7e-5/L, 설계 불변식 10⁻²⁰ 대비\n// 15자릿수 위반). ADR 0006 D3 축 분리 검사: **격자 파라미터 k 가 반드시 달라야 한다**\n// (k 가 다르면 샘플링 격자 자체가 어긋나 구조적으로 실패). hex 에서 k=6 인 값은\n// **0(V1)·4(V1Q) 둘뿐**이고, +2 쌍 불변식을 지키는 최저 안전쌍이 **1·3** 이다.\n// 파인더 종류(불스아이 vs 중앙 QR) 상이는 **단독 근거로 쓰지 않는다** — centerQr 은\n// 셀 기하를 전혀 안 바꾸므로(19셀 슬롯 동일) 디코더의 명시적 비교에만 의존한다.\n\nimport { cellCount } from './hexgrid.js';\nimport { symbolCountForByteLength } from './base211.js';\nimport { maxBytesForSymbols } from './capacity.js';\nimport { errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\nimport { occupiedCells } from './bullseye.js';\nimport { anchorCells, formatCells, referenceCellsAll } from './placement.js';\nimport { vertexAnchors, patchReferenceCells } from './placementA.js';\n\n/**\n * Type A 오버헤드 실계산(불스아이 19 + 포맷 15 + 앵커 6 + 육각 레퍼런스 2(k−2) +\n * 패치 레퍼런스). 하드코딩이 아니라 placement.js/placementA.js 실계산 합이다.\n * @param {number} k\n * @returns {{k:number, bullseye:number, anchor:number, format:number,\n *            hexReference:number, patchReference:number, total:number}}\n */\nexport function overheadBreakdownA(k) {\n  const bullseye = occupiedCells().length; // 19 (hexDistance<=2, k 무관)\n  const anchor = anchorCells(k).length + vertexAnchors(k).length; // 3 + 3 = 6\n  const format = formatCells(k).length; // 15 (k 무관)\n  const hexReference = referenceCellsAll(k).length; // 2(k-2)\n  const patchReference = patchReferenceCells(k).length; // 규칙 R, D4\n  const total = bullseye + anchor + format + hexReference + patchReference;\n  return {\n    k, bullseye, anchor, format, hexReference, patchReference, total,\n  };\n}\n\n// ADR 0005 D5 검산값 — 58(k=8)/65(k=10) · ADR 0006 D6 검산값 — 54(k=6).\n// \"조용히 맞추지 않는다\"(과제 지침 절대 규칙): 모듈 로드 시점에 실계산이 검산값과\n// 어긋나면 즉시 던진다.\nfor (const [k, expectedTotal] of [[6, 54], [8, 58], [10, 65]]) {\n  const actual = overheadBreakdownA(k).total;\n  if (actual !== expectedTotal) {\n    throw new Error(\n      `overheadBreakdownA(${k}) 실계산 불일치: ${actual} !== ADR 0005 D5 검산값 ${expectedTotal}`,\n    );\n  }\n}\n\n/**\n * [A-U1 ✅ 확정] Type A 사용 심볼 수 대비 ECC 레벨별 nsym 표 (사용자 비준\n * 2026-08-09). 산출 근거는 위 모듈 헤더 주석 (ADR 0005 D5).\n * @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>}\n */\nexport const NSYM_TABLE_A = Object.freeze({\n  A0: Object.freeze({\n    symbols: 45, L: 5, M: 11, H: 18,\n  }),\n  A1: Object.freeze({\n    symbols: 89, L: 11, M: 23, H: 36,\n  }),\n  A2: Object.freeze({\n    symbols: 143, L: 17, M: 37, H: 59,\n  }),\n});\n\n/**\n * 버전 정의. `overhead` 는 `overheadBreakdownA(k).total` 로 유도한다(하드코딩\n * 아님). `formatIndex` 는 tri 패밀리 표(1=A0·12=A1·13=A2, ADR 0006 D3) —\n * centerQr(A*Q) 는 encodeA.js 가 +2 오프셋으로 적용한다(3=A0Q·14=A1Q·15=A2Q).\n *\n * 배열 순서는 **용량 오름차순** — `chooseVersionA` 가 앞에서부터 훑어 최소 버전을\n * 고르므로 A0 가 선두여야 한다.\n * @type {ReadonlyArray<{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}>}\n */\nexport const VERSIONS_A = Object.freeze([\n  Object.freeze({\n    name: 'A0', version: 0, k: 6, formatIndex: 1, overhead: overheadBreakdownA(6).total, symbolKey: 'A0',\n  }),\n  Object.freeze({\n    name: 'A1', version: 1, k: 8, formatIndex: 12, overhead: overheadBreakdownA(8).total, symbolKey: 'A1',\n  }),\n  Object.freeze({\n    name: 'A2', version: 2, k: 10, formatIndex: 13, overhead: overheadBreakdownA(10).total, symbolKey: 'A2',\n  }),\n]);\n\n/**\n * version → VERSIONS_A 항목.\n * @param {number} version 0 | 1 | 2\n * @returns {{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}}\n */\nexport function versionSpecA(version) {\n  const spec = VERSIONS_A.find((v) => v.version === version);\n  if (!spec) {\n    throw new RangeError(\n      `알 수 없는 Type A 버전: ${version} (허용 ${VERSIONS_A.map((v) => `${v.name}(v${v.version})`).join(', ')})`,\n    );\n  }\n  return spec;\n}\n\n/**\n * 한 버전의 용량 전체. capacity.js `capacityFor` 회계를 그대로 승계한다.\n * @param {{version:number, k:number, overhead:number, symbolKey:string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForA(spec, level = 'M') {\n  const label = spec.name || `A${spec.version}`;\n  const totalCells = (3 * spec.k + 1) * (3 * spec.k + 2) / 2;\n  // hexgrid.cellCount(k) + 패치 3·k(k+1)/2 와 항등이어야 한다(placementA.test.js 가\n  // 이 항등을 회귀 고정) — 여기서는 닫힌 형태로 직접 계산(D1)한다.\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`${label}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE_A[spec.symbolKey];\n  if (!table) {\n    throw new RangeError(`${label}: NSYM_TABLE_A 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 조용히 맞추지 않고 던진다\n    // (capacity.js `capacityFor` 와 동일한 규약 · 과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `${label}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE_A.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`${label}: NSYM_TABLE_A.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`${label}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n\n  // [발견 — 검증 라운드 2026-08-09] \"S개 심볼 = 하나의 큰 base-211 수\" K 산정과\n  // base211.js 의 27B↔28심볼 청크 인코더는 효율이 미세하게 달라, K 를 실제 청크\n  // 인코딩하면 dataSymbols 와 어긋나는 조합이 존재할 수 있다 (구 A2/H=57 이 그랬고,\n  // A-U1 비준으로 59 로 교체해 현행 표는 전 조합 정렬이다). 그런 조합은 encodeA.js\n  // 자기검증이 throw 하므로 **생산 불가**다 — 표가 미래에 다시 어긋나면 소비자가\n  // 정상 용량으로 게시하지 않도록 플래그를 유지한다 (가드).\n  const chunkAligned = symbolCountForByteLength(dataBytes) === dataSymbols;\n\n  return {\n    name: spec.name,\n    version: spec.version,\n    k: spec.k,\n    formatIndex: spec.formatIndex,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    chunkAligned,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/**\n * 전 버전 용량표.\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityTableA(level = 'M') {\n  return VERSIONS_A.map((v) => capacityForA(v, level));\n}\n\n/**\n * SPEC 에 붙일 마크다운 표(향후 §14 대칭 절 생성용). 단일 물결표는 쓰지 않는다\n * (규약 §6.11).\n * @param {'L'|'M'|'H'} [level]\n * @returns {string}\n */\nexport function renderMarkdownTableA(level = 'M') {\n  const rows = capacityTableA(level);\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\n  const body = rows.map((r) => `| ${r.name} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B**`\n    + `${r.chunkAligned ? '' : ' ⚠ 청킹 비정렬 — 인코딩 불가 (nsym 재조정 필요)'} |`);\n  return [head, sep, ...body].join('\\n');\n}\n\n// 대조용: hexgrid.cellCount 는 육각부만(패치 미포함) 계산한다 — capacityA.test.js\n// 가 \"totalCells - cellCount(k) === 3*k*(k+1)/2(패치 셀 수)\" 항등을 검증할 때 쓴다.\nexport { cellCount as hexCellCount };\n"],
  ["encodeA", "// encodeA.js — Type A 인코더 파이프라인 통합 (ADR 0005, encode.js 대칭)\n//\n// UTF-8 페이로드 → 길이 헤더 1B 부착 → 0x00 패딩(고정 dataBytes까지) → base-211\n// 심볼 변환(27B↔28심볼, MSD-first) → RS(GF(211)) 패리티 → 코드워드 = 심볼 열 S개\n// → 심볼 → 3 digit(MSD-first) → 마스크 가산 → scan order-A(T3) 로 셀 배치 →\n// 잔여 셀에 필러(프리마스크 0 + 마스크) → digit 확정까지. 배정(digit → (T,L,R)\n// rank)·렌더는 다른 모듈 몫이다 — 여기서는 셀별 digit 확정까지만 한다.\n//\n// 이 모듈은 새 규약을 만들지 않는다 — capacityA.js/header.js/base211.js/rs211.js/\n// mask.js/formatinfo.js/layoutA.js/placementA.js/placement.js(육각부 무수정 재사용)\n// 가 이미 확정한 조각을 파이프라인 순서대로 조합만 한다.\n//\n// [D6 centerQr] formatIndex 는 VERSIONS_A 의 12(A1)/13(A2)에서 centerQr=true 면\n// +2 오프셋(14=A1Q·15=A2Q) — 중앙 QR 파인더 변형(ADR 0004 §1-3 규약 승계, D7).\n// 오버헤드·용량 수치는 centerQr 무관 동일하다(19셀 슬롯 기하 동일, D5 근거).\n\nimport { VERSIONS_A, capacityForA, versionSpecA } from './capacityA.js';\nimport { frame, payloadByteLength } from './header.js';\nimport { bytesToSymbols, unpackSymbolsToCellDigits } from './base211.js';\nimport { rsEncode } from './rs211.js';\nimport { maskAdd } from './mask.js';\nimport { encodeReplicated, ECC_LEVEL } from './formatinfo.js';\nimport { dataCellsInScanOrderA, fillerCellsA } from './layoutA.js';\nimport { anchorCells, referenceCellsAll, formatCells, REFERENCE_DIGIT } from './placement.js';\nimport { vertexAnchors, patchReferenceCells } from './placementA.js';\n\nfunction cellKey(q, r) {\n  return `${q},${r}`;\n}\n\n/**\n * 페이로드 바이트 길이가 들어가는 최소 VERSIONS_A 항목을 고른다.\n * A2(ECC-eccLevel) 도 초과하면 RangeError.\n * @param {string} text\n * @param {'L'|'M'|'H'} [eccLevel]\n * @returns {{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}}\n */\nexport function chooseVersionA(text, eccLevel = 'M') {\n  const byteLength = payloadByteLength(text);\n  for (const spec of VERSIONS_A) {\n    const capacity = capacityForA(spec, eccLevel);\n    if (byteLength <= capacity.maxPayloadBytes) return spec;\n  }\n  const last = VERSIONS_A[VERSIONS_A.length - 1];\n  throw new RangeError(\n    `페이로드 ${byteLength} B 는 ${last.name}(ECC-${eccLevel}) 용량을 초과한다`,\n  );\n}\n\n/**\n * Type A 인코더 파이프라인 진입점. version 을 생략하면 `chooseVersionA` 로\n * 자동 선택한다.\n * @param {string} text UTF-8 페이로드\n * @param {{version?: number, eccLevel?: 'L'|'M'|'H', centerQr?: boolean}} [options]\n * @returns {{\n *   version: number, k: number, eccLevel: 'L'|'M'|'H', centerQr: boolean, formatIndex: number,\n *   capacity: object,\n *   codewordSymbols: Uint8Array,\n *   dataDigits: Uint8Array,\n *   fillerDigits: Uint8Array,\n *   formatDigits: number[],\n *   cellDigits: Map<string, {digit:number, role:'anchor'|'reference'|'format'|'data'|'filler'}>,\n * }}\n */\nexport function encodeA(text, options = {}) {\n  // encode.js(Type O) 전례: version 명시 경로가 chooseVersionA(→ payloadByteLength\n  // 의 타입 검사)를 건너뛰면 TextEncoder 가 undefined → '' 로 조용히 강제 변환한다.\n  // 두 경로의 판정을 여기서 먼저 일치시킨다.\n  if (typeof text !== 'string') {\n    throw new TypeError(`페이로드는 문자열이어야 한다: ${typeof text}`);\n  }\n  const { version, eccLevel = 'M', centerQr = false } = options;\n  if (typeof centerQr !== 'boolean') {\n    throw new TypeError(`centerQr 는 boolean 이어야 한다: ${typeof centerQr}`);\n  }\n\n  const spec = version === undefined ? chooseVersionA(text, eccLevel) : versionSpecA(version);\n\n  const capacity = capacityForA(spec, eccLevel);\n  const { k } = spec;\n\n  // 길이 헤더 + 0x00 패딩 (header.js) → base-211 심볼 (base211.js).\n  const framed = frame(text, capacity.dataBytes);\n  const symbols = bytesToSymbols(framed);\n  if (symbols.length !== capacity.dataSymbols) {\n    // 조용히 맞추지 않는다 — 파이프라인 자기검증(과제 지침 절대 규칙).\n    throw new RangeError(\n      `심볼 개수 불일치: bytesToSymbols() ${symbols.length} !== capacity.dataSymbols ${capacity.dataSymbols}`,\n    );\n  }\n\n  // RS(GF(211)) 패리티 부착 → 코드워드 = 데이터 심볼 ‖ 패리티, 길이 S(=usedSymbols).\n  const codewordSymbols = rsEncode(symbols, capacity.nsym);\n  if (codewordSymbols.length !== capacity.usedSymbols) {\n    throw new RangeError(\n      `코드워드 심볼 개수 불일치: rsEncode() ${codewordSymbols.length} !== capacity.usedSymbols ${capacity.usedSymbols}`,\n    );\n  }\n\n  // 심볼 → 3 digit(MSD-first, 프리마스크) → scan order-A 좌표에 마스크 가산.\n  //\n  // `dataCellsInScanOrderA(k)` 는 role === 'data' 인 셀 **전부**(= dataCells 개,\n  // capacity.dataCells)를 돌려준다 — 그중 앞 3S 개가 실제 심볼 3-digit 그룹이고\n  // 나머지(residualCells 개, = `fillerCellsA(k)` 와 정확히 같은 셀)가 필러다\n  // (layoutA.js `symbolCellGroupsA`/`fillerCellsA` 의 분할과 동일하게 슬라이스한다).\n  const preMaskDataDigits = unpackSymbolsToCellDigits(codewordSymbols); // 길이 3S\n  const scanCells = dataCellsInScanOrderA(k);\n  if (scanCells.length !== capacity.dataCells) {\n    throw new RangeError(\n      `scan order-A 셀 수 불일치: dataCellsInScanOrderA() ${scanCells.length} !== capacity.dataCells ${capacity.dataCells}`,\n    );\n  }\n  const dataCellCoords = scanCells.slice(0, preMaskDataDigits.length);\n  const dataDigits = new Uint8Array(preMaskDataDigits.length);\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    dataDigits[i] = maskAdd(preMaskDataDigits[i], c.q, c.r);\n  }\n\n  // 잔여 셀 = 프리마스크 0 에 마스크 가산(§5.6 준용). scan order-A 의 꼬리와 동일 셀.\n  const fillerCoords = fillerCellsA(k);\n  if (fillerCoords.length !== capacity.residualCells) {\n    throw new RangeError(\n      `필러 셀 수 불일치: fillerCellsA() ${fillerCoords.length} !== capacity.residualCells ${capacity.residualCells}`,\n    );\n  }\n  const fillerDigits = new Uint8Array(fillerCoords.length);\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    fillerDigits[i] = maskAdd(0, c.q, c.r);\n  }\n\n  // 포맷 정보(§5.4 승계, D6 네임스페이스): formatIndex(12~15) = spec.formatIndex +\n  // centerQr(2) 오프셋 — 12=A1·13=A2·14=A1Q·15=A2Q. 이 인덱스는 파인더 종류\n  // (불스아이 vs 중앙 QR)·실루엣(삼각 vs 육각)의 **사후 검증** 축이다(ADR 0004\n  // \"인덱스=사후 검증\" 규약 승계, D6) — 인코더 쪽은 부착까지만 한다.\n  const eccLevelValue = ECC_LEVEL[eccLevel];\n  if (eccLevelValue === undefined || eccLevelValue === ECC_LEVEL.RESERVED) {\n    throw new RangeError(`알 수 없는 ECC 레벨: ${eccLevel}`);\n  }\n  const formatIndex = spec.formatIndex + (centerQr ? 2 : 0);\n  const formatReplicas = encodeReplicated({ version: formatIndex, eccLevel: eccLevelValue });\n  const formatDigits = formatReplicas.flat(); // 길이 15, formatCells(k) 순서와 정합\n\n  // 셀별 digit + role 맵 (불스아이 셀은 애초에 어느 목록에도 없으므로 자동 제외).\n  const cellDigits = new Map();\n\n  // 앵커 = 육각 코너 3셀(보조, placement.js 무수정) + 꼭짓점 3셀(주, D2) = 6.\n  const anchors = [...anchorCells(k), ...vertexAnchors(k)];\n  for (const c of anchors) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: c.digit, role: 'anchor' });\n  }\n\n  // 레퍼런스 = 육각 2(k-2)셀 + 패치 레퍼런스(규칙 R, D4) — 전부 REFERENCE_DIGIT.\n  const references = [...referenceCellsAll(k), ...patchReferenceCells(k)];\n  for (const c of references) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: REFERENCE_DIGIT, role: 'reference' });\n  }\n\n  const formatCoords = formatCells(k); // 육각부 무수정 재사용(D7)\n  for (let i = 0; i < formatCoords.length; i += 1) {\n    const c = formatCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: formatDigits[i], role: 'format' });\n  }\n\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: dataDigits[i], role: 'data' });\n  }\n\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: fillerDigits[i], role: 'filler' });\n  }\n\n  return {\n    version: spec.version,\n    k,\n    eccLevel,\n    centerQr,\n    formatIndex,\n    capacity,\n    codewordSymbols,\n    dataDigits,\n    fillerDigits,\n    formatDigits,\n    cellDigits,\n  };\n}\n"],
