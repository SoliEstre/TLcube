  ["finder-footprint", "/**\n * finder-footprint.js — Footprint 파인더의 **좌표·톤 정본 유도** (2026-08-23 편입).\n *\n * ─ 정본과 유도 ─────────────────────────────────────────────────────────────\n * 정본: 바깥 repo `.agent/decoder/data/finder-footprint-2026-08-23.json`\n *       (schema `tlcube-cell-editor/v2` · 운영자 셀 편집기 export 2026-08-23 ·\n *       type O · size 4 · 중앙 19셀 · userNonData 19 · toneOverrides 57 = 19셀×3면).\n * 정본은 private repo 라 여기 임베드하지 못한다. 그래서 **표 + 검증 쌍**\n * (finder-daehan.js 전례)을 쓴다: 아래 표는 손 전사가 아니라 유도 스크립트가\n * 정본에서 기계로 찍은 것이고, `deriveFootprintCellLevels` 가 그 유도 규약의\n * 코드 정본이다. `test/finder-footprint.test.js` ① 이 정본 JSON 이 있는\n * 체크아웃에서 전수 재유도해 이 표와 대조한다 — **어긋나면 던진다**.\n *\n * 유도 규약 (OAK 정본 `_note` 와 동일):\n *   · 좌표는 축 좌표 {q,r} → `FINDER_CELL_ORDER` 순서로 정렬\n *   · 톤은 면별 override 이고, export 에 없는 면은 중간톤(1)\n *     ⚠ footprint 정본은 19×3 = 57 면 **전부** override 를 든다 — 중간톤 규약은\n *       이 후보에서 한 번도 발동하지 않고, 표는 0/2 이진이다. 그래도 `cellLevels`\n *       표현을 쓴다 (OAK 계열 공통 표현 — finder-oak-patterns.js §왜 cellLevels 인가).\n *   · 여기 삼중은 [T, L, R]\n *\n * ─ ⚠ 이 정본의 toneOverrides 는 **평면 목록**이다 ──────────────────────────\n * `finder-oak-candidates.json` 은 면 키로 묶인 `{T: [[q,r,tone],…], …}` 이고,\n * 이 export 는 `[{face,q,r,tone}, …]` 평면 목록이다. 형태를 섞어 읽으면 override\n * 0건으로 «전부 중간톤» 이 조용히 유도된다 — 그래서 아래가 override 수 57 을\n * 직접 세어 잠근다.\n *\n * 렌더·검출 등재는 `finder-oak-patterns.js` (id `oak-footprint`) — 이 모듈은\n * 데이터와 유도만 든다. 런타임 의존성 0 · 순수 ESM.\n */\n\nimport { FINDER_CELL_ORDER } from './finder-patterns.js';\n\n/** 정본 이름 — 명부(lineup) 조회 키이자 표시명. */\nexport const FOOTPRINT_NAME = 'Footprint';\n\n/** `cellLevels` 삼중의 면 순서 — OAK 표·검출기·렌더러와 **같은 표**여야 한다. */\nexport const FOOTPRINT_LEVEL_FACE_INDEX = Object.freeze({ T: 0, L: 1, R: 2 });\n\n/**\n * 19셀 면 톤 [T, L, R] — `FINDER_CELL_ORDER` 순서.\n * 이 블록은 손 전사가 아니다 — 유도 스크립트(정본 → deriveFootprintCellLevels 와\n * 같은 규약)가 기계로 찍었다. 전수 대조: `test/finder-footprint.test.js` ①.\n */\nexport const FOOTPRINT_CELL_LEVELS = Object.freeze([\n  [2, 2, 0], // -2,0\n  [0, 2, 2], // -2,1\n  [2, 2, 2], // -2,2\n  [2, 2, 2], // -1,-1\n  [2, 0, 2], // -1,0\n  [2, 2, 0], // -1,1\n  [0, 2, 2], // -1,2\n  [2, 2, 0], // 0,-2\n  [0, 0, 0], // 0,-1\n  [0, 2, 2], // 0,0\n  [2, 0, 2], // 0,1\n  [2, 2, 2], // 0,2\n  [0, 0, 0], // 1,-2\n  [0, 0, 0], // 1,-1\n  [2, 2, 0], // 1,0\n  [0, 2, 2], // 1,1\n  [2, 0, 2], // 2,-2\n  [2, 2, 2], // 2,-1\n  [2, 0, 2], // 2,0\n].map((triple) => Object.freeze([...triple])));\n\nconst cellKey = (cell) => cell.q + ',' + cell.r;\n\n/**\n * 정본 편집기 export(파싱된 JSON) → `FINDER_CELL_ORDER` 순 cellLevels.\n *\n * 일회성 손 변환의 대체물이자 대조 테스트의 자다. 정본이 바뀌면 여기가 먼저\n * 던지거나(형태·계수) 테스트 대조가 빨개진다(값). 조용한 폴백은 없다.\n */\nexport function deriveFootprintCellLevels(doc) {\n  if (!doc || doc.schema !== 'tlcube-cell-editor/v2') {\n    throw new Error('footprint 유도: 스키마가 tlcube-cell-editor/v2 가 아니다: '\n      + (doc && doc.schema));\n  }\n  if (!Array.isArray(doc.userNonData) || !Array.isArray(doc.toneOverrides)) {\n    throw new Error('footprint 유도: userNonData/toneOverrides 배열이 없다');\n  }\n  const byKey = new Map();\n  for (const cell of doc.userNonData) {\n    const key = cellKey(cell);\n    if (byKey.has(key)) throw new Error('footprint 유도: userNonData 좌표 중복 ' + key);\n    // 정본 _note 규약: export 에 없는 면은 중간톤(1).\n    byKey.set(key, { T: 1, L: 1, R: 1 });\n  }\n  if (byKey.size !== FINDER_CELL_ORDER.length) {\n    throw new Error('footprint 유도: userNonData 가 ' + FINDER_CELL_ORDER.length\n      + ' 셀이 아니다: ' + byKey.size);\n  }\n  let overrides = 0;\n  for (const override of doc.toneOverrides) {\n    if (override.face !== 'T' && override.face !== 'L' && override.face !== 'R') {\n      throw new Error('footprint 유도: 알 수 없는 면 ' + override.face);\n    }\n    const tones = byKey.get(cellKey(override));\n    if (!tones) {\n      throw new Error('footprint 유도: toneOverrides 가 userNonData 밖 좌표를 가리킨다: '\n        + cellKey(override));\n    }\n    tones[override.face] = override.tone;\n    overrides += 1;\n  }\n  if (overrides !== FINDER_CELL_ORDER.length * 3) {\n    throw new Error('footprint 유도: override 가 ' + (FINDER_CELL_ORDER.length * 3)\n      + ' 면이 아니다: ' + overrides + ' — 평면 목록 형태가 바뀌었나');\n  }\n  // 좌표 19/19 일치 — 슬롯 좌표가 정본에 전부 있어야 한다 (위 크기 검사와 합쳐\n  // 집합 동일까지 잠긴다).\n  return FINDER_CELL_ORDER.map((cell) => {\n    const tones = byKey.get(cellKey(cell));\n    if (!tones) {\n      throw new Error('footprint 유도: 슬롯 좌표 ' + cellKey(cell) + ' 가 정본에 없다');\n    }\n    return [tones.T, tones.L, tones.R];\n  });\n}\n\n// ── 로드 자기검증 ──────────────────────────────────────────────────────────\n// 표 주도 데이터는 조용히 썩는다 (finder-oak-patterns.js 전례). 모듈이 로드되는 것\n// 자체가 아래 명제들의 통과를 뜻하게 만든다.\n{\n  // ① 슬롯과 같은 19행 · [T,L,R] 삼중.\n  if (FOOTPRINT_CELL_LEVELS.length !== FINDER_CELL_ORDER.length) {\n    throw new Error('footprint: 표가 ' + FINDER_CELL_ORDER.length + ' 행이 아니다: '\n      + FOOTPRINT_CELL_LEVELS.length);\n  }\n  for (const triple of FOOTPRINT_CELL_LEVELS) {\n    if (triple.length !== 3) throw new Error('footprint: 톤 삼중이 아니다 ' + triple);\n  }\n\n  // ② 톤 값 집합이 정확히 {0, 2} 다 — 정본은 0/2 이진이고(toneLevels dark/bright 만\n  //    쓴다), 중간톤이 나타나면 유도 규약의 «없는 면 = 1» 이 발동한 것 = 정본과\n  //    어긋난 것이다. 두 값이 다 있으므로 균일 톤(검출기 norm2 = 0 사망)도 아니다.\n  const tones = new Set(FOOTPRINT_CELL_LEVELS.flat());\n  if (tones.size !== 2 || !tones.has(0) || !tones.has(2)) {\n    throw new Error('footprint: 톤 집합이 {0,2} 가 아니다 — '\n      + JSON.stringify([...tones].sort()));\n  }\n\n  // ③ 정본의 독립 계수 — 밝은 면 T12/L12/R12 (유도 스크립트 실측 2026-08-23).\n  //    표가 한 값이라도 썩으면 여기서 잡힌다 (daehan ② 와 같은 가드).\n  const bright = { T: 0, L: 0, R: 0 };\n  for (const triple of FOOTPRINT_CELL_LEVELS) {\n    if (triple[FOOTPRINT_LEVEL_FACE_INDEX.T] === 2) bright.T += 1;\n    if (triple[FOOTPRINT_LEVEL_FACE_INDEX.L] === 2) bright.L += 1;\n    if (triple[FOOTPRINT_LEVEL_FACE_INDEX.R] === 2) bright.R += 1;\n  }\n  if (bright.T !== 12 || bright.L !== 12 || bright.R !== 12) {\n    throw new Error('footprint: 밝은 면 계수가 정본과 다르다 — ' + JSON.stringify(bright)\n      + ' (정본 T12/L12/R12)');\n  }\n}\n"],
  ["finder-oak-patterns", "/**\n * finder-oak-patterns.js — O/A/K 파인더 후보의 **렌더·검출 표현** (2026-08-18 편입).\n *\n * ─ 왜 `finder-patterns.js` 가 아니라 여기인가 ──────────────────────────────\n * `src/finder-patterns.js` 는 `tools/extract-finder-patterns.mjs` 의 **생성물**이고\n * 바이트 동일 회귀가 그걸 지킨다. 그 도구의 파이프라인은 `cellMasksToBits` ·\n * `bitsToCellMasks` · 6축 채점 하네스까지 전부 **이진 비트** 위에 서 있다.\n * OAK 후보는 그 탐색의 산출물이 아니라 **운영자 편집기 export** 이고 중간톤을\n * 쓰므로, 거기 끼워 넣는 것은 출처를 속이는 일이자 생성 도구를 통째로 뜯는 일이다.\n * 그래서 출처가 다른 표를 **출처가 다른 모듈**에 둔다.\n *\n * ─ 정본과 유도 ─────────────────────────────────────────────────────────────\n * 정본: 바깥 repo `.agent/decoder/data/finder-oak-candidates.json`\n *       (schema `tlcube-cell-editor/v2`, 운영자 제공 2026-08-15).\n * 유도 규약 (정본 `_note`):\n *   · 좌표는 축 좌표 [q,r] → `FINDER_CELL_ORDER` 순서로 정렬\n *   · 톤은 면별 override 이고, **export 에 없는 면은 중간톤(1)** 이다\n *   · 여기 삼중은 [T, L, R]\n * 재유도 스크립트: `test/output/lanes/claude-oak-derive-probe.mjs`.\n * 전사 검증: `test/finder-oak-patterns.test.js` 가 정본 JSON 이 있을 때 전수 대조하고,\n * 없으면 skip 하지 않고 **자기 일관성**(톤 분포 · 명부 대조)만으로 실패 가능하게 남긴다.\n *\n * ─ 왜 `cellLevels` 인가 ────────────────────────────────────────────────────\n * 세 후보 중 둘이 중간톤 면을 쓴다 — Nitrogen r2 5면 · Aspirin 2면. 면당 1비트인\n * `cellMasks` 로는 **표현 자체가 불가능**하다. 이진으로 반올림하면 그것은 다른\n * 후보이지 이 후보가 아니다. Benzene 은 이진이지만 같은 계열이라 같은 표현으로 둔다\n * (표현이 갈리면 «어느 쪽이 정본인가» 를 매번 되묻게 된다).\n *\n * ─ 여기 없는 후보와 그 이유 (드랍이 아니라 **미편입**) ──────────────────────\n *   · H2O (A) · H2CO3 (K) — override 가 전부 중앙 19셀 **밖**(코너 18 / 30셀)이다.\n *     중앙 19셀 격자 정합 검출기(cell-finder-detect.js)의 표현 범위 밖.\n *     ⚠ 2026-08-21: 둘은 확장 영역만 쓰는 파인더다. finderStarter 는 기준선이지\n *     중앙 3톤 큐브가 그 디자인의 내용인 것이 아니다.\n *   · daehan (O) — 31셀 **전체 표면**이다. 중앙 19만 떼면 다른 후보가 된다\n *     (margin 0.6452 는 31셀 표면에서 나온 값이다).\n *     2026-08-21 분류 층: 내부 19 = taegeuk, 밖 = sagoae. 와이어 id 는 원자 유지.\n *     ⚠ 2026-08-23: 그 «중앙 19만 뗀 것» 이 **별개 후보로** 편입됐다 — 아래\n *     `oak-taegeuk-solo` (PM/022 W2-taegeuk ①). daehan 미편입 사유와 모순이 아니다:\n *     daehan(합성)은 여전히 전용 모듈이고, taegeuk 단독은 19셀 안에 사는 **다른\n *     margin(0.6667)의 다른 후보**로서 이 표의 불변식(19셀)에 맞는다. 단 **렌더\n *     전용**이다 — 검출 라인업에 넣으면 daehan 프레임을 가로챈다\n *     (`OAK_RENDER_ONLY_FINDER_PATTERNS` 헤더의 실측 · 검출 편입은 통합자 몫).\n *   · Nitrogen (dead) · Xylene (dropped) — 명부의 지위가 그렇다. 차단이지 삭제가\n *     아니므로 명부(`finder-oak-lineup.js`)에는 남아 있고 여기에만 없다.\n *\n * 이 모듈은 명부와 **다른 것**을 든다: 명부는 «어느 후보가 유망한가»(margin·지위),\n * 이 표는 «그 후보가 정확히 무엇인가»(셀 톤). 둘의 교집합은 아래 자기검증이 잡는다.\n */\n\nimport { FINDER_CELL_ORDER } from './finder-patterns.js';\nimport { OAK_LINEUP } from './finder-oak-lineup.js';\nimport { FOOTPRINT_NAME, FOOTPRINT_CELL_LEVELS } from './finder-footprint.js';\nimport { taegeukCells, taegeukLevels } from './finder-daehan.js';\n\n/** `cellLevels` 삼중의 면 순서 — 검출기·렌더러와 **같은 표**여야 한다. */\nexport const OAK_LEVEL_FACE_INDEX = Object.freeze({ T: 0, L: 1, R: 2 });\n\nfunction defineOakPattern(pattern) {\n  if (!Array.isArray(pattern.cellLevels)\n      || pattern.cellLevels.length !== FINDER_CELL_ORDER.length) {\n    throw new RangeError(pattern.id + ': cellLevels 는 '\n      + FINDER_CELL_ORDER.length + '개여야 한다');\n  }\n  for (const triple of pattern.cellLevels) {\n    if (!Array.isArray(triple) || triple.length !== 3) {\n      throw new RangeError(pattern.id + ': cellLevels 항목은 [T,L,R] 삼중이어야 한다');\n    }\n    for (const level of triple) {\n      if (level !== 0 && level !== 1 && level !== 2) {\n        throw new RangeError(pattern.id + ': 톤 레벨은 0|1|2 여야 한다: ' + level);\n      }\n    }\n  }\n  if (pattern.cellMasks !== undefined) {\n    throw new RangeError(pattern.id + ': OAK 후보는 cellMasks 를 함께 들면 안 된다'\n      + ' — 이진 근사가 정본 행세를 하게 된다');\n  }\n  return Object.freeze({\n    ...pattern,\n    // 검출·렌더 경로를 기존 19셀 파인더와 **같게** 쓴다. renderKind 를 새로 만들면\n    // scene.js·cell-finder-detect.js 양쪽에 분기가 하나씩 더 생기고, 그 둘이\n    // 어긋나는 날 «그린 것과 읽는 것» 이 갈린다.\n    renderKind: 'cell-mask',\n    family: 'oak',\n    params: Object.freeze({ ...pattern.params }),\n    cellLevels: Object.freeze(pattern.cellLevels.map((triple) => Object.freeze([...triple]))),\n  });\n}\n\n/**\n * taegeuk 단독의 슬롯 순 cellLevels — **유도**다 (값 복사 금지, 사본 목록은 썩는다).\n *\n * 정본은 `finder-daehan.js` 의 `taegeukCells()`/`taegeukLevels()` (daehan k10 정본의\n * 불스아이 안 19셀 — 그 좌표 집합이 `FINDER_CELL_ORDER` 와 같다는 것은 그 모듈의\n * 로드 자기검증 ⑥ 이 잠근다). 단 **순서가 다르다** — taegeukCells 는 daehan 정본\n * 등장 순서이고 이 표는 슬롯 순서여야 하므로, 좌표 키로 재배열한다. 재배열이\n * 19/19 전부를 찾는지 여기서 다시 던져 잠근다.\n */\nfunction taegeukSlotCellLevels() {\n  const cells = taegeukCells();\n  const levels = taegeukLevels();\n  const byKey = new Map(cells.map((cell, i) => [cell.q + ',' + cell.r, levels[i]]));\n  return FINDER_CELL_ORDER.map((cell) => {\n    const triple = byKey.get(cell.q + ',' + cell.r);\n    if (!triple) {\n      throw new Error('taegeuk 유도: 슬롯 좌표 ' + cell.q + ',' + cell.r\n        + ' 가 taegeukCells 에 없다 — daehan 정본이 바뀌었나');\n    }\n    return [...triple];\n  });\n}\n\nexport const OAK_FINDER_PATTERNS = Object.freeze([\n  defineOakPattern({\n    id: 'oak-nitrogen-r2',\n    // **정식 표시명 = Niteogen** (운영자 확정 2026-08-18). `lineupName` 은 그대로\n    // 'Nitrogen r2' 다 — 그건 표시가 아니라 **정본 JSON 의 조회 키**이고, 정본을\n    // 안 건드린 채 이름만 바꾸면 대조가 끊긴다. id 도 안 바꾼다: 이미 라이브에\n    // 나갔고(09532c8) 저장된 선택·URL·텔레메트리가 그 문자열을 들고 있다.\n    name: 'Niteogen',\n    lineupName: 'Nitrogen r2',\n    params: { candidate: 'O-1r2-central3tone', type: 'O', finderStarter: 'central-cube-3tone' },\n    cellLevels: [\n      [2, 0, 2], [2, 2, 2], [2, 0, 2], [2, 2, 0], [2, 0, 2], [1, 0, 1], [0, 2, 2],\n      [0, 2, 2], [0, 2, 2], [2, 1, 0], [1, 1, 0], [2, 2, 0], [0, 2, 2], [0, 0, 0],\n      [0, 0, 0], [2, 2, 2], [0, 2, 2], [2, 0, 2], [2, 2, 0],\n    ],\n  }),\n  defineOakPattern({\n    id: 'oak-aspirin',\n    name: 'Aspirin',\n    lineupName: 'Aspirin',\n    params: { candidate: 'O-2-central3tone', type: 'O', finderStarter: 'central-cube-3tone' },\n    // 2026-08-24 톤 반전 (운영자 실기기 판정 — «스캔 실패, 색상 반전 필요»):\n    // 원판은 밝음(2) 지배라 밝은 배경에서 대비가 죽었다. 0↔2 전면 반전, 1 유지.\n    // 이미 발행된 원판 프레임은 lab 후보라 판독 이름을 안 흔든다 (원판 발행 0).\n    cellLevels: [\n      [0, 0, 0], [0, 0, 0], [2, 0, 0], [0, 0, 2], [0, 2, 0], [2, 0, 0], [0, 0, 0],\n      [0, 0, 0], [2, 0, 0], [0, 1, 2], [0, 0, 0], [2, 0, 0], [0, 0, 0], [0, 2, 0],\n      [0, 0, 0], [0, 1, 0], [0, 2, 0], [0, 0, 0], [0, 2, 0],\n    ],\n  }),\n  defineOakPattern({\n    id: 'oak-benzene',\n    name: 'Benzene',\n    lineupName: 'Benzene',\n    params: { candidate: 'O-3-bullseye', type: 'O', finderStarter: 'cube-bullseye' },\n    cellLevels: [\n      [2, 2, 0], [0, 2, 2], [2, 2, 2], [2, 2, 2], [2, 0, 2], [2, 2, 0], [0, 2, 2],\n      [2, 2, 0], [2, 0, 2], [0, 2, 2], [2, 0, 2], [2, 2, 2], [0, 2, 2], [2, 2, 0],\n      [2, 2, 0], [0, 2, 2], [2, 0, 2], [2, 2, 2], [2, 0, 2],\n    ],\n  }),\n  // ── Wave 2 신규 후보 (2026-08-23 편입 — PM/022 W2 선행) ───────────────────\n  defineOakPattern({\n    id: 'oak-footprint',\n    // 정본: finder-footprint-2026-08-23.json (운영자 셀 편집기 신작). 표는\n    // finder-footprint.js 가 든다 — 여기서는 유도 import 만 한다.\n    name: FOOTPRINT_NAME,\n    lineupName: FOOTPRINT_NAME,\n    params: { candidate: 'O-footprint-fullsurface', type: 'O', finderStarter: 'cube-bullseye' },\n    cellLevels: FOOTPRINT_CELL_LEVELS.map((triple) => [...triple]),\n  }),\n]);\n\n/**\n * **렌더 전용** OAK 후보 — 카드·편집기·장면에는 있고 **기본 검출 라인업에는 없다**.\n *\n * 왜 갈랐나 (2026-08-23 실측): `OAK_FINDER_PATTERNS` 는 bootstrap.js 의\n * `CELL_FINDER_LINEUP` 이 스프레드로 유도한다 — 이 표에 넣는 것 = 검출 편입이다.\n * 그런데 taegeuk 단독의 19셀은 **모든 daehan 잘림본(k6/k8/k10)의 진부분집합이고\n * 톤까지 같다.** daehan 프레임의 중앙 19 위에서 이 템플릿은 정당하게 상관 1.0 이고,\n * `fit` 은 contrastRatio 가 섞여 작은 발자국이 더 높게 나오는 일까지 있어서\n * (finder-daehan.js §포함 사슬), 검출 라인업에 넣는 순간 **daehan 옵트인 왕복이\n * taegeuk-solo 오수용으로 죽는다** (test/finder-daehan.test.js ⑤·⑥·⑦ 실측 —\n * «k=6 오수용: oak-taegeuk-solo»). 검출은 원리적으로 daehan/taegeuk-solo 를 못\n * 가르고 RS/CRC 가설 열거가 갈라야 하므로, 그 배선은 오수용·margin 게이트 실측과\n * 함께 통합자 몫이다 (daehan 이 옵트인 상수로 갈라져 있는 것과 같은 전례).\n * 그날이 오면 이 목록에서 `OAK_FINDER_PATTERNS` 로 옮기는 것이 승격이다.\n */\nexport const OAK_RENDER_ONLY_FINDER_PATTERNS = Object.freeze([\n  defineOakPattern({\n    id: 'oak-taegeuk-solo',\n    // **표시명 = taegeuk** (운영자 확정). 분류 층 id `taegeuk`(finder-daehan.TAEGUK_ID)\n    // 와 같은 문자열이지만 다른 표다 — 그쪽은 daehan 합성의 «내부 19» 분류 라벨이고,\n    // 이쪽은 sagoae 예약셀 없이 19셀만 쓰는 **독립 렌더 후보**다\n    // (용량·와이어·formatIndex 변경 0 — daehanFinder 회계를 타지 않는다).\n    name: 'taegeuk',\n    lineupName: 'taegeuk-solo',\n    params: { candidate: 'O-taegeuk-solo', type: 'O', finderStarter: 'bullseye' },\n    cellLevels: taegeukSlotCellLevels(),\n  }),\n]);\n\n/** 렌더 표현이 있는 OAK 후보 전부 — 카드·편집기·분류 층의 유도 원천. */\nexport const OAK_ALL_FINDER_PATTERNS = Object.freeze([\n  ...OAK_FINDER_PATTERNS,\n  ...OAK_RENDER_ONLY_FINDER_PATTERNS,\n]);\n\nexport const OAK_FINDER_PATTERN_IDS = Object.freeze(\n  OAK_FINDER_PATTERNS.map((pattern) => pattern.id),\n);\n\n// 조회는 **렌더 표현 전부**를 커버한다 — scene.js·편집기·점수 패널이 이 조회로\n// 그린다. 검출 라인업은 이 Map 이 아니라 `OAK_FINDER_PATTERNS` 배열이 정한다.\nconst OAK_BY_ID = new Map(OAK_ALL_FINDER_PATTERNS.map((pattern) => [pattern.id, pattern]));\n\n/** OAK 후보(렌더 전용 포함)면 그 패턴, 아니면 undefined — 호출자가 기존 조회로 넘어갈 수 있게. */\nexport function getOakFinderPattern(id) {\n  return OAK_BY_ID.get(id);\n}\n\nexport function isOakFinderPatternId(id) {\n  return OAK_BY_ID.has(id);\n}\n\n/**\n * 명부 후보가 **실제로 그려지는가** — `status` 가 대답하지 못하는 물음.\n *\n * `status: 'active'` 는 「탈락하지 않았다」이지 「구현됐다」가 아니다. 그런데 margin 순으로\n * 정렬하면 1위가 H2O(0.6667)·3위가 H2CO3(0.4667)이고 **둘 다 그릴 수 없다** — 그 사실이\n * 명부 표 어디에도 안 적혀 있어서, 운영자가 생성기에서 고르고 «렌더링이 안 된다» 를 보고\n * 나서야 드러났다 (2026-08-20).\n *\n * 그래서 **손으로 적지 않고 유도한다.** 사본 목록은 반드시 원본과 어긋난다.\n *   · `oak-*` 패턴표에 있으면 → 이 모듈이 그린다\n *   · daehan → 전용 모듈(`finder-daehan.js`)이 그린다\n *   · 그 외 → **못 그린다**\n *\n * ⚠ H2O·H2CO3 가 못 그려지는 이유는 «기하» 가 아니다. 발자국은 `markerA.js` 에 이미\n *   있다(꼭짓점에서 (−1,+2) 2칸 안쪽 링 3개, 21셀). 못 그리는 것은 **톤**이다 —\n *   정본 톤이 21셀 중 9셀(H2CO3 는 30 중 18)이 **비-순열**이라 `digitToRanks` 경로가\n *   표현하지 못한다. 채택은 렌더러 계약 변경이고 운영자 결정 사항이다.\n */\nexport function oakRenderStatus(lineupName) {\n  const entry = OAK_LINEUP.find((row) => row.name === lineupName);\n  if (!entry) return null;\n  if (OAK_ALL_FINDER_PATTERNS.some((pattern) => pattern.lineupName === lineupName)) {\n    return 'oak-pattern-table';\n  }\n  if (entry.id === 'O-daehan') return 'daehan-module';\n  return 'not-renderable';\n}\n\n/** 명부 전체의 «그릴 수 있는가» 요약 — 진단·문서용. */\nexport function oakRenderSummary() {\n  return OAK_LINEUP.map((row) => Object.freeze({\n    name: row.name,\n    status: row.status,\n    margin: row.margin,\n    render: oakRenderStatus(row.name),\n  }));\n}\n\n// ── 로드 자기검증 ──────────────────────────────────────────────────────────\n// 표 주도 데이터는 조용히 썩는다 (turnA.js 전례). 모듈이 로드되는 것 자체가\n// 아래 명제들의 통과를 뜻하게 만든다 — 회귀 파일을 안 돌려도 앱이 먼저 죽는다.\n{\n  const ids = new Set();\n  for (const pattern of OAK_ALL_FINDER_PATTERNS) {\n    if (ids.has(pattern.id)) throw new Error('OAK 후보 id 중복: ' + pattern.id);\n    ids.add(pattern.id);\n  }\n\n  // ① 명부(finder-oak-lineup)와의 정합. 원래 «활성만 표현» 이었는데 C1(2026-08-23,\n  //    Benzene 드랍)에서 규약이 갈라졌다 — **생성은 닫고 판독은 유지**:\n  //    · dead   → 표현 금지 그대로 (Nitrogen 전례 — 죽은 후보는 렌더·검출 모두 없음).\n  //    · dropped → 표현 허용. 카드·상태 스키마는 명부 live-join(finder-card-ui)이\n  //      닫고, 패턴 표는 남아 **이미 발행된 프레임의 판독**과 검출 라인업 안정성을\n  //      지킨다 (bootstrap 라인업 축소는 기준선 재측정 게이트 사안 — PM/022 §3).\n  for (const pattern of OAK_ALL_FINDER_PATTERNS) {\n    const entry = OAK_LINEUP.find((row) => row.name === pattern.lineupName);\n    if (!entry) {\n      throw new Error(pattern.id + ': 명부에 없는 후보다 (lineupName=' + pattern.lineupName + ')');\n    }\n    if (entry.status === 'dead') {\n      throw new Error(pattern.id + ': 명부 지위가 dead 인데 표현이 있다');\n    }\n    if (entry.type !== 'O') {\n      throw new Error(pattern.id + ': 지금 표현 가능한 것은 타입 O 뿐이다 (' + entry.type + ')');\n    }\n  }\n\n  // ② 중간톤을 쓰는 후보가 **실제로 있다**. 이게 0 이 되면 cellLevels 를 도입한\n  //    근거 자체가 사라진 것이므로, 표현을 되돌릴지 다시 판단해야 한다.\n  const midFaces = OAK_ALL_FINDER_PATTERNS.map((pattern) => pattern.cellLevels\n    .reduce((sum, triple) => sum + triple.filter((level) => level === 1).length, 0));\n  if (midFaces.reduce((a, b) => a + b, 0) === 0) {\n    throw new Error('OAK 후보 어느 것도 중간톤을 안 쓴다 — cellLevels 의 존재 이유가 없다');\n  }\n\n  // ③ 어느 후보도 **한 톤으로 균일하지 않다**. 균일하면 검출기의 centeredExpected 가\n  //    norm2 = 0 으로 죽는다 (거기서 죽으면 원인이 여기라는 걸 못 읽는다).\n  for (const pattern of OAK_ALL_FINDER_PATTERNS) {\n    const seen = new Set(pattern.cellLevels.flat());\n    if (seen.size < 2) throw new Error(pattern.id + ': 면 톤이 균일하다 — 검출 불가');\n  }\n\n  // ④ 렌더 전용 후보는 **검출 표에 없다** — 이 분리가 무너지면 daehan 옵트인 왕복이\n  //    부분집합 오수용으로 죽는다 (OAK_RENDER_ONLY_FINDER_PATTERNS 헤더의 실측).\n  //    승격은 이동이지 복사가 아니다: 두 표에 같이 있으면 여기서 죽는다.\n  const detectable = new Set(OAK_FINDER_PATTERNS.map((pattern) => pattern.id));\n  for (const pattern of OAK_RENDER_ONLY_FINDER_PATTERNS) {\n    if (detectable.has(pattern.id)) {\n      throw new Error(pattern.id + ': 렌더 전용 후보가 검출 표에도 있다 — 승격은 이동이다');\n    }\n  }\n}\n"],
  ["capacityDaehan", "/**\n * capacityDaehan.js — daehan 파인더 변형(V1D/V2D/V3D)의 용량 회계.\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 왜 `capacity.js` 의 `VERSIONS` 배열이 아니라 별도 모듈인가 (전례 둘)\n * ─────────────────────────────────────────────────────────────────────────\n * `capacity.js` 의 `VERSIONS` 는 **단순한 표가 아니다.** 그 배열은 동시에\n *   ① 인코더의 자동 버전 선택 목록 (`encode.chooseVersion` 이 순서대로 훑어\n *      «들어가는 첫 항목» 을 고른다), 그리고\n *   ② 디코더의 가설 목록 (`decode.js` 의 `VERSIONS.find(v => v.version === …)` ·\n *      `bootstrap.js` 의 familyProfiles)\n * 이다. daehan 은 version(1/2/3)과 k(6/8/10)가 기존과 **완전히 겹치므로**, 같은\n * 배열에 넣으면 `find` 가 조용히 엉뚱한 spec 을 집는다 — 던지지 않고 틀린 회계로\n * 복호한다. 이건 «표를 늘리는 일» 이 아니라 «두 코드를 한 이름으로 부르는 일» 이다.\n *\n * 그래서 코드베이스가 이미 두 번 쓴 전례를 그대로 따른다:\n *   · `src/capacityY.js` — `NSYM_TABLE_Y2W` + `capacityForY2Window` (Y2W 변형)\n *   · `src/markerO.js`   — `NSYM_TABLE_OCM` + `VERSIONS_OCM` + `capacityForOMarker` (O-CM 변형)\n * 즉 **별도 spec 배열 + 별도 NSYM 표 + 얇은 진입 함수**.\n *\n * ─ 왜 `markerO.js` 처럼 레이아웃 모듈 안이 아니라 새 파일인가 ────────────────\n * O-CM 은 마커 **기하**(tetrad 좌표·digit·회전 margin)와 회계가 한 몸이라\n * `markerO.js` 한 파일이 자연스럽다. daehan 은 다르다 — 기하(79셀 좌표·톤)는\n * `finder-daehan.js` 가 이미 정본 대조 대상으로 들고 있고, 그 파일은 **렌더러와\n * 검출기도 import 한다**. 거기에 RS·헤더·용량 회계를 얹으면 렌더 경로가 rs211 을\n * 끌고 오게 된다. 표현(무엇인가)과 회계(얼마나 담는가)를 갈라 둔다.\n *\n * ─ 왜 `capacityFor` 를 **재사용**하는가 ────────────────────────────────────\n * 회계가 본표와 완전히 동형이다 (총셀 → 오버헤드 뺌 → ⌊C/3⌋ → nsym → K → 페이로드).\n * `markerO.js` 는 이 본문을 통째로 베꼈고, 그 사본은 이미 원본과 조금 갈렸다\n * (`spec.name` 라벨). 세 번째 사본 대신 `capacity.capacityFor` 에 **표만 주입**한다\n * (기본값이 본표라 레거시 산출은 비트 동일 — `test/capacity-daehan.test.js` 가 대조).\n *\n * ─────────────────────────────────────────────────────────────────────────\n * 와이어 (formatIndex) — 신설하지 않는다 (2026-08-18 이 라운드 결정)\n * ─────────────────────────────────────────────────────────────────────────\n * daehan 은 **formatIndex 를 새로 만들지 않는다.** V1/V2/V3 인덱스를 그대로 쓰고,\n * daehan 유/무는 **광학 검출 + 사후 RS/CRC** 로 가른다 — `markerO.js` §4 및\n * `capacityY.js` 의 Y2W 가 이미 쓰는 계약과 같다. 디코더가 파인더를 검출하는 순간\n * patternId 가 daehan 계열인지를 알고(`isDaehanFinderPatternId`), 그것이 «어느 NSYM\n * 표를 볼 것인가» 를 가른다. **k 는 파인더가 말해 주지 않는다** — 잘림이 포함\n * 사슬이라 k6 템플릿이 k=8 프레임을 정당하게 맞춘다. k 는 기존대로 전 후보를\n * 열거해 RS/CRC 가 고른다.\n *\n * ⚠ 이 계약의 안전성은 **「daehan 프레임을 일반 V1/V2/V3 으로 잘못 읽으면 RS/CRC 가\n *   반드시 거절하는가」** 에 달려 있다. **실측 (2026-08-18,\n *   `test/output/lanes/claude-di-misread.mjs`): 거절 못 한 조합 0 건.**\n *   ① 셀 층 27조합 (k·ECC × 읽는 ECC) 전부 RS 거절 — 파인더 예약 셀이 데이터인 척\n *      섞인 열은 셀 수가 맞아 «길이로 거절» 이 안 통하는데도 전부 걸린다.\n *   ② 프레임 층 9조합 — 배포 기본 라인업(daehan 없음)은 daehan 프레임을 전부\n *      `frontend:no-format-candidate` 로 거절한다.\n *   ③ 역방향 9조합 — 레거시 프레임을 daehan 회계로 읽어도 전부 RS 거절.\n *   새 조합에서 거절 실패가 나오면 그때는 전용 formatIndex(ⓐ)가 필요하고,\n *   VERSION_BITS 4 의 빈 슬롯(3 · 7 · 8\\~15)에서 배정한다 — 이 라운드 범위 밖이다.\n *\n * 런타임 의존성 0 · 순수 ESM.\n */\n\nimport { NSYM_TABLE_DAEHAN } from './rs211.js';\nimport { capacityFor } from './capacity.js';\nimport { overheadBreakdown } from './placement.js';\nimport { DAEHAN_RADII, daehanReservedCells } from './finder-daehan.js';\n\nconst NSYM_SOURCE = Object.freeze({\n  table: NSYM_TABLE_DAEHAN,\n  tableName: 'NSYM_TABLE_DAEHAN',\n});\n\n/**\n * daehan 버전 정의. `overhead` 는 `placement.overheadBreakdown(k, 예약셀수)` 실계산이다\n * — 상수를 손으로 적지 않는다 (본표 `VERSIONS` 와 같은 규약).\n *\n * `version` 은 기존과 같은 1/2/3 이다 (와이어 formatIndex 를 공유하므로). 구별은\n * `name`(V1D…)과 이 배열의 정체성으로 한다 — 그래서 이 배열을 `VERSIONS` 와 절대\n * 합치면 안 된다 (모듈 헤더 참조). 2026-08-21: 예약 셀의 분류 이름은 sagoae.\n * taegeuk(내부 19)은 이미 불스아이 오버헤드에 들어 있어 두 번 세지 않는다.\n *\n * @type {ReadonlyArray<{name:string, version:number, k:number, overhead:number, symbolKey:string}>}\n */\nexport const VERSIONS_DAEHAN = Object.freeze(DAEHAN_RADII.map((k, index) => Object.freeze({\n  name: 'V' + (index + 1) + 'D',\n  version: index + 1,\n  k,\n  overhead: overheadBreakdown(k, daehanReservedCells(k).length).total,\n  symbolKey: 'V' + (index + 1) + 'D',\n})));\n\n/** patternId 나 k 로 daehan spec 을 찾는다. 없으면 undefined. */\nexport function daehanSpecForK(k) {\n  return VERSIONS_DAEHAN.find((spec) => spec.k === k);\n}\n\n/**\n * daehan 한 버전의 용량. 본표 회계를 그대로 승계하고 nsym 표만 갈아 끼운다 —\n * 표와 실계산이 어긋나면 조용히 맞추지 않고 던진다.\n * @param {{name:string, version:number, k:number, overhead:number, symbolKey:string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForDaehan(spec, level = 'M') {\n  const base = capacityFor(spec, level, NSYM_SOURCE);\n  return { name: spec.name, daehanFinder: true, ...base };\n}\n\n/** 전 버전 daehan 용량표. */\nexport function capacityTableDaehan(level = 'M') {\n  return VERSIONS_DAEHAN.map((spec) => capacityForDaehan(spec, level));\n}\n\n// ── 로드 자기검증 ──────────────────────────────────────────────────────────\n// 회계는 셋(파인더 좌표 · 배치 · nsym 표)이 동시에 맞아야 성립한다. 하나가 움직이면\n// 여기서 즉시 죽게 만든다 — 표는 조용히 썩는다.\n{\n  const EXPECT = {\n    V1D: { k: 6, overhead: 65, dataCells: 62, symbols: 20, payload: { L: 15, M: 11, H: 7 } },\n    V2D: { k: 8, overhead: 89, dataCells: 128, symbols: 42, payload: { L: 32, M: 26, H: 18 } },\n    V3D: { k: 10, overhead: 113, dataCells: 218, symbols: 72, payload: { L: 57, M: 46, H: 32 } },\n  };\n  for (const spec of VERSIONS_DAEHAN) {\n    const want = EXPECT[spec.name];\n    if (!want) throw new Error('capacityDaehan: 기대표에 없는 키 ' + spec.name);\n    if (spec.k !== want.k || spec.overhead !== want.overhead) {\n      throw new Error(spec.name + ': k/오버헤드가 확정값과 다르다 — k=' + spec.k\n        + ' overhead=' + spec.overhead + ' (기대 k=' + want.k + ' overhead=' + want.overhead + ')');\n    }\n    for (const level of ['L', 'M', 'H']) {\n      const cap = capacityForDaehan(spec, level);\n      if (cap.dataCells !== want.dataCells || cap.usedSymbols !== want.symbols) {\n        throw new Error(spec.name + '/' + level + ': 데이터 셀·심볼이 확정값과 다르다 — '\n          + cap.dataCells + '/' + cap.usedSymbols);\n      }\n      if (cap.maxPayloadBytes !== want.payload[level]) {\n        throw new Error(spec.name + '/' + level + ': 순 페이로드 ' + cap.maxPayloadBytes\n          + ' B 가 확정값 ' + want.payload[level] + ' B 와 다르다');\n      }\n    }\n  }\n}\n"],
  ["placementY", "// placementY.js — Type Y 레퍼런스 조 · 포맷 정보 15셀 · 역할 배치 (SPEC §14, ADR 0003 U8·U9)\n//\n// Type Y 는 인덱스 공간이다 — 셀은 3면 공통 좌표 (i,j), 0..n-1 정수 좌표일 뿐 기하가\n// 필요 없다(hexgrid.js/ygrid 미참조). 이 모듈은 \"n×n 격자 어디에 레퍼런스·포맷 정보가\n// 사는가\"만 다룬다. scan order(U7)는 layoutY.js, 용량 회계(생성물 표)는 capacityY.js\n// 소관.\n//\n// 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date 금지).\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레퍼런스 4조 (U9) — SPEC §14 \"라틴 스퀘어 3셀 1조, 공간 분산 ≥ 3조\"\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 조 앵커(순서 고정): A = (2,2), (n-3,2), (2,n-3), (n-3,n-3). 네 앵커는 격자의 네\n// 모서리 근방(가장자리에서 inset 2)에 하나씩 놓여 \"공간 분산(비일직선) ≥ 3조\" 요건을\n// 코너 대각 배치로 만족한다.\n//\n// 조 내 3셀: L자형 [(p,q), (p+1,q), (p,q+1)] — 앵커 (p,q) 에서 i 방향으로 한 칸,\n// j 방향으로 한 칸. 이 3셀에 digit 을 그 순서대로 배정한다 — **어떤 digit 인지는\n// 톤 모드(tones)에 따라 갈린다** (ADR 0003 v3.1 §4b D9, 전환 비용 항목):\n//\n//   tones=2(2톤 메인) → REFERENCE_GROUP_DIGITS_2T = [0,1,2] : 조 내 3셀이 매 면마다\n//     밝음 1·어두움 2 를 갖는다(양 앵커 확보 — U14 θ_f 추정이 밝은/어두운 앵커 둘\n//     다 필요). 4조 구조는 3톤과 동일 — 공간 분산이 오염 방어선(§4b 근거 수치).\n//   tones=3(Y-T 옵션) → REFERENCE_GROUP_DIGITS_3T = [0,4,3] (구 REFERENCE_GROUP_DIGITS,\n//     ADR 0003 D3): 이 순위행이 세 면 모두에 레벨 {0,1,2} 전부를 준다.\n//\n// 조 좌표·L자형 셀 구조 자체는 톤 모드 무관 불변 — 바뀌는 것은 digit 배정뿐이다.\n\n/** 레퍼런스 조 내 3셀에 배정하는 digit(tones=2, 2톤 메인), L자형 셀 순서대로. */\nexport const REFERENCE_GROUP_DIGITS_2T = Object.freeze([0, 1, 2]);\n\n/** 레퍼런스 조 내 3셀에 배정하는 digit(tones=3, Y-T 옵션), L자형 셀 순서대로. */\nexport const REFERENCE_GROUP_DIGITS_3T = Object.freeze([0, 4, 3]);\n\nfunction referenceDigitsFor(tones) {\n  if (tones === 2) return REFERENCE_GROUP_DIGITS_2T;\n  if (tones === 3) return REFERENCE_GROUP_DIGITS_3T;\n  throw new RangeError(`지원하지 않는 tones: ${tones} (허용 2 또는 3)`);\n}\n\nfunction key(i, j) {\n  return `${i},${j}`;\n}\n\nfunction assertSize(n) {\n  // 하한 11: n=9·10 에서는 포맷 복제 2 가 레퍼런스 조와 실제로 충돌한다 (검증 라운드\n  // 전수 검산 — n=9 의 (2,7)·n=10 의 (2,8)). 그 범위를 허용하면 \"충돌 시 throw\" 계약이\n  // roleOf 우선순위에 은폐된다. n=11..20 은 무충돌이나 규범 버전은 21·25 뿐이다.\n  if (!Number.isInteger(n) || n < 11) {\n    throw new RangeError(`n 은 11 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n/** 레퍼런스 조 앵커 4개, 조 순서 고정: (2,2) · (n-3,2) · (2,n-3) · (n-3,n-3). */\nexport function referenceAnchors(n) {\n  assertSize(n);\n  return [\n    { p: 2, q: 2 },\n    { p: n - 3, q: 2 },\n    { p: 2, q: n - 3 },\n    { p: n - 3, q: n - 3 },\n  ];\n}\n\n/**\n * 레퍼런스 4조. 각 조 = {cells: [{i,j}×3], digits}. cells 순서 = [(p,q), (p+1,q),\n * (p,q+1)], digits[k] 가 cells[k] 에 대응. digits 는 tones 모드별\n * (REFERENCE_GROUP_DIGITS_2T | _3T) — 조 좌표·셀 구조는 tones 무관 불변.\n * @param {number} n\n * @param {2|3} [tones] 기본 2(2톤 메인, ADR 0003 v3.1 §4b).\n * @returns {{cells:{i:number,j:number}[], digits: number[]}[]} 길이 4\n */\nexport function referenceGroups(n, tones = 2) {\n  assertSize(n);\n  const digits = referenceDigitsFor(tones);\n  return referenceAnchors(n).map(({ p, q }) => ({\n    cells: [\n      { i: p, j: q },\n      { i: p + 1, j: q },\n      { i: p, j: q + 1 },\n    ],\n    digits,\n  }));\n}\n\n/**\n * 레퍼런스 12셀 전부(조 순 · 조 내 순 평탄화), 각 셀에 digit 을 얹은 목록.\n * @param {number} n\n * @param {2|3} [tones] 기본 2(2톤 메인) — referenceGroups 로 그대로 전달.\n * @returns {{i:number, j:number, digit:number}[]} 길이 12\n */\nexport function referenceCellsAll(n, tones = 2) {\n  const out = [];\n  for (const group of referenceGroups(n, tones)) {\n    group.cells.forEach((cell, idx) => {\n      out.push({ ...cell, digit: group.digits[idx] });\n    });\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 정보 15셀 (U8) — 3복제 × 5셀\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// §5.4 구조(12bit·CRC-6·5digit·3복제)를 승계한다. Type Y 는 링 구조가 없으므로\n// (인덱스 격자에는 \"링\"이라는 자연스러운 순회가 없다), 결정 규칙을 좌표 직접 서술로\n// 고정한다 — 전 셀 가장자리 inset ≥ 1(0 또는 n-1 좌표를 쓰지 않는다):\n//\n//   복제 0 = (2,1)..(6,1)         — i = 2..6 오름차순, j = 1 고정\n//   복제 1 = (1,2)..(1,6)         — i = 1 고정, j = 2..6 오름차순\n//   복제 2 = (n-8,n-2)..(n-4,n-2) — i = n-8..n-4 오름차순, j = n-2 고정\n//\n// 레퍼런스 4조(위)와 좌표가 절대 겹치지 않아야 하는 와이어 계약이다 — 겹치면\n// 조용히 시프트하지 않고 **모듈 로드 시점에 throw** 한다(아래 자기검증 블록).\n\nexport const FORMAT_BLOCK_LENGTH = 5;\nexport const FORMAT_REPLICAS = 3;\n\n/** 포맷 정보 15셀 (복제 3개 × 5셀), 복제 순 · 복제 내 오름차순으로 이어붙인 목록. */\nexport function formatCells(n) {\n  assertSize(n);\n  const cells = [];\n  for (let i = 2; i <= 6; i += 1) cells.push({ i, j: 1 });\n  for (let j = 2; j <= 6; j += 1) cells.push({ i: 1, j });\n  for (let i = n - 8; i <= n - 4; i += 1) cells.push({ i, j: n - 2 });\n  return cells;\n}\n\nfunction assertFormatInset(n) {\n  for (const { i, j } of formatCells(n)) {\n    if (i < 1 || i > n - 2 || j < 1 || j > n - 2) {\n      throw new RangeError(\n        `n=${n}: 포맷 셀 (${i},${j}) 이 가장자리 inset ≥ 1 을 위반한다`,\n      );\n    }\n  }\n}\n\nfunction assertNoReferenceFormatCollision(n) {\n  const refSet = new Set(referenceCellsAll(n).map((c) => key(c.i, c.j)));\n  for (const { i, j } of formatCells(n)) {\n    if (refSet.has(key(i, j))) {\n      throw new RangeError(\n        `n=${n}: 포맷 셀 (${i},${j}) 이 레퍼런스 셀과 충돌한다 — 결정 규칙을 다시 확정해야 한다`,\n      );\n    }\n  }\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경(격자 크기) n 전체의 역할 분류표를 한 번에 만든다 (layout.js `buildRoleSets`\n * 대칭 구조 — roleOf 를 셀마다 재계산하지 않도록 Set 을 미리 구성한다).\n * @param {number} n\n * @returns {{reference: Set<string>, format: Set<string>}}\n */\nexport function buildRoleSets(n) {\n  assertSize(n);\n  const reference = new Set(referenceCellsAll(n).map((c) => key(c.i, c.j)));\n  const format = new Set(formatCells(n).map((c) => key(c.i, c.j)));\n  return { reference, format };\n}\n\n/**\n * 셀 (i,j) 의 역할. Type O 와 달리 불스아이·앵커가 없다 — reference | format | data 뿐.\n * @param {number} i\n * @param {number} j\n * @param {number} n\n * @param {{reference:Set<string>, format:Set<string>}} [roleSets]\n * @returns {'reference'|'format'|'data'}\n */\nexport function roleOf(i, j, n, roleSets) {\n  const sets = roleSets || buildRoleSets(n);\n  const kk = key(i, j);\n  if (sets.reference.has(kk)) return 'reference';\n  if (sets.format.has(kk)) return 'format';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 — n=21(Y1)·25(Y2) 무충돌·inset 전수 확인\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// \"충돌 시 조용히 시프트\" 금지(과제 지침) — 결정 규칙이 깨지면 import 시점에 즉시\n// 알아챈다. VERSIONS_Y(capacityY.js)와 별개로 이 모듈 자체가 자기 계약을 지킨다.\n\nfor (const n of [21, 25]) {\n  assertFormatInset(n);\n  assertNoReferenceFormatCollision(n);\n}\n"],
  ["autoplaceY", "/**\n * autoplaceY.js — 셀 표면 경로의 format · reference 좌표를 파인더 점유에서 유도.\n *\n * 입력은 n 과 파인더가 점유한 셀 집합(toneOverrides 가 닿는 (i,j) 전체)이다.\n * 출력은 format **3복제 × formatBlockLength 셀** (v1=15 · v2=18) · reference 12셀\n * (4조×L자 3셀). 같은 입력은 바이트 동일 출력을 낸다 — 집합 순회 순서·부동소수·\n * 동률 자유도가 없다.\n *\n * **포맷 세대 (2026-08-16 마스크 선택 개정)**: 포맷 v2 는 6번째 digit 을 더해\n * 복제당 6셀 = **18셀**이 된다(`formatinfo.js` FORMAT_CELLS_V2). 어느 세대를 쓰는지는\n * 레이아웃이 정하므로 `placeReservedCells(n, occupied, { formatBlockLength })` 로 받는다 —\n * 기본값은 5(v1)라 **호출부를 안 고친 경로는 바이트 동일**하다. 신세대 셀 표면\n * (cellSurfaceFinal.js: v0 · v0x · v1r2 · v2r2)만 6 을 넘긴다. 초안·소각 와이어\n * (cellSurfaceLayouts.js: v1r2d · v2)와 레거시 Y 는 5 그대로다.\n * 디코더는 **두 세대를 다 유도한다** — v2 프레임과 개정 전 v1 프레임을 같은 함수로\n * 읽기 위해서다(레거시 판독 공존, cellSurfaceFinal.js CELL_SURFACE_FINAL_FORMAT_WIRES).\n *\n * ⚠ **반환 형태 변경 (같은 개정)**: 동결 반환 객체에 `formatBlockLength` 키가 **생겼다**.\n * v1 기본 호출의 `formatCells` · `referenceCells` · `metrics` 값은 개정 전과 바이트\n * 동일하지만 **객체 자체는 키가 하나 더 많다** — 반환값을 통째로 deep-equal 하는\n * 소비자가 있으면 거기서 깨진다(적대 검증 F5). 값 동일 ≠ 형태 동일.\n *\n * 셀 표면 경로 전용. 일반 Y·Y0·Y2 비 셀표면은 placementY.js 가 그대로 담당한다.\n *\n * 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date 금지).\n */\n\nimport {\n  FORMAT_BLOCK_LENGTH,\n  FORMAT_REPLICAS,\n  formatCells as legacyFormatCells,\n  referenceAnchors,\n} from './placementY.js';\nimport { DIGIT_COUNT_V2 } from './formatinfo.js';\n\n/** 포맷 v1 복제 길이 (5). 옵션을 안 주면 이것이 기본 — 기존 경로 불변. */\nexport const FORMAT_BLOCK_LENGTH_V1 = FORMAT_BLOCK_LENGTH;\n\n/** 포맷 v2 복제 길이 (6). 신세대 셀 표면 전용. */\nexport const FORMAT_BLOCK_LENGTH_V2 = DIGIT_COUNT_V2;\n\nexport const AUTOPLACE_MIN_N = 11;\nexport const REFERENCE_GROUP_COUNT = 4;\nexport const L_SHAPE_OFFSETS = Object.freeze([\n  Object.freeze({ di: 0, dj: 0 }),\n  Object.freeze({ di: 1, dj: 0 }),\n  Object.freeze({ di: 0, dj: 1 }),\n]);\n\nexport const AUTOPLACE_REF_QUADRANT = 'AUTOPLACE_REF_QUADRANT';\nexport const AUTOPLACE_REF_DISPERSION = 'AUTOPLACE_REF_DISPERSION';\nexport const AUTOPLACE_REF_COLLINEAR = 'AUTOPLACE_REF_COLLINEAR';\nexport const AUTOPLACE_FORMAT_SLOT = 'AUTOPLACE_FORMAT_SLOT';\nexport const AUTOPLACE_FORMAT_SEPARATION = 'AUTOPLACE_FORMAT_SEPARATION';\nexport const AUTOPLACE_COLLISION = 'AUTOPLACE_COLLISION';\n\nconst QUADRANT_IDS = Object.freeze(['NW', 'NE', 'SW', 'SE']);\n\nexport class AutoplaceError extends Error {\n  constructor(code, message, detail) {\n    super(message);\n    this.name = 'AutoplaceError';\n    this.code = code;\n    this.detail = detail || null;\n  }\n}\n\nfunction assertN(n) {\n  if (!Number.isInteger(n) || n < AUTOPLACE_MIN_N) {\n    throw new RangeError('n 은 ' + AUTOPLACE_MIN_N + ' 이상의 정수여야 한다: ' + n);\n  }\n  return n;\n}\n\nfunction cellKey(i, j) {\n  return i + ',' + j;\n}\n\nfunction parseCell(value) {\n  if (value == null) return null;\n  if (typeof value === 'string') {\n    const parts = value.split(',');\n    if (parts.length !== 2) return null;\n    return { i: Number(parts[0]), j: Number(parts[1]) };\n  }\n  if (Array.isArray(value) && value.length >= 2) {\n    return { i: value[0], j: value[1] };\n  }\n  if (Number.isInteger(value.i) && Number.isInteger(value.j)) {\n    return { i: value.i, j: value.j };\n  }\n  return null;\n}\n\nfunction compareCell(a, b) {\n  return a.i - b.i || a.j - b.j;\n}\n\nfunction dist2(a, b) {\n  const di = a.i - b.i;\n  const dj = a.j - b.j;\n  return di * di + dj * dj;\n}\n\nfunction chebyshev(a, b) {\n  const di = a.i < b.i ? b.i - a.i : a.i - b.i;\n  const dj = a.j < b.j ? b.j - a.j : a.j - b.j;\n  return di > dj ? di : dj;\n}\n\nfunction midIndex(n) {\n  return n >> 1;\n}\n\nfunction quadrantOf(n, i, j) {\n  const mid = midIndex(n);\n  return (i >= mid ? 1 : 0) + (j >= mid ? 2 : 0);\n}\n\nfunction inBounds(n, i, j) {\n  return i >= 0 && j >= 0 && i < n && j < n;\n}\n\nfunction lShapeCells(p, q) {\n  return L_SHAPE_OFFSETS.map((off) => ({ i: p + off.di, j: q + off.dj }));\n}\n\nfunction lFits(n, p, q, inset) {\n  const cells = lShapeCells(p, q);\n  for (const cell of cells) {\n    if (!inBounds(n, cell.i, cell.j)) return false;\n    if (cell.i < inset || cell.j < inset) return false;\n    if (cell.i > n - 1 - inset || cell.j > n - 1 - inset) return false;\n  }\n  return true;\n}\n\nfunction runCells(orient, startI, startJ, length) {\n  const cells = [];\n  for (let k = 0; k < length; k += 1) {\n    cells.push(orient === 'h'\n      ? { i: startI + k, j: startJ }\n      : { i: startI, j: startJ + k });\n  }\n  return cells;\n}\n\nfunction runFits(n, orient, startI, startJ, length, inset) {\n  const lastI = orient === 'h' ? startI + length - 1 : startI;\n  const lastJ = orient === 'v' ? startJ + length - 1 : startJ;\n  if (startI < inset || startJ < inset) return false;\n  if (lastI > n - 1 - inset || lastJ > n - 1 - inset) return false;\n  if (startI < 0 || startJ < 0 || lastI >= n || lastJ >= n) return false;\n  return true;\n}\n\nfunction cellsBlocked(cells, blocked) {\n  for (const cell of cells) {\n    if (blocked.has(cellKey(cell.i, cell.j))) return true;\n  }\n  return false;\n}\n\nfunction addCells(blocked, cells) {\n  for (const cell of cells) blocked.add(cellKey(cell.i, cell.j));\n}\n\n/**\n * 레퍼런스 4조 최소 분산: 인접 코너 간격 (n−5) 의 절반을 제곱.\n * n=21 → 64 (거리 ≥ 8), n=13 → 16, n=25 → 100, n=11 → 9.\n */\nexport function minReferenceDispersion(n) {\n  const half = (assertN(n) - 5) >> 1;\n  return half * half;\n}\n\n/**\n * 포맷 3복제 이격: 가장 먼 쌍의 중심 거리² 하한 (n−4)².\n * 레거시 배치에서 복제 0·1 은 가깝고 복제 2 가 멀리 있는 구조를 수치화한다.\n */\nexport function minFormatSeparation(n) {\n  const span = assertN(n) - 4;\n  return span * span;\n}\n\nexport function idealReferenceAnchors(n) {\n  return referenceAnchors(assertN(n)).map((anchor) => ({ i: anchor.p, j: anchor.q }));\n}\n\nexport function idealFormatSlots(n) {\n  assertN(n);\n  const legacy = legacyFormatCells(n);\n  return Object.freeze([\n    Object.freeze({\n      id: 0,\n      orient: 'h',\n      start: Object.freeze({ i: legacy[0].i, j: legacy[0].j }),\n    }),\n    Object.freeze({\n      id n}\n\n/**\n * n 과 파인더 점유 셀에서 format(3복제 × blockLength) · reference 12 를 유도한다.\n * @param {number} n\n * @param {Iterable} occupied\n * @param {{formatBlockLength?:number}} [options] 생략 시 v1(5) — 기존 경로 불변.\n * @returns {{\n *   n:number,\n *   formatBlockLength:number,\n *   formatCells:{i:number,j:number}[],\n *   referenceCells:{i:number,j:number}[],\n *   referenceGroups:{anchor:{i:number,j:number}, cells:{i:number,j:number}[]}[],\n *   metrics:{dRef:number, dRefMin:number, sFmtMax:number, sFmtMin:number, sFmtMinRequired:number, occupied:number}\n * }}\n */\nexport function placeReservedCells(n, occupied, options = {}) {\n  const size = assertN(n);\n  const blockLength = assertFormatBlockLength(\n    options.formatBlockLength === undefined ? FORMAT_BLOCK_LENGTH_V1 : options.formatBlockLength,\n  );\n  const normalized = normalizeOccupied(size, occupied);\n  const blocked = new Set(normalized.keys);\n\n  const refs = placeReferenceGroups(size, blocked);\n  const fmts = placeFormatReplicas(size, blocked, blockLength);\n\n  const formatCells = [];\n  for (const replica of fmts.replicas) {\n    for (const cell of replica.cells) formatCells.push(cell);\n  }\n  const referenceCells = [];\n  for (const group of refs.groups) {\n    for (const cell of group.cells) referenceCells.push(cell);\n  }\n\n  if (formatCells.length !== FORMAT_REPLICAS * blockLength) {\n    throw new AutoplaceError(\n      AUTOPLACE_COLLISION,\n      'format 셀 수가 ' + (FORMAT_REPLICAS * blockLength) + ' 가 아니다: ' + formatCells.length,\n    );\n  }\n  if (referenceCells.length !== REFERENCE_GROUP_COUNT * 3) {\n    throw new AutoplaceError(\n      AUTOPLACE_COLLISION,\n      'reference 셀 수가 12 가 아니다: ' + referenceCells.length,\n    );\n  }\n\n  const seen = new Set();\n  for (const cell of [...formatCells, ...referenceCells]) {\n    const key = cellKey(cell.i, cell.j);\n    if (seen.has(key)) {\n      throw new AutoplaceError(AUTOPLACE_COLLISION, '배치 내부 중복: ' + key);\n    }\n    if (normalized.keys.has(   ["autoplaceHex", "/**\n * autoplaceHex.js — 육각(Type O/A 육각부) 경로의 format · reference 좌표를\n * «검출기가 점유한 셀» 에서 유도한다. `autoplaceY.js` 의 계약을 축 좌표 링 산술로\n * 옮긴 것이며, 세 성질을 그대로 지킨다:\n *\n *   ① **결정적** — 같은 (k, occupied) 는 바이트 동일 출력. 집합 순회 순서·부동소수·\n *      동률 자유도가 없다. 모든 탐색이 **이상 인덱스에서 시작하는 정방향(+1) 선형\n *      스캔**이고 «처음 만난 빈 칸» 이 곧 답이므로, 애초에 동률이 생기지 않는다.\n *   ② **탐색 규칙 = 레거시 규칙** — 자리를 «순환 거리 최소» 로 고르지 **않는다**.\n *      `placement.referenceCells`(그리고 포맷 블록)가 쓰는 규칙이 정방향 선형 스캔\n *      이고, 레거시 좌표를 그대로 재현하는 유일한 규칙이 그것이기 때문이다.\n *      (처음엔 `autoplaceY` 처럼 순환 거리 최소로 짰다가 링 3 에서 레거시와 다른\n *      셀을 골랐고, 모듈 로드 자기검증이 그것을 잡아 정정했다. 이 파일의\n *      `cyclicDistance` 는 **선택이 아니라 검사**에만 쓰인다 — 배치된 레퍼런스 2셀의\n *      각분리를 «재는» 자다.)\n *      하한(포맷 3복제 이격 · 링당 레퍼런스 2셀 각분리)은 레거시 배치 실계산에서\n *      유도한다. 상수를 손으로 적지 않는다.\n *   ③ **AutoplaceError** — 자리를 못 찾거나 하한을 못 지키면 조용히 타협하지 않고\n *      코드가 붙은 오류를 던진다. 오류 클래스는 `autoplaceY.js` 의 것을 그대로\n *      재사용한다(소비자가 한 종류만 catch 하면 되게).\n *\n * 왜 필요한가: 코너 마커(markerO.js)는 링 k·k−1 의 코너 주변 셀을 예약한다. 레거시\n * `referenceCells(k, r)` 는 링 인덱스 0 / 3r 에서 «앵커·포맷만» 점유로 보고 선형\n * 탐색하므로, 마커가 그 자리를 먹으면 좌표가 겹친다 (실측: 모든 k 에서 링 k 와\n * 링 k−1 레퍼런스 각 1셀이 코너 tetrad 와 충돌한다). 이 모듈이 그 재배치를 맡는다.\n *\n * **레거시 무영향**: `occupied` 가 마커 없이(=불스아이+앵커만) 들어오면 산출은\n * `placement.js` 의 `formatCells(k)` · `referenceCellsAll(k)` 와 **좌표까지 동일**하다\n * (autoplaceHex.test.js 가 k=6·8·10 전수로 고정한다). 즉 이 모듈은 레거시의\n * 일반화이지 대체가 아니다.\n *\n * 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date 금지).\n */\n\nimport { hexDistance } from './hexgrid.js';\nimport {\n  FORMAT_RING,\n  FORMAT_BLOCK_LENGTH,\n  FORMAT_REPLICAS,\n  ringWalk,\n  formatBlockStarts,\n  formatCells as legacyFormatCells,\n  referenceCellsAll as legacyReferenceCellsAll,\n  anchorPositionSet,\n} from './placement.js';\nimport { AutoplaceError } from './autoplaceY.js';\n\nexport const AUTOPLACE_HEX_FORMAT_SLOT = 'AUTOPLACE_HEX_FORMAT_SLOT';\nexport const AUTOPLACE_HEX_FORMAT_SEPARATION = 'AUTOPLACE_HEX_FORMAT_SEPARATION';\nexport const AUTOPLACE_HEX_REF_RING = 'AUTOPLACE_HEX_REF_RING';\nexport const AUTOPLACE_HEX_REF_SEPARATION = 'AUTOPLACE_HEX_REF_SEPARATION';\nexport const AUTOPLACE_HEX_COLLISION = 'AUTOPLACE_HEX_COLLISION';\n\nexport { AutoplaceError };\n\nconst MIN_K = FORMAT_RING + 1;\n\nfunction key(q, r) {\n  return q + ',' + r;\n}\n\nfunction assertK(k) {\n  if (!Number.isInteger(k) || k < MIN_K) {\n    throw new RangeError('k 는 ' + MIN_K + ' 이상의 정수여야 한다: ' + k);\n  }\n  return k;\n}\n\nfunction parseCell(value) {\n  if (value == null) return null;\n  if (typeof value === 'string') {\n    const parts = value.split(',');\n    if (parts.length !== 2) return null;\n    return { q: Number(parts[0]), r: Number(parts[1]) };\n  }\n  if (Array.isArray(value) && value.length >= 2) return { q: value[0], r: value[1] };\n  if (Number.isInteger(value.q) && Number.isInteger(value.r)) return { q: value.q, r: value.r };\n  return null;\n}\n\n/**\n * 점유 입력을 정렬된 고유 (q,r) 목록 + Set 으로 정규화한다. 호출자가 넘긴 순서는\n * 버린다 — 결정성의 입구 (`autoplaceY.normalizeOccupied` 와 동형).\n * @param {number} k\n * @param {Iterable} occupied\n */\nexport function normalizeOccupiedHex(k, occupied) {\n  assertK(k);\n  const seen = new Set();\n  const cells = [];\n  const list = occupied == null ? [] : occupied;\n  if (typeof list[Symbol.iterator] !== 'function') {\n    throw new TypeError('occupied 는 이터러블이어야 한다');\n  }\n  for (const raw of list) {\n    const cell = parseCell(raw);\n    if (!cell || !Number.isInteger(cell.q) || !Number.isInteger(cell.r)) {\n      throw new RangeError('occupied 항목이 {q,r} 가 아니다');\n    }\n    if (hexDistance(cell.q, cell.r) > k) {\n      throw new RangeError('occupied 셀 (' + cell.q + ',' + cell.r + ') 이 k=' + k + ' 육각부 밖이다');\n    }\n    const kk = key(cell.q, cell.r);\n    if (seen.has(kk)) continue;\n    seen.add(kk);\n    cells.push({ q: cell.q, r: cell.r });\n  }\n  cells.sort((a, b) => a.q - b.q || a.r - b.r);\n  return { cells: Object.freeze(cells), keys: seen };\n}\n\n/** 링 인덱스 순환 거리. */\nfunction cyclicDistance(a, b, size) {\n  const d = Math.abs(a - b) % size;\n  return Math.min(d, size - d);\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 하한 — 전부 레거시 배치 실계산에서 유도한다 (하드코딩 없음)\n// ─────────────────────────────────────────────────────────────────────────\n\n/**\n * 포맷 3복제의 «가장 가까운 두 복제» 시작 셀 사이 hexDistance 하한.\n * 레거시(링 3, 인덱스 0/6/12)의 실계산 최소값을 그대로 쓴다.\n * @param {number} k\n */\nexport function minFormatSeparationHex(k) {\n  assertK(k);\n  const starts = formatBlockStarts();\n  const ring = ringWalk(FORMAT_RING);\n  let min = Infinity;\n  for (let a = 0; a < starts.length; a += 1) {\n    for (let b = a + 1; b < starts.length; b += 1) {\n      const ca = ring[starts[a] % ring.length];\n      const cb = ring[starts[b] % ring.length];\n      const d = hexDistance(ca.q - cb.q, ca.r - cb.r);\n      if (d < min) min = d;\n    }\n  }\n  return min;\n}\n\n/**\n * 링 r 의 레퍼런스 2셀 사이 «링 인덱스 순환 거리» 하한 = ⌊6r/3⌋ = **2r**.\n *\n * 유도 (코드와 맞춘 값): 링 r 의 둘레는 6r 칸이므로 2r 은 **원주의 1/3 = 120°** 다.\n * 레거시가 노리는 이상 자리는 대척점 3r(=180°)이고, 이 하한은 그 **2/3** 다 —\n * «대척에서 최대 60° 까지 밀려도 된다» 는 뜻이다.\n *\n * ⚠ **여유 0 지점이 실재한다 (실측 2026-08-16, `_oak-bench-r2.mjs` §4)**:\n * 링 3 은 포맷 3복제 × 5셀 = 15셀이 18칸 중 15칸을 먹어 빈 인덱스가 {5, 11, 17}\n * 셋뿐이고, 어느 두 개를 골라도 순환 거리가 정확히 6 = 하한 2·3 이다. 즉\n * **k=6·8·10 전부에서 링 3 의 arc − required = 0** 이며 이는 레거시 점유·마커 점유\n * 양쪽 모두 같다 (링 4 이상은 여유가 4 에서 9 사이). 따라서 이 하한을 1 이라도 올리면 링 3 이\n * 전 k 에서 `AUTOPLACE_HEX_REF_SEPARATION` 으로 죽는다. 또한 링 3 의 남은 빈 칸\n * 3개 중 **2개가 더 점유되면** `AUTOPLACE_HEX_REF_RING` 이 던져진다 (1개까지는\n * arc 6 을 유지한다 — 실측). 링 3 은 조용히 타협할 여지가 없는 자리다.\n *\n * @param {number} r\n */\nexport function minReferenceArcHex(r) {\n  return Math.floor((6 * r) / 3);\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 포맷 15셀 (3복제 × 연속 5셀)\n// ─────────────────────────────────────────────────────────────────────────\n\n/** 이상 슬롯 — 레거시 `formatCells(k)` 가 쓰는 (링, 시작 인덱스) 3개. */\nexport function idealFormatSlotsHex(k) {\n  assertK(k);\n  return Object.freeze(formatBlockStarts().map((start, id) => Object.freeze({\n    id, ring: FORMAT_RING, start,\n  })));\n}\n\nfunction runOnRing(ring, start, length) {\n  const cells = [];\n  for (let i = 0; i < length; i += 1) cells.push(ring[(start + i) % ring.length]);\n  return cells;\n}\n\nfunction runBlocked(cells, blocked) {\n  for (const c of cells) if (blocked.has(key(c.q, c.r))) return true;\n  return false;\n}\n\nfunction pickBestRun(k, blocked, slot) {\n  // 탐색 순서: 이상 링(3) 부터 바깥으로. 링 안에서는 **이상 시작 인덱스에서\n  // 정방향 선형 탐색** — `placement.referenceCells` 가 쓰는 규칙과 같은 것이고,\n  // 레거시 좌표를 그대로 재현하는 유일한 규칙이다 (nearest-cyclic 은 링3 에서\n  // 레거시와 다른 셀을 고른다 — 실측으로 확인하고 정정했다).\n  for (let r = slot.ring; r <= k; r += 1) {\n    const ring = ringWalk(r);\n    const size = ring.length;\n    // 이상 인덱스를 링 크기에 비례 사상 (링 3 의 인덱스를 링 r 로 옮긴다).\n    const ideal = Math.round((slot.start / (6 * slot.ring)) * size) % size;\n    for (let step = 0; step < size; step += 1) {\n      const s = (ideal + step) % size;\n      const cells = runOnRing(ring, s, FORMAT_BLOCK_LENGTH);\n      if (runBlocked(cells, blocked)) continue;\n      return {\n        d: step, s, ring: r, cells,\n      };\n    }\n  }\n  return null;\n}\n\nfunction placeFormat(k, blocked) {\n  const replicas = [];\n  for (const slot of idealFormatSlotsHex(k)) {\n    const picked = pickBestRun(k, blocked, slot);\n    if (!picked) {\n      throw new AutoplaceError(\n        AUTOPLACE_HEX_FORMAT_SLOT,\n        '포맷 복제 ' + slot.id + ' 에 연속 ' + FORMAT_BLOCK_LENGTH + '셀을 둘 링이 없다 (k=' + k + ')',\n        { slot, k },\n      );\n    }\n    replicas.push({\n      id: slot.id, ring: picked.ring, start: picked.s, cells: picked.cells,\n    });\n    for (const c of picked.cells) blocked.add(key(c.q, c.r));\n  }\n\n  let minSep = Infinity;\n  for (let a = 0; a < replicas.length; a += 1) {\n    for (let b = a + 1; b < replicas.length; b += 1) {\n      const ca = replicas[a].cells[0];\n      const cb = replicas[b].cells[0];\n      const d = hexDistance(ca.q - cb.q, ca.r - cb.r);\n      if (d < minSep) minSep = d;\n    }\n  }\n  const required = minFormatSeparationHex(k);\n  if (minSep < required) {\n    throw new AutoplaceError(\n      AUTOPLACE_HEX_FORMAT_SEPARATION,\n      '포맷 복제 최소 이격 ' + minSep + ' 이 하한 ' + required + ' 미만이다',\n      { minSep, required, starts: replicas.map((x) => x.cells[0]) },\n    );\n  }\n  return { replicas, minSep, required };\n}\n\n// ─────────────────────────────────────────────────────────────────────────\n// 레퍼런스 — 데이터 링(3..k) 당 2셀\n// ─────────────────────────────────────────────────────────────────────────\n\nfunction placeReferences(k, blocked) {\n  const rings = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) {\n    const ring = ringWalk(r);\n    const size = ring.length;\n    const ideals = [0, 3 * r];\n    const picked = [];\n    for (const ideal of ideals) {\n      let best = null;\n      // 이상 인덱스에서 **정방향 선형 탐색** — `placement.referenceCells` 의 규칙\n      // 그대로. 점유 판정만 «앵커·포맷» 에서 «임의의 예약 셀» 로 넓힌 것이다.\n      for (let step = 0; step < size; step += 1) {\n        const s = (ideal + step) % size;\n        const c = ring[s];\n        if (blocked.has(key(c.q, c.r))) continue;\n        if (picked.some((p) => p.index === s)) continue;\n        best = { d: step, index: s, cell: c };\n        break;\n      }\n      if (!best) {\n        throw new AutoplaceError(\n          AUTOPLACE_HEX_REF_RING,\n          '링 ' + r + ' 에 레퍼런스 셀을 둘 빈 칸이 없다 (k=' + k + ')',\n          { k, ring: r, ideal },\n        );\n      }\n      picked.push(best);\n      blocked.add(key(best.cell.q, best.cell.r));\n    }\n    const arc = cyclicDistance(picked[0].index, picked[1].index, size);\n    const requiredArc = minReferenceArcHex(r);\n    if (arc < requiredArc) {\n      throw new AutoplaceError(\n        AUTOPLACE_HEX_REF_SEPARATION,\n        '링 ' + r + ' 레퍼런스 2셀 각분리 ' + arc + ' 이 하한 ' + requiredArc + ' 미만이다',\n        {\n          k, ring: r, arc, requiredArc, indices: picked.map((p) => p.index),\n        },\n      );\n    }\n    rings.push({\n      ring: r,\n      arc,\n      requiredArc,\n      cells: picked.map((p) => ({ q: p.cell.q, r: p.cell.r })),\n      indices: picked.map((p) => p.index),\n    });\n  }\n  return rings;\n}\n\nfunction freezeCells(cells) {\n  return Object.freeze(cells.map((c) => Object.freeze({ q: c.q, r: c.r })));\n}\n\n/**\n * k 와 검출기 점유 셀에서 format 15 · reference 2(k−2) 를 유도한다.\n *\n * @param {number} k\n * @param {Iterable} occupied 점유 셀 (마커 · 앵커 · 불스아이 등)\n * @returns {{\n *   k:number,\n *   formatCells:{q:number,r:number}[],\n *   formatReplicas:{id:number, ring:number, start:number, cells:{q:number,r:number}[]}[],\n *   referenceCells:{q:number,r:number}[],\n *   referenceRings:{ring:number, arc:number, requiredArc:number, cells:{q:number,r:number}[]}[],\n *   metrics:{sFmtMin:number, sFmtMinRequired:number, arcMin:number, occupied:number}\n * }}\n */\nexport function placeReservedCellsHex(k, occupied) {\n  const size = assertK(k);\n  const normalized = normalizeOccupiedHex(size, occupied);\n  const blocked = new Set(normalized.keys);\n\n  const fmt = placeFormat(size, blocked);\n  const refs = placeReferences(size, blocked);\n\n  const formatCells = [];\n  for (const replica of fmt.replicas) for (const c of replica.cells) formatCells.push(c);\n  const referenceCells = [];\n  for (const ring of refs) for (const c of ring.cells) referenceCells.push(c);\n\n  if (formatCells.length !== FORMAT_REPLICAS * FORMAT_BLOCK_LENGTH) {\n    throw new AutoplaceError(\n      AUTOPLACE_HEX_COLLISION,\n      'format 셀 수가 ' + (FORMAT_REPLICAS * FORMAT_BLOCK_LENGTH) + ' 가 아니다: ' + formatCells.length,\n    );\n  }\n  if (referenceCells.length !== 2 * (size - FORMAT_RING + 1)) {\n    throw new AutoplaceError(\n      AUTOPLACE_HEX_COLLISION,\n      'reference 셀 수가 ' + (2 * (size - FORMAT_RING + 1)) + ' 가 아니다: ' + referenceCells.length,\n    );\n  }\n\n  const seen = new Set();\n  for (const c of [...formatCells, ...referenceCells]) {\n    const kk = key(c.q, c.r);\n    if (seen.has(kk)) throw new AutoplaceError(AUTOPLACE_HEX_COLLISION, '배치 내부 중복: ' + kk);\n    if (normalized.keys.has(kk)) {\n      throw new AutoplaceError(AUTOPLACE_HEX_COLLISION, '배치가 검출기 점유와 겹친다: ' + kk);\n    }\n    seen.add(kk);\n  }\n\n  let arcMin = Infinity;\n  for (const ring of refs) if (ring.arc < arcMin) arcMin = ring.arc;\n\n  return Object.freeze({\n    k: size,\n    formatCells: freezeCells(formatCells),\n    formatReplicas: Object.freeze(fmt.replicas.map((x) => Object.freeze({\n      id: x.id, ring: x.ring, start: x.start, cells: freezeCells(x.cells),\n    }))),\n    referenceCells: freezeCells(referenceCells),\n    referenceRings: Object.freeze(refs.map((x) => Object.freeze({\n      ring: x.ring, arc: x.arc, requiredArc: x.requiredArc, cells: freezeCells(x.cells),\n    }))),\n    metrics: Object.freeze({\n      sFmtMin: fmt.minSep,\n      sFmtMinRequired: fmt.required,\n      arcMin,\n      occupied: normalized.cells.length,\n    }),\n  });\n}\n\n/** 결정성 대조용 — 같은 배치는 같은 문자열 (`autoplaceY.placementKey` 와 동형). */\nexport function placementKeyHex(placement) {\n  const fmt = placement.formatCells.map((c) => key(c.q, c.r)).join(';');\n  const ref = placement.referenceCells.map((c) => key(c.q, c.r)).join(';');\n  return placement.k + '|F:' + fmt + '|R:' + ref;\n}\n\n/**\n * 레거시 등가 점유 — 불스아이 풋프린트 + 앵커 3셀. 이 입력으로 부른\n * `placeReservedCellsHex` 는 `placement.js` 산출과 좌표까지 같아야 한다.\n * @param {number} k\n */\nexport function legacyOccupiedHex(k) {\n  assertK(k);\n  const out = [];\n  for (let q = -2; q <= 2; q += 1) {\n    for (let r = -2; r <= 2; r += 1) {\n      if (hexDistance(q, r) <= 2) out.push({ q, r });\n    }\n  }\n  for (const kk of anchorPositionSet(k)) {\n    const [q, r] = kk.split(',').map(Number);\n    out.push({ q, r });\n  }\n  return out;\n}\n\n// 모듈 로드 시점 자기검증 — «레거시 무영향» 계약이 실제로 참인지 import 시점부터\n// 확인한다 (capacityY.js 의 Y2W 자기검증과 동형). 조용히 어긋난 채로 쓰이는 것을 막는다.\n{\n  for (const k of [6, 8, 10]) {\n    const placed = placeReservedCellsHex(k, legacyOccupiedHex(k));\n    const legacyFmt = legacyFormatCells(k).map((c) => key(c.q, c.r)).join(';');\n    const gotFmt = placed.formatCells.map((c) => key(c.q, c.r)).join(';');\n    if (legacyFmt !== gotFmt) {\n      throw new Error('autoplaceHex k=' + k + ': 레거시 format 좌표와 어긋난다\\n  legacy=' + legacyFmt + '\\n  got   =' + gotFmt);\n    }\n    const legacyRef = legacyReferenceCellsAll(k).map((c) => key(c.q, c.r)).join(';');\n    const gotRef = placed.referenceCells.map((c) => key(c.q, c.r)).join(';');\n    if (legacyRef !== gotRef) {\n      throw new Error('autoplaceHex k=' + k + ': 레거시 reference 좌표와 어긋난다\\n  legacy=' + legacyRef + '\\n  got   =' + gotRef);\n    }\n  }\n}\n"],
  ["placementA", "// placementA.js — Type A(삼각 실루엣) 영역·꼭짓점 앵커·패치 레퍼런스 배치\n// (ADR 0005 D1·D2·D4, docs/adr/0005_typeA_layout.md v1.1)\n//\n// Type A 는 육각 영역(반경 k)의 세 교대 방향에 삼각 코너 패치를 붙여 실루엣을\n// 정삼각형(△, 위 꼭짓점)으로 닫는 변형이다. 데이터 계약(§4.1 순위 3튜플·GF(211)·\n// §4.3 마스크)은 Type O 를 전부 승계하고 **레이아웃만** 확장한다.\n//\n// [D2 안 1 채택 — 무수정 공유 계약] 육각부의 역할 지도(앵커 3셀·포맷 15셀·레퍼런스\n// 2(k-2)셀)는 Type O 와 **바이트 동일**이다 — 이 모듈은 `placement.js`/`hexgrid.js`\n// 를 import 만 하고 절대 수정하지 않는다. 육각 코너 3셀 (0,0,5) 은 보조 앵커로\n// 그대로 남고, 꼭짓점 3셀이 주 앵커로 추가되어 앵커 총 6개가 된다.\n//\n// cube 좌표 (x,y,z) = (q, −q−r, r) 에서:\n//   영역 A(k)  = { x≤k ∧ y≤k ∧ z≤k } ⇔ axial q≤k ∧ r≤k ∧ q+r≥−k\n//   육각부     = 여기에 min(x,y,z)≥−k 를 더한 것 (= 기존 hexDistance≤k 와 전수 일치)\n//   패치       = 정확히 하나의 cube 좌표가 <−k 인 셀\n//     top(상단) 패치: r < −k (z < −k)\n//     BL(좌하) 패치:  q < −k (x < −k)\n//     BR(우하) 패치:  q+r > k (y < −k)\n// 세 패치는 `rotate120` 궤도(top → BR → BL)로 서로 사상된다 — placement.js 의\n// 120°/240° 회전(rhombille 이 갖는 유일한 비자명 대칭)을 그대로 재사용한다.\n//\n// 셀 수 검산: (3k+1)(3k+2)/2 — k=8 → 325 · k=10 → 496 (placementA.test.js 전수 검산).\n//\n// 런타임 의존성 0 · 순수 ESM.\n\nimport { hexDistance, regionCells } from './hexgrid.js';\nimport {\n  BULLSEYE_RADIUS,\n  REFERENCE_DIGIT,\n  ANCHOR_PRIMARY_DIGIT,\n  ANCHOR_SECONDARY_DIGIT,\n  FORMAT_RING,\n  rotate120,\n  rotate240,\n  ringWalk,\n  buildRoleSets,\n} from './placement.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  // 육각부 재사용(placement.js/hexgrid.js)이 요구하는 최소 반경을 그대로 승계한다\n  // (FORMAT_RING=3 이 데이터 링이려면 앵커 링(k) 보다 작아야 한다). 패치 레퍼런스\n  // 링 공식(k+2 .. 2k-1)도 k≥3 만 있으면 성립하므로 이 하한이 더 좁혀 잡는다.\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 영역 정의 (D1)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 영역 A(k) 소속 판정 — cube 좌표 x,y,z ≤ k (⇔ axial q≤k ∧ r≤k ∧ −q−r≤k). */\nexport function isInRegionA(q, r, k) {\n  return q <= k && r <= k && (-q - r) <= k;\n}\n\n/**\n * 패치 판별 — 정확히 하나의 cube 좌표가 <−k 인 셀만 패치다. 호출자는 (q,r) 이\n * 이미 `isInRegionA(q,r,k)` 를 만족하는 셀임을 보장해야 한다(역할 분류·레퍼런스\n * arc 필터링 등 내부 소비처가 전부 그렇다) — 임의 좌표에 대한 독립 판정이 아니다.\n */\nexport function isTopPatch(q, r, k) {\n  return isInRegionA(q, r, k) && r < -k;\n}\n\nexport function isBLPatch(q, r, k) {\n  return isInRegionA(q, r, k) && q < -k;\n}\n\nexport function isBRPatch(q, r, k) {\n  return isInRegionA(q, r, k) && (q + r) > k;\n}\n\n/** 셀의 패치 소속 — 'top' | 'BL' | 'BR' | null(육각부 또는 영역 밖). */\nexport function patchOfA(q, r, k) {\n  if (!isInRegionA(q, r, k)) return null;\n  if (isTopPatch(q, r, k)) return 'top';\n  if (isBLPatch(q, r, k)) return 'BL';\n  if (isBRPatch(q, r, k)) return 'BR';\n  return null; // 육각부\n}\n\n// top 패치 셀 — 행 j=1..k (r=−k−j), 행 내 q∈[j,k], 오름차순 고정(레이아웃-무관\n// 원시 나열). scan order(T3)의 boustrophedon 은 layoutA.js 소관이라 여기서 다루지\n// 않는다 — placementA.js 는 \"무엇이 패치 셀인가\"만 답한다.\nfunction topPatchCellsAscending(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    for (let q = j; q <= k; q += 1) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 영역 A(k) 전 셀, 결정적 순서 — 육각부 `regionCells(k)` 접두 그대로 + 패치 셀\n * (top → BR(rotate120) → BL(rotate240), 각 패치 내부는 행 j=1..k 오름차순 q).\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 (3k+1)(3k+2)/2\n */\nexport function regionCellsA(k) {\n  assertRadius(k);\n  const hexPart = regionCells(k);\n  const top = topPatchCellsAscending(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...hexPart, ...top, ...br, ...bl];\n}\n\n/**\n * ── 턴A 영역 (역삼각 옵션, 2026-08-18) ─────────────────────────────────────\n *\n * 턴A 는 별도 타입이 아니라 **타입 A 의 옵션**이고 (운영자 확정 015 §16),\n * 실루엣만 역삼각이다. 그래서 정의가 곧 유도다 — **영역 A 를 축좌표 180° 돌린 것**:\n *   (q, r) → (−q, −r)\n * 육각 코어는 180° 대칭이라 **제자리**이고, 세 패치만 반대편으로 간다.\n *\n * 판별력 (k=6 실측): 190셀 중 육각 코어 127 은 두 방향이 공유하고 **각각 63셀이\n * 배타적**이다. 정삼각 프레임에서 역삼각 셀을 재면 «코드 밖 배경» 을 읽으므로\n * 두 가설이 126셀에서 갈린다 — 디코더가 방향을 가를 근거가 여기서 나온다.\n *\n * 손 좌표 0 · 새 상수 0 — `regionCellsA` 의 사상일 뿐이다. 셀 수·코어 공유는\n * 로드 시점 자기검증이 확인한다 (아래).\n *\n * @param {number} k\n * @returns {{q:number, r:number}[]} `regionCellsA(k)` 와 같은 길이·같은 순서의 180° 상\n */\nexport function regionCellsTurnA(k) {\n  return regionCellsA(k).map((cell) => ({ q: -cell.q, r: -cell.r }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 꼭짓점 앵커 3셀 (D2)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 닫힌 형태: cube 좌표에서 두 개가 +k, 하나가 −2k 인 세 점.\n//   (k,−2k) 위 꼭짓점 · (k,k) 우하 꼭짓점 · (−2k,k) 좌하 꼭짓점\n// digit 규약(§5.2 승계): digit 5 = 위 꼭짓점 (Type A 명명 근거 △ 와 일치하는 방향\n// 기준점), 나머지 두 꼭짓점 = digit 0. rotate120 이 top→BR→BL 순으로 사상하므로\n// 이 배열 순서 자체가 그 궤도를 반영한다.\n\n/**\n * 삼각 꼭짓점 3셀과 digit 배정 (D2 주 앵커). 기존 육각 코너 앵커(`placement.\n * anchorCells(k)`, 보조 앵커로 유지)와 합쳐야 앵커 총 6개다 — 이 함수는 꼭짓점\n * 3개만 낸다.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function vertexAnchors(k) {\n  assertRadius(k);\n  return [\n    { q: k, r: -2 * k, digit: ANCHOR_PRIMARY_DIGIT }, // 위 꼭짓점\n    { q: k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, //     우하 꼭짓점 (BR)\n    { q: -2 * k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, // 좌하 꼭짓점 (BL)\n  ];\n}\n\n/** 꼭짓점 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function vertexAnchorPositionSet(k) {\n  return new Set(vertexAnchors(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 패치 레퍼런스 셀 — 규칙 R (D4)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 패치 링 ρ ∈ {k+2, k+5, k+8, …} (ρ ≤ 2k−1) 에서 top 패치 arc(**= ringWalk(ρ) 중\n// 영역 A(k) 내 top 패치 셀만** — [C7] 자문 정정: \"r_ax<−k 만\"으로는 영역 밖 셀이\n// 섞이는 구현 함정이 있었다. `isTopPatch` 가 이미 `isInRegionA` 를 내부에서\n// 검사하므로 이 필터 한 줄로 두 조건을 동시에 만족한다)의 **중앙 셀**\n// (⌊(len−1)/2⌋) 을 잡고 rotate120/240 으로 복제한다 — 링당 3개.\n//\n// 랩어라운드 무관: 대칭 복제라 arc 인덱스 산술이 top 패치에서만 필요하고,\n// top 패치는 ringWalk 순회에서 절대 인덱스 0/끝을 걸치지 않는다(경험적으로\n// [C7] 독립 재구현이 재확인 — placementA.test.js 가 KAT 좌표로 회귀 고정한다).\n\n/** 패치 레퍼런스가 사는 링 반경 목록 — k+2 부터 2k−1 까지 3씩. */\nexport function patchReferenceRings(k) {\n  assertRadius(k);\n  const rings = [];\n  for (let rho = k + 2; rho <= 2 * k - 1; rho += 3) rings.push(rho);\n  return rings;\n}\n\n/**\n * 패치 레퍼런스 셀 전부(규칙 R). 링마다 top arc 중앙 + rotate120(→BR) +\n * rotate240(→BL) 3개, digit 은 `REFERENCE_DIGIT`(placement.js §5.3 값 3 승계).\n * k=8 KAT: (5,−10)·(7,−13) + 회전상(총 6). k=10 KAT: (6,−12)·(8,−15)·(9,−18) +\n * 회전상(총 9). (placementA.test.js 가 좌표를 그대로 회귀 고정한다.)\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]}\n */\nexport function patchReferenceCells(k) {\n  assertRadius(k);\n  const out = [];\n  for (const rho of patchReferenceRings(k)) {\n    const arc = ringWalk(rho).filter((c) => isTopPatch(c.q, c.r, k));\n    if (arc.length === 0) {\n      throw new RangeError(`k=${k} rho=${rho}: 패치 레퍼런스 arc 가 비었다 — 규칙 R 전제 위반`);\n    }\n    const center = arc[Math.floor((arc.length - 1) / 2)];\n    const br = rotate120(center.q, center.r);\n    const bl = rotate240(center.q, center.r);\n    out.push({ q: center.q, r: center.r, digit: REFERENCE_DIGIT });\n    out.push({ q: br.q, r: br.r, digit: REFERENCE_DIGIT });\n    out.push({ q: bl.q, r: bl.r, digit: REFERENCE_DIGIT });\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 — 육각부(placement.js 무수정) + 꼭짓점 앵커 + 패치 레퍼런스\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체(육각부 + 패치)의 역할 분류표. 육각부는 `placement.\n * buildRoleSets(k)` 를 그대로 재사용(D2 안 1 계약 — 바이트 동일)하고, 꼭짓점\n * 앵커·패치 레퍼런스만 그 위에 얹는다.\n *\n * `finderReserved` 는 육각부로만 전달한다 — daehan 좌표는 전 k 에서 패치에 0개\n * (실측 2026-08-19). 인자를 안 넘기면 예전과 완전히 같다.\n * @param {number} k\n * @param {Iterable<{q:number,r:number}>|Set<string>} [finderReserved]\n * @returns {{anchor: Set<string>, format: Set<string>, reference: Set<string>, finder: Set<string>}}\n */\nexport function buildRoleSetsA(k, finderReserved) {\n  assertRadius(k);\n  const hexSets = buildRoleSets(k, finderReserved);\n  const anchor = new Set(hexSets.anchor);\n  for (const c of vertexAnchors(k)) anchor.add(key(c.q, c.r));\n  const reference = new Set(hexSets.reference);\n  for (const c of patchReferenceCells(k)) reference.add(key(c.q, c.r));\n  return { anchor, format: hexSets.format, reference, finder: hexSets.finder };\n}\n\n/**\n * 셀 (q,r) 의 역할. 육각부는 `placement.roleOf` 와 완전히 동일한 판정을 낸다\n * (앵커·포맷·레퍼런스 좌표가 그대로이므로) — 패치 좌표만 anchor/reference/data 로\n * 새로 갈린다.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOfA(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSetsA(k);\n  const kk = key(q, r);\n  if (sets.finder && sets.finder.has(kk)) return 'finder';\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 턴A 영역 자기검증 (2026-08-18) — 유도가 주장대로인지 로드 시점에 못 박는다.\n// 「180° 상이다 · 육각 코어는 제자리다 · 패치만 배타적이다」 셋이 이 편입의 근거고,\n// 하나라도 깨지면 방향 판별이 조용히 무의미해진다.\n// ─────────────────────────────────────────────────────────────────────────────\n{\n  const key = (c) => c.q + ',' + c.r;\n  for (const k of [4, 6, 8, 10]) {\n    const up = regionCellsA(k);\n    const down = regionCellsTurnA(k);\n    if (up.length !== down.length) {\n      throw new Error('turnA: 영역 길이가 다르다 k=' + k);\n    }\n    const upSet = new Set(up.map(key));\n    const shared = down.filter((c) => upSet.has(key(c)));\n    const hexOnly = regionCells(k);\n    if (shared.length !== hexOnly.length) {\n      throw new Error('turnA: 공유 셀이 육각 코어와 다르다 k=' + k\n        + ' — 공유 ' + shared.length + ' vs 코어 ' + hexOnly.length);\n    }\n    // 공유 = 정확히 육각 코어여야 한다 (집합 동일성까지).\n    const coreSet = new Set(hexOnly.map(key));\n    for (const c of shared) {\n      if (!coreSet.has(key(c))) throw new Error('turnA: 공유 셀이 코어 밖이다 ' + key(c));\n    }\n    // 배타 셀이 없으면 방향을 못 가른다 — 판별력의 하한이다.\n    if (up.length - shared.length <= 0) {\n      throw new Error('turnA: 배타 셀이 없다 k=' + k + ' — 방향 판별 불가');\n    }\n  }\n}\n"],
  ["layoutA", "// layoutA.js — Type A scan order-A(T3) + 레이아웃 통합 파사드\n// (ADR 0005 D3, docs/adr/0005_typeA_layout.md v1.1 / 0005b §3)\n//\n// placementA.js 가 이미 확정한 \"어디에 무엇을 놓는가\"(꼭짓점 앵커·패치 레퍼런스)\n// 위에 **데이터 셀의 순회 순서**만 얹는다. layout.js(Type O) 와 대칭 구조 —\n// 소비자가 placementA/placement 를 따로 import 하지 않도록 재-export 파사드를\n// 겸한다.\n//\n// [D3 채택 — T3 행 boustrophedon] scan order-A = 육각부 §5.7 순서(=\n// `layout.dataCellsInScanOrder(k)`) 그대로 접두 + 패치 꼬리 [top → BR → BL]:\n//   top 패치는 행 j=1..k (r=−k−j), 행 내 q∈[j,k], **홀수 행 오름차순·짝수 행\n//   내림차순(boustrophedon)**; BR = rotate120(top 순서) · BL = rotate240(top 순서).\n//   role === 'data' 인 셀만(앵커·레퍼런스 스킵).\n// 후보 4개(T1 링 연장·T2 행 고정방향·T3·B 전역 행 우선) 실측 비교에서 T3 만\n// 유일하게 양쪽 k(8·10)에서 \"전 그룹 인접쌍 보유 100%\" 계약을 보존하고 변\n// 스크레이프 터치 심볼도 최소였다(0005b §3 표). 하기 실계산이 그 채택 근거를\n// 회귀로 고정한다(layoutA.test.js sha256 스냅샷).\n//\n// 필러: A1(k=8) 잔여 0(필러 없음) · A2(k=10) 잔여 2 → scan 꼬리 마지막 2셀 =\n// (−19,10)·(−19,9) = BL 패치 최외곽 행(실루엣 가장자리, §5.6 취지 유지).\n//\n// 런타임 의존성 0 · ESM.\n\nimport { dataCellsInScanOrder as hexDataCellsInScanOrder } from './layout.js';\nimport { rotate120, rotate240 } from './placement.js';\nimport { occupiedCells } from './bullseye.js';\nimport {\n  buildRoleSetsA,\n  roleOfA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n} from './placementA.js';\nimport {\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n} from './placement.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < 4) {\n    throw new RangeError(`k 는 4 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order-A (T3)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * top 패치를 행 j=1..k 로 훑되, 홀수 행은 q 오름차순 · 짝수 행은 q 내림차순\n * (boustrophedon). D3 이 채택한 T3 규칙의 핵심 — 인접 행끼리 끝점이 맞물려\n * 연속쌍 인접률이 T2(행 고정방향)보다 높다(0005b §3 실측표).\n */\nfunction topPatchBoustrophedon(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    const rowQs = [];\n    for (let q = j; q <= k; q += 1) rowQs.push(q);\n    if (j % 2 === 0) rowQs.reverse();\n    for (const q of rowQs) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 패치 꼬리(top → BR → BL, T3 boustrophedon) 중 role === 'data' 인 셀만.\n * 꼭짓점 앵커·패치 레퍼런스는 스킵된다.\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} roleSets\n */\nfunction patchDataTail(k, roleSets) {\n  const top = topPatchBoustrophedon(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...top, ...br, ...bl].filter((c) => roleOfA(c.q, c.r, k, roleSets) === 'data');\n}\n\n/**\n * 데이터 셀을 캐노니컬 scan order-A(T3) 로. 육각부 접두(`layout.\n * dataCellsInScanOrder(k)`, 바이트 동일) + 패치 꼬리(top→BR→BL, boustrophedon,\n * role=='data' 만).\n *\n * `finderReserved` 는 육각부 접두에만 전달한다 — daehan 셀은 패치에 0개 (실측).\n * 인자를 안 넘기면 예전과 완전히 같다.\n * @param {number} k\n * @param {Iterable<{q:number,r:number}>|Set<string>} [finderReserved]\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (A1(k=8) → 267 · A2(k=10) → 431)\n */\nexport function dataCellsInScanOrderA(k, finderReserved) {\n  assertRadius(k);\n  const hexPrefix = hexDataCellsInScanOrder(k, finderReserved);\n  const roleSets = buildRoleSetsA(k, finderReserved);\n  const tail = patchDataTail(k, roleSets);\n  return [...hexPrefix, ...tail];\n}\n\n/**\n * scan order-A 의 연속 3셀씩 묶은 심볼 그룹. §4.2 MSD-first 규약 그대로. 마지막\n * (C mod 3) 개는 그룹에 들지 않고 `fillerCellsA` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]}\n */\nexport function symbolCellGroupsA(k, finderReserved) {\n  const scan = dataCellsInScanOrderA(k, finderReserved);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order-A 의 마지막 (C mod 3) 개 (§5.6 준용). A1 은 0개, A2 는\n * 2개 = (−19,10)·(−19,9)(BL 패치 최외곽 행, D3 KAT).\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCellsA(k, finderReserved) {\n  const scan = dataCellsInScanOrderA(k, finderReserved);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점, layout.js `layoutMap` 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 영역 A(k) 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → 육각 코너 3셀(`placement.anchorCells(k)`) + 꼭짓점 3셀\n *                 (`placementA.vertexAnchors(k)`), 이 순서로 이어붙여 인덱스 0..5\n *   - format    → `placement.formatCells(k)` 순서 (육각부 재사용, 무변경)\n *   - reference → 육각 레퍼런스(`placement.referenceCellsAll(k)`) + 패치\n *                 레퍼런스(`placementA.patchReferenceCells(k)`), 이 순서로 이어붙임\n *   - data      → `dataCellsInScanOrderA(k)` 순서 (= scan order-A 인덱스, 심볼\n *                 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMapA(k, finderReserved) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n  if (finderReserved) {\n    Array.from(finderReserved).forEach((c, i) => map.set(key(c.q, c.r), { role: 'finder', index: i }));\n  }\n\n  const anchors = [...anchorCells(k), ...vertexAnchors(k)];\n  anchors.forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n\n  const references = [...referenceCellsAll(k), ...patchReferenceCells(k)];\n  references.forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n\n  dataCellsInScanOrderA(k, finderReserved).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placementA/placement 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOfA,\n  buildRoleSetsA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\n"],
  ["capacityA", "// capacityA.js — Type A 버전별 용량 산출 (ADR 0005 D5·D6, capacity.js/capacityY.js 대칭)\n//\n// **이 모듈이 SPEC 생성물 표의 소스다.** 수기로 유지\n// 하지 않는다.\n//\n// [A-U1 ✅ 확정 — 사용자 비준 2026-08-09, hb-20260809-tlrat1] `NSYM_TABLE_A` 는\n// ADR 0005 D5 실계산 절차(기존 rs211.js NSYM_TABLE 표 규칙 승계: M = round(0.25·S),\n// 짝수면 +1 홀수화 / L = round(0.12·S) / H = round(0.40·S))를 따르되, **A2/H 만\n// 절차값 57 대신 59** 다 — 57·58 은 base-211 청킹 비정렬로 생성 불가(아래 chunkAligned\n// 참조), 59 는 정렬·홀수·절차 최근접(|59−57.2|=1.8) 3조건 동시 만족 (비준 확정값):\n//   A0 S=45  → L 5 · M 11 (24.4%) · H 18   [ADR 0006 D6, 2026-08-09 비준]\n//   A1 S=89  → L 11 · M 23 (25.8%) · H 36\n//   A2 S=143 → L 17 · M 37 (25.9%) · H 59 (41.3% — 절차값 57 은 비정렬로 대체)\n//\n// [ADR 0006 D6 — A0 변 스크레이프 딱지] A0(k=6) 는 변 하나(각 19셀 = 3k+1)가 통째로\n// 소실되면 터치 RS 심볼이 **9/8/10** (R/B/L 변)이라 **t(H)=9 로도 L 변을 못 산다** —\n// 어떤 ECC 레벨도 변 전체 소실을 오류-전용 복호로 보장하지 못한다. H 강제의 유일한\n// 명분이 변 방어인데 그걸 못 사면서 순 페이로드만 31→25 B 로 과세하므로 **기본 M 유지**\n// (A1 전례 승계). 소거 회계로는 e ≤ nsym 이라 M(11) ≥ 10 — **P4(소거 복호) 구현이\n// A0 변 방어의 전제 조건**이다. M1-A 결합 스윕에 A0 를 포함한다.\n//\n// 회계는 capacity.js 와 동형이다(심볼 도메인):\n//   총 셀           total = (3k+1)(3k+2)/2  (D1 — 육각 3k²+3k+1 + 패치 3·k(k+1)/2)\n//   오버헤드         overhead = 불스아이 19 + 포맷 15 + 앵커 6(육각3+꼭짓점3) +\n//                     육각 레퍼런스 2(k−2) + 패치 레퍼런스(규칙 R, D4) — 실계산 합\n//                     (k=8 → 58 · k=10 → 65, D5 검산값과 정확히 일치해야 한다)\n//   데이터 심볼(셀)  C = total − overhead\n//   사용 심볼        S = ⌊C / 3⌋  (잔여 셀 = C − 3S)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE_A 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (capacity.js 의\n//                     `maxBytesForSymbols` 재사용 — BigInt 정확 계산, 전용 재구현 아님)\n//   순 페이로드       = K − 1  (헤더 1B, header.js 승계)\n//\n// [ADR 0006 D3 네임스페이스 — 2026-08-09 비준] formatIndex 는 **tri 패밀리 표**의\n// 값이다(4bit 는 격자 수립 경로별 독립 표). 1=A0 · 12=A1 · 13=A2, 중앙 QR 변형은\n// +2 오프셋으로 3=A0Q · 14=A1Q · 15=A2Q (encodeA.js 가 centerQr 옵션으로 적용).\n//\n// **A0 가 0 이 아닌 이유 (설계 불변식)**: tri 는 hex 코어를 좌표까지 그대로 포함\n// 한다(`dataCellsInScanOrder(6)` 82셀 == `dataCellsInScanOrderA(6)` 접두). 그래서\n// A0(k=6) 를 hex 표의 k=6 값에 배정하면 삼각 패치가 마모·가림됐을 때 hex 로 오판된\n// 가설이 격자·앵커·포맷·CRC·인덱스를 전부 \"정상 V1\"으로 통과시키고 페이로드를 그대로\n// 읽는다 — 완전 도플갱어 (몬테카를로 실측 오수락 2.7e-5/L, 설계 불변식 10⁻²⁰ 대비\n// 15자릿수 위반). ADR 0006 D3 축 분리 검사: **격자 파라미터 k 가 반드시 달라야 한다**\n// (k 가 다르면 샘플링 격자 자체가 어긋나 구조적으로 실패). hex 에서 k=6 인 값은\n// **0(V1)·4(V1Q) 둘뿐**이고, +2 쌍 불변식을 지키는 최저 안전쌍이 **1·3** 이다.\n// 파인더 종류(불스아이 vs 중앙 QR) 상이는 **단독 근거로 쓰지 않는다** — centerQr 은\n// 셀 기하를 전혀 안 바꾸므로(19셀 슬롯 동일) 디코더의 명시적 비교에만 의존한다.\n\nimport { cellCount } from './hexgrid.js';\nimport { symbolCountForByteLength } from './base211.js';\nimport { maxBytesForSymbols } from './capacity.js';\nimport { errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\nimport { occupiedCells } from './bullseye.js';\nimport { anchorCells, formatCells, referenceCellsAll } from './placement.js';\nimport { vertexAnchors, patchReferenceCells } from './placementA.js';\nimport { daehanReservedCells } from './finder-daehan.js';\n\n/**\n * Type A 오버헤드 실계산(불스아이 19 + 포맷 15 + 앵커 6 + 육각 레퍼런스 2(k−2) +\n * 패치 레퍼런스). 하드코딩이 아니라 placement.js/placementA.js 실계산 합이다.\n * @param {number} k\n * @param {number} [finderReservedCount=0] 불스아이 밖 파인더 예약 셀 수 (daehan).\n *   기본 0 — 인자를 안 넘기면 예전 54/58/65 그대로다.\n * @returns {{k:number, bullseye:number, anchor:number, format:number,\n *            hexReference:number, patchReference:number, finder:number, total:number}}\n */\nexport function overheadBreakdownA(k, finderReservedCount = 0) {\n  if (!Number.isInteger(finderReservedCount) || finderReservedCount < 0) {\n    throw new RangeError('파인더 예약 셀 수는 0 이상 정수여야 한다: ' + finderReservedCount);\n  }\n  const bullseye = occupiedCells().length; // 19 (hexDistance<=2, k 무관)\n  const anchor = anchorCells(k).length + vertexAnchors(k).length; // 3 + 3 = 6\n  const format = formatCells(k).length; // 15 (k 무관)\n  const hexReference = referenceCellsAll(k).length; // 2(k-2)\n  const patchReference = patchReferenceCells(k).length; // 규칙 R, D4\n  const total = bullseye + anchor + format + hexReference + patchReference + finderReservedCount;\n  return {\n    k, bullseye, anchor, format, hexReference, patchReference,\n    finder: finderReservedCount, total,\n  };\n}\n\n// ADR 0005 D5 검산값 — 58(k=8)/65(k=10) · ADR 0006 D6 검산값 — 54(k=6).\n// \"조용히 맞추지 않는다\"(과제 지침 절대 규칙): 모듈 로드 시점에 실계산이 검산값과\n// 어긋나면 즉시 던진다.\nfor (const [k, expectedTotal] of [[6, 54], [8, 58], [10, 65]]) {\n  const actual = overheadBreakdownA(k).total;\n  if (actual !== expectedTotal) {\n    throw new Error(\n      `overheadBreakdownA(${k}) 실계산 불일치: ${actual} !== ADR 0005 D5 검산값 ${expectedTotal}`,\n    );\n  }\n}\n\n/**\n * [A-U1 ✅ 확정] Type A 사용 심볼 수 대비 ECC 레벨별 nsym 표 (사용자 비준\n * 2026-08-09). 산출 근거는 위 모듈 헤더 주석 (ADR 0005 D5).\n * @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>}\n */\nexport const NSYM_TABLE_A = Object.freeze({\n  A0: Object.freeze({\n    symbols: 45, L: 5, M: 11, H: 18,\n  }),\n  A1: Object.freeze({\n    symbols: 89, L: 11, M: 23, H: 36,\n  }),\n  A2: Object.freeze({\n    symbols: 143, L: 17, M: 37, H: 59,\n  }),\n});\n\n/**\n * 버전 정의. `overhead` 는 `overheadBreakdownA(k).total` 로 유도한다(하드코딩\n * 아님). `formatIndex` 는 tri 패밀리 표(1=A0·12=A1·13=A2, ADR 0006 D3) —\n * centerQr(A*Q) 는 encodeA.js 가 +2 오프셋으로 적용한다(3=A0Q·14=A1Q·15=A2Q).\n *\n * 배열 순서는 **용량 오름차순** — `chooseVersionA` 가 앞에서부터 훑어 최소 버전을\n * 고르므로 A0 가 선두여야 한다.\n * @type {ReadonlyArray<{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}>}\n */\nexport const VERSIONS_A = Object.freeze([\n  Object.freeze({\n    name: 'A0', version: 0, k: 6, formatIndex: 1, overhead: overheadBreakdownA(6).total, symbolKey: 'A0',\n  }),\n  Object.freeze({\n    name: 'A1', version: 1, k: 8, formatIndex: 12, overhead: overheadBreakdownA(8).total, symbolKey: 'A1',\n  }),\n  Object.freeze({\n    name: 'A2', version: 2, k: 10, formatIndex: 13, overhead: overheadBreakdownA(10).total, symbolKey: 'A2',\n  }),\n]);\n\n/**\n * version → VERSIONS_A 항목.\n * @param {number} version 0 | 1 | 2\n * @returns {{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}}\n */\nexport function versionSpecA(version) {\n  const spec = VERSIONS_A.find((v) => v.version === version);\n  if (!spec) {\n    throw new RangeError(\n      `알 수 없는 Type A 버전: ${version} (허용 ${VERSIONS_A.map((v) => `${v.name}(v${v.version})`).join(', ')})`,\n    );\n  }\n  return spec;\n}\n\n/**\n * 한 버전의 용량 전체. capacity.js `capacityFor` 회계를 그대로 승계한다.\n * @param {{version:number, k:number, overhead:number, symbolKey:string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityForA(spec, level = 'M', nsymTable = NSYM_TABLE_A) {\n  const label = spec.name || `A${spec.version}`;\n  const totalCells = (3 * spec.k + 1) * (3 * spec.k + 2) / 2;\n  // hexgrid.cellCount(k) + 패치 3·k(k+1)/2 와 항등이어야 한다(placementA.test.js 가\n  // 이 항등을 회귀 고정) — 여기서는 닫힌 형태로 직접 계산(D1)한다.\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`${label}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = nsymTable[spec.symbolKey];\n  const tableName = nsymTable === NSYM_TABLE_A_DAEHAN ? 'NSYM_TABLE_A_DAEHAN' : 'NSYM_TABLE_A';\n  if (!table) {\n    throw new RangeError(`${label}: ${tableName} 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 조용히 맞추지 않고 던진다\n    // (capacity.js `capacityFor` 와 동일한 규약 · 과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `${label}: 실계산 사용 심볼 ${usedSymbols} 이 ${tableName}.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`${label}:
