<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TLcube">
  <!-- 아이소메트릭 큐브 3면 = 이 포맷의 셀 한 개. 색은 slate 프리셋의 세 레벨을
       그대로 쓴다 (rank 2 / 1 / 0) — 파비콘도 "휘도 순서"를 보여준다.

       ⚠ 기하는 **참 아이소메트릭**이어야 한다. 실루엣이 정육각형이고 큐브의 세 모서리가
          투영 후 같은 길이(14)여야 한다는 뜻이다. 예전 값(16,3 / 29,10.5 / …)은 윗면
          마름모만 맞고 수직 모서리가 11 로 눌려 있어서, 실루엣이 가로로 2/√3 배 늘어난
          «직육각형» 이었다(사용자 지적 2026-08-11). 32 캔버스에 맞추려다 그렇게 된 것으로
          보이는데, 이 프로젝트의 정체성이 아이소메트릭 큐브라 아이콘이 제품을 잘못 그리는
          셈이었다. R=14 로 줄이면 정육각형인 채로 32 안에 들어간다.

       좌표 유도: 중심 (16,16), 외접반경 R=14, 가로 반폭 = R·√3/2 = 12.124 -->
  <polygon points="16,2 28.124,9 16,16 3.876,9" fill="#dce4f0"/>
  <polygon points="3.876,9 16,16 16,30 3.876,23" fill="#6e87be"/>
  <polygon points="28.124,9 16,16 16,30 28.124,23" fill="#3a446c"/>
</svg>
