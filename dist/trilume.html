<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilume — TLcube 인코더 (M0)</title>
<style>
  :root {
    --bg: #101218;
    --panel: #191c26;
    --line: #2a2f40;
    --text: #dfe3ee;
    --dim: #8a91a6;
    --accent: #7fa3ff;
    --ok: #7fd8a4;
    --bad: #ff8f8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; padding: 18px 24px 10px;
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  main {
    width: 100%; max-width: 1080px; padding: 8px 24px 40px;
    display: grid; grid-template-columns: 300px 1fr; gap: 20px;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
    align-self: start;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  textarea, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; font: inherit; font-size: 13px;
  }
  textarea { min-height: 84px; resize: vertical; }
  button {
    width: 100%; padding: 7px 0; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  #info { margin-top: 14px; font-size: 12px; line-height: 1.7; color: var(--dim); }
  #info b { color: var(--text); font-weight: 600; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 99px;
    font-size: 11px; border: 1px solid var(--line);
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  #error { color: var(--bad); font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  #stage {
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; min-height: 420px; overflow: auto;
  }
  canvas { display: block; border-radius: 4px; }
  footer { color: var(--dim); font-size: 11px; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <h1>Trilume <span style="color:var(--accent)">/ TLcube</span></h1>
  <span class="sub">3면 휘도 순위 2.5D 코드 — M0 인코더 프리뷰</span>
</header>
<main>
  <div class="panel">
    <label for="payload">페이로드 (UTF-8 텍스트)</label>
    <textarea id="payload" spellcheck="false">https://example.com/trilume</textarea>
    <div class="row">
      <div>
        <label for="version">버전</label>
        <select id="version">
          <option value="auto" selected>자동 (최소)</option>
          <option value="1">V1 (k=6 · 18 B)</option>
          <option value="2">V2 (k=8 · 39 B)</option>
          <option value="3">V3 (k=10 · 65 B)</option>
        </select>
      </div>
      <div>
        <label for="ecc">ECC</label>
        <select id="ecc">
          <option value="L">L (≈12%)</option>
          <option value="M" selected>M (25%)</option>
          <option value="H">H (≈40%)</option>
        </select>
      </div>
    </div>
    <label for="preset">스타일 프리셋</label>
    <select id="preset"></select>
    <label>내보내기 (결정적 — 동일 입력 → 바이트 동일)</label>
    <div class="row">
      <button id="exportPng" type="button">PNG</button>
      <button id="exportSvg" type="button">SVG</button>
    </div>
    <div id="info"></div>
    <div id="error"></div>
  </div>
  <div id="stage"><canvas id="view"></canvas></div>
</main>
<footer>동일 입력 → 결정적 출력 · 데이터 계약은 SPEC §4.4 (원판 median 순서 + Δmin) 뿐</footer>

<script type="module">
// Trilume 단일 파일 로더 — blob URL 로 ESM 모듈을 등록한 뒤 app 을 동적 import 한다.
// (tools/build-single.mjs 로 생성됨 — 직접 수정하지 말 것)
const MODULES = [
  ["hexgrid", "/**\n * hexgrid.js — 육각 격자 + rhombille 3면 분할 기하 (SPEC §3, §7.2)\n *\n * 좌표 규약 (여기서 한 번 못 박고 전 모듈이 따른다):\n *\n * - 정육각형 **pointy-top**. 꼭짓점 하나가 화면 위를 정확히 가리킨다.\n * - `size` = 육각형 **외접원 반지름**(중심 → 꼭짓점). 변의 길이와 같다.\n * - axial 좌표 `(q, r)`. q 는 화면 오른쪽, r 은 오른쪽-아래.\n * - 화면 좌표는 **y 아래가 양수**(canvas 관례). 따라서 \"위\"는 y 가 작은 쪽이다.\n * - 꼭짓점 인덱스 0..5 는 상단 꼭짓점에서 시작해 **화면상 시계방향**.\n *\n *     size=1, 중심 원점 기준 꼭짓점 (이 값이 전 파이프라인의 기준이다):\n *       0 (  0        , -1   )  상단\n *       1 (  √3/2     , -0.5 )  우상\n *       2 (  √3/2     , +0.5 )  우하\n *       3 (  0        , +1   )  하단\n *       4 ( -√3/2     , +0.5 )  좌하\n *       5 ( -√3/2     , -0.5 )  좌상\n *\n * rhombille 분할 (SPEC §3.2):\n *\n * - 중심에서 **교대(alternating) 꼭짓점 3개**(0, 2, 4)로 선을 그어 육각형을 3개의\n *   60°/120° 마름모로 나눈다. 마름모는 `[중심, V(s-1), V(s), V(s+1)]` 이고\n *   `s` 는 그 면의 \"spine\" 꼭짓점이다. 네 변 길이가 모두 `size` 로 같다.\n * - 면 라벨은 아이소메트릭 큐브 은유:\n *     T = 상단면  → spine 꼭짓점 0 (위)\n *     L = 좌측면  → spine 꼭짓점 4 (좌하)\n *     R = 우측면  → spine 꼭짓점 2 (우하)\n * - **코드 전역 방향 기준이며 셀별 회전은 없다.** 면 오프셋은 모든 셀에서 동일하다.\n *\n * 이 모듈은 순수 기하만 다룬다. Node 전용 API 를 쓰지 않으므로 브라우저에서\n * `<script type=\"module\">` 로 그대로 로드된다.\n */\n\n/** √3. 육각 격자 산술이 전부 여기 걸려 있어 한 번만 계산해 둔다. */\nexport const SQRT3 = Math.sqrt(3);\n\n/** √3/2 — pointy-top 육각형의 \"가로 반폭\" 계수. */\nconst H = SQRT3 / 2;\n\n/** 면 라벨. 순서는 SPEC §4.1 의 순위 배열 `(T, L, R)` 과 동일하게 고정한다. */\nexport const FACES = Object.freeze(['T', 'L', 'R']);\n\n/**\n * 면 → spine 꼭짓점 인덱스.\n * 교대 꼭짓점 {0, 2, 4} 만 spine 이 된다 (rhombille 분할의 정의).\n */\nexport const FACE_SPINE_CORNER = Object.freeze({ T: 0, L: 4, R: 2 });\n\n/** axial 이웃 방향 6개 (시계방향 아님 — 관례적 순서). */\nexport const AXIAL_DIRECTIONS = Object.freeze([\n  Object.freeze({ q: 1, r: 0 }),\n  Object.freeze({ q: 1, r: -1 }),\n  Object.freeze({ q: 0, r: -1 }),\n  Object.freeze({ q: -1, r: 0 }),\n  Object.freeze({ q: -1, r: 1 }),\n  Object.freeze({ q: 0, r: 1 }),\n]);\n\n/**\n * size=1 기준 꼭짓점 오프셋. 삼각함수로 매번 계산하면 부동소수 잡음이 끼므로\n * 닫힌 형태 상수로 박아 둔다 (0 은 정확히 0 이어야 한다).\n */\nexport const CORNER_UNIT_OFFSETS = Object.freeze([\n  Object.freeze({ x: 0, y: -1 }),\n  Object.freeze({ x: H, y: -0.5 }),\n  Object.freeze({ x: H, y: 0.5 }),\n  Object.freeze({ x: 0, y: 1 }),\n  Object.freeze({ x: -H, y: 0.5 }),\n  Object.freeze({ x: -H, y: -0.5 }),\n]);\n\n/** 넓이·거리 계수 (size 의 거듭제곱 계수). 렌더러/디코더가 재계산하지 않도록 노출. */\nexport const HEX_AREA_COEFF = (3 * SQRT3) / 2; // 육각형 넓이 = coeff · size²\nexport const FACE_AREA_COEFF = SQRT3 / 2; //     마름모 넓이 = coeff · size²\nexport const FACE_INRADIUS_COEFF = SQRT3 / 4; //  마름모 내접원 반지름 = coeff · size\nexport const CENTER_SPACING_COEFF = SQRT3; //     인접 셀 중심 간 거리 = coeff · size\n\n/** 기본 레이아웃: 단위 크기, 원점 (0,0). */\nexport const DEFAULT_LAYOUT = Object.freeze({ size: 1, originX: 0, originY: 0 });\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레이아웃\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 레이아웃 정규화. `{ size, originX, originY }` 만 읽고 나머지 필드는 무시하므로\n * `layoutForRegion()` 결과(width/height 포함)를 그대로 넘겨도 된다.\n * @param {{size?: number, originX?: number, originY?: number}} [layout]\n * @returns {{size: number, originX: number, originY: number}}\n */\nexport function normalizeLayout(layout) {\n  if (layout === undefined || layout === null) return DEFAULT_LAYOUT;\n  const size = layout.size === undefined ? 1 : layout.size;\n  const originX = layout.originX === undefined ? 0 : layout.originX;\n  const originY = layout.originY === undefined ? 0 : layout.originY;\n  if (!Number.isFinite(size) || size <= 0) {\n    throw new RangeError(`size 는 유한한 양수여야 한다: ${size}`);\n  }\n  if (!Number.isFinite(originX) || !Number.isFinite(originY)) {\n    throw new RangeError(`origin 은 유한해야 한다: (${originX}, ${originY})`);\n  }\n  return { size, originX, originY };\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < 0) {\n    throw new RangeError(`반경 k 는 0 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\nfunction assertFace(face) {\n  if (!Object.prototype.hasOwnProperty.call(FACE_SPINE_CORNER, face)) {\n    throw new RangeError(`면 라벨은 T | L | R 이어야 한다: ${face}`);\n  }\n  return face;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 육각 영역 (SPEC §3.1)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial 원점으로부터의 육각 거리(링 번호). */\nexport function hexDistance(q, r) {\n  return (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2;\n}\n\n/** 반경 k 육각 영역에 속하는가. */\nexport function isInRegion(q, r, k) {\n  assertRadius(k);\n  return hexDistance(q, r) <= k;\n}\n\n/** 반경 k 육각 영역의 셀 수 = 3k² + 3k + 1 (SPEC §3.1). */\nexport function cellCount(k) {\n  assertRadius(k);\n  return 3 * k * k + 3 * k + 1;\n}\n\n/**\n * 반경 k 육각 영역의 모든 셀. 순서는 q 오름차순 → r 오름차순으로 **결정적**이다.\n * (M0 완료 기준이 \"동일 입력 → 결정적 출력\"이므로 순회 순서를 계약으로 고정한다.)\n * @returns {{q: number, r: number}[]}\n */\nexport function regionCells(k) {\n  assertRadius(k);\n  const cells = [];\n  for (let q = -k; q <= k; q++) {\n    const rMin = Math.max(-k, -q - k);\n    const rMax = Math.min(k, -q + k);\n    // `+ 0` 은 -0 정규화다. k=0 일 때 `-k` 가 -0 이 되어 deepStrictEqual·JSON\n    // 비교에서 0 과 갈린다 (결정적 출력 계약을 조용히 깬다).\n    for (let r = rMin; r <= rMax; r++) cells.push({ q: q + 0, r: r + 0 });\n  }\n  return cells;\n}\n\n/** 셀의 6 이웃 axial 좌표. */\nexport function neighbors(q, r) {\n  return AXIAL_DIRECTIONS.map((d) => ({ q: q + d.q, r: r + d.r }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 좌표 변환 (axial ↔ 픽셀). y 는 아래가 양수.\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial → 픽셀 중심 좌표. */\nexport function axialToPixel(q, r, layout) {\n  const { size, originX, originY } = normalizeLayout(layout);\n  return {\n    x: originX + size * SQRT3 * (q + r / 2),\n    y: originY + size * 1.5 * r,\n  };\n}\n\n/** 픽셀 → 실수 axial 좌표 (반올림 전). */\nexport function pixelToAxialFractional(x, y, layout) {\n  const { size, originX, originY } = normalizeLayout(layout);\n  const px = x - originX;\n  const py = y - originY;\n  const r = (2 / 3) * (py / size);\n  const q = px / (size * SQRT3) - r / 2;\n  return { q, r };\n}\n\n/**\n * 실수 axial → 가장 가까운 정수 axial (cube 반올림).\n * 셋 중 오차가 가장 큰 성분을 나머지 둘로부터 복원해 q+r+s=0 을 유지한다.\n */\nexport function axialRound(qf, rf) {\n  const xf = qf;\n  const zf = rf;\n  const yf = -xf - zf;\n  let rx = Math.round(xf);\n  let ry = Math.round(yf);\n  let rz = Math.round(zf);\n  const dx = Math.abs(rx - xf);\n  const dy = Math.abs(ry - yf);\n  const dz = Math.abs(rz - zf);\n  if (dx > dy && dx > dz) rx = -ry - rz;\n  else if (dy > dz) ry = -rx - rz;\n  else rz = -rx - ry;\n  // -0 정규화: deepStrictEqual 및 직렬화에서 0 과 -0 이 갈리는 것을 막는다.\n  return { q: rx + 0, r: rz + 0 };\n}\n\n/** 픽셀 → 가장 가까운 셀의 axial 좌표. 디코더가 격자 스냅에 쓴다. */\nexport function pixelToAxial(x, y, layout) {\n  const { q, r } = pixelToAxialFractional(x, y, layout);\n  return axialRound(q, r);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 육각형\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 육각형 넓이 = (3√3/2)·size². */\nexport function hexArea(size) {\n  return HEX_AREA_COEFF * size * size;\n}\n\n/** 꼭짓점 i 의 중심 기준 오프셋. */\nexport function hexCornerOffset(i, size) {\n  const u = CORNER_UNIT_OFFSETS[((i % 6) + 6) % 6];\n  return { x: u.x * size, y: u.y * size };\n}\n\n/**\n * 셀 (q,r) 의 육각형 꼭짓점 6개. 인덱스 0 = 상단, 이후 화면상 시계방향.\n * @returns {{x: number, y: number}[]}\n */\nexport function hexCorners(q, r, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  return CORNER_UNIT_OFFSETS.map((u) => ({\n    x: c.x + u.x * norm.size,\n    y: c.y + u.y * norm.size,\n  }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// rhombille 3면 분할 (SPEC §3.2)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 마름모 한 면의 넓이 = (√3/2)·size². 육각형 넓이의 정확히 1/3. */\nexport function faceArea(size) {\n  return FACE_AREA_COEFF * size * size;\n}\n\n/** 마름모 내접원 반지름 = (√3/4)·size. (= 마름모 높이의 절반) */\nexport function faceInradius(size) {\n  return FACE_INRADIUS_COEFF * size;\n}\n\n/**\n * 면의 마름모 폴리곤 (중심 기준 오프셋). 셀별 회전이 없으므로 모든 셀에서 동일하다.\n * 정점 순서: [중심, spine 이전 꼭짓점, spine 꼭짓점, spine 다음 꼭짓점].\n * 세 면 모두 같은 감김(winding)을 가진다.\n * @returns {{x: number, y: number}[]} 길이 4\n */\nexport function facePolygonOffsets(face, size) {\n  assertFace(face);\n  const s = FACE_SPINE_CORNER[face];\n  const idx = [(s + 5) % 6, s, (s + 1) % 6];\n  const poly = [{ x: 0, y: 0 }];\n  for (const i of idx) {\n    const u = CORNER_UNIT_OFFSETS[i];\n    poly.push({ x: u.x * size, y: u.y * size });\n  }\n  return poly;\n}\n\n/** 면의 마름모 폴리곤 (절대 픽셀 좌표). */\nexport function facePolygon(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  return facePolygonOffsets(face, norm.size).map((p) => ({\n    x: c.x + p.x,\n    y: c.y + p.y,\n  }));\n}\n\n/**\n * 면 중심(마름모 중심 = 두 대각선의 교점) 오프셋.\n * 중심 ↔ spine 꼭짓점 대각선의 중점이므로 spine 방향으로 size/2 떨어진 점이다.\n */\nexport function faceCentroidOffset(face, size) {\n  assertFace(face);\n  const u = CORNER_UNIT_OFFSETS[FACE_SPINE_CORNER[face]];\n  return { x: (u.x * size) / 2, y: (u.y * size) / 2 };\n}\n\n/** 면 중심 (절대 픽셀 좌표). */\nexport function faceCentroid(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  const o = faceCentroidOffset(face, norm.size);\n  return { x: c.x + o.x, y: c.y + o.y };\n}\n\n/**\n * 면의 내접원. 마름모는 접선다각형이므로 내접원 중심 = 마름모 중심이고\n * 반지름 = 네 변까지의 거리 = (√3/4)·size 로 모두 같다.\n * @returns {{x: number, y: number, radius: number}}\n */\nexport function faceIncircle(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = faceCentroid(q, r, face, norm);\n  return { x: c.x, y: c.y, radius: faceInradius(norm.size) };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 샘플링 영역 (SPEC §7.2)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * SPEC §7.2 는 \"면당 내접원 50% 영역 median\" 이라고만 쓰여 있다.\n * 50% 가 **반지름 비율**인지 **넓이 비율**인지 문서에서 확정되지 않았다 (open question).\n * 그래서 확정하지 않고 파라미터로 노출한다.\n *\n * 기본값 `'radius'` 를 고른 근거: SPEC §11 리스크 표가 이 규칙의 목적을\n * \"마름모 예각 뭉개짐으로 인한 샘플링 오염 방지\" 로 못 박고 있다. 세 해석 중\n * 반지름 50% 가 가장 보수적(= 가장 작은 영역, 예각에서 가장 멀다)이므로,\n * 실측(M1) 전까지의 기본값으로 안전한 쪽을 잡았다. 확정되면 이 줄을 갱신한다.\n */\nexport const SAMPLE_FRACTION_DEFAULT = 0.5;\nexport const SAMPLE_FRACTION_OF_DEFAULT = 'radius';\n\n/** 지원하는 비율 해석 모드. */\nexport const SAMPLE_FRACTION_MODES = Object.freeze([\n  'radius', //        r = fraction · 내접원 반지름\n  'incircleArea', //  넓이 = fraction · 내접원 넓이   → r = √fraction · 내접원 반지름\n  'faceArea', //      넓이 = fraction · 마름모 넓이   → r = √(fraction · faceArea / π)\n]);\n\n/**\n * 면의 샘플링 원판. 반지름은 항상 내접원 반지름으로 클램프된다 —\n * 샘플링 영역이 마름모 밖으로 새면 인접 면의 휘도가 섞여 순위가 오염되기 때문에,\n * 파라미터가 과하게 크더라도 조용히 마름모를 벗어나게 두지 않는다.\n *\n * @param {number} q\n * @param {number} r\n * @param {'T'|'L'|'R'} face\n * @param {object} [layout]\n * @param {{fraction?: number, fractionOf?: 'radius'|'incircleArea'|'faceArea'}} [options]\n * @returns {{x: number, y: number, radius: number, clamped: boolean}}\n */\nexport function faceSampleDisc(q, r, face, layout, options) {\n  const norm = normalizeLayout(layout);\n  const opts = options || {};\n  const fraction =\n    opts.fraction === undefined ? SAMPLE_FRACTION_DEFAULT : opts.fraction;\n  const fractionOf =\n    opts.fractionOf === undefined ? SAMPLE_FRACTION_OF_DEFAULT : opts.fractionOf;\n\n  if (!Number.isFinite(fraction) || fraction <= 0 || fraction > 1) {\n    throw new RangeError(`fraction 은 (0, 1] 범위여야 한다: ${fraction}`);\n  }\n  if (!SAMPLE_FRACTION_MODES.includes(fractionOf)) {\n    throw new RangeError(\n      `fractionOf 는 ${SAMPLE_FRACTION_MODES.join(' | ')} 중 하나여야 한다: ${fractionOf}`,\n    );\n  }\n\n  const inradius = faceInradius(norm.size);\n  let radius;\n  if (fractionOf === 'radius') {\n    radius = fraction * inradius;\n  } else if (fractionOf === 'incircleArea') {\n    radius = Math.sqrt(fraction) * inradius;\n  } else {\n    radius = Math.sqrt((fraction * faceArea(norm.size)) / Math.PI);\n  }\n\n  const clamped = radius > inradius;\n  if (clamped) radius = inradius;\n\n  const c = faceCentroid(q, r, face, norm);\n  return { x: c.x, y: c.y, radius, clamped };\n}\n\n/**\n * 한 셀의 세 면 샘플링 원판을 한꺼번에. 디코더가 셀 단위로 순회하므로 편의 제공.\n * @returns {{T: object, L: object, R: object}}\n */\nexport function cellSampleDiscs(q, r, layout, options) {\n  const norm = normalizeLayout(layout);\n  const out = {};\n  for (const face of FACES) out[face] = faceSampleDisc(q, r, face, norm, options);\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 바운딩 박스 (렌더러가 캔버스 크기 정하는 데 사용)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 코드 영역 전체의 축정렬 바운딩 박스.\n *\n * 닫힌 형태로 계산한다:\n *   가로 반폭 = √3·size·(k + 1/2)   — 최대 (q + r/2) 는 k 이고 여기에 반폭 √3/2·size\n *   세로 반폭 = size·(1.5k + 1)     — 최대 r 은 k 이고 여기에 하단 꼭짓점 size\n * (테스트가 전 셀 꼭짓점 전수 조사와 대조해 이 식을 검증한다.)\n *\n * @returns {{minX,minY,maxX,maxY,width,height}}\n */\nexport function codeBounds(k, layout) {\n  assertRadius(k);\n  const { size, originX, originY } = normalizeLayout(layout);\n  const halfW = SQRT3 * size * (k + 0.5);\n  const halfH = size * (1.5 * k + 1);\n  return {\n    minX: originX - halfW,\n    minY: originY - halfH,\n    maxX: originX + halfW,\n    maxY: originY + halfH,\n    width: 2 * halfW,\n    height: 2 * halfH,\n  };\n}\n\n/**\n * 반경 k 코드를 여백 `margin` 과 함께 담는 캔버스 레이아웃.\n * 반환값을 그대로 layout 으로 넘길 수 있다 (size/originX/originY 포함).\n *\n * @param {number} k\n * @param {{size?: number, margin?: number}} [options]\n * @returns {{k, size, margin, originX, originY, width, height}}\n */\nexport function layoutForRegion(k, options) {\n  assertRadius(k);\n  const opts = options || {};\n  const size = opts.size === undefined ? 1 : opts.size;\n  const margin = opts.margin === undefined ? 0 : opts.margin;\n  if (!Number.isFinite(size) || size <= 0) {\n    throw new RangeError(`size 는 유한한 양수여야 한다: ${size}`);\n  }\n  if (!Number.isFinite(margin) || margin < 0) {\n    throw new RangeError(`margin 은 0 이상이어야 한다: ${margin}`);\n  }\n  const b = codeBounds(k, { size, originX: 0, originY: 0 });\n  return {\n    k,\n    size,\n    margin,\n    originX: margin - b.minX,\n    originY: margin - b.minY,\n    width: b.width + 2 * margin,\n    height: b.height + 2 * margin,\n  };\n}\n"],
  ["lehmer", "// lehmer.js — base-6 digit ↔ (T,L,R) 휘도 순위 매핑\n//\n// SPEC §4.1 계약:\n//   셀당 3면(T=상단, L=좌측, R=우측)에 서로 다른 휘도 순위 {0=어두움, 1=중간, 2=밝음}을\n//   배정한다. 3! = 6 가지 → 심볼 알파벳 = base-6 digit {0..5}.\n//\n// 이 모듈은 SPEC §4.1 의 표를 **하드코딩하지 않는다.** 표준 Lehmer 코드\n// (factorial number system) 로부터 알고리즘적으로 유도한다. 유도 규약은 다음 셋의 조합이며,\n// 이 조합만이 SPEC 표 6행 전부를 재현한다 (test/lehmer.test.js 가 이를 단언한다):\n//\n//   (1) factoradic 자릿수는 **최상위 우선**(MSD-first):\n//         d = L[0]·2! + L[1]·1! + L[2]·0!,  L[i] ∈ [0, n-1-i]\n//   (2) 알파벳은 면의 **정준 오름차순** [T, L, R] (인덱스 0,1,2)\n//   (3) Lehmer 가 뽑아낸 순열은 \"**밝은 면부터 어두운 면 순서**\"로 읽는다.\n//         → 위치 i 에 놓인 면의 순위 = (n-1) - i\n//\n// (3) 이 핵심이다. Lehmer 순열을 \"면별 순위\"로 곧이곧대로 읽으면 SPEC 표와 어긋난다\n// (그 둘은 서로 역순열 관계). \"순위별 면의 나열\"로 읽고 내림차순 순위를 배정해야\n// SPEC 표가 나온다.\n//\n// 유도 예 (d=3):\n//   factoradic(3) = [1,1,0]\n//   pool=[T,L,R] → L 선택 → pool=[T,R] → R 선택 → pool=[T] → T\n//   밝기순 나열 = [L, R, T]  → L=2(밝음), R=1(중간), T=0(어두움)\n//   → (T,L,R) = (0,2,1)   == SPEC §4.1 digit 3 ✓\n\n/** 면 라벨 정준 순서. 인덱스가 곧 Lehmer 알파벳의 순서다 (SPEC §3.2). */\nexport const FACES = Object.freeze(['T', 'L', 'R']);\n\n/** 면의 개수 n. 순열 개수 = n! = 6. */\nexport const FACE_COUNT = FACES.length;\n\n/** 심볼 알파벳 크기 = 3! = 6 (SPEC §4.1). */\nexport const RADIX = factorial(FACE_COUNT);\n\n/** 최대 순위 값 (2 = 가장 밝음). */\nexport const MAX_RANK = FACE_COUNT - 1;\n\n/** 팩토리얼. n 이 3 이라 재귀 깊이 걱정 없음. */\nfunction factorial(n) {\n  let acc = 1;\n  for (let i = 2; i <= n; i += 1) acc *= i;\n  return acc;\n}\n\n/**\n * digit → factoradic (Lehmer) 자릿수 배열. 최상위 우선.\n * L[i] ∈ [0, n-1-i], 가중치 (n-1-i)!.\n * @param {number} digit 0..n!-1\n * @param {number} n 원소 개수\n * @returns {number[]} 길이 n 의 Lehmer 코드\n */\nexport function toLehmerCode(digit, n = FACE_COUNT) {\n  assertDigit(digit);\n  const code = new Array(n);\n  let rest = digit;\n  for (let i = 0; i < n; i += 1) {\n    const weight = factorial(n - 1 - i);\n    code[i] = Math.floor(rest / weight);\n    rest -= code[i] * weight;\n  }\n  return code;\n}\n\n/**\n * factoradic (Lehmer) 자릿수 배열 → digit. `toLehmerCode` 의 역.\n * @param {number[]} code\n * @returns {number}\n */\nexport function fromLehmerCode(code) {\n  const n = code.length;\n  let digit = 0;\n  for (let i = 0; i < n; i += 1) {\n    const limit = n - 1 - i;\n    if (!Number.isInteger(code[i]) || code[i] < 0 || code[i] > limit) {\n      throw new RangeError(`Lehmer 코드 자릿수 범위 위반: code[${i}]=${code[i]}, 허용 0..${limit}`);\n    }\n    digit += code[i] * factorial(limit);\n  }\n  return digit;\n}\n\n/**\n * digit → 밝은 면부터 어두운 면 순서로 나열한 **면 인덱스 배열**.\n * 위 규약 (3) 의 중간 산출물이며, 렌더러 디버깅에 유용해 공개한다.\n * @param {number} digit 0..5\n * @returns {number[]} 예: digit 3 → [1, 2, 0]  (L, R, T 순으로 밝음)\n */\nexport function digitToBrightnessOrder(digit) {\n  const code = toLehmerCode(digit, FACE_COUNT);\n  // pool: 아직 배치되지 않은 면 인덱스 (정준 오름차순 유지)\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const order = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    order[i] = pool.splice(code[i], 1)[0];\n  }\n  return order;\n}\n\n/**\n * 밝기순 면 인덱스 배열 → digit. `digitToBrightnessOrder` 의 역.\n * @param {number[]} order\n * @returns {number}\n */\nexport function brightnessOrderToDigit(order) {\n  assertPermutation(order, FACE_COUNT, '밝기 순서');\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const code = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    const at = pool.indexOf(order[i]);\n    code[i] = at;\n    pool.splice(at, 1);\n  }\n  return fromLehmerCode(code);\n}\n\n/**\n * SPEC §4.1: digit → 각 면의 휘도 순위.\n * @param {number} digit 0..5\n * @returns {{T: number, L: number, R: number}} 각 값은 {0,1,2} 의 순열\n */\nexport function digitToRanks(digit) {\n  const order = digitToBrightnessOrder(digit);\n  const byFace = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    // 위치 i 는 i 번째로 밝은 면 → 순위 = MAX_RANK - i\n    byFace[order[i]] = MAX_RANK - i;\n  }\n  // 키 삽입 순서는 반드시 정준 FACES 순서 ['T','L','R'] 여야 한다.\n  // 밝기 순서대로 삽입하면 digit 마다 키 순서가 달라져 (a) Object.values() 가\n  // 어떤 digit 이든 항상 [2,1,0] 을 내고 (b) JSON.stringify 결과가 digit 별로\n  // 갈린다. M0 완료 기준이 \"동일 입력 → 결정적 출력\" 이라 여기가 정확히 함정이다.\n  const ranks = {};\n  for (let i = 0; i < FACE_COUNT; i += 1) ranks[FACES[i]] = byFace[i];\n  return ranks;\n}\n\n/**\n * SPEC §4.1 의 역: 각 면의 휘도 순위 → digit.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number} 0..5\n */\nexport function ranksToDigit(ranks) {\n  const arr = ranksToArray(ranks);\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  // 순위 배열의 역: 순위 r 을 가진 면이 (MAX_RANK - r) 번째로 밝다\n  const order = new Array(FACE_COUNT);\n  for (let f = 0; f < FACE_COUNT; f += 1) {\n    order[MAX_RANK - arr[f]] = f;\n  }\n  return brightnessOrderToDigit(order);\n}\n\n/**\n * 순위 객체 → 정준 순서(T,L,R) 배열. 렌더러/디코더가 배열 형태를 선호할 때 사용.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number[]}\n */\nexport function ranksToArray(ranks) {\n  if (ranks === null || typeof ranks !== 'object') {\n    throw new TypeError('순위는 {T,L,R} 객체여야 한다');\n  }\n  return FACES.map((face) => ranks[face]);\n}\n\n/**\n * 정준 순서(T,L,R) 배열 → 순위 객체.\n * @param {number[]} arr\n * @returns {{T: number, L: number, R: number}}\n */\nexport function arrayToRanks(arr) {\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  const ranks = {};\n  FACES.forEach((face, i) => { ranks[face] = arr[i]; });\n  return ranks;\n}\n\n/**\n * 순위 객체가 유효한가 ({0..2} 의 순열인가).\n * @param {unknown} ranks\n * @returns {boolean}\n */\nexport function isValidRanks(ranks) {\n  try {\n    assertPermutation(ranksToArray(/** @type {any} */ (ranks)), FACE_COUNT, '면 순위');\n    return true;\n  } catch {\n    return false;\n  }\n}\n\n/**\n * 유도된 매핑 표 전체 (digit 0..5). 테스트·문서·디버깅용.\n * @returns {{digit: number, ranks: {T: number, L: number, R: number}}[]}\n */\nexport function mappingTable() {\n  const rows = [];\n  for (let d = 0; d < RADIX; d += 1) rows.push({ digit: d, ranks: digitToRanks(d) });\n  return rows;\n}\n\nfunction assertDigit(digit) {\n  if (!Number.isInteger(digit) || digit < 0 || digit >= RADIX) {\n    throw new RangeError(`digit 범위 위반: ${digit} (허용 0..${RADIX - 1})`);\n  }\n}\n\nfunction assertPermutation(arr, n, what) {\n  if (!Array.isArray(arr) || arr.length !== n) {\n    throw new TypeError(`${what}는 길이 ${n} 배열이어야 한다`);\n  }\n  const seen = new Set();\n  for (const v of arr) {\n    if (!Number.isInteger(v) || v < 0 || v >= n) {\n      throw new RangeError(`${what} 원소 범위 위반: ${v} (허용 0..${n - 1})`);\n    }\n    if (seen.has(v)) throw new RangeError(`${what}에 중복 값: ${v}`);\n    seen.add(v);\n  }\n}\n"],
  ["gfp", "/**\n * gfp.js — 소수체 GF(p), p = 211 산술 + 다항식 연산\n *\n * ADR 0001 §2.3·§6: RS 부호를 셀 도메인(3 digit = 1 심볼, 알파벳 크기 216)에서\n * 직접 걸려면 216 이하 최대 소수인 **211** 위의 체가 필요하다. 6³=216 자체는\n * 소수거듭제곱이 아니라서(2³·3³) 체를 이루지 못한다 — GF(6³) 은 \"비표준\"이\n * 아니라 **존재하지 않는다**.\n *\n * ⚠ 표수가 2 가 아니다. GF(2^8)(`gf256.js`) 습관을 그대로 옮기면 전부 틀린다.\n *   - **뺄셈 ≠ 덧셈.** GF(2^m) 에서는 -a = a (XOR 자기역) 이지만 GF(p), p 홀수\n *     소수에서는 -a = p - a ≠ a (a≠0 일 때). `sub` 를 `add` 로 대체하면 안 된다.\n *   - **부호가 실재한다.** 오류 크기(Forney)·다항식 뺄셈 전부에서 부호를\n *     놓치면 \"조용히\" 틀린 값이 나온다 (XOR 세계와 달리 대칭이 없어 자가진단이\n *     안 된다) — 검증 라운드가 이 함정을 실제로 실증했다(ADR §6 리스크표).\n *   - **형식적 미분 계수도 다르다.** GF(2^m) 은 짝수차항이 미분에서 소멸하는\n *     \"홀수항 트릭\"을 쓰지만, GF(p) 의 형식적 미분은 일반 미적분과 같다:\n *     d/dx (c_k x^k) = (k mod p)·c_k · x^(k-1). 홀수항 트릭을 복사하면 틀린다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다 (Node 전용 API 없음).\n *\n * ── 다항식 표현 규약 ─────────────────────────────────────────────────────\n * `gf256.js` 와 동일하게 **big-endian(내림차순)** 계수 배열을 기본으로 쓴다.\n *   poly[0] = 최고차항 계수, poly[poly.length - 1] = 상수항\n * (RS 복호 내부의 Λ(x)·Ω(x) 는 `rs211.js` 안에서 little-endian 을 따로 쓰며\n *  그 파일에 명시돼 있다 — gfp.js 는 big-endian 만 다룬다.)\n */\n\n/** 체의 위수(소수) — 6³ = 216 이하 최대 소수. ADR 0001 §2.3 근거 2. */\nexport const P = 211;\n\n/** 곱셈군 위수 |GF(211)^*| = 210 = 2·3·5·7 */\nexport const MULTIPLICATIVE_ORDER = P - 1; // 210\n\n/** 210 의 소인수 — 생성원 위수 검증에 쓴다 (210 = 2·3·5·7). */\nconst ORDER_PRIME_FACTORS = Object.freeze([2, 3, 5, 7]);\n\n// ── 스칼라 연산 (테이블 독립, 체 생성보다 먼저 필요) ────────────────────\n\n/** a + b mod p */\nexport function add(a, b) {\n  return (a + b) % P;\n}\n\n/**\n * a - b mod p.\n * **뺄셈 ≠ 덧셈.** JS 의 `%` 는 음수를 남길 수 있으므로 +P 로 보정한다.\n */\nexport function sub(a, b) {\n  return ((a - b) % P + P) % P;\n}\n\n/** a * b mod p */\nexport function mul(a, b) {\n  return (a * b) % P;\n}\n\n/**\n * a^n mod p (n >= 0). 반복 제곱(square-and-multiply).\n * 체 생성(테이블 구축) 이전에도 써야 하므로 테이블에 의존하지 않는다.\n */\nexport function modPow(a, n) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`modPow 의 지수는 0 이상 정수여야 한다: ${n}`);\n  }\n  let base = ((a % P) + P) % P;\n  let exp = n;\n  let result = 1;\n  while (exp > 0) {\n    if (exp & 1) result = mul(result, base);\n    base = mul(base, base);\n    exp >>= 1;\n  }\n  return result;\n}\n\n/**\n * a 의 곱셈 역원. **페르마의 소정리** a^(p-2) ≡ a^-1 (mod p) 를 쓴다.\n *\n * 선택 근거: p 가 작은 소수(211)라 `modPow` 반복제곱이 최대 ~8 회 곱셈으로\n * 끝나 확장 유클리드 호제법과 성능 차이가 무의미하고, 나눗셈 없는 곱셈만\n * 쓰므로 구현이 짧고 부호 실수가 끼어들 자리가 없다(확장 유클리드는 몫·나머지\n * 부호 처리가 또 다른 함정이다 — 이 파일 상단 경고와 같은 종류의 실수).\n */\nexport function inverse(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) 0 의 역원은 없다');\n  return modPow(aa, P - 2);\n}\n\n/** a / b mod p */\nexport function div(a, b) {\n  return mul(a, inverse(b));\n}\n\n// ── 생성원 탐색 + exp/log 테이블 ─────────────────────────────────────────\n\n/**\n * g 가 GF(211)^* (위수 210) 의 원시원소(생성원)인지 판정한다.\n * 정의: g^210 = 1 (페르마 소정리로 항상 참) 이고, 210 의 모든 소인수 q 에\n * 대해 g^(210/q) ≠ 1. 이 조건이 위수가 정확히 210(= 부분군 아님)임을 보장한다.\n */\nfunction isPrimitiveRoot(g) {\n  if (modPow(g, MULTIPLICATIVE_ORDER) !== 1) return false; // 안전망 (항상 참이어야 함)\n  for (const q of ORDER_PRIME_FACTORS) {\n    if (modPow(g, MULTIPLICATIVE_ORDER / q) === 1) return false;\n  }\n  return true;\n}\n\n/**\n * 최소 생성원을 계산으로 찾는다 (외우지 않는다 — ADR 지시).\n * 2..p-1 을 순회하며 `isPrimitiveRoot` 로 검증한 첫 값을 쓴다.\n */\nfunction findGenerator() {\n  for (let g = 2; g < P; g++) {\n    if (isPrimitiveRoot(g)) return g;\n  }\n  throw new Error('GF(211) 에서 원시원소를 찾지 못했다 — 산술 구현 버그');\n}\n\n/** 생성원 α. 계산으로 찾되(=2), 값 자체를 export 해 테스트가 재검증할 수 있게 한다. */\nexport const GENERATOR = findGenerator();\n\n/**\n * EXP[i] = α^i mod p, i = 0..209.\n * LOG[EXP[i]] = i (log(0) 은 정의되지 않음 → -1 센티넬).\n *\n * 주기가 210(= MULTIPLICATIVE_ORDER)이다 — GF(2^8) 의 255 와 다르다.\n * 길이를 2*210 으로 잡아 mul/div 색인에서 mod 없이 더할 수 있게 한다.\n */\nconst EXP = new Uint8Array(2 * MULTIPLICATIVE_ORDER);\nconst LOG = new Int16Array(P).fill(-1);\n\n{\n  let x = 1;\n  for (let i = 0; i < MULTIPLICATIVE_ORDER; i++) {\n    if (LOG[x] !== -1) {\n      throw new Error(`생성원 ${GENERATOR} 검증 실패 — 주기가 210 미만이다 (i=${i})`);\n    }\n    EXP[i] = x;\n    LOG[x] = i;\n    x = mul(x, GENERATOR);\n  }\n  if (x !== 1) {\n    throw new Error('GF(211) 생성원 순환 검증 실패 — α^210 ≠ 1');\n  }\n  for (let i = MULTIPLICATIVE_ORDER; i < EXP.length; i++) {\n    EXP[i] = EXP[i - MULTIPLICATIVE_ORDER];\n  }\n}\n\nexport { EXP, LOG };\n\n/** 이산로그. log(0) 은 정의되지 않으므로 예외. */\nexport function log(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) log(0) 은 정의되지 않는다');\n  return LOG[aa];\n}\n\n/**\n * α^n. n 은 음수·210 이상도 허용한다 (mod 210 으로 감싼다).\n * 테이블 기반이라 `modPow` 보다 빠르고, 체 구축 이후의 정상 경로다.\n */\nexport function alphaPow(n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const e = ((n % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n/**\n * 테이블 기반 거듭제곱 a^n (n 은 음수 허용, a ≠ 0 이어야 함 — 0 은 `modPow` 로).\n * 관례: 0^0 = 1(빈 곱), 0^n(n>0) = 0, 0^n(n<0) 은 예외.\n */\nexport function pow(a, n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) {\n    if (n === 0) return 1;\n    if (n < 0) throw new RangeError('GF(211) 0 의 음수 거듭제곱은 정의되지 않는다');\n    return 0;\n  }\n  const e = (((LOG[aa] * n) % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n// ── 다항식 연산 (big-endian: index 0 = 최고차) ────────────────────────────\n\n/** p(x) * scalar */\nexport function polyScale(p, scalar) {\n  const out = new Uint8Array(p.length);\n  for (let i = 0; i < p.length; i++) out[i] = mul(p[i], scalar);\n  return out;\n}\n\n/** p(x) + q(x). 길이가 다르면 **상수항 기준(오른쪽)** 으로 정렬해 더한다. */\nexport function polyAdd(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = add(out[idx], q[i]);\n  }\n  return out;\n}\n\n/**\n * p(x) - q(x). **표수 2 가 아니므로 `polyAdd` 와 다른 결과다.**\n * (`gf256.js` 에는 이 함수가 없다 — 거기서는 sub === add 라서 불필요했다.)\n */\nexport function polySub(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = sub(out[idx], q[i]);\n  }\n  return out;\n}\n\n/** p(x) * q(x) */\nexport function polyMul(p, q) {\n  if (p.length === 0 || q.length === 0) return new Uint8Array(0);\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) {\n      out[i + j] = add(out[i + j], mul(pi, q[j]));\n    }\n  }\n  return out;\n}\n\n/** 선행 0 계수를 제거한다. 전부 0 이면 [0] 을 돌려준다. */\nexport function polyTrim(p) {\n  let i = 0;\n  while (i < p.length - 1 && p[i] === 0) i++;\n  const out = new Uint8Array(Math.max(p.length - i, 1));\n  for (let j = 0; j < out.length; j++) out[j] = p[i + j] ?? 0;\n  return out;\n}\n\n/**\n * 다항식 나눗셈 (synthetic division).\n * @returns {{quotient: Uint8Array, remainder: Uint8Array}}\n *          remainder 길이 = deg(divisor) (선행 0 포함, 고정 길이)\n */\nexport function polyDiv(dividend, divisor) {\n  const dv = polyTrim(divisor);\n  if (dv.length === 1 && dv[0] === 0) throw new RangeError('0 다항식으로 나눌 수 없다');\n  const degDiv = dv.length - 1;\n  if (dividend.length < dv.length) {\n    const rem = new Uint8Array(degDiv);\n    for (let i = 0; i < dividend.length; i++) {\n      rem[i + degDiv - dividend.length] = dividend[i];\n    }\n    return { quotient: new Uint8Array([0]), remainder: rem };\n  }\n  const work = new Uint8Array(dividend.length);\n  for (let i = 0; i < dividend.length; i++) work[i] = dividend[i];\n  const qLen = dividend.length - degDiv;\n  const dvLeadInv = inverse(dv[0]);\n  for (let i = 0; i < qLen; i++) {\n    const coef = mul(work[i], dvLeadInv);\n    work[i] = coef;\n    if (coef === 0) continue;\n    for (let j = 1; j < dv.length; j++) {\n      if (dv[j] !== 0) work[i + j] = sub(work[i + j], mul(dv[j], coef));\n    }\n  }\n  return { quotient: work.slice(0, qLen), remainder: work.slice(qLen) };\n}\n\n/** Horner 법 평가 p(x) */\nexport function polyEval(p, x) {\n  if (p.length === 0) return 0;\n  let y = p[0];\n  for (let i = 1; i < p.length; i++) y = add(mul(y, x), p[i]);\n  return y;\n}\n"],
  ["rs211", "/**\n * rs211.js — 체계적 Reed-Solomon 부호 over GF(211)\n *\n * ADR 0001 §6 / §8.3: RS 부호화를 **셀 도메인**으로 옮긴다 — RS 심볼 1개 =\n * 셀 3개(digit 3개, base-211). 코드워드 = 메시지 ‖ 패리티, n ≤ 210(체의\n * 곱셈군 위수).\n *\n * ⚠ GF(2^8) 용 `rs.js` 를 그대로 베끼면 안 된다. 표수가 2 가 아니므로:\n *   - 부호화의 \"몫 없이 나머지만\" 트릭에서 XOR 대신 진짜 뺄셈을 쓴다.\n *   - Berlekamp-Massey 의 갱신식이 뺄셈을 쓴다 (XOR 로는 GF(2^m) 에서만 우연히 맞는다).\n *   - Forney 공식에 **음의 부호가 실재한다** — GF(2^m) 은 -1=1 이라 안 보였을 뿐이다.\n *   - 형식적 미분 Λ'(x) 는 \"홀수항만 남는\" GF(2^m) 트릭이 아니라 일반 미적분과\n *     같다: d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1).\n *\n * 복호 실패는 절대 조용히 삼키지 않는다 — `{ ok:false, reason }` 을 돌려주거나\n * `RSDecodeError` 를 던진다. 오류가 t 개를 넘으면 원리적으로 다른 유효\n * 코드워드로 오정정될 수 있고(그때는 ok:true 지만 값이 다름) 이는 부호의\n * 한계이지 버그가 아니다 — 상위 계층(포맷 CRC 등)이 최종 방어선이다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다.\n */\n\nimport { P, MULTIPLICATIVE_ORDER, add, sub, mul, div, inverse, alphaPow, polyEval } from './gfp.js';\n\n/** 코드워드 최대 길이. RS over GF(q) 는 n ≤ q − 1 — GF(211) 에서 210. */\nexport const MAX_CODEWORD_LEN = MULTIPLICATIVE_ORDER;\n\n/** 생성다항식 첫 근 지수 (first consecutive root) 기본값. */\nexport const DEFAULT_FCR = 0;\n\n/**\n * 규범 nsym 표 — **공식으로 유도하지 않는다** (ADR 0001 §3.3.3: 공식+플래그 조합이\n * 비대칭 비교 사고를 두 번 냈다).\n *\n * 출처를 정확히 가른다 (검증 라운드 지적 반영):\n * - **M 값 (7 / 14 / 23): ADR §3.3.2, 2026-07-29 사용자 확정.** V3 = 23 은 같은 t=11 을\n *   주는 22 대신 +1 B 를 오정정 검출 여유로 지출한 명시적 결정이다 (패리티율 정확히 25.0%).\n * - **V3 H = 37: ADR §8.1 ECC-H 실측 행** (nsym=37 · K=53 B · ε@95% 4.5~5.0%).\n * - **L 값 전부와 V1/V2 의 H 값: 오케스트레이터 파생** — SPEC §6 비율(L 12% / H 40%)을\n *   심볼 수에 곱해 반올림한 것 (V1: 27×0.12→3, 27×0.4→11 / V2: 55×0.12→7, 55×0.4→22 /\n *   V3: 92×0.12→11). ADR·PM 문서에는 없다. SPEC §5.5 재생성 시 이 파생값이 표와 함께\n *   규범으로 승격된다 — 그 전까지는 잠정.\n *\n * **M0 T8 오버헤드 대사 (통합자 사전 검산, placement.js `overheadBreakdown(k)` 실계산과\n * 일치)**: V2 의 overhead 가 잠정 50 → 실계산 49 로 정정되며 데이터 셀이 167 → 168 로\n * 늘고(3의 배수), 이에 따라 사용 심볼 S 가 55 → **56** 으로 바뀐다. **nsym(L7/M14/H22) 은\n * 하나도 바뀌지 않는다** — M=14 는 56 기준으로도 패리티율이 정확히 25.0%(14/56)라\n * ADR §3.3.2 확정값을 그대로 재사용해도 비율 요건이 깨지지 않는다. V1(overhead 45→45,\n * symbols 27 불변)·V3(overhead 55→53, dataCells 276→278, residual 0→2 지만 ⌊278/3⌋=92\n * 로 symbols 92 불변)는 usedSymbols 자체가 바뀌지 않아 nsym 표를 그대로 쓴다.\n */\nexport const NSYM_TABLE = Object.freeze({\n  V1: Object.freeze({ symbols: 27, L: 3, M: 7, H: 11 }),\n  V2: Object.freeze({ symbols: 56, L: 7, M: 14, H: 22 }),\n  V3: Object.freeze({ symbols: 92, L: 11, M: 23, H: 37 }),\n});\n\n/** 복호 실패 예외. `reason` / `syndromes` 를 함께 싣는다. */\nexport class RSDecodeError extends Error {\n  constructor(message, details = {}) {\n    super(message);\n    this.name = 'RSDecodeError';\n    Object.assign(this, details);\n  }\n}\n\n// ── 입력 검증 ───────────────────────────────────────────────────────────\n\nfunction toSymbols(input, label) {\n  if (!Array.isArray(input) && !ArrayBuffer.isView(input)) {\n    throw new TypeError(`${label} 는 배열이어야 한다`);\n  }\n  const out = new Uint8Array(input.length);\n  for (let i = 0; i < input.length; i++) {\n    const v = input[i];\n    if (!Number.isInteger(v) || v < 0 || v >= P) {\n      throw new RangeError(`${label}[${i}] 는 0..${P - 1} 정수여야 한다: ${v}`);\n    }\n    out[i] = v;\n  }\n  return out;\n}\n\nfunction validateNsym(nsym) {\n  if (!Number.isInteger(nsym) || nsym < 1 || nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(`nsym 은 1..${MAX_CODEWORD_LEN} 정수여야 한다: ${nsym}`);\n  }\n}\n\nfunction validateFcr(fcr) {\n  if (!Number.isInteger(fcr) || fcr < 0) {\n    throw new RangeError(`fcr 은 0 이상 정수여야 한다: ${fcr}`);\n  }\n}\n\n// ── 용량 헬퍼 ───────────────────────────────────────────────────────────\n\n/** nsym 패리티로 정정 가능한 최대 심볼 오류 수 t = ⌊nsym/2⌋ */\nexport function errorCapacity(nsym) {\n  validateNsym(nsym);\n  return Math.floor(nsym / 2);\n}\n\n/** 주어진 nsym 에서 한 블록에 실을 수 있는 최대 데이터 심볼 수. n > 210 은 거부된다. */\nexport function maxDataLen(nsym) {\n  validateNsym(nsym);\n  return MAX_CODEWORD_LEN - nsym;\n}\n\n// ── 부호화 ──────────────────────────────────────────────────────────────\n\n/**\n * 생성 다항식 g(x) = ∏_{i=0}^{nsym-1} (x - α^(fcr+i)) — big-endian, 모닉.\n * **뺄셈이 실재한다**: (x - α^k) 의 상수항은 `sub(0, α^k)` = p - α^k 다\n * (`rs.js` 의 GF(2^8) 버전은 이 자리에서 `+`를 썼는데 표수 2 라서 우연히 맞았다).\n * @returns {Uint8Array} 길이 nsym + 1, g[0] === 1\n */\nexport function rsGeneratorPoly(nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  validateNsym(nsym);\n  validateFcr(fcr);\n  let g = Uint8Array.of(1);\n  for (let i = 0; i < nsym; i++) {\n    const root = alphaPow(fcr + i);\n    const factor = Uint8Array.of(1, sub(0, root)); // (x - root)\n    g = polyMulBE(g, factor);\n  }\n  return g;\n}\n\n/** big-endian 다항식 곱 (로컬 — gfp.js 의 polyMul 과 동일하지만 순환 의존 피하려 인라인하지 않고 재사용) */\nfunction polyMulBE(p, q) {\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(pi, q[j]));\n  }\n  return out;\n}\n\n/**\n * 체계적 RS 부호화. 코드워드 = 메시지 ‖ 패리티(nsym 심볼).\n * 표준 LFSR 합성제법: `msg ‖ 0*nsym` 을 g(x) 로 나눈 나머지를 msg 뒤에 붙인다.\n * **`sub` 를 쓴다** — GF(2^8) 판은 XOR 라 add/sub 구분이 없었지만 여기선 다르다.\n * @param {Uint8Array|number[]} msg\n * @param {number} nsym\n * @param {{fcr?: number, generator?: Uint8Array}} [options]\n * @returns {Uint8Array} 길이 msg.length + nsym\n */\nexport function rsEncode(msg, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR, generator } = options;\n  const data = toSymbols(msg, 'msg');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (data.length + nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(\n      `msg.length(${data.length}) + nsym(${nsym}) = ${data.length + nsym} > ${MAX_CODEWORD_LEN}`,\n    );\n  }\n  const g = generator ?? rsGeneratorPoly(nsym, { fcr });\n  if (g.length !== nsym + 1) {\n    throw new RangeError(`generator 차수가 nsym 과 다르다: deg=${g.length - 1}, nsym=${nsym}`);\n  }\n\n  const out = new Uint8Array(data.length + nsym);\n  out.set(data, 0);\n  // 합성 나눗셈: g[0] === 1(모닉)이므로 나눗셈 없이 곱셈만으로 나머지를 구한다.\n  // out 은 P(x) = msg(x)·x^nsym 을 나타내고(꼬리가 0으로 채워져 있으므로),\n  // 이 루프가 끝나면 out[data.length:] 에는 P(x) 를 g(x) 로 나눈 **나머지 r(x)** 가 남는다.\n  for (let i = 0; i < data.length; i++) {\n    const coef = out[i];\n    if (coef === 0) continue;\n    for (let j = 0; j < g.length; j++) {\n      out[i + j] = sub(out[i + j], mul(g[j], coef));\n    }\n  }\n  // 코드워드 = P(x) − r(x) 라야 g(x) 로 나누어떨어진다 → 패리티 = **−r**.\n  // ⚠ 표수 2(GF(2^8))에서는 −r = r 이라 이 부호가 안 보였다. 여기서 빠뜨리면\n  // \"나머지를 그대로 패리티로 쓰는\" 조용한 부호 버그가 된다 — 실제로 처음엔\n  // 이걸 놓쳐서 신드롬이 0이 되지 않았다(개발 중 실측).\n  for (let j = data.length; j < out.length; j++) {\n    out[j] = sub(0, out[j]);\n  }\n  // out[0..data.length) 는 위 루프에서 뭉개졌으므로 원 메시지로 복원한다.\n  out.set(data, 0);\n  return out;\n}\n\n/**\n * 신드롬 S_i = C(α^(fcr+i)), i = 0..nsym-1.\n * 유효 코드워드면 전부 0 이다 (RS 의 정의적 성질) — 이 성질 자체를 테스트로 검증한다.\n * @returns {Uint8Array} 길이 nsym\n */\nexport function rsSyndromes(codeword, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  const cw = toSymbols(codeword, 'codeword');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  const s = new Uint8Array(nsym);\n  for (let i = 0; i < nsym; i++) s[i] = polyEval(cw, alphaPow(fcr + i));\n  return s;\n}\n\n// ── 복호 내부: little-endian 다항식 헬퍼 ────────────────────────────────\n// Λ(x) = 1 + Λ1·x + Λ2·x² + ... 형태가 자연스러운 알고리즘(BM/Forney)만\n// little-endian(index i = x^i 계수) 을 쓴다. gfp.js 의 poly* 는 big-endian.\n\nfunction polyEvalLE(p, x) {\n  let y = 0;\n  let xp = 1;\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] !== 0) y = add(y, mul(p[i], xp));\n    xp = mul(xp, x);\n  }\n  return y;\n}\n\nfunction polyMulLE(p, q) {\n  const out = new Array(p.length + q.length - 1).fill(0);\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(p[i], q[j]));\n  }\n  return out;\n}\n\n/**\n * 형식적 미분 Λ'(x). **GF(p), p ≠ 2 에서는 일반 미적분과 같다** —\n * d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1). GF(2^m) 의 \"홀수항만 남는다\" 트릭은\n * 표수 2 의 우연(짝수 k 는 k mod 2 = 0 이라 소멸)이고 여기서는 성립하지 않는다.\n */\nfunction polyDerivLE(p) {\n  const out = new Array(Math.max(p.length - 1, 1)).fill(0);\n  for (let k = 1; k < p.length; k++) {\n    out[k - 1] = mul(k % P, p[k]);\n  }\n  return out;\n}\n\n/**\n * Berlekamp-Massey. 신드롬열을 만드는 최단 LFSR 의 연결다항식 Λ(x) 를 찾는다.\n * 판별식 d 는 합(연산상 항상 덧셈 — 어느 체에서나 그렇다), 갱신식은 **뺄셈**을 쓴다:\n *   Λ_new(x) = Λ(x) − (d/b)·x^m·B(x)\n * (`rs.js` 의 GF(2^8) 판은 이 자리에서 XOR 를 썼는데 표수 2 라서 우연히 맞았다.)\n * @param {Uint8Array} synd 저차→고차 신드롬\n * @returns {{lambda: number[], L: number}} lambda 는 little-endian, lambda[0] === 1\n */\nfunction berlekampMassey(synd) {\n  let lambda = [1];\n  let B = [1];\n  let L = 0;\n  let m = 1;\n  let b = 1;\n\n  for (let n = 0; n < synd.length; n++) {\n    let d = synd[n];\n    for (let i = 1; i <= L; i++) {\n      if (i < lambda.length && lambda[i] !== 0) d = add(d, mul(lambda[i], synd[n - i]));\n    }\n\n    if (d === 0) {\n      m += 1;\n      continue;\n    }\n\n    const coef = div(d, b);\n    const prev = lambda.slice();\n    const need = B.length + m;\n    if (lambda.length < need) lambda = lambda.concat(new Array(need - lambda.length).fill(0));\n    for (let i = 0; i < B.length; i++) {\n      if (B[i] !== 0) lambda[i + m] = sub(lambda[i + m], mul(coef, B[i]));\n    }\n\n    if (2 * L <= n) {\n      L = n + 1 - L;\n      B = prev;\n      b = d;\n      m = 1;\n    } else {\n      m += 1;\n    }\n  }\n\n  while (lambda.length > 1 && lambda[lambda.length - 1] === 0) lambda.pop();\n  return { lambda, L };\n}\n\n/**\n * Chien 탐색. Λ(x) 의 근 x = X_k^{-1} 를 찾아 **코드워드 배열 인덱스** 로 환산한다.\n * big-endian 코드워드에서 배열 인덱스 j 는 x^(n-1-j) 항이므로 X_k = α^(n-1-j).\n * @returns {number[]} 오름차순 오류 위치(배열 인덱스)\n */\nfunction chienSearch(lambda, n) {\n  const positions = [];\n  for (let j = 0; j < n; j++) {\n    const p = n - 1 - j;\n    if (polyEvalLE(lambda, alphaPow(-p)) === 0) positions.push(j);\n  }\n  return positions;\n}\n\n/**\n * Forney 알고리즘으로 오류 크기를 구한다.\n *   Ω(x) = S(x)·Λ(x) mod x^nsym\n *   Y_k = − X_k^(1-fcr) · Ω(X_k^-1) / Λ'(X_k^-1)\n *\n * ⚠ **음의 부호가 실재한다.** GF(2^m) 판(`rs.js`)의 주석은 \"표수 2 이므로\n * 부호는 사라진다\" 고 적었고 그 자리에서 부호 없이 반환했다 — 여기서 그걸\n * 그대로 베끼면 모든 정정값이 부호 반전으로 틀린다. `sub(0, ...)` 로 반드시 음화한다.\n * @returns {(number|null)[]} positions 와 같은 순서의 오류 크기. 분모가 0 이면 null.\n */\nfunction forney(synd, lambda, positions, n, fcr) {\n  const S = Array.from(synd);\n  const full = polyMulLE(S, lambda);\n  const omega = full.slice(0, synd.length);\n  const dLambda = polyDerivLE(lambda);\n\n  return positions.map((j) => {\n    const p = n - 1 - j;\n    const Xinv = alphaPow(-p);\n    const denom = polyEvalLE(dLambda, Xinv);\n    if (denom === 0) return null;\n    const num = polyEvalLE(omega, Xinv);\n    let scale = 1;\n    const e = 1 - fcr;\n    if (e !== 0) {\n      const ee = ((e % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n      scale = alphaPow(p * ee);\n    }\n    const magnitude = mul(scale, div(num, denom));\n    return sub(0, magnitude); // ← 소수체의 실재하는 부호\n  });\n}\n\n/**\n * RS 복호. t = ⌊nsym/2⌋ 개까지의 심볼 오류를 정정한다.\n *\n * 실패 검출(조용한 오정정을 막는 4중 관문):\n *   1. L(=degΛ 추정) > t\n *   2. Λ 차수와 BM 이 보고한 L 불일치\n *   3. Chien 탐색이 찾은 근의 개수 ≠ L\n *   4. 정정 적용 후 신드롬 재검산이 0 이 아님\n *\n * @param {Uint8Array|number[]} received 수신 코드워드 (메시지 ‖ 패리티)\n * @param {number} nsym\n * @param {{fcr?: number}} [options]\n * @returns {{ok:true, codeword:Uint8Array, message:Uint8Array, parity:Uint8Array,\n *            errorPositions:number[], errorCount:number, syndromes:Uint8Array}\n *         | {ok:false, reason:string, syndromes:Uint8Array, errorPositions:null}}\n */\nexport function rsDecode(received, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  const cw = toSymbols(received, 'received');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (cw.length > MAX_CODEWORD_LEN) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 ${MAX_CODEWORD_LEN} 을 넘는다`);\n  }\n  if (cw.length <= nsym) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 nsym(${nsym}) 이하다 — 메시지가 없다`);\n  }\n\n  const n = cw.length;\n  const t = Math.floor(nsym / 2);\n  const syndromes = rsSyndromes(cw, nsym, { fcr });\n\n  const fail = (reason) => ({ ok: false, reason, syndromes, errorPositions: null });\n  const succeed = (out, positions) => ({\n    ok: true,\n    codeword: out,\n    message: out.slice(0, n - nsym),\n    parity: out.slice(n - nsym),\n    errorPositions: positions,\n    errorCount: positions.length,\n    syndromes,\n  });\n\n  let clean = true;\n  for (let i = 0; i < syndromes.length; i++) {\n    if (syndromes[i] !== 0) {\n      clean = false;\n      break;\n    }\n  }\n  if (clean) return succeed(cw.slice(), []);\n\n  const { lambda, L } = berlekampMassey(syndromes);\n  if (L === 0 || L > t) {\n    return fail(`오류 개수가 정정 한계를 넘었다 (Berlekamp-Massey deg Λ = ${L}, t = ${t})`);\n  }\n  if (lambda.length - 1 !== L) {\n    return fail(`Λ 차수(${lambda.length - 1})와 LFSR 길이(${L})가 불일치 — 정정 불가`);\n  }\n\n  const positions = chienSearch(lambda, n);\n  if (positions.length !== L) {\n    return fail(`Chien 탐색이 Λ 의 근을 전부 찾지 못했다 (${positions.length}/${L}) — 정정 불가`);\n  }\n\n  const magnitudes = forney(syndromes, lambda, positions, n, fcr);\n  if (magnitudes.some((m) => m === null)) {\n    return fail('Forney 분모 Λ′(X^-1) = 0 — 정정 불가');\n  }\n\n  const out = cw.slice();\n  const changed = [];\n  for (let k = 0; k < positions.length; k++) {\n    if (magnitudes[k] === 0) continue;\n    // e_k = magnitudes[k] 는 received = true + E 의 오류값이다 → true = received − e_k\n    out[positions[k]] = sub(out[positions[k]], magnitudes[k]);\n    changed.push(positions[k]);\n  }\n\n  const after = rsSyndromes(out, nsym, { fcr });\n  for (let i = 0; i < after.length; i++) {\n    if (after[i] !== 0) {\n      return fail('정정 후에도 신드롬이 0 이 아니다 — 오류가 정정 한계를 넘었다');\n    }\n  }\n\n  return succeed(out, changed);\n}\n\n/**\n * `rsDecode` 의 예외 던지는 래퍼. 성공 시 메시지 심볼만 돌려준다.\n * @throws {RSDecodeError}\n */\nexport function rsDecodeMessage(received, nsym, options = {}) {\n  const result = rsDecode(received, nsym, options);\n  if (!result.ok) {\n    throw new RSDecodeError(`RS 복호 실패: ${result.reason}`, {\n      reason: result.reason,\n      syndromes: result.syndromes,\n    });\n  }\n  return result.message;\n}\n"],
  ["base211", "// base211.js — 셀 3개 ↔ RS 심볼(GF(211)) 매핑 + 바이트열 ↔ 심볼열 청킹 (ADR 0001 D3′)\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 배경 (ADR 0001, docs/adr/0001_base6_error_amplification.md)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 승인된 새 규약: **3 digit = 1 RS 심볼, RS over GF(211)**.\n// 파이프라인 순서 (§8.2 예정 문안): 바이트 → 심볼(이 모듈의 청커) → RS(심볼 도메인)\n// → digit(이 모듈의 3-digit 패킹, ×3) → 마스크 → scan order 로 셀 배치.\n// 즉 이 모듈은 **서로 다른 두 계층**을 담당한다. 절대 섞지 말 것:\n//\n//   [계층 A] 셀 도메인 ↔ RS 심볼 값 — 3 digit(base-6, {0..5} 각각) ↔ 정수 0..215.\n//            216 = 6^3 상태 중 **211..215 는 GF(211) 밖(불법)**. 인코더는 RS 심볼이\n//            언제나 0..210 이므로 불법값을 만들 수 없다(청커가 보장). 디코더는\n//            셀에서 읽은 3-digit 이 211..215 로 떨어지면 **명시적으로 위치를 보고**한다\n//            (예외를 던지지 않는다 — RS 소거 정정(P4)의 입력이 되기 때문).\n//\n//   [계층 B] 페이로드 바이트열 ↔ RS 심볼열 — RS 부호화 **이전**에 끝나는 자릿수(base-211)\n//            변환. 청크 단위 **27 바이트 ↔ 28 심볼** (211^28 >= 2^216, 211^27 < 2^216 이므로\n//            27 이 상한이자 28 이 최소). 상수 메모리, 청크 독립 변환, big-endian 바이트 →\n//            BigInt → base-211 MSD-first. 꼬리(1..26 바이트)는 ceil(8m / log2 211) 심볼.\n//\n// **오정정보다 무서운 실패는 \"조용한 절단\"이다.** 값이 목표 폭에 들어가지 않으면\n// 반드시 던진다 — 그리고 **출력 버퍼를 오염시키기 전에** 던진다. base6.js 의\n// bigIntToDigits/bigIntToBytes 는 다 쓴 뒤에야 나머지를 검사해 실패 시에도 out 이\n// 이미 절단된 값으로 채워져 있었다(검증에서 잡힌 실패 사례). 이 모듈은 쓰기 전에\n// 크기를 확인한다.\n\n// ── [계층 A] 셀 3-digit ↔ RS 심볼 값 ────────────────────────────────────────────\n\n/** 셀 1개(digit)의 알파벳 크기 (base-6, SPEC §4.1). */\nexport const CELL_DIGIT_BASE = 6;\n\n/** RS 심볼 1개를 구성하는 셀(digit) 개수. */\nexport const DIGITS_PER_SYMBOL = 3;\n\n/** 3-digit 조합이 표현 가능한 전체 상태 수 = 6^3. */\nexport const CELL_TRIPLE_STATES = CELL_DIGIT_BASE ** DIGITS_PER_SYMBOL; // 216\n\n/** RS 심볼이 사는 체 GF(211) 의 위수. 이 값이 GF(211) 안의 합법 심볼 개수다. */\nexport const RS_SYMBOL_BASE = 211;\n\n/** 3-digit 조합 중 GF(211) 밖으로 떨어지는 값의 최솟값 (포함) — 211..215. */\nexport const ILLEGAL_SYMBOL_MIN = RS_SYMBOL_BASE; // 211\n\n/** 3-digit 조합 중 GF(211) 밖으로 떨어지는 값의 최댓값 (포함). */\nexport const ILLEGAL_SYMBOL_MAX = CELL_TRIPLE_STATES - 1; // 215\n\n/**\n * 3-digit(각 0..5) → 정수 값 0..215. MSD-first: v = d0·36 + d1·6 + d2\n * (§4.2 기존 규약과 정합 — 최상위 digit 이 배열 앞).\n * 이 함수는 216 상태 전체에 대한 **전단사**다. GF(211) 합법성은 별도로 `isLegalSymbolValue`\n * 로 판정한다 — 여기서는 판정하지 않는다(디코더가 불법값도 일단 값으로 받아야\n * 위치 보고가 가능하기 때문).\n * @param {number} d0\n * @param {number} d1\n * @param {number} d2\n * @returns {number} 0..215\n */\nexport function cellDigitsToSymbolValue(d0, d1, d2) {\n  assertCellDigit(d0, 0);\n  assertCellDigit(d1, 1);\n  assertCellDigit(d2, 2);\n  return d0 * CELL_DIGIT_BASE * CELL_DIGIT_BASE + d1 * CELL_DIGIT_BASE + d2;\n}\n\n/**\n * 정수 값 0..215 → 3-digit(각 0..5), MSD-first. `cellDigitsToSymbolValue` 의 역함수.\n * @param {number} value 0..215\n * @returns {[number, number, number]}\n */\nexport function symbolValueToCellDigits(value) {\n  if (!Number.isInteger(value) || value < 0 || value >= CELL_TRIPLE_STATES) {\n    throw new RangeError(`심볼 값 범위 위반: ${value} (허용 0..${CELL_TRIPLE_STATES - 1})`);\n  }\n  const d0 = Math.floor(value / (CELL_DIGIT_BASE * CELL_DIGIT_BASE));\n  const rem = value % (CELL_DIGIT_BASE * CELL_DIGIT_BASE);\n  const d1 = Math.floor(rem / CELL_DIGIT_BASE);\n  const d2 = rem % CELL_DIGIT_BASE;\n  return [d0, d1, d2];\n}\n\n/** value 가 GF(211) 안의 합법 RS 심볼인지 (0..210). */\nexport function isLegalSymbolValue(value) {\n  return Number.isInteger(value) && value >= 0 && value < RS_SYMBOL_BASE;\n}\n\nfunction assertCellDigit(d, position) {\n  if (!Number.isInteger(d) || d < 0 || d >= CELL_DIGIT_BASE) {\n    throw new RangeError(\n      `digit 범위 위반 (위치 ${position}): ${d} (허용 0..${CELL_DIGIT_BASE - 1})`,\n    );\n  }\n}\n\n/**\n * 셀 도메인 digit 배열(3의 배수 길이) → RS 심볼 값 배열.\n * **디코더용.** 불법값(211..215)을 만나도 던지지 않고 위치를 함께 보고한다 —\n * RS 소거 정정(P4)의 입력이 되기 때문. 인코더 방향에서는 `unpackSymbolsToCellDigits`\n * 를 쓴다(합법 심볼만 다루므로 불법값이 원천적으로 발생하지 않는다).\n * @param {Uint8Array|number[]} digits 길이가 3의 배수\n * @returns {{ symbols: Uint8Array, illegalIndices: number[] }} illegalIndices 는\n *   symbols 배열 기준 인덱스(셀 인덱스 아님).\n */\nexport function packCellDigitsToSymbols(digits) {\n  if (!digits || typeof digits.length !== 'number') {\n    throw new TypeError('digits 는 배열 유사 객체여야 한다');\n  }\n  if (digits.length % DIGITS_PER_SYMBOL !== 0) {\n    throw new RangeError(\n      `digit 개수는 ${DIGITS_PER_SYMBOL} 의 배수여야 한다: ${digits.length}`,\n    );\n  }\n  const symbolCount = digits.length / DIGITS_PER_SYMBOL;\n  const symbols = new Uint8Array(symbolCount);\n  const illegalIndices = [];\n  for (let i = 0; i < symbolCount; i += 1) {\n    const base = i * DIGITS_PER_SYMBOL;\n    const value = cellDigitsToSymbolValue(digits[base], digits[base + 1], digits[base + 2]);\n    symbols[i] = value; // Uint8Array 는 0..255 를 담으므로 215 까지도 무손실 저장\n    if (!isLegalSymbolValue(value)) illegalIndices.push(i);\n  }\n  return { symbols, illegalIndices };\n}\n\n/**\n * RS 심볼 값 배열(전부 합법, 0..210) → 셀 도메인 digit 배열(길이 = symbols.length × 3).\n * **인코더용.** 심볼이 불법값(>=211)이면 이 함수는 그 자리에서 던진다 — RS 는\n * GF(211) 위에서만 동작하므로 인코더가 불법 심볼을 만드는 것 자체가 상위 버그다.\n * 출력 버퍼를 쓰기 전에 전수 검증하므로 실패 시 out 이 오염되지 않는다.\n * @param {Uint8Array|number[]} symbols 값 0..210\n * @returns {Uint8Array}\n */\nexport function unpackSymbolsToCellDigits(symbols) {\n  if (!symbols || typeof symbols.length !== 'number') {\n    throw new TypeError('symbols 는 배열 유사 객체여야 한다');\n  }\n  for (let i = 0; i < symbols.length; i += 1) {\n    if (!isLegalSymbolValue(symbols[i])) {\n      throw new RangeError(`불법 RS 심볼 값 (인덱스 ${i}): ${symbols[i]} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n  }\n  const out = new Uint8Array(symbols.length * DIGITS_PER_SYMBOL);\n  for (let i = 0; i < symbols.length; i += 1) {\n    const [d0, d1, d2] = symbolValueToCellDigits(symbols[i]);\n    const base = i * DIGITS_PER_SYMBOL;\n    out[base] = d0;\n    out[base + 1] = d1;\n    out[base + 2] = d2;\n  }\n  return out;\n}\n\n// ── [계층 B] 바이트열 ↔ RS 심볼열 청커 (base-211 위치 기수법) ────────────────────\n\n/** 청크당 바이트 수. */\nexport const CHUNK_BYTES = 27;\n\n/** 청크당 심볼 수. 211^28 >= 2^216 이 성립하는 최소값(아래 자기검증 참조). */\nexport const CHUNK_SYMBOLS = 28;\n\nconst SYMBOL_BASE_BIG = 211n;\nconst BYTE_MASK = 0xffn;\n\n/**\n * 배열 구간 [offset, offset+count) 이 실재하는지 검증한다.\n * typed array 는 범위 밖 쓰기를 예외 없이 **조용히 버리므로**, 이 검사 없이는\n * \"조용한 절단 금지\" 계약이 쓰기 경로에서 공허해진다 (검증 라운드 지적).\n * 음수 count 도 여기서 잡는다 — offset > length 일 때 기본 length 인자가 음수가 되어\n * 루프가 0회 돌고 0n 이 반환되는 위장 실패를 막는다.\n */\nfunction assertRange(arr, offset, count, what) {\n  if (!Number.isInteger(offset) || offset < 0) {\n    throw new RangeError(`${what}: offset 은 0 이상 정수여야 한다: ${offset}`);\n  }\n  if (!Number.isInteger(count) || count < 0) {\n    throw new RangeError(`${what}: 개수는 0 이상 정수여야 한다: ${count} (offset ${offset} 이 배열 길이 ${arr.length} 를 넘었는가?)`);\n  }\n  if (offset + count > arr.length) {\n    throw new RangeError(`${what}: 구간 [${offset}, ${offset + count}) 이 배열 길이 ${arr.length} 를 넘는다`);\n  }\n}\n\n// 모듈 로드 시 1회 자기검증: 27B↔28심볼이 무손실 최소 청크인지 BigInt 로 단언.\n// (ADR §6.2 근거 5 · PM/005 요구사항 — \"27 이 상한이자 28 이 최소\".)\n(() => {\n  const bound = 1n << BigInt(8 * CHUNK_BYTES); // 2^216\n  const pow28 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS);\n  const pow27 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS - 1);\n  if (pow28 < bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS} < 2^${8 * CHUNK_BYTES}`);\n  }\n  if (pow27 >= bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS - 1} >= 2^${8 * CHUNK_BYTES} (28 이 최소가 아님)`);\n  }\n})();\n\n/**\n * m 바이트를 손실 없이 담는 **최소** base-211 심볼 수.\n * 정의상 min{ s : 211^s >= 2^(8m) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n * @param {number} m 바이트 수 (>= 0)\n * @returns {number}\n */\nexport function minSymbolsExact(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  const target = 1n << BigInt(8 * m);\n  let s = 0;\n  let pow = 1n;\n  while (pow < target) {\n    pow *= SYMBOL_BASE_BIG;\n    s += 1;\n  }\n  return s;\n}\n\n/**\n * 닫힌 형태 ceil(m·8 / log2 211) 을 부동소수로 계산한 것. `minSymbolsExact` 의 BigInt\n * 정확 계산과 일치해야 한다(테스트가 단언). 정본은 `minSymbolsExact`.\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountFormula(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  return Math.ceil((m * 8) / Math.log2(RS_SYMBOL_BASE));\n}\n\n/** m = 0..CHUNK_BYTES 사전 계산 표 (인덱스 = 바이트 수). */\nconst TAIL_SYMBOLS = Object.freeze(buildTailTable());\n\nfunction buildTailTable() {\n  const table = [];\n  for (let m = 0; m <= CHUNK_BYTES; m += 1) table.push(minSymbolsExact(m));\n  return table;\n}\n\n/**\n * m 바이트에 대응하는 심볼 개수(꼬리표 조회, m = 0..27) 또는 일반식(m > 27).\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountForBytes(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  if (m <= CHUNK_BYTES) return TAIL_SYMBOLS[m];\n  return minSymbolsExact(m);\n}\n\n/**\n * 전체 바이트 길이에 대응하는 심볼 총 개수.\n * @param {number} byteLength\n * @returns {number}\n */\nexport function symbolCountForByteLength(byteLength) {\n  if (!Number.isInteger(byteLength) || byteLength < 0) {\n    throw new RangeError(`바이트 길이는 0 이상 정수여야 한다: ${byteLength}`);\n  }\n  const full = Math.floor(byteLength / CHUNK_BYTES);\n  const tail = byteLength % CHUNK_BYTES;\n  return full * CHUNK_SYMBOLS + TAIL_SYMBOLS[tail];\n}\n\n/** 꼬리 심볼 수 → 꼬리 바이트 수 역인덱스. */\nconst TAIL_SYMBOLS_TO_BYTES = (() => {\n  const map = new Map();\n  for (let m = 0; m < CHUNK_BYTES; m += 1) map.set(TAIL_SYMBOLS[m], m);\n  return map;\n})();\n\n/**\n * 심볼 총 개수 → 바이트 길이. 꼬리 심볼 수가 서로 다르고 모두 28 미만이면 유일하게\n * 역산된다(테스트가 표의 단사성을 확인한다). 정본은 헤더 길이 필드다.\n * @param {number} symbolCount\n * @returns {number}\n */\nexport function byteLengthForSymbolCount(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const full = Math.floor(symbolCount / CHUNK_SYMBOLS);\n  const rem = symbolCount % CHUNK_SYMBOLS;\n  const tailBytes = TAIL_SYMBOLS_TO_BYTES.get(rem);\n  if (tailBytes === undefined) {\n    throw new RangeError(`유효한 청크 분해가 없는 심볼 개수: ${symbolCount} (나머지 ${rem})`);\n  }\n  return full * CHUNK_BYTES + tailBytes;\n}\n\n// ── 청크 단위 원시 변환 (상수 메모리 프리미티브) ─────────────────────────────────\n\n/**\n * 바이트 구간 → BigInt (빅엔디안).\n * @param {Uint8Array|number[]} bytes\n * @param {number} offset\n * @param {number} length\n * @returns {bigint}\n */\nexport function bytesToBigInt(bytes, offset = 0, length = bytes.length - offset) {\n  assertRange(bytes, offset, length, 'bytesToBigInt');\n  let value = 0n;\n  for (let i = 0; i < length; i += 1) {\n    const b = bytes[offset + i];\n    if (!Number.isInteger(b) || b < 0 || b > 255) {\n      throw new RangeError(`바이트 값 범위 위반: index ${offset + i} = ${b}`);\n    }\n    value = (value << 8n) | BigInt(b);\n  }\n  return value;\n}\n\n/**\n * BigInt → 바이트 구간에 기록 (빅엔디안). **쓰기 전에 크기를 검증**해서 실패 시\n * out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {Uint8Array} out\n * @param {number} offset\n * @param {number} length\n */\nexport function bigIntToBytes(value, out, offset, length) {\n  assertRange(out, offset, length, 'bigIntToBytes');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= (1n << BigInt(8 * length))) {\n    throw new RangeError(`값이 ${length} 바이트에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = length - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest & BYTE_MASK);\n    rest >>= 8n;\n  }\n}\n\n/**\n * BigInt → 심볼 배열에 기록 (MSD first). 앞은 0 으로 패딩.\n * **쓰기 전에 크기를 검증**해서 실패 시 out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {number} symbolCount\n * @param {Uint8Array|number[]} out\n * @param {number} offset\n */\nexport function bigIntToSymbols(value, symbolCount, out, offset = 0) {\n  assertRange(out, offset, symbolCount, 'bigIntToSymbols');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= SYMBOL_BASE_BIG ** BigInt(symbolCount)) {\n    throw new RangeError(`값이 심볼 ${symbolCount} 개에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = symbolCount - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest % SYMBOL_BASE_BIG);\n    rest /= SYMBOL_BASE_BIG;\n  }\n}\n\n/**\n * 심볼 구간 → BigInt (MSD first). 심볼 값이 0..210 를 벗어나면 던진다\n * (base-211 위치 기수법의 자릿값 자체가 GF(211) 범위이므로 이 검사가 곧\n * \"RS 심볼 도메인 검증\"이다 — 계층 A 의 셀 불법값 판정과는 별개).\n * @param {Uint8Array|number[]} symbols\n * @param {number} offset\n * @param {number} symbolCount\n * @returns {bigint}\n */\nexport function symbolsToBigInt(symbols, offset = 0, symbolCount = symbols.length - offset) {\n  assertRange(symbols, offset, symbolCount, 'symbolsToBigInt');\n  let value = 0n;\n  for (let i = 0; i < symbolCount; i += 1) {\n    const s = symbols[offset + i];\n    if (!isLegalSymbolValue(s)) {\n      throw new RangeError(`심볼 범위 위반: index ${offset + i} = ${s} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n    value = value * SYMBOL_BASE_BIG + BigInt(s);\n  }\n  return value;\n}\n\n/**\n * 한 청크(1..27 바이트) → 심볼들. 작업 메모리 상수.\n * @param {Uint8Array} bytes\n * @param {number} byteOffset\n * @param {number} byteLength 1..27\n * @param {Uint8Array|number[]} out\n * @param {number} symbolOffset\n * @returns {number} 기록한 심볼 개수\n */\nexport function encodeChunkInto(bytes, byteOffset, byteLength, out, symbolOffset) {\n  if (byteLength < 1 || byteLength > CHUNK_BYTES) {\n    throw new RangeError(`청크 바이트 길이는 1..${CHUNK_BYTES}: ${byteLength}`);\n  }\n  const symbolCount = TAIL_SYMBOLS[byteLength];\n  bigIntToSymbols(bytesToBigInt(bytes, byteOffset, byteLength), symbolCount, out, symbolOffset);\n  return symbolCount;\n}\n\n/**\n * 한 청크의 심볼들 → 바이트. 작업 메모리 상수.\n * @param {Uint8Array|number[]} symbols\n * @param {number} symbolOffset\n * @param {number} byteLength 1..27 (기대 바이트 수 — 헤더 길이 필드에서 온다)\n * @param {Uint8Array} out\n * @param {number} byteOffset\n * @returns {number} 소비한 심볼 개수\n */\nexport function decodeChunkInto(symbols, symbolOffs
