  ["mask", "// mask.js — 고정 마스크 m(q,r) (SPEC §4.3)\n//\n// SPEC §4.3: 고정 마스크 1종(QR 식 마스크 선택 없음). 데이터 digit 에 m(q,r) 을\n// mod-6 가산해 시각 균일화 + 레퍼런스와의 혼동 방지를 노린다.\n//\n// ── 선정 절차 (순서 고정 — 규칙 먼저, 측정 다음, 선택 마지막) ────────────────\n//\n//   ① 카이제곱 균등성: 측정 영역(regionCells(k) 중 중심 2링 19셀 제외)에서\n//      chi2(df=5) <= 15.086 (alpha=0.01 임계값)\n//   ② 이웃 상관: 6방향을 3 정준 방향으로 축약(대칭 쌍 중복 제거)해 각 방향의\n//      Cramér's V 를 재고, 후보의 대표값은 버전×방향 전체의 **최대값**. 이 최대값이\n//      가장 작은 후보가 승자 후보.\n//   ③ 축 방향 자기상관: 원점을 지나는 세 격자축 직선(t=-100..100)을 따라\n//      주기 <=6 인 반복이 있으면 FAIL. (아핀형은 mod-6 선형이라 필연적으로\n//      period | 6 이므로 여기서 항상 FAIL — 이것이 \"축 밴딩\" 예상 실패 모드다.)\n//\n//   ①③ 을 **둘 다** 통과한 후보만 ② 비교에 들어간다. ①③ 을 통과하는 후보가\n//   하나뿐이면 ② 비교는 자명하게 그 후보가 승자다(TLcube/test/mask.test.js 의\n//   실측이 이 상황임을 재확인한다). 동률이면 공식이 단순한 쪽.\n//\n// ── 실측 결과 요약 (T4 numbers_check 전문 참조) ───────────────────────────\n//\n//   candidate   ①(chi2<=15.086)      ③(주기<=6 없음)   ② maxV(참고, 비교 대상 아님)\n//   affine      PASS (전 버전 <1)     FAIL(선형 필연)    1.0 (탈락이라 무의미)\n//   quadratic   FAIL (전 버전 >>15)   FAIL              0.29~0.35 (탈락이라 무의미)\n//   hash        PASS (전 버전 <9)     PASS               0.12~0.22\n//\n//   → ①③ 을 모두 통과하는 후보는 **hash** 뿐이다. CHOSEN = 'hash'.\n//\n// 정수 연산 안전성: q, r 이 |q|,|r| <= 20 범위(V3 k=10 보다 넉넉한 여유)에서\n// ⚠ 첫 곱셈 `q * 0x9e3779b1` 은 int32 를 넘는다 (|q|=20 에서 ~5.3e10). 그래도 안전한\n// 이유: double 은 2^53 까지 정수를 정확히 표현하고(|q|,|r| ≤ 2^21 에서 곱이 2^53 미만),\n// 직후의 `| 0` / `^` 가 ToInt32 로 결정적으로 축약한다. 이후 단계는 `Math.imul` /\n// `>>> ` 로 JS 정수 연산의 브라우저·Node 결정성을 못 박는다.\n\nfunction mod6(n) {\n  return ((n % 6) + 6) % 6;\n}\n\n// ── 후보 ①: 아핀형 (대조군) ────────────────────────────────────────────────\n// (a·q + b·r) mod 6. mod-6 선형이라 계수 조합에 따라 반드시 어떤 축 방향으로\n// 등차수열(주기 | 6)이 나타난다 — 실측 ③이 이를 확인한다. 대조군으로만 남긴다.\nfunction affine(q, r) {\n  return mod6(1 * q + 2 * r);\n}\n\n// ── 후보 ②: 이차형 ─────────────────────────────────────────────────────────\n// (a·q + b·r + c·qr + d·q² + e·r²) mod 6. 짧은 주기는 피하지만(③ 통과 못함 —\n// 이차항도 mod 6 에서 결국 주기적이다) 균등성이 실측상 크게 무너진다(① FAIL).\nfunction quadratic(q, r) {\n  return mod6(1 * q + 2 * r + 3 * q * r + 1 * q * q + 5 * r * r);\n}\n\n// ── 후보 ③: 정수 해시형 (선정) ─────────────────────────────────────────────\n// 곱셈-시프트-XOR. 첫 곱은 double 정밀 정수 곱 + ToInt32 축약(위 헤더 주석 참조),\n// 이후는 `Math.imul` — 전 단계가 IEEE754/ECMA 규정 연산이라 브라우저·Node 동일 결과다\n// (테스트가 이를 단언한다). ⚠ 이 공식은 측정으로 확정됐다(SPEC §4.3) — 수정 금지.\nfunction hash(q, r) {\n  let h = (q * 0x9e3779b1) ^ (r * 0x85ebca77);\n  h |= 0;\n  h ^= h >>> 15;\n  h = Math.imul(h, 0xc2b2ae35);\n  h ^= h >>> 13;\n  h |= 0;\n  return mod6(h);\n}\n\n/** 재측정 가능하도록 전 후보를 노출한다 (T4 선정 규칙 재실행용). */\nexport const CANDIDATES = Object.freeze({ affine, quadratic, hash });\n\n/** 확정된 후보 이름. */\nexport const CHOSEN = 'hash';\n\n/**\n * 확정 마스크 공식. m(q, r) → {0..5}.\n * @param {number} q\n * @param {number} r\n * @returns {number}\n */\nexport function maskValue(q, r) {\n  return hash(q, r);\n}\n\n/**\n * 데이터 digit 에 마스크를 mod-6 가산한다 (인코더가 쓴다).\n * @param {number} digit 0..5\n * @param {number} q\n * @param {number} r\n * @returns {number} 마스킹된 digit 0..5\n */\nexport function maskAdd(digit, q, r) {\n  return mod6(digit + maskValue(q, r));\n}\n\n/**\n * 마스크를 걷어낸다 (디코더가 쓴다). maskAdd 의 역연산.\n * @param {number} maskedDigit 0..5\n * @param {number} q\n * @param {number} r\n * @returns {number} 원본 digit 0..5\n */\nexport function maskSub(maskedDigit, q, r) {\n  return mod6(maskedDigit - maskValue(q, r));\n}\n"],
  ["formatinfo", "// formatinfo.js — 포맷 정보: CRC-6 + 12bit ↔ 5digit 변환 + 고정 마스크 + 3중 복제 다수결 (SPEC §5.4)\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 배경 — SPEC §13 TBD 2건을 이 모듈이 확정한다\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 포맷 정보 내용(§5.4): 버전 인덱스 4bit + ECC 레벨 2bit + CRC 6bit = 12bit.\n// 채널이 보는 것은 **digit** 이므로(불스아이 인접 링에 5심볼씩 3중 복제·다수결 판독),\n// CRC 다항식 선정은 bit 도메인이 아니라 **digit 도메인 전쌍 최소 해밍 거리**를\n// 1순위로 삼는다. 64개 유효 페이로드(6bit) 전수에 대해 5개 표준 후보를 전수 비교한\n// 결과는 이 파일 하단 주석 [측정표]에 있다 — 선정 근거가 회귀 테스트로 보호된다\n// (formatinfo.test.js 가 SELECTED_MIN_DIGIT_DISTANCE 를 고정 상수로 단언).\n//\n// **선정 결과: CRC-6/CDMA2000-B (poly 0x07)**.\n//   1순위(digit 최소 거리) 동률 2건 — CRC-6/ITU(0x03) 와 CRC-6/CDMA2000-B(0x07),\n//   둘 다 digit 최소 거리 2. 2순위(bit 최소 거리)로 갈라짐 — CDMA2000-B 는 4,\n//   ITU 는 3. CDMA2000-B 승.\n//\n// CRC 계산 규약: **비반사(non-reflected), MSB-first, init=0, xorout=0**, 6bit\n// 메시지 뒤에 6bit 0 을 붙여 나눈 것과 동일한 표준 bit-serial 나눗셈. 여기서\n// \"CRC-6/CDMA2000-B\" 라는 이름은 다항식 상수(0x07)의 출처 식별자일 뿐, refin/refout\n// 까지 포함한 외부 표준과의 bit-exact 호환을 주장하지 않는다 — 이 필드는 이 포맷\n// 안에서만 왕복하면 되는 폐쇄 채널이다.\n\n// ── 페이로드 필드 폭 ─────────────────────────────────────────────────────────\n\n/** 버전 인덱스 필드 폭 (bit). */\nexport const VERSION_BITS = 4;\n\n/** ECC 레벨 필드 폭 (bit). */\nexport const ECC_BITS = 2;\n\n/** 페이로드(버전+ECC) 폭 (bit). 유효 워드 2^6 = 64개. */\nexport const PAYLOAD_BITS = VERSION_BITS + ECC_BITS; // 6\n\n/** CRC 폭 (bit). */\nexport const CRC_BITS = 6;\n\n/** 코드워드(페이로드+CRC) 폭 (bit). */\nexport const CODEWORD_BITS = PAYLOAD_BITS + CRC_BITS; // 12\n\n/** 5-digit(base-6) 로 표현 가능한 상태 수. 6^5 = 7776 >= 2^12 = 4096 이 성립해야 한다. */\nexport const DIGIT_COUNT = 5;\n\n/** digit 1개의 알파벳 크기 (base-6, SPEC §4.1 과 동일 채널). */\nexport const DIGIT_BASE = 6;\n\n// 모듈 로드 시 1회 자기검증: 6^5 >= 2^12.\n(() => {\n  const capacity = DIGIT_BASE ** DIGIT_COUNT;\n  const need = 2 ** CODEWORD_BITS;\n  if (capacity < need) {\n    throw new Error(`자기검증 실패: ${DIGIT_BASE}^${DIGIT_COUNT}=${capacity} < 2^${CODEWORD_BITS}=${need}`);\n  }\n})();\n\n/** ECC 레벨 열거값. 3(예약)은 인코더가 거부하고 디코더는 ok:false 로 처리한다 (SPEC §6). */\nexport const ECC_LEVEL = Object.freeze({ L: 0, M: 1, H: 2, RESERVED: 3 });\n\n// ── CRC-6 — 선정된 다항식 (측정표는 파일 하단) ──────────────────────────────\n\n/** 선정된 CRC-6 다항식 (CRC-6/CDMA2000-B, 6bit, 암묵적 최상위 항 제외). */\nexport const CRC_POLY = 0x07;\n\n/** 선정 근거로 고정하는 회귀 상수 — digit 도메인 전쌍 최소 해밍 거리 (64 코드워드). */\nexport const SELECTED_MIN_DIGIT_DISTANCE = 2;\n\n/** 선정 근거로 고정하는 회귀 상수 — bit 도메인 전쌍 최소 해밍 거리 (12bit, 64 코드워드). */\nexport const SELECTED_MIN_BIT_DISTANCE = 4;\n\n/**\n * 표준 비반사 bit-serial CRC. `dataBits` 하위 `dataLen` bit 뒤에 `n` bit 의 0 을\n * 붙여 나눈 것과 동치인 결과를 낸다(명시적 패딩 없이 레지스터 shift 만으로 계산).\n * @param {number} dataBits 메시지 (하위 dataLen bit 사용)\n * @param {number} dataLen 메시지 폭 (bit)\n * @param {number} poly 생성 다항식 (n bit, 암묵적 최상위 항 제외)\n * @param {number} n CRC 폭 (bit)\n * @returns {number} CRC 값 (0..2^n − 1)\n */\nexport function crcCompute(dataBits, dataLen, poly, n) {\n  const mask = (1 << n) - 1;\n  let reg = 0;\n  for (let i = dataLen - 1; i >= 0; i -= 1) {\n    const inBit = (dataBits >> i) & 1;\n    const msb = (reg >> (n - 1)) & 1;\n    reg = ((reg << 1) | inBit) & mask;\n    if (msb) reg ^= poly;\n  }\n  for (let i = 0; i < n; i += 1) {\n    const msb = (reg >> (n - 1)) & 1;\n    reg = (reg << 1) & mask;\n    if (msb) reg ^= poly;\n  }\n  return reg;\n}\n\n/**\n * 선정된 다항식으로 6bit 페이로드의 CRC-6 을 계산한다.\n * @param {number} payload6 0..63\n * @returns {number} 0..63\n */\nexport function crc6(payload6) {\n  if (!Number.isInteger(payload6) || payload6 < 0 || payload6 >= (1 << PAYLOAD_BITS)) {\n    throw new RangeError(`페이로드는 0..${(1 << PAYLOAD_BITS) - 1}: ${payload6}`);\n  }\n  return crcCompute(payload6, PAYLOAD_BITS, CRC_POLY, CRC_BITS);\n}\n\n// ── 12bit ↔ 5digit (base-6, MSD-first) ──────────────────────────────────────\n\n/**\n * 0..4095 → 5-digit(base-6, MSD-first). §13 TBD \"12bit → 5심볼 변환 규약\" 확정.\n * @param {number} value 0..(6^5 − 1) 범위까지 허용(4096..7775 는 코드워드 도메인\n *   밖이지만 디코더가 마스크 해제 후 범위검사를 하려면 변환 자체는 열려 있어야 한다).\n * @returns {number[]} 길이 5, 각 원소 0..5\n */\nexport function toDigits5(value) {\n  const max = DIGIT_BASE ** DIGIT_COUNT;\n  if (!Number.isInteger(value) || value < 0 || value >= max) {\n    throw new RangeError(`값 범위 위반: ${value} (허용 0..${max - 1})`);\n  }\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let v = value;\n  for (let i = DIGIT_COUNT - 1; i >= 0; i -= 1) {\n    digits[i] = v % DIGIT_BASE;\n    v = Math.floor(v / DIGIT_BASE);\n  }\n  return digits;\n}\n\n/**\n * 5-digit(base-6, MSD-first) → 0..7775. `toDigits5` 의 역함수.\n * @param {number[]} digits 길이 5, 각 원소 0..5\n * @returns {number}\n */\nexport function fromDigits5(digits) {\n  assertDigits5(digits);\n  let v = 0;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) v = v * DIGIT_BASE + digits[i];\n  return v;\n}\n\nfunction assertDigits5(digits) {\n  if (!digits || typeof digits.length !== 'number' || digits.length !== DIGIT_COUNT) {\n    throw new TypeError(`digits 는 길이 ${DIGIT_COUNT} 배열이어야 한다`);\n  }\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const d = digits[i];\n    if (!Number.isInteger(d) || d < 0 || d >= DIGIT_BASE) {\n      throw new RangeError(`digit 범위 위반 (위치 ${i}): ${d} (허용 0..${DIGIT_BASE - 1})`);\n    }\n  }\n}\n\n// ── 고정 출력 마스크 ─────────────────────────────────────────────────────────\n//\n// 유도 과정(매직넘버 금지 — SPEC 요구): 전부 0 페이로드(버전=0, ECC=0)의 CRC 도\n// 0 이므로 마스크가 없으면 코드워드=0, 5digit=[0,0,0,0,0] → 균일 패치로 렌더된다.\n// 마스크 상수는 **이미 선정된 CRC_POLY 하나에서만** 유도한다(새 독립 상수 도입 금지):\n// CRC_POLY(6bit, 0x07)를 12bit 폭으로 두 번 이어붙인 값 (POLY<<6 | POLY) 을\n// 코드워드와 같은 5digit 변환기에 통과시킨 것이 마스크다. POLY 를 그대로 상위\n// 6bit 에 반복해 쓰는 이유는, POLY 한 번만으로는 상위 6bit(=페이로드 폭)가 0으로\n// 남아 5digit 중 앞쪽 자리가 여전히 0에 치우치기 때문 — 반복으로 12bit 전역에\n// CRC_POLY 유래 비트를 퍼뜨린다.\n//\n// 이 마스크는 §4.3 데이터 마스크와 무관한 **별도 상수**다 — 포맷 셀은 데이터\n// 마스크 대상이 아니다(SPEC §5.4 주석).\n\nconst MASK_SEED_12BIT = (CRC_POLY << CRC_BITS) | CRC_POLY;\n\n/** 고정 출력 마스크 (5digit, mod-6 가산). CRC_POLY 유래 — 별도 매직넘버 아님. */\nexport const MASK_DIGITS = Object.freeze(toDigits5(MASK_SEED_12BIT));\n\n/**\n * 5digit 에 고정 마스크를 mod-6 가산한다(인코더 방향).\n * @param {number[]} digits 길이 5\n * @returns {number[]} 길이 5, 마스크 적용됨\n */\nexport function applyMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d + MASK_DIGITS[i]) % DIGIT_BASE);\n}\n\n/**\n * 마스크를 해제한다(디코더 방향). `applyMask` 의 역함수.\n * @param {number[]} digits 길이 5, 마스크 적용된 상태\n * @returns {number[]} 길이 5, 마스크 해제됨\n */\nexport function removeMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d - MASK_DIGITS[i] + DIGIT_BASE) % DIGIT_BASE);\n}\n\n// ── 인코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * {version, eccLevel} → 5digit(base-6, 마스크 적용됨). 이 값을 3곳(120° 간격)에\n * 동일하게 반복 배치하는 것이 §5.4 의 \"3중 복제\" — 배치(레이아웃)는 이 모듈의\n * 소관이 아니라 호출측(hexgrid.js 사용부)의 몫이다.\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[]} 길이 5\n */\nexport function encode({ version, eccLevel }) {\n  if (!Number.isInteger(version) || version < 0 || version >= (1 << VERSION_BITS)) {\n    throw new RangeError(`버전은 0..${(1 << VERSION_BITS) - 1}: ${version}`);\n  }\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    throw new RangeError('ECC 레벨 3(예약값)은 인코더가 거부한다');\n  }\n  if (!Number.isInteger(eccLevel) || eccLevel < 0 || eccLevel >= (1 << ECC_BITS)) {\n    throw new RangeError(`ECC 레벨은 0..${(1 << ECC_BITS) - 1}: ${eccLevel}`);\n  }\n  const payload = (version << ECC_BITS) | eccLevel;\n  const crc = crc6(payload);\n  const codeword = (payload << CRC_BITS) | crc;\n  return applyMask(toDigits5(codeword));\n}\n\n/**\n * `encode` 결과를 3개의 동일한 복제로 반환한다(테스트/편의용 — 실제 위치는\n * 레이아웃 소관).\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[][]} 길이 3, 각 원소 길이 5\n */\nexport function encodeReplicated(info) {\n  const one = encode(info);\n  return [one.slice(), one.slice(), one.slice()];\n}\n\n// ── 디코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * 마스크 적용된 5digit 1개를 단독으로 복호한다(다수결 없이).\n * @param {number[]} maskedDigits 길이 5\n * @returns {{version:number, eccLevel:number, ok:boolean}}\n */\nexport function decodeSingle(maskedDigits) {\n  assertDigits5(maskedDigits);\n  const unmasked = removeMask(maskedDigits);\n  const codeword = fromDigits5(unmasked); // 0..7775 (5digit 전체 상태)\n  if (codeword >= (1 << CODEWORD_BITS)) {\n    // 4096..7775 는 12bit 코드워드 도메인 밖 — digit 조합 자체가 무효.\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  const payload = codeword >> CRC_BITS;\n  const crcField = codeword & ((1 << CRC_BITS) - 1);\n  const version = payload >> ECC_BITS;\n  const eccLevel = payload & ((1 << ECC_BITS) - 1);\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    return { version, eccLevel, ok: false };\n  }\n  const expectedCrc = crc6(payload);\n  if (expectedCrc !== crcField) {\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  return { version, eccLevel, ok: true };\n}\n\n/**\n * digit 위치별 다수결. 3개 읽기 중 2개 이상 일치하는 값을 채택한다.\n * @param {number[][]} reads 길이 3, 각 원소 길이 5\n * @returns {{digits:number[], hasMajority:boolean}} hasMajority 는 5자리 전부\n *   2표 이상 합의가 있었는지\n */\nexport function majorityVote(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  reads.forEach(assertDigits5);\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let hasMajority = true;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const counts = new Map();\n    for (const r of reads) counts.set(r[i], (counts.get(r[i]) ?? 0) + 1);\n    let bestVal = reads[0][i];\n    let bestCount = 0;\n    for (const [val, count] of counts) {\n      if (count > bestCount) {\n        bestCount = count;\n        bestVal = val;\n      }\n    }\n    if (bestCount < 2) hasMajority = false;\n    digits[i] = bestVal;\n  }\n  return { digits, hasMajority };\n}\n\n/**\n * 3중 복제 다수결 복호 (SPEC §5.4). 디코더 진입점.\n * 순서: ① digit 별 다수결 → CRC 검증. 실패하면 ② 각 복제를 개별 시도해 첫 성공을\n * 채택. 전부 실패하면 ok:false.\n * @param {number[][]} reads 길이 3, 각 원소 길이 5 (마스크 적용된 원판독값)\n * @returns {{version:number, eccLevel:number, ok:boolean}}\n */\nexport function decode(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  const { digits: majorityDigits } = majorityVote(reads);\n  const majorityResult = decodeSingle(majorityDigits);\n  if (majorityResult.ok) return majorityResult;\n\n  for (const r of reads) {\n    const single = decodeSingle(r);\n    if (single.ok) return single;\n  }\n  return { version: 0, eccLevel: 0, ok: false };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// [측정표] CRC-6 후보 전수 비교 (64 페이로드, 12bit 코드워드, 5digit 변환 후)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 방법: 각 후보 다항식으로 payload=0..63 전부에 대해 codeword=(payload<<6)|crc6\n// 을 만들고 toDigits5 로 5digit 화. 64개 코드워드의 C(64,2)=2016 쌍 전수에 대해\n// digit 도메인 해밍 거리(0..5)와 bit 도메인 해밍 거리(0..12)의 최솟값을 구함.\n// 검출력은 각 유효 워드에서 단일 복제 내 1-digit(5자리×5값=25종/워드) 및\n// 2-digit(C(5,2)×5×5=250종/워드) 오염을 전수 열거해 CRC(+범위검사)가 잡아내는\n// 비율로 측정(범위 밖 4096..7775 로 튀는 조합은 자동 검출로 함께 집계).\n//\n// | 이름                | poly | digit 최소거리 | bit 최소거리 | 1-digit 검출율 | 2-digit 검출율 |\n// |---------------------|------|-----------------|--------------|------------------|------------------|\n// | CRC-6/ITU           | 0x03 | 2               | 3            | 100.00%          | 99.15%           |\n// | CRC-6/CDMA2000-A    | 0x27 | 1               | 3            | 99.00%           | 98.975%          |\n// | CRC-6/CDMA2000-B    | 0x07 | **2**           | **4**        | **100.00%**      | 99.1125%         |\n// | CRC-6/DARC          | 0x19 | 1               | 4            | 99.375%          | 99.2375%         |\n// | CRC-6/GSM           | 0x2F | 1               | 4            | 98.00%           | 98.925%          |\n//\n// 선정 규칙 적용: 1순위 digit 최소거리 최대 → {ITU(2), CDMA2000-B(2)} 동률.\n// 2순위 bit 최소거리 최대 → CDMA2000-B(4) > ITU(3). **CDMA2000-B(0x07) 채택.**\n// (3순위 \"표준 채택 사례\" 타이브레이크는 2순위에서 이미 갈렸으므로 불필요.)\n"],
  ["header", "// header.js — 페이로드 헤더와 코드워드 프레이밍 (SPEC §4.5)\n//\n// 코드워드는 (버전, ECC) 별 **고정 크기**다:\n//\n//   ┌────────┬──────────────────────┬──────────┬───────────────┐\n//   │ 길이 1B │ UTF-8 페이로드        │ 0x00 패딩 │ RS 패리티      │\n//   └────────┴──────────────────────┴──────────┴───────────────┘\n//   └──────────── RS 적용 범위 ───────────────┘\n//\n// 이 모듈은 RS 적용 **전**의 바이트열(= 길이 + 페이로드 + 패딩)만 만들고 되읽는다.\n// 패리티는 rs.js 소관이고, digit 변환은 base6.js 소관이다.\n//\n// [H1] 길이 필드는 **1 바이트**, 페이로드 바이트 수 0..255.\n//      타입 필드는 두지 않는다 — 페이로드는 UTF-8 텍스트 고정이고 콘텐츠 타입 판별은\n//      소비자 몫이다 (QR byte mode 와 같은 스탠스).\n//\n// [H2] 패딩은 **0x00**. QR 식 0xEC/0x11 교대 패턴을 쓰지 않는 이유: 시각 균일화는\n//      마스크(SPEC §4.3)의 책임이고 여기서 중복할 이유가 없다.\n//\n// [H3] 길이 필드의 **유일한** 역할은 패딩 절단이다. digit 경계·청크 모호성과 무관하다.\n//\n// [H4] 페이로드 인코딩은 UTF-8 고정. 문자 수가 아니라 **바이트 수**가 용량을 정한다 —\n//      한글 1자 = 3 바이트다.\n\n/** 길이 필드 크기 (바이트). */\nexport const HEADER_BYTES = 1;\n\n/** 길이 필드가 표현 가능한 최대 페이로드 바이트 수. */\nexport const MAX_PAYLOAD_BYTES = 255;\n\n/** 패딩 바이트 값. */\nexport const PAD_BYTE = 0x00;\n\nconst encoder = new TextEncoder();\nconst decoder = new TextDecoder('utf-8', { fatal: true });\n\n/**\n * 데이터 영역 크기에서 실을 수 있는 최대 페이로드 바이트 수.\n * @param {number} dataBytes 코드워드에서 RS 패리티를 뺀 크기 (헤더 포함)\n * @returns {number}\n */\nexport function maxPayloadFor(dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  if (dataBytes < HEADER_BYTES) return 0;\n  return Math.min(dataBytes - HEADER_BYTES, MAX_PAYLOAD_BYTES);\n}\n\n/**\n * 문자열을 UTF-8 로 인코딩한 바이트 수. 용량 판정에 쓴다.\n * @param {string} text\n * @returns {number}\n */\nexport function payloadByteLength(text) {\n  if (typeof text !== 'string') throw new TypeError(`문자열이어야 한다: ${typeof text}`);\n  return encoder.encode(text).length;\n}\n\n/**\n * UTF-8 텍스트 → 고정 크기 데이터 영역 (헤더 + 페이로드 + 0x00 패딩).\n * 이 결과가 rs.js 의 메시지 입력이 된다.\n *\n * @param {string} text UTF-8 페이로드\n * @param {number} dataBytes 데이터 영역 고정 크기 (= 코드워드 − 패리티)\n * @returns {Uint8Array} 길이 정확히 dataBytes\n */\nexport function frame(text, dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  const payload = encoder.encode(text);\n\n  if (payload.length > MAX_PAYLOAD_BYTES) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 는 1 바이트 길이 필드로 표현 불가 (최대 ${MAX_PAYLOAD_BYTES} B)`);\n  }\n  const capacity = maxPayloadFor(dataBytes);\n  if (payload.length > capacity) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 가 데이터 영역 ${dataBytes} B 의 용량 ${capacity} B 를 초과한다`);\n  }\n\n  const out = new Uint8Array(dataBytes);   // 기본값이 0 이므로 패딩은 자동\n  out[0] = payload.length;\n  out.set(payload, HEADER_BYTES);\n  return out;\n}\n\n/**\n * 데이터 영역 → UTF-8 텍스트. RS 복호 **후**에 호출한다.\n *\n * 손상된 데이터가 여기까지 오면 길이 필드가 쓰레기일 수 있다. 그 경우 조용히 잘린\n * 문자열을 돌려주지 않고 던진다 — 조용한 오복호가 예외보다 훨씬 나쁘다.\n *\n * @param {Uint8Array} data 고정 크기 데이터 영역\n * @param {{lenient?: boolean}} [options] lenient=true 면 길이 초과를 클램프한다 (디버깅용)\n * @returns {{text: string, payloadLength: number, padding: number}}\n */\nexport function unframe(data, options = {}) {\n  if (!(data instanceof Uint8Array)) throw new TypeError('Uint8Array 여야 한다');\n  if (data.length < HEADER_BYTES) {\n    throw new RangeError(`데이터 영역이 헤더보다 작다: ${data.length} B`);\n  }\n\n  const declared = data[0];\n  const available = data.length - HEADER_BYTES;\n  let length = declared;\n\n  if (declared > available) {\n    if (!options.lenient) {\n      throw new RangeError(\n        `길이 필드 ${declared} B 가 가용 ${available} B 를 초과한다 — 데이터 손상 (RS 복호 실패를 의심하라)`);\n    }\n    length = available;\n  }\n\n  const bytes = data.subarray(HEADER_BYTES, HEADER_BYTES + length);\n  let text;\n  try {\n    text = decoder.decode(bytes);\n  } catch (cause) {\n    throw new RangeError('페이로드가 유효한 UTF-8 이 아니다 — 데이터 손상', { cause });\n  }\n  return { text, payloadLength: length, padding: available - length };\n}\n\nfunction assertSize(n, name) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`${name} 은 0 이상 정수여야 한다: ${n}`);\n  }\n}\n"],
  ["placement", "// placement.js — 앵커 3셀 + 포맷 정보 15셀 + 레퍼런스 셀 배치 맵 (SPEC §5.2, §5.3, §5.4, §13 T6)\n//\n// 이 모듈은 \"어디에 무엇을 놓는가\"만 다룬다. 포맷 정보 12bit → base-6 5심볼 변환(§5.4,\n// T7 하드 블로커)이나 scan order(§13, T8)는 여기서 확정하지 않는다 — 이 모듈이 내는\n// 셀 좌표 목록이 그 두 작업의 입력이 된다.\n//\n// 불스아이 풋프린트는 SPEC 이 이미 고정했다: hexDistance ≤ 2 (19셀). bullseye.js 는\n// 동시 작성 중이라 import 하지 않고 여기서 직접 hexDistance 로 판정한다(과제 지침).\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 앵커 3셀 (§5.2, \"확정할 것 1\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 외곽 6개 코너는 axial 좌표로 (k,0)·(0,k)·(-k,k)·(-k,0)·(0,-k)·(k,-k) 이다. 이 순서를\n// `CORNER_DIRECTIONS` 로 고정한다 — 인접 코너 사이는 60°, 한 칸씩 건너뛰면 120°다.\n//\n// **rhombille 분할은 120° 대칭만 갖는다** (hexgrid.js 헤더 주석: 면 오프셋이 전 셀\n// 동일하고 spine 이 {0,2,4} 꼭짓점에 고정되므로, 60°/180°/240°/300° 회전은 T/L/R 면\n// 배정 자체를 깨뜨린다 — 유효한 대칭군은 항등·120°·240° 뿐이다). 따라서 앵커는\n// **교대(alternating) 3개**를 골라야 \"임의의 유효 회전에서 앵커 3점이 여전히 앵커\n// 위치 집합\"이라는 성질이 성립한다. 후보는 두 세트뿐이다:\n//   세트 A = 코너 인덱스 {0,2,4} = { (k,0), (-k,k), (0,-k) }\n//   세트 B = 코너 인덱스 {1,3,5} = { (0,k), (-k,0), (k,-k) }\n// 어느 쪽이든 120°-불변 성질은 동일하게 성립한다(대칭적인 선택지라 구조적 우열이\n// 없다). **세트 A를 채택한다** — `CORNER_DIRECTIONS` 열거 순서의 첫 코너 (k,0) 를\n// 포함해 \"정준 목록의 짝수 인덱스\"로 서술하기 가장 단순하고, 이후 §5.4 포맷 정보의\n// ring-3 순회 시작점·§5.3 레퍼런스 셀의 충돌 회피 규칙과 같은 인덱스 산술\n// (`ringWalk` 참조)을 그대로 재사용할 수 있어 코드 전체의 회전 산술이 한 가지\n// 공식으로 통일된다.\n//\n// 방향 기준점(어느 코너가 digit 5 인가): 세트 A 의 첫 원소 (k,0) 를 5, 나머지 두\n// 코너를 0 으로 둔다. **왜 유일하게 결정되는가**: 세 앵커 위치의 집합 자체는\n// 120°/240° 회전에 불변이지만, \"이 물리적 좌표에 이 digit 이 찍혀 있다\"는 배정\n// 함수는 항등 회전에서만 자기 자신과 같다 — 120°/240° 만큼 회전한 패턴은 5가 찍힌\n// 위치가 다른 코너로 옮겨가므로 원본과 달라진다(아래 `test/placement.test.js` 가\n// 전수로 단언). 즉 디코더가 \"5 찍힌 앵커가 어디 있는가\"만 읽으면 세 회전 후보 중\n// 정확히 하나만 남는다.\n\nimport { hexDistance, AXIAL_DIRECTIONS } from './hexgrid.js';\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기본 상수\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 불스아이 풋프린트 반경 (SPEC §5.1: hexDistance ≤ 2, 19셀). */\nexport const BULLSEYE_RADIUS = 2;\n\n/**\n * 외곽 6 코너의 단위 방향 (k 를 곱하면 실제 코너 좌표). 60° 간격 정준 순서.\n * @type {ReadonlyArray<{q:number, r:number}>}\n */\nexport const CORNER_DIRECTIONS = Object.freeze([\n  Object.freeze({ q: 1, r: 0 }), //  0: (k, 0)\n  Object.freeze({ q: 0, r: 1 }), //  1: (0, k)\n  Object.freeze({ q: -1, r: 1 }), //  2: (-k, k)\n  Object.freeze({ q: -1, r: 0 }), //  3: (-k, 0)\n  Object.freeze({ q: 0, r: -1 }), //  4: (0, -k)\n  Object.freeze({ q: 1, r: -1 }), //  5: (k, -k)\n]);\n\n/** 앵커로 쓰는 코너 인덱스 — 세트 A(교대 인덱스, 위 주석 근거). */\nexport const ANCHOR_CORNER_INDICES = Object.freeze([0, 2, 4]);\n\n/** 앵커 중 digit 5 를 받는 코너 인덱스(= 방향 기준점). 나머지 앵커는 digit 0. */\nexport const ANCHOR_PRIMARY_INDEX = 0;\n\n/** 앵커 digit 값 (SPEC §5.2: (0,0,5)). */\nexport const ANCHOR_PRIMARY_DIGIT = 5;\nexport const ANCHOR_SECONDARY_DIGIT = 0;\n\n/** 포맷 정보가 사는 링 번호 (불스아이 인접 링, §5.4). */\nexport const FORMAT_RING = 3;\n\n/** 포맷 정보 반복 블록 길이(5셀) · 개수(3, 120° 간격) (§5.4). */\nexport const FORMAT_BLOCK_LENGTH = 5;\nexport const FORMAT_REPLICAS = 3;\n\n/** 레퍼런스 셀에 배정하는 알려진 digit — 앵커 값 {0,5} 와 달라야 한다(§5.3 \"확정할 것 3\"). */\nexport const REFERENCE_DIGIT = 3;\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    // FORMAT_RING(=3) 자체가 데이터 링이려면 앵커 링(k)보다 작아야 한다.\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 회전 (120°/240°, cube 좌표 기반 — rhombille 이 갖는 유일한 비자명 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial (q,r) 를 원점 기준 120° 회전. */\nexport function rotate120(q, r) {\n  return { q: -q - r, r: q };\n}\n\n/** axial (q,r) 를 원점 기준 240° 회전 (= rotate120 두 번). */\nexport function rotate240(q, r) {\n  return { q: r, r: -q - r };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 외곽 코너 · 앵커\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 반경 k 영역의 외곽 코너 6개, `CORNER_DIRECTIONS` 순서대로. */\nexport function corners(k) {\n  assertRadius(k);\n  return CORNER_DIRECTIONS.map((d) => ({ q: d.q * k, r: d.r * k }));\n}\n\n/**\n * 앵커 3셀과 digit 배정.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function anchorCells(k) {\n  const all = corners(k);\n  return ANCHOR_CORNER_INDICES.map((idx) => ({\n    ...all[idx],\n    digit: idx === ANCHOR_CORNER_INDICES[ANCHOR_PRIMARY_INDEX]\n      ? ANCHOR_PRIMARY_DIGIT\n      : ANCHOR_SECONDARY_DIGIT,\n  }));\n}\n\n/** 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function anchorPositionSet(k) {\n  return new Set(anchorCells(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 링 순회 (표준 hex-ring walk, 각도순 — format/reference 인덱스 산술의 기반)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 r 인 링(hexDistance == r)의 셀을, 코너 `CORNER_DIRECTIONS[2]·r` (= `(-r, r)`) 에서 시작해\n * `AXIAL_DIRECTIONS[0..5]` 순서로 각 변을 r 걸음씩 걸어 각도순으로 나열한다.\n * 길이 6r (r=0 이면 [{0,0}] 길이 1). 코너는 정확히 인덱스 0, r, 2r, 3r, 4r, 5r 에 온다\n * (증명: `test/placement.test.js` 가 이 성질과 §5.2 앵커 인덱스 일치를 검증한다).\n * @param {number} r\n * @returns {{q:number, r:number}[]}\n */\nexport function ringWalk(r) {\n  if (!Number.isInteger(r) || r < 0) {\n    throw new RangeError(`링 반경 r 은 0 이상의 정수여야 한다: ${r}`);\n  }\n  if (r === 0) return [{ q: 0, r: 0 }];\n  let cur = { q: AXIAL_DIRECTIONS[4].q * r, r: AXIAL_DIRECTIONS[4].r * r };\n  const cells = [];\n  for (let dir = 0; dir < 6; dir += 1) {\n    for (let step = 0; step < r; step += 1) {\n      cells.push({ q: cur.q, r: cur.r });\n      cur = { q: cur.q + AXIAL_DIRECTIONS[dir].q, r: cur.r + AXIAL_DIRECTIONS[dir].r };\n    }\n  }\n  return cells;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 정보 15셀 (§5.4, \"확정할 것 2\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 시작 위치·진행 방향: `ringWalk(FORMAT_RING)` 인덱스 0 = 코너 `CORNER_DIRECTIONS[2]·3`\n// = `(-3, 3)` 에서 시작해 `AXIAL_DIRECTIONS[0..5]` 순서로 진행한다.\n// (v1 주석은 CORNER_DIRECTIONS[4] 로 잘못 적었었다 — 검증 라운드 정정. 코드가 정본이고\n//  실측 ringWalk(3)[0] = (-3,3) 이다. 이 규약은 인코더/디코더 공통 와이어 계약이다.)\n// 링3 은 18셀(6·3). 5셀 블록 3개(=15셀)를 120° 간격(= 인덱스 +6, 18/3)으로 두면\n// 인덱스 [0-4], [6-10], [12-16] 이 포맷이고 [5, 11, 17] 세 칸이 남는다 — SPEC 이\n// 명시한 \"18셀 중 15개가 포맷, 3개만 남는다\"와 정확히 일치한다.\n\n/** 포맷 블록 하나의 시작 인덱스(링3 순회 기준), 120° 간격 3개. */\nexport function formatBlockStarts() {\n  const ringSize = 6 * FORMAT_RING;\n  const step = ringSize / FORMAT_REPLICAS;\n  return Array.from({ length: FORMAT_REPLICAS }, (_, i) => i * step);\n}\n\n/** 포맷 정보 15셀 (블록 3개 × 5셀, ring3 순회 순서 그대로 이어붙임). */\nexport function formatCells(k) {\n  assertRadius(k);\n  const ring = ringWalk(FORMAT_RING);\n  const cells = [];\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) {\n      cells.push(ring[(start + i) % ring.length]);\n    }\n  }\n  return cells;\n}\n\n/** 포맷 정보가 차지하지 않는 ring3 의 나머지 셀 (18 - 15 = 3개). */\nexport function formatRingLeftoverCells() {\n  const ring = ringWalk(FORMAT_RING);\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ring.length);\n  }\n  return ring.filter((_, idx) => !occupied.has(idx));\n}\n\nfunction formatOccupiedIndexSet() {\n  const ringSize = 6 * FORMAT_RING;\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ringSize);\n  }\n  return occupied;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레퍼런스 셀 (§5.3, \"확정할 것 3\") — 데이터 링(ring 3..k)당 정확히 2개\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 규칙(오직 (k, ring) 으로 결정): `ringWalk(r)` 순회에서 인덱스 0 부터, 그리고\n// 인덱스 `3r`(= 정확히 180° 대척점) 부터 각각 정방향으로 선형 탐색해 \"점유되지\n// 않은\" 첫 인덱스를 잡는다. 점유 판정은 다음 두 경우뿐이다(그 외 링은 아무 것도\n// 점유하지 않으므로 정확히 대척점 쌍이 나온다 — \"각도상 최대 분리\" 요건 충족):\n//   - r === FORMAT_RING(3): 포맷 15셀이 점유 → 위 §5.4 의 occupied 인덱스 집합\n//   - r === k(앵커 링): 앵커 3셀이 점유 → 세트 A 코너가 이 순회에서 정확히\n//     인덱스 {0, 2r, 4r} 에 온다(§5.2 주석 · `ringWalk` docstring 의 코너 인덱스\n//     성질 + ANCHOR_CORNER_INDICES = {0,2,4} 조합)\n// r===3 인 경우 탐색 결과는 항상 {5, 11} 로 수렴한다 — 링3 여유 3칸 {5,11,17} 중\n// 앞의 두 칸. 결정적이며 앵커·포맷과 무충돌임이 알고리즘적으로 보장된다.\n\nfunction ringOccupiedIndexSet(k, r) {\n  const occupied = new Set();\n  if (r === FORMAT_RING) {\n    for (const idx of formatOccupiedIndexSet()) occupied.add(idx);\n  }\n  if (r === k) {\n    const ringSize = 6 * r;\n    for (const idx of ANCHOR_CORNER_INDICES) {\n      // corners()[idx] 는 ringWalk(r) 에서 인덱스 (idx 를 코너-슬롯 순서로 재사상)에\n      // 온다. corners() 순서 [0..5] ↔ ringWalk 코너 인덱스 [2r,r,0,5r,4r,3r]\n      // (docstring 유도: dir4·r 시작 = corners()[2], 이후 dir0 r걸음 = corners()[1], ...).\n      const cornerToRingIndex = [2 * r, r, 0, 5 * r, 4 * r, 3 * r];\n      occupied.add(cornerToRingIndex[idx] % ringSize);\n    }\n  }\n  return occupied;\n}\n\n/**\n * 링 r(3..k)의 레퍼런스 2셀. `ringWalk(r)` 인덱스 기준 0 과 `3r` 에서 점유 인덱스를\n * 건너뛰며 선형 탐색해 결정적으로 고른다.\n * @param {number} k\n * @param {number} r FORMAT_RING(3) 이상 k 이하\n * @returns {{q:number, r:number}[]} 길이 2\n */\nexport function referenceCells(k, r) {\n  assertRadius(k);\n  if (!Number.isInteger(r) || r < FORMAT_RING || r > k) {\n    throw new RangeError(`레퍼런스 링 r 은 ${FORMAT_RING}..${k} 범위여야 한다: ${r}`);\n  }\n  const ring = ringWalk(r);\n  const ringSize = ring.length;\n  const occupied = ringOccupiedIndexSet(k, r);\n\n  const taken = new Set();\n  function pickFrom(startIdx) {\n    for (let step = 0; step < ringSize; step += 1) {\n      const idx = (startIdx + step) % ringSize;\n      if (!occupied.has(idx) && !taken.has(idx)) {\n        taken.add(idx);\n        return idx;\n      }\n    }\n    throw new RangeError(`k=${k} r=${r}: 레퍼런스 셀을 배치할 빈 칸이 없다`);\n  }\n\n  const i1 = pickFrom(0);\n  const i2 = pickFrom(Math.floor(ringSize / 2));\n  return [i1, i2].map((idx) => ({ ...ring[idx], digit: REFERENCE_DIGIT }));\n}\n\n/** 데이터 링 전부(3..k)의 레퍼런스 셀을 이어붙인 목록. */\nexport function referenceCellsAll(k) {\n  assertRadius(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) out.push(...referenceCells(k, r));\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 (§5.4 \"확정할 것 4\")\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체의 역할 분류표를 한 번에 만든다 (roleOf 를 셀마다 다시 계산하지\n * 않도록 Set 을 미리 구성 — 전수 테스트에서 O(k²) 반복이 O(k) 조회가 되게 한다).\n * @param {number} k\n * @returns {{bullseye: Set<string>, anchor: Set<string>, format: Set<string>, reference: Set<string>}}\n */\nexport function buildRoleSets(k) {\n  assertRadius(k);\n  const anchor = anchorPositionSet(k);\n  const format = new Set(formatCells(k).map((c) => key(c.q, c.r)));\n  const reference = new Set(referenceCellsAll(k).map((c) => key(c.q, c.r)));\n  return { anchor, format, reference };\n}\n\n/**\n * 셀 (q,r) 의 역할.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n *   `buildRoleSets(k)` 결과를 미리 넘기면 전수 테스트에서 재계산을 피한다.\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOf(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSets(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 오버헤드 집계 (§5.5 \"확정할 것 5\" — capacity.js 는 절대 건드리지 않는다)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 버전 k 의 비데이터 셀 실계산 합. capacity.js 의 `overhead` 잠정치(45/50/55)와\n * **대조만** 한다 — 이 함수는 capacity.js 를 읽지도 쓰지도 않는다.\n * @param {number} k\n */\nexport function overheadBreakdown(k) {\n  assertRadius(k);\n  const bullseye = 3 * BULLSEYE_RADIUS * BULLSEYE_RADIUS + 3 * BULLSEYE_RADIUS + 1; // cellCount(2)\n  const anchor = ANCHOR_CORNER_INDICES.length;\n  const format = FORMAT_BLOCK_LENGTH * FORMAT_REPLICAS;\n  const reference = 2 * (k - FORMAT_RING + 1); // 링 FORMAT_RING..k, 링당 2개\n  return {\n    k,\n    bullseye,\n    anchor,\n    format,\n    reference,\n    total: bullseye + anchor + format + reference,\n  };\n}\n"],
  ["bullseye", "/**\n * bullseye.js — 중앙 불스아이 파인더 형상·링 수 확정 (SPEC §5.1, T5)\n *\n * MaxiCode 식 동심원 불스아이: 명암 교대 링 3쌍(= 6밴드), 점유 영역은 중심\n * 반경 2링(hexDistance ≤ 2, 19셀). 이 모듈은 그 최대 안전 반지름과 밴드\n * 구조를 hexgrid 기하에서 **계산**으로 유도한다 — 임의 상수를 두지 않는다.\n *\n * R_max 는 두 제약의 min 이다:\n *   1. 19셀 풋프린트(hexDistance ≤ 2) 경계까지의 최소 거리 — 불스아이가\n *      점유 셀 밖으로 새면 인접(비점유) 셀의 렌더링을 침범한다.\n *   2. ring-3 셀(hexDistance = 3)의 샘플 원판(faceSampleDisc, §7.2 기본값)\n *      까지의 최소 여유 — 포맷 정보가 ring 3 에 살므로(§5.4) 그 판독용\n *      샘플 영역을 불스아이가 침범하면 안 된다.\n *\n * 이 모듈은 순수 기하만 다룬다. Node 전용 API 를 쓰지 않는다.\n */\n\nimport {\n  regionCells,\n  hexDistance,\n  hexCorners,\n  faceSampleDisc,\n  FACES,\n  normalizeLayout,\n} from './hexgrid.js';\n\n/** 명암 교대 링 3쌍 = 6밴드 (SPEC §5.1). */\nexport const RING_PAIRS = 3;\nexport const BAND_COUNT = RING_PAIRS * 2;\n\n/** 불스아이 점유 반경(hexDistance 상한). 반경 2링 = 19셀. */\nexport const OCCUPIED_RADIUS = 2;\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기하 헬퍼 (모듈 내부 전용)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 점 p 에서 선분 ab 까지의 최단 거리. */\nfunction distPointToSegment(p, a, b) {\n  const abx = b.x - a.x;\n  const aby = b.y - a.y;\n  const apx = p.x - a.x;\n  const apy = p.y - a.y;\n  const abLenSq = abx * abx + aby * aby;\n  let t = abLenSq === 0 ? 0 : (apx * abx + apy * aby) / abLenSq;\n  t = Math.max(0, Math.min(1, t));\n  const cx = a.x + t * abx;\n  const cy = a.y + t * aby;\n  // Math.hypot 금지 — ES 규격상 implementation-approximated 라 엔진별 1 ulp 이 갈릴 수\n  // 있고, 이 값이 밴드 반지름을 거쳐 렌더 바이트 결정성에 물린다. sqrt 는 IEEE 754\n  // 정확 반올림이라 결정적이다 (T9 검증 라운드 발견).\n  const dx = p.x - cx;\n  const dy = p.y - cy;\n  return Math.sqrt(dx * dx + dy * dy);\n}\n\n/** 원점에서 원점 기준 정수 axial 셀 (q,r) 까지 — region(k) 소속 판정용. */\nfunction inFootprint(q, r) {\n  return hexDistance(q, r) <= OCCUPIED_RADIUS;\n}\n\n/**\n * 19셀 풋프린트(hexDistance ≤ 2)의 경계까지 원점에서의 최소 거리.\n *\n * 풋프린트 안의 각 셀에 대해 6개 변을 순회하고, 그 변이 (풋프린트 밖의\n * 이웃과 접하는) **경계 변**이면 원점-선분 최단거리를 구해 전체 최소를 취한다.\n * \"경계 변\"인지는 변의 중점을 살짝 바깥으로 밀어 axial 로 반올림해서\n * 그 셀이 풋프린트 밖인지로 판정한다 — 이웃 방향 인덱스 매핑에 기대지\n * 않는 견고한 방식이다.\n */\nfunction footprintBoundaryClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const cells = regionCells(OCCUPIED_RADIUS);\n  let minDist = Infinity;\n\n  for (const { q, r } of cells) {\n    const corners = hexCorners(q, r, layout);\n    const cx = cellSize * Math.sqrt(3) * (q + r / 2);\n    const cy = cellSize * 1.5 * r;\n\n    for (let i = 0; i < 6; i++) {\n      const a = corners[i];\n      const b = corners[(i + 1) % 6];\n      const mx = (a.x + b.x) / 2;\n      const my = (a.y + b.y) / 2;\n      // 셀 중심 → 변 중점 방향으로 살짝(변 길이의 5%) 더 밀어 바깥 셀로 넘긴다.\n      const ox = mx + (mx - cx) * 0.05;\n      const oy = my + (my - cy) * 0.05;\n      const outsideQ = ox / (cellSize * Math.sqrt(3)) - (oy / (cellSize * 1.5)) / 2;\n      const outsideR = oy / (cellSize * 1.5);\n      // axial 반올림 (cube 방식) — hexgrid.axialRound 와 동치이나 이 모듈은\n      // 판정에만 쓰므로 로컬로 계산한다 (수치 안정성 목적 외 의미 없음).\n      const rounded = axialRoundLocal(outsideQ, outsideR);\n      if (!inFootprint(rounded.q, rounded.r)) {\n        const d = distPointToSegment({ x: 0, y: 0 }, a, b);\n        if (d < minDist) minDist = d;\n      }\n    }\n  }\n\n  return minDist;\n}\n\nfunction axialRoundLocal(qf, rf) {\n  const xf = qf;\n  const zf = rf;\n  const yf = -xf - zf;\n  let rx = Math.round(xf);\n  let ry = Math.round(yf);\n  let rz = Math.round(zf);\n  const dx = Math.abs(rx - xf);\n  const dy = Math.abs(ry - yf);\n  const dz = Math.abs(rz - zf);\n  if (dx > dy && dx > dz) rx = -ry - rz;\n  else if (dy > dz) ry = -rx - rz;\n  else rz = -rx - ry;\n  return { q: rx, r: rz };\n}\n\n/**\n * ring-3 셀(hexDistance = 3) 전 셀 × 전 면의 샘플 원판까지, 원점에서의\n * 최소 여유(clearance) = min(원점-원판중심 거리 − 원판 반지름).\n */\nfunction ring3DiscClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const ring3 = regionCells(3).filter(({ q, r }) => hexDistance(q, r) === 3);\n  let minClearance = Infinity;\n\n  for (const { q, r } of ring3) {\n    for (const face of FACES) {\n      const disc = faceSampleDisc(q, r, face, layout);\n      // hypot 대신 sqrt — 위 distPointToSegment 와 같은 결정성 사유.\n      const centerDist = Math.sqrt(disc.x * disc.x + disc.y * disc.y);\n      const clearance = centerDist - disc.radius;\n      if (clearance < minClearance) minClearance = clearance;\n    }\n  }\n\n  return minClearance;\n}\n\n/**\n * 최대 안전 반지름 R_max (cellSize 단위) = min(풋프린트 경계 여유, ring-3\n * 원판 비침범 여유).\n * @param {number} [cellSize=1]\n */\nexport function maxSafeRadius(cellSize) {\n  const size = cellSize === undefined ? 1 : normalizeLayout({ size: cellSize }).size;\n  return Math.min(footprintBoundaryClearance(size), ring3DiscClearance(size));\n}\n\n// 내부 노출 (numbers_check·테스트 진단용) — 공개 API 계약은 아니다.\nexport const _internals = { footprintBoundaryClearance, ring3DiscClearance };\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 밴드 구조\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 6밴드 경계 반지름(안→밖), 마지막 원소가 R_max.\n *\n * **균등 폭으로 확정** — 선정 규칙: 고정된 R_max 와 밴드 수 N 에 대해, 폭의\n * 합이 R_max 로 고정된 분할 중 \"가장 얇은 밴드의 폭\"(검출 강건성의 병목 —\n * 블러·저해상도에서 가장 먼저 뭉개지는 곳)을 최대화하는 분할은 **균등\n * 분할**이다 (단순 산술: 합이 고정된 N 분할에서 최소 밴드는 평균 이하이고, 등호는 균등 분배에서만 성립하므로 최소값은 균등 분배에서 최댓값을\n * 갖는다). \"중심 원판을 크게\" 대안은 중심 밴드를 넓히는 대신 나머지 5밴드가\n * 더 얇아져 최소 밴드 폭이 반드시 감소한다 — 아래 numbers_check 에서 수치로\n * 대조.\n */\nexport function bandRadii(cellSize) {\n  const R = maxSafeRadius(cellSize);\n  const width = R / BAND_COUNT;\n  const radii = [];\n  // 마지막 원소는 (R/N)·N 재계산이 아니라 R 그 자체 — 정의상 최외곽 경계 = R_max 이고,\n  // FP 재계산은 1 ulp 를 얹어 \"마지막 원소가 R_max\" 계약을 깬다 (T9 검증 라운드 여파).\n  for (let i = 1; i < BAND_COUNT; i++) radii.push(width * i);\n  radii.push(R);\n  return radii;\n}\n\n/**\n * distFromCenter 위치의 불스아이 프로파일. 반환값은 상대 순위가 아니라\n * 그 자체로 최대 대비 휘도다(0.0 = 암, 1.0 = 명) — 불스아이는 파인더이지\n * 데이터가 아니므로 §4.4 Δmin 계약과 무관하다.\n *\n * 밴드 0(중심)이 암(0)에서 시작해 교대하고, 밴드 5(최외곽)가 명(1)으로\n * 끝난다. 경계는 반개구간 [하한, 상한) 이고 마지막 밴드만 상한 포함(R_max\n * 그 자체는 불스아이 영역이므로).\n *\n * @param {number} distFromCenter\n * @param {number} [cellSize=1]\n * @returns {0 | 1}\n */\nexport function profileAt(distFromCenter, cellSize) {\n  if (!Number.isFinite(distFromCenter) || distFromCenter < 0) {\n    throw new RangeError(`distFromCenter 는 0 이상의 유한수여야 한다: ${distFromCenter}`);\n  }\n  const radii = bandRadii(cellSize);\n  const rMax = radii[radii.length - 1];\n  if (distFromCenter > rMax) {\n    throw new RangeError(\n      `distFromCenter(${distFromCenter}) 가 R_max(${rMax}) 를 벗어난다 — 불스아이 밖`,\n    );\n  }\n  for (let i = 0; i < radii.length; i++) {\n    const isLast = i === radii.length - 1;\n    if (isLast ? distFromCenter <= radii[i] : distFromCenter < radii[i]) {\n      return i % 2 === 0 ? 0 : 1;\n    }\n  }\n  // 도달 불가 (위 루프가 isLast 케이스에서 항상 반환) — 방어적 폴백.\n  /* c8 ignore next */\n  return 1;\n}\n\n/**\n * 불스아이가 점유하는 19셀 (hexDistance ≤ 2), 결정적 순서(regionCells 순서\n * 그대로).\n * @returns {{q: number, r: number}[]}\n */\nexport function occupiedCells() {\n  return regionCells(OCCUPIED_RADIUS);\n}\n\n/**\n * 검출기용 기대 방사 시그니처 — 중심(0)에서 R_max 까지 `samples`개 지점을\n * 균등 샘플링한 profileAt 값 배열.\n *\n * @param {number} [cellSize=1]\n * @param {number} [samples=64]\n * @returns {number[]}\n */\nexport function radialSignature(cellSize, samples) {\n  const n = samples === undefined ? 64 : samples;\n  if (!Number.isInteger(n) || n < 2) {\n    throw new RangeError(`samples 는 2 이상의 정수여야 한다: ${n}`);\n  }\n  const rMax = maxSafeRadius(cellSize);\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    // 마지막 표본은 (rMax·i)/(n−1) 재계산이 아니라 rMax 그 자체 — FP 재계산이 1 ulp\n    // 위로 반올림되면 profileAt 의 범위 검사(> rMax)에 걸린다 (bandRadii 와 같은 부류).\n    const d = i === n - 1 ? rMax : (rMax * i) / (n - 1);\n    out.push(profileAt(d, cellSize));\n  }\n  return out;\n}\n"],
  ["layout", "// layout.js — 캐노니컬 scan order + 레이아웃 통합 파사드 (SPEC §4.2, §5.6, §13 T8)\n//\n// 인코더(T9)와 디코더(M1)가 공유하는 단일 진입점. \"어디에 무엇을 놓는가\"의 개별\n// 조각(앵커·포맷·레퍼런스·불스아이)은 placement.js/bullseye.js 가 이미 확정했다 —\n// 이 모듈은 그 위에 **데이터 셀의 순회 순서**(scan order)만 얹고, 소비자가\n// placement/bullseye 를 따로 import 하지 않도록 재-export 파사드를 겸한다.\n//\n// scan order 확정 설계 (통합자 확정, 이 파일이 유일한 구현):\n//   - ring-major 안→밖 (r = FORMAT_RING(3) .. k), 각 링은 `ringWalk(r)` 인덱스\n//     오름차순, **roleOf == 'data' 인 셀만** (앵커·포맷·레퍼런스·불스아이 스킵).\n//   - 근거: 새 규약 0개(ringWalk 재사용) · 결정성 자명 · 연속 3셀 = 1 심볼이\n//     공간적으로도 인접(버스트 → 심볼 집중 → 3t−2 보장과 정합) · 필러(마지막\n//     C mod 3 셀)가 최외곽 링 끝 = 가장자리.\n//   - 심볼 그룹: scan order 의 연속 3셀 (d₀,d₁,d₂) = 심볼 1개, §4.2 MSD-first 규약.\n//\n// 런타임 의존성 0 · ESM.\n\nimport { hexDistance } from './hexgrid.js';\nimport {\n  FORMAT_RING,\n  buildRoleSets,\n  roleOf,\n  ringWalk,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n  overheadBreakdown,\n} from './placement.js';\nimport { occupiedCells } from './bullseye.js';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 데이터 셀을 캐노니컬 scan order 로. ring-major 안→밖(r = 3..k), 각 링은\n * `ringWalk(r)` 인덱스 오름차순, role == 'data' 인 셀만.\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (예: k=6 → 82)\n */\nexport function dataCellsInScanOrder(k) {\n  assertRadius(k);\n  const roleSets = buildRoleSets(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) {\n    for (const cell of ringWalk(r)) {\n      if (roleOf(cell.q, cell.r, k, roleSets) === 'data') out.push(cell);\n    }\n  }\n  return out;\n}\n\n/**\n * scan order 의 연속 3셀씩 묶은 심볼 그룹. 그룹 내부 순서 = (d₀,d₁,d₂),\n * §4.2 MSD-first 규약 그대로. 마지막 C mod 3 개는 그룹에 들지 않고\n * `fillerCells` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]} 길이 = ⌊데이터 셀 수 / 3⌋\n */\nexport function symbolCellGroups(k) {\n  const scan = dataCellsInScanOrder(k);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order 의 마지막 (C mod 3) 개 (§5.6). 최외곽 링(k) 끝에 온다.\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCells(k) {\n  const scan = dataCellsInScanOrder(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → `placement.anchorCells(k)` 순서\n *   - format    → `placement.formatCells(k)` 순서\n *   - reference → `placement.referenceCellsAll(k)` 순서\n *   - data      → `dataCellsInScanOrder(k)` 순서 (= scan order 인덱스,\n *                 심볼 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는\n *                 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMap(k) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n  anchorCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n  referenceCellsAll(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n  dataCellsInScanOrder(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placement/bullseye 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOf,\n  overheadBreakdown,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\nexport { hexDistance };\n"],
  ["capacity", "// capacity.js — 버전별 용량 산출 (SPEC §5.5, GF(211) 심볼 회계 — ADR 0001)\n//\n// **SPEC §5.5 의 표는 이 모듈의 생성물이다. 수기로 유지하지 않는다.**\n//\n// ADR 0001 §3.3.2/§3.3.3 결정: **nsym 은 공식이 아니라 표**. `rs211.js` 가 export 하는\n// `NSYM_TABLE` (2026-07-29 사용자 확정)을 그대로 입력으로 쓴다. `fitCodeword` 식 탐색과\n// `forceEven` 류 플래그는 여기 두지 않는다 — 그 조합이 ADR 본문에서 비대칭 비교 사고를\n// 두 번 냈다(§3.3.3).\n//\n// 회계는 심볼 도메인이다:\n//   데이터 심볼(셀) C = 총 셀 − 오버헤드\n//   사용 심볼        S = ⌊C / 3⌋   (잔여 셀 = C − 3S, 3의 배수가 안 되는 나머지 셀)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (BigInt 정확 계산)\n//   순 페이로드       = K − 1  (헤더 1 B, header.js 의 maxPayloadFor 와 정합)\n//\n// [T8 완료] `overhead` 는 더 이상 잠정 상수가 아니다 — 불스아이(§5.1)·앵커(§5.2)·\n//      포맷 정보(§5.4)·레퍼런스 셀(§5.3) 배치가 전부 확정됐으므로 `placement.js` 의\n//      `overheadBreakdown(k)` 실계산 합을 그대로 쓴다(구성요소별 유도, 아래 참조).\n\nimport { cellCount } from './hexgrid.js';\nimport { NSYM_TABLE, errorCapacity } from './rs211.js';\nimport { HEADER_BYTES, maxPayloadFor } from './header.js';\nimport { overheadBreakdown } from './placement.js';\n\n/**\n * 버전 정의. `overhead` 는 `placement.overheadBreakdown(k).total` 로 **유도**한다\n * (T8 이전엔 잠정 상수였다 — [P1] 이력 참조, 이제 내려감). `symbolKey` 는 `rs211.js` 의\n * `NSYM_TABLE` 조회 키.\n * @type {ReadonlyArray<{version: number, k: number, overhead: number, symbolKey: string}>}\n */\nexport const VERSIONS = Object.freeze([\n  Object.freeze({\n    version: 1, k: 6, overhead: overheadBreakdown(6).total, symbolKey: 'V1',\n  }),\n  Object.freeze({\n    version: 2, k: 8, overhead: overheadBreakdown(8).total, symbolKey: 'V2',\n  }),\n  Object.freeze({\n    version: 3, k: 10, overhead: overheadBreakdown(10).total, symbolKey: 'V3',\n  }),\n]);\n\n/**\n * S 개의 GF(211) 심볼이 손실 없이 담는 **최대** 바이트 수 K.\n * 정의: K = max{ k : 211^S >= 2^(8k) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n *\n * 주의: 이것은 base211.js 의 청크 회계(27 B ↔ 28 심볼 단위)가 아니라 **RS 데이터 심볼\n * 전체를 하나의 큰 자릿수로 본 직접 부등식**이다 — ADR §3.3.2/§3.3.3 이 정의한 K 가 이 값이다.\n *\n * @param {number} symbolCount S (0 이상 정수)\n * @returns {number} K (0 이상 정수)\n */\nexport function maxBytesForSymbols(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const cap = 211n ** BigInt(symbolCount);\n  let k = 0;\n  while ((1n << BigInt(8 * (k + 1))) <= cap) k += 1;\n  return k;\n}\n\n/**\n * 한 버전의 용량 전체.\n * @param {{version: number, k: number, overhead: number, symbolKey: string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityFor(spec, level = 'M') {\n  const totalCells = cellCount(spec.k);\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`V${spec.version}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE[spec.symbolKey];\n  if (!table) {\n    throw new RangeError(`V${spec.version}: rs211.js NSYM_TABLE 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 오버헤드·k 가 표와 따로 놀고 있다는\n    // 신호다. 조용히 맞추지 않고 여기서 던진다(과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `V${spec.version}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`V${spec.version}: NSYM_TABLE.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`V${spec.version}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n\n  return {\n    version: spec.version,\n    k: spec.k,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/**\n * 전 버전 용량표.\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityTable(level = 'M') {\n  return VERSIONS.map((v) => capacityFor(v, level));\n}\n\n/**\n * SPEC §5.5 에 붙일 마크다운 표. 단일 물결표는 쓰지 않는다 (규약 §6.11).\n * @param {'L'|'M'|'H'} [level]\n * @returns {string}\n */\nexport function renderMarkdownTable(level = 'M') {\n  const rows = capacityTable(level);\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\n  const body = rows.map((r) => `| V${r.version} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B** |`);\n  return [head, sep, ...body].join('\\n');\n}\n"],
  ["luminance", "/**\n * luminance.js — 휘도 레벨 프리셋 (SPEC §4.4, §5.1, §7.2)\n *\n * SPEC §4.4 계약 요지:\n * - 면의 휘도값은 §7.2 샘플 원판(내접원 부분 영역) 안의 상대휘도 **median** 이다.\n *   면 평균이 아니다. 이 모듈의 프리셋은 면을 평면 단색으로 채우는 것을 전제하므로\n *   (렌더러 책임 — 그라디언트·텍스처 없음) 원판 median = 그 색 자체의 상대휘도와 같다.\n *   즉 여기서 정의하는 레벨 Y 값이 곧 §7.2 계약 통계다.\n * - 순위 간 최소 분리폭: sRGB 상대휘도 Y 기준 Δmin >= 0.12 (0..1). 절대값·색상 선택은\n *   자유(§9) — 계약은 median 기준 순서와 분리폭뿐이다.\n * - SPEC §5.1: 불스아이는 파인더 마커라 Δmin 계약과 무관. 최대 대비 0.0/1.0 고정.\n *\n * RGB 리터럴은 런타임 솔버가 아니라 스크래치 계산(node -e, repo 밖)으로 실측해\n * 요건을 만족시킨 뒤 상수로 박아 넣었다 (결정성 — M0 완료 기준). 유도 근거는\n * 각 리터럴 옆 주석에 남긴다.\n */\n\nimport { digitToRanks } from './lehmer.js';\n\n/** SPEC §4.4 계약: 순위 간 최소 분리폭 (sRGB 상대휘도 Y, 0..1). */\nexport const DELTA_MIN_CONTRACT = 0.12;\n\n/** SPEC §5.1: 불스아이 파인더 마커 — 최대 대비, Δmin 계약과 무관. */\nexport const BULLSEYE_DARK = Object.freeze({ r: 0, g: 0, b: 0 });\nexport const BULLSEYE_LIGHT = Object.freeze({ r: 255, g: 255, b: 255 });\n\n/**\n * sRGB 8bit 채널 → 선형 채널. IEC 61966-2-1 (sRGB 표준 EOTF).\n * @param {number} v8 0..255 정수\n * @returns {number} 0..1\n */\nexport function srgbChannelToLinear(v8) {\n  const c = v8 / 255;\n  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);\n}\n\n/**\n * sRGB 8bit {r,g,b} → 상대휘도 Y (ITU-R BT.709 계수, 선형화 후 가중합).\n * SPEC §4.4 의 \"sRGB 상대휘도\" 정의.\n * @param {{r: number, g: number, b: number}} rgb\n * @returns {number} 0..1\n */\nexport function relativeLuminance(rgb) {\n  return (\n    0.2126 * srgbChannelToLinear(rgb.r) +\n    0.7152 * srgbChannelToLinear(rgb.g) +\n    0.0722 * srgbChannelToLinear(rgb.b)\n  );\n}\n\n/**\n * slate 프리셋 — 단색조 슬레이트 블루. 파랑 채널 우세·저채도로 \"어두운 배경 위에\n * 뜬 아이소메트릭 큐브 필드\" 인상을 노린다. 최상위 레벨(rank 2)은 흰색 쪽으로\n * 탈채도해 Y 를 끌어올렸다 (파랑 우세 색만으로는 Y 0.72 이상이 물리적으로 불가 —\n * 청색 BT.709 계수가 0.0722 로 가장 작기 때문).\n *\n * 실측 Y (node -e 스크래치 계산, repo 밖):\n *   background {14,16,24}   → Y ≈ 0.0053\n *   levels[0]  {58,68,108}  → Y ≈ 0.0612   (background 와 분리 ≈ 0.0559 >= 0.05)\n *   levels[1]  {110,135,190}→ Y ≈ 0.2436   (levels[0] 과 분리 ≈ 0.1824 >= 0.15)\n *   levels[2]  {220,228,240}→ Y ≈ 0.7699   (levels[1] 과 분리 ≈ 0.5263 >= 0.15)\n * presetDeltaMin('slate') = min(0.1824, 0.5263) ≈ 0.1824 >= 0.15 (계약 0.12 + 여유).\n */\nexport const PRESETS = Object.freeze({\n  slate: Object.freeze({\n    name: 'slate',\n    label: '슬레이트 블루 (Slate Blue)',\n    background: Object.freeze({ r: 14, g: 16, b: 24 }),\n    levels: Object.freeze([\n      Object.freeze({ r: 58, g: 68, b: 108 }), // rank 0 (어두움)\n      Object.freeze({ r: 110, g: 135, b: 190 }), // rank 1 (중간)\n      Object.freeze({ r: 220, g: 228, b: 240 }), // rank 2 (밝음)\n    ]),\n  }),\n});\n\n/** 기본 프리셋 이름. */\nexport const DEFAULT_PRESET = 'slate';\n\n/**\n * 프리셋 조회.\n * @param {string} name\n * @returns {{name: string, label: string, background: {r,g,b}, levels: {r,g,b}[]}}\n */\nexport function getPreset(name) {\n  if (!Object.prototype.hasOwnProperty.call(PRESETS, name)) {\n    throw new RangeError(`등록되지 않은 프리셋: ${name} (허용: ${Object.keys(PRESETS).join(', ')})`);\n  }\n  return PRESETS[name];\n}\n\n/**\n * 프리셋의 레벨 3개를 실측 상대휘도로 변환. rank 0→2 순서(오름차순)를 유지한다.\n * @param {string} name\n * @returns {[number, number, number]}\n */\nexport function presetLuminances(name) {\n  const preset = getPreset(name);\n  return preset.levels.map((rgb) => relativeLuminance(rgb));\n}\n\n/**\n * 프리셋의 인접 순위 간 최소 분리폭 (SPEC §4.4 Δmin 계약 검증용).\n * @param {string} name\n * @returns {number}\n */\nexport function presetDeltaMin(name) {\n  const [y0, y1, y2] = presetLuminances(name);\n  return Math.min(y1 - y0, y2 - y1);\n}\n\n/**\n * digit → 각 면의 실제 색상. digitToRanks(digit) 로 (T,L,R) 순위를 얻어\n * 프리셋의 levels[rank] 에 매핑한다.\n * @param {number} digit 0..5\n * @param {string} name 프리셋 이름\n * @returns {{T: {r,g,b}, L: {r,g,b}, R: {r,g,b}}}\n */\nexport function faceColors(digit, name) {\n  const preset = getPreset(name);\n  const ranks = digitToRanks(digit);\n  return {\n    T: preset.levels[ranks.T],\n    L: preset.levels[ranks.L],\n    R: preset.levels[ranks.R],\n  };\n}\n"],
  ["encode", "// encode.js — 인코더 파이프라인 통합 (SPEC §7.1)\n//\n// UTF-8 페이로드 → 길이 헤더 1B 부착 → 0x00 패딩(고정 K까지) → base-211 심볼\n// 변환(27B↔28심볼, MSD-first) → RS(GF(211)) 패리티 → 코드워드 = 심볼 열 S개 →\n// 심볼 → 3 digit(MSD-first) → 마스크 가산 → scan order 로 셀 배치 → 잔여 셀에\n// 필러(프리마스크 0) → digit 확정까지. 배정(digit → (T,L,R) rank)·렌더는 다른\n// 모듈 몫이다 — 여기서는 셀별 digit 확정까지만 한다.\n//\n// 이 모듈은 새 규약을 만들지 않는다 — capacity.js/header.js/base211.js/rs211.js/\n// mask.js/formatinfo.js/layout.js/placement.js 가 이미 확정한 조각을 파이프라인\n// 순서대로 조합만 한다.\n\nimport { VERSIONS, capacityFor } from './capacity.js';\nimport { frame, payloadByteLength } from './header.js';\nimport { bytesToSymbols, unpackSymbolsToCellDigits } from './base211.js';\nimport { rsEncode } from './rs211.js';\nimport { maskAdd } from './mask.js';\nimport { encodeReplicated, ECC_LEVEL } from './formatinfo.js';\nimport { dataCellsInScanOrder, fillerCells } from './layout.js';\nimport {\n  anchorCells,\n  referenceCellsAll,\n  REFERENCE_DIGIT,\n  formatCells,\n} from './placement.js';\n\nfunction cellKey(q, r) {\n  return `${q},${r}`;\n}\n\n/**\n * 페이로드 바이트 길이가 들어가는 최소 VERSIONS 항목을 고른다.\n * V3(ECC-eccLevel) 도 초과하면 RangeError.\n * @param {string} text\n * @param {'L'|'M'|'H'} [eccLevel]\n * @returns {{version:number, k:number, overhead:number, symbolKey:string}} VERSIONS 원소\n */\nexport function chooseVersion(text, eccLevel = 'M') {\n  const byteLength = payloadByteLength(text);\n  for (const spec of VERSIONS) {\n    const capacity = capacityFor(spec, eccLevel);\n    if (byteLength <= capacity.maxPayloadBytes) return spec;\n  }\n  const last = VERSIONS[VERSIONS.length - 1];\n  throw new RangeError(\n    `페이로드 ${byteLength} B 는 V${last.version}(ECC-${eccLevel}) 용량을 초과한다`,\n  );\n}\n\n/**\n * 인코더 파이프라인 진입점 (SPEC §7.1). version 을 생략하면 `chooseVersion` 으로\n * 자동 선택한다.\n * @param {string} text UTF-8 페이로드\n * @param {{version?: number, eccLevel?: 'L'|'M'|'H'}} [options]\n * @returns {{\n *   version: number, k: number, eccLevel: 'L'|'M'|'H',\n *   capacity: object,\n *   codewordSymbols: Uint8Array,\n *   dataDigits: Uint8Array,\n *   fillerDigits: Uint8Array,\n *   formatDigits: number[],\n *   cellDigits: Map<string, {digit:number, role:'anchor'|'reference'|'format'|'data'|'filler'}>,\n * }}\n */\nexport function encode(text, options = {}) {\n  // version 명시 경로는 chooseVersion(→ payloadByteLength 의 타입 검사)을 건너뛰는데,\n  // TextEncoder 는 undefined → '' · 숫자 → 문자열로 조용히 강제 변환한다 — 호출자의\n  // undefined 실수가 유효해 보이는 빈 코드로 렌더된다. 두 경로의 판정을 일치시킨다\n  // (T9 검증 라운드 발견).\n  if (typeof text !== 'string') {\n    throw new TypeError(`페이로드는 문자열이어야 한다: ${typeof text}`);\n  }\n  const { version, eccLevel = 'M' } = options;\n\n  const spec = version === undefined\n    ? chooseVersion(text, eccLevel)\n    : VERSIONS.find((v) => v.version === version);\n  if (!spec) {\n    throw new RangeError(`알 수 없는 버전: ${version} (허용 ${VERSIONS.map((v) => v.version).join(', ')})`);\n  }\n\n  const capacity = capacityFor(spec, eccLevel);\n  const { k } = spec;\n\n  // 길이 헤더 + 0x00 패딩 (header.js) → base-211 심볼 (base211.js).\n  const framed = frame(text, capacity.dataBytes);\n  const symbols = bytesToSymbols(framed);\n  if (symbols.length !== capacity.dataSymbols) {\n    // 조용히 맞추지 않는다 — 파이프라인 자기검증(과제 지침 절대 규칙).\n    throw new RangeError(\n      `심볼 개수 불일치: bytesToSymbols() ${symbols.length} !== capacity.dataSymbols ${capacity.dataSymbols}`,\n    );\n  }\n\n  // RS(GF(211)) 패리티 부착 → 코드워드 = 데이터 심볼 ‖ 패리티, 길이 S(=usedSymbols).\n  const codewordSymbols = rsEncode(symbols, capacity.nsym);\n  if (codewordSymbols.length !== capacity.usedSymbols) {\n    throw new RangeError(\n      `코드워드 심볼 개수 불일치: rsEncode() ${codewordSymbols.length} !== capacity.usedSymbols ${capacity.usedSymbols}`,\n    );\n  }\n\n  // 심볼 → 3 digit(MSD-first, 프리마스크) → scan order 좌표에 마스크 가산.\n  //\n  // `dataCellsInScanOrder(k)` 는 role === 'data' 인 셀 **전부**(= dataCells 개,\n  // capacity.dataCells)를 돌려준다 — 그중 앞 3S 개가 실제 심볼 3-digit 그룹이고\n  // 나머지 (residualCells 개, = `fillerCells(k)` 와 정확히 같은 셀)가 필러다\n  // (layout.js `symbolCellGroups`/`fillerCells` 의 분할과 동일하게 여기서도 슬라이스한다).\n  const preMaskDataDigits = unpackSymbolsToCellDigits(codewordSymbols); // 길이 3S\n  const scanCells = dataCellsInScanOrder(k);\n  if (scanCells.length !== capacity.dataCells) {\n    throw new RangeError(\n      `scan order 셀 수 불일치: dataCellsInScanOrder() ${scanCells.length} !== capacity.dataCells ${capacity.dataCells}`,\n    );\n  }\n  const dataCellCoords = scanCells.slice(0, preMaskDataDigits.length);\n  const dataDigits = new Uint8Array(preMaskDataDigits.length);\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    dataDigits[i] = maskAdd(preMaskDataDigits[i], c.q, c.r);\n  }\n\n  // 잔여 셀 = 프리마스크 0 에 마스크 가산(§5.6 필러). scan order 의 꼬리와 동일 셀.\n  const fillerCoords = fillerCells(k);\n  if (fillerCoords.length !== capacity.residualCells) {\n    throw new RangeError(\n      `필러 셀 수 불일치: fillerCells() ${fillerCoords.length} !== capacity.residualCells ${capacity.residualCells}`,\n    );\n  }\n  const fillerDigits = new Uint8Array(fillerCoords.length);\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    fillerDigits[i] = maskAdd(0, c.q, c.r);\n  }\n\n  // 포맷 정보(§5.4): 버전 인덱스 = version − 1(V1→0…), eccLevel 문자 → formatinfo 매핑.\n  const eccLevelValue = ECC_LEVEL[eccLevel];\n  if (eccLevelValue === undefined || eccLevelValue === ECC_LEVEL.RESERVED) {\n    throw new RangeError(`알 수 없는 ECC 레벨: ${eccLevel}`);\n  }\n  const formatReplicas = encodeReplicated({ version: spec.version - 1, eccLevel: eccLevelValue });\n  const formatDigits = formatReplicas.flat(); // 길이 15, formatCells(k) 순서와 정합\n\n  // 셀별 digit + role 맵 (불스아이 셀은 애초에 어느 목록에도 없으므로 자동 제외).\n  const cellDigits = new Map();\n\n  const anchors = anchorCells(k); // 각 원소가 이미 {digit: 5 또는 0} 을 들고 있다 — 마스크 없음.\n  for (const c of anchors) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: c.digit, role: 'anchor' });\n  }\n\n  const references = referenceCellsAll(k); // 전부 REFERENCE_DIGIT — 마스크 없음.\n  for (const c of references) {\n    cellDigits.set(cellKey(c.q, c.r), { digit: REFERENCE_DIGIT, role: 'reference' });\n  }\n\n  const formatCoords = formatCells(k);\n  for (let i = 0; i < formatCoords.length; i += 1) {\n    const c = formatCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: formatDigits[i], role: 'format' });\n  }\n\n  for (let i = 0; i < dataCellCoords.length; i += 1) {\n    const c = dataCellCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: dataDigits[i], role: 'data' });\n  }\n\n  for (let i = 0; i < fillerCoords.length; i += 1) {\n    const c = fillerCoords[i];\n    cellDigits.set(cellKey(c.q, c.r), { digit: fillerDigits[i], role: 'filler' });\n  }\n\n  return {\n    version: spec.version,\n    k,\n    eccLevel,\n    capacity,\n    codewordSymbols,\n    dataDigits,\n    fillerDigits,\n    formatDigits,\n    cellDigits,\n  };\n}\n"],
  ["scene", "/**\n * scene.js — 인코딩 결과 → 결정적 도형(scene) 전개 (SPEC §3, §4.1, §5.1)\n *\n * 인코더 산출물(셀별 digit)을 캔버스 미리보기 / PNG·SVG export 가 공유 소비할\n * 단일 도형 목록으로 펼친다. 여기서 확정한 순서(painter order)가 계약이다 —\n * 이후 어떤 백엔드도 이 순서를 재해석하지 않고 그대로 따라 그린다.\n *\n * 이 모듈은 순수 기하 + 계약 조립만 다룬다. luminance.js·encode.js 는 아직\n * 없으므로(병렬 lane 작성 중) import 하지 않는다 — encoded/palette 는 인터페이스\n * 계약으로만 다룬다.\n */\n\nimport { FACES, facePolygon, layoutForRegion, regionCells, axialToPixel } from './hexgrid.js';\nimport { bandRadii } from './bullseye.js';\nimport { digitToRanks } from './lehmer.js';\n\n/** 콰이어트 존 기본 배수 — margin 미지정 시 `cellSize · DEFAULT_MARGIN_FACTOR`. */\nconst DEFAULT_MARGIN_FACTOR = 2;\n\n/**\n * 인코딩 결과로부터 scene 을 조립한다.\n *\n * @param {{k: number, cellDigits: Map<string, {digit: number, role: string}>}} encoded\n * @param {{palette: {background: {r,g,b}, levels: [{r,g,b},{r,g,b},{r,g,b}], bullseyeDark: {r,g,b}, bullseyeLight: {r,g,b}}, cellSize?: number, margin?: number}} options\n * @returns {{k: number, layout: object, width: number, height: number, background: {r,g,b}, shapes: Array}}\n */\nexport function buildScene(encoded, options) {\n  if (encoded === null || typeof encoded !== 'object') {\n    throw new TypeError('encoded 는 객체여야 한다');\n  }\n  const { k, cellDigits } = encoded;\n  if (!Number.isInteger(k) || k < 0) {\n    throw new RangeError(`encoded.k 는 0 이상의 정수여야 한다: ${k}`);\n  }\n  if (!(cellDigits instanceof Map)) {\n    throw new TypeError('encoded.cellDigits 는 Map 이어야 한다');\n  }\n\n  const opts = options || {};\n  const palette = opts.palette;\n  if (palette === null || typeof palette !== 'object') {\n    throw new TypeError('palette 는 객체여야 한다');\n  }\n\n  const cellSize = opts.cellSize === undefined ? 1 : opts.cellSize;\n  const margin =\n    opts.margin === undefined ? DEFAULT_MARGIN_FACTOR * cellSize : opts.margin;\n\n  const layout = layoutForRegion(k, { size: cellSize, margin });\n\n  const shapes = [];\n\n  // (1) 셀 3면 폴리곤 — regionCells(k) 순회 순서로, cellDigits 에 있는 셀만.\n  for (const { q, r } of regionCells(k)) {\n    const key = `${q},${r}`;\n    const entry = cellDigits.get(key);\n    if (entry === undefined) continue; // 불스아이 셀은 Map 에 없다.\n    const ranks = digitToRanks(entry.digit);\n    for (const face of FACES) {\n      shapes.push({\n        kind: 'polygon',\n        points: facePolygon(q, r, face, layout),\n        color: palette.levels[ranks[face]],\n      });\n    }\n  }\n\n  // (2) 불스아이 6 disc — 바깥 밴드(반지름 큰 것)부터. i(0=중심)가 짝수면 dark, 홀수면 light.\n  const center = axialToPixel(0, 0, layout);\n  const radii = bandRadii(cellSize); // 오름차순(안→밖), 마지막이 R_max.\n  for (let i = radii.length - 1; i >= 0; i -= 1) {\n    shapes.push({\n      kind: 'disc',\n      cx: center.x,\n      cy: center.y,\n      r: radii[i],\n      color: i % 2 === 0 ? palette.bullseyeDark : palette.bullseyeLight,\n    });\n  }\n\n  return {\n    k,\n    layout,\n    width: layout.width,\n    height: layout.height,\n    background: palette.background,\n    shapes,\n  };\n}\n"],
  ["raster", "/**\n * raster.js — scene(도형 목록) → RGBA 픽셀 버퍼 순수 래스터라이저 (SPEC §7.2)\n *\n * 브라우저 canvas 에 기대지 않는다 — scene.js 가 만든 도형 목록을 서브샘플\n * 격자 위에 직접 채우고 박스 다운샘플로 안티에일리어싱한다. canvas 미리보기와\n * PNG/SVG export(T10) 모두 이 결과를 공유 소비하므로, 여기서 만든 픽셀이\n * 유일한 진실이다.\n *\n * 결정성이 완료 기준이다: Math.hypot·삼각함수·Math.random·Date 를 쓰지 않는다.\n * 곱셈·덧셈·비교·Math.round/floor/ceil 만 쓴다.\n */\n\n/** 기본 배율(픽셀/scene-단위)·서브샘플 격자 한 변 크기. */\nconst DEFAULT_PIXELS_PER_UNIT = 24;\nconst DEFAULT_SUPERSAMPLE = 2;\n\n/**\n * 도형의 bbox(scene 좌표) — 스캔 범위를 좁혀 전 서브픽셀 × 전 도형 순회를 피한다.\n * @returns {{minX, minY, maxX, maxY}}\n */\nfunction shapeBounds(shape) {\n  if (shape.kind === 'polygon') {\n    let minX = shape.points[0].x;\n    let maxX = shape.points[0].x;\n    let minY = shape.points[0].y;\n    let maxY = shape.points[0].y;\n    for (const p of shape.points) {\n      if (p.x < minX) minX = p.x;\n      if (p.x > maxX) maxX = p.x;\n      if (p.y < minY) minY = p.y;\n      if (p.y > maxY) maxY = p.y;\n    }\n    return { minX, minY, maxX, maxY };\n  }\n  if (shape.kind === 'disc') {\n    return {\n      minX: shape.cx - shape.r,\n      maxX: shape.cx + shape.r,\n      minY: shape.cy - shape.r,\n      maxY: shape.cy + shape.r,\n    };\n  }\n  throw new RangeError(`알 수 없는 shape.kind: ${shape.kind}`);\n}\n\n/**\n * 짝홀(even-odd) ray casting — 점 (x,y) 가 폴리곤(points, 길이 ≥ 3) 내부인가.\n * 표준 다각형 채움 판정 — 삼각함수·hypot 을 쓰지 않는다.\n */\nfunction pointInPolygon(x, y, points) {\n  let inside = false;\n  const n = points.length;\n  for (let i = 0, j = n - 1; i < n; j = i, i += 1) {\n    const xi = points[i].x;\n    const yi = points[i].y;\n    const xj = points[j].x;\n    const yj = points[j].y;\n    const intersects =\n      yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;\n    if (intersects) inside = !inside;\n  }\n  return inside;\n}\n\n/** 점 (x,y) 가 disc(cx,cy,r) 내부인가 — 제곱거리 비교만 사용(hypot 금지). */\nfunction pointInDisc(x, y, cx, cy, r) {\n  const dx = x - cx;\n  const dy = y - cy;\n  return dx * dx + dy * dy <= r * r;\n}\n\nfunction pointInShape(x, y, shape) {\n  if (shape.kind === 'polygon') return pointInPolygon(x, y, shape.points);\n  return pointInDisc(x, y, shape.cx, shape.cy, shape.r);\n}\n\n/**\n * scene 을 RGBA 픽셀 버퍼로 굽는다.\n *\n * 알고리즘: 출력 해상도의 `supersample`배(ss) 되는 서브픽셀 격자를 배경색으로\n * 채운 뒤, shapes 를 painter 순서대로 순회하며 각 도형이 덮는 서브픽셀을\n * 도형 색으로 **덮어쓴다**(뒤에 그려진 도형이 이긴다 — scene.shapes 순서가\n * 그 계약). 마지막에 ss×ss 블록을 채널별 산술평균해 출력 픽셀로 다운샘플한다.\n *\n * @param {{width: number, height: number, background: {r,g,b}, shapes: Array}} scene\n * @param {{pixelsPerUnit?: number, supersample?: number}} [options]\n * @returns {{width: number, height: number, pixelsPerUnit: number, supersample: number, pixels: Uint8ClampedArray}}\n */\nexport function rasterize(scene, options) {\n  if (scene === null || typeof scene !== 'object') {\n    throw new TypeError('scene 은 객체여야 한다');\n  }\n  const opts = options || {};\n  const pixelsPerUnit =\n    opts.pixelsPerUnit === undefined ? DEFAULT_PIXELS_PER_UNIT : opts.pixelsPerUnit;\n  const supersample =\n    opts.supersample === undefined ? DEFAULT_SUPERSAMPLE : opts.supersample;\n\n  if (!Number.isFinite(pixelsPerUnit) || pixelsPerUnit <= 0) {\n    throw new RangeError(`pixelsPerUnit 은 유한한 양수여야 한다: ${pixelsPerUnit}`);\n  }\n  if (!Number.isInteger(supersample) || supersample < 1) {\n    throw new RangeError(`supersample 은 1 이상의 정수여야 한다: ${supersample}`);\n  }\n\n  const width = Math.round(scene.width * pixelsPerUnit);\n  const height = Math.round(scene.height * pixelsPerUnit);\n  const ss = supersample;\n  const ssPixelsPerUnit = pixelsPerUnit * ss;\n  const ssWidth = width * ss;\n  const ssHeight = height * ss;\n  const bg = scene.background;\n\n  // 서브픽셀 격자(RGB, 항상 불투명이므로 alpha 는 다운샘플 후 한 번만 채운다).\n  const sub = new Uint8ClampedArray(ssWidth * ssHeight * 3);\n  for (let i = 0; i < ssWidth * ssHeight; i += 1) {\n    const o = i * 3;\n    sub[o] = bg.r;\n    sub[o + 1] = bg.g;\n    sub[o + 2] = bg.b;\n  }\n\n  for (const shape of scene.shapes) {\n    const b = shapeBounds(shape);\n    const sxMin = Math.max(0, Math.floor(b.minX * ssPixelsPerUnit));\n    const sxMax = Math.min(ssWidth - 1, Math.ceil(b.maxX * ssPixelsPerUnit));\n    const syMin = Math.max(0, Math.floor(b.minY * ssPixelsPerUnit));\n    const syMax = Math.min(ssHeight - 1, Math.ceil(b.maxY * ssPixelsPerUnit));\n\n    for (let sy = syMin; sy <= syMax; sy += 1) {\n      const sceneY = (sy + 0.5) / ssPixelsPerUnit;\n      for (let sx = sxMin; sx <= sxMax; sx += 1) {\n        const sceneX = (sx + 0.5) / ssPixelsPerUnit;\n        if (!pointInShape(sceneX, sceneY, shape)) continue;\n        const o = (sy * ssWidth + sx) * 3;\n        sub[o] = shape.color.r;\n        sub[o + 1] = shape.color.g;\n        sub[o + 2] = shape.color.b;\n      }\n    }\n  }\n\n  // 다운샘플: ss×ss 서브픽셀 블록을 채널별 산술평균 → 출력 픽셀.\n  const ssArea = ss * ss;\n  const pixels = new Uint8ClampedArray(width * height * 4);\n  for (let py = 0; py < height; py += 1) {\n    for (let px = 0; px < width; px += 1) {\n      let sumR = 0;\n      let sumG = 0;\n      let sumB = 0;\n      for (let dy = 0; dy < ss; dy += 1) {\n        const sy = py * ss + dy;\n        for (let dx = 0; dx < ss; dx += 1) {\n          const sx = px * ss + dx;\n          const o = (sy * ssWidth + sx) * 3;\n          sumR += sub[o];\n          sumG += sub[o + 1];\n          sumB += sub[o + 2];\n        }\n      }\n      const o = (py * width + px) * 4;\n      pixels[o] = Math.round(sumR / ssArea);\n      pixels[o + 1] = Math.round(sumG / ssArea);\n      pixels[o + 2] = Math.round(sumB / ssArea);\n      pixels[o + 3] = 255;\n    }\n  }\n\n  return { width, height, pixelsPerUnit, supersample, pixels };\n}\n"],
  ["verify", "/**\n * verify.js — 렌더 자체 검증 (SPEC §4.4 측정 통계 · M0 수용 기준, T9)\n *\n * \"렌더 결과에서 3면 상대휘도 순서가 의도한 digit 과 100% 일치하는가\" 를 디코더\n * 없이 픽셀 샘플링으로 확인한다. 측정 통계는 계약 그대로 **§7.2 샘플 원판 안의\n * 상대휘도 median** 이다 — 면 평균이 아니다 (§4.4 가 그 함정을 명시한다).\n *\n * 샘플링은 RNG 가 아니라 **원판 안에 픽셀 중심이 드는 전 픽셀의 전수 조사**다.\n * 결정적이고(M0 완료 기준), 원판이 작아도 표본 편향이 없다.\n *\n * 이 모듈은 M1 디코더가 아니다 — 기하를 이미 알고(렌더한 쪽이므로) 왜곡도 없다.\n * 순수하게 \"인코더·렌더러 조합이 자기 계약을 지켰는가\" 만 본다.\n */\n\nimport { FACES, faceSampleDisc } from './hexgrid.js';\nimport { ranksToDigit } from './lehmer.js';\nimport { relativeLuminance, DELTA_MIN_CONTRACT } from './luminance.js';\n\n/** 홀수 길이면 중앙값, 짝수 길이면 중앙 두 값의 평균 (ε 하네스와 동일 규약). */\nexport function median(values) {\n  if (values.length === 0) throw new RangeError('median: 빈 표본');\n  const sorted = values.slice().sort((a, b) => a - b);\n  const mid = Math.floor(sorted.length / 2);\n  return sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];\n}\n\n/**\n * 래스터에서 원판(픽셀 좌표) 안 전 픽셀의 상대휘도 median.\n * 픽셀 중심 (px+0.5, py+0.5) 이 원판에 들면 표본에 넣는다. hypot 금지 — 제곱 비교.\n * @param {{width:number,height:number,pixels:Uint8ClampedArray}} raster\n * @param {number} cxPx @param {number} cyPx @param {number} radiusPx\n * @returns {number} 상대휘도 Y (0..1)\n */\nexport function discMedianLuminance(raster, cxPx, cyPx, radiusPx) {\n  const { width, height, pixels } = raster;\n  const x0 = Math.max(0, Math.floor(cxPx - radiusPx));\n  const x1 = Math.min(width - 1, Math.ceil(cxPx + radiusPx));\n  const y0 = Math.max(0, Math.floor(cyPx - radiusPx));\n  const y1 = Math.min(height - 1, Math.ceil(cyPx + radiusPx));\n  const r2 = radiusPx * radiusPx;\n  const values = [];\n  for (let y = y0; y <= y1; y += 1) {\n    for (let x = x0; x <= x1; x += 1) {\n      const dx = x + 0.5 - cxPx;\n      const dy = y + 0.5 - cyPx;\n      if (dx * dx + dy * dy <= r2) {\n        const i = (y * width + x) * 4;\n        values.push(relativeLuminance({ r: pixels[i], g: pixels[i + 1], b: pixels[i + 2] }));\n      }\n    }\n  }\n  if (values.length === 0) {\n    throw new RangeError(\n      `원판 (${cxPx}, ${cyPx}, r=${radiusPx}) 안에 픽셀이 없다 — 해상도가 너무 낮다`,\n    );\n  }\n  return median(values);\n}\n\n/**\n * 셀 (q,r) 의 세 면 원판 median 휘도. 원판 위치·반지름은 §7.2 기본 규약\n * (faceSampleDisc 기본값) 그대로 — 검증이 계약과 다른 영역을 재면 무의미하다.\n * @returns {{T:number, L:number, R:number}}\n */\nexport function measureCellFaceMedians(raster, scene, q, r) {\n  const out = {};\n  for (const face of FACES) {\n    const disc = faceSampleDisc(q, r, face, scene.layout);\n    out[face] = discMedianLuminance(\n      raster,\n      disc.x * raster.pixelsPerUnit,\n      disc.y * raster.pixelsPerUnit,\n      disc.radius * raster.pixelsPerUnit,\n    );\n  }\n  return out;\n}\n\n/** 면별 median → 순위 → digit. 동률은 T,L,R 정준 순서로 안정 결정 (ε 하네스와 동일). */\nexport function recoverDigit(medians) {\n  const order = [0, 1, 2];\n  const values = FACES.map((f) => medians[f]);\n  order.sort((a, b) => values[a] - values[b] || a - b);\n  const ranks = {};\n  order.forEach((faceIdx, rankPos) => {\n    ranks[FACES[faceIdx]] = rankPos;\n  });\n  return ranksToDigit(ranks);\n}\n\n/**\n * 래스터 전체 자체 검증 — encoded.cellDigits 의 전 셀(불스아이 제외 전 역할)에 대해\n * digit 복원 일치와 셀 내 인접 순위 간 분리폭을 잰다.\n *\n * @param {object} raster rasterize() 산출물\n * @param {object} scene buildScene() 산출물 (layout 을 쓴다)\n * @param {{cellDigits: Map<string, {digit:number, role:string}>}} encoded\n * @returns {{total:number, matched:number, mismatches:Array, minDelta:number, ok:boolean}}\n */\nexport function verifyRaster(raster, scene, encoded) {\n  let total = 0;\n  let matched = 0;\n  let minDelta = Infinity;\n  const mismatches = [];\n\n  for (const [cellKey, { digit, role }] of encoded.cellDigits) {\n    const [q, r] = cellKey.split(',').map(Number);\n    const medians = measureCellFaceMedians(raster, scene, q, r);\n    const recovered = recoverDigit(medians);\n\n    const sorted = FACES.map((f) => medians[f]).sort((a, b) => a - b);\n    const delta = Math.min(sorted[1] - sorted[0], sorted[2] - sorted[1]);\n    if (delta < minDelta) minDelta = delta;\n\n    total += 1;\n    if (recovered === digit) {\n      matched += 1;\n    } else {\n      mismatches.push({ q, r, role, expected: digit, recovered, medians });\n    }\n  }\n\n  return {\n    total,\n    matched,\n    mismatches,\n    minDelta,\n    ok: mismatches.length === 0 && minDelta >= DELTA_MIN_CONTRACT,\n  };\n}\n"],
  ["svg", "/**\n * svg.js — scene → SVG 문자열 직렬화 (SPEC §8 내보내기, T10)\n *\n * 결정성이 계약이다 (M0 완료 기준: 동일 입력 → 바이트 동일). 그래서:\n * - 좌표는 전부 toFixed(4) 고정 소수 표기 + `-0.0000` 정규화. 부동소수의\n *   17자리 가변 표기(String())를 쓰지 않는다.\n * - 속성 순서·공백·개행을 코드가 완전히 고정한다. 직렬화 라이브러리 없음.\n * - scene.shapes 의 painter 순서를 그대로 문서 순서로 옮긴다 — 렌더 백엔드\n *   (canvas / 래스터 / SVG) 간 시각 동일성은 scene 이 단일 진실이라서 성립한다.\n *\n * 인접 마름모 사이 안티에일리어싱 헤어라인 심(seam)은 canvas 백엔드와 같은\n * 방식(동일색 얇은 스트로크 중첩)으로 막는다.\n */\n\nconst SEAM_STROKE_WIDTH = 0.03;\n\n/**\n * 고정 소수 좌표 표기. 부호 있는 0(\"-0.0000\")을 0 으로 정규화한다 (결정성·비교 안정).\n * 주의: `(-0).toFixed(4)` 는 \"0.0000\" 이라 -0 리터럴과 비교하는 가드는 죽은 코드다 —\n * 실제로 새는 것은 음의 극소값(예: margin 0 에서 경계 꼭짓점 x = -2.2e-16)이 반올림된\n * \"-0.0000\" 이므로, 반올림 **결과 문자열**의 부호를 본다 (T9 검증 라운드 발견).\n */\nfunction num(n, precision) {\n  const s = n.toFixed(precision);\n  return Number(s) === 0 && s.startsWith('-') ? s.slice(1) : s;\n}\n\nfunction hex2(v) {\n  return v.toString(16).padStart(2, '0');\n}\n\n/** {r,g,b} 8bit → #rrggbb. */\nexport function colorToHex(c) {\n  return `#${hex2(c.r)}${hex2(c.g)}${hex2(c.b)}`;\n}\n\n/**\n * scene → 완결된 SVG 문서 문자열.\n *\n * @param {object} scene buildScene() 산출물\n * @param {{pixelsPerUnit?: number, precision?: number}} [options]\n *   pixelsPerUnit 은 width/height 픽셀 속성에만 쓰인다 — 좌표계는 scene 단위\n *   viewBox 그대로라 확대·축소에 무손실이다.\n * @returns {string}\n */\nexport function sceneToSvg(scene, options = {}) {\n  const ppu = options.pixelsPerUnit === undefined ? 24 : options.pixelsPerUnit;\n  const precision = options.precision === undefined ? 4 : options.precision;\n  if (!Number.isFinite(ppu) || ppu <= 0) {\n    throw new RangeError(`pixelsPerUnit 은 유한한 양수여야 한다: ${ppu}`);\n  }\n  if (!Number.isInteger(precision) || precision < 1 || precision > 8) {\n    throw new RangeError(`precision 은 1..8 정수여야 한다: ${precision}`);\n  }\n  const n = (v) => num(v, precision);\n  const pxW = Math.round(scene.width * ppu);\n  const pxH = Math.round(scene.height * ppu);\n\n  const lines = [];\n  lines.push(\n    `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${pxW}\" height=\"${pxH}\" `\n    + `viewBox=\"0 0 ${n(scene.width)} ${n(scene.height)}\">`,\n  );\n  lines.push(\n    `<rect x=\"0\" y=\"0\" width=\"${n(scene.width)}\" height=\"${n(scene.height)}\" `\n    + `fill=\"${colorToHex(scene.background)}\"/>`,\n  );\n\n  for (const s of scene.shapes) {\n    const fill = colorToHex(s.color);\n    if (s.kind === 'polygon') {\n      const pts = s.points.map((p) => `${n(p.x)},${n(p.y)}`).join(' ');\n      // stroke-width 는 좌표 precision 과 무관하게 고정 표기 — precision 1 에서\n      // num(0.03, 1) = \"0.0\" 이 되어 심 커버가 소멸하는 코너를 막는다 (검증 라운드 발견).\n      lines.push(\n        `<polygon points=\"${pts}\" fill=\"${fill}\" stroke=\"${fill}\" `\n        + `stroke-width=\"${SEAM_STROKE_WIDTH}\" stroke-linejoin=\"round\"/>`,\n      );\n    } else if (s.kind === 'disc') {\n      lines.push(`<circle cx=\"${n(s.cx)}\" cy=\"${n(s.cy)}\" r=\"${n(s.r)}\" fill=\"${fill}\"/>`);\n    } else {\n      throw new RangeError(`알 수 없는 shape kind: ${s.kind}`);\n    }\n  }\n\n  lines.push('</svg>');\n  return `${lines.join('\\n')}\\n`;\n}\n"],
  ["png", "/**\n * png.js — 결정적 PNG 인코더 (SPEC §8 내보내기, T10)\n *\n * 왜 자체 구현인가: M0 완료 기준이 \"동일 입력 → 바이트 동일 출력(PNG 해시 일치)\"인데,\n * 브라우저 canvas.toBlob 은 (1) 벡터 래스터화 픽셀이 엔진·버전별로 다르고 (2) PNG\n * 인코딩(필터 선택·zlib 전략)도 구현마다 달라 바이트 결정성이 원리적으로 불가능하다.\n * 그래서 픽셀은 raster.js(순수 결정적 래스터라이저)가 만들고, 이 모듈이 그 픽셀을\n * 고정된 규칙으로만 직렬화한다 — 적응적 선택이 하나도 없다:\n *\n * - 색 타입 2 (RGB 8bit). 래스터의 알파는 항상 255 라 버린다.\n * - 스캔라인 필터: 첫 행 Sub(1), 나머지 전 행 Up(2). 고정 — 행별 휴리스틱 없음.\n * - deflate: **고정 허프만(BTYPE=01) 단일 블록 + 거리-1 RLE 매치**만 사용.\n *   평면 채색 이미지는 필터 후 데이터가 0 의 장주기 런이라, 거리 1 매치(=직전\n *   바이트 반복)만으로 대부분의 압축이 나온다. 해시 체인 탐색 같은 구현 자유도를\n *   일부러 두지 않는다 — 자유도가 없어야 바이트가 고정된다.\n *\n * 표준 준수는 테스트가 오라클로 단언한다: node:zlib inflate 로 우리 deflate 를\n * 되풀어 원본과 대조하고, IDAT 을 풀어 언필터한 픽셀이 래스터와 일치함을 본다.\n * (zlib 은 테스트에서만 쓴다 — 이 모듈 자체는 브라우저 호환 순수 ESM 이다.)\n */\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 체크섬\n// ─────────────────────────────────────────────────────────────────────────────\n\nconst CRC_TABLE = (() => {\n  const table = new Uint32Array(256);\n  for (let n = 0; n < 256; n += 1) {\n    let c = n;\n    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;\n    table[n] = c >>> 0;\n  }\n  return table;\n})();\n\n/** PNG 청크 CRC-32 (ISO 3309, poly 0xEDB88320 반사형). */\nexport function crc32(bytes) {\n  let c = 0xffffffff;\n  for (let i = 0; i < bytes.length; i += 1) {\n    c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);\n  }\n  return (c ^ 0xffffffff) >>> 0;\n}\n\n/** zlib 트레일러 Adler-32 (RFC 1950, mod 65521). */\nexport function adler32(bytes) {\n  let a = 1;\n  let b = 0;\n  for (let i = 0; i < bytes.length; i += 1) {\n    a = (a + bytes[i]) % 65521;\n    b = (b + a) % 65521;\n  }\n  return ((b << 16) | a) >>> 0;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// deflate — 고정 허프만 + 거리-1 RLE (RFC 1951 §3.2.6)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 비트
