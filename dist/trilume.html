const APP_CODE = "\nimport { encode, chooseVersion } from './encode.js';\nimport { PRESETS, DEFAULT_PRESET, getPreset, BULLSEYE_DARK, BULLSEYE_LIGHT, presetDeltaMin } from './luminance.js';\nimport { buildScene } from './scene.js';\nimport { rasterize } from './raster.js';\nimport { verifyRaster } from './verify.js';\nimport { payloadByteLength } from './header.js';\nimport { rasterToPng } from './png.js';\nimport { sceneToSvg } from './svg.js';\n\nconst $ = (id) => document.getElementById(id);\nconst els = {\n  payload: $('payload'), version: $('version'), ecc: $('ecc'), preset: $('preset'),\n  info: $('info'), error: $('error'), canvas: $('view'),\n  exportPng: $('exportPng'), exportSvg: $('exportSvg'),\n};\n\n/** 마지막 성공 렌더 상태 — export 는 화면과 같은 입력에서 나간다. */\nlet current = null;\n\nfunction download(bytes, mime, filename) {\n  const blob = new Blob([bytes], { type: mime });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = filename;\n  a.click();\n  URL.revokeObjectURL(url);\n}\n\nels.exportPng.addEventListener('click', () => {\n  if (!current) return;\n  const raster = rasterize(current.scene, { pixelsPerUnit: 32, supersample: 2 });\n  download(rasterToPng(raster), 'image/png',\n    `trilume-v${current.encoded.version}-${current.encoded.eccLevel}.png`);\n});\n\nels.exportSvg.addEventListener('click', () => {\n  if (!current) return;\n  download(new TextEncoder().encode(sceneToSvg(current.scene)), 'image/svg+xml',\n    `trilume-v${current.encoded.version}-${current.encoded.eccLevel}.svg`);\n});\n\nfor (const name of Object.keys(PRESETS)) {\n  const opt = document.createElement('option');\n  opt.value = name;\n  opt.textContent = PRESETS[name].label || name;\n  if (name === DEFAULT_PRESET) opt.selected = true;\n  els.preset.appendChild(opt);\n}\n\nfunction paletteOf(name) {\n  const p = getPreset(name);\n  return { background: p.background, levels: p.levels, bullseyeDark: BULLSEYE_DARK, bullseyeLight: BULLSEYE_LIGHT };\n}\n\nconst css = (c) => `rgb(${c.r},${c.g},${c.b})`;\n\n/** scene → canvas. 인접 마름모 사이 AA 실선(헤어라인 심) 방지를 위해 동일색 얇은 스트로크를 겹친다. */\nfunction drawScene(scene, canvas, ppu) {\n  const dpr = window.devicePixelRatio || 1;\n  canvas.width = Math.round(scene.width * ppu * dpr);\n  canvas.height = Math.round(scene.height * ppu * dpr);\n  canvas.style.width = `${Math.round(scene.width * ppu)}px`;\n  canvas.style.height = `${Math.round(scene.height * ppu)}px`;\n  const ctx = canvas.getContext('2d');\n  ctx.setTransform(ppu * dpr, 0, 0, ppu * dpr, 0, 0);\n  ctx.fillStyle = css(scene.background);\n  ctx.fillRect(0, 0, scene.width, scene.height);\n  ctx.lineJoin = 'round';\n  ctx.lineWidth = 0.03;\n  for (const s of scene.shapes) {\n    ctx.fillStyle = css(s.color);\n    ctx.beginPath();\n    if (s.kind === 'polygon') {\n      ctx.moveTo(s.points[0].x, s.points[0].y);\n      for (let i = 1; i < s.points.length; i += 1) ctx.lineTo(s.points[i].x, s.points[i].y);\n      ctx.closePath();\n      ctx.fill();\n      ctx.strokeStyle = ctx.fillStyle;\n      ctx.stroke();\n    } else {\n      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);\n      ctx.fill();\n    }\n  }\n}\n\nlet timer = 0;\nfunction schedule() { clearTimeout(timer); timer = setTimeout(render, 120); }\n\nfunction render() {\n  els.error.textContent = '';\n  const text = els.payload.value;\n  const eccLevel = els.ecc.value;\n  const presetName = els.preset.value;\n  try {\n    const opts = { eccLevel };\n    if (els.version.value !== 'auto') opts.version = Number(els.version.value);\n    const encoded = encode(text, opts);\n    const scene = buildScene(encoded, { palette: paletteOf(presetName) });\n    current = { encoded, scene };\n    drawScene(scene, els.canvas, 26);\n\n    // 자체검증: 미리보기 canvas 가 아니라 결정적 래스터에서 §4.4 통계로 잰다.\n    const raster = rasterize(scene, { pixelsPerUnit: 12, supersample: 2 });\n    const check = verifyRaster(raster, scene, encoded);\n    const bytes = payloadByteLength(text);\n    cons
