최소거리 최대 → {ITU(2), CDMA2000-B(2)} 동률.\n// 2순위 bit 최소거리 최대 → CDMA2000-B(4) > ITU(3). **CDMA2000-B(0x07) 채택.**\n// (3순위 \"표준 채택 사례\" 타이브레이크는 2순위에서 이미 갈렸으므로 불필요.)\n"],
  ["/src/format-proposals.js", "// format-proposals.js — 3중 복제 포맷 읽기의 전체 proposal 열거 (디코더 앞단 계약)\n//\n// decode.js는 이미 확정된 format을 받아 본문만 복호하는 후단 경계다. 포맷 후보를\n// 첫 CRC 성공으로 축소하면 그 경계보다 앞에서 순서 의존성이 굳으므로, 기하 앞단은\n// 이 모듈로 모든 proposal을 얻어 본문·기하 점수까지 평가한 뒤 하나를 선택한다.\n\nimport {\n  CODEWORD_BITS,\n  CRC_BITS,\n  ECC_BITS,\n  ECC_LEVEL,\n  VERSION_BITS,\n  crc6,\n  fromDigits5,\n  removeMask,\n} from '__TLSCAN_BLOB_004__';\n\nconst REPLICA_COUNT = 3;\nconst FORMAT_DIGIT_COUNT = 5;\n\nfunction assertReads(reads) {\n  if (!Array.isArray(reads) || reads.length !== REPLICA_COUNT) {\n    throw new TypeError('reads는 길이 3 배열이어야 한다');\n  }\n  for (let replicaIndex = 0; replicaIndex < REPLICA_COUNT; replicaIndex += 1) {\n    const digits = reads[replicaIndex];\n    if (!digits || typeof digits.length !== 'number' || typeof digits === 'string'\n      || digits.length !== FORMAT_DIGIT_COUNT) {\n      throw new TypeError('각 복제는 길이 5 digit 배열이어야 한다: replica ' + replicaIndex);\n    }\n    for (let digitIndex = 0; digitIndex < FORMAT_DIGIT_COUNT; digitIndex += 1) {\n      const digit = digits[digitIndex];\n      if (!Number.isInteger(digit) || digit < 0 || digit > 5) {\n        throw new RangeError(\n          'digit 범위 위반 (replica ' + replicaIndex + ', 위치 ' + digitIndex + '): ' + digit,\n        );\n      }\n    }\n  }\n}\n\nfunction normalizeVersionIndices(validVersionIndices) {\n  if (validVersionIndices === undefined || validVersionIndices === null\n    || typeof validVersionIndices[Symbol.iterator] !== 'function') {\n    throw new TypeError('validVersionIndices는 기하 가설의 유효 version-index iterable이어야 한다');\n  }\n\n  const allowed = new Set();\n  for (const versionIndex of validVersionIndices) {\n    if (!Number.isInteger(versionIndex) || versionIndex < 0 || versionIndex >= (1 << VERSION_BITS)) {\n      throw new RangeError('validVersionIndices의 값은 0..15 정수여야 한다: ' + versionIndex);\n    }\n    allowed.add(versionIndex);\n  }\n  return allowed;\n}\n\nfunction summarizeConsensus(reads) {\n  const states = [];\n  const majorityDigits = new Array(FORMAT_DIGIT_COUNT).fill(0);\n  let threeOfThree = 0;\n  let twoOfThree = 0;\n  let noConsensus = 0;\n\n  for (let digitIndex = 0; digitIndex < FORMAT_DIGIT_COUNT; digitIndex += 1) {\n    const counts = new Map();\n    for (const digits of reads) counts.set(digits[digitIndex], (counts.get(digits[digitIndex]) ?? 0) + 1);\n\n    let bestDigit = reads[0][digitIndex];\n    let bestCount = 0;\n    for (const [digit, count] of counts) {\n      if (count > bestCount) {\n        bestDigit = digit;\n        bestCount = count;\n      }\n    }\n    majorityDigits[digitIndex] = bestDigit;\n\n    if (bestCount === REPLICA_COUNT) {\n      states.push('3/3');\n      threeOfThree += 1;\n    } else if (bestCount === REPLICA_COUNT - 1) {\n      states.push('2/3');\n      twoOfThree += 1;\n    } else {\n      states.push('none');\n      noConsensus += 1;\n    }\n  }\n\n  return {\n    states,\n    threeOfThree,\n    twoOfThree,\n    noConsensus,\n    majorityDigits,\n  };\n}\n\nfunction copyConsensus(consensus) {\n  return {\n    states: consensus.states.slice(),\n    threeOfThree: consensus.threeOfThree,\n    twoOfThree: consensus.twoOfThree,\n    noConsensus: consensus.noConsensus,\n  };\n}\n\nfunction collectRawProposals(reads, consensus) {\n  const byDigits = new Map();\n\n  const add = (maskedDigits, source, replicaIndex) => {\n    const digits = Array.from(maskedDigits);\n    const key = digits.join(',');\n    let candidate = byDigits.get(key);\n    if (!candidate) {\n      candidate = { maskedDigits: digits, sources: [], replicaIndices: [] };\n      byDigits.set(key, candidate);\n    }\n    candidate.sources.push(source);\n    if (replicaIndex !== undefined) candidate.replicaIndices.push(replicaIndex);\n  };\n\n  // §5.1: 다섯 위치 모두에 2/3 이상 합의가 있을 때만 다수결 proposal을 만든다.\n  if (consensus.noConsensus === 0) add(consensus.majorityDigits, 'majority');\n\n  // 다수결 성공 여부와 무관하게 개별 복제를 보존한다. formatinfo.decode()의 fallback을\n  // 잃지 않으면서도, 첫 CRC 성공이 아닌 후보 전체 평가를 가능하게 한다.\n  for (let replicaIndex = 0; replicaIndex < REPLICA_COUNT; replicaIndex += 1) {\n    add(reads[replicaIndex], 'replica-' + replicaIndex, replicaIndex);\n  }\n\n  return Array.from(byDigits.values());\n}\n\n/**\n * 3중 복제 포맷 digit에서 기하 가설에 가능한 proposal을 전부 만든다.\n *\n * 같은 5-digit 값은 하나로 병합하며 sources와 replicaIndices에 지지 근거를 보존한다.\n * source는 결정적 대표값(majority 우선, 아니면 가장 낮은 replica)을 제공한다.\n * 의미론에서 기각된 값은 proposal로 누설하지 않고 diagnostics에만 센다. CRC 불일치는\n * proposal에 남겨 crcOk:false로 표시한다. 이것이 후보 전체를 평가할 수 있게 하며,\n * 호출자가 첫 CRC 성공에서 반환하는 것을 금지한다.\n *\n * @param {number[][]} reads 마스크 적용된 3복제 × 5 digit 읽기값\n * @param {{validVersionIndices: Iterable<number>}} options\n *   기하로 확정한 현재 패밀리의 유효 version-index 집합\n * @returns {{\n *   proposals: Array<{\n *     versionIndex:number,\n *     eccLevel:number,\n *     crcOk:boolean,\n *     consensus:{states:string[], threeOfThree:number, twoOfThree:number, noConsensus:number},\n *     source:string,\n *     sources:string[],\n *     replicaIndices:number[],\n *     maskedDigits:number[],\n *   }>,\n *   diagnostics:{\n *     generated:{majority:number, replicas:number, unique:number},\n *     semanticRejected:{codewordOutOfRange:number, reservedEcc:number, versionOutsideFamily:number},\n *     crcChecked:number,\n *     crcOk:number,\n *     crcFailed:number,\n *   },\n * }}\n */\nexport function enumerateFormatProposals(reads, { validVersionIndices } = {}) {\n  assertReads(reads);\n  const allowedVersions = normalizeVersionIndices(validVersionIndices);\n  const consensus = summarizeConsensus(reads);\n  const candidates = collectRawProposals(reads, consensus);\n  const diagnostics = {\n    generated: {\n      majority: consensus.noConsensus === 0 ? 1 : 0,\n      replicas: REPLICA_COUNT,\n      unique: candidates.length,\n    },\n    semanticRejected: {\n      codewordOutOfRange: 0,\n      reservedEcc: 0,\n      versionOutsideFamily: 0,\n    },\n    crcChecked: 0,\n    crcOk: 0,\n    crcFailed: 0,\n  };\n  const proposals = [];\n\n  for (const candidate of candidates) {\n    const codeword = fromDigits5(removeMask(candidate.maskedDigits));\n    if (codeword >= (1 << CODEWORD_BITS)) {\n      diagnostics.semanticRejected.codewordOutOfRange += 1;\n      continue;\n    }\n\n    const payload = codeword >> CRC_BITS;\n    const crcField = codeword & ((1 << CRC_BITS) - 1);\n    const versionIndex = payload >> ECC_BITS;\n    const eccLevel = payload & ((1 << ECC_BITS) - 1);\n\n    // §5.2: 값싼 의미론 reject는 CRC보다 먼저다. 예약 ECC/다른 패밀리의 버전은\n    // CRC가 우연히 맞아도 현재 기하 가설의 후보가 될 수 없다.\n    if (eccLevel === ECC_LEVEL.RESERVED) {\n      diagnostics.semanticRejected.reservedEcc += 1;\n      continue;\n    }\n    if (!allowedVersions.has(versionIndex)) {\n      diagnostics.semanticRejected.versionOutsideFamily += 1;\n      continue;\n    }\n\n    diagnostics.crcChecked += 1;\n    const crcOk = crc6(payload) === crcField;\n    if (crcOk) diagnostics.crcOk += 1;\n    else diagnostics.crcFailed += 1;\n\n    proposals.push({\n      versionIndex,\n      eccLevel,\n      crcOk,\n      consensus: copyConsensus(consensus),\n      source: candidate.sources.includes('majority') ? 'majority' : candidate.sources[0],\n      sources: candidate.sources.slice(),\n      replicaIndices: candidate.replicaIndices.slice(),\n      maskedDigits: candidate.maskedDigits.slice(),\n    });\n  }\n\n  return { proposals, diagnostics };\n}\n"],
  ["/src/gfp.js", "/**\n * gfp.js — 소수체 GF(p), p = 211 산술 + 다항식 연산\n *\n * ADR 0001 §2.3·§6: RS 부호를 셀 도메인(3 digit = 1 심볼, 알파벳 크기 216)에서\n * 직접 걸려면 216 이하 최대 소수인 **211** 위의 체가 필요하다. 6³=216 자체는\n * 소수거듭제곱이 아니라서(2³·3³) 체를 이루지 못한다 — GF(6³) 은 \"비표준\"이\n * 아니라 **존재하지 않는다**.\n *\n * ⚠ 표수가 2 가 아니다. GF(2^8)(`gf256.js`) 습관을 그대로 옮기면 전부 틀린다.\n *   - **뺄셈 ≠ 덧셈.** GF(2^m) 에서는 -a = a (XOR 자기역) 이지만 GF(p), p 홀수\n *     소수에서는 -a = p - a ≠ a (a≠0 일 때). `sub` 를 `add` 로 대체하면 안 된다.\n *   - **부호가 실재한다.** 오류 크기(Forney)·다항식 뺄셈 전부에서 부호를\n *     놓치면 \"조용히\" 틀린 값이 나온다 (XOR 세계와 달리 대칭이 없어 자가진단이\n *     안 된다) — 검증 라운드가 이 함정을 실제로 실증했다(ADR §6 리스크표).\n *   - **형식적 미분 계수도 다르다.** GF(2^m) 은 짝수차항이 미분에서 소멸하는\n *     \"홀수항 트릭\"을 쓰지만, GF(p) 의 형식적 미분은 일반 미적분과 같다:\n *     d/dx (c_k x^k) = (k mod p)·c_k · x^(k-1). 홀수항 트릭을 복사하면 틀린다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다 (Node 전용 API 없음).\n *\n * ── 다항식 표현 규약 ─────────────────────────────────────────────────────\n * `gf256.js` 와 동일하게 **big-endian(내림차순)** 계수 배열을 기본으로 쓴다.\n *   poly[0] = 최고차항 계수, poly[poly.length - 1] = 상수항\n * (RS 복호 내부의 Λ(x)·Ω(x) 는 `rs211.js` 안에서 little-endian 을 따로 쓰며\n *  그 파일에 명시돼 있다 — gfp.js 는 big-endian 만 다룬다.)\n */\n\n/** 체의 위수(소수) — 6³ = 216 이하 최대 소수. ADR 0001 §2.3 근거 2. */\nexport const P = 211;\n\n/** 곱셈군 위수 |GF(211)^*| = 210 = 2·3·5·7 */\nexport const MULTIPLICATIVE_ORDER = P - 1; // 210\n\n/** 210 의 소인수 — 생성원 위수 검증에 쓴다 (210 = 2·3·5·7). */\nconst ORDER_PRIME_FACTORS = Object.freeze([2, 3, 5, 7]);\n\n// ── 스칼라 연산 (테이블 독립, 체 생성보다 먼저 필요) ────────────────────\n\n/** a + b mod p */\nexport function add(a, b) {\n  return (a + b) % P;\n}\n\n/**\n * a - b mod p.\n * **뺄셈 ≠ 덧셈.** JS 의 `%` 는 음수를 남길 수 있으므로 +P 로 보정한다.\n */\nexport function sub(a, b) {\n  return ((a - b) % P + P) % P;\n}\n\n/** a * b mod p */\nexport function mul(a, b) {\n  return (a * b) % P;\n}\n\n/**\n * a^n mod p (n >= 0). 반복 제곱(square-and-multiply).\n * 체 생성(테이블 구축) 이전에도 써야 하므로 테이블에 의존하지 않는다.\n */\nexport function modPow(a, n) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`modPow 의 지수는 0 이상 정수여야 한다: ${n}`);\n  }\n  let base = ((a % P) + P) % P;\n  let exp = n;\n  let result = 1;\n  while (exp > 0) {\n    if (exp & 1) result = mul(result, base);\n    base = mul(base, base);\n    exp >>= 1;\n  }\n  return result;\n}\n\n/**\n * a 의 곱셈 역원. **페르마의 소정리** a^(p-2) ≡ a^-1 (mod p) 를 쓴다.\n *\n * 선택 근거: p 가 작은 소수(211)라 `modPow` 반복제곱이 최대 ~8 회 곱셈으로\n * 끝나 확장 유클리드 호제법과 성능 차이가 무의미하고, 나눗셈 없는 곱셈만\n * 쓰므로 구현이 짧고 부호 실수가 끼어들 자리가 없다(확장 유클리드는 몫·나머지\n * 부호 처리가 또 다른 함정이다 — 이 파일 상단 경고와 같은 종류의 실수).\n */\nexport function inverse(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) 0 의 역원은 없다');\n  return modPow(aa, P - 2);\n}\n\n/** a / b mod p */\nexport function div(a, b) {\n  return mul(a, inverse(b));\n}\n\n// ── 생성원 탐색 + exp/log 테이블 ─────────────────────────────────────────\n\n/**\n * g 가 GF(211)^* (위수 210) 의 원시원소(생성원)인지 판정한다.\n * 정의: g^210 = 1 (페르마 소정리로 항상 참) 이고, 210 의 모든 소인수 q 에\n * 대해 g^(210/q) ≠ 1. 이 조건이 위수가 정확히 210(= 부분군 아님)임을 보장한다.\n */\nfunction isPrimitiveRoot(g) {\n  if (modPow(g, MULTIPLICATIVE_ORDER) !== 1) return false; // 안전망 (항상 참이어야 함)\n  for (const q of ORDER_PRIME_FACTORS) {\n    if (modPow(g, MULTIPLICATIVE_ORDER / q) === 1) return false;\n  }\n  return true;\n}\n\n/**\n * 최소 생성원을 계산으로 찾는다 (외우지 않는다 — ADR 지시).\n * 2..p-1 을 순회하며 `isPrimitiveRoot` 로 검증한 첫 값을 쓴다.\n */\nfunction findGenerator() {\n  for (let g = 2; g < P; g++) {\n    if (isPrimitiveRoot(g)) return g;\n  }\n  throw new Error('GF(211) 에서 원시원소를 찾지 못했다 — 산술 구현 버그');\n}\n\n/** 생성원 α. 계산으로 찾되(=2), 값 자체를 export 해 테스트가 재검증할 수 있게 한다. */\nexport const GENERATOR = findGenerator();\n\n/**\n * EXP[i] = α^i mod p, i = 0..209.\n * LOG[EXP[i]] = i (log(0) 은 정의되지 않음 → -1 센티넬).\n *\n * 주기가 210(= MULTIPLICATIVE_ORDER)이다 — GF(2^8) 의 255 와 다르다.\n * 길이를 2*210 으로 잡아 mul/div 색인에서 mod 없이 더할 수 있게 한다.\n */\nconst EXP = new Uint8Array(2 * MULTIPLICATIVE_ORDER);\nconst LOG = new Int16Array(P).fill(-1);\n\n{\n  let x = 1;\n  for (let i = 0; i < MULTIPLICATIVE_ORDER; i++) {\n    if (LOG[x] !== -1) {\n      throw new Error(`생성원 ${GENERATOR} 검증 실패 — 주기가 210 미만이다 (i=${i})`);\n    }\n    EXP[i] = x;\n    LOG[x] = i;\n    x = mul(x, GENERATOR);\n  }\n  if (x !== 1) {\n    throw new Error('GF(211) 생성원 순환 검증 실패 — α^210 ≠ 1');\n  }\n  for (let i = MULTIPLICATIVE_ORDER; i < EXP.length; i++) {\n    EXP[i] = EXP[i - MULTIPLICATIVE_ORDER];\n  }\n}\n\nexport { EXP, LOG };\n\n/** 이산로그. log(0) 은 정의되지 않으므로 예외. */\nexport function log(a) {\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) throw new RangeError('GF(211) log(0) 은 정의되지 않는다');\n  return LOG[aa];\n}\n\n/**\n * α^n. n 은 음수·210 이상도 허용한다 (mod 210 으로 감싼다).\n * 테이블 기반이라 `modPow` 보다 빠르고, 체 구축 이후의 정상 경로다.\n */\nexport function alphaPow(n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const e = ((n % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n/**\n * 테이블 기반 거듭제곱 a^n (n 은 음수 허용, a ≠ 0 이어야 함 — 0 은 `modPow` 로).\n * 관례: 0^0 = 1(빈 곱), 0^n(n>0) = 0, 0^n(n<0) 은 예외.\n */\nexport function pow(a, n) {\n  if (!Number.isInteger(n)) throw new TypeError(`지수는 정수여야 한다: ${n}`);\n  const aa = ((a % P) + P) % P;\n  if (aa === 0) {\n    if (n === 0) return 1;\n    if (n < 0) throw new RangeError('GF(211) 0 의 음수 거듭제곱은 정의되지 않는다');\n    return 0;\n  }\n  const e = (((LOG[aa] * n) % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n  return EXP[e];\n}\n\n// ── 다항식 연산 (big-endian: index 0 = 최고차) ────────────────────────────\n\n/** p(x) * scalar */\nexport function polyScale(p, scalar) {\n  const out = new Uint8Array(p.length);\n  for (let i = 0; i < p.length; i++) out[i] = mul(p[i], scalar);\n  return out;\n}\n\n/** p(x) + q(x). 길이가 다르면 **상수항 기준(오른쪽)** 으로 정렬해 더한다. */\nexport function polyAdd(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = add(out[idx], q[i]);\n  }\n  return out;\n}\n\n/**\n * p(x) - q(x). **표수 2 가 아니므로 `polyAdd` 와 다른 결과다.**\n * (`gf256.js` 에는 이 함수가 없다 — 거기서는 sub === add 라서 불필요했다.)\n */\nexport function polySub(p, q) {\n  const len = Math.max(p.length, q.length);\n  const out = new Uint8Array(len);\n  for (let i = 0; i < p.length; i++) {\n    const idx = i + len - p.length;\n    out[idx] = add(out[idx], p[i]);\n  }\n  for (let i = 0; i < q.length; i++) {\n    const idx = i + len - q.length;\n    out[idx] = sub(out[idx], q[i]);\n  }\n  return out;\n}\n\n/** p(x) * q(x) */\nexport function polyMul(p, q) {\n  if (p.length === 0 || q.length === 0) return new Uint8Array(0);\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) {\n      out[i + j] = add(out[i + j], mul(pi, q[j]));\n    }\n  }\n  return out;\n}\n\n/** 선행 0 계수를 제거한다. 전부 0 이면 [0] 을 돌려준다. */\nexport function polyTrim(p) {\n  let i = 0;\n  while (i < p.length - 1 && p[i] === 0) i++;\n  const out = new Uint8Array(Math.max(p.length - i, 1));\n  for (let j = 0; j < out.length; j++) out[j] = p[i + j] ?? 0;\n  return out;\n}\n\n/**\n * 다항식 나눗셈 (synthetic division).\n * @returns {{quotient: Uint8Array, remainder: Uint8Array}}\n *          remainder 길이 = deg(divisor) (선행 0 포함, 고정 길이)\n */\nexport function polyDiv(dividend, divisor) {\n  const dv = polyTrim(divisor);\n  if (dv.length === 1 && dv[0] === 0) throw new RangeError('0 다항식으로 나눌 수 없다');\n  const degDiv = dv.length - 1;\n  if (dividend.length < dv.length) {\n    const rem = new Uint8Array(degDiv);\n    for (let i = 0; i < dividend.length; i++) {\n      rem[i + degDiv - dividend.length] = dividend[i];\n    }\n    return { quotient: new Uint8Array([0]), remainder: rem };\n  }\n  const work = new Uint8Array(dividend.length);\n  for (let i = 0; i < dividend.length; i++) work[i] = dividend[i];\n  const qLen = dividend.length - degDiv;\n  const dvLeadInv = inverse(dv[0]);\n  for (let i = 0; i < qLen; i++) {\n    const coef = mul(work[i], dvLeadInv);\n    work[i] = coef;\n    if (coef === 0) continue;\n    for (let j = 1; j < dv.length; j++) {\n      if (dv[j] !== 0) work[i + j] = sub(work[i + j], mul(dv[j], coef));\n    }\n  }\n  return { quotient: work.slice(0, qLen), remainder: work.slice(qLen) };\n}\n\n/** Horner 법 평가 p(x) */\nexport function polyEval(p, x) {\n  if (p.length === 0) return 0;\n  let y = p[0];\n  for (let i = 1; i < p.length; i++) y = add(mul(y, x), p[i]);\n  return y;\n}\n"],
  ["/src/header.js", "// header.js — 페이로드 헤더와 코드워드 프레이밍 (SPEC §4.5)\n//\n// 코드워드는 (버전, ECC) 별 **고정 크기**다:\n//\n//   ┌────────┬──────────────────────┬──────────┬───────────────┐\n//   │ 길이 1B │ UTF-8 페이로드        │ 0x00 패딩 │ RS 패리티      │\n//   └────────┴──────────────────────┴──────────┴───────────────┘\n//   └──────────── RS 적용 범위 ───────────────┘\n//\n// 이 모듈은 RS 적용 **전**의 바이트열(= 길이 + 페이로드 + 패딩)만 만들고 되읽는다.\n// 패리티는 rs.js 소관이고, digit 변환은 base6.js 소관이다.\n//\n// [H1] 길이 필드는 **1 바이트**, 페이로드 바이트 수 0..255.\n//      타입 필드는 두지 않는다 — 페이로드는 UTF-8 텍스트 고정이고 콘텐츠 타입 판별은\n//      소비자 몫이다 (QR byte mode 와 같은 스탠스).\n//\n// [H2] 패딩은 **0x00**. QR 식 0xEC/0x11 교대 패턴을 쓰지 않는 이유: 시각 균일화는\n//      마스크(SPEC §4.3)의 책임이고 여기서 중복할 이유가 없다.\n//\n// [H3] 길이 필드의 **유일한** 역할은 패딩 절단이다. digit 경계·청크 모호성과 무관하다.\n//\n// [H4] 페이로드 인코딩은 UTF-8 고정. 문자 수가 아니라 **바이트 수**가 용량을 정한다 —\n//      한글 1자 = 3 바이트다.\n\n/** 길이 필드 크기 (바이트). */\nexport const HEADER_BYTES = 1;\n\n/** 길이 필드가 표현 가능한 최대 페이로드 바이트 수. */\nexport const MAX_PAYLOAD_BYTES = 255;\n\n/** 패딩 바이트 값. */\nexport const PAD_BYTE = 0x00;\n\nconst encoder = new TextEncoder();\nconst decoder = new TextDecoder('utf-8', { fatal: true });\n\n/**\n * 데이터 영역 크기에서 실을 수 있는 최대 페이로드 바이트 수.\n * @param {number} dataBytes 코드워드에서 RS 패리티를 뺀 크기 (헤더 포함)\n * @returns {number}\n */\nexport function maxPayloadFor(dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  if (dataBytes < HEADER_BYTES) return 0;\n  return Math.min(dataBytes - HEADER_BYTES, MAX_PAYLOAD_BYTES);\n}\n\n/**\n * 문자열을 UTF-8 로 인코딩한 바이트 수. 용량 판정에 쓴다.\n * @param {string} text\n * @returns {number}\n */\nexport function payloadByteLength(text) {\n  if (typeof text !== 'string') throw new TypeError(`문자열이어야 한다: ${typeof text}`);\n  return encoder.encode(text).length;\n}\n\n/**\n * UTF-8 텍스트 → 고정 크기 데이터 영역 (헤더 + 페이로드 + 0x00 패딩).\n * 이 결과가 rs.js 의 메시지 입력이 된다.\n *\n * @param {string} text UTF-8 페이로드\n * @param {number} dataBytes 데이터 영역 고정 크기 (= 코드워드 − 패리티)\n * @returns {Uint8Array} 길이 정확히 dataBytes\n */\nexport function frame(text, dataBytes) {\n  assertSize(dataBytes, 'dataBytes');\n  const payload = encoder.encode(text);\n\n  if (payload.length > MAX_PAYLOAD_BYTES) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 는 1 바이트 길이 필드로 표현 불가 (최대 ${MAX_PAYLOAD_BYTES} B)`);\n  }\n  const capacity = maxPayloadFor(dataBytes);\n  if (payload.length > capacity) {\n    throw new RangeError(\n      `페이로드 ${payload.length} B 가 데이터 영역 ${dataBytes} B 의 용량 ${capacity} B 를 초과한다`);\n  }\n\n  const out = new Uint8Array(dataBytes);   // 기본값이 0 이므로 패딩은 자동\n  out[0] = payload.length;\n  out.set(payload, HEADER_BYTES);\n  return out;\n}\n\n/**\n * 데이터 영역 → UTF-8 텍스트. RS 복호 **후**에 호출한다.\n *\n * 손상된 데이터가 여기까지 오면 길이 필드가 쓰레기일 수 있다. 그 경우 조용히 잘린\n * 문자열을 돌려주지 않고 던진다 — 조용한 오복호가 예외보다 훨씬 나쁘다.\n *\n * @param {Uint8Array} data 고정 크기 데이터 영역\n * @param {{lenient?: boolean}} [options] lenient=true 면 길이 초과를 클램프한다 (디버깅용)\n * @returns {{text: string, payloadLength: number, padding: number}}\n */\nexport function unframe(data, options = {}) {\n  if (!(data instanceof Uint8Array)) throw new TypeError('Uint8Array 여야 한다');\n  if (data.length < HEADER_BYTES) {\n    throw new RangeError(`데이터 영역이 헤더보다 작다: ${data.length} B`);\n  }\n\n  const declared = data[0];\n  const available = data.length - HEADER_BYTES;\n  let length = declared;\n\n  if (declared > available) {\n    if (!options.lenient) {\n      throw new RangeError(\n        `길이 필드 ${declared} B 가 가용 ${available} B 를 초과한다 — 데이터 손상 (RS 복호 실패를 의심하라)`);\n    }\n    length = available;\n  }\n\n  const bytes = data.subarray(HEADER_BYTES, HEADER_BYTES + length);\n  let text;\n  try {\n    text = decoder.decode(bytes);\n  } catch (cause) {\n    throw new RangeError('페이로드가 유효한 UTF-8 이 아니다 — 데이터 손상', { cause });\n  }\n  return { text, payloadLength: length, padding: available - length };\n}\n\nfunction assertSize(n, name) {\n  if (!Number.isInteger(n) || n < 0) {\n    throw new RangeError(`${name} 은 0 이상 정수여야 한다: ${n}`);\n  }\n}\n"],
  ["/src/hexgrid.js", "/**\n * hexgrid.js — 육각 격자 + rhombille 3면 분할 기하 (SPEC §3, §7.2)\n *\n * 좌표 규약 (여기서 한 번 못 박고 전 모듈이 따른다):\n *\n * - 정육각형 **pointy-top**. 꼭짓점 하나가 화면 위를 정확히 가리킨다.\n * - `size` = 육각형 **외접원 반지름**(중심 → 꼭짓점). 변의 길이와 같다.\n * - axial 좌표 `(q, r)`. q 는 화면 오른쪽, r 은 오른쪽-아래.\n * - 화면 좌표는 **y 아래가 양수**(canvas 관례). 따라서 \"위\"는 y 가 작은 쪽이다.\n * - 꼭짓점 인덱스 0..5 는 상단 꼭짓점에서 시작해 **화면상 시계방향**.\n *\n *     size=1, 중심 원점 기준 꼭짓점 (이 값이 전 파이프라인의 기준이다):\n *       0 (  0        , -1   )  상단\n *       1 (  √3/2     , -0.5 )  우상\n *       2 (  √3/2     , +0.5 )  우하\n *       3 (  0        , +1   )  하단\n *       4 ( -√3/2     , +0.5 )  좌하\n *       5 ( -√3/2     , -0.5 )  좌상\n *\n * rhombille 분할 (SPEC §3.2):\n *\n * - 중심에서 **교대(alternating) 꼭짓점 3개**(0, 2, 4)로 선을 그어 육각형을 3개의\n *   60°/120° 마름모로 나눈다. 마름모는 `[중심, V(s-1), V(s), V(s+1)]` 이고\n *   `s` 는 그 면의 \"spine\" 꼭짓점이다. 네 변 길이가 모두 `size` 로 같다.\n * - 면 라벨은 아이소메트릭 큐브 은유:\n *     T = 상단면  → spine 꼭짓점 0 (위)\n *     L = 좌측면  → spine 꼭짓점 4 (좌하)\n *     R = 우측면  → spine 꼭짓점 2 (우하)\n * - **코드 전역 방향 기준이며 셀별 회전은 없다.** 면 오프셋은 모든 셀에서 동일하다.\n *\n * 이 모듈은 순수 기하만 다룬다. Node 전용 API 를 쓰지 않으므로 브라우저에서\n * `<script type=\"module\">` 로 그대로 로드된다.\n */\n\n/** √3. 육각 격자 산술이 전부 여기 걸려 있어 한 번만 계산해 둔다. */\nexport const SQRT3 = Math.sqrt(3);\n\n/** √3/2 — pointy-top 육각형의 \"가로 반폭\" 계수. */\nconst H = SQRT3 / 2;\n\n/** 면 라벨. 순서는 SPEC §4.1 의 순위 배열 `(T, L, R)` 과 동일하게 고정한다. */\nexport const FACES = Object.freeze(['T', 'L', 'R']);\n\n/**\n * 면 → spine 꼭짓점 인덱스.\n * 교대 꼭짓점 {0, 2, 4} 만 spine 이 된다 (rhombille 분할의 정의).\n */\nexport const FACE_SPINE_CORNER = Object.freeze({ T: 0, L: 4, R: 2 });\n\n/** axial 이웃 방향 6개 (시계방향 아님 — 관례적 순서). */\nexport const AXIAL_DIRECTIONS = Object.freeze([\n  Object.freeze({ q: 1, r: 0 }),\n  Object.freeze({ q: 1, r: -1 }),\n  Object.freeze({ q: 0, r: -1 }),\n  Object.freeze({ q: -1, r: 0 }),\n  Object.freeze({ q: -1, r: 1 }),\n  Object.freeze({ q: 0, r: 1 }),\n]);\n\n/**\n * size=1 기준 꼭짓점 오프셋. 삼각함수로 매번 계산하면 부동소수 잡음이 끼므로\n * 닫힌 형태 상수로 박아 둔다 (0 은 정확히 0 이어야 한다).\n */\nexport const CORNER_UNIT_OFFSETS = Object.freeze([\n  Object.freeze({ x: 0, y: -1 }),\n  Object.freeze({ x: H, y: -0.5 }),\n  Object.freeze({ x: H, y: 0.5 }),\n  Object.freeze({ x: 0, y: 1 }),\n  Object.freeze({ x: -H, y: 0.5 }),\n  Object.freeze({ x: -H, y: -0.5 }),\n]);\n\n/** 넓이·거리 계수 (size 의 거듭제곱 계수). 렌더러/디코더가 재계산하지 않도록 노출. */\nexport const HEX_AREA_COEFF = (3 * SQRT3) / 2; // 육각형 넓이 = coeff · size²\nexport const FACE_AREA_COEFF = SQRT3 / 2; //     마름모 넓이 = coeff · size²\nexport const FACE_INRADIUS_COEFF = SQRT3 / 4; //  마름모 내접원 반지름 = coeff · size\nexport const CENTER_SPACING_COEFF = SQRT3; //     인접 셀 중심 간 거리 = coeff · size\n\n/** 기본 레이아웃: 단위 크기, 원점 (0,0). */\nexport const DEFAULT_LAYOUT = Object.freeze({ size: 1, originX: 0, originY: 0 });\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레이아웃\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 레이아웃 정규화. `{ size, originX, originY }` 만 읽고 나머지 필드는 무시하므로\n * `layoutForRegion()` 결과(width/height 포함)를 그대로 넘겨도 된다.\n * @param {{size?: number, originX?: number, originY?: number}} [layout]\n * @returns {{size: number, originX: number, originY: number}}\n */\nexport function normalizeLayout(layout) {\n  if (layout === undefined || layout === null) return DEFAULT_LAYOUT;\n  const size = layout.size === undefined ? 1 : layout.size;\n  const originX = layout.originX === undefined ? 0 : layout.originX;\n  const originY = layout.originY === undefined ? 0 : layout.originY;\n  if (!Number.isFinite(size) || size <= 0) {\n    throw new RangeError(`size 는 유한한 양수여야 한다: ${size}`);\n  }\n  if (!Number.isFinite(originX) || !Number.isFinite(originY)) {\n    throw new RangeError(`origin 은 유한해야 한다: (${originX}, ${originY})`);\n  }\n  return { size, originX, originY };\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < 0) {\n    throw new RangeError(`반경 k 는 0 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\nfunction assertFace(face) {\n  if (!Object.prototype.hasOwnProperty.call(FACE_SPINE_CORNER, face)) {\n    throw new RangeError(`면 라벨은 T | L | R 이어야 한다: ${face}`);\n  }\n  return face;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 육각 영역 (SPEC §3.1)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial 원점으로부터의 육각 거리(링 번호). */\nexport function hexDistance(q, r) {\n  return (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2;\n}\n\n/** 반경 k 육각 영역에 속하는가. */\nexport function isInRegion(q, r, k) {\n  assertRadius(k);\n  return hexDistance(q, r) <= k;\n}\n\n/** 반경 k 육각 영역의 셀 수 = 3k² + 3k + 1 (SPEC §3.1). */\nexport function cellCount(k) {\n  assertRadius(k);\n  return 3 * k * k + 3 * k + 1;\n}\n\n/**\n * 반경 k 육각 영역의 모든 셀. 순서는 q 오름차순 → r 오름차순으로 **결정적**이다.\n * (M0 완료 기준이 \"동일 입력 → 결정적 출력\"이므로 순회 순서를 계약으로 고정한다.)\n * @returns {{q: number, r: number}[]}\n */\nexport function regionCells(k) {\n  assertRadius(k);\n  const cells = [];\n  for (let q = -k; q <= k; q++) {\n    const rMin = Math.max(-k, -q - k);\n    const rMax = Math.min(k, -q + k);\n    // `+ 0` 은 -0 정규화다. k=0 일 때 `-k` 가 -0 이 되어 deepStrictEqual·JSON\n    // 비교에서 0 과 갈린다 (결정적 출력 계약을 조용히 깬다).\n    for (let r = rMin; r <= rMax; r++) cells.push({ q: q + 0, r: r + 0 });\n  }\n  return cells;\n}\n\n/** 셀의 6 이웃 axial 좌표. */\nexport function neighbors(q, r) {\n  return AXIAL_DIRECTIONS.map((d) => ({ q: q + d.q, r: r + d.r }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 좌표 변환 (axial ↔ 픽셀). y 는 아래가 양수.\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial → 픽셀 중심 좌표. */\nexport function axialToPixel(q, r, layout) {\n  const { size, originX, originY } = normalizeLayout(layout);\n  return {\n    x: originX + size * SQRT3 * (q + r / 2),\n    y: originY + size * 1.5 * r,\n  };\n}\n\n/** 픽셀 → 실수 axial 좌표 (반올림 전). */\nexport function pixelToAxialFractional(x, y, layout) {\n  const { size, originX, originY } = normalizeLayout(layout);\n  const px = x - originX;\n  const py = y - originY;\n  const r = (2 / 3) * (py / size);\n  const q = px / (size * SQRT3) - r / 2;\n  return { q, r };\n}\n\n/**\n * 실수 axial → 가장 가까운 정수 axial (cube 반올림).\n * 셋 중 오차가 가장 큰 성분을 나머지 둘로부터 복원해 q+r+s=0 을 유지한다.\n */\nexport function axialRound(qf, rf) {\n  const xf = qf;\n  const zf = rf;\n  const yf = -xf - zf;\n  let rx = Math.round(xf);\n  let ry = Math.round(yf);\n  let rz = Math.round(zf);\n  const dx = Math.abs(rx - xf);\n  const dy = Math.abs(ry - yf);\n  const dz = Math.abs(rz - zf);\n  if (dx > dy && dx > dz) rx = -ry - rz;\n  else if (dy > dz) ry = -rx - rz;\n  else rz = -rx - ry;\n  // -0 정규화: deepStrictEqual 및 직렬화에서 0 과 -0 이 갈리는 것을 막는다.\n  return { q: rx + 0, r: rz + 0 };\n}\n\n/** 픽셀 → 가장 가까운 셀의 axial 좌표. 디코더가 격자 스냅에 쓴다. */\nexport function pixelToAxial(x, y, layout) {\n  const { q, r } = pixelToAxialFractional(x, y, layout);\n  return axialRound(q, r);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 육각형\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 육각형 넓이 = (3√3/2)·size². */\nexport function hexArea(size) {\n  return HEX_AREA_COEFF * size * size;\n}\n\n/** 꼭짓점 i 의 중심 기준 오프셋. */\nexport function hexCornerOffset(i, size) {\n  const u = CORNER_UNIT_OFFSETS[((i % 6) + 6) % 6];\n  return { x: u.x * size, y: u.y * size };\n}\n\n/**\n * 셀 (q,r) 의 육각형 꼭짓점 6개. 인덱스 0 = 상단, 이후 화면상 시계방향.\n * @returns {{x: number, y: number}[]}\n */\nexport function hexCorners(q, r, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  return CORNER_UNIT_OFFSETS.map((u) => ({\n    x: c.x + u.x * norm.size,\n    y: c.y + u.y * norm.size,\n  }));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// rhombille 3면 분할 (SPEC §3.2)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 마름모 한 면의 넓이 = (√3/2)·size². 육각형 넓이의 정확히 1/3. */\nexport function faceArea(size) {\n  return FACE_AREA_COEFF * size * size;\n}\n\n/** 마름모 내접원 반지름 = (√3/4)·size. (= 마름모 높이의 절반) */\nexport function faceInradius(size) {\n  return FACE_INRADIUS_COEFF * size;\n}\n\n/**\n * 면의 마름모 폴리곤 (중심 기준 오프셋). 셀별 회전이 없으므로 모든 셀에서 동일하다.\n * 정점 순서: [중심, spine 이전 꼭짓점, spine 꼭짓점, spine 다음 꼭짓점].\n * 세 면 모두 같은 감김(winding)을 가진다.\n * @returns {{x: number, y: number}[]} 길이 4\n */\nexport function facePolygonOffsets(face, size) {\n  assertFace(face);\n  const s = FACE_SPINE_CORNER[face];\n  const idx = [(s + 5) % 6, s, (s + 1) % 6];\n  const poly = [{ x: 0, y: 0 }];\n  for (const i of idx) {\n    const u = CORNER_UNIT_OFFSETS[i];\n    poly.push({ x: u.x * size, y: u.y * size });\n  }\n  return poly;\n}\n\n/** 면의 마름모 폴리곤 (절대 픽셀 좌표). */\nexport function facePolygon(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  return facePolygonOffsets(face, norm.size).map((p) => ({\n    x: c.x + p.x,\n    y: c.y + p.y,\n  }));\n}\n\n/**\n * 면 중심(마름모 중심 = 두 대각선의 교점) 오프셋.\n * 중심 ↔ spine 꼭짓점 대각선의 중점이므로 spine 방향으로 size/2 떨어진 점이다.\n */\nexport function faceCentroidOffset(face, size) {\n  assertFace(face);\n  const u = CORNER_UNIT_OFFSETS[FACE_SPINE_CORNER[face]];\n  return { x: (u.x * size) / 2, y: (u.y * size) / 2 };\n}\n\n/** 면 중심 (절대 픽셀 좌표). */\nexport function faceCentroid(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = axialToPixel(q, r, norm);\n  const o = faceCentroidOffset(face, norm.size);\n  return { x: c.x + o.x, y: c.y + o.y };\n}\n\n/**\n * 면의 내접원. 마름모는 접선다각형이므로 내접원 중심 = 마름모 중심이고\n * 반지름 = 네 변까지의 거리 = (√3/4)·size 로 모두 같다.\n * @returns {{x: number, y: number, radius: number}}\n */\nexport function faceIncircle(q, r, face, layout) {\n  const norm = normalizeLayout(layout);\n  const c = faceCentroid(q, r, face, norm);\n  return { x: c.x, y: c.y, radius: faceInradius(norm.size) };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 샘플링 영역 (SPEC §7.2)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * SPEC §7.2 는 \"면당 내접원 50% 영역 median\" 이라고만 쓰여 있다.\n * 50% 가 **반지름 비율**인지 **넓이 비율**인지 문서에서 확정되지 않았다 (open question).\n * 그래서 확정하지 않고 파라미터로 노출한다.\n *\n * 기본값 `'radius'` 를 고른 근거: SPEC §11 리스크 표가 이 규칙의 목적을\n * \"마름모 예각 뭉개짐으로 인한 샘플링 오염 방지\" 로 못 박고 있다. 세 해석 중\n * 반지름 50% 가 가장 보수적(= 가장 작은 영역, 예각에서 가장 멀다)이므로,\n * 실측(M1) 전까지의 기본값으로 안전한 쪽을 잡았다. 확정되면 이 줄을 갱신한다.\n */\nexport const SAMPLE_FRACTION_DEFAULT = 0.5;\nexport const SAMPLE_FRACTION_OF_DEFAULT = 'radius';\n\n/** 지원하는 비율 해석 모드. */\nexport const SAMPLE_FRACTION_MODES = Object.freeze([\n  'radius', //        r = fraction · 내접원 반지름\n  'incircleArea', //  넓이 = fraction · 내접원 넓이   → r = √fraction · 내접원 반지름\n  'faceArea', //      넓이 = fraction · 마름모 넓이   → r = √(fraction · faceArea / π)\n]);\n\n/**\n * 면의 샘플링 원판. 반지름은 항상 내접원 반지름으로 클램프된다 —\n * 샘플링 영역이 마름모 밖으로 새면 인접 면의 휘도가 섞여 순위가 오염되기 때문에,\n * 파라미터가 과하게 크더라도 조용히 마름모를 벗어나게 두지 않는다.\n *\n * @param {number} q\n * @param {number} r\n * @param {'T'|'L'|'R'} face\n * @param {object} [layout]\n * @param {{fraction?: number, fractionOf?: 'radius'|'incircleArea'|'faceArea'}} [options]\n * @returns {{x: number, y: number, radius: number, clamped: boolean}}\n */\nexport function faceSampleDisc(q, r, face, layout, options) {\n  const norm = normalizeLayout(layout);\n  const opts = options || {};\n  const fraction =\n    opts.fraction === undefined ? SAMPLE_FRACTION_DEFAULT : opts.fraction;\n  const fractionOf =\n    opts.fractionOf === undefined ? SAMPLE_FRACTION_OF_DEFAULT : opts.fractionOf;\n\n  if (!Number.isFinite(fraction) || fraction <= 0 || fraction > 1) {\n    throw new RangeError(`fraction 은 (0, 1] 범위여야 한다: ${fraction}`);\n  }\n  if (!SAMPLE_FRACTION_MODES.includes(fractionOf)) {\n    throw new RangeError(\n      `fractionOf 는 ${SAMPLE_FRACTION_MODES.join(' | ')} 중 하나여야 한다: ${fractionOf}`,\n    );\n  }\n\n  const inradius = faceInradius(norm.size);\n  let radius;\n  if (fractionOf === 'radius') {\n    radius = fraction * inradius;\n  } else if (fractionOf === 'incircleArea') {\n    radius = Math.sqrt(fraction) * inradius;\n  } else {\n    radius = Math.sqrt((fraction * faceArea(norm.size)) / Math.PI);\n  }\n\n  const clamped = radius > inradius;\n  if (clamped) radius = inradius;\n\n  const c = faceCentroid(q, r, face, norm);\n  return { x: c.x, y: c.y, radius, clamped };\n}\n\n/**\n * 한 셀의 세 면 샘플링 원판을 한꺼번에. 디코더가 셀 단위로 순회하므로 편의 제공.\n * @returns {{T: object, L: object, R: object}}\n */\nexport function cellSampleDiscs(q, r, layout, options) {\n  const norm = normalizeLayout(layout);\n  const opts = options || {};\n  const fraction =\n    opts.fraction === undefined ? SAMPLE_FRACTION_DEFAULT : opts.fraction;\n  const fractionOf =\n    opts.fractionOf === undefined ? SAMPLE_FRACTION_OF_DEFAULT : opts.fractionOf;\n\n  if (!Number.isFinite(fraction) || fraction <= 0 || fraction > 1) {\n    throw new RangeError(`fraction 은 (0, 1] 범위여야 한다: ${fraction}`);\n  }\n  if (!SAMPLE_FRACTION_MODES.includes(fractionOf)) {\n    throw new RangeError(\n      `fractionOf 는 ${SAMPLE_FRACTION_MODES.join(' | ')} 중 하나여야 한다: ${fractionOf}`,\n    );\n  }\n\n  const inradius = faceInradius(norm.size);\n  let radius;\n  if (fractionOf === 'radius') {\n    radius = fraction * inradius;\n  } else if (fractionOf === 'incircleArea') {\n    radius = Math.sqrt(fraction) * inradius;\n  } else {\n    radius = Math.sqrt((fraction * faceArea(norm.size)) / Math.PI);\n  }\n  const clamped = radius > inradius;\n  if (clamped) radius = inradius;\n\n  // axialToPixel와 faceCentroid의 산술 순서를 그대로 펼쳐 셀 중심은 한 번만 계산한다.\n  const centerX = norm.originX + norm.size * SQRT3 * (q + r / 2);\n  const centerY = norm.originY + norm.size * 1.5 * r;\n  const out = {};\n  for (const face of FACES) {\n    const offset = faceCentroidOffset(face, norm.size);\n    out[face] = {\n      x: centerX + offset.x,\n      y: centerY + offset.y,\n      radius,\n      clamped,\n    };\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 바운딩 박스 (렌더러가 캔버스 크기 정하는 데 사용)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 코드 영역 전체의 축정렬 바운딩 박스.\n *\n * 닫힌 형태로 계산한다:\n *   가로 반폭 = √3·size·(k + 1/2)   — 최대 (q + r/2) 는 k 이고 여기에 반폭 √3/2·size\n *   세로 반폭 = size·(1.5k + 1)     — 최대 r 은 k 이고 여기에 하단 꼭짓점 size\n * (테스트가 전 셀 꼭짓점 전수 조사와 대조해 이 식을 검증한다.)\n *\n * @returns {{minX,minY,maxX,maxY,width,height}}\n */\nexport function codeBounds(k, layout) {\n  assertRadius(k);\n  const { size, originX, originY } = normalizeLayout(layout);\n  const halfW = SQRT3 * size * (k + 0.5);\n  const halfH = size * (1.5 * k + 1);\n  return {\n    minX: originX - halfW,\n    minY: originY - halfH,\n    maxX: originX + halfW,\n    maxY: originY + halfH,\n    width: 2 * halfW,\n    height: 2 * halfH,\n  };\n}\n\n/**\n * 반경 k 코드를 여백 `margin` 과 함께 담는 캔버스 레이아웃.\n * 반환값을 그대로 layout 으로 넘길 수 있다 (size/originX/originY 포함).\n *\n * @param {number} k\n * @param {{size?: number, margin?: number}} [options]\n * @returns {{k, size, margin, originX, originY, width, height}}\n */\nexport function layoutForRegion(k, options) {\n  assertRadius(k);\n  const opts = options || {};\n  const size = opts.size === undefined ? 1 : opts.size;\n  const margin = opts.margin === undefined ? 0 : opts.margin;\n  if (!Number.isFinite(size) || size <= 0) {\n    throw new RangeError(`size 는 유한한 양수여야 한다: ${size}`);\n  }\n  if (!Number.isFinite(margin) || margin < 0) {\n    throw new RangeError(`margin 은 0 이상이어야 한다: ${margin}`);\n  }\n  const b = codeBounds(k, { size, originX: 0, originY: 0 });\n  return {\n    k,\n    size,\n    margin,\n    originX: margin - b.minX,\n    originY: margin - b.minY,\n    width: b.width + 2 * margin,\n    height: b.height + 2 * margin,\n  };\n}\n"],
  ["/src/bullseye.js", "/**\n * bullseye.js — 중앙 불스아이 파인더 형상·링 수 확정 (SPEC §5.1, T5)\n *\n * MaxiCode 식 동심원 불스아이: 명암 교대 링 3쌍(= 6밴드), 점유 영역은 중심\n * 반경 2링(hexDistance ≤ 2, 19셀). 이 모듈은 그 최대 안전 반지름과 밴드\n * 구조를 hexgrid 기하에서 **계산**으로 유도한다 — 임의 상수를 두지 않는다.\n *\n * R_max 는 두 제약의 min 이다:\n *   1. 19셀 풋프린트(hexDistance ≤ 2) 경계까지의 최소 거리 — 불스아이가\n *      점유 셀 밖으로 새면 인접(비점유) 셀의 렌더링을 침범한다.\n *   2. ring-3 셀(hexDistance = 3)의 샘플 원판(faceSampleDisc, §7.2 기본값)\n *      까지의 최소 여유 — 포맷 정보가 ring 3 에 살므로(§5.4) 그 판독용\n *      샘플 영역을 불스아이가 침범하면 안 된다.\n *\n * 이 모듈은 순수 기하만 다룬다. Node 전용 API 를 쓰지 않는다.\n */\n\nimport {\n  regionCells,\n  hexDistance,\n  hexCorners,\n  faceSampleDisc,\n  FACES,\n  normalizeLayout,\n} from '__TLSCAN_BLOB_008__';\n\n/** 명암 교대 링 3쌍 = 6밴드 (SPEC §5.1). */\nexport const RING_PAIRS = 3;\nexport const BAND_COUNT = RING_PAIRS * 2;\n\n/** 불스아이 점유 반경(hexDistance 상한). 반경 2링 = 19셀. */\nexport const OCCUPIED_RADIUS = 2;\n\n// 정규화된 기본 셀 크기(1)의 기하 계산은 순수·불변이므로 재사용한다.\n// 공개 API는 새 배열을 계속 반환하며, profileAt 내부만 이 읽기 전용 캐시를 쓴다.\nlet canonicalMaxSafeRadius;\nlet canonicalProfileBandRadii;\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기하 헬퍼 (모듈 내부 전용)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 점 p 에서 선분 ab 까지의 최단 거리. */\nfunction distPointToSegment(p, a, b) {\n  const abx = b.x - a.x;\n  const aby = b.y - a.y;\n  const apx = p.x - a.x;\n  const apy = p.y - a.y;\n  const abLenSq = abx * abx + aby * aby;\n  let t = abLenSq === 0 ? 0 : (apx * abx + apy * aby) / abLenSq;\n  t = Math.max(0, Math.min(1, t));\n  const cx = a.x + t * abx;\n  const cy = a.y + t * aby;\n  // Math.hypot 금지 — ES 규격상 implementation-approximated 라 엔진별 1 ulp 이 갈릴 수\n  // 있고, 이 값이 밴드 반지름을 거쳐 렌더 바이트 결정성에 물린다. sqrt 는 IEEE 754\n  // 정확 반올림이라 결정적이다 (T9 검증 라운드 발견).\n  const dx = p.x - cx;\n  const dy = p.y - cy;\n  return Math.sqrt(dx * dx + dy * dy);\n}\n\n/** 원점에서 원점 기준 정수 axial 셀 (q,r) 까지 — region(k) 소속 판정용. */\nfunction inFootprint(q, r) {\n  return hexDistance(q, r) <= OCCUPIED_RADIUS;\n}\n\n/**\n * 19셀 풋프린트(hexDistance ≤ 2)의 경계까지 원점에서의 최소 거리.\n *\n * 풋프린트 안의 각 셀에 대해 6개 변을 순회하고, 그 변이 (풋프린트 밖의\n * 이웃과 접하는) **경계 변**이면 원점-선분 최단거리를 구해 전체 최소를 취한다.\n * \"경계 변\"인지는 변의 중점을 살짝 바깥으로 밀어 axial 로 반올림해서\n * 그 셀이 풋프린트 밖인지로 판정한다 — 이웃 방향 인덱스 매핑에 기대지\n * 않는 견고한 방식이다.\n */\nfunction footprintBoundaryClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const cells = regionCells(OCCUPIED_RADIUS);\n  let minDist = Infinity;\n\n  for (const { q, r } of cells) {\n    const corners = hexCorners(q, r, layout);\n    const cx = cellSize * Math.sqrt(3) * (q + r / 2);\n    const cy = cellSize * 1.5 * r;\n\n    for (let i = 0; i < 6; i++) {\n      const a = corners[i];\n      const b = corners[(i + 1) % 6];\n      const mx = (a.x + b.x) / 2;\n      const my = (a.y + b.y) / 2;\n      // 셀 중심 → 변 중점 방향으로 살짝(변 길이의 5%) 더 밀어 바깥 셀로 넘긴다.\n      const ox = mx + (mx - cx) * 0.05;\n      const oy = my + (my - cy) * 0.05;\n      const outsideQ = ox / (cellSize * Math.sqrt(3)) - (oy / (cellSize * 1.5)) / 2;\n      const outsideR = oy / (cellSize * 1.5);\n      // axial 반올림 (cube 방식) — hexgrid.axialRound 와 동치이나 이 모듈은\n      // 판정에만 쓰므로 로컬로 계산한다 (수치 안정성 목적 외 의미 없음).\n      const rounded = axialRoundLocal(outsideQ, outsideR);\n      if (!inFootprint(rounded.q, rounded.r)) {\n        const d = distPointToSegment({ x: 0, y: 0 }, a, b);\n        if (d < minDist) minDist = d;\n      }\n    }\n  }\n\n  return minDist;\n}\n\nfunction axialRoundLocal(qf, rf) {\n  const xf = qf;\n  const zf = rf;\n  const yf = -xf - zf;\n  let rx = Math.round(xf);\n  let ry = Math.round(yf);\n  let rz = Math.round(zf);\n  const dx = Math.abs(rx - xf);\n  const dy = Math.abs(ry - yf);\n  const dz = Math.abs(rz - zf);\n  if (dx > dy && dx > dz) rx = -ry - rz;\n  else if (dy > dz) ry = -rx - rz;\n  else rz = -rx - ry;\n  return { q: rx, r: rz };\n}\n\n/**\n * ring-3 셀(hexDistance = 3) 전 셀 × 전 면의 샘플 원판까지, 원점에서의\n * 최소 여유(clearance) = min(원점-원판중심 거리 − 원판 반지름).\n */\nfunction ring3DiscClearance(cellSize) {\n  const layout = { size: cellSize, originX: 0, originY: 0 };\n  const ring3 = regionCells(3).filter(({ q, r }) => hexDistance(q, r) === 3);\n  let minClearance = Infinity;\n\n  for (const { q, r } of ring3) {\n    for (const face of FACES) {\n      const disc = faceSampleDisc(q, r, face, layout);\n      // hypot 대신 sqrt — 위 distPointToSegment 와 같은 결정성 사유.\n      const centerDist = Math.sqrt(disc.x * disc.x + disc.y * disc.y);\n      const clearance = centerDist - disc.radius;\n      if (clearance < minClearance) minClearance = clearance;\n    }\n  }\n\n  return minClearance;\n}\n\n/**\n * 최대 안전 반지름 R_max (cellSize 단위) = min(풋프린트 경계 여유, ring-3\n * 원판 비침범 여유).\n * @param {number} [cellSize=1]\n */\nexport function maxSafeRadius(cellSize) {\n  const size = cellSize === undefined ? 1 : normalizeLayout({ size: cellSize }).size;\n  if (size === 1) {\n    if (canonicalMaxSafeRadius === undefined) {\n      canonicalMaxSafeRadius = Math.min(footprintBoundaryClearance(size), ring3DiscClearance(size));\n    }\n    return canonicalMaxSafeRadius;\n  }\n  return Math.min(footprintBoundaryClearance(size), ring3DiscClearance(size));\n}\n\n// 내부 노출 (numbers_check·테스트 진단용) — 공개 API 계약은 아니다.\nexport const _internals = { footprintBoundaryClearance, ring3DiscClearance };\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 밴드 구조\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 6밴드 경계 반지름(안→밖), 마지막 원소가 R_max.\n *\n * **균등 폭으로 확정** — 선정 규칙: 고정된 R_max 와 밴드 수 N 에 대해, 폭의\n * 합이 R_max 로 고정된 분할 중 \"가장 얇은 밴드의 폭\"(검출 강건성의 병목 —\n * 블러·저해상도에서 가장 먼저 뭉개지는 곳)을 최대화하는 분할은 **균등\n * 분할**이다 (단순 산술: 합이 고정된 N 분할에서 최소 밴드는 평균 이하이고, 등호는 균등 분배에서만 성립하므로 최소값은 균등 분배에서 최댓값을\n * 갖는다). \"중심 원판을 크게\" 대안은 중심 밴드를 넓히는 대신 나머지 5밴드가\n * 더 얇아져 최소 밴드 폭이 반드시 감소한다 — 아래 numbers_check 에서 수치로\n * 대조.\n */\nexport function bandRadii(cellSize) {\n  const R = maxSafeRadius(cellSize);\n  const width = R / BAND_COUNT;\n  const radii = [];\n  // 마지막 원소는 (R/N)·N 재계산이 아니라 R 그 자체 — 정의상 최외곽 경계 = R_max 이고,\n  // FP 재계산은 1 ulp 를 얹어 \"마지막 원소가 R_max\" 계약을 깬다 (T9 검증 라운드 여파).\n  for (let i = 1; i < BAND_COUNT; i++) radii.push(width * i);\n  radii.push(R);\n  return radii;\n}\n\nfunction profileBandRadii(cellSize) {\n  if (cellSize === undefined || cellSize === 1) {\n    if (canonicalProfileBandRadii === undefined) {\n      canonicalProfileBandRadii = bandRadii(1);\n    }\n    return canonicalProfileBandRadii;\n  }\n  return bandRadii(cellSize);\n}\n\n/**\n * distFromCenter 위치의 불스아이 프로파일. 반환값은 상대 순위가 아니라\n * 그 자체로 최대 대비 휘도다(0.0 = 암, 1.0 = 명) — 불스아이는 파인더이지\n * 데이터가 아니므로 §4.4 Δmin 계약과 무관하다.\n *\n * 밴드 0(중심)이 암(0)에서 시작해 교대하고, 밴드 5(최외곽)가 명(1)으로\n * 끝난다. 경계는 반개구간 [하한, 상한) 이고 마지막 밴드만 상한 포함(R_max\n * 그 자체는 불스아이 영역이므로).\n *\n * @param {number} distFromCenter\n * @param {number} [cellSize=1]\n * @returns {0 | 1}\n */\nexport function profileAt(distFromCenter, cellSize) {\n  if (!Number.isFinite(distFromCenter) || distFromCenter < 0) {\n    throw new RangeError(`distFromCenter 는 0 이상의 유한수여야 한다: ${distFromCenter}`);\n  }\n  const radii = profileBandRadii(cellSize);\n  const rMax = radii[radii.length - 1];\n  if (distFromCenter > rMax) {\n    throw new RangeError(\n      `distFromCenter(${distFromCenter}) 가 R_max(${rMax}) 를 벗어난다 — 불스아이 밖`,\n    );\n  }\n  for (let i = 0; i < radii.length; i++) {\n    const isLast = i === radii.length - 1;\n    if (isLast ? distFromCenter <= radii[i] : distFromCenter < radii[i]) {\n      return i % 2 === 0 ? 0 : 1;\n    }\n  }\n  // 도달 불가 (위 루프가 isLast 케이스에서 항상 반환) — 방어적 폴백.\n  /* c8 ignore next */\n  return 1;\n}\n\n/**\n * 불스아이가 점유하는 19셀 (hexDistance ≤ 2), 결정적 순서(regionCells 순서\n * 그대로).\n * @returns {{q: number, r: number}[]}\n */\nexport function occupiedCells() {\n  return regionCells(OCCUPIED_RADIUS);\n}\n\n/**\n * 검출기용 기대 방사 시그니처 — 중심(0)에서 R_max 까지 `samples`개 지점을\n * 균등 샘플링한 profileAt 값 배열.\n *\n * @param {number} [cellSize=1]\n * @param {number} [samples=64]\n * @returns {number[]}\n */\nexport function radialSignature(cellSize, samples) {\n  const n = samples === undefined ? 64 : samples;\n  if (!Number.isInteger(n) || n < 2) {\n    throw new RangeError(`samples 는 2 이상의 정수여야 한다: ${n}`);\n  }\n  const rMax = maxSafeRadius(cellSize);\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    // 마지막 표본은 (rMax·i)/(n−1) 재계산이 아니라 rMax 그 자체 — FP 재계산이 1 ulp\n    // 위로 반올림되면 profileAt 의 범위 검사(> rMax)에 걸린다 (bandRadii 와 같은 부류).\n    const d = i === n - 1 ? rMax : (rMax * i) / (n - 1);\n    out.push(profileAt(d, cellSize));\n  }\n  return out;\n}\n"],
  ["/src/decoder/bullseye-detect.js", "/**\n * bullseye-detect.js — Type O 6밴드 불스아이의 결정적 검출·점수화·정제.\n *\n * 입력은 contracts.js의 LumaField이며 모든 기하는 canonical → image 방향이다.\n * canonical 좌표의 단위는 셀 크기 하나이고 원점은 불스아이 중심이다. 반환하는\n * transform/B는 반지름 √13인 정규 불스아이 평면을 영상으로 보낸다.\n *\n * 탐색은 고정 2×2 피라미드와 Sobel 방사 대칭 투표로 중심·스케일 proposal을 모두\n * 모은 뒤, SPD 국소 affine 3자유도와 projective tilt 2자유도를 고정 횟수\n * coordinate descent로 정제한다. 첫 성공을 채택하지 않는다.\n */\n\nimport { maxSafeRadius, profileAt } from '__TLSCAN_BLOB_009__';\nimport {\n  FRONTEND_FAILURE,\n  assertHomography,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\n\nconst BAND_COUNT = 6;\nconst CANONICAL_OUTER_RADIUS = maxSafeRadius(1);\nconst CANONICAL_BAND_WIDTH = CANONICAL_OUTER_RADIUS / BAND_COUNT;\n\n/** radialSignature()의 규범 기본값과 같다. */\nconst DEFAULT_RADIAL_SAMPLES = 64;\n\n// [미검증] M1 calibration 에서 확정 — 설계 §6.4/§15의 초기 angular sample 수.\nconst DEFAULT_ANGULAR_SAMPLES = 48;\n// [미검증] M1 calibration 에서 확정 — 투영된 밴드가 이보다 얇으면 조기 거부한다.\nconst MIN_PROJECTED_BAND_WIDTH_PX = 1.5;\n// [미검증] M1 calibration 에서 확정 — 영상 robust span 대비 최소 불스아이 대비.\nconst MIN_CONTRAST_SPAN_RATIO = 0.45;\n// [미검증] M1 calibration 에서 확정 — 같은 반지름의 angular MAD/contrast 상한.\nconst MAX_ANGULAR_MAD_CONTRAST = 0.25;\n// [미검증] M1 calibration 에서 확정 — 경계 정렬은 해상도와 함께 넓어지지 않는 픽셀 간격으로 잰다.\nconst BOUNDARY_ALIGNMENT_INSET_PX = 1.5;\n// [미검증] M1 calibration 에서 확정 — 0에 붙은 보간 오차는 반전 경계로 판정하지 않는다.\nconst BOUNDARY_SIGN_TOLERANCE_RATIO = 1e-7;\n// [미검증] M1 calibration 에서 확정 — 0 경계를 허용하되 전체 경계 정렬 증거를 요구한다.\nconst MIN_BOUNDARY_ALIGNMENT_SCORE = 0.20;\n// [미검증] M1 calibration 에서 확정 — octave당 고정 스케일 seed 수.\nconst SCALE_SEEDS_PER_OCTAVE = 8;\n// [미검증] M1 calibration 에서 확정 — 5–95% span이 0일 때만 제외할 양끝 표본 수.\nconst ROBUST_TAIL_TRIM_SAMPLES = 32;\n\n// 아래 탐색 예산·proposal 문턱도 M1에서 recall/비용 곡선으로 보정해야 한다.\n// [미검증] M1 calibration 에서 확정.\nconst SOBEL_GRADIENT_SPAN_RATIO = 0.06;\n// 프레임 잡동사니가 gradient 목록을 독점하지 않도록 공간별 강한 edge만 보존한다.\nconst SOBEL_TILE_SIZE = 32;\nconst MAX_SOBEL_POINTS_PER_TILE = 64;\n// 일반 다중스케일 탐색은 레벨별 한 octave 안쪽만 맡아 물리 스케일 중복을 피한다.\nconst PYRAMID_SEARCH_MIN_OUTER_RADIUS = 12;\nconst PYRAMID_SEARCH_MAX_OUTER_RADIUS = 24;\n// [미검증] M1 calibration 에서 확정.\nconst MAX_PYRAMID_LEVELS = 4;\n// [미검증] M1 calibration 에서 확정.\nconst PROPOSALS_PER_SCALE = 4;\n// [미검증] M1 calibration 에서 확정.\nconst MAX_RAW_PROPOSALS = 72;\n// [미검증] M1 calibration 에서 확정.\nconst MAX_REFINED_PROPOSALS = 4;\n// [미검증] M1 calibration 에서 확정.\nconst DEFAULT_REFINE_ITERATIONS = 6;\n// [미검증] M1 calibration 에서 확정 — proposal 정제용 저비용 표본 수. 최종 후보는 64×48로 재평가한다.\nconst REFINEMENT_RADIAL_SAMPLES = 24;\n// [미검증] M1 calibration 에서 확정.\nconst REFINEMENT_ANGULAR_SAMPLES = 24;\n// [미검증] M1 calibration 에서 확정 — 중심 x·y와 등방 스케일을 함께 옮기는 다단 격자.\nconst ISOTROPIC_GRID_STEPS = Object.freeze([\n  Object.freeze({\n    center: 0.14, centerSubdivisions: 2, logScale: 0.055, scaleRadius: 2,\n  }),\n  Object.freeze({\n    center: 0.05, centerSubdivisions: 1, logScale: 0.020, scaleRadius: 1,\n  }),\n  Object.freeze({\n    center: 0.018, centerSubdivisions: 1, logScale: 0.007, scaleRadius: 1,\n  }),\n]);\n// [미검증] M1 calibration 에서 확정.\nconst MAX_OUTER_RADIUS_FRACTION = 0.42;\n// [미검증] M1 calibration 에서 확정.\nconst RAW_SCALE_NMS_LOG_DISTANCE = Math.log(1.22);\n// [미검증] M1 calibration 에서 확정.\nconst FINAL_CENTER_NMS_RADIUS_FACTOR = 0.45;\n\n// denominator=1+p·u+q·v. ±30° 하네스를 0 seed 하나에 맡기지 않는 고정 순서.\n// [미검증] M1 calibration 에서 확정.\nconst PROJECTIVE_TILT_SEEDS = Object.freeze([\n  Object.freeze([0, 0]),\n  Object.freeze([0.024, 0]),\n  Object.freeze([-0.024, 0]),\n  Object.freeze([0, 0.024]),\n  Object.freeze([0, -0.024]),\n  Object.freeze([0.017, 0.017]),\n  Object.freeze([-0.017, -0.017]),\n]);\n\nconst SCORE_EPSILON = 1e-12;\n\nfunction clamp01(value) {\n  if (value <= 0) return 0;\n  if (value >= 1) return 1;\n  return value;\n}\n\nfunction squaredDistance(a, b) {\n  const dx = a.x - b.x;\n  const dy = a.y - b.y;\n  return dx * dx + dy * dy;\n}\n\n/*\n * 모든 score 경로가 이 통계를 아주 자주 부른다 );\n  let current = scoreParams(luma, params, options, stats);\n  if (current === null) return fail(FRONTEND_FAILURE.NO_FINDER, { message: '초기 변환이 퇴화했다' });\n\n  const a = Math.exp(params[2]);\n  const c = Math.exp(params[3]);\n  const localCellSize = Math.sqrt(Math.max(1e-9, a * c - params[4] * params[4]));\n  const localBandWidth = (localCellSize * CANONICAL_OUTER_RADIUS) / BAND_COUNT;\n  const steps = [\n    Math.max(0.25, localBandWidth * 0.45),\n    Math.max(0.25, localBandWidth * 0.45),\n    0.06,\n    0.06,\n    localCellSize * 0.055,\n    0.008,\n    0.008,\n  ];\n\n  for (let iteration = 0; iteration < iterations; iteration += 1) {\n    for (let dimension = 0; dimension < params.length; dimension += 1) {\n      let bestParams = params;\n      let best = current;\n      for (const direction of [-1, 1]) {\n        const trialParams = params.slice();\n        trialParams[dimension] += direction * steps[dimension];\n        const trial = scoreParams(luma, trialParams, options, stats);\n        if (trial !== null && compareScored(trial, best) < 0) {\n          best = trial;\n          bestParams = trialParams;\n        }\n      }\n      params = bestParams;\n      current = best;\n    }\n    for (let dimension = 0; dimension < steps.length; dimension += 1) {\n      steps[dimension] *= 0.5;\n    }\n  }\n  return ok({ candidate: current });\n}\n\nfunction refineBullseyeCore(luma, initial, options, stats) {\n  let baseParams;\n  try {\n    baseParams = paramsFromHomography(homographyFromInitial(initial));\n  } catch (error) {\n    return fail(FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE, { message: error.message });\n  }\n\n  const fastOptions = lowCostScoreOptions(options);\n  const gridded = isotropicGridRefine(luma, baseParams, fastOptions, stats);\n  if (!gridded.ok) return gridded;\n  baseParams = gridded.params;\n\n  const seeds = options.projectiveSeeds === false\n    ? [[baseParams[5], baseParams[6]]]\n    : PROJECTIVE_TILT_SEEDS.map(([x, y]) => [baseParams[5] + x, baseParams[6] + y]);\n  const seededCandidates = [];\n  // 모든 tilt seed를 저비용 표본으로 먼저 평가하고, 최고 seed 하나만 고정 횟수 정제한다.\n  // 첫 hard-pass seed에서 멈추지 않으므로 seed 순서가 결과를 바꾸지 않는다.\n  for (const [tiltX, tiltY] of seeds) {\n    const seeded = baseParams.slice();\n    seeded[5] = tiltX;\n    seeded[6] = tiltY;\n    const candidate = scoreParams(luma, seeded, fastOptions, stats);\n    if (candidate !== null) seededCandidates.push({ params: seeded, candidate });\n  }\n  if (seededCandidates.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { message: '모든 projective seed의 초기 평가가 실패했다' });\n  }\n  seededCandidates.sort((a, b) => compareScored(a.candidate, b.candidate));\n  const refined = coordinateRefine(luma, seededCandidates[0].params, fastOptions, stats);\n  if (!refined.ok) return refined;\n\n  // 저비용 표본은 탐색에만 쓴다. 공개 점수와 hard check는 규범 기본 64×48로 다시 계산한다.\n  // 격자 결과도 함께 보존해 projective coordinate descent의 저비용 표본 과적합을 막는다.\n  const finalScores = [\n    scoreBullseyeCore(luma, gridded.candidate.transform, options, stats),\n    scoreBullseyeCore(luma, refined.candidate.transform, options, stats),\n  ].filter((entry) => entry.ok).map(candidateFromScore);\n  if (finalScores.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { message: '정제 후보의 최종 점수를 만들 수 없다' });\n  }\n  finalScores.sort(compareScored);\n  return ok({\n    candidate: finalScores[0],\n    evaluatedSeeds: seededCandidates.length,\n  });\n}\n\n/** 고정 seed와 고정 횟수 coordinate descent로 한 초기 가설을 정제한다. */\nexport function refineBullseye(luma, initial, options = {}) {\n  const checked = checkedLuma(luma);\n  if (!checked.ok) return checked;\n  const stats = robustStats(luma);\n  if (!(stats.span > 1e-6)) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { message: '휘도 span이 없어 정제할 수 없다' });\n  }\n  return refineBullseyeCore(luma, initial, options, stats);\n}\n\nfunction selectRefinementEntries(coarse, limit) {\n  const byScore = coarse.slice();\n  const byVote = coarse.slice().sort((a, b) => b.proposal.vote - a.proposal.vote\n    || a.proposal.pyramidLevel - b.proposal.pyramidLevel\n    || compareScored(a.candidate, b.candidate));\n  const selected = [];\n  const seen = new Set();\n  for (let index = 0; selected.length < limit\n    && (index < byScore.length || index < byVote.length); index += 1) {\n    for (const entry of [byScore[index], byVote[index]]) {\n      if (entry !== undefined && !seen.has(entry)) {\n        seen.add(entry);\n        selected.push(entry);\n        if (selected.length >= limit) break;\n      }\n    }\n  }\n  return selected;\n}\n\nfunction finalCandidateNms(candidates) {\n  const kept = [];\n  for (const candidate of candidates) {\n    const duplicate = kept.some((other) => {\n      const outerA = candidate.cellSize * CANONICAL_OUTER_RADIUS;\n      const outerB = other.cellSize * CANONICAL_OUTER_RADIUS;\n      const limit = FINAL_CENTER_NMS_RADIUS_FACTOR * Math.min(outerA, outerB);\n      return squaredDistance(candidate.center, other.center) <= limit * limit;\n    });\n    if (!duplicate) kept.push(candidate);\n  }\n  return kept;\n}\n\n/**\n * Type O 불스아이 후보를 전부 평가해 점수순으로 반환한다.\n * @returns {{ok:true,candidates:object[]}|{ok:false,reason:string,detail?:object}}\n */\nexport function detectBullseyes(luma, options = {}) {\n  const checked = checkedLuma(luma);\n  if (!checked.ok) return checked;\n  const stats = robustStats(luma);\n  if (!(stats.span > 1e-6)) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { message: '유효 휘도 대비가 없다' });\n  }\n\n  const raw = collectRawProposals(luma, options);\n  if (raw.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { message: '방사 대칭 중심 proposal이 없다' });\n  }\n\n  const coarse = [];\n  const fastOptions = lowCostScoreOptions(options);\n  for (const proposal of raw) {\n    const cellSize = proposal.outerRadius / CANONICAL_OUTER_RADIUS;\n    const H = homographyFromParams(isotropicParams(proposal.center, cellSize));\n    if (H === null) continue;\n    const scored = scoreBullseyeCore(luma, H, fastOptions, stats);\n    if (scored.ok) {\n      coarse.push({\n        proposal,\n        candidate: candidateFromScore(scored),\n      });\n    }\n  }\n  coarse.sort((a, b) => compareScored(a.candidate, b.candidate)\n    || b.proposal.vote - a.proposal.vote\n    || a.proposal.pyramidLevel - b.proposal.pyramidLevel);\n\n  const refineLimit = options.maxRefinedProposals === undefined\n    ? MAX_REFINED_PROPOSALS\n    : options.maxRefinedProposals;\n  if (!Number.isInteger(refineLimit) || refineLimit < 1 || refineLimit > MAX_RAW_PROPOSALS) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, {\n      message: 'maxRefinedProposals는 1..' + MAX_RAW_PROPOSALS + ' 정수여야 한다',\n    });\n  }\n\n  const refinementEntries = selectRefinementEntries(coarse, refineLimit);\n  const refined = [];\n  // 첫 통과에서 반환하지 않는다. 점수·방사 투표 순위를 섞은 고정 예산을 모두 정제한다.\n  for (const entry of refinementEntries) {\n    const result = refineBullseyeCore(luma, entry.candidate, options, stats);\n    if (result.ok) refined.push(result.candidate);\n  }\n  refined.sort(compareScored);\n\n  const valid = finalCandidateNms(refined.filter((candidate) => candidate.hardChecksPassed));\n  valid.sort(compareScored);\n  if (valid.length === 0) {\n    const best = refined[0] ?? coarse[0]?.candidate;\n    return fail(FRONTEND_FAILURE.NO_FINDER, {\n      evaluatedRaw: raw.length,\n      evaluatedRefined: refinementEntries.length,\n      bestScore: best?.score,\n      bestCandidate: best && {\n        center: { x: best.center.x, y: best.center.y },\n        cellSize: best.cellSize,\n      },\n      hardChecks: best?.bands?.hardChecks,\n    });\n  }\n  return ok({ candidates: valid });\n}\n"],
  ["/src/decoder/grid-sample.js", "/**\n * grid-sample.js — projective canonical 원판 기반의 격자 면 휘도 표본화\n *\n * 화면에서 원을 다시 그리지 않는다. 중심 원점·unit-cell canonical Euclidean\n * 면 원판을 H(canonical Euclidean → image pixel)로 보낸 뒤, image pixel center를\n * 역투영해 원판 포함 여부를 판정한다. axial 좌표나 canvas-origin scene 좌표를\n * H에 직접 넣지 않는다. 그래야\n * 원근 왜곡에서도 SPEC §7.2의 \"면 내접원 50% 영역 median\" 계약을 보존한다.\n */\n\nimport { FACES, cellSampleDiscs } from '__TLSCAN_BLOB_008__';\nimport {\n  FRONTEND_FAILURE,\n  HOMOGRAPHY_CANONICAL_SPACE,\n  assertHomography,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_DISC_SAMPLE_COUNT = 9;\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_PROJECTED_MINOR_DIAMETER_PX = 3;\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_OPAQUE_RATIO = 0.95;\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_RANK_CONFIDENCE = 4;\n\n// [미검증] M1 calibration 에서 확정\n// 상대휘도에서 한 8-bit 단계보다 작은 간격은 현 단계에서 근접 동률로 취급한다.\n// 실제 임계는 M1에서 camera pipeline의 노이즈와 함께 다시 정한다.\nexport const NEAR_TIE_EPSILON = 1 / 255;\n\n// projective 분모의 0 근방은 수치 보정으로 숨기지 않는다. H가 샘플 원판을\n// vanishing line과 교차시키면 그 가설은 사진상 표본을 정의할 수 없다.\nconst HOMOGENEOUS_EPSILON = 1e-12;\n\n/*\n * 같은 LumaField 안에서는 H가 새 Float64Array로 재구성돼도 계수가 같으면 같은\n * 투영이다. 그래서 객체 정체성이 아니라 9개 계수와 원판/표본 설정으로 성공값을\n * 캐시한다. LumaField 자체가 WeakMap 경계라 서로 다른 프레임은 섞이지 않는다.\n */\nconst successfulDiscSamplesByLuma = new WeakMap();\nconst homographyCacheKeys = new WeakMap();\n\nfunction cacheNumberKey(value) {\n  return Object.is(value, -0) ? '-0' : String(value);\n}\n\nfunction homographyCacheKey(H) {\n  const cached = homographyCacheKeys.get(H);\n  if (cached !== undefined) return cached;\n  let key = '';\n  for (let i = 0; i < 9; i += 1) key += cacheNumberKey(H[i]) + '|';\n  homographyCacheKeys.set(H, key);\n  return key;\n}\n\n/*\n * config 세 값은 한 복호 안에서 거의 항상 같은데 `samplingConfig` 가 매번 새 객체를\n * 돌려주므로 객체 정체성으로는 캐시가 안 된다. 값 세 개를 `Object.is` 로 비교해\n * (NaN·-0 까지 정확히) 접미사 문자열만 재사용한다 — 키당 `String()` 6번이 3번이 된다.\n */\nlet lastConfigMinSampleCount = null;\nlet lastConfigMinProjectedMinorDiameter = null;\nlet lastConfigMinOpaqueRatio = null;\nlet lastConfigKeySuffix = null;\n\nfunction configCacheKeySuffix(config) {\n  const a = config.minSampleCount;\n  const b = config.minProjectedMinorDiameter;\n  const c = config.minOpaqueRatio;\n  if (lastConfigKeySuffix !== null\n    && Object.is(a, lastConfigMinSampleCount)\n    && Object.is(b, lastConfigMinProjectedMinorDiameter)\n    && Object.is(c, lastConfigMinOpaqueRatio)) {\n    return lastConfigKeySuffix;\n  }\n  lastConfigMinSampleCount = a;\n  lastConfigMinProjectedMinorDiameter = b;\n  lastConfigMinOpaqueRatio = c;\n  lastConfigKeySuffix = cacheNumberKey(a) + '|' + cacheNumberKey(b) + '|'\n    + cacheNumberKey(c);\n  return lastConfigKeySuffix;\n}\n\nfunction discCacheKey(disc, config) {\n  return cacheNumberKey(disc.x) + '|' + cacheNumberKey(disc.y) + '|'\n    + cacheNumberKey(disc.radius) + '|' + configCacheKeySuffix(config);\n}\n\nfunction successfulDiscCacheFor(luma, H) {\n  let byHomography = successfulDiscSamplesByLuma.get(luma);\n  if (byHomography === undefined) {\n    byHomography = new Map();\n    successfulDiscSamplesByLuma.set(luma, byHomography);\n  }\n  const hKey = homographyCacheKey(H);\n  let samples = byHomography.get(hKey);\n  if (samples === undefined) {\n    samples = new Map();\n    byHomography.set(hKey, samples);\n  }\n  return samples;\n}\n\nfunction cacheSuccessfulDiscSample(samples, key, result) {\n  samples.set(key, {\n    median: result.median,\n    mad: result.mad,\n    count: result.count,\n    opaqueCount: result.opaqueCount,\n    opaqueRatio: result.opaqueRatio,\n    projectedMinorDiameter: result.projectedMinorDiameter,\n    geometricCount: result.geometricCount,\n  });\n}\n\n/*\n * 원판 표본은 셀마다 median과 MAD를 구한다. Float64Array scratch와 stable 순번을\n * 재사용해 전체 정렬과 임시 deviations 배열을 없앤다.\n */\nlet discValuesScratch = new Float64Array(0);\nlet medianValuesScratch = new , undefined, discOptions(options));\n  const optionsForDisc = sampleOptions(options);\n  const measured = {};\n  const failures = [];\n\n  // 세 면을 모두 시도한 뒤 종합 실패한다. 한 면의 결과만으로 나머지 표본을\n  // 생략하면 진단이 입력 순서에 의존하고, 레퍼런스 보정의 원인을 잃는다.\n  for (const face of FACES) {\n    const result = sampleProjectedDisc(luma, H, discs[face], optionsForDisc);\n    if (!result.ok) {\n      failures.push({ face, reason: result.reason, detail: result.detail });\n      continue;\n    }\n    measured[face] = {\n      median: result.median,\n      mad: result.mad,\n      count: result.count,\n    };\n  }\n\n  if (failures.length > 0) {\n    const homographyOnly = failures.every(\n      (entry) => entry.reason === FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE,\n    );\n    const clipped = failures.some(\n      (entry) => entry.reason === FRONTEND_FAILURE.SYMBOL_CLIPPED,\n    );\n    return fail(\n      homographyOnly\n        ? FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE\n        : clipped\n          ? FRONTEND_FAILURE.SYMBOL_CLIPPED\n          : FRONTEND_FAILURE.SAMPLE_STARVED,\n      { stage: 'sample-hex-cell', q, r, failures },\n    );\n  }\n\n  const rank = rankConfidence(measured, options);\n  return ok({\n    T: measured.T,\n    L: measured.L,\n    R: measured.R,\n    separation: rank.separation,\n    tie: rank.tie,\n  });\n}\n\nfunction parseLayoutEntry(entry) {\n  const key = entry[0];\n  const metadata = entry[1];\n  if (typeof key === 'string') {\n    const match = /^(-?\\d+),(-?\\d+)$/.exec(key);\n    if (!match) throw new TypeError('layoutMap 키는 \"q,r\" 정수 형식이어야 한다: ' + key);\n    return { q: Number(match[1]) + 0, r: Number(match[2]) + 0, metadata };\n  }\n  if (key && typeof key === 'object' && Number.isInteger(key.q) && Number.isInteger(key.r)) {\n    return { q: key.q + 0, r: key.r + 0, metadata };\n  }\n  throw new TypeError('layoutMap 키는 \"q,r\" 또는 {q,r}여야 한다');\n}\n\nfunction layoutEntries(layoutMap) {\n  if (layoutMap instanceof Map) return [...layoutMap.entries()];\n  if (Array.isArray(layoutMap)) return layoutMap.slice();\n  if (layoutMap && typeof layoutMap === 'object') {\n    // 일반 객체 입력도 허용하되, 객체 열거 순서에 결과가 흔들리지 않게 좌표 순서로\n    // 정렬한다. 규범 layoutMap(Map)의 원래 삽입 순서는 그대로 보존한다.\n    return Object.entries(layoutMap).sort((a, b) => {\n      const left = parseLayoutEntry(a);\n      const right = parseLayoutEntry(b);\n      return left.q - right.q || left.r - right.r;\n    });\n  }\n  throw new TypeError('layoutMap 은 Map, entry 배열, 또는 \"q,r\" 키 객체여야 한다');\n}\n\n/**\n * 레이아웃 맵의 모든 비-불스아이 셀을 결정적 순서로 표본화한다.\n * 성공 시 cells는 Map<\"q,r\", CellSample> 이다. 역할 정보는 입력 layoutMap이\n * 이미 소유하므로 CellSample 계약에 임의 필드를 섞지 않는다.\n */\nexport function sampleHexGrid(luma, geometry, layoutMap, options = {}) {\n  assertLumaField(luma);\n  const cells = new Map();\n  const failures = [];\n  let skippedBullseyes = 0;\n\n  for (const entry of layoutEntries(layoutMap)) {\n    const parsed = parseLayoutEntry(entry);\n    if (parsed.metadata && parsed.metadata.role === 'bullseye') {\n      skippedBullseyes += 1;\n      continue;\n    }\n\n    const result = sampleHexCell(luma, geometry, parsed.q, parsed.r, options);\n    const key = parsed.q + ',' + parsed.r;\n    if (!result.ok) {\n      failures.push({ key, q: parsed.q, r: parsed.r, reason: result.reason, detail: result.detail });\n      continue;\n    }\n    cells.set(key, {\n      T: result.T,\n      L: result.L,\n      R: result.R,\n      separation: result.separation,\n      tie: result.tie,\n    });\n  }\n\n  if (failures.length > 0) {\n    const homographyOnly = failures.every(\n      (entry) => entry.reason === FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE,\n    );\n    const clipped = failures.some(\n      (entry) => entry.reason === FRONTEND_FAILURE.SYMBOL_CLIPPED,\n    );\n    return fail(\n      homographyOnly\n        ? FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE\n        : clipped\n          ? FRONTEND_FAILURE.SYMBOL_CLIPPED\n          : FRONTEND_FAILURE.SAMPLE_STARVED,\n      {\n        stage: 'sample-hex-grid',\n        sampledCount: cells.size,\n        skippedBullseyes,\n        failures,\n      },\n    );\n  }\n\n  return ok({\n    cells,\n    sampledCount: cells.size,\n    skippedBullseyes,\n  });\n}\n"],
