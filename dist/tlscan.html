mbolKey: 'Y1',\r\n  }),\r\n  Object.freeze({\r\n    name: 'Y2', version: 2, n: 25, tones: 2, formatIndex: 9, overhead: overheadBreakdownY(25).total, symbolKey: 'Y2',\r\n  }),\r\n  Object.freeze({\r\n    name: 'Y0T', version: 0, n: 13, tones: 3, formatIndex: 2, overhead: overheadBreakdownY(13).total, symbolKey: 'Y0',\r\n  }),\r\n  Object.freeze({\r\n    name: 'Y1T', version: 1, n: 21, tones: 3, formatIndex: 10, overhead: overheadBreakdownY(21).total, symbolKey: 'Y1',\r\n  }),\r\n  Object.freeze({\r\n    name: 'Y2T', version: 2, n: 25, tones: 3, formatIndex: 11, overhead: overheadBreakdownY(25).total, symbolKey: 'Y2',\r\n  }),\r\n]);\r\n\r\n/**\r\n * (version, tones) → VERSIONS_Y 항목. 인코더/디코더가 모드를 명시했을 때의\r\n * 단일 조회 진입점 — 필드 4개(name/tones/formatIndex 포함)를 재조합하지 않는다.\r\n * @param {number} version 0 | 1 | 2\r\n * @param {2|3} [tones] 기본 2(2톤 메인).\r\n * @returns {{name:string, version:number, n:number, tones:2|3, formatIndex:number, overhead:number, symbolKey:string}}\r\n */\r\nexport function versionSpecY(version, tones = 2) {\r\n  const spec = VERSIONS_Y.find((v) => v.version === version && v.tones === tones);\r\n  if (!spec) {\r\n    throw new RangeError(\r\n      `알 수 없는 Type Y 버전/모드: version=${version}, tones=${tones} `\r\n      + `(허용 ${VERSIONS_Y.map((v) => `${v.name}(v${v.version}/t${v.tones})`).join(', ')})`,\r\n    );\r\n  }\r\n  return spec;\r\n}\r\n\r\n// ─────────────────────────────────────────────────────────────────────────\r\n// 면 내 QR 윈도 β (ADR 0003 D1 + [C7 Q7]) — Y2(n=25)·tones=2 전용\r\n// ─────────────────────────────────────────────────────────────────────────\r\n//\r\n// 윈도 좌표(와이어, 스냅샷 고정): 상단면(T) 의 바깥 꼭짓점 코너 — (i,j) ∈\r\n// [n-13, n-1]² (W=13 — ½피치 v1 QR: 21 QR모듈 + 안쪽 2변 콰이어트 4 QR모듈 = 25\r\n// QR모듈 = 12.5 데이터 피치, 바깥 2변 콰이어트는 실루엣 밖 배경이 제공, ADR 0003\r\n// D1). **제외 좌표는 세 면 전부 데이터에서 뺀다** — window===true 인코딩은 이\r\n// 좌표들을 cellDigits 에 아예 싣지 않는다.\r\n//\r\n// [C7 부속 계약 ① — 실계산으로 확인, ADR 원문이 명시한 것보다 넓다] n=25 에서\r\n// 윈도 [12,24]² 와 겹치는 것은 **레퍼런스 앵커 (n-3,n-3)=(22,22) 조 전체(3셀)\r\n// 뿐 아니라 포맷 정보 복제 2(i=n-8..n-4, j=n-2 — 5셀 전부)도 겹친다** (ADR\r\n// 0003b 자문 원문은 레퍼런스만 짚었다 — 이 lane 이 실계산으로 포맷 복제 2 충돌을\r\n// 추가로 발견했다, 아래 모듈 로드 시점 자기검증 참조). 조용히 옮기지 않고\r\n// 결정적 탐색으로 해소한다: |shift| 오름차순으로 j축 평행이동을 먼저 시도하고\r\n// (윈도가 항상 (n-13..n-1) 코너에 있으므로 j 감소가 항상 벗어나는 방향이다),\r\n// 실패하면 i축을 시도해 \"윈도 밖·격자 내·미점유\"인 최초 해를 그 그룹 전체(조/\r\n// 복제, 구조·상대좌표·digit 배정 순서 불변)에 적용한다. n=25/tones=2 결과\r\n// (스냅샷, encodeY.test.js 가 회귀로 고정):\r\n//   레퍼런스 조 D: (22,22)→(22,10) · (23,22)→(23,10) · (22,23)→(22,11) (j축 −12)\r\n//   포맷 복제 2:   (17,23)→(7,23) · (18,23)→(8,23) · (19,23)→(9,23) ·\r\n//                  (20,23)→(10,23) · (21,23)→(11,23) (i축 −10)\r\n\r\n/** 윈도 한 변의 데이터 셀 폭 W (ADR 0003 D1). */\r\nexport const WINDOW_SIZE_Y = 13;\r\n\r\n/** 윈도가 지원되는 유일한 (n, tones) — Y2/2톤(D1 조건 ②: n≥25, Y1 은 불가). */\r\nexport const WINDOW_SUPPORTED_N = 25;\r\nexport const WINDOW_SUPPORTED_TONES = 2;\r\n\r\n/** 윈도 경계(포함) — (i,j) ∈ [lo, hi]² 이면 윈도 안. */\r\nexport function windowBoundsY(n) {\r\n  return { lo: n - WINDOW_SIZE_Y, hi: n - 1 };\r\n}\r\n\r\n/** 좌표 (i,j) 가 윈도 안인가. */\r\nexport function inWindowY(i, j, n) {\r\n  const { lo, hi } = windowBoundsY(n);\r\n  return i >= lo && i <= hi && j >= lo && j <= hi;\r\n}\r\n\r\nfunction cellKeyY(i, j) {\r\n  return `${i},${j}`;\r\n}\r\n\r\nfunction translateCellsY(cells, di, dj) {\r\n  return cells.map((c) => ({ ...c, i: c.i + di, j: c.j + dj }));\r\n}\r\n\r\nfunction cellsClearOfWindow(cells, n, occupied) {\r\n  for (const c of cells) {\r\n    if (c.i < 0 || c.i > n - 1 || c.j < 0 || c.j > n - 1) return false;\r\n    if (inWindowY(c.i, c.j, n)) return false;\r\n    if (occupied.has(cellKeyY(c.i, c.j))) return false;\r\n  }\r\n  return true;\r\n}\r\n\r\n/**\r\n * 결정적 탐색 — |shift| 오름차순, 매 shift 에서 j축 평행이동을 먼저 시도하고\r\n * 실패하면 i축을 시도한다. 그룹(조/복제)을 통째로 옮긴다(구조·상대좌표 불변).\r\n * 위 모듈 헤더 주석의 n=25 결과가 이 탐색의 산출물이다(재현 가능, 하드코딩 아님).\r\n */\r\nfunction relocateGroupOutOfWindow(cells, n, occupied, maxShift) {\r\n  for (let shift = 1; shift <= maxShift; shift += 1) {\r\n    const byJ = translateCellsY(cells, 0, -shift);\r\n    if (cellsClearOfWindow(byJ, n, occupied)) return byJ;\r\n    const byI = translateCellsY(cells, -shift, 0);\r\n    if (cellsClearOfWindow(byI, n, occupied)) return byI;\r\n  }\r\n  throw new RangeError(`n=${n}: 윈도 충돌 그룹을 재배치할 탐색 범위(${maxShift}) 안에서 못 찾았다`);\r\n}\r\n\r\n/**\r\n * 윈도 배제 후 레퍼런스 4조. 윈도와 안 겹치는 조는 그대로, 겹치는 조(3셀 전부\r\n * 윈도 안이어야 함 — 부분 겹침은 결정 규칙 밖이라 throw)는 통째 재배치한다.\r\n * @param {number} n\r\n * @param {2|3} [tones]\r\n * @returns {{cells:{i:number,j:number}[], digits:number[]}[]} 길이 4\r\n */\r\nexport function windowedReferenceGroupsY(n, tones = 2) {\r\n  const groups = referenceGroups(n, tones);\r\n  const occupied = new Set();\r\n  for (const g of groups) {\r\n    for (const c of g.cells) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\r\n  }\r\n  for (const c of formatCells(n)) {\r\n    if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\r\n  }\r\n\r\n  return groups.map((g) => {\r\n    const flags = g.cells.map((c) => inWindowY(c.i, c.j, n));\r\n    if (flags.every((f) => !f)) return g; // 안 겹침 — 그대로.\r\n    if (!flags.every(Boolean)) {\r\n      throw new RangeError(`n=${n}: 레퍼런스 조가 윈도와 부분 겹침 — 결정 규칙 밖 (${JSON.stringify(g.cells)})`);\r\n    }\r\n    const relocated = relocateGroupOutOfWindow(g.cells, n, occupied, n);\r\n    relocated.forEach((c) => occupied.add(cellKeyY(c.i, c.j)));\r\n    return { cells: relocated, digits: g.digits };\r\n  });\r\n}\r\n\r\n/** 윈도 배제 후 레퍼런스 12셀 전부(조 순·조 내 순 평탄화), digit 포함. */\r\nexport function windowedReferenceCellsY(n, tones = 2) {\r\n  const out = [];\r\n  for (const group of windowedReferenceGroupsY(n, tones)) {\r\n    group.cells.forEach((cell, idx) => out.push({ ...cell, digit: group.digits[idx] }));\r\n  }\r\n  return out;\r\n}\r\n\r\n/**\r\n * 윈도 배제 후 포맷 정보 15셀. 복제 단위(FORMAT_BLOCK_LENGTH=5셀 연속 런)로\r\n * 전부/전무만 허용 — 부분 겹침은 결정 규칙 밖(throw).\r\n * @param {number} n\r\n * @returns {{i:number,j:number}[]} 길이 15\r\n */\r\nexport function windowedFormatCellsY(n) {\r\n  const cells = formatCells(n);\r\n  const occupied = new Set();\r\n  for (const c of cells) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\r\n  for (const c of referenceCellsAll(n)) if (!inWindowY(c.i, c.j, n)) occupied.add(cellKeyY(c.i, c.j));\r\n\r\n  const out = [];\r\n  for (let r = 0; r < cells.length; r += FORMAT_BLOCK_LENGTH) {\r\n    const run = cells.slice(r, r + FORMAT_BLOCK_LENGTH);\r\n    const flags = run.map((c) => inWindowY(c.i, c.j, n));\r\n    if (flags.every((f) => !f)) {\r\n      out.push(...run);\r\n      continue;\r\n    }\r\n    if (!flags.every(Boolean)) {\r\n      throw new RangeError(`n=${n}: 포맷 복제가 윈도와 부분 겹침 — 결정 규칙 밖 (${JSON.stringify(run)})`);\r\n    }\r\n    const relocated = relocateGroupOutOfWindow(run, n, occupied, n);\r\n    relocated.forEach((c) => occupied.add(cellKeyY(c.i, c.j)));\r\n    out.push(...relocated);\r\n  }\r\n  return out;\r\n}\r\n\r\n/** 윈도가 배제하는 W² 좌표 전부(재배치 후에는 순수 데이터-제외 영역이 된다). */\r\nexport function windowExcludedCellsY(n) {\r\n  const { lo, hi } = windowBoundsY(n);\r\n  const out = [];\r\n  for (let j = lo; j <= hi; j += 1) {\r\n    for (let i = lo; i <= hi; i += 1) out.push({ i, j });\r\n  }\r\n  return out;\r\n}\r\n\r\n/**\r\n * 윈도 후 오버헤드 — 레퍼런스 12 + 포맷 15(재배치로 위치만 바뀔 뿐 개수는 불변)\r\n * + 윈도 배제 W². overhead(=27) 는 표시용이 아니라 실제 역할 셀 수 그대로 두고,\r\n * windowExcluded 를 별도 필드로 노출한다(오버헤드 정의 자체를 바꾸지 않는다).\r\n */\r\nexport function overheadBreakdownY2Window() {\r\n  const base = overheadBreakdownY(WINDOW_SUPPORTED_N);\r\n  return { ...base, windowExcluded: WINDOW_SIZE_Y * WINDOW_SIZE_Y };\r\n}\r\n\r\n/**\r\n * [✅ 확정 — 사용자 비준 2026-08-09, hb-20260809-tlrat1] Y2W 사용 심볼(143) 대비 ECC 레벨별 nsym. capacityForY2Window() 가\r\n * 실계산하는 dataCells(429)/usedSymbols(143) 에 대해 NSYM_TABLE_Y 와 동일 절차\r\n * (M = round(0.25·S), 짝수면 +1 홀수화 · L = round(0.12·S) · H = round(0.40·S)):\r\n *   S=143 → M: round(35.75)=36(짝) → 37 · L: round(17.16)=17 · H: round(57.2)=57\r\n */\r\nexport const NSYM_TABLE_Y2W = Object.freeze({ symbols: 143, L: 17, M: 37, H: 57 });\r\n\r\n/**\r\n * Y2W(면 내 QR 윈도 채택) 용량. version=2/tones=2 전용 — `capacityForY` 의 창\r\n * 배제 변형. **formatIndex 는 Y2 와 동일(9)** — 윈도 유/무는 와이어(포맷 정보)가\r\n * 아니라 광학 검출 + 사후 RS/CRC 로 구분한다(ADR 0003 [C7 Q7], β 출하는 와이어\r\n * 무변경).\r\n * @param {'L'|'M'|'H'} [level]\r\n */\r\nexport function capacityForY2Window(level = 'M') {\r\n  const n = WINDOW_SUPPORTED_N;\r\n  const totalCells = n * n;\r\n  const { total: overhead, windowExcluded } = overheadBreakdownY2Window();\r\n  const dataCells = totalCells - overhead - windowExcluded;\r\n  if (dataCells <= 0) {\r\n    throw new RangeError(`Y2W: 오버헤드+윈도(${overhead + windowExcluded}) 가 총 셀(${totalCells}) 이상`);\r\n  }\r\n\r\n  const usedSymbols = Math.floor(dataCells / 3);\r\n  const residualCells = dataCells - usedSymbols * 3;\r\n\r\n  if (NSYM_TABLE_Y2W.symbols !== usedSymbols) {\r\n    throw new RangeError(\r\n      `Y2W: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE_Y2W.symbols(${NSYM_TABLE_Y2W.symbols}) 과 어긋난다`,\r\n    );\r\n  }\r\n  const nsym = NSYM_TABLE_Y2W[level];\r\n  if (!Number.isInteger(nsym)) {\r\n    throw new RangeError(`Y2W: NSYM_TABLE_Y2W 에 레벨 ${level} 이 없다`);\r\n  }\r\n  const dataSymbols = usedSymbols - nsym;\r\n  if (dataSymbols <= 0) {\r\n    throw new RangeError(`Y2W/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\r\n  }\r\n\r\n  const dataBytes = maxBytesForSymbols(dataSymbols);\r\n\r\n  return {\r\n    name: 'Y2W',\r\n    version: 2,\r\n    n,\r\n    tones: WINDOW_SUPPORTED_TONES,\r\n    formatIndex: 9, // Y2 와 동일 — 광학 신호(ADR 0003 [C7 Q7]).\r\n    window: true,\r\n    totalCells,\r\n    overhead,\r\n    windowExcluded,\r\n    dataCells,\r\n    usedSymbols,\r\n    residualCells,\r\n    level,\r\n    nsym,\r\n    errorCapacity: errorCapacity(nsym),\r\n    dataSymbols,\r\n    dataBytes,\r\n    maxPayloadBytes: maxPayloadFor(dataBytes),\r\n    headerBytes: HEADER_BYTES,\r\n  };\r\n}\r\n\r\n// 모듈 로드 시점 자기검증 — Y2W 재배치가 실제로 윈도 밖·무충돌인지, 그리고 [C7]\r\n// 부속 계약 ①(레퍼런스 조 D + 포맷 복제 2 둘 다 겹침)이 여전히 참인지 즉시 확인한다.\r\n// \"충돌 시 조용히 옮기지 않는다\"(과제 지침) 를 import 시점부터 지킨다.\r\n{\r\n  const n = WINDOW_SUPPORTED_N;\r\n  const baseRefD = referenceGroups(n, WINDOW_SUPPORTED_TONES)[3]; // 앵커 (n-3,n-3)\r\n  if (!baseRefD.cells.every((c) => inWindowY(c.i, c.j, n))) {\r\n    throw new Error('n=25: [C7 부속 계약 ①] 전제(레퍼런스 조 D 가 윈도와 전부 겹침) 가 깨졌다 — 재검토 필요');\r\n  }\r\n  const baseFmt2 = formatCells(n).slice(10, 15);\r\n  if (!baseFmt2.every((c) => inWindowY(c.i, c.j, n))) {\r\n    throw new Error('n=25: [C7 부속 계약 ①] 전제(포맷 복제 2 가 윈도와 전부 겹침) 가 깨졌다 — 재검토 필요');\r\n  }\r\n\r\n  const relocatedRef = windowedReferenceCellsY(n, WINDOW_SUPPORTED_TONES);\r\n  const relocatedFmt = windowedFormatCellsY(n);\r\n  if (relocatedRef.length !== 12 || relocatedFmt.length !== 15) {\r\n    throw new Error('n=25: 윈도 재배치 후 레퍼런스/포맷 셀 수가 12/15 가 아니다');\r\n  }\r\n  const seen = new Set();\r\n  for (const c of [...relocatedRef, ...relocatedFmt]) {\r\n    if (inWindowY(c.i, c.j, n)) {\r\n      throw new Error(`n=25: 재배치 후에도 윈도 안 좌표가 남아 있다: (${c.i},${c.j})`);\r\n    }\r\n    const k = cellKeyY(c.i, c.j);\r\n    if (seen.has(k)) throw new Error(`n=25: 재배치된 레퍼런스/포맷 셀이 충돌한다: (${c.i},${c.j})`);\r\n    seen.add(k);\r\n  }\r\n}\r\n\r\n/**\r\n * 한 버전의 용량 전체. capacity.js `capacityFor` 회계를 그대로 승계한다.\r\n * @param {{version:number, n:number, overhead:number, symbolKey:string}} spec\r\n * @param {'L'|'M'|'H'} [level]\r\n */\r\nexport function capacityForY(spec, level = 'M') {\r\n  const label = spec.name || `Y${spec.version}`;\r\n  const totalCells = spec.n * spec.n;\r\n  const dataCells = totalCells - spec.overhead;\r\n  if (dataCells <= 0) {\r\n    throw new RangeError(`${label}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\r\n  }\r\n\r\n  const usedSymbols = Math.floor(dataCells / 3);\r\n  const residualCells = dataCells - usedSymbols * 3;\r\n\r\n  const table = NSYM_TABLE_Y[spec.symbolKey];\r\n  if (!table) {\r\n    throw new RangeError(`${label}: NSYM_TABLE_Y 에 키 ${spec.symbolKey} 가 없다`);\r\n  }\r\n  if (table.symbols !== usedSymbols) {\r\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 조용히 맞추지 않고 던진다\r\n    // (capacity.js `capacityFor` 와 동일한 규약 · 과제 지침 절대 규칙 6).\r\n    throw new RangeError(\r\n      `${label}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE_Y.${spec.symbolKey}.symbols `\r\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/n(${spec.n}) 와 표가 불일치한다`,\r\n    );\r\n  }\r\n\r\n  const nsym = table[level];\r\n  if (!Number.isInteger(nsym)) {\r\n    throw new RangeError(`${label}: NSYM_TABLE_Y.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\r\n  }\r\n  const dataSymbols = usedSymbols - nsym;\r\n  if (dataSymbols <= 0) {\r\n    throw new RangeError(`${label}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\r\n  }\r\n\r\n  const dataBytes = maxBytesForSymbols(dataSymbols);\r\n\r\n  return {\r\n    name: spec.name,\r\n    version: spec.version,\r\n    n: spec.n,\r\n    tones: spec.tones,\r\n    formatIndex: spec.formatIndex,\r\n    totalCells,\r\n    overhead: spec.overhead,\r\n    dataCells,\r\n    usedSymbols,\r\n    residualCells,\r\n    level,\r\n    nsym,\r\n    errorCapacity: errorCapacity(nsym),\r\n    dataSymbols,\r\n    dataBytes,\r\n    maxPayloadBytes: maxPayloadFor(dataBytes),\r\n    headerBytes: HEADER_BYTES,\r\n  };\r\n}\r\n\r\n/**\r\n * 전 버전 용량표.\r\n * @param {'L'|'M'|'H'} [level]\r\n */\r\nexport function capacityTableY(level = 'M') {\r\n  return VERSIONS_Y.map((v) => capacityForY(v, level));\r\n}\r\n\r\n/**\r\n * SPEC §14 에 붙일 마크다운 표. 단일 물결표는 쓰지 않는다(규약 §6.11).\r\n * @param {'L'|'M'|'H'} [level]\r\n * @returns {string}\r\n */\r\nexport function renderMarkdownTableY(level = 'M') {\r\n  // Y2W(면 내 QR 윈도, ADR 0003 [C7 Q7]) 행을 덧붙인다 — \"오버헤드\" 열은 그 행에서만\r\n  // ref+format(27) 에 윈도 배제(169)를 더한 표시용 합(196)을 쓴다(그래야 \"총 셀 −\r\n  // 오버헤드 = 데이터 셀\" 산술이 표에서도 그대로 성립한다, capacityForY2Window() 가\r\n  // 돌려주는 overhead 필드 자체(27)는 바꾸지 않는다 — windowExcluded 는 별도 필드).\r\n  const rows = [...capacityTableY(level), capacityForY2Window(level)];\r\n  const head = '| 버전 | n | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\r\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\r\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\r\n  const body = rows.map((r) => {\r\n    const displayOverhead = r.windowExcluded === undefined ? r.overhead : r.overhead + r.windowExcluded;\r\n    return `| ${r.name} | ${r.n} | ${r.totalCells} | ${displayOverhead} | `\r\n      + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\r\n      + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B** |`;\r\n  });\r\n  return [head, sep, ...body].join('\\n');\r\n}\r\n"],
  ["/src/decode.js", "// decode.js — Type O/A/Y 후단 디코더 (SPEC §7.2)\n//\n// 이 모듈의 입력 경계는 \"셀별 3면 순위 → digit\"이 끝난 직후다. 따라서 Lehmer\n// 순위 해석과 포맷 정보 3중 복제 판독은 앞단의 책임이며, 여기서는 이미 확정된\n// scan-order digit 및 패밀리가 해석된 format만 받는다.\n//\n// 역순서는 encode*.js와 정확히 짝을 이룬다:\n//\n//   masked cell digit → maskSub → 3 digit/GF(211) symbol → RS decode\n//   → base-211 chunk decode → header unframe → UTF-8 text\n//\n// Type Y의 QR-window 변형만은 encodeY.js 안의 로컬 scan 함수가 공개되지 않았다.\n// 같은 공개 좌표 계약(capacityY.js의 windowed *CellsY)에서 동일한 래스터 순서를\n// 여기서 재구성한다. 나머지 타입은 각 layout 모듈의 canonical scan 함수를 쓴다.\n\nimport { VERSIONS, capacityFor } from '__TLSCAN_BLOB_028__';\nimport { VERSIONS_A, capacityForA } from '__TLSCAN_BLOB_029__';\nimport {\n  VERSIONS_Y,\n  capacityForY,\n  capacityForY2Window,\n  windowedReferenceCellsY,\n  windowedFormatCellsY,\n  windowExcludedCellsY,\n} from '__TLSCAN_BLOB_030__';\nimport {\n  CHUNK_BYTES,\n  decodeChunkInto,\n  packCellDigitsToSymbols,\n  symbolCountForByteLength,\n} from '__TLSCAN_BLOB_000__';\nimport { rsDecode } from '__TLSCAN_BLOB_027__';\nimport { maskSub } from '__TLSCAN_BLOB_018__';\nimport { unframe } from '__TLSCAN_BLOB_007__';\nimport { dataCellsInScanOrder as dataCellsInScanOrderO } from '__TLSCAN_BLOB_021__';\nimport { dataCellsInScanOrderA } from '__TLSCAN_BLOB_024__';\nimport { dataCellsInScanOrder as dataCellsInScanOrderY } from '__TLSCAN_BLOB_026__';\n\n/**\n * rs211.js는 소거 위치를 받는 API를 제공하지 않는다. 불법 3-digit 조합은 아래\n * 모드에서 0으로 대체하여 \"위치를 모르는 일반 심볼 오류\"로만 취급한다. 따라서\n * 소거 복호의 2e+s 한계가 아니라 rsDecode의 일반 오류 한계 t가 적용된다.\n */\nexport const RS211_ERASURE_MODE = 'error-only-fallback';\n\nconst ILLEGAL_SYMBOL_PLACEHOLDER = 0;\nconst ECC_LEVEL_BY_VALUE = Object.freeze({ 0: 'L', 1: 'M', 2: 'H' });\n\nfunction fail(stage, cause) {\n  const detail = cause instanceof Error ? cause.message : String(cause);\n  return { ok: false, reason: stage + ': ' + detail };\n}\n\nfunction normalizeEccLevel(value) {\n  if (value === 'L' || value === 'M' || value === 'H') return value;\n  if (Number.isInteger(value) && ECC_LEVEL_BY_VALUE[value] !== undefined) {\n    return ECC_LEVEL_BY_VALUE[value];\n  }\n  throw new RangeError('eccLevel은 L, M, H 또는 formatinfo.js의 값 0, 1, 2여야 한다: ' + value);\n}\n\nfunction assertOptionalDimension(value, name, expected) {\n  if (value === undefined) return;\n  if (!Number.isInteger(value) || value !== expected) {\n    throw new RangeError(name + '가 선택한 버전의 격자 크기와 다르다: ' + value + ' !== ' + expected);\n  }\n}\n\nfunction yKey(i, j) {\n  return i + ',' + j;\n}\n\n/**\n * encodeY.js의 windowedDataCellsInScanOrder와 같은 규약이다. 그 함수는 의도적으로\n * encodeY.js의 로컬 구현이므로, 여기서는 공개된 재배치/제외 좌표만 조합한다.\n */\nfunction windowedDataCellsInScanOrderY(n, tones) {\n  const references = new Set(\n    windowedReferenceCellsY(n, tones).map((cell) => yKey(cell.i, cell.j)),\n  );\n  const formats = new Set(windowedFormatCellsY(n).map((cell) => yKey(cell.i, cell.j)));\n  const excluded = new Set(windowExcludedCellsY(n).map((cell) => yKey(cell.i, cell.j)));\n  const out = [];\n\n  for (let j = 0; j < n; j += 1) {\n    for (let i = 0; i < n; i += 1) {\n      const key = yKey(i, j);\n      if (references.has(key) || formats.has(key) || excluded.has(key)) continue;\n      out.push({ i, j });\n    }\n  }\n  return out;\n}\n\nfunction finishProfile(profile) {\n  const symbolDigits = profile.capacity.usedSymbols * 3;\n  if (profile.scan.length !== profile.capacity.dataCells) {\n    throw new Error(\n      'scan order 셀 수 불일치: ' + profile.scan.length\n      + ' !== capacity.dataCells ' + profile.capacity.dataCells,\n    );\n  }\n  if (symbolDigits + profile.capacity.residualCells !== profile.scan.length) {\n    throw new Error(\n      '심볼 digit/필러 회계 불일치: ' + symbolDigits + ' + '\n      + profile.capacity.residualCells + ' !== ' + profile.scan.length,\n    );\n  }\n  const expectedDataSymbols = symbolCountForByteLength(profile.capacity.dataBytes);\n  if (expectedDataSymbols !== profile.capacity.dataSymbols) {\n    throw new Error(\n      'base-211 data 심볼 수 불일치: ' + expectedDataSymbols\n      + ' !== capacity.dataSymbols ' + profile.capacity.dataSymbols\n      + ' — 이 포맷은 현행 인코더가 생성할 수 없다',\n    );\n  }\n  return { ...profile, symbolDigits };\n}\n\n/**\n * 포맷 정보의 version은 패밀리 안에서 두 해석이 가능하다. 논리 버전은 encode 계열의\n * version이고, raw format-index는 formatinfo.decode가 돌려주는 값이다. formatIndex를\n * 명시하면 항상 raw로 읽고, version만 주면 k/n 및 tones로 후보를 좁힌 뒤 논리 버전\n * 호환성을 우선한다. 그래서 앞단의 formatinfo 결과를 k/n과 함께 바로 넘길 수 있다.\n */\nfunction uniqueSpecs(specs) {\n  const out = [];\n  for (const spec of specs) {\n    if (spec && !out.includes(spec)) out.push(spec);\n  }\n  return out;\n}\n\nfunction selectVersionSpec(options) {\n  const {\n    type,\n    logicalSpec,\n    rawSpec,\n    rawExplicit,\n    dimension,\n    dimensionName,\n    requestedDimension,\n    requestedTones,\n  } = options;\n  let candidates = uniqueSpecs(rawExplicit ? [rawSpec] : [rawSpec, logicalSpec]);\n\n  if (requestedDimension !== undefined) {\n    if (!Number.isInteger(requestedDimension)) {\n      throw new RangeError(dimensionName + '은 정수여야 한다: ' + requestedDimension);\n    }\n    candidates = candidates.filter((spec) => spec[dimension] === requestedDimension);\n  }\n  if (requestedTones !== undefined) {\n    candidates = candidates.filter((spec) => spec.tones === requestedTones);\n  }\n  if (candidates.length === 0) {\n    throw new RangeError(\n      '알 수 없거나 격자 크기와 맞지 않는 Type ' + type + ' version/formatIndex: '\n      + (rawExplicit ? options.formatIndex : options.version),\n    );\n  }\n\n  // format.version만 쓰던 호출자는 현재 logical version 의미를 유지한다. k/n 또는\n  // formatIndex가 있으면 raw format-info 해석이 먼저 유일해지므로 그 경로가 선택된다.\n  if (!rawExplicit && logicalSpec && candidates.includes(logicalSpec)) return logicalSpec;\n  return candidates[0];\n}\n\nfunction typeOSpecFromFormatIndex(index) {\n  if (!Number.isInteger(index)) return undefined;\n  let version;\n  if (index >= 0 && index <= 2) version = index + 1;\n  else if (index >= 4 && index <= 6) version = index - 3;\n  else return undefined;\n  return VERSIONS.find((spec) => spec.version === version);\n}\n\nfunction typeASpecFromFormatIndex(index) {\n  if (!Number.isInteger(index)) return undefined;\n  return VERSIONS_A.find(\n    (spec) => spec.formatIndex === index || spec.formatIndex + 2 === index,\n  );\n}\n\nfunction typeYSpecFromFormatIndex(index) {\n  if (!Number.isInteger(index)) return undefined;\n  return VERSIONS_Y.find((spec) => spec.formatIndex === index);\n}\n\nfunction rawFormatIndex(format) {\n  return format.formatIndex === undefined ? format.version : format.formatIndex;\n}\n\nfunction resolveProfile(format) {\n  if (!format || typeof format !== 'object' || Array.isArray(format)) {\n    throw new TypeError('format은 객체여야 한다');\n  }\n\n  const type = format.type === undefined ? 'O' : format.type;\n  const eccLevel = normalizeEccLevel(format.eccLevel);\n  const rawExplicit = format.formatIndex !== undefined;\n  const formatIndex = rawFormatIndex(format);\n\n  if (type === 'O') {\n    const logicalSpec = VERSIONS.find((entry) => entry.version === format.version);\n    const spec = selectVersionSpec({\n      type,\n      logicalSpec,\n      rawSpec: typeOSpecFromFormatIndex(formatIndex),\n      rawExplicit,\n      dimension: 'k',\n      dimensionName: 'k',\n      requestedDimension: format.k,\n      version: format.version,\n      formatIndex,\n    });\n    assertOptionalDimension(format.k, 'k', spec.k);\n    return finishProfile({\n      type,\n      eccLevel,\n      capacity: capacityFor(spec, eccLevel),\n      scan: dataCellsInScanOrderO(spec.k),\n      coordinates: (cell) => [cell.q, cell.r],\n    });\n  }\n\n  if (type === 'A') {\n    const logicalSpec = VERSIONS_A.find((entry) => entry.version === format.version);\n    const spec = selectVersionSpec({\n      type,\n      logicalSpec,\n      rawSpec: typeASpecFromFormatIndex(formatIndex),\n      rawExplicit,\n      dimension: 'k',\n      dimensionName: 'k',\n      requestedDimension: format.k,\n      version: format.version,\n      formatIndex,\n    });\n    assertOptionalDimension(format.k, 'k', spec.k);\n    return finishProfile({\n      type,\n      eccLevel,\n      capacity: capacityForA(spec, eccLevel),\n      scan: dataCellsInScanOrderA(spec.k),\n      coordinates: (cell) => [cell.q, cell.r],\n    });\n  }\n\n  if (type === 'Y') {\n    const suppliedTones = format.tones;\n    if (suppliedTones !== undefined && suppliedTones !== 2 && suppliedTones !== 3) {\n      throw new RangeError('Type Y tones는 2 또는 3이어야 한다: ' + suppliedTones);\n    }\n    const logicalSpec = VERSIONS_Y.find(\n      (entry) => entry.version === format.version && entry.tones === (suppliedTones === undefined ? 2 : suppliedTones),\n    );\n    if (format.n !== undefined && format.k !== undefined && format.n !== format.k) {\n      throw new RangeError('Type Y n과 k가 다르다: ' + format.n + ' !== ' + format.k);\n    }\n    const requestedN = format.n === undefined ? format.k : format.n;\n    const spec = selectVersionSpec({\n      type,\n      logicalSpec,\n      rawSpec: typeYSpecFromFormatIndex(formatIndex),\n      rawExplicit,\n      dimension: 'n',\n      dimensionName: 'n',\n      requestedDimension: requestedN,\n      requestedTones: suppliedTones,\n      version: format.version,\n      formatIndex,\n    });\n    const window = format.window === undefined ? false : format.window;\n    if (typeof window !== 'boolean') {\n      throw new TypeError('Type Y format.window은 boolean이어야 한다: ' + window);\n    }\n    assertOptionalDimension(format.n, 'n', spec.n);\n    assertOptionalDimension(format.k, 'k', spec.n);\n\n    if (window) {\n      if (spec.version !== 2 || spec.tones !== 2) {\n        throw new RangeError('Type Y window은 Y2, tones=2에서만 허용된다');\n      }\n      return finishProfile({\n        type,\n        eccLevel,\n        capacity: capacityForY2Window(eccLevel),\n        scan: windowedDataCellsInScanOrderY(spec.n, spec.tones),\n        coordinates: (cell) => [cell.i, cell.j],\n      });\n    }\n\n    return finishProfile({\n      type,\n      eccLevel,\n      capacity: capacityForY(spec, eccLevel),\n      scan: dataCellsInScanOrderY(spec.n),\n      coordinates: (cell) => [cell.i, cell.j],\n    });\n  }\n\n  throw new RangeError('알 수 없는 코드 패밀리: ' + type + ' (허용 O, A, Y)');\n}\n\nfunction unmaskSymbolDigits(cellDigits, profile) {\n  if (!cellDigits || typeof cellDigits.length !== 'number' || typeof cellDigits === 'string') {\n    throw new TypeError('cellDigits는 배열 유사 객체여야 한다');\n  }\n\n  const fullScanLength = profile.scan.length;\n  if (cellDigits.length !== profile.symbolDigits && cellDigits.length !== fullScanLength) {\n    throw new RangeError(\n      'scan-order digit 수가 맞지 않는다: ' + cellDigits.length + ' (심볼 영역 '\n      + profile.symbolDigits + ' 또는 필러 포함 ' + fullScanLength + ' 필요)',\n    );\n  }\n\n  const out = new Uint8Array(profile.symbolDigits);\n  for (let i = 0; i < profile.symbolDigits; i += 1) {\n    const digit = cellDigits[i];\n    if (!Number.isInteger(digit) || digit < 0 || digit > 5) {\n      throw new RangeError('digit 범위 위반 (scan index ' + i + '): ' + digit + ' (허용 0..5)');\n    }\n    const [x, y] = profile.coordinates(profile.scan[i]);\n    out[i] = maskSub(digit, x, y);\n  }\n  return out;\n}\n\nfunction decodeSymbolsToFramedBytes(symbols, byteLength) {\n  const expectedSymbolCount = symbolCountForByteLength(byteLength);\n  if (symbols.length !== expectedSymbolCount) {\n    throw new RangeError(\n      'RS 메시지 심볼 수 불일치: ' + symbols.length + ' !== ' + expectedSymbolCount\n      + ' (dataBytes ' + byteLength + ')',\n    );\n  }\n\n  const out = new Uint8Array(byteLength);\n  let byteOffset = 0;\n  let symbolOffset = 0;\n  while (byteOffset < byteLength) {\n    const take = Math.min(CHUNK_BYTES, byteLength - byteOffset);\n    symbolOffset += decodeChunkInto(symbols, symbolOffset, take, out, byteOffset);\n    byteOffset += take;\n  }\n\n  if (symbolOffset !== symbols.length) {\n    throw new RangeError(\n      'base-211 청크 소비량 불일치: ' + symbolOffset + ' !== ' + symbols.length,\n    );\n  }\n  return out;\n}\n\nfunction assertZeroPadding(framed, payloadLength) {\n  const paddingStart = 1 + payloadLength;\n  for (let i = paddingStart; i < framed.length; i += 1) {\n    if (framed[i] !== 0) {\n      throw new RangeError('0x00 패딩이 아니다 (byte index ' + i + '): ' + framed[i]);\n    }\n  }\n}\n\n/**\n * scan order로 정렬된 셀 digit 배열을 UTF-8 텍스트로 복호한다.\n *\n * format.version은 encode 계열의 논리 버전 또는 formatinfo.decode의 raw version-index를\n * 받을 수 있다. 후자와 전자가 충돌하는 값은 k/n(및 Type Y tones)으로 판별하며,\n * formatIndex를 쓰면 raw index임을 명시한다. type을 생략하면 Type O다.\n *\n * cellDigits는 실제 심볼 digit만(3S개) 또는 scan order 전체(3S + filler개) 모두\n * 허용한다. filler는 코드워드가 아니므로 전체 입력일 때도 꼬리에서 무시한다.\n *\n * @param {Uint8Array|number[]} cellDigits\n * @param {{\n *   type?: 'O'|'A'|'Y',\n *   version:number,\n *   formatIndex?:number,\n *   eccLevel:'L'|'M'|'H'|0|1|2,\n *   k?:number,\n *   n?:number,\n *   tones?:2|3,\n *   window?:boolean,\n * }} format\n * @returns {{\n *   ok:true,\n *   text:string,\n *   corrected:number,\n *   crsDistance:number,\n *   erasureFallback?: {\n *     mode:'error-only-fallback',\n *     illegalSymbolIndices:number[],\n *     placeholder:number,\n *   },\n * } | {ok:false, reason:string}}\n */\nexport function decodeCells(cellDigits, format) {\n  let profile;\n  try {\n    profile = resolveProfile(format);\n  } catch (cause) {\n    return fail('format', cause);\n  }\n\n  let unmasked;\n  try {\n    unmasked = unmaskSymbolDigits(cellDigits, profile);\n  } catch (cause) {\n    return fail('mask', cause);\n  }\n\n  let packed;\n  try {\n    packed = packCellDigitsToSymbols(unmasked);\n  } catch (cause) {\n    return fail('symbol', cause);\n  }\n\n  // rs211.js의 options는 fcr뿐이며 erasures를 받지 않는다. 211..215는 체 밖이라\n  // 그대로 rsDecode에 넣을 수 없으므로 0이라는 유효한 수신값으로 치환한다. 이는\n  // 위치를 아는 소거 복호가 아니라 평범한 오류 복호이며, 성공 결과에도 명시한다.\n  const received = packed.symbols.slice();\n  for (const index of packed.illegalIndices) received[index] = ILLEGAL_SYMBOL_PLACEHOLDER;\n\n  let rsResult;\n  try {\n    rsResult = rsDecode(received, profile.capacity.nsym);\n  } catch (cause) {\n    return fail('rs', cause);\n  }\n  if (!rsResult.ok) {\n    const fallback = packed.illegalIndices.length === 0\n      ? ''\n      : '; 불법 심볼 ' + packed.illegalIndices.length\n        + '개는 rs211.js 소거 미지원으로 일반 오류(0 치환)로 처리했다';\n    return fail('rs', rsResult.reason + fallback);\n  }\n\n  let framed;\n  try {\n    framed = decodeSymbolsToFramedBytes(rsResult.message, profile.capacity.dataBytes);\n  } catch (cause) {\n    return fail('base211', cause);\n  }\n\n  let payload;\n  try {\n    payload = unframe(framed);\n  } catch (cause) {\n    const message = cause instanceof Error ? cause.message : String(cause);\n    return fail(message.includes('UTF-8') ? 'utf8' : 'header', cause);\n  }\n\n  try {\n    assertZeroPadding(framed, payload.payloadLength);\n  } catch (cause) {\n    return fail('header', cause);\n  }\n\n  const result = {\n    ok: true,\n    text: payload.text,\n    corrected: rsResult.errorCount,\n    // rsResult.errorCount는 rs211.js가 실제 변경한 errorPositions 수, 즉 u다.\n    // C_RS = 2u + e. rs211.js는 아직 소거 복호가 없으므로 e=0이고, 불법 심볼도\n    // 일반 오류 fallback으로만 센다. 소거 지원 뒤에도 점수 계약은 이 필드를 그대로 쓴다.\n    crsDistance: 2 * rsResult.errorCount,\n  };\n  if (packed.illegalIndices.length > 0) {\n    result.erasureFallback = {\n      mode: RS211_ERASURE_MODE,\n      illegalSymbolIndices: packed.illegalIndices.slice(),\n      placeholder: ILLEGAL_SYMBOL_PLACEHOLDER,\n    };\n  }\n  return result;\n}\n"],
  ["/src/tonemap.js", "// tonemap.js — Type Y 2톤(면당 2채널) 배정표 · 등급 iii 분류기 · 분리 계약\n// (SPEC §14, ADR 0003 v3.1 §4b D9 · U14 · U17)\n//\n// 2톤 메인 전환의 와이어 계약 원본. 3톤(순위 3! 배정)은 lehmer.js 소관 그대로이고,\n// 이 모듈은 2톤 전용(면당 밝음/어두움 2상태) 배정표 · 분류기 · 분리 하한만 다룬다.\n// sceneY.js(인코딩→색) · verifyY.js(관측→복호) 양쪽이 이 모듈 하나만 참조한다\n// (배정표 이중정의 금지 — D9 신규 와이어 계약).\n//\n// 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date/hypot/삼각함수 금지 —\n// 결정성 계약, AGENTS.md 공통 규약. Math.sqrt/Math.log/Math.exp 는 삼각함수가 아니라\n// 허용 대상이다).\n\n/**\n * D9 배정표 — digit(0..5) → (T,L,R) 비트, 이 순서 고정. 1=밝음, 0=어두움.\n * d<3 = 단독 밝음 면(그 면만 1) · d>=3 = 단독 어두움 면(그 면만 0, =d-3 의 보수) ·\n * 보수쌍 d<->d+3. 전부-밝음(1,1,1)·전부-어두움(0,0,0) 은 표에 없다 — 불법 트리플이다.\n * @type {ReadonlyArray<ReadonlyArray<number>>}\n */\nexport const TONE_PATTERNS = Object.freeze([\n  Object.freeze([1, 0, 0]), // d0 — T만 밝음\n  Object.freeze([0, 1, 0]), // d1 — L만 밝음\n  Object.freeze([0, 0, 1]), // d2 — R만 밝음\n  Object.freeze([0, 1, 1]), // d3 — T만 어두움 (d0 의 보수)\n  Object.freeze([1, 0, 1]), // d4 — L만 어두움 (d1 의 보수)\n  Object.freeze([1, 1, 0]), // d5 — R만 어두움 (d2 의 보수)\n]);\n\n/** 심볼 알파벳 크기 = 6 (lehmer.js RADIX 와 동일 채널, 여기서는 독립 상수로 둔다 —\n * tonemap.js 가 lehmer.js 를 참조하지 않는다: 2톤 배정표는 순열이 아니라 직접\n * 열거된 표이므로 3! 유도 경로가 필요 없다). */\nconst RADIX = TONE_PATTERNS.length;\n\n/** \"TLR 비트 문자열\" → digit 역방향 조회. 모듈 로드 시 1회 구성. */\nconst PATTERN_TO_DIGIT = new Map();\nTONE_PATTERNS.forEach((pattern, digit) => {\n  PATTERN_TO_DIGIT.set(pattern.join(''), digit);\n});\n\nfunction assertDigit(digit) {\n  if (!Number.isInteger(digit) || digit < 0 || digit >= RADIX) {\n    throw new RangeError(`digit 범위 위반: ${digit} (허용 0..${RADIX - 1})`);\n  }\n}\n\nfunction assertBit(bit, label) {\n  if (bit !== 0 && bit !== 1) {\n    throw new RangeError(`${label} 는 0 또는 1 이어야 한다: ${bit}`);\n  }\n}\n\n/**\n * digit → (T,L,R) 비트 객체(1=밝음). sceneY.js 가 face 문자열로 바로 인덱싱할 수\n * 있도록 배열이 아니라 객체로 노출한다.\n * @param {number} digit 0..5\n * @returns {{T:number, L:number, R:number}}\n */\nexport function digi ls[2]) — 여유 있게 통과.\n */\nexport const RHO_MIN = 10;\n\n/**\n * 팔레트 2톤 분리 게이트(U17). ρ = yHi/yLo < RHO_MIN 이면 RangeError.\n * @param {number} yLo 어두운 레벨(levels[0]) 상대휘도\n * @param {number} yHi 밝은 레벨(levels[2]) 상대휘도\n */\nexport function assertToneSeparation(yLo, yHi) {\n  if (!(yLo > 0) || !(yHi > 0)) {\n    throw new RangeError(`분리 검증 대상은 양수여야 한다: yLo=${yLo}, yHi=${yHi}`);\n  }\n  const rho = yHi / yLo;\n  if (!(rho >= RHO_MIN)) {\n    throw new RangeError(\n      `2톤 분리비 ρ=${rho} 가 RHO_MIN(${RHO_MIN}) 미달이다 (U17: yLo=${yLo}, yHi=${yHi})`,\n    );\n  }\n}\n"],

\\[\\,\\:])false([\\]\\,\\}])/g, \"$1f$2\").replace(/([\\[\\,\\:])false([\\]\\,\\}])/g, \"$1f$2\");\r\n        //Remove \"\"\r\n        let p5 = p4.replace(/([\\{\\,])\\\"([^\\\"]*)\\\"\\:/g, \"$1$2:\");\r\n        //Check convert unicode\r\n        if (p5.match(/[\\u0000-\\u001F|\\u0080-\\uFFFF]/g) != null) {\r\n            let p6 = this.escape(p5);\r\n            ex = p6;\r\n        } else ex = p5;\r\n\r\n        // console.log(p1);\r\n        // console.log(p2);\r\n        // console.log(p3);\r\n        // console.log(ex);\r\n\r\n        return ex;\r\n    }\r\n\r\n    /**\r\n     * Convert object to JCODD directly\r\n     * \r\n     * @param {object} obj \r\n     * \r\n     * @returns {string} JCODD\r\n     */\r\n    static coddify(obj) {\r\n        let json = JSON.stringify(obj);\r\n\r\n        return this.toCodd(json);\r\n    }\r\n\r\n    /**\r\n     * Parse JCODD to JSON\r\n     * \r\n     * @param {string} codd \r\n     * \r\n     * @return {string} json\r\n     */\r\n    static toJson(codd, allowFallback = false) {\r\n        switch (codd) {\r\n            case \"t\": return \"true\";\r\n            case \"f\": return \"false\";\r\n            case \"n\": return \"null\";\r\n        }\r\n        //unescape\r\n        let p1 = this.unescape(codd);//unescape(codd);//=> deprecated\r\n        //Replace ' to \" (fallback)\r\n        if (p1.startsWith(\"'\") && p1.endsWith(\"'\")) p1 = '\"' + p1.slice(1, -1) + '\"';\r\n        else if (allowFallback) {\r\n            const fallbackRegex = /([\\,\\[\\:])\\'([^\\']*)\\'([\\,\\]\\}])/g;\r\n            if (fallbackRegex.test(p1)) p1 = p1.replace(fallbackRegex, '$1\"$2\"$3').replace(fallbackRegex, '$1\"$2\"$3');\r\n        }\r\n        //Assign property names with \"\"\r\n        let p2 = p1.replace(/(\\{|\\}\\,|\\]\\,|\\\"\\,|[eE]?[+\\-]?[\\d.]+\\,|[ntf]\\,|true\\,|false\\,)([^\\\"\\{\\}\\[\\]\\,\\:]*)\\:/g, '$1\"$2\":');\r\n        //Convert n to null\r\n        const nullRegex = /([\\[\\,\\:])n([\\]\\,\\}])/g;\r\n        let p3 = p2.replace(nullRegex, \"$1null$2\").replace(nullRegex, \"$1null$2\");\r\n        //Convert t to true\r\n        const trueRegex = /([\\[\\,\\:])t([\\]\\,\\}])/g;\r\n        let p4 = p3.replace(trueRegex, \"$1true$2\").replace(trueRegex, \"$1true$2\");\r\n        //Convert f to false\r\n        const falseRegex = /([\\[\\,\\:])f([\\]\\,\\}])/g;\r\n        let p5 = p4.replace(falseRegex, \"$1false$2\").replace(falseRegex, \"$1false$2\");\r\n\r\n        return p5;\r\n    }\r\n\r\n    /**\r\n     * Convert JCODD to object directly\r\n     * \r\n     * @param {string} codd \r\n     * \r\n     * @returns {*} object\r\n     */\r\n    static parse(codd, allowFallback = true) {\r\n        let json = this.toJson(codd, false);\r\n\r\n        try {\r\n            return JSON.parse(json);\r\n        } catch (e) {\r\n            if (allowFallback) {\r\n                // try fallback\r\n                json = this.toJson(codd, true);\r\n                \r\n                try {\r\n                    return JSON.parse(json);\r\n                } catch (ef) {\r\n                    throw e;\r\n                }\r\n            } else throw e;\r\n        }\r\n    }\r\n\r\n    /**\r\n     * Return to be escaped unicode character from char code\r\n     * \r\n     * @param {Integer} cc  Char Code\r\n     * \r\n     * @returns {String} unescaped\r\n     */\r\n    static esc(cc) {\r\n        if (cc < 0x20 || cc > 0x7e) {\r\n            let x16 = cc.toString(16);\r\n            var ex;\r\n            if (x16.length > 2) ex = \"%u\" + x16.padStart(4, '0').toUpperCase();\r\n            else ex = \"%\" + x16.padStart(2, '0').toUpperCase();\r\n            return ex;\r\n        } else return String.fromCharCode(cc);\r\n    }\r\n\r\n    /**\r\n     * Return to be escaped unicode characters in string\r\n     * \r\n     * @param {String} str\r\n     * \r\n     * @returns {String} unescaped\r\n     */\r\n    static escape(str) {\r\n        var escaped = \"\";\r\n        for (var i = 0; i < str.length; i++) {\r\n            escaped += this.esc(str.charCodeAt(i));\r\n        }\r\n        return escaped;\r\n    }\r\n\r\n    /**\r\n     * Return to be unescaped unicode characters in string\r\n     * \r\n     * @param {String} str\r\n     * \r\n     * @returns {String} escaped\r\n     */\r\n    static unescape(str) {\r\n        return str.replace(/%u([\\dA-F]{4})/gi, (match, block) =>\r\n            String.fromCharCode(parseInt(block, 16))\r\n        );\r\n    }\r\n\r\n\r\n    #obj;\r\n    get obj() { return this.#obj; }\r\n    get json() { return JSON.stringify(this.#obj); }\r\n    get jcodd() { return Jcodd.coddify(this.#obj); }\r\n    get base64() { return Jcodd.base64Encode(this.jcodd); }\r\n    get code() { return this.jcodd; }\r\n\r\n    /**\r\n     * Quick set object and get converted to any data type\r\n     * @param {*} any BASE64 orJCODD or JSON or object or primitive\r\n     */\r\n    constructor(any) {\r\n        if (typeof any == \"string\") try {\r\n            any = Jcodd.parse(any);\r\n        } catch (e) {\r\n            try {\r\n                any = Jcodd.parse(Jcodd.base64Decode(any));\r\n            } catch (e) {\r\n                // do nothing\r\n            }\r\n        }\r\n        this.#obj = any;\r\n    }\r\n\r\n    toString() {\r\n        return this.code;\r\n    }\r\n\r\n}\r\n\r\nconst JCODD = any => new Jcodd(any);\r\n\r\nif (typeof module !== 'undefined' && typeof module.exports !== 'undefined') {\r\n    module.exports = JCODD;\r\n    module.exports.Jcodd = Jcodd;\r\n}\r\n\r\n// [벤더링 추가분 — 유일한 수정] ESM export (원본은 CJS 가드뿐)\r\nexport { Jcodd, JCODD };\r\n"],
  ["/src/payloadform.js", "/**\n * payloadform.js — 구조화 페이로드 규약 (JCODD 기반, PM/009 §1)\n *\n * **애플리케이션 계층 규약이다 — 와이어 계약이 아니다.** SPEC §4.5 의 스탠스(페이로드는\n * UTF-8 텍스트, 타입 필드 없음, 콘텐츠 판별은 소비자 몫)를 그대로 유지하고, 그 \"소비자\n * 판별\"의 규약을 생성기·스캐너(tlscan)가 공유하도록 여기 못 박는다.\n *\n * 판별(스니핑) 규약 — tlscan 구현이 이 3분기를 그대로 쓴다:\n *   1. `/^https?:\\/\\//i` → URL (스캐너: 열기 동작)\n *   2. 선두 `{` + JCODD 파싱 성공 + 문자열 `t` 키 존재 → 구조화 콘텐츠 (t = 종류)\n *   3. 그 외 → 일반 텍스트\n *\n * JCODD 키 축약표 (규범 — 스캐너·생성기 공유):\n *   wifi: { t:\"wifi\", s: SSID(필수), p: 암호(없으면 생략), e: \"WEP\" (WPA 는 기본이라 생략) }\n *   card: { t:\"card\", n: 이름(필수), tel: 전화, em: 이메일, org: 조직, u: URL } — 빈 값 생략\n *\n * JCODD 는 외부 MIT 직렬화 라이브러리다 — src/vendor/jcodd.js 로 벤더링(무수정 복사).\n *\n * ⚠ 용량 주의: JCODD 는 비 -ASCII 를 `%uXXXX` 로 이스케이프한다 (규약 4) — **한글 1자 =\n * 6 B** (UTF-8 원문 3 B 의 2배). 한글 SSID·이름이 든 페이로드는 V3/Y1 대역을 잡는 게\n * 보통이고, 생성기의 버전 자동 선택이 이를 흡수한다.\n */\n\nimport { Jcodd } from '__TLSCAN_BLOB_033__';\n\n/** 생성기·스캐너가 다루는 콘텐츠 종류. */\nexport const PAYLOAD_KINDS = Object.freeze(['text', 'url', 'wifi', 'card']);\n\n/** Wi-Fi 보안 방식 허용값. 기본 WPA (직렬화 시 생략). */\nexport const WIFI_SECURITY = Object.freeze(['WPA', 'WEP', 'nopass']);\n\nfunction cleanString(v) {\n  return typeof v === 'string' ? v.trim() : '';\n}\n\n/**\n * Wi-Fi 접속 정보 → JCODD 페이로드 문자열.\n * @param {{ssid: string, password?: string, security?: 'WPA'|'WEP'|'nopass'}} fields\n * @returns {string} 예: `{t:\"wifi\",s:\"MyNet\",p:\"pw1234\"}`\n */\nexport function wifiPayload(fields) {\n  const ssid = cleanString(fields && fields.ssid);\n  if (ssid === '') throw new RangeError('Wi-Fi 페이로드에는 ssid 가 필수다');\n  const security = fields.security === undefined ? 'WPA' : fields.security;\n  if (!WIFI_SECURITY.includes(security)) {\n    throw new RangeError(`security 는 ${WIFI_SECURITY.join(' | ')} 중 하나여야 한다: ${security}`);\n  }\n  const password = cleanString(fields.password);\n\n  const obj = { t: 'wifi', s: ssid };\n  if (security !== 'nopass' && password !== '') obj.p = password;\n  if (security === 'WEP') obj.e = 'WEP'; // WPA(기본)·nopass(p 부재로 표현)는 생략\n  return Jcodd.coddify(obj);\n}\n\n/**\n * 명함 → JCODD 페이로드 문자열. name 외 빈 필드는 생략된다.\n * @param {{name: string, phone?: string, email?: string, org?: string, url?: string}} fields\n * @returns {string} 예: `{t:\"card\",n:\"홍길동\",tel:\"010-...\",em:\"a@b.c\"}`\n */\nexport function cardPayload(fields) {\n  const name = cleanString(fields && fields.name);\n  if (name === '') throw new RangeError('명함 페이로드에는 name 이 필수다');\n  const obj = { t: 'card', n: name };\n  const tel = cleanString(fields.phone);\n  const em = cleanString(fields.email);\n  const org = cleanString(fields.org);\n  const u = cleanString(fields.url);\n  if (tel !== '') obj.tel = tel;\n  if (em !== '') obj.em = em;\n  if (org !== '') obj.org = org;\n  if (u !== '') obj.u = u;\n  return Jcodd.coddify(obj);\n}\n\n/**\n * 페이로드 판별 (스니핑 규약의 레퍼런스 구현 — tlscan 과 공유).\n * 실패는 조용히 text 로 폴백한다 (소비자 규약 — 판별기는 던지지 않는다).\n *\n * @param {string} text 복호된 페이로드\n * @returns {{kind: string, data?: object}} kind: 'url' | 'text' | JCODD 의 t 값 ('wifi'·'card'·…)\n */\nexport function sniffPayload(text) {\n  if (typeof text !== 'string' || text.length === 0) return { kind: 'text' };\n  if (/^https?:\\/\\//i.test(text)) return { kind: 'url' };\n  if (text[0] === '{') {\n    try {\n      const obj = Jcodd.parse(text);\n      if (obj !== null && typeof obj === 'object' && typeof obj.t === 'string' && obj.t !== '') {\n        return { kind: obj.t, data: obj };\n      }\n    } catch {\n      // 파싱 실패 → text 폴백\n    }\n  }\n  return { kind: 'text' };\n}\n"],
  ["/src/ygrid.js", "/**\n * ygrid.js — Type Y (단일 큐브) 면 격자 기하 (SPEC §14, docs/adr/0003_typeY_layout.md)\n *\n * 좌표 규약 (와이어 계약 — 여기서 못 박고 전 모듈이 따른다):\n *\n * - 큐브 실루엣 = pointy-top 정육각형. hexgrid.js 의 `CORNER_UNIT_OFFSETS` 를 그대로\n *   재사용한다(삼각함수 재계산 금지 — 닫힌 형태 상수라야 결정적이다).\n * - **Y-심**(세 면이 만나는 중심 꼭짓점) = 육각형 중심 = 이 모듈의 원점(layout 의\n *   `(originX, originY)`).\n * - 세 면은 hexgrid 코너 인덱스로 정의한다:\n *     T = [Y심, C5, C0, C1]   L = [Y심, C3, C4, C5]   R = [Y심, C1, C2, C3]\n * - 면 로컬 좌표 `(i, j)` 는 0-based, `n × n`. `(0,0)` 모듈이 Y-심 코너다.\n * - 축 규약: **i 축 = 시계방향(다음 라벨) 이웃 면과 공유하는 변 방향**,\n *   **j 축 = 반시계방향(이전 라벨) 이웃 면과 공유하는 변 방향**. 화면 기준:\n *     T: i → C1(우상)  j → C5(좌상)\n *     R: i → C3(하)    j → C1(우상)\n *     L: i → C5(좌상)  j → C3(하)\n *   즉 T→R→L→T 순서로 코너 인덱스가 +2(=120°) 씩 밀린다 — 이것이 아래 회전\n *   공변성 테스트의 근거다.\n * - 모듈 `(f, i, j)` = 변 길이 `m`(=`layout.size`) 의 60/120 마름모. 네 꼭짓점은\n *   `Y심 + (a·e_i + b·e_j)·m`, `(a,b) ∈ {(i,j), (i+1,j), (i+1,j+1), (i,j+1)}`.\n *   모듈 내접원 반지름은 Type O 면과 같은 형상이므로 `hexgrid.FACE_INRADIUS_COEFF`\n *   를 그대로 재사용한다: `(√3/4)·m`.\n * - 샘플 원판: §7.2 기본 규약 승계. 중심 = 마름모 중심(대각선 교점), 반지름 =\n *   `fraction · 내접원반지름`(기본 0.5, hexgrid 의 `SAMPLE_FRACTION_DEFAULT` 재사용).\n *\n * 이 모듈도 순수 기하만 다룬다 — node 전용 API 없음, 브라우저 ESM 로드 가능.\n */\n\nimport {\n  CORNER_UNIT_OFFSETS,\n  FACE_AREA_COEFF,\n  FACE_INRADIUS_COEFF,\n  HEX_AREA_COEFF,\n  SAMPLE_FRACTION_DEFAULT,\n  SAMPLE_FRACTION_OF_DEFAULT,\n  SAMPLE_FRACTION_MODES,\n  normalizeLayout,\n} from '__TLSCAN_BLOB_008__';\n\n/** Type Y 면 라벨. SPEC §14 순서(T, L, R)와 동일하게 고정한다. */\nexport const YFACES = Object.freeze(['T', 'L', 'R']);\n\n/**\n * 면 → (e_i, e_j) 단위 벡터. hexgrid 의 `CORNER_UNIT_OFFSETS` 원소를 그대로 참조한다\n * (그 배열의 각 원소는 이미 freeze 된 `{x, y}` 라 재사용해도 안전하다).\n *\n * 코너 인덱스 매핑 (SPEC §14 규범):\n *   T: e_i = C1(우상), e_j = C5(좌상)\n *   R: e_i = C3(하),   e_j = C1(우상)\n *   L: e_i = C5(좌상), e_j = C3(하)\n */\nconst FACE_BASIS = Object.freeze({\n  T: Object.freeze({ ei: CORNER_UNIT_OFFSETS[1], ej: CORNER_UNIT_OFFSETS[5] }),\n  R: Object.freeze({ ei: CORNER_UNIT_OFFSETS[3], ej: CORNER_UNIT_OFFSETS[1] }),\n  L: Object.freeze({ ei: CORNER_UNIT_OFFSETS[5], ej: CORNER_UNIT_OFFSETS[3] }),\n});\n\nfunction assertFace(face) {\n  if (!Object.prototype.hasOwnProperty.call(FACE_BASIS, face)) {\n    throw new RangeError(`면 라벨은 T | L | R 이어야 한다: ${face}`);\n  }\n  return face;\n}\n\nfunction assertModuleIndex(v, label) {\n  if (!Number.isInteger(v) || v < 0) {\n    throw new RangeError(`${label} 는 0 이상의 정수여야 한다: ${v}`);\n  }\n  return v;\n}\n\nfunction assertSide(n) {\n  if (!Number.isInteger(n) || n <= 0) {\n    throw new RangeError(`n 은 1 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n/**\n * 면의 (e_i, e_j) 단위 벡터.\n * @param {'T'|'L'|'R'} face\n * @returns {{ei: {x:number,y:number}, ej: {x:number,y:number}}}\n */\nexport function faceBasis(face) {\n  assertFace(face);\n  return FACE_BASIS[face];\n}\n\n/**\n * Y-심(layout 원점) 기준 (a·e_i + b·e_j)·size 절대 픽셀 좌표.\n * `a`, `b` 는 정수뿐 아니라 반정수(중심 계산용)도 받는다.\n */\nfunction facePoint(face, a, b, norm) {\n  const { ei, ej } = faceBasis(face);\n  return {\n    // `+ 0` 은 -0 정규화 — a 또는 b 가 0 이고 벡터 성분이 음수면 0 * (음수) = -0 이 된다.\n    x: norm.originX + (a * ei.x + b * ej.x) * norm.size + 0,\n    y: norm.originY + (a * ei.y + b * ej.y) * norm.size + 0,\n  };\n}\n\n/**\n * 모듈 (face, i, j) 의 마름모 꼭짓점 4개.\n * 정점 순서: [Y심측, +e_i, +e_i+e_j, +e_j] (세 면 모두 같은 감김).\n * @param {'T'|'L'|'R'} face\n * @param {number} i\n * @param {number} j\n * @param {object} [layout]\n * @returns {{x:number,y:number}[]} 길이 4\n */\nexport function moduleQuad(face, i, j, layout) {\n  assertFace(face);\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const norm = normalizeLayout(layout);\n  return [\n    facePoint(face, i, j, norm),\n    facePoint(face, i + 1, j, norm),\n    facePoint(face, i + 1, j + 1, norm),\n    facePoint(face, i, j + 1, norm),\n  ];\n}\n\n/** 모듈 (face, i, j) 의 중심(두 대각선의 교점) 절대 픽셀 좌표. */\nexport function moduleCenter(face, i, j, layout) {\n  assertFace(face);\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const norm = normalizeLayout(layout);\n  return facePoint(face, i + 0.5, j + 0.5, norm);\n}\n\n/** 모듈 내접원 반지름 = (√3/4)·size. Type O 면과 동일 형상(hexgrid 재사용). */\nfunction moduleInradius(size) {\n  return FACE_INRADIUS_COEFF * size;\n}\n\n/** 모듈 넓이 = (√3/2)·size². Type O 면과 동일 형상(hexgrid 재사용). */\nfunction moduleArea(size) {\n  return FACE_AREA_COEFF * size * size;\n}\n\n/**\n * 모듈의 샘플링 원판. hexgrid.faceSampleDisc 와 동일한 규약(§7.2)을 승계한다 —\n * 반지름은 항상 모듈 내접원 반지름으로 클램프된다.\n *\n * @param {'T'|'L'|'R'} face\n * @param {number} i\n * @param {number} j\n * @param {object} [layout]\n * @param {{fraction?: number, fractionOf?: 'radius'|'incircleArea'|'faceArea'}} [options]\n * @returns {{x:number,y:number,radius:number,clamped:boolean}}\n */\nexport function moduleSampleDisc(face, i, j, layout, options) {\n  assertFace(face);\n  const norm = normalizeLayout(layout);\n  const opts = options || {};\n  const fraction =\n    opts.fraction === undefined ? SAMPLE_FRACTION_DEFAULT : opts.fraction;\n  const fractionOf =\n    opts.fractionOf === undefined ? SAMPLE_FRACTION_OF_DEFAULT : opts.fractionOf;\n\n  if (!Number.isFinite(fraction) || fraction <= 0 || fraction > 1) {\n    throw new RangeError(`fraction 은 (0, 1] 범위여야 한다: ${fraction}`);\n  }\n  if (!SAMPLE_FRACTION_MODES.includes(fractionOf)) {\n    throw new RangeError(\n      `fractionOf 는 ${SAMPLE_FRACTION_MODES.join(' | ')} 중 하나여야 한다: ${fractionOf}`,\n    );\n  }\n\n  const inradius = moduleInradius(norm.size);\n  let radius;\n  if (fractionOf === 'radius') {\n    radius = fraction * inradius;\n  } else if (fractionOf === 'incircleArea') {\n    radius = Math.sqrt(fraction) * inradius;\n  } else {\n    radius = Math.sqrt((fraction * moduleArea(norm.size)) / Math.PI);\n  }\n\n  const clamped = radius > inradius;\n  if (clamped) radius = inradius;\n\n  assertModuleIndex(i, 'i');\n  assertModuleIndex(j, 'j');\n  const { ei, ej } = FACE_BASIS[face];\n  // moduleCenter → facePoint의 산술 n  const supplied = options && options.calibration && typeof options.calibration === 'object'\n    ? options.calibration\n    : {};\n  return { ...UNVERIFIED_CUBE_DETECTION, ...supplied };\n}\n\nfunction clamp01(value) {\n  return Math.max(0, Math.min(1, value));\n}\n\nfunction median(values) {\n  if (!Array.isArray(values) || values.length === 0) return NaN;\n  return medianFromArrayLike(values, values.length);\n}\n\nfunction bilinear(luma, x, y) {\n  if (!Number.isFinite(x) || !Number.isFinite(y)\n    || x < 0 || y < 0 || x > luma.width - 1 || y > luma.height - 1) return null;\n  const x0 = Math.floor(x);\n  const y0 = Math.floor(y);\n  const x1 = Math.min(luma.width - 1, x0 + 1);\n  const y1 = Math.min(luma.height - 1, y0 + 1);\n  const tx = x - x0;\n  const ty = y - y0;\n  const a = luma.data[y0 * luma.width + x0];\n  const b = luma.data[y0 * luma.width + x1];\n  const c = luma.data[y1 * luma.width + x0];\n  const d = luma.data[y1 * luma.width + x1];\n  return (a * (1 - tx) + b * tx) * (1 - ty)\n    + (c * (1 - tx) + d * tx) * ty;\n}\n\nfunction downsampleLuma(luma, maxDimension) {\n  const factor = Math.max(1, Math.ceil(Math.max(luma.width, luma.height) / maxDimension));\n  if (factor === 1) return { luma, factor };\n  const width = Math.ceil(luma.width / factor);\n  const height = Math.ceil(luma.height / factor);\n  const data = new Float32Array(width * height);\n  const alpha = luma.alpha ? new Uint8Array(width * height) : null;\n  // 원본은 안쪽 두 루프의 **종료 조건에서** Math.min 과 luma.width/height 프로퍼티를\n  // 매 픽셀 다시 읽었다. 값은 그대로 두고 경계만 밖으로 끌어낸다.\n  const sourceWidth = luma.width;\n  const sourceHeight = luma.height;\n  const sourceData = luma.data;\n  const sourceAlpha = luma.alpha;\n\n  for (let y = 0; y < height; y += 1) {\n    const yStart = y * factor;\n    const yEnd = Math.min(sourceHeight, yStart + factor);\n    for (let x = 0; x < width; x += 1) {\n      const xStart = x * factor;\n      const xEnd = Math.min(sourceWidth, xStart + factor);\n      let sum = 0;\n   ["/src/decoder/family.js", "\n/**\n * family.js — finder + tiling 증거를 이용한 포맷 패밀리 전단 판별\n *\n * 패밀리는 포맷 인덱스를 읽기 전에 확정한다. 같은 인덱스가 Type O/Type\n * A/Type Y에서 서로 다른 의미를 가지므로 외곽 모양이나 포맷 CRC를 지름길로\n * 쓰지 않는다.\n *\n * 이 모듈의 점수는 M1 calibration 전의 거친 기하 점수다. 분류 결과에는\n * 모든 경로 가설과 hard-check 진단을 함께 싣고, 한 경로가 먼저 통과했다고\n * 다른 경로 평가를 중단하지 않는다.\n *\n * Type Y는 전용 cube-detect 경로에서 육각 실루엣 + Y 심 + 세 면 격자 +\n * referenceAnchors 네 조를 모두 확인한다. 불스아이 실패는 Y 증거로 쓰지 않는다.\n *\n * @module decoder/family\n */\n\nimport {\n  FRONTEND_FAILURE,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\nimport { detectCubeHypotheses } from '__TLSCAN_BLOB_036__';\nimport {\n  CORNER_UNIT_OFFSETS,\n  FACE_SPINE_CORNER,\n  FACES,\n  SQRT3,\n  hexDistance,\n  regionCells,\n} from '__TLSCAN_BLOB_008__';\nimport { regionCellsA } from '__TLSCAN_BLOB_022__';\n\n/*\n * 패밀리 점수의 임계값·가중치는 설계에서 M1 calibration 전 [미검증]이다.\n * 모두 이름을 붙이고 options 로 대체 가능하게 해 calibration 이전의 임시값이\n * 규범 상수처럼 굳지 않게 한다.\n */\n// [미검증] M1 calibration 에서 확정: 면 원판의 최소 유효 표본 수.\nconst DEFAULT_MIN_SAMPLE_COUNT = 3;\n// [미검증] M1 calibration 에서 확정: strict rank 로 인정할 최소 간격.\nconst DEFAULT_MIN_SEPARATION = 0.08;\n// [미검증] M1 calibration 에서 확정: Type O 격자 hard-check 최소 지지율.\nconst DEFAULT_HEX_MIN_STRICT_RATE = 0.45;\n// [미검증] M1 calibration 에서 확정: Type O 외곽 링 hard-check 최소 지지율.\nconst DEFAULT_HEX_MIN_OUTER_RATE = 0.25;\n// [미검증] M1 calibration 에서 확정: Type A 패치 hard-check 최소 지지율.\nconst DEFAULT_TRI_MIN_PATCH_RATE = 0.20;\n// [미검증] M1 calibration 에서 확정: Type A 육각 코어 hard-check 최소 지지율.\nconst DEFAULT_TRI_MIN_CORE_RATE = 0.45;\n// [미검증] M1 calibration 에서 확정: 면 표본 원판 반경 비율.\nconst DEFAULT_SAMPLE_RADIUS_FRACTION = 0.5;\n// [미검증] M1 calibration 에서 확정: 거친 점수 항의 상대 가중치.\nconst HEX_SCORE_WEIGHTS = Object.freeze({ grid: 0.55, separation: 0.25, outer: 0.20 });\nconst TRI_SCORE_WEIGHTS = Object.freeze({ patch: 0.55, core: 0.30, finder: 0.15 });\nconst DEFAULT_KS = Object.freeze([6, 8, 10]);\nconst ORIENTATIONS = Object.freeze([0, 1, 2]);\nconst LUMA_RANGE_EPSILON = 1e-9;\nconst FACE_NAMES = Object.freeze(['T', 'L', 'R']);\n\nfunction clamp01(value) {\n  return Math.max(0, Math.min(1, value));\n}\n\nfunction finitePoint(point) {\n  return point && Number.isFinite(point.x) && Number.isFinite(point.y);\n}\n\n/*\n * 성공 결과만 캐시한다. `validateLuma` 는 전체 픽셀을 훑어 min/max 를 구하는데\n * 한 복호에서 세 번 불린다(실측 Type O/A). 입력은 luma 하나뿐이고 반환된\n * `{min,max,span}` 은 호출부가 읽기만 한다. 실패 경로는 위반 표본을 만나는 즉시\n * 빠져나오는 데다, 반환한 fail 객체가 상위에서 확장될 수 있어 공유하지 않는다.\n */\nconst validateLumaCache = new WeakMap();\n\nfunction validateLuma(luma) {\n  if (luma !== null && typeof luma === 'object') {\n    const cached = validateLumaCache.get(luma);\n    if (cached !== undefined) return cached;\n    const computed = computeValidateLuma(luma);\n    if (computed && computed.ok !== false) validateLumaCache.set(luma, computed);\n    return computed;\n  }\n  return computeValidateLuma(luma);\n}\n\nfunction computeValidateLuma(luma) {\n  if (luma === null || luma === undefined) {\n    return fail(FRONTEND_FAILURE.EMPTY_INPUT, { message: 'luma 가 없다' });\n  }\n  try {\n    assertLumaField(luma);\n  } catch (error) {\n    return fail(FRONTEND_FAILURE.EMPTY_INPUT, { message: error.message });\n  }\n\n  let min = Infinity;\n  let max = -Infinity;\n  // 버퍼·상한을 루프 밖으로 빼고 Math.min/max 를 비교로 바꿨다. 값은 같다 —\n  // 위 가드가 유한값만 통과시키므로 NaN 전파 차이가 생길 여지가 없다.\n  const data = luma.data;\n  const length = data.length;\n  const upperBound = 1 + LUMA_RANGE_EPSILON;\n  const lowerBound = -LUMA_RANGE_EPSILON;\n  for (let i = 0; i < length; i += 1) {\n    const value = data[i];\n    if (!Number.isFinite(value) || value < lowerBound || value > upperBound) {\n      return fail(FRONTEND_FAILURE.LUMA_DEGENERATE, {\n        message: '상대휘도 범위를 벗어난 표본이 있다',\n        index: i,\n        value,\n      });\n    }\n    if (value < min) min = value;\n    if (value > max) max = value;\n  }\n  if (!Number.isFinite(min) || max - min <= LUMA_RANGE_EPSILON) {\n    return fail(FRONTEND_FAILURE.LUMA_DEGENERATE, {\n      message: '휘도 범위가 없어 타일링 점수를 계산할 수 없다',\n      min,\n      max,\n    });\n  }\n  return { min, max, span: max - min };\n}\n\nfunction unwrapFinder(finder) {\n  if (finder && finder.ok === true) {\n    return finder.finder || finder.bullseye || finder;\n  }\n  return finder;\n}\n\nfunction normalizeFinder(finder) {\n  const source = unwrapFinder(finder);\n  if (!source || typeof source !== 'object') return null;\n  const center = source.center || source.origin;\n  const cellSize = source.cellSize === undefined\n    ? source.cellSizePxAtCenter\n    : source.cellSize;\n  if (!finitePoint(center) || !Number.isFinite(cellSize) || cellSize <= 0) return null;\n  const kind = source.finderKind || source.kind\n    || (source.centerQr ? 'center-qr' : 'bullseye');\n  return {\n    source,\n    center: { x: center.x, y: center.y },\n    cellSize,\n    kind,\n    score: Number.isFinite(source.score) ? clamp01(source.score) : 0.5,\n    hardChecksPassed: source.hardChecksPassed !== false,\n    centerQr: Boolean(source.centerQr || kind === 'center-qr'),\n    H: source.H || source.homography,\n  };\n}\n\nfunction normalizeKs(options, finder) {\n  const source = options.ks || (finder && finder.source && finder.source.ks) || DEFAULT_KS;\n  const values = Array.isArray(source) ? source : [source];\n  const output = new Set();\n  for (const value of values) {\n    if (Number.isInteger(value) && value >= 4) output.add(value);\n  }\n  return Array.from(output).sort((a, b) => a - b);\n}\n\nfunction normalizeOrientation(options) {\n  if (Number.isInteger(options.orientation) && ORIENTATIONS.includes(options.orientation)) {\n    return [options.orientation];\n  }\n  return ORIENTATIONS.slice();\n}\n\nfunction rotateVector(x, y, angle) {\n  const c = Math.cos(angle);\n  const s = Math.sin(angle);\n  return { x: c * x - s * y, y: s * x + c * y };\n}\n\nfunction axialPixel(q, r, cellSize) {\n  return {\n    x: cellSize * SQRT3 * (q + r / 2),\n    y: cellSize * 1.5 * r,\n  };\n}\n\nfunction applyHomography(H, q, r) {\n  if (!(H instanceof Float64Array) || H.length !== 9) return null;\n  const denominator = H[6] * q + H[7] * r + H[8];\n  if (!Number.isFinite(denominator) || Math.abs(denominator) <= LUMA_RANGE_EPSILON) return null;\n  const point = {\n    x: (H[0] * q + H[1] * r + H[2]) / denominator,\n    y: (H[3] * q + H[4] * r + H[5]) / denominator,\n  };\n  return finitePoint(point) ? point : null;\n}\n\nfunction projectCell(finder, q, r, orientation, options) {\n  const sign = options.orientationSign === -1 ? -1 : 1;\n  const angle = sign * orientation * (2 * Math.PI / 3);\n  if (typeof options.project === 'function') {\n    const custom = options.project({ q, r, orientation, angle, finder });\n    return finitePoint(custom) ? { x: custom.x, y: custom.y } : null;\n  }\n  const local = axialPixel(q, r, finder.cellSize);\n  const rotated = rotateVector(local.x, local.y, angle);\n  return { x: finder.center.x + rotated.x, y: finder.center.y + rotated.y };\n}\n\nfunction projectFace(finder, q, r, face, orientation, options) {\n  const cell = projectCell(finder, q, r, orientation, options);\n  if (!cell) return null;\n  const unit = CORNER_UNIT_OFFSETS[FACE_SPINE_CORNER[face]];\n  const sign = options.orientationSign === -1 ? -1 : 1;\n  const offset = rotateVector(\n    unit.x * finder.cellSize / 2,\n    unit.y * finder.cellSize / 2,\n    sign * orientation * (2 * Math.PI / 3),\n  );\n  return { x: cell.x + offset.x, y: cell.y + offset.y };\n}\n\nfunction bilinear(luma, x, y) {\n  if (!Number.isFinite(x) || !Number.isFinite(y)\n    || x < 0 || y < 0 || x > luma.width - 1 || y > luma.height - 1) return null;\n  const x0 = Math.floor(x);\n  const y0 = Math.floor(y);\n  const x1 = Math.min(luma.width - 1, x0 + 1);\n  const y1 = Math.min(luma.height - 1, y0 + 1);\n  const tx = x - x0;\n  const ty = y - y0;\n  const a = luma.data[y0 * luma.width + x0];\n  const b = luma.data[y0 * luma.width + x1];\n  const c = luma.data[y1 * luma.width + x0];\n  const d = luma.data[y1 * luma.width + x1];\n  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;\n}\n\nfunction median(values) {\n  const sorted = values.slice().sort((a, b) => a - b);\n  if (sorted.length === 0) return NaN;\n  const middle = Math.floor(sorted.length / 2);\n  return sorted.length % 2 === 1\n    ? sorted[middle]\n    : (sorted[middle - 1] + sorted[middle]) / 2;\n}\n\nfunction faceStat(luma, point, radius, grid) {\n  if (!point) return { median: NaN, mad: NaN, count: 0 };\n  const values = [];\n  const denominator = Math.max(1, grid - 1);\n  for (let gy = 0; gy < grid; gy += 1) {\n    for (let gx = 0; gx < grid; gx += 1) {\n      const ox = ((gx / denominator) * 2 - 1) * radius;\n      const oy = ((gy / denominator) * 2 - 1) * radius;\n      if (ox * ox + oy * oy > radius * radius + LUMA_RANGE_EPSILON) continue;\n      const value = bilinear(luma, point.x + ox, point.y + oy);\n      if (value !== null) values.push(value);\n    }\n  }\n  if (values.length === 0) return { median: NaN, mad: NaN, count: 0 };\n  const value = median(values);\n  return {\n    median: value,\n    mad: median(values.map((item) => Math.abs(item - value))),\n    count: values.length,\n  };\n}\n\nfunction cellSignal(luma, finder, q, r, orientation, options) {\n  const grid = Number.isInteger(options.sampleGrid) && options.sampleGrid >= 3\n    ? options.sampleGrid\n    : 5;\n  const fraction = Number.isFinite(options.sampleRadiusFraction)\n    && options.sampleRadiusFraction > 0\n    && options.sampleRadiusFraction <= 1\n    ? options.sampleRadiusFraction\n    : DEFAULT_SAMPLE_RADIUS_FRACTION;\n  const radius = finder.cellSize * (SQRT3 / 4) * fraction;\n  const faces = {};\n  for (const face of FACES) {\n    faces[face] = faceStat(\n      luma,\n      projectFace(finder, q, r, face, orientation, options),\n      radius,\n      grid,\n    );\n  }\n  const ordered = FACE_NAMES.map((face) => faces[face]);\n  const medians = ordered.map((face) => face.median);\n  const valid = ordered.every((face) => face.count >= (\n    Number.isInteger(options.minSampleCount) ? Math.max(1, options.minSampleCount) : DEFAULT_MIN_SAMPLE_COUNT\n  ));\n  if (!valid || medians.some((value) => !Number.isFinite(value))) {\n    return { valid: false, strict: false, separation: 0, faces };\n  }\n  const order = [0, 1, 2].sort((a, b) => {\n    const difference = medians[a] - medians[b];\n    return difference === 0 ? a - b : difference;\n  });\n  const sorted = order.map((index) => medians[index]);\n  const separation = Math.min(sorted[1] - sorted[0], sorted[2] - sorted[1]);\n  const minSeparation = Number.isFinite(options.minSeparation)\n    ? Math.max(0, options.minSeparation)\n    : DEFAULT_MIN_SEPARATION;\n  return {\n    valid: true,\n    strict: separation >= minSeparation,\n    separation: Math.max(0, separation),\n    faces,\n  };\n}\n\nfunction listCells(k, options) {\n  if (Array.isArray(options.sampleCells)) {\n    return options.sampleCells\n      .filter((cell) => cell && Number.isInteger(cell.q) && Number.isInteger(cell.r))\n      .map((cell) => ({ q: cell.q, r: cell.r }));\n  }\n  try {\n    return regionCells(k)\n      .filter((cell) => hexDistance(cell.q, cell.r) > 2)\n      .map((cell) => ({ q: cell.q, r: cell.r }));\n  } catch (error) {\n    return [];\n  }\n}\n\nfunction patchCells(k, options) {\n  if (Array.isArray(options.patchCells)) {\n    return options.patchCells\n      .filter((cell) => cell && Number.isInteger(cell.q) && Number.isInteger(cell.r))\n      .map((cell) => ({ q: cell.q, r: cell.r }));\n  }\n  try {\n    return regionCellsA(k)\n      .filter((cell) => hexDistance(cell.q, cell.r) > k)\n      .map((cell) => ({ q: cell.q, r: cell.r }));\n  } catch (error) {\n    return [];\n  }\n}\n\nfunction measureCells(luma, finder, k, orientation, cells, options) {\n  let strict = 0;\n  let valid = 0;\n  let separationSum = 0;\n  let outerStrict = 0;\n  let outerTotal = 0;\n  for (const cell of cells) {\n    const signal = cellSignal(luma, finder, cell.q, cell.r, orientation, options);\n    if (signal.valid) valid += 1;\n    if (signal.strict) strict += 1;\n    separationSum += signal.separation;\n    if (hexDistance(cell.q, cell.r) >= Math.max(3, k - 1)) {\n      outerTotal += 1;\n      if (signal.strict) outerStrict += 1;\n    }\n  }\n  const total = cells.length;\n  return {\n    k,\n    orientation,\n    total,\n    valid,\n    strict,\n    strictRate: total === 0 ? 0 : strict / total,\n    validRate: total === 0 ? 0 : valid / total,\n    meanSeparation: total === 0 ? 0 : separationSum / total,\n    outerTotal,\n    outerStrict,\n    outerRate: outerTotal === 0 ? 0 : outerStrict / outerTotal,\n  };\n}\n\nfunction measurePatch(luma, finder, k, orientation, cells, options) {\n  let strict = 0;\n  let valid = 0;\n  let separationSum = 0;\n  for (const cell of cells) {\n    const signal = cellSignal(luma, finder, cell.q, cell.r, orientation, options);\n    if (signal.valid) valid += 1;\n    if (signal.strict) strict += 1;\n    separationSum += signal.separation;\n  }\n  return {\n    k,\n    orientation,\n    total: cells.length,\n    valid,\n    strict,\n    strictRate: cells.length === 0 ? 0 : strict / cells.length,\n    validRate: cells.length === 0 ? 0 : valid / cells.length,\n    meanSeparation: cells.length === 0 ? 0 : separationSum / cells.length,\n  };\n}\n\nfunction explicitTiling(finder, family) {\n  const source = finder && finder.source;\n  if (!source || typeof source !== 'object') return null;\n  const key = family === 'hex' ? 'hexTiling' : 'triTiling';\n  const nested = source.tiling && source.tiling[family];\n  return source[key] || nested || null;\n}\n\nfunction scoreFromExplicit(raw, finder, family) {\n  if (!raw || typeof raw !== 'object') return null;\n  const hard = raw.hardChecks || {};\n  const all = (hard.all === undefined\n    ? raw.hardChecksPassed !== false\n      && (raw.strictRate === undefined || raw.strictRate >= (\n        family === 'hex' ? DEFAULT_HEX_MIN_ nderKind: finder.kind,\n    gridKind: 'hex-core-tri-patch',\n    k: best.k,\n    orientation: best.orientation,\n    score: clamp01(best.score),\n    hardChecks: {\n      finder: finderCheck,\n      coreTiling: coreCheck,\n      patchTiling: patchCheck,\n      all: finderCheck && coreCheck && patchCheck,\n    },\n    diagnostics: {\n      finder: {\n        center: finder.center,\n        cellSize: finder.cellSize,\n        score: finder.score,\n        hardChecksPassed: finder.hardChecksPassed,\n      },\n      lumaSpan: stats.span,\n      sizeScores: ordered,\n      selectedSize: { k: best.k, orientation: best.orientation },\n    },\n    hypothesisId: 'tri-' + best.k + '-' + best.orientation,\n  });\n}\n\n/**\n * Type A/tri의 육각 코어 + 코어 밖 세 삼각 패치 연속성 점수.\n */\nexport function scoreTriTiling(luma, finder, options = {}) {\n  return scoreTriInternal(luma, finder, options);\n}\n\n/**\n * Type Y의 육각 실루엣 + 중앙 Y 심 + 세 면 공변 격자 + 레퍼런스 네 조 점수.\n * 검출 실패를 불스아이 경로와 연결하지 않으며, tone/n/orientation 전 가설을 보존한다.\n */\nexport function scoreCubeTiling(luma, yJunction, options = {}) {\n  const cubeOptions = options.cube && typeof options.cube === 'object'\n    ? options.cube\n    : options;\n  const cached = cachedCubeTiling(luma, yJunction, cubeOptions);\n  if (cached !== undefined) return cached;\n  const computed = computeCubeTiling(luma, yJunction, cubeOptions);\n  storeCubeTiling(luma, yJunction, cubeOptions, computed);\n  return computed;\n}\n\n/*\n * cube 타일링 결과 재사용 캐시.\n *\n * `detectCubeHypotheses` 는 Type Y 검출 전체(실루엣·심·레퍼런스 보정·호모그래피\n * 정제)를 돌린다. 실측상 **Type O 복호 시간의 46%** 가 여기인데, 한 복호에서\n * 같은 계산이 서너 번 돈다:\n *   · `enumerateGeometryHypotheses` 의 독립 평가\n *   · 같은 함수 안의 `classifyFamily` (여기 아래 `scoreCubeTiling` 호출)\n *   · 재배치 재시도 / finder 해상도 재시도가 그 둘을 다시 부른다\n *\n * 캐시가 안전한 이유: 결과는 (`luma`, `yJunction`, cube 경로가 실제로 읽는 옵션\n * 네 개)의 순수 함수다. `cube-detect.js` 가 options 에서 읽는 키는 `calibration` ·\n * `sample` · `disc` · `tones` 가 전부이고(중첩 호출의 `samplingConfig` 도 그 넷에서\n * 파생된다), 나머지 bo a, normalizedEvidence.yJunction, options);\n  if (cube.ok === true) hypotheses.push(cube);\n  else reports.push({ family: 'cube', result: cube });\n\n  /*\n   * A 패치가 양성인 같은 finder에서 hex 코어만 통과시키면 A0 도플갱어를\n   * O로 강등하는 오류가 재발한다. 따라서 tri hard evidence가 있을 때 그\n   * finder의 hex 후보는 진단에 남기되 hard 선택에서 제외한다.\n   */\n  const triPositive = hypotheses.some((candidate) => candidate.family === 'tri'\n    && candidate.finderIndex !== undefined\n    && candidate.hardChecks && candidate.hardChecks.all);\n  if (triPositive) {\n    for (let i = 0; i < hypotheses.length; i += 1) {\n      const candidate = hypotheses[i];\n      if (candidate.family !== 'hex') continue;\n      const sameFinder = candidate.finderIndex === undefined\n        || hypotheses.some((other) => other.family === 'tri'\n          && other.finderIndex === candidate.finderIndex\n          && other.hardChecks && other.hardChecks.all);\n      if (sameFinder) hypotheses[i] = copyWithPatchExclusion(candidate);\n    }\n  }\n\n  const hard = hypotheses.filter((candidate) => candidate.hardChecks && candidate.hardChecks.all);\n  const familySet = Array.from(new Set(hard.map((candidate) => candidate.family))).sort();\n  const diagnostics = {\n    finderCount: finders.length,\n    finderReports,\n    reports,\n    cube,\n    hypothesisCount: hypotheses.length,\n    hardHypothesisCount: hard.length,\n    hardFamilies: familySet,\n  };\n\n  if (familySet.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_GRID_HYPOTHESIS, {\n      hypotheses,\n      diagnostics,\n      message: 'hard-check를 통과한 패밀리 가설이 없다',\n    });\n  }\n  if (familySet.length > 1) {\n    return fail(FRONTEND_FAILURE.FAMILY_AMBIGUOUS, {\n      hypotheses,\n      diagnostics,\n      message: '서로 다른 패밀리의 양성 기하 경로가 동시에 남았다',\n    });\n  }\n\n  return ok({\n    family: familySet[0],\n    hypotheses,\n    diagnostics,\n  });\n}\n"],
  ["/src/decoder/bootstrap.js", "/**\n * bootstrap.js — 디코더 앞단의 유한 기하 가설, 포맷 전 후보, 본문 검증 조립.\n *\n * 개정 설계의 핵심 불변식:\n *   - 버전/크기 후보는 인코더 capacity 표에서만 유도한다.\n *   - 포맷 proposal 전체를 평가하며 첫 CRC 성공에서 멈추지 않는다.\n *   - decodeCells 본문 검증 성공은 최종 후보의 필수 조건이다.\n *   - 복수 후보는 실패시키지 않고 무차원 점수와 고정 총순서로 하나를 고른다.\n */\n\nimport { VERSIONS } from '__TLSCAN_BLOB_028__';\nimport { VERSIONS_A } from '__TLSCAN_BLOB_029__';\nimport {\n  VERSIONS_Y,\n  windowedReferenceCellsY,\n  windowedFormatCellsY,\n  windowExcludedCellsY,\n} from '__TLSCAN_BLOB_030__';\nimport {\n  dataCellsInScanOrder as dataCellsInScanOrderY,\n  formatCells as formatCellsY,\n  layoutMapY,\n} from '__TLSCAN_BLOB_026__';\nimport { decodeCells } from '__TLSCAN_BLOB_031__';\nimport { enumerateFormatProposals } from '__TLSCAN_BLOB_005__';\nimport { axialToPixel, cellCount, HEX_AREA_COEFF, SQRT3 } from '__TLSCAN_BLOB_008__';\nimport { ranksToDigit } from '__TLSCAN_BLOB_014__';\nimport {\n  dataCellsInScanOrder,\n  formatCells,\n  layoutMap,\n  anchorCells,\n} from '__TLSCAN_BLOB_021__';\nimport {\n  dataCellsInScanOrderA,\n  layoutMapA,\n} from '__TLSCAN_BLOB_024__';\nimport {\n  FRONTEND_FAILURE,\n  HOMOGRAPHY_CANONICAL_SPACE,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\nimport {\n  findAAnchorHypotheses,\n  findOAnchorHypotheses,\n} from '__TLSCAN_BLOB_023__';\nimport { detectBullseyes, refineBullseye } from '__TLSCAN_BLOB_010__';\nimport { detectCellFinders } from '__TLSCAN_BLOB_017__';\nimport { FINDER_CELL_MASK_PATTERNS } from '__TLSCAN_BLOB_012__';\nimport { classifyFamily, scoreCubeTiling } from '__TLSCAN_BLOB_037__';\nimport {\n  UNVERIFIED_CUBE_DETECTION,\n  detectCentralCubeFinders,\n  readCubeDigit,\n  sampleCubeCell,\n  sampleCubeGrid,\n} from '__TLSCAN_BLOB_036__';\nimport { sampleHexCell, sampleHexGrid } from '__TLSCAN_BLOB_011__';\nimport { estimateHomography4, projectPoint } from '__TLSCAN_BLOB_003__';\nimport { estimateLocalWarp, validateOReferences } from '__TLSCAN_BLOB_020__';\nimport { robustPercentiles } from '__TLSCAN_BLOB_016__';\nimport { TONE_PATTERNS } from '__TLSCAN_BLOB_032__';\n\n/*\n * 아래 값은 전부 [미검증] M1 calibration 에서 확정한다. 공개 와이어 규범이\n * 아니며 options.calibration으로 덮어쓸 수 있다.\n */\nexport const UNVERIFIED_BOOTSTRAP_CALIBRATION = Object.freeze({\n  tauH: 0.25,\n  tauK: 0.20,\n  weightH: 0.30,\n  weightK: 0.20,\n  weightFormat: 0.30,\n  weightReference: 0.20,\n  rsPenalty: 2,\n  nearTieMargin: 0.05,\n  outlineThresholdFraction: 0.02,\n  rotationStepDegrees: 2,\n  finderMaxDimension: 240,\n  finderClutterMaxDimension: 240,\n  finderClutterRetryMaxDimension: 768,\n  finderClutterPyramidLevels: 2,\n  finderRefineIterations: 1,\n  maxGeometryCandidatesPerSize: 4,\n  anchorSampleMinCount: 3,\n  anchorProjectedMinorDiameter: 1,\n  minimumOutlinePixels: 16,\n  finderPyramidLevels: 1,\n  finderMaxRefinedProposals: 1,\n  finderClutterMaxRefinedProposals: 1,\n  finderProjectiveSeeds: false,\n  // [미검증] 라이브 전처리의 960 기본 프레임과 1440 승격 프레임을 재축소하지 않는다.\n  cellFinderMaxDimension: 1440,\n  localWarpSearchRadiusCells: 0.10,\n  localWarpSearchStepCells: 0.05,\n});\n\nconst ECC_NAME = Object.freeze({ 0: 'L', 1: 'M', 2: 'H' });\nconst FAMILY_ORDER = Object.freeze({ hex: 0, tri: 1, cube: 2 });\nconst EPSILON = 1e-12;\n\n/* 빈번한 기하 중앙값은 정렬·복사 대신 재사용 Float64 scratch quickselect를 쓴다. */\nlet medianValuesScratch = new Float64Array(0);\nlet medianOrderScratch = new Uint32Array(0);\nlet medianUseStableOrder = false;\nlet borderValuesScratch = new Float64Array(0);\n\nfunction ensureMedianScratch(length) {\n  if (medianValuesScratch.length >= length) return;\n  medianValuesScratch = new Float64Array(length);\n  medianOrderScratch = new Uint32Array(length);\n}\n\nfunction ensureBorderScratch(length) {\n  if (borderValuesScratch.length >= length) return;\n  borderValuesScratch = new Float64Array(length);\n}\n\nfunction swapMedianScratch(left, right) {\n  const value = medianValuesScratch[left];\n  medianValuesScratch[left] = medianValuesScratch[right];\n  medianVal , middle) > 0) swapMedianScratch(left, middle);\n    if (compareMedianScratch(left, right) > 0) swapMedianScratch(left, right);\n    if (compareMedianScratch(middle, right) > 0) swapMedianScratch(middle, right);\n\n    const pivotValue = medianValuesScratch[middle];\n    const pivotOrder = medianOrderScratch[middle];\n    let i = left;\n    let j = right;\n    while (i <= j) {\n      while (\n        medianValuesScratch[i] < pivotValue\n        || (!(medianValuesScratch[i] > pivotValue) && medianOrderScratch[i] < pivotOrder)\n      ) i += 1;\n      while (\n        medianValuesScratch[j] > pivotValue\n        || (!(medianValuesScratch[j] < pivotValue) && medianOrderScratch[j] > pivotOrder)\n      ) j -= 1;\n      if (i <= j) {\n        swapMedianScratch(i, j);\n        i += 1;\n        j -= 1;\n      }\n    }\n    if (rank <= j) right = j;\n    else if (rank >= i) left = i;\n    else return medianValuesScratch[rank];\n  }\n  return medianValuesScratch[left];\n}\n\nfunction selectMedianKth(length, rank) {\n  return medianUseStableOrder\n    ? selectStableMedianKth(length, rank)\n    : selectNumericMedianKth(length, rank);\n}\n\nfunction prepareMedianValues(values, length = values.length) {\n  ensureMedianScratch(length);\n  let stableOrder = false;\n  for (let i = 0; i < length; i += 1) {\n    const value = values[i];\n    medianValuesScratch[i] = value;\n    if (Number.isNaN(value) || (value === 0 && 1 / value === -Infinity)) stableOrder = true;\n  }\n  medianUseStableOrder = stableOrder;\n  if (stableOrder) {\n    for (let i = 0; i < length; i += 1) medianOrderScratch[i] = i;\n  }\n}\n\nfunction medianFromPreparedValues(length) {\n  if (length === 0) return null;\n  const middle = Math.floor(length / 2);\n  const upper = selectMedianKth(length, middle);\n  return length % 2 === 1\n    ? upper\n    : (selectMedianKth(length, middle - 1) + upper) / 2;\n}\n\nfunction medianFromValues(values, length) {\n  if (length === 0) return null;\n  prepareMedianValues(values, length);\n  return medianFromPreparedValues(length);\n}\n\nfunction calibration(options) {\n  const supplied = options && options.calibration && typeof options.calibration === 'object'\n    ? options.calibration\n    : {};\n  return { ...UNVERIFIED_BOOTSTRAP_CALIBRATION, ...supplied };\n}\n\nfunction median(values) {\n  if (values.length === 0) return null;\n  return medianFromValues(values, values.length);\n}\n\nfunction clamp01(value) {\n  return Math.max(0, Math.min(1, value));\n}\n\nfunction multiplyHomographies(left, right) {\n  const out = new Float64Array(9);\n  for (let row = 0; row < 3; row += 1) {\n    for (let column = 0; column < 3; column += 1) {\n      for (let inner = 0; inner < 3; inner += 1) {\n        out[row * 3 + column] += left[row * 3 + inner] * right[inner * 3 + column];\n      }\n    }\n  }\n  return out;\n}\n\nfunction rotationHomography(degrees) {\n  const radians = degrees * Math.PI / 180;\n  const cosine = Math.cos(radians);\n  const sine = Math.sin(radians);\n  return new Float64Array([\n    cosine, -sine, 0,\n    sine, cosine, 0,\n    0, 0, 1,\n  ]);\n}\n\nfunction finderTransform(finder) {\n  const H = finder && (finder.H || finder.transform || finder.B);\n  return H instanceof Float64Array && H.length === 9 ? H : null;\n}\n\nfunction familyProfiles(family) {\n  if (family === 'hex') {\n    return VERSIONS.map((spec) => ({\n      family,\n      dimension: spec.k,\n      spec,\n      formatIndices: [spec.version - 1, spec.version + 3],\n    }));\n  }\n  if (family === 'tri') {\n    return VERSIONS_A.map((spec) => ({\n      family,\n      dimension: spec.k,\n      spec,\n      formatIndices: [spec.formatIndex, spec.formatIndex + 2],\n    }));\n  }\n  if (family === 'cube') {\n    return VERSIONS_Y.map((spec) => ({\n      family,\n      dimension: spec.n,\n      spec,\n      formatIndices: [spec.formatIndex],\n    }));\n  }\n  return [];\n}\n\nfunction uniqueDimensions(family) {\n  return Array.from(new Set(familyProfiles(family).map((entry) => entry.dimension)))\n    .sort((a, b) => a - b);\n}\n\nfunction profileForHypothesis(hypothesis) {\n  const dimension = hypothesis.family === 'cube' ? hypothesis.n : hypothesis.k;\n  return familyProfiles(hypothesis.family).find((entry) => entry.dimension === dimension);\n}\n\nfunction validVersionIndices(hypothesis) {\n  const profile = profileForHypothesis(hypothesis);\n  if (!profile) return [];\n  if (hypothesis.family === 'hex') {\n    return [profile.spec.version - 1 + (hypothesis.centerQr ? 4 : 0)];\n  }\n  if (hypothesis.family === 'tri') {\n    return [profile.spec.formatIndex + (hypothesis.centerQr ? 2 : 0)];\n  }\n  return familyProfiles('cube')\n    .filter((entry) => entry.dimension === hypothesis.n\n      && (hypothesis.tones === undefined || entry.spec.tones === hypothesis.tones))\n    .map((entry) => entry.spec.formatIndex);\n}\n\n/** 모든 패밀리를 통틀어 존재하는 포맷 인덱스 전체. 재배치 탐색의 열거 범위다. */\nfunction allFormatIndices() {\n  const out = new Set();\n  for (const family of ['hex', 'tri', 'cube']) {\n    for (const entry of familyProfiles(family)) {\n      for (const index of entry.formatIndices) out.add(index);\n    }\n  }\n  return Array.from(out).sort((a, b) => a - b);\n}\n\n/**\n * 포맷 인덱스의 **소유자** (패밀리, 차원) 목록. `validVersionIndices` 의 역방향이다.\n *\n * 왜 필요한가: 포맷 정보는 CRC 로 보호된다. CRC 가 맞는데 인덱스가 가정한 패밀리 밖이면\n * 그건 \"포맷이 틀렸다\" 가 아니라 **\"패밀리 가정이 틀렸다\"** 는 뜻이다. 실제로 실기기\n * Type A 사진에서 복제 3/3 합의 + CRC 통과로 읽힌 인덱스 1 이 hex 폴백 때문에\n * `versionOutsideFamily` 로 폐기됐다 (`.agent/decoder/004`). 그 인덱스의 주인을\n * 되짚어 기하를 다시 세우려고 만든다.\n */\nfunction formatIndexOwners(formatIndex) {\n  const owners = [];\n  for (const family of ['hex', 'tri', 'cube']) {\n    for (const entry of familyProfiles(family)) {\n      if (entry.formatIndices.includes(formatIndex)) {\n        owners.push({ family, dimension: entry.dimension });\n      }\n    }\n  }\n  return owners;\n}\n\nfunction profileForFormatCandidate(hypothesis, formatIndex) {\n  const dimension = hypothesis.family === 'cube' ? hypothesis.n : hypothesis.k;\n  return familyProfiles(hypothesis.family).find((entry) =>\n    entry.dimension === dimension && entry.formatIndices.includes(formatIndex));\n}\n\nfunction sampleToDigit(sample) {\n  const rows = [\n    { face: 'T', value: sample.T.median, order: 0 },\n    { face: 'L', value: sample.L.median, order: 1 },\n    { face: 'R', value: sample.R.median, order: 2 },\n  ].sort((left, right) => left.value - right.value || left.order - right.order);\n  const ranks = {};\n  rows.forEach((row, rank) => {\n    ranks[row.face] = rank;\n  });\n  return ranksToDigit(ranks);\n}\n\nfunction borderBackground(luma, inset = 0) {\n  const { width, height, data, alpha } = luma;\n  const left = Math.min(Math.max(0, inset), Math.floor((width - 1) / 2));\n  const top = Math.min(Math.max(0, inset), Math.floor((height - 1) / 2));\n  const right = width - 1 - left;\n  const bottom = height - 1 - top;\n  const capacity = 2 * (right - left + 1) + 2 * Math.max(0, bottom - top - 1);\n  ensureBorderScratch(capacity);\n  let length = 0;\n\n  for (let x = left; x <= right; x += 1) {\n    let index = top * width + x;\n    if (!alpha || alpha[index] !== 0) {\n      const value = data[index];\n      if (Number.isFinite(value)) {\n        borderValuesScratch[length] = value;\n        length += 1;\n      }\n    }\n    index = bottom * width + x;\n    if (!alpha || alpha[index] !== 0) {\n      const value = data[index];\n      if (Number.isFinite(value)) {\n        borderValuesScratch[length] = value;\n        length += 1;\n      }\n    }\n  }\n  for (let y = top + 1; y < bottom; y += 1) {\n    let index = y * width + left;\n    if (!alpha || alpha[index] !== 0) {\n      const value = data[index];\n      if (Number.isFinite(value)) {\n        borderValuesScratch[length] = value;\n        length += 1;\n      }\n    }\n    index = y * width + right;\n    if (!alpha || alpha[index] !== 0) {\n      const value = data[index];\n      if (Number.isFinite(value)) {\n        borderValuesScratch
