<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 탭 제목도 언어를 따라간다. 지금 문구는 app.label(main 의 aria-label)과 같지만 **키는
     분리한다** — 붙여 두면 나중에 제목에 설명을 덧붙일 때 스크린리더 라벨까지 장황해진다.
     같은 값이라는 이유로 키를 합치면 두 소비자의 요구가 갈릴 때 되돌리기 어렵다.
     meta(description·og:*)는 안 건다 — 크롤러가 JS 를 안 돌려 런타임 변경이 무의미하다. -->
<title data-i18n="document.title">TLcube 스캐너</title>
<meta name="description" content="TLcube 코드를 카메라나 사진에서 읽는 스캐너입니다.">
<link rel="canonical" href="https://tlscan.estre.so/">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TLcube">
<meta property="og:title" content="TLcube 스캐너 — 카메라로 TLcube 코드 읽기">
<meta property="og:description" content="설치 없이 브라우저에서 TLcube 코드를 읽습니다. 프레임은 기기 안에서만 처리하고 서버로 이미지를 보내지 않아요.">
<meta property="og:url" content="https://tlscan.estre.so/">
<meta property="og:image" content="https://tl.estre.so/assets/type-Y.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "TLcube 스캐너",
  "url": "https://tlscan.estre.so/",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any (web browser)",
  "browserRequirements": "HTTPS, 카메라 접근을 지원하는 최신 브라우저",
  "description": "TrilLuminance (cube) 코드를 카메라나 사진에서 읽는 웹 스캐너. 프레임은 기기 안에서만 처리합니다.",
  "isPartOf": { "@type": "WebSite", "name": "TLcube", "url": "https://tl.estre.so/" },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
}
</script>
<link rel="icon" href="../_shared/favicon.svg" type="image/svg+xml">
<!-- PWA — 홈 화면에 설치해서 브라우저 크롬 없이 전체화면으로 쓴다.
     manifest·sw 는 배포 nginx 가 루트로 alias 한다(deploy/.../static.conf). dev 서버에는
     그 경로가 없어 404 가 나는데, 등록 실패는 삼키므로 스캐너 동작에는 영향이 없다. -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS 는 매니페스트 아이콘을 홈 화면에 쓰지 않는다. 이 링크가 없으면 파비콘을
     확대해 저해상도로 나온다(실기기 확인 2026-08-11). PNG 는 tools/make-icons.mjs 가 굽는다. -->
<link rel="apple-touch-icon" sizes="180x180" href="/_shared/icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TLcube">
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000;
    color: #fff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
    background: #000;
  }

  body {
    min-width: 320px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    border: 0;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }

  [hidden] {
    display: none !important;
  }

  .scanner-app {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #000;
  }

  .camera-backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #000;
  }

  .camera-backdrop::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    background:
      linear-gradient(180deg, rgb(0 0 0 / .58), transparent 26%, transparent 64%, rgb(0 0 0 / .7)),
      linear-gradient(90deg, rgb(0 0 0 / .18), transparent 22%, transparent 78%, rgb(0 0 0 / .18));
  }

  #camera-preview {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 180ms ease;
  }

  .camera-backdrop.is-active #camera-preview {
    opacity: 1;
  }

  .scanner-overlay {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding:
      max(18px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
    pointer-events: none;
  }

  .scanner-top,
  .scanner-bottom,
  .site-footer {
    display: flex;
    justify-content: center;
  }

  .scanner-top {
    /* 로고는 왼쪽, 언어 토글은 오른쪽. 사용자 지시로 언어를 우상단으로 옮겼다
       (하단은 «사진에서 스캔» 이 주역이라 컨트롤이 몰리면 탭 표적이 붐빈다). */
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .brand-logo {
    display: inline-flex;
    align-items: baseline;
    padding: 8px 10px;
    border: 1px solid rgb(255 255 255 / .22);
    border-radius: 999px;
    color: #fff;
    background: rgb(0 0 0 / .42);
    box-shadow: 0 8px 24px rgb(0 0 0 / .24);
    font-size: 14px;
    font-weight: 760;
    letter-spacing: -.04em;
    line-height: 1;
    text-decoration: none;
    text-shadow: 0 1px 10px rgb(0 0 0 / .9);
    pointer-events: auto;
  }

  .brand-logo span {
    color: #b7e5ff;
  }

  .scan-center {
    display: grid;
    flex: 1;
    place-items: center;
    padding: 42px 0 24px;
  }

  .scan-guide-wrap {
    display: grid;
    justify-items: center;
    gap: 18px;
  }

  .scan-guide {
    position: relative;
    width: min(72vw, 356px);
    aspect-ratio: 1;
    border: 2px solid rgb(255 255 255 / .44);
    border-radius: 28px;
    box-shadow:
      0 0 0 1px rgb(0 0 0 / .18) inset,
      0 18px 55px rgb(0 0 0 / .22);
  }

  .scan-corner {
    position: absolute;
    width: 38px;
    height: 38px;
    border-color: #d6f2ff;
    border-style: solid;
    filter: drop-shadow(0 1px 8px rgb(0 0 0 / .72));
  }

  .scan-corner.top-left {
    top: -3px;
    left: -3px;
    border-width: 4px 0 0 4px;
    border-radius: 13px 0 0;
  }

  .scan-corner.top-right {
    top: -3px;
    right: -3px;
    border-width: 4px 4px 0 0;
    border-radius: 0 13px 0 0;
  }

  .scan-corner.bottom-right {
    right: -3px;
    bottom: -3px;
    border-width: 0 4px 4px 0;
    border-radius: 0 0 13px;
  }

  .scan-corner.bottom-left {
    bottom: -3px;
    left: -3px;
    border-width: 0 0 4px 4px;
    border-radius: 0 0 0 13px;
  }

  .scan-guide-message {
    max-width: calc(100vw - 40px);
    margin: 0;
    padding: 8px 12px;
    border-radius: 999px;
    color: #fff;
    background: rgb(0 0 0 / .52);
    box-shadow: 0 3px 18px rgb(0 0 0 / .34);
    font-size: clamp(14px, 3.8vw, 16px);
    font-weight: 650;
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  .scanner-bottom {
    display: grid;
    justify-items: center;
    gap: 12px;
    padding-top: 12px;
  }

  .scan-status {
    max-width: min(100%, 460px);
    margin: 0;
    padding: 7px 11px;
    border-radius: 10px;
    color: rgb(255 255 255 / .94);
    background: rgb(0 0 0 / .5);
    box-shadow: 0 3px 16px rgb(0 0 0 / .26);
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  /*
   * 사진 스캔 실패 토스트.
   *
   * 왜 상태줄만으로 부족한가: 실패 문구는 `.scan-status` 에 조용히 갈아끼워지는데, 사진을
   * 고르는 동작 자체가 시스템 파일 선택기를 거쳐 돌아오는 흐름이라 사용자의 시선이 화면
   * 하단에 없다. 아무 일도 안 일어난 것처럼 보인다는 제보(2026-08-12).
   *
   * 왜 위쪽인가: 실패 후 사용자가 바로 할 일은 «다른 사진 고르기» 이고 그 버튼이 하단에
   * 있다. 생성기처럼 하단에 띄우면 눌러야 할 버튼을 토스트가 덮는다.
   *
   * ⚠ 배경이 고정으로 어두우니 글자도 고정 밝은 색이다 — 생성기 토스트와 같은 규칙
   *   (테마 변수를 쓰면 라이트에서 어두운 글자 + 어두운 배경이 된다).
   */
  .scan-toast {
    position: fixed; z-index: 60; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 60px));
    transform: translate(-50%, -12px); width: max-content; max-width: calc(100vw - 32px);
    padding: 11px 15px; border-radius: 999px; background: rgb(21 25 36 / .96);
    /* 스캐너 배경은 카메라 화면이거나 게이트의 거의 검은 오버레이다. 알약과 배경이 둘 다
       어두워 경계가 녹으므로 실선 테두리로 형태를 세운다(실브라우저 확인 2026-08-12). */
    border: 1px solid rgb(255 255 255 / .16);
    color: #f2f5fb; box-shadow: 0 10px 30px rgb(0 0 0 / .38); font-size: 13px;
    line-height: 1.35; text-align: center; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .scan-toast.visible { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { .scan-toast { font-size: 12px; } }

  .photo-button,
  .gate-primary,
  .result-primary,
  .open-url-button {
    min-height: 52px;
    border-radius: 16px;
    color: #061117;
    background: #e7f7ff;
    box-shadow: 0 10px 28px rgb(0 0 0 / .3);
    cursor: pointer;
    font-weight: 760;
    letter-spacing: -.01em;
  }

  .photo-button {
    width: min(100%, 360px);
    padding: 14px 20px;
    pointer-events: auto;
  }

  .photo-button:hover,
  .gate-primary:hover,
  .result-primary:hover,
  .open-url-button:hover {
    background: #fff;
  }

  .site-footer {
    padding-top: 14px;
    color: rgb(255 255 255 / .72);
    font-size: 11px;
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 1px 6px #000;
  }

  .site-footer a {
    color: #fff;
    pointer-events: auto;
  }

  /* 빌드 식별자 — 실기기 피드백에서 어느 배포본인지 바로 알기 위한 것. 눈에 띌 필요는
     없지만 읽을 수는 있어야 해서 본문보다 흐리게만 둔다. */
  .build-tag {
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }

  .lang-switch {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 2px;
    padding: 2px;
    border: 1px solid rgb(255 255 255 / .22);
    border-radius: 999px;
    background: rgb(0 0 0 / .42);
    pointer-events: auto;
  }

  .lang-switch button {
    padding: 5px 12px;
    border-radius: 999px;
    background: transparent;
    color: rgb(255 255 255 / .72);
    font-size: 12px;
    cursor: pointer;
  }

  .lang-switch button.active {
    background: rgb(255 255 255 / .92);
    color: #061117;
    font-weight: 700;
  }

  .camera-picker {
    pointer-events: auto;
    margin-top: 10px;
    max-width: min(320px, 80vw);
    padding: 7px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(18, 18, 20, 0.78);
    color: #fff;
    font: inherit;
    font-size: 13px;
  }

  /* 목록이 열렸을 때는 OS 가 그리므로 어두운 배경에 검은 글자가 되지 않도록 명시한다. */
  .camera-picker option {
    background: #17181c;
    color: #fff;
  }

  .camera-gate {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
    background: rgb(0 0 0 / .7);
    backdrop-filter: blur(10px);
  }

  .camera-gate-card {
    width: min(100%, 390px);
    padding: 26px;
    border: 1px solid rgb(255 255 255 / .18);
    border-radius: 24px;
    background: rgb(20 22 24 / .88);
    box-shadow: 0 24px 70px rgb(0 0 0 / .46);
    text-align: center;
  }

  .camera-gate-card h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(23px, 6vw, 29px);
    letter-spacing: -.045em;
    line-height: 1.18;
  }

  .camera-gate-card p {
    margin: 12px 0 0;
    color: rgb(255 255 255 / .76);
    font-size: 15px;
    line-height: 1.55;
  }

  .camera-gate-actions {
    display: grid;
    gap: 10px;
    margin-top: 24px;
  }

  .gate-primary,
  .gate-secondary {
    width: 100%;
    padding: 13px 16px;
  }

  .gate-primary:disabled {
    cursor: not-allowed;
    opacity: .52;
  }

  .gate-secondary,
  .result-secondary,
  .result-close,
  .copy-button {
    color: #fff;
    background: rgb(255 255 255 / .1);
    cursor: pointer;
  }

  .gate-secondary {
    min-height: 48px;
    border: 1px solid rgb(255 255 255 / .19);
    border-radius: 14px;
    font-weight: 680;
  }

  .result-sheet {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: end center;
    padding: 16px;
    background: rgb(0 0 0 / .64);
    backdrop-filter: blur(12px);
  }

  .result-card {
    position: relative;
    width: min(100%, 600px);
    max-height: min(84dvh, 760px);
    overflow: auto;
    padding: 28px 20px 20px;
    border: 1px solid rgb(255 255 255 / .16);
    border-radius: 24px;
    color: #fff;
    background: #141618;
    box-shadow: 0 28px 80px rgb(0 0 0 / .52);
  }

  .result-close {
    position: absolute;
    top: 13px;
    right: 13px;
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 50%;
    font-size: 23px;
    line-height: 1;
  }

  .result-eyebrow {
    margin: 0;
    color: #b7e5ff;
    font-size: 12px;
    font-weight: 760;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .result-card h2 {
    margin: 6px 44px 0 0;
    font-size: clamp(24px, 7vw, 32px);
    letter-spacing: -.045em;
    line-height: 1.17;
  }

  .result-content {
    display: grid;
    gap: 12px;
    margin-top: 22px;
  }

  .result-intro {
    margin: 0;
    color: rgb(255 255 255 / .68);
    font-size: 14px;
    line-height: 1.55;
  }

  .payload-url,
  .text-payload,
  .payload-field {
    overflow-wrap: anywhere;
    border: 1px solid rgb(255 255 255 / .1);
    border-radius: 16px;
    background: rgb(255 255 255 / .055);
  }

  .payload-url,
  .text-payload {
    display: block;
    padding: 15px;
  }

  .payload-url {
    color: #c7ecff;
    font-weight: 650;
    line-height: 1.5;
  }

  .text-payload {
    margin: 0;
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.58;
    white-space: pre-wrap;
  }

  .payload-field {
    display: grid;
    gap: 5px;
    padding: 13px;
  }

  .payload-field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .payload-label {
    color: rgb(255 255 255 / .64);
    font-size: 12px;
    font-weight: 700;
  }

  .payload-value {
    min-width: 0;
    color: #fff;
    font-size: 16px;
    font-weight: 650;
    line-height: 1.45;
  }

  a.payload-value {
    color: #c7ecff;
  }

  .copy-button {
    flex: 0 0 auto;
    min-height: 31px;
    padding: 5px 9px;
    border: 1px solid rgb(255 255 255 / .14);
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
  }

  .popup-fallback {
    display: grid;
    gap: 10px;
    padding: 16px;
    border: 1px solid rgb(183 229 255 / .34);
    border-radius: 16px;
    background: rgb(74 121 145 / .18);
  }

  .popup-fallback p {
    margin: 0;
    color: #e5f6ff;
    font-size: 14px;
    line-height: 1.5;
  }

  .open-url-button {
    width: 100%;
    padding: 14px 16px;
  }

  .result-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .result-primary,
  .result-secondary {
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 14px;
    font-weight: 760;
  }

  .result-secondary {
    border: 1px solid rgb(255 255 255 / .16);
  }

  @media (min-width: 560px) {
    .result-sheet {
      place-items: center;
    }

    .result-card {
      padding: 32px 28px 26px;
      border-radius: 28px;
    }

    .result-actions {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* 가로모드 — 세로 쌓기를 버리고 컨트롤을 우측 열로 옮긴다.
     세로 축을 그대로 두면 로고·가이드·버튼·푸터가 \~390px 높이에 전부 쌓여
     하단 버튼과 푸터가 화면 밖으로 잘린다(실기기 확인 2026-08-10).
     가이드 크기만 줄이는 것으로는 부족했다 — 축을 바꿔야 한다. */
  @media (max-height: 620px) and (orientation: landscape) {
    .scanner-overlay {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "top     top"
        "center  actions"
        "center  footer";
      align-items: center;
      column-gap: 16px;
    }

    .scanner-top { grid-area: top; }

    .scan-center {
      grid-area: center;
      min-height: 0;
      padding: 8px 0;
    }

    /* 상태 문구 + "사진에서 스캔" 을 우측에 세로로 세운다. */
    .scanner-bottom {
      grid-area: actions;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }

    .site-footer {
      grid-area: footer;
      justify-content: flex-end;
      align-self: end;
    }

    /* 우측 열이 폭을 가져가므로 가이드는 **높이 기준**으로 잡는다.

returns {{ symbols: Uint8Array, illegalIndices: number[] }} illegalIndices 는\n *   symbols 배열 기준 인덱스(셀 인덱스 아님).\n */\nexport function packCellDigitsToSymbols(digits) {\n  if (!digits || typeof digits.length !== 'number') {\n    throw new TypeError('digits 는 배열 유사 객체여야 한다');\n  }\n  if (digits.length % DIGITS_PER_SYMBOL !== 0) {\n    throw new RangeError(\n      `digit 개수는 ${DIGITS_PER_SYMBOL} 의 배수여야 한다: ${digits.length}`,\n    );\n  }\n  const symbolCount = digits.length / DIGITS_PER_SYMBOL;\n  const symbols = new Uint8Array(symbolCount);\n  const illegalIndices = [];\n  for (let i = 0; i < symbolCount; i += 1) {\n    const base = i * DIGITS_PER_SYMBOL;\n    const value = cellDigitsToSymbolValue(digits[base], digits[base + 1], digits[base + 2]);\n    symbols[i] = value; // Uint8Array 는 0..255 를 담으므로 215 까지도 무손실 저장\n    if (!isLegalSymbolValue(value)) illegalIndices.push(i);\n  }\n  return { symbols, illegalIndices };\n}\n\n/**\n * RS 심볼 값 배열(전부 합법, 0..210) → 셀 도메인 digit 배열(길이 = symbols.length × 3).\n * **인코더용.** 심볼이 불법값(>=211)이면 이 함수는 그 자리에서 던진다 — RS 는\n * GF(211) 위에서만 동작하므로 인코더가 불법 심볼을 만드는 것 자체가 상위 버그다.\n * 출력 버퍼를 쓰기 전에 전수 검증하므로 실패 시 out 이 오염되지 않는다.\n * @param {Uint8Array|number[]} symbols 값 0..210\n * @returns {Uint8Array}\n */\nexport function unpackSymbolsToCellDigits(symbols) {\n  if (!symbols || typeof symbols.length !== 'number') {\n    throw new TypeError('symbols 는 배열 유사 객체여야 한다');\n  }\n  for (let i = 0; i < symbols.length; i += 1) {\n    if (!isLegalSymbolValue(symbols[i])) {\n      throw new RangeError(`불법 RS 심볼 값 (인덱스 ${i}): ${symbols[i]} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n  }\n  const out = new Uint8Array(symbols.length * DIGITS_PER_SYMBOL);\n  for (let i = 0; i < symbols.length; i += 1) {\n    const [d0, d1, d2] = symbolValueToCellDigits(symbols[i]);\n    const base = i * DIGITS_PER_SYMBOL;\n    out[base] = d0;\n    out[base + 1] = d1;\n    out[base + 2] = d2;\n  }\n  return out;\n}\n\n// ── [계층 B] 바이트열 ↔ RS 심볼열 청커 (base-211 위치 기수법) ────────────────────\n\n/** 청크당 바이트 수. */\nexport const CHUNK_BYTES = 27;\n\n/** 청크당 심볼 수. 211^28 >= 2^216 이 성립하는 최소값(아래 자기검증 참조). */\nexport const CHUNK_SYMBOLS = 28;\n\nconst SYMBOL_BASE_BIG = 211n;\nconst BYTE_MASK = 0xffn;\n\n/**\n * 배열 구간 [offset, offset+count) 이 실재하는지 검증한다.\n * typed array 는 범위 밖 쓰기를 예외 없이 **조용히 버리므로**, 이 검사 없이는\n * \"조용한 절단 금지\" 계약이 쓰기 경로에서 공허해진다 (검증 라운드 지적).\n * 음수 count 도 여기서 잡는다 — offset > length 일 때 기본 length 인자가 음수가 되어\n * 루프가 0회 돌고 0n 이 반환되는 위장 실패를 막는다.\n */\nfunction assertRange(arr, offset, count, what) {\n  if (!Number.isInteger(offset) || offset < 0) {\n    throw new RangeError(`${what}: offset 은 0 이상 정수여야 한다: ${offset}`);\n  }\n  if (!Number.isInteger(count) || count < 0) {\n    throw new RangeError(`${what}: 개수는 0 이상 정수여야 한다: ${count} (offset ${offset} 이 배열 길이 ${arr.length} 를 넘었는가?)`);\n  }\n  if (offset + count > arr.length) {\n    throw new RangeError(`${what}: 구간 [${offset}, ${offset + count}) 이 배열 길이 ${arr.length} 를 넘는다`);\n  }\n}\n\n// 모듈 로드 시 1회 자기검증: 27B↔28심볼이 무손실 최소 청크인지 BigInt 로 단언.\n// (ADR §6.2 근거 5 · PM/005 요구사항 — \"27 이 상한이자 28 이 최소\".)\n(() => {\n  const bound = 1n << BigInt(8 * CHUNK_BYTES); // 2^216\n  const pow28 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS);\n  const pow27 = SYMBOL_BASE_BIG ** BigInt(CHUNK_SYMBOLS - 1);\n  if (pow28 < bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS} < 2^${8 * CHUNK_BYTES}`);\n  }\n  if (pow27 >= bound) {\n    throw new Error(`자기검증 실패: 211^${CHUNK_SYMBOLS - 1} >= 2^${8 * CHUNK_BYTES} (28 이 최소가 아님)`);\n  }\n})();\n\n/**\n * m 바이트를 손실 없이 담는 **최소** base-211 심볼 수.\n * 정의상 min{ s : 211^s >= 2^(8m) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n * @param {number} m 바이트 수 (>= 0)\n * @returns {number}\n */\nexport function minSymbolsExact(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  const target = 1n << BigInt(8 * m);\n  let s = 0;\n  let pow = 1n;\n  while (pow < target) {\n    pow *= SYMBOL_BASE_BIG;\n    s += 1;\n  }\n  return s;\n}\n\n/**\n * 닫힌 형태 ceil(m·8 / log2 211) 을 부동소수로 계산한 것. `minSymbolsExact` 의 BigInt\n * 정확 계산과 일치해야 한다(테스트가 단언). 정본은 `minSymbolsExact`.\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountFormula(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  return Math.ceil((m * 8) / Math.log2(RS_SYMBOL_BASE));\n}\n\n/** m = 0..CHUNK_BYTES 사전 계산 표 (인덱스 = 바이트 수). */\nconst TAIL_SYMBOLS = Object.freeze(buildTailTable());\n\nfunction buildTailTable() {\n  const table = [];\n  for (let m = 0; m <= CHUNK_BYTES; m += 1) table.push(minSymbolsExact(m));\n  return table;\n}\n\n/**\n * m 바이트에 대응하는 심볼 개수(꼬리표 조회, m = 0..27) 또는 일반식(m > 27).\n * @param {number} m\n * @returns {number}\n */\nexport function symbolCountForBytes(m) {\n  if (!Number.isInteger(m) || m < 0) {\n    throw new RangeError(`바이트 수는 0 이상 정수여야 한다: ${m}`);\n  }\n  if (m <= CHUNK_BYTES) return TAIL_SYMBOLS[m];\n  return minSymbolsExact(m);\n}\n\n/**\n * 전체 바이트 길이에 대응하는 심볼 총 개수.\n * @param {number} byteLength\n * @returns {number}\n */\nexport function symbolCountForByteLength(byteLength) {\n  if (!Number.isInteger(byteLength) || byteLength < 0) {\n    throw new RangeError(`바이트 길이는 0 이상 정수여야 한다: ${byteLength}`);\n  }\n  const full = Math.floor(byteLength / CHUNK_BYTES);\n  const tail = byteLength % CHUNK_BYTES;\n  return full * CHUNK_SYMBOLS + TAIL_SYMBOLS[tail];\n}\n\n/** 꼬리 심볼 수 → 꼬리 바이트 수 역인덱스. */\nconst TAIL_SYMBOLS_TO_BYTES = (() => {\n  const map = new Map();\n  for (let m = 0; m < CHUNK_BYTES; m += 1) map.set(TAIL_SYMBOLS[m], m);\n  return map;\n})();\n\n/**\n * 심볼 총 개수 → 바이트 길이. 꼬리 심볼 수가 서로 다르고 모두 28 미만이면 유일하게\n * 역산된다(테스트가 표의 단사성을 확인한다). 정본은 헤더 길이 필드다.\n * @param {number} symbolCount\n * @returns {number}\n */\nexport function byteLengthForSymbolCount(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const full = Math.floor(symbolCount / CHUNK_SYMBOLS);\n  const rem = symbolCount % CHUNK_SYMBOLS;\n  const tailBytes = TAIL_SYMBOLS_TO_BYTES.get(rem);\n  if (tailBytes === undefined) {\n    throw new RangeError(`유효한 청크 분해가 없는 심볼 개수: ${symbolCount} (나머지 ${rem})`);\n  }\n  return full * CHUNK_BYTES + tailBytes;\n}\n\n// ── 청크 단위 원시 변환 (상수 메모리 프리미티브) ─────────────────────────────────\n\n/**\n * 바이트 구간 → BigInt (빅엔디안).\n * @param {Uint8Array|number[]} bytes\n * @param {number} offset\n * @param {number} length\n * @returns {bigint}\n */\nexport function bytesToBigInt(bytes, offset = 0, length = bytes.length - offset) {\n  assertRange(bytes, offset, length, 'bytesToBigInt');\n  let value = 0n;\n  for (let i = 0; i < length; i += 1) {\n    const b = bytes[offset + i];\n    if (!Number.isInteger(b) || b < 0 || b > 255) {\n      throw new RangeError(`바이트 값 범위 위반: index ${offset + i} = ${b}`);\n    }\n    value = (value << 8n) | BigInt(b);\n  }\n  return value;\n}\n\n/**\n * BigInt → 바이트 구간에 기록 (빅엔디안). **쓰기 전에 크기를 검증**해서 실패 시\n * out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {Uint8Array} out\n * @param {number} offset\n * @param {number} length\n */\nexport function bigIntToBytes(value, out, offset, length) {\n  assertRange(out, offset, length, 'bigIntToBytes');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= (1n << BigInt(8 * length))) {\n    throw new RangeError(`값이 ${length} 바이트에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = length - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest & BYTE_MASK);\n    rest >>= 8n;\n  }\n}\n\n/**\n * BigInt → 심볼 배열에 기록 (MSD first). 앞은 0 으로 패딩.\n * **쓰기 전에 크기를 검증**해서 실패 시 out 을 오염시키지 않는다.\n * @param {bigint} value\n * @param {number} symbolCount\n * @param {Uint8Array|number[]} out\n * @param {number} offset\n */\nexport function bigIntToSymbols(value, symbolCount, out, offset = 0) {\n  assertRange(out, offset, symbolCount, 'bigIntToSymbols');\n  if (value < 0n) throw new RangeError('음수는 인코딩할 수 없다');\n  if (value >= SYMBOL_BASE_BIG ** BigInt(symbolCount)) {\n    throw new RangeError(`값이 심볼 ${symbolCount} 개에 들어가지 않는다: ${value}`);\n  }\n  let rest = value;\n  for (let i = symbolCount - 1; i >= 0; i -= 1) {\n    out[offset + i] = Number(rest % SYMBOL_BASE_BIG);\n    rest /= SYMBOL_BASE_BIG;\n  }\n}\n\n/**\n * 심볼 구간 → BigInt (MSD first). 심볼 값이 0..210 를 벗어나면 던진다\n * (base-211 위치 기수법의 자릿값 자체가 GF(211) 범위이므로 이 검사가 곧\n * \"RS 심볼 도메인 검증\"이다 — 계층 A 의 셀 불법값 판정과는 별개).\n * @param {Uint8Array|number[]} symbols\n * @param {number} offset\n * @param {number} symbolCount\n * @returns {bigint}\n */\nexport function symbolsToBigInt(symbols, offset = 0, symbolCount = symbols.length - offset) {\n  assertRange(symbols, offset, symbolCount, 'symbolsToBigInt');\n  let value = 0n;\n  for (let i = 0; i < symbolCount; i += 1) {\n    const s = symbols[offset + i];\n    if (!isLegalSymbolValue(s)) {\n      throw new RangeError(`심볼 범위 위반: index ${offset + i} = ${s} (허용 0..${RS_SYMBOL_BASE - 1})`);\n    }\n    value = value * SYMBOL_BASE_BIG + BigInt(s);\n  }\n  return value;\n}\n\n/**\n * 한 청크(1..27 바이트) → 심볼들. 작업 메모리 상수.\n * @param {Uint8Array} bytes\n * @param {number} byteOffset\n * @param {number} byteLength 1..27\n * @param {Uint8Array|number[]} out\n * @param {number} symbolOffset\n * @returns {number} 기록한 심볼 개수\n */\nexport function encodeChunkInto(bytes, byteOffset, byteLength, out, symbolOffset) {\n  if (byteLength < 1 || byteLength > CHUNK_BYTES) {\n    throw new RangeError(`청크 바이트 길이는 1..${CHUNK_BYTES}: ${byteLength}`);\n  }\n  const symbolCount = TAIL_SYMBOLS[byteLength];\n  bigIntToSymbols(bytesToBigInt(bytes, byteOffset, byteLength), symbolCount, out, symbolOffset);\n  return symbolCount;\n}\n\n/**\n * 한 청크의 심볼들 → 바이트. 작업 메모리 상수.\n * @param {Uint8Array|number[]} symbols\n * @param {number} symbolOffset\n * @param {number} byteLength 1..27 (기대 바이트 수 — 헤더 길이 필드에서 온다)\n * @param {Uint8Array} out\n * @param {number} byteOffset\n * @returns {number} 소비한 심볼 개수\n */\nexport function decodeChunkInto(symbols, symbolOffset, byteLength, out, byteOffset) {\n  if (byteLength < 1 || byteLength > CHUNK_BYTES) {\n    throw new RangeError(`청크 바이트 길이는 1..${CHUNK_BYTES}: ${byteLength}`);\n  }\n  const symbolCount = TAIL_SYMBOLS[byteLength];\n  const value = symbolsToBigInt(symbols, symbolOffset, symbolCount);\n  bigIntToBytes(value, out, byteOffset, byteLength);\n  return symbolCount;\n}\n\n// ── 스트림 API ────────────────────────────────────────────────────────────────\n\n/**\n * 바이트열 → RS 심볼열. 27바이트 청크 단위 스트리밍.\n * @param {Uint8Array} bytes\n * @returns {Uint8Array} 심볼 값 {0..210} 의 배열\n */\nexport function bytesToSymbols(bytes) {\n  assertBytes(bytes);\n  const out = new Uint8Array(symbolCountForByteLength(bytes.length));\n  let byteOffset = 0;\n  let symbolOffset = 0;\n  while (byteOffset < bytes.length) {\n    const take = Math.min(CHUNK_BYTES, bytes.length - byteOffset);\n    symbolOffset += encodeChunkInto(bytes, byteOffset, take, out, symbolOffset);\n    byteOffset += take;\n  }\n  return out;\n}\n\n/**\n * RS 심볼열 → 바이트열.\n * @param {Uint8Array|number[]} symbols\n * @param {number} [byteLength] 페이로드 헤더의 바이트 길이 필드(정본). 생략하면\n *   심볼 개수로부터 역산한다.\n * @returns {Uint8Array}\n */\nexport function symbolsToBytes(symbols, byteLength) {\n  if (!symbols || typeof symbols.length !== 'number') {\n    throw new TypeError('symbols 는 배열 유사 객체여야 한다');\n  }\n  const len = byteLength === undefined ? byteLengthForSymbolCount(symbols.length) : byteLength;\n  const expected = symbolCountForByteLength(len);\n  if (symbols.length !== expected) {\n    throw new RangeError(\n      `심볼 개수 불일치: ${symbols.length} 개, 바이트 길이 ${len} 는 ${expected} 개를 요구`,\n    );\n  }\n  const out = new Uint8Array(len);\n  let byteOffset = 0;\n  let symbolOffset = 0;\n  while (byteOffset < len) {\n    const take = Math.min(CHUNK_BYTES, len - byteOffset);\n    symbolOffset += decodeChunkInto(symbols, symbolOffset, take, out, byteOffset);\n    byteOffset += take;\n  }\n  return out;\n}\n\n/**\n * 출력 배열을 통째로 잡지 않는 진짜 스트리밍 변환. 심볼을 하나씩 흘린다.\n * @param {Uint8Array} bytes\n * @yields {number} 심볼 값 {0..210}\n */\nexport function* iterSymbols(bytes) {\n  assertBytes(bytes);\n  const scratch = new Uint8Array(CHUNK_SYMBOLS);\n  let byteOffset = 0;\n  while (byteOffset < bytes.length) {\n    const take = Math.min(CHUNK_BYTES, bytes.length - byteOffset);\n    const n = encodeChunkInto(bytes, byteOffset, take, scratch, 0);\n    for (let i = 0; i < n; i += 1) yield scratch[i];\n    byteOffset += take;\n  }\n}\n\nfunction assertBytes(bytes) {\n  if (!(bytes instanceof Uint8Array)) {\n    throw new TypeError('bytes 는 Uint8Array 여야 한다');\n  }\n}\n"],
  ["/src/beacon.js", "/**\n * beacon.js — 사용 이벤트 비콘 + **오프라인 큐**.\n *\n * ## 왜 별도 모듈인가\n *\n * 허브(tl.estre.so)는 `sites/_shared/site.js` 를 `<script src>` 로 불러 쓴다. 하지만\n * 생성기·스캐너는 **단일 HTML 파일**로 배포되고 생성기는 `file://` 로도 열려야 해서\n * (SPEC §8) 외부 스크립트를 참조할 수 없다. 그래서 번들에 들어가는 ESM 으로 따로 둔다.\n *\n * ⚠ `site.js` 에 같은 규약의 구현이 하나 더 있다(허브용). 둘 중 하나만 고치면 어긋난다 —\n *   `test/beacon-contract.test.js` 가 페이로드 필드 집합을 양쪽에 대해 고정한다.\n *\n * ## 오프라인 큐 (이 파일의 존재 이유)\n *\n * `sendBeacon` 은 오프라인에서 **던지지도 않고 그냥 실패**한다(false 반환). PWA 로 설치해\n * 쓰는 사용자는 오프라인 구간이 흔해서, 그대로 두면 그 구간 이벤트가 통째로 사라진다.\n * 그래서 실패한 이벤트를 localStorage 에 쌓아 두고 `online` 이벤트·다음 방문에 흘려보낸다.\n *\n * 큐 설계에서 지키는 것:\n *   · **상한**을 둔다(`MAX_QUEUE`). 오프라인이 길어도 저장소를 채우지 않는다 — 넘치면\n *     **오래된 것부터** 버린다(최신 행동이 더 쓸모 있다).\n *   · **나이 상한**도 둔다. 며칠 지난 이벤트는 통계를 흐리기만 한다.\n *   · flush 는 **전부 성공했을 때만** 큐를 비운다. 부분 성공이면 남은 것을 되돌려 둔다.\n *   · 개인 식별자를 담지 않는다 — 큐에 들어가는 것도 원래 비콘과 같은 메타뿐이다.\n *\n * @module beacon\n */\n\nconst ENDPOINT = 'https://tl.estre.so/i';\nconst QUEUE_KEY = 'tl-beacon-queue';\nconst MAX_QUEUE = 50;\nconst MAX_AGE_MS = 3 * 24 * 60 * 60 * 1000;\n\nfunction readQueue() {\n  try {\n    const raw = localStorage.getItem(QUEUE_KEY);\n    const list = raw ? JSON.parse(raw) : [];\n    return Array.isArray(list) ? list : [];\n  } catch {\n    return [];\n  }\n}\n\nfunction writeQueue(list) {\n  try {\n    localStorage.setItem(QUEUE_KEY, JSON.stringify(list));\n  } catch {\n    // 저장소가 막혀 있으면 큐를 포기한다 — 사이트 기능과 무관하다.\n  }\n}\n\n/** 실제 전송 한 건. 성공 여부를 돌려준다(오프라인이면 false). */\nfunction post(row) {\n  if (typeof navigator === 'undefined' || !navigator.sendBeacon) return false;\n  try {\n    return navigator.sendBeacon(\n      ENDPOINT,\n      new Blob([`${JSON.stringify(row)}\\n`], { type: 'text/plain' }),\n    ) === true;\n  } catch {\n    return false;\n  }\n}\n\n/** 큐를 비운다. 실패한 것만 되돌려 둔다. */\nexport function flushQueue() {\n  const queued = readQueue();\n  if (queued.length === 0) return { sent: 0, kept: 0 };\n  const cutoff = Date.now() - MAX_AGE_MS;\n  const fresh = queued.filter((row) => !row.queued_at || row.queued_at >= cutoff);\n\n  const kept = [];\n  let sent = 0;\n  for (const row of fresh) {\n    // 큐 표식은 보내지 않는다 — 스키마에 없는 필드다.\n    const { queued_at: _ignored, ...payload } = row;\n    if (post(payload)) sent += 1;\n    else kept.push(row);\n  }\n  writeQueue(kept);\n  return { sent, kept: kept.length };\n}\n\nfunction enqueue(row) {\n  const queued = readQueue();\n  queued.push({ ...row, queued_at: Date.now() });\n  // 넘치면 **오래된 것부터** 버린다 — 최신 행동이 더 쓸모 있다.\n  writeQueue(queued.slice(-MAX_QUEUE));\n}\n\n/**\n * 비콘 하나를 만든다.\n *\n * @param {string} site `body[data-site]` 에 해당하는 사이트 식별자\n * @returns {(event: string, props?: Record<string, unknown>) => void}\n */\n/** 리퍼러의 **도메인만**. 전체 URL 은 저장하지 않는다. */\nfunction refDomain() {\n  try {\n    if (typeof document === 'undefined' || !document.referrer) return '';\n    const url = new URL(document.referrer);\n    return url.hostname === location.hostname ? '' : url.hostname;\n  } catch {\n    return '';\n  }\n}\n\n/** UA 힌트 — 문자열 파싱을 하지 않는다. 없으면 빈 값으로 두고 컬럼 기본값에 맡긴다. */\nfunction uaHints() {\n  const uad = typeof navigator === 'undefined' ? null : navigator.userAgentData;\n  const brands = uad && uad.brands;\n  const brand = brands ? brands.find((x) => !/Not.?A.?Brand/i.test(x.brand)) : null;\n  return { browser: brand ? brand.brand : '', os: (uad && uad.platform) || '' };\n}\n\nexport function createBeacon(site) {\n  const { browser: uaBrowser, os: uaOs } = uaHints();\n  /** 탭 수명 임시 ID — 영속 식별자가 아니다. */\n  const session = (() => {\n    try {\n      const existing = sessionStorage.getItem('tl-sid');\n      if (existing) return existing;\n      const made = Math.random().toString(36).slice(2, 10);\n      sessionStorage.setItem('tl-sid', made);\n      return made;\n    } catch {\n      return 'nostore';\n    }\n  })();\n\n  // 온라인으로 돌아오면 밀린 것을 흘려보낸다. 첫 로드에서도 한 번 시도한다.\n  if (typeof window !== 'undefined') {\n    window.addEventListener('online', () => flushQueue());\n    flushQueue();\n  }\n\n  return function send(event, props) {\n    /*\n     * ⚠ **필드 집합이 ClickHouse 테이블 컬럼과 정확히 일치해야 한다.**\n     *   수집은 `INSERT … FORMAT JSONEachRow` 이고 `async_insert=1&\n     *   wait_for_async_insert=0` 이라 **서버가 뭘 하든 클라이언트엔 안 보인다.**\n     *   보내는 쪽에서만 맞출 수 있다는 뜻이다.\n     *\n     *   서버가 실제로 어떻게 반응하는지는 실측해 뒀다(2026-08-11, estre.so):\n     *     · 컬럼에 없는 키 → `input_format_skip_unknown_fields=1` 이라 **그 키만 조용히\n     *       버려지고 행은 들어간다.** 행이 죽지 않으니 더 고약하다 — 수집되는 줄 알고\n     *       대시보드를 보는데 그 필드만 영영 비어 있다.\n     *     · 컬럼은 맞는데 **타입**이 틀리면(예: Map 컬럼인 `props` 에 문자열) 파싱\n     *       단계에서 **행 전체가 거부된다.** 이쪽이 유일한 행 단위 손실 경로다.\n     *     · 안 보낸 컬럼 → DEFAULT 로 채워진다. 두 구현이 갈리면 사이트마다 빈 칸이\n     *       달라져 집계가 조용히 어긋난다.\n     *   `test/beacon-contract.test.js` 가 이 일치를 고정한다.\n     */\n    const row = {\n      site,\n      event,\n      ts: new Date().toISOString().replace('T', ' ').replace('Z', ''),\n      path: typeof location === 'undefined' ? '' : location.pathname,\n      ref: refDomain(),\n      ua_browser: uaBrowser,\n      ua_os: uaOs,\n      lang: typeof document === 'undefined' ? '' : (document.documentElement.lang || ''),\n      session,\n      // ⚠ props 는 Map(String, String) 컬럼이라 **객체**로 보내고 값도 문자열로 맞춘다.\n      props: props\n        ? Object.fromEntries(Object.entries(props).map(([k, v]) => [k, String(v)]))\n        : {},\n    };\n    // 오프라인이면 큐에 쌓는다. navigator.onLine 은 거짓 양성이 있으므로 전송 결과도 본다.\n    const online = typeof navigator === 'undefined' || navigator.onLine !== false;\n    if (!online || !post(row)) enqueue(row);\n  };\n}\n"],
  ["/src/decoder/contracts.js", "/**\n * contracts.js — 디코더 앞단 모듈 간 **자료형 계약** (설계 §13 의 시그니처를 잇는 접착제)\n *\n * 앞단은 여러 모듈로 나뉘어 병렬 구현된다. 각 모듈이 자기 방식으로 좌표·휘도·기하를\n * 표현하면 통합 시점에 4-way 불일치가 난다. 그래서 **주고받는 값의 모양을 여기서 먼저\n * 고정**한다. 이 파일은 런타임 로직을 거의 갖지 않는다 — 타입 정의와 최소한의 생성자·\n * 불변식 검사만 둔다.\n *\n * 규약:\n *   · 좌표계는 두 개뿐이다 — **canonical Euclidean** 과 **image pixel**.\n *   · canonical Euclidean은 Type O/A에서 불스아이 중심, Type Y에서 Y-심이 원점\n *     (0,0)이고 +x는 오른쪽, +y는 아래인 유클리드 평면이다. 단위는 각 타입의 모듈\n *     변 길이 1이다. axial (q,r) 또는 Type Y (i,j)는 셀 식별자일 뿐 Homography\n *     입력이 아니며, 각 격자 모듈의 기하 함수가 canonical 점을 만든다.\n *   · 이 단위는 `buildScene(...,{cellSize:1})`의 길이 단위와 같지만, canvas margin이\n *     들어간 scene 절대좌표는 아니다. scene origin을 canonical로 흘려보내지 않는다.\n *   · 호모그래피는 항상 canonical Euclidean → image pixel 방향이다.\n *   · 휘도는 `luminance.js` 의 `relativeLuminance` 와 **같은 정의**의 0..1 실수다.\n *     8비트 값을 그대로 넘기지 않는다.\n *   · 실패는 예외가 아니라 `{ok:false, reason}` 이다 (후단 `decode.js` 와 같은 규약).\n *   · RNG 금지. 같은 입력 → 같은 출력.\n *\n * @module decoder/contracts\n */\n\n/**\n * 상대휘도 필드. 원본 래스터에서 한 번만 만들고 이후 전 단계가 공유한다.\n *\n * @typedef {object} LumaField\n * @property {number} width\n * @property {number} height\n * @property {Float32Array} data  길이 width*height, 값은 **0..1 상대휘도**\n * @property {Uint8Array|null} alpha  투명 배경 입력의 알파(0..255). 없으면 null.\n */\n\n/**\n * 이미지 픽셀 좌표. 정수가 아니어도 된다(서브픽셀).\n * @typedef {object} Point\n * @property {number} x\n * @property {number} y\n */\n\n/**\n * Homography canonical 공간의 런타임 태그. GridHypothesis 진단에 넣어 좌표 계약이\n * 다시 갈라질 때 조용한 재해석 대신 즉시 식별한다.\n */\nexport const HOMOGRAPHY_CANONICAL_SPACE = 'hex-euclidean-unit-cell';\n\n/**\n * 호모그래피. **canonical Euclidean → image pixel** 방향, row-major 3×3.\n *\n * canonical 점 (u,v):\n *   - 원점: Type O/A 불스아이 중심 또는 Type Y 중앙 Y-심\n *   - 축: +u 오른쪽, +v 아래\n *   - 단위: 모듈 변 길이 1\n *   - Type O/A axial 셀은 `axialToPixel`, Type Y 면 셀은\n *     `moduleCenter/moduleSampleDisc`가 canonical 점을 만든다.\n *\n * 역방향이 필요하면 `invertHomography` 로 만든다. axial (q,r), canvas-origin\n * scene 좌표, image pixel을 H의 입력으로 대신 쓰는 어댑터는 계약 위반이다.\n * @typedef {Float64Array} Homography  길이 9\n */\n\n/**\n * 불스아이 검출 후보.\n *\n * @typedef {object} BullseyeCandidate\n * @property {Point} center      영상에서의 중심\n * @property {number} cellSize   영상 픽셀 단위의 셀 크기 s (밴드 폭 = √13/6·s 에서 역산)\n * @property {number} score      0..1, 높을수록 좋음. 비교 가능해야 한다.\n * @property {object} bands      밴드별 측정 요약(진단용). 형태는 검출기 자유.\n * @property {boolean} hardChecksPassed  설계 §6.4 의 hard check 통과 여부\n */\n\n/**\n * 격자 가설 하나. 앵커 탐색이 만들고 bootstrap 이 평가한다.\n *\n * @typedef {object} GridHypothesis\n * @property {'hex'|'tri'|'cube'} family\n * @property {number} [k]          Type O/A 격자 반경\n * @property {number} [n]          Type Y 면별 모듈 수\n * @property {0|1|2} orientation   120° 회전 가설 인덱스\n * @property {boolean} centerQr    중앙 QR 변형 여부\n * @property {Point[]} [anchors]   Type O/A 앵커 3점(영상 좌표)\n * @property {Point[]} [vertices]  Type Y 육각 외곽 6점(영상 좌표)\n * @property {Point[]} [seamVertices] Type Y Y-심에서 뻗는 외곽 3점(영상 좌표)\n * @property {Homography} H        canonical Euclidean → image pixel\n * @property {'hex-euclidean-unit-cell'} canonicalSpace\n * @property {number} geometryResidual  재투영 잔차(픽셀). 낮을수록 좋음.\n */\n\n/**\n * 한 면의 표본 통계. **median 만으로는 신뢰도를 알 수 없어** MAD 와 표본 수를 함께 낸다\n * (설계 §9.3 · §13 의 `sampleHexCell` 계약).\n *\n * @typedef {object} FaceSample\n * @property {number} median  0..1\n * @property {number} mad     median absolute deviation\n * @property {number} count   원판 안에 든 픽셀 수\n */\n\n/**\n * 셀 하나의 세 면 표본 + 순위 신뢰도.\n *\n * @typedef {object} CellSample\n * @property {FaceSample} T\n * @property {FaceSample} L\n * @property {FaceSample} R\n * @property {number} separation  세 median 중 인접 간격의 **최솟값** (Δ). 클수록 안전.\n * @property {boolean} tie        strict 순서가 성립하지 않으면 true (동률·근접동률)\n */\n\n/** 앞단 실패 코드. 후단(`decode.js`)의 reason 과 이름이 겹치지 않게 접두어를 둔다. */\nexport const FRONTEND_FAILURE = Object.freeze({\n  EMPTY_INPUT: 'frontend:empty-input',\n  LUMA_DEGENERATE: 'frontend:luma-degenerate',\n  NO_FINDER: 'frontend:no-finder',\n  FAMILY_AMBIGUOUS: 'frontend:family-ambiguous',\n  NO_ANCHORS: 'frontend:no-anchors',\n  HOMOGRAPHY_DEGENERATE: 'frontend:homography-degenerate',\n  NO_GRID_HYPOTHESIS: 'frontend:no-grid-hypothesis',\n  SYMBOL_CLIPPED: 'frontend:symbol-clipped',\n  SAMPLE_STARVED: 'frontend:sample-starved',\n  REFERENCE_MISMATCH: 'frontend:reference-mismatch',\n  NO_FORMAT_CANDIDATE: 'frontend:no-format-candidate',\n});\n\n/** 성공/실패 반환의 공통 생성자 — 모듈마다 다른 모양을 만들지 않게 한다. */\nexport function ok(value) {\n  return { ok: true, ...value };\n}\n\n/** @param {string} reason @param {object} [detail] */\nexport function fail(reason, detail) {\n  return detail === undefined ? { ok: false, reason } : { ok: false, reason, detail };\n}\n\n/**\n * LumaField 불변식 검사. 통합 시점의 \"조용한 어긋남\" 을 막는 최소 가드다 —\n * 길이가 맞지 않는 필드는 샘플링 단계에서 엉뚱한 픽셀을 읽고, 그 증상은\n * \"복호가 가끔 실패한다\" 로만 보인다.\n */\nexport function assertLumaField(luma) {\n  if (!luma || typeof luma !== 'object') throw new TypeError('LumaField 가 아니다');\n  const { width, height, data } = luma;\n  if (!Number.isInteger(width) || width <= 0) throw new RangeError(`width 가 양의 정수가 아니다: ${width}`);\n  if (!Number.isInteger(height) || height <= 0) throw new RangeError(`height 가 양의 정수가 아니다: ${height}`);\n  if (!(data instanceof Float32Array)) throw new TypeError('data 는 Float32Array 여야 한다');\n  if (data.length !== width * height) {\n    throw new RangeError(`data 길이 ${data.length} 가 width*height ${width * height} 와 다르다`);\n  }\n  return luma;\n}\n\n/** Homography 불변식 검사. 길이 9 · 전부 유한 · 마지막 원소 0 아님(정규화 가능). */\nexport function assertHomography(H) {\n  if (!(H instanceof Float64Array) || H.length !== 9) {\n    throw new TypeError('Homography 는 길이 9 의 Float64Array 여야 한다 (row-major, canonical Euclidean→image pixel)');\n  }\n  for (let i = 0; i < 9; i += 1) {\n    if (!Number.isFinite(H[i])) throw new RangeError(`H[${i}] 가 유한하지 않다: ${H[i]}`);\n  }\n  return H;\n}\n"],
  ["/src/decoder/homography.js", "/**\n * homography.js — canonical 격자 평면에서 image 픽셀 평면으로의 3x3 변환.\n *\n * 모든 H는 row-major이며 canonical -> image 방향이다. 4점 해는 canonical 격자\n * 단위와 픽셀 단위가 수십~수천 배 차이날 수 있으므로 Hartley 정규화 뒤에 푼다.\n * 정규화를 생략하면 정상적인 원근 입력도 pivot 크기 차이만으로 퇴화처럼 보일 수\n * 있다.\n *\n * @module decoder/homography\n */\n\nimport { assertHomography, assertLumaField } from '__TLSCAN_BLOB_002__';\n\n// [미검증] M1 calibration 에서 확정: 설계 §8.2가 제안한 정규화 선형계 pivot 하한이다.\nexport const MIN_NORMALIZED_PIVOT_RATIO = 1e-10;\n\n// [미검증] M1 calibration 에서 확정: 설계 §8.2가 제안한 homogeneous denominator 하한이다.\nexport const PROJECTIVE_DENOMINATOR_MIN_RATIO = 1e-8;\n\n// [미검증] M1 calibration 에서 확정: 중복 대응점으로 볼 상대 거리 하한이다.\nexport const MIN_POINT_SEPARATION_RATIO = 1e-10;\n\n// [미검증] M1 calibration 에서 확정: 세 점 공선 판정의 상대 면적 하한이다.\nexport const MIN_TRIANGLE_AREA_RATIO = 1e-10;\n\n// [미검증] M1 calibration 에서 확정: 4점 해의 재투영 잔차 상대 상한이다.\nexport const MAX_FOUR_POINT_REPROJECTION_ERROR_RATIO = 1e-8;\n\n// [미검증] M1 calibration 에서 확정: 3x3 역행렬 determinant 상대 하한이다.\nexport const MIN_INVERSE_DETERMINANT_RATIO = 1e-12;\n\n// [미검증] M1 calibration 에서 확정: H[8] gauge로 재정규화할 수 있는 하한이다.\nexport const HOMOGRAPHY_GAUGE_MIN_RATIO = 1e-12;\n\n// [미검증] M1 calibration 에서 확정: photometric coordinate descent의 고정 반복 횟수다.\nexport const PHOTOMETRIC_REFINEMENT_ITERATIONS = 3;\n\n// [미검증] M1 calibration 에서 확정: 8개 H 파라미터를 흔드는 초기 상대 보폭이다.\nexport const PHOTOMETRIC_REFINEMENT_STEP = 1e-3;\n\n/**\n * @param {unknown} points\n * @returns {{x:number, y:number}[] | null}\n */\nfunction readFourPoints(points) {\n  if (!points || typeof points.length !== 'number' || points.length !== 4) return null;\n  const output = [];\n  for (let i = 0; i < 4; i += 1) {\n    const point = points[i];\n    if (\n      !point\n      || typeof point !== 'object'\n      || !Number.isFinite(point.x)\n      || !Number.isFinite(point.y)\n    ) {\n      return null;\n    }\n    output.push({ x: point.x, y: point.y });\n  }\n  return output;\n}\n\n/**\n * @param {{x:number, y:number}[]} points\n * @returns {number}\n */\nfunction pointExtent(points) {\n  let minX = Infinity;\n  let minY = Infinity;\n  let maxX = -Infinity;\n  let maxY = -Infinity;\n  for (const point of points) {\n    minX = Math.min(minX, point.x);\n    minY = Math.min(minY, point.y);\n    maxX = Math.max(maxX, point.x);\n    maxY = Math.max(maxY, point.y);\n  }\n  return Math.max(maxX - minX, maxY - minY);\n}\n\n/**\n * 4점 homography의 유일성 조건은 각 점 집합에 중복이 없고 어떤 세 점도\n * 공선이 아닌 것이다. 전체 네 점만 검사하면 세 점 공선인 약한 퇴화를 놓친다.\n * @param {{x:number, y:number}[]} points\n * @returns {boolean}\n */\nfunction isGeneralPosition(points) {\n  const extent = pointExtent(points);\n  if (!Number.isFinite(extent) || extent <= 0) return false;\n\n  const minSeparation = MIN_POINT_SEPARATION_RATIO * extent;\n  const minSeparationSquared = minSeparation * minSeparation;\n  for (let i = 0; i < points.length; i += 1) {\n    for (let j = i + 1; j < points.length; j += 1) {\n      const dx = points[i].x - points[j].x;\n      const dy = points[i].y - points[j].y;\n      if (dx * dx + dy * dy <= minSeparationSquared) return false;\n    }\n  }\n\n  const minDoubleArea = MIN_TRIANGLE_AREA_RATIO * extent * extent;\n  for (let i = 0; i < points.length; i += 1) {\n    for (let j = i + 1; j < points.length; j += 1) {\n      for (let k = j + 1; k < points.length; k += 1) {\n        const abx = points[j].x - points[i].x;\n        const aby = points[j].y - points[i].y;\n        const acx = points[k].x - points[i].x;\n        const acy = points[k].y - points[i].y;\n        const doubleArea = Math.abs(abx * acy - aby * acx);\n        if (doubleArea <= minDoubleArea) return false;\n      }\n    }\n  }\n  return true;\n}\n\n/**\n * Hartley normalization: centroid를 원점으로 옮기고 평균 거리를 sqrt(2)로 만든다.\n * source와 destination을 각각 정규화해 DLT의 계수 크기를 같은 차수로 맞춘다.\n * @param {{x:number, y:number}[]} points\n * @returns {{points:{x:number,y:number}[], transform:Float64Array, inverse:Float64Array} | null}\n */\nfunction hartleyNormalize(points) {\n  let centerX = 0;\n  let centerY = 0;\n  for (const point of points) {\n    centerX += point.x;\n    centerY += point.y;\n  }\n  centerX /= points.length;\n  centerY /= points.length;\n\n  let distanceSum = 0;\n  for (const point of points) {\n    const dx = point.x - centerX;\n    const dy = point.y - centerY;\n    distanceSum += Math.sqrt(dx * dx + dy * dy);\n  }\n  const meanDistance = distanceSum / points.length;\n  if (!Number.isFinite(meanDistance) || meanDistance <= 0) return null;\n\n  const scale = Math.SQRT2 / meanDistance;\n  if (!Number.isFinite(scale) || scale <= 0) return null;\n\n  return {\n    points: points.map((point) => ({\n      x: scale * (point.x - centerX),\n      y: scale * (point.y - centerY),\n    })),\n    transform: new Float64Array([\n      scale, 0, -scale * centerX,\n      0, scale, -scale * centerY,\n      0, 0, 1,\n    ]),\n    inverse: new Float64Array([\n      1 / scale, 0, centerX,\n      0, 1 / scale, centerY,\n      0, 0, 1,\n    ]),\n  };\n}\n\n/**\n * row-major 3x3 행렬 곱.\n * @param {Float64Array} left\n * @param {Float64Array} right\n * @returns {Float64Array}\n */\nfunction multiply3(left, right) {\n  const output = new Float64Array(9);\n  for (let row = 0; row < 3; row += 1) {\n    for (let column = 0; column < 3; column += 1) {\n      let value = 0;\n      for (let inner = 0; inner < 3; inner += 1) {\n        value += left[row * 3 + inner] * right[inner * 3 + column];\n      }\n      output[row * 3 + column] = value;\n    }\n  }\n  return output;\n}\n\n/**\n * DLT의 h33=1 gauge로 만든 8x8 선형계를 deterministic partial pivot\n * Gauss-Jordan elimination으로 푼다. 동률에서 먼저 만난 행을 유지하므로\n * 브라우저마다 pivot 선택이 달라지지 않는다.\n * @param {number[][]} rows\n * @param {number[]} rhs\n * @returns {Float64Array | null}\n */\nfunction solveLinearSystem8(rows, rhs) {\n  const augmented = rows.map((row, index) => {\n    const output = new Float64Array(9);\n    for (let column = 0; column < 8; column += 1) output[column] = row[column];\n    output[8] = rhs[index];\n    return output;\n  });\n\n  let coefficientScale = 0;\n  for (const row of augmented) {\n    for (let column = 0; column < 8; column += 1) {\n      coefficientScale = Math.max(coefficientScale, Math.abs(row[column]));\n    }\n  }\n  if (!Number.isFinite(coefficientScale) || coefficientScale === 0) return null;\n  const minPivot = MIN_NORMALIZED_PIVOT_RATIO * coefficientScale;\n\n  for (let column = 0; column < 8; column += 1) {\n    let pivotRow = column;\n    let pivotAbs = Math.abs(augmented[column][column]);\n    for (let row = column + 1; row < 8; row += 1) {\n      const candidateAbs = Math.abs(augmented[row][column]);\n      if (candidateAbs > pivotAbs) {\n        pivotAbs = candidateAbs;\n        pivotRow = row;\n      }\n    }\n    if (!Number.isFinite(pivotAbs) || pivotAbs <= minPivot) return null;\n\n    if (pivotRow !== column) {\n      const temporary = augmented[column];\n      augmented[column] = augmented[pivotRow];\n      augmented[pivotRow] = temporary;\n    }\n\n    const pivot = augmented[column][column];\n    for (let index = column; index <= 8; index += 1) augmented[column][index] /= pivot;\n\n    for (let row = 0; row < 8; row += 1) {\n      if (row === column) continue;\n      const factor = augmented[row][column];\n      if (factor === 0) continue;\n      for (let index = column; index <= 8; index += 1) {\n        augmented[row][index] -= factor * augmented[column][index];\n      }\n    }\n  }\n\n  const solution = new Float64Array(8);\n  for (let index = 0; index < 8; index += 1) {\n    if (!Number.isFinite(augmented[index][8])) return null;\n    solution[index] = augmented[index][8];\n  }\n  return solution;\n}\n\n/**\n * @param {Float64Array} H\n * @returns {number}\n */\nfunction matrixMaxAbs(H) {\n  let maximum = 0;\n  for (let i = 0; i < H.length; i += 1) maximum = Math.max(maximum, Math.abs(H[i]));\n  return maximum;\n}\n\n/**\n * H[8]=1 gauge로 통일한다. 4점 함수의 canonical 원점은 유한 image 점으로\n * 가므로 정상 Type O 가설은 이 gauge를 사용할 수 있다.\n * @param {Float64Array} H\n * @returns {Float64Array | null}\n */\nfunction normalizeHomographyGauge(H) {\n  const scale = matrixMaxAbs(H);\n  if (!Number.isFinite(scale) || scale === 0) return null;\n  if (Math.abs(H[8]) <= HOMOGRAPHY_GAUGE_MIN_RATIO * scale) return null;\n\n  const output = new Float64Array(9);\n  for (let i = 0; i < 9; i += 1) {\n    output[i] = H[i] / H[8];\n    if (!Number.isFinite(output[i])) return null;\n  }\n  return output;\n}\n\n/**\n * @param {unknown} H\n * @returns {H is Float64Array}\n */\nfunction isFiniteHomography(H) {\n  if (!(H instanceof Float64Array) || H.length !== 9) return false;\n  for (let i = 0; i < 9; i += 1) {\n    if (!Number.isFinite(H[i])) return false;\n  }\n  return true;\n}\n\n/**\n * w를 나누기 전에 검사하는 내부 투영. denominator의 세 항 합을 기준으로\n * 상대 판정해, 큰 projective 항의 상쇄로 생기는 사실상 무한대 투영을 막는다.\n * @param {Float64Array} H\n * @param {{x:number,y:number}} point\n * @returns {{x:number,y:number} | null}\n */\nfunction projectPointSafely(H, point) {\n  const { x, y } = point;\n  const denominator = H[6] * x + H[7] * y + H[8];\n  const denominatorScale = Math.abs(H[6] * x) + Math.abs(H[7] * y) + Math.abs(H[8]);\n  if (\n    !Number.isFinite(denominator)\n    || Math.abs(denominator) <= PROJECTIVE_DENOMINATOR_MIN_RATIO * denominatorScale\n  ) {\n    return null;\n  }\n\n  const imageX = (H[0] * x + H[1] * y + H[2]) / denominator;\n  const imageY = (H[3] * x + H[4] * y + H[5]) / denominator;\n  if (!Number.isFinite(imageX) || !Number.isFinite(imageY)) return null;\n  return { x: imageX, y: imageY };\n}\n\n/**\n * canonical -> image 4점 대응의 정확 homography를 구한다.\n *\n * @param {{x:number,y:number}[]} canonicalPoints\n * @param {{x:number,y:number}[]} imagePoints\n * @returns {Float64Array | null}\n */\nexport function estimateHomography4(canonicalPoints, imagePoints) {\n  const canonical = readFourPoints(canonicalPoints);\n  const image = readFourPoints(imagePoints);\n  if (canonical === null || image === null) return null;\n  if (!isGeneralPosition(canonical) || !isGeneralPosition(image)) return null;\n\n  const canonicalNormalized = hartleyNormalize(canonical);\n  const imageNormalized = hartleyNormalize(image);\n  if (canonicalNormalized === null || imageNormalized === null) return null;\n\n  const rows = [];\n  const rhs = [];\n  for (let i = 0; i < 4; i += 1) {\n    const source = canonicalNormalized.points[i];\n    const destination = imageNormalized.points[i];\n    rows.push([\n      source.x, source.y, 1,\n      0, 0, 0,\n      -destination.x * source.x, -destination.x * source.y,\n    ]);\n    rhs.push(destination.x);\n    rows.push([\n      0, 0, 0,\n      source.x, source.y, 1,\n      -destination.y * source.x, -destination.y * source.y,\n    ]);\n    rhs.push(destination.y);\n  }\n\n  const solved = solveLinearSystem8(rows, rhs);\n  if (solved === null) return null;\n\n  const normalizedH = new Float64Array([\n    solved[0], solved[1], solved[2],\n    solved[3], solved[4], solved[5],\n    solved[6], solved[7], 1,\n  ]);\n  const unnormalized = multiply3(\n    multiply3(imageNormalized.inverse, normalizedH),\n    canonicalNormalized.transform,\n  );\n  const H = normalizeHomographyGauge(unnormalized);\n  if (H === null) return null;\n\n  const imageScale = pointExtent(image);\n  let maxResidual = 0;\n  for (let i = 0; i < canonical.length; i += 1) {\n    const projected = projectPointSafely(H, canonical[i]);\n    if (projected === null) return null;\n    const dx = projected.x - image[i].x;\n    const dy = projected.y - image[i].y;\n    maxResidual = Math.max(maxResidual, Math.sqrt(dx * dx + dy * dy));\n  }\n  if (maxResidual / imageScale > MAX_FOUR_POINT_REPROJECTION_ERROR_RATIO) return null;\n\n  // contracts.js의 자료형 단언을 실제 생성 경로에도 적용한다.\n  assertHomography(H);\n  return H;\n}\n\n/**\n * H를 역방향 image -> canonical 변환으로 뒤집는다.\n * @param {Float64Array} H\n * @returns {Float64Array | null}\n */\nexport function invertHomography(H) {\n  if (!isFiniteHomography(H)) return null;\n\n  const [a, b, c, d, e, f, g, h, i] = H;\n  const inverseNumerators = new Float64Array([\n    e * i - f * h,\n    c * h - b * i,\n    b * f - c * e,\n    f * g - d * i,\n    a * i - c * g,\n    c * d - a * f,\n    d * h - e * g,\n    b * g - a * h,\n    a * e - b * d,\n  ]);\n  const determinant = a * inverseNumerators[0]\n    + b * inverseNumerators[3]\n    + c * inverseNumerators[6];\n  const determinantScale = Math.max(\n    Math.abs(a * inverseNumerators[0]),\n    Math.abs(b * inverseNumerators[3]),\n    Math.abs(c * inverseNumerators[6]),\n  );\n  if (\n    !Number.isFinite(determinant)\n    || determinantScale === 0\n    || Math.abs(determinant) <= MIN_INVERSE_DETERMINANT_RATIO * determinantScale\n  ) {\n    return null;\n  }\n\n  const inverse = new Float64Array(9);\n  for (let index = 0; index < 9; index += 1) {\n    inverse[index] = inverseNumerators[index] / determinant;\n    if (!Number.isFinite(inverse[index])) return null;\n  }\n\n  // 역행렬의 H[8]가 0에 가까운 유효 projective 경우도 수학적으로는 존재한다.\n  // 그 경우에는 scale을 강제하지 않고, 가능할 때만 일반적인 H[8]=1 gauge로 돌린다.\n  const normalized = normalizeHomographyGauge(inverse);\n  const result = normalized === null ? inverse : normalized;\n  assertHomography(result);\n  return result;\n}\n\n/**\n * canonical 점 하나를 image로 투영한다. w가 0 또는 상대적으로 너무 작으면\n * 무한대 근처의 숫자를 만들어 내지 않고 null을 반환한다.\n * @param {Float64Array} H\n * @param {{x:number,y:number}} point\n * @returns {{x:number,y:number} | null}\n */\nexport function projectPoint(H, point) {\n  if (\n    !isFiniteHomography(H)\n    || !point\n    || typeof point !== 'object'\n    || !Number.isFinite(point.x)\n    || !Number.isFinite(point.y)\n  ) {\n    return null;\n  }\n  return projectPointSafely(H, point);\n}\n\n/**\n * score callback 반환을 숫자로 정규화한다. callback 오류는 한 후보의 무효 점수로\n * 취급해 앞단이 예외로 탈출하지 않게 한다.\n * @param {Function} score\n * @param {object} luma\n * @param {Float64Array} H\n * @param {object} hypothesis\n * @returns {number}\n */\nfunction evaluatePhotometricScore(score, luma, H, hypothesis) {\n  try {\n    const value = score(luma, H, hypothesis);\n    const numeric = typeof value === 'number' ? value : value && value.score;\n    return Number.isFinite(numeric) ? numeric : Number.NEGATIVE_INFINITY;\n  } catch {\n    return Number.NEGATIVE_INFINITY;\n  }\n}\n\n/**\n * 불스아이 6-band와 앵커 측정은 검출/앵커 레인이 소유한다. 이 함수는 그들이\n * 제공하는 score(luma, H, hypothesis)로만 H를 보정해, 서로 다른 파인더 템플릿을\n * 이 모듈에 다시 구현하지 않는다.\n *\n * 각 반복에서 현재 H와 8개 자유 파라미터의 +/- 후보를 모두 채점한 뒤 최고점을\n * 고른다. score 동률은 현재 H -> 낮은 parameter index -> 음수 방향 순서로\n * 고정되며, 첫 성공을 채택하지 않는다.\n *\n * @param {import('__TLSCAN_BLOB_002__').LumaField} luma\n * @param {object & {H: Float64Array}} hypothesis\n * @param {{score?:(luma:object,H:Float64Array,hypothesis:object)=>number|{score:number}, iterations?:number, step?:number}} [options]\n * @returns {object | null}\n */\nexport function refineHomographyPhotometric(luma, hypothesis, options = {}) {\n  if (!hypothesis || typeof hypothesis !== 'object' || !isFiniteHomography(hypothesis.H)) {\n    return null;\n  }\n  if (options === null || typeof options !== 'object') return null;\n\n  const initial = normalizeHomographyGauge(hypothesis.H);\n  if (initial === null) return null;\n  const score = options.score;\n  if (score === undefined) {\n    // 아직 검출기가 score 계약을 공급하지 않은 통합 순서에서도 H를 바꾸지 않는다.\n    return { ...hypothesis, H: initial };\n  }\n  if (typeof score !== 'function') return null;\n\n  try {\n    assertLumaField(luma);\n  } catch {\n    return null;\n  }\n\n  const iterations = options.iterations === undefined\n    ? PHOTOMETRIC_REFINEMENT_ITERATIONS\n    : options.iterations;\n  const step = options.step === undefined ? PHOTOMETRIC_REFINEMENT_STEP : options.step;\n  if (!Number.isInteger(iterations) || iterations < 0 || !Number.isFinite(step) || step <= 0) {\n    return null;\n  }\n\n  let bestH = initial;\n  let bestScore = evaluatePhotometricScore(score, luma, bestH, hypothesis);\n\n  for (let iteration = 0; iteration < iterations; iteration += 1) {\n    const candidates = [{ H: bestH, order: 0 }];\n    let order = 1;\n    for (let parameter = 0; parameter < 8; parameter += 1) {\n      const magnitude = Math.max(1, Math.abs(bestH[parameter]));\n      for (const direction of [-1, 1]) {\n        const candidate = new Float64Array(bestH);\n        candidate[parameter] += direction * step * magnitude;\n        const normalized = normalizeHomographyGauge(candidate);\n        if (normalized !== null) candidates.push({ H: normalized, order });\n        order += 1;\n      }\n    }\n\n    let chosenH = bestH;\n    let chosenScore = bestScore;\n    for (const candidate of candidates) {\n      const candidateScore = evaluatePhotometricScore(score, luma, candidate.H, hypothesis);\n      if (candidateScore > chosenScore) {\n        chosenH = candidate.H;\n        chosenScore = candidateScore;\n      }\n    }\n    bestH = chosenH;\n    bestScore = chosenScore;\n  }\n\n  return {\n    ...hypothesis,\n    H: bestH,\n    photometricScore: bestScore,\n  };\n}\n"],
  ["/src/formatinfo.js", "// formatinfo.js — 포맷 정보: CRC-6 + 12bit ↔ 5digit 변환 + 고정 마스크 + 3중 복제 다수결 (SPEC §5.4)\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 배경 — SPEC §13 TBD 2건을 이 모듈이 확정한다\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 포맷 정보 내용(§5.4): 버전 인덱스 4bit + ECC 레벨 2bit + CRC 6bit = 12bit.\n// 채널이 보는 것은 **digit** 이므로(불스아이 인접 링에 5심볼씩 3중 복제·다수결 판독),\n// CRC 다항식 선정은 bit 도메인이 아니라 **digit 도메인 전쌍 최소 해밍 거리**를\n// 1순위로 삼는다. 64개 유효 페이로드(6bit) 전수에 대해 5개 표준 후보를 전수 비교한\n// 결과는 이 파일 하단 주석 [측정표]에 있다 — 선정 근거가 회귀 테스트로 보호된다\n// (formatinfo.test.js 가 SELECTED_MIN_DIGIT_DISTANCE 를 고정 상수로 단언).\n//\n// **선정 결과: CRC-6/CDMA2000-B (poly 0x07)**.\n//   1순위(digit 최소 거리) 동률 2건 — CRC-6/ITU(0x03) 와 CRC-6/CDMA2000-B(0x07),\n//   둘 다 digit 최소 거리 2. 2순위(bit 최소 거리)로 갈라짐 — CDMA2000-B 는 4,\n//   ITU 는 3. CDMA2000-B 승.\n//\n// CRC 계산 규약: **비반사(non-reflected), MSB-first, init=0, xorout=0**, 6bit\n// 메시지 뒤에 6bit 0 을 붙여 나눈 것과 동일한 표준 bit-serial 나눗셈. 여기서\n// \"CRC-6/CDMA2000-B\" 라는 이름은 다항식 상수(0x07)의 출처 식별자일 뿐, refin/refout\n// 까지 포함한 외부 표준과의 bit-exact 호환을 주장하지 않는다 — 이 필드는 이 포맷\n// 안에서만 왕복하면 되는 폐쇄 채널이다.\n\n// ── 페이로드 필드 폭 ─────────────────────────────────────────────────────────\n\n/** 버전 인덱스 필드 폭 (bit). */\nexport const VERSION_BITS = 4;\n\n/** ECC 레벨 필드 폭 (bit). */\nexport const ECC_BITS = 2;\n\n/** 페이로드(버전+ECC) 폭 (bit). 유효 워드 2^6 = 64개. */\nexport const PAYLOAD_BITS = VERSION_BITS + ECC_BITS; // 6\n\n/** CRC 폭 (bit). */\nexport const CRC_BITS = 6;\n\n/** 코드워드(페이로드+CRC) 폭 (bit). */\nexport const CODEWORD_BITS = PAYLOAD_BITS + CRC_BITS; // 12\n\n/** 5-digit(base-6) 로 표현 가능한 상태 수. 6^5 = 7776 >= 2^12 = 4096 이 성립해야 한다. */\nexport const DIGIT_COUNT = 5;\n\n/** digit 1개의 알파벳 크기 (base-6, SPEC §4.1 과 동일 채널). */\nexport const DIGIT_BASE = 6;\n\n// 모듈 로드 시 1회 자기검증: 6^5 >= 2^12.\n(() => {\n  const capacity = DIGIT_BASE ** DIGIT_COUNT;\n  const need = 2 ** CODEWORD_BITS;\n  if (capacity < need) {\n    throw new Error(`자기검증 실패: ${DIGIT_BASE}^${DIGIT_COUNT}=${capacity} < 2^${CODEWORD_BITS}=${need}`);\n  }\n})();\n\n/** ECC 레벨 열거값. 3(예약)은 인코더가 거부하고 디코더는 ok:false 로 처리한다 (SPEC §6). */\nexport const ECC_LEVEL = Object.freeze({ L: 0, M: 1, H: 2, RESERVED: 3 });\n\n// ── CRC-6 — 선정된 다항식 (측정표는 파일 하단) ──────────────────────────────\n\n/** 선정된 CRC-6 다항식 (CRC-6/CDMA2000-B, 6bit, 암묵적 최상위 항 제외). */\nexport const CRC_POLY = 0x07;\n\n/** 선정 근거로 고정하는 회귀 상수 — digit 도메인 전쌍 최소 해밍 거리 (64 코드워드). */\nexport const SELECTED_MIN_DIGIT_DISTANCE = 2;\n\n/** 선정 근거로 고정하는 회귀 상수 — bit 도메인 전쌍 최소 해밍 거리 (12bit, 64 코드워드). */\nexport const SELECTED_MIN_BIT_DISTANCE = 4;\n\n/**\n * 표준 비반사 bit-serial CRC. `dataBits` 하위 `dataLen` bit 뒤에 `n` bit 의 0 을\n * 붙여 나눈 것과 동치인 결과를 낸다(명시적 패딩 없이 레지스터 shift 만으로 계산).\n * @param {number} dataBits 메시지 (하위 dataLen bit 사용)\n * @param {number} dataLen 메시지 폭 (bit)\n * @param {number} poly 생성 다항식 (n bit, 암묵적 최상위 항 제외)\n * @param {number} n CRC 폭 (bit)\n * @returns {number} CRC 값 (0..2^n − 1)\n */\nexport function crcCompute(dataBits, dataLen, poly, n) {\n  const mask = (1 << n) - 1;\n  let reg = 0;\n  for (let i = dataLen - 1; i >= 0; i -= 1) {\n    const inBit = (dataBits >> i) & 1;\n    const msb = (reg >> (n - 1)) & 1;\n    reg = ((reg << 1) | inBit) & mask;\n    if (msb) reg ^= poly;\n  }\n  for (let i = 0; i < n; i += 1) {\n    const msb = (reg >> (n - 1)) & 1;\n    reg = (reg << 1) & mask;\n    if (msb) reg ^= poly;\n  }\n  return reg;\n}\n\n/**\n * 선정된 다항식으로 6bit 페이로드의 CRC-6 을 계산한다.\n * @param {number} payload6 0..63\n * @returns {number} 0..63\n */\nexport function crc6(payload6) {\n  if (!Number.isInteger(payload6) || payload6 < 0 || payload6 >= (1 << PAYLOAD_BITS)) {\n    throw new RangeError(`페이로드는 0..${(1 << PAYLOAD_BITS) - 1}: ${payload6}`);\n  }\n  return crcCompute(payload6, PAYLOAD_BITS, CRC_POLY, CRC_BITS);\n}\n\n// ── 12bit ↔ 5digit (base-6, MSD-first) ──────────────────────────────────────\n\n/**\n * 0..4095 → 5-digit(base-6, MSD-first). §13 TBD \"12bit → 5심볼 변환 규약\" 확정.\n * @param {number} value 0..(6^5 − 1) 범위까지 허용(4096..7775 는 코드워드 도메인\n *   밖이지만 디코더가 마스크 해제 후 범위검사를 하려면 변환 자체는 열려 있어야 한다).\n * @returns {number[]} 길이 5, 각 원소 0..5\n */\nexport function toDigits5(value) {\n  const max = DIGIT_BASE ** DIGIT_COUNT;\n  if (!Number.isInteger(value) || value < 0 || value >= max) {\n    throw new RangeError(`값 범위 위반: ${value} (허용 0..${max - 1})`);\n  }\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let v = value;\n  for (let i = DIGIT_COUNT - 1; i >= 0; i -= 1) {\n    digits[i] = v % DIGIT_BASE;\n    v = Math.floor(v / DIGIT_BASE);\n  }\n  return digits;\n}\n\n/**\n * 5-digit(base-6, MSD-first) → 0..7775. `toDigits5` 의 역함수.\n * @param {number[]} digits 길이 5, 각 원소 0..5\n * @returns {number}\n */\nexport function fromDigits5(digits) {\n  assertDigits5(digits);\n  let v = 0;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) v = v * DIGIT_BASE + digits[i];\n  return v;\n}\n\nfunction assertDigits5(digits) {\n  if (!digits || typeof digits.length !== 'number' || digits.length !== DIGIT_COUNT) {\n    throw new TypeError(`digits 는 길이 ${DIGIT_COUNT} 배열이어야 한다`);\n  }\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const d = digits[i];\n    if (!Number.isInteger(d) || d < 0 || d >= DIGIT_BASE) {\n      throw new RangeError(`digit 범위 위반 (위치 ${i}): ${d} (허용 0..${DIGIT_BASE - 1})`);\n    }\n  }\n}\n\n// ── 고정 출력 마스크 ─────────────────────────────────────────────────────────\n//\n// 유도 과정(매직넘버 금지 — SPEC 요구): 전부 0 페이로드(버전=0, ECC=0)의 CRC 도\n// 0 이므로 마스크가 없으면 코드워드=0, 5digit=[0,0,0,0,0] → 균일 패치로 렌더된다.\n// 마스크 상수는 **이미 선정된 CRC_POLY 하나에서만** 유도한다(새 독립 상수 도입 금지):\n// CRC_POLY(6bit, 0x07)를 12bit 폭으로 두 번 이어붙인 값 (POLY<<6 | POLY) 을\n// 코드워드와 같은 5digit 변환기에 통과시킨 것이 마스크다. POLY 를 그대로 상위\n// 6bit 에 반복해 쓰는 이유는, POLY 한 번만으로는 상위 6bit(=페이로드 폭)가 0으로\n// 남아 5digit 중 앞쪽 자리가 여전히 0에 치우치기 때문 — 반복으로 12bit 전역에\n// CRC_POLY 유래 비트를 퍼뜨린다.\n//\n// 이 마스크는 §4.3 데이터 마스크와 무관한 **별도 상수**다 — 포맷 셀은 데이터\n// 마스크 대상이 아니다(SPEC §5.4 주석).\n\nconst MASK_SEED_12BIT = (CRC_POLY << CRC_BITS) | CRC_POLY;\n\n/** 고정 출력 마스크 (5digit, mod-6 가산). CRC_POLY 유래 — 별도 매직넘버 아님. */\nexport const MASK_DIGITS = Object.freeze(toDigits5(MASK_SEED_12BIT));\n\n/**\n * 5digit 에 고정 마스크를 mod-6 가산한다(인코더 방향).\n * @param {number[]} digits 길이 5\n * @returns {number[]} 길이 5, 마스크 적용됨\n */\nexport function applyMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d + MASK_DIGITS[i]) % DIGIT_BASE);\n}\n\n/**\n * 마스크를 해제한다(디코더 방향). `applyMask` 의 역함수.\n * @param {number[]} digits 길이 5, 마스크 적용된 상태\n * @returns {number[]} 길이 5, 마스크 해제됨\n */\nexport function removeMask(digits) {\n  assertDigits5(digits);\n  return digits.map((d, i) => (d - MASK_DIGITS[i] + DIGIT_BASE) % DIGIT_BASE);\n}\n\n// ── 인코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * {version, eccLevel} → 5digit(base-6, 마스크 적용됨). 이 값을 3곳(120° 간격)에\n * 동일하게 반복 배치하는 것이 §5.4 의 \"3중 복제\" — 배치(레이아웃)는 이 모듈의\n * 소관이 아니라 호출측(hexgrid.js 사용부)의 몫이다.\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[]} 길이 5\n */\nexport function encode({ version, eccLevel }) {\n  if (!Number.isInteger(version) || version < 0 || version >= (1 << VERSION_BITS)) {\n    throw new RangeError(`버전은 0..${(1 << VERSION_BITS) - 1}: ${version}`);\n  }\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    throw new RangeError('ECC 레벨 3(예약값)은 인코더가 거부한다');\n  }\n  if (!Number.isInteger(eccLevel) || eccLevel < 0 || eccLevel >= (1 << ECC_BITS)) {\n    throw new RangeError(`ECC 레벨은 0..${(1 << ECC_BITS) - 1}: ${eccLevel}`);\n  }\n  const payload = (version << ECC_BITS) | eccLevel;\n  const crc = crc6(payload);\n  const codeword = (payload << CRC_BITS) | crc;\n  return applyMask(toDigits5(codeword));\n}\n\n/**\n * `encode` 결과를 3개의 동일한 복제로 반환한다(테스트/편의용 — 실제 위치는\n * 레이아웃 소관).\n * @param {{version:number, eccLevel:number}} info\n * @returns {number[][]} 길이 3, 각 원소 길이 5\n */\nexport function encodeReplicated(info) {\n  const one = encode(info);\n  return [one.slice(), one.slice(), one.slice()];\n}\n\n// ── 디코더 ───────────────────────────────────────────────────────────────────\n\n/**\n * 마스크 적용된 5digit 1개를 단독으로 복호한다(다수결 없이).\n * @param {number[]} maskedDigits 길이 5\n * @returns {{version:number, eccLevel:number, ok:boolean}}\n */\nexport function decodeSingle(maskedDigits) {\n  assertDigits5(maskedDigits);\n  const unmasked = removeMask(maskedDigits);\n  const codeword = fromDigits5(unmasked); // 0..7775 (5digit 전체 상태)\n  if (codeword >= (1 << CODEWORD_BITS)) {\n    // 4096..7775 는 12bit 코드워드 도메인 밖 — digit 조합 자체가 무효.\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  const payload = codeword >> CRC_BITS;\n  const crcField = codeword & ((1 << CRC_BITS) - 1);\n  const version = payload >> ECC_BITS;\n  const eccLevel = payload & ((1 << ECC_BITS) - 1);\n  if (eccLevel === ECC_LEVEL.RESERVED) {\n    return { version, eccLevel, ok: false };\n  }\n  const expectedCrc = crc6(payload);\n  if (expectedCrc !== crcField) {\n    return { version: 0, eccLevel: 0, ok: false };\n  }\n  return { version, eccLevel, ok: true };\n}\n\n/**\n * digit 위치별 다수결. 3개 읽기 중 2개 이상 일치하는 값을 채택한다.\n * @param {number[][]} reads 길이 3, 각 원소 길이 5\n * @returns {{digits:number[], hasMajority:boolean}} hasMajority 는 5자리 전부\n *   2표 이상 합의가 있었는지\n */\nexport function majorityVote(reads) {\n  if (!Array.isArray(reads) || reads.length !== 3) {\n    throw new TypeError('reads 는 길이 3 배열이어야 한다');\n  }\n  reads.forEach(assertDigits5);\n  const digits = new Array(DIGIT_COUNT).fill(0);\n  let hasMajority = true;\n  for (let i = 0; i < DIGIT_COUNT; i += 1) {\n    const counts = new Map();\n    for (const r of reads) counts.set(r[i], (counts.get(r[i]) ?? 0) + 1);\n    let bestVal = reads[0][i];\n    let bestCount = 0;\n    for (const [val, count] of counts) {\n      if (count > bestCount) {\n        bestCount = count;\n        bestVal = val;\n      }\n    }\n    if (bestCount < 2) hasMajority = false;\n    digits[i] = bestVal;\n  }\n  return { digits, hasMajority };\n}\n\n/**\n * 3중 복제 다수결 복호 (SPEC §5.4). 디코더 진입점.\n * 순서: ① dig
