  ["/src/layout.js", "// layout.js — 캐노니컬 scan order + 레이아웃 통합 파사드 (SPEC §4.2, §5.6, §13 T8)\n//\n// 인코더(T9)와 디코더(M1)가 공유하는 단일 진입점. \"어디에 무엇을 놓는가\"의 개별\n// 조각(앵커·포맷·레퍼런스·불스아이)은 placement.js/bullseye.js 가 이미 확정했다 —\n// 이 모듈은 그 위에 **데이터 셀의 순회 순서**(scan order)만 얹고, 소비자가\n// placement/bullseye 를 따로 import 하지 않도록 재-export 파사드를 겸한다.\n//\n// scan order 확정 설계 (통합자 확정, 이 파일이 유일한 구현):\n//   - ring-major 안→밖 (r = FORMAT_RING(3) .. k), 각 링은 `ringWalk(r)` 인덱스\n//     오름차순, **roleOf == 'data' 인 셀만** (앵커·포맷·레퍼런스·불스아이 스킵).\n//   - 근거: 새 규약 0개(ringWalk 재사용) · 결정성 자명 · 연속 3셀 = 1 심볼이\n//     공간적으로도 인접(버스트 → 심볼 집중 → 3t−2 보장과 정합) · 필러(마지막\n//     C mod 3 셀)가 최외곽 링 끝 = 가장자리.\n//   - 심볼 그룹: scan order 의 연속 3셀 (d₀,d₁,d₂) = 심볼 1개, §4.2 MSD-first 규약.\n//\n// 런타임 의존성 0 · ESM.\n\nimport { hexDistance } from '__TLSCAN_BLOB_008__';\nimport {\n  FORMAT_RING,\n  buildRoleSets,\n  roleOf,\n  ringWalk,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n  overheadBreakdown,\n} from '__TLSCAN_BLOB_019__';\nimport { occupiedCells } from '__TLSCAN_BLOB_009__';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 데이터 셀을 캐노니컬 scan order 로. ring-major 안→밖(r = 3..k), 각 링은\n * `ringWalk(r)` 인덱스 오름차순, role == 'data' 인 셀만.\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (예: k=6 → 82)\n */\nexport function dataCellsInScanOrder(k) {\n  assertRadius(k);\n  const roleSets = buildRoleSets(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) {\n    for (const cell of ringWalk(r)) {\n      if (roleOf(cell.q, cell.r, k, roleSets) === 'data') out.push(cell);\n    }\n  }\n  return out;\n}\n\n/**\n * scan order 의 연속 3셀씩 묶은 심볼 그룹. 그룹 내부 순서 = (d₀,d₁,d₂),\n * §4.2 MSD-first 규약 그대로. 마지막 C mod 3 개는 그룹에 들지 않고\n * `fillerCells` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]} 길이 = ⌊데이터 셀 수 / 3⌋\n */\nexport function symbolCellGroups(k) {\n  const scan = dataCellsInScanOrder(k);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order 의 마지막 (C mod 3) 개 (§5.6). 최외곽 링(k) 끝에 온다.\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCells(k) {\n  const scan = dataCellsInScanOrder(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → `placement.anchorCells(k)` 순서\n *   - format    → `placement.formatCells(k)` 순서\n *   - reference → `placement.referenceCellsAll(k)` 순서\n *   - data      → `dataCellsInScanOrder(k)` 순서 (= scan order 인덱스,\n *                 심볼 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는\n *                 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMap(k) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n  anchorCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n  referenceCellsAll(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n  dataCellsInScanOrder(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placement/bullseye 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOf,\n  overheadBreakdown,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\nexport { hexDistance };\n"],
  ["/src/placementA.js", "// placementA.js — Type A(삼각 실루엣) 영역·꼭짓점 앵커·패치 레퍼런스 배치\n// (ADR 0005 D1·D2·D4, docs/adr/0005_typeA_layout.md v1.1)\n//\n// Type A 는 육각 영역(반경 k)의 세 교대 방향에 삼각 코너 패치를 붙여 실루엣을\n// 정삼각형(△, 위 꼭짓점)으로 닫는 변형이다. 데이터 계약(§4.1 순위 3튜플·GF(211)·\n// §4.3 마스크)은 Type O 를 전부 승계하고 **레이아웃만** 확장한다.\n//\n// [D2 안 1 채택 — 무수정 공유 계약] 육각부의 역할 지도(앵커 3셀·포맷 15셀·레퍼런스\n// 2(k-2)셀)는 Type O 와 **바이트 동일**이다 — 이 모듈은 `placement.js`/`hexgrid.js`\n// 를 import 만 하고 절대 수정하지 않는다. 육각 코너 3셀 (0,0,5) 은 보조 앵커로\n// 그대로 남고, 꼭짓점 3셀이 주 앵커로 추가되어 앵커 총 6개가 된다.\n//\n// cube 좌표 (x,y,z) = (q, −q−r, r) 에서:\n//   영역 A(k)  = { x≤k ∧ y≤k ∧ z≤k } ⇔ axial q≤k ∧ r≤k ∧ q+r≥−k\n//   육각부     = 여기에 min(x,y,z)≥−k 를 더한 것 (= 기존 hexDistance≤k 와 전수 일치)\n//   패치       = 정확히 하나의 cube 좌표가 <−k 인 셀\n//     top(상단) 패치: r < −k (z < −k)\n//     BL(좌하) 패치:  q < −k (x < −k)\n//     BR(우하) 패치:  q+r > k (y < −k)\n// 세 패치는 `rotate120` 궤도(top → BR → BL)로 서로 사상된다 — placement.js 의\n// 120°/240° 회전(rhombille 이 갖는 유일한 비자명 대칭)을 그대로 재사용한다.\n//\n// 셀 수 검산: (3k+1)(3k+2)/2 — k=8 → 325 · k=10 → 496 (placementA.test.js 전수 검산).\n//\n// 런타임 의존성 0 · 순수 ESM.\n\nimport { hexDistance, regionCells } from '__TLSCAN_BLOB_008__';\nimport {\n  BULLSEYE_RADIUS,\n  REFERENCE_DIGIT,\n  ANCHOR_PRIMARY_DIGIT,\n  ANCHOR_SECONDARY_DIGIT,\n  FORMAT_RING,\n  rotate120,\n  rotate240,\n  ringWalk,\n  buildRoleSets,\n} from '__TLSCAN_BLOB_019__';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  // 육각부 재사용(placement.js/hexgrid.js)이 요구하는 최소 반경을 그대로 승계한다\n  // (FORMAT_RING=3 이 데이터 링이려면 앵커 링(k) 보다 작아야 한다). 패치 레퍼런스\n  // 링 공식(k+2 .. 2k-1)도 k≥3 만 있으면 성립하므로 이 하한이 더 좁혀 잡는다.\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 영역 정의 (D1)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 영역 A(k) 소속 판정 — cube 좌표 x,y,z ≤ k (⇔ axial q≤k ∧ r≤k ∧ −q−r≤k). */\nexport function isInRegionA(q, r, k) {\n  return q <= k && r <= k && (-q - r) <= k;\n}\n\n/**\n * 패치 판별 — 정확히 하나의 cube 좌표가 <−k 인 셀만 패치다. 호출자는 (q,r) 이\n * 이미 `isInRegionA(q,r,k)` 를 만족하는 셀임을 보장해야 한다(역할 분류·레퍼런스\n * arc 필터링 등 내부 소비처가 전부 그렇다) — 임의 좌표에 대한 독립 판정이 아니다.\n */\nexport function isTopPatch(q, r, k) {\n  return isInRegionA(q, r, k) && r < -k;\n}\n\nexport function isBLPatch(q, r, k) {\n  return isInRegionA(q, r, k) && q < -k;\n}\n\nexport function isBRPatch(q, r, k) {\n  return isInRegionA(q, r, k) && (q + r) > k;\n}\n\n/** 셀의 패치 소속 — 'top' | 'BL' | 'BR' | null(육각부 또는 영역 밖). */\nexport function patchOfA(q, r, k) {\n  if (!isInRegionA(q, r, k)) return null;\n  if (isTopPatch(q, r, k)) return 'top';\n  if (isBLPatch(q, r, k)) return 'BL';\n  if (isBRPatch(q, r, k)) return 'BR';\n  return null; // 육각부\n}\n\n// top 패치 셀 — 행 j=1..k (r=−k−j), 행 내 q∈[j,k], 오름차순 고정(레이아웃-무관\n// 원시 나열). scan order(T3)의 boustrophedon 은 layoutA.js 소관이라 여기서 다루지\n// 않는다 — placementA.js 는 \"무엇이 패치 셀인가\"만 답한다.\nfunction topPatchCellsAscending(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    for (let q = j; q <= k; q += 1) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 영역 A(k) 전 셀, 결정적 순서 — 육각부 `regionCells(k)` 접두 그대로 + 패치 셀\n * (top → BR(rotate120) → BL(rotate240), 각 패치 내부는 행 j=1..k 오름차순 q).\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 (3k+1)(3k+2)/2\n */\nexport function regionCellsA(k) {\n  assertRadius(k);\n  const hexPart = regionCells(k);\n  const top = topPatchCellsAscending(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...hexPart, ...top, ...br, ...bl];\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 꼭짓점 앵커 3셀 (D2)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 닫힌 형태: cube 좌표에서 두 개가 +k, 하나가 −2k 인 세 점.\n//   (k,−2k) 위 꼭짓점 · (k,k) 우하 꼭짓점 · (−2k,k) 좌하 꼭짓점\n// digit 규약(§5.2 승계): digit 5 = 위 꼭짓점 (Type A 명명 근거 △ 와 일치하는 방향\n// 기준점), 나머지 두 꼭짓점 = digit 0. rotate120 이 top→BR→BL 순으로 사상하므로\n// 이 배열 순서 자체가 그 궤도를 반영한다.\n\n/**\n * 삼각 꼭짓점 3셀과 digit 배정 (D2 주 앵커). 기존 육각 코너 앵커(`placement.\n * anchorCells(k)`, 보조 앵커로 유지)와 합쳐야 앵커 총 6개다 — 이 함수는 꼭짓점\n * 3개만 낸다.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function vertexAnchors(k) {\n  assertRadius(k);\n  return [\n    { q: k, r: -2 * k, digit: ANCHOR_PRIMARY_DIGIT }, // 위 꼭짓점\n    { q: k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, //     우하 꼭짓점 (BR)\n    { q: -2 * k, r: k, digit: ANCHOR_SECONDARY_DIGIT }, // 좌하 꼭짓점 (BL)\n  ];\n}\n\n/** 꼭짓점 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function vertexAnchorPositionSet(k) {\n  return new Set(vertexAnchors(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 패치 레퍼런스 셀 — 규칙 R (D4)\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 패치 링 ρ ∈ {k+2, k+5, k+8, …} (ρ ≤ 2k−1) 에서 top 패치 arc(**= ringWalk(ρ) 중\n// 영역 A(k) 내 top 패치 셀만** — [C7] 자문 정정: \"r_ax<−k 만\"으로는 영역 밖 셀이\n// 섞이는 구현 함정이 있었다. `isTopPatch` 가 이미 `isInRegionA` 를 내부에서\n// 검사하므로 이 필터 한 줄로 두 조건을 동시에 만족한다)의 **중앙 셀**\n// (⌊(len−1)/2⌋) 을 잡고 rotate120/240 으로 복제한다 — 링당 3개.\n//\n// 랩어라운드 무관: 대칭 복제라 arc 인덱스 산술이 top 패치에서만 필요하고,\n// top 패치는 ringWalk 순회에서 절대 인덱스 0/끝을 걸치지 않는다(경험적으로\n// [C7] 독립 재구현이 재확인 — placementA.test.js 가 KAT 좌표로 회귀 고정한다).\n\n/** 패치 레퍼런스가 사는 링 반경 목록 — k+2 부터 2k−1 까지 3씩. */\nexport function patchReferenceRings(k) {\n  assertRadius(k);\n  const rings = [];\n  for (let rho = k + 2; rho <= 2 * k - 1; rho += 3) rings.push(rho);\n  return rings;\n}\n\n/**\n * 패치 레퍼런스 셀 전부(규칙 R). 링마다 top arc 중앙 + rotate120(→BR) +\n * rotate240(→BL) 3개, digit 은 `REFERENCE_DIGIT`(placement.js §5.3 값 3 승계).\n * k=8 KAT: (5,−10)·(7,−13) + 회전상(총 6). k=10 KAT: (6,−12)·(8,−15)·(9,−18) +\n * 회전상(총 9). (placementA.test.js 가 좌표를 그대로 회귀 고정한다.)\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]}\n */\nexport function patchReferenceCells(k) {\n  assertRadius(k);\n  const out = [];\n  for (const rho of patchReferenceRings(k)) {\n    const arc = ringWalk(rho).filter((c) => isTopPatch(c.q, c.r, k));\n    if (arc.length === 0) {\n      throw new RangeError(`k=${k} rho=${rho}: 패치 레퍼런스 arc 가 비었다 — 규칙 R 전제 위반`);\n    }\n    const center = arc[Math.floor((arc.length - 1) / 2)];\n    const br = rotate120(center.q, center.r);\n    const bl = rotate240(center.q, center.r);\n    out.push({ q: center.q, r: center.r, digit: REFERENCE_DIGIT });\n    out.push({ q: br.q, r: br.r, digit: REFERENCE_DIGIT });\n    out.push({ q: bl.q, r: bl.r, digit: REFERENCE_DIGIT });\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 — 육각부(placement.js 무수정) + 꼭짓점 앵커 + 패치 레퍼런스\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체(육각부 + 패치)의 역할 분류표. 육각부는 `placement.\n * buildRoleSets(k)` 를 그대로 재사용(D2 안 1 계약 — 바이트 동일)하고, 꼭짓점\n * 앵커·패치 레퍼런스만 그 위에 얹는다.\n * @param {number} k\n * @returns {{anchor: Set<string>, format: Set<string>, reference: Set<string>}}\n */\nexport function buildRoleSetsA(k) {\n  assertRadius(k);\n  const hexSets = buildRoleSets(k);\n  const anchor = new Set(hexSets.anchor);\n  for (const c of vertexAnchors(k)) anchor.add(key(c.q, c.r));\n  const reference = new Set(hexSets.reference);\n  for (const c of patchReferenceCells(k)) reference.add(key(c.q, c.r));\n  return { anchor, format: hexSets.format, reference };\n}\n\n/**\n * 셀 (q,r) 의 역할. 육각부는 `placement.roleOf` 와 완전히 동일한 판정을 낸다\n * (앵커·포맷·레퍼런스 좌표가 그대로이므로) — 패치 좌표만 anchor/reference/data 로\n * 새로 갈린다.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOfA(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSetsA(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n"],
  ["/src/decoder/anchor-detect.js", "\n/**\n * anchor-detect.js — Type O/A 앵커 3점과 120도 방향 가설\n *\n * 앵커는 포맷을 읽기 전에 격자 크기와 방향을 좁히는 기하 증거다. 이 모듈은\n * 불스아이 중심과 셀 피치로 유한한 (k, orientation) 전체를 평가하고, 첫\n * 일치에서 멈추지 않는다. 후단 bootstrap 이 포맷·본문 검증으로 선택한다.\n *\n * 좌표 규약:\n *   - 입력 bullseye.center 는 image pixel이다.\n *   - q/r은 셀 식별용 axial 좌표이며 H에 직접 넣지 않는다.\n *   - 모든 투영점은 unit-cell canonical Euclidean으로 변환한다.\n *   - 출력 H는 canonical Euclidean -> image pixel이다.\n *\n * @module decoder/anchor-detect\n */\n\nimport {\n  FRONTEND_FAILURE,\n  HOMOGRAPHY_CANONICAL_SPACE,\n  assertHomography,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\nimport {\n  FACES,\n  axialToPixel,\n} from '__TLSCAN_BLOB_008__';\nimport { ranksToDigit } from '__TLSCAN_BLOB_014__';\nimport { anchorCells } from '__TLSCAN_BLOB_019__';\nimport { vertexAnchors } from '__TLSCAN_BLOB_022__';\nimport { sampleHexCell } from '__TLSCAN_BLOB_011__';\n\n/*\n * 아래 값 중 separation/tie/sample count 는 설계에서 아직 M1 calibration 전\n * [미검증] 상태다. 이름을 붙여 옵션으로 덮어쓸 수 있게 두고, 측정 전에는\n * 포맷 규범처럼 숨기지 않는다.\n */\n// [미검증] M1 calibration 에서 확정: 앵커 면 순위의 최소 상대휘도 간격.\nconst DEFAULT_ANCHOR_MIN_SEPARATION = 0.04;\n// [미검증] M1 calibration 에서 확정: 근접동률로 취급할 간격.\nconst DEFAULT_ANCHOR_TIE_EPSILON = 0.02;\n// [미검증] M1 calibration 에서 확정: 앵커 면 원판의 최소 유효 표본 수.\nconst DEFAULT_ANCHOR_MIN_SAMPLE_COUNT = 3;\n// [미검증] M1 calibration 에서 확정: 내접원 반지름 대비 표본 원판 반경.\nconst DEFAULT_ANCHOR_SAMPLE_RADIUS_FRACTION = 0.5;\n// [미검증] M1 calibration 에서 확정: projective 원판의 최소 짧은축 지름.\nconst DEFAULT_ANCHOR_MIN_PROJECTED_MINOR_DIAMETER_PX = 1;\nconst LUMA_RANGE_EPSILON = 1e-9;\nconst ORIENTATIONS = Object.freeze([0, 1, 2]);\nconst FACE_NAMES = Object.freeze(['T', 'L', 'R']);\nconst IDENTITY_SIGMA = Object.freeze([0, 1, 2, 3, 4, 5]);\nconst SIGMA_CW = Object.freeze([4, 5, 1, 0, 3, 2]);\nconst SIGMA_CCW = Object.freeze([3, 2, 5, 4, 0, 1]);\n\nfunction finitePoint(point) {\n  return point\n    && Number.isFinite(point.x)\n    && Number.isFinite(point.y);\n}\n\nfunction clamp01(value) {\n  return Math.max(0, Math.min(1, value));\n}\n\nfunction normalizeDirection(direction) {\n  if (direction === undefined || direction === null\n    || direction === 0 || direction === 'identity' || direction === 'id') return 0;\n  if (direction === 1 || direction === 'cw' || direction === 'clockwise') return 1;\n  if (direction === 2 || direction === 'ccw' || direction === 'counterclockwise') return 2;\n  throw new RangeError('direction 은 0 | 1 | 2 | identity | cw | ccw 여야 한다: ' + direction);\n}\n\n/*\n * 성공(=null) 만 캐시한다. family.js 의 같은 이름 함수와 마찬가지로 전 픽셀을 훑어\n * 범위를 검사하는데, 한 복호에서 finder 마다·재시도마다 다시 불린다. 입력은 luma\n * 하나뿐이라 결과는 luma 에만 달려 있다. 실패는 위반 표본을 만나는 즉시 빠져나오고\n * 반환한 fail 객체는 상위에서 확장될 수 있어 공유하지 않는다.\n */\nconst validatedLumaCache = new WeakSet();\n\nfunction validateLuma(luma) {\n  if (luma !== null && typeof luma === 'object') {\n    if (validatedLumaCache.has(luma)) return null;\n    const computed = computeValidateLuma(luma);\n    if (computed === null) validatedLumaCache.add(luma);\n    return computed;\n  }\n  return computeValidateLuma(luma);\n}\n\nfunction computeValidateLuma(luma) {\n  if (luma === null || luma === undefined) {\n    return fail(FRONTEND_FAILURE.EMPTY_INPUT, { message: 'luma 가 없다' });\n  }\n  try {\n    assertLumaField(luma);\n  } catch (error) {\n    return fail(FRONTEND_FAILURE.EMPTY_INPUT, { message: error.message });\n  }\n\n  let min = Infinity;\n  let max = -Infinity;\n  for (let i = 0; i < luma.data.length; i += 1) {\n    const value = luma.data[i];\n    if (!Number.isFinite(value) || value < -LUMA_RANGE_EPSILON || value > 1 + LUMA_RANGE_EPSILON) {\n      return fail(FRONTEND_FAILURE.LUMA_DEGENERATE, {\n        message: '상대휘도 범위를 벗어난 표본이 있다',\n        index: i,\n        value,\n      });\n    }\n    if (value < min) min = value;\n    if (value > max) max = value;\n  }\n  if (!Number.isFinite(min) || max - min <= LUMA_RANGE_EPSILON) {\n    return fail(FRONTEND_FAILURE.LUMA_DEGENERATE, {\n      message: '휘도 범위가 없어 앵커 순위를 만들 수 없다',\n      min,\n      max,\n    });\n  }\n  return null;\n}\n\nfunction normalizeKs(ks, options) {\n  const source = ks === undefined ? options.ks : ks;\n  const values = Array.isArray(source) ? source : [source];\n  const unique = new Set();\n  for (const value of values) {\n    if (Number.isInteger(value) && value >= 4) unique.add(value);\n  }\n  return Array.from(unique).sort((a, b) => a - b);\n}\n\nfunction normalizeBullseye(bullseye, options) {\n  const source = bullseye && bullseye.ok === true\n    ? (bullseye.finder || bullseye.bullseye || bullseye)\n    : (bullseye || {});\n  const center = source.center || options.center;\n  const cellSize = source.cellSize === undefined\n    ? source.cellSizePxAtCenter\n    : source.cellSize;\n  if (!finitePoint(center) || !Number.isFinite(cellSize) || cellSize <= 0) return null;\n  return {\n    center: { x: center.x, y: center.y },\n    cellSize,\n    centerQr: Boolean(source.centerQr || options.centerQr),\n    baseHomography: source.H || source.homography || source.transform || source.B || options.H,\n  };\n}\n\nfunction applyHomography(H, point) {\n  const denominator = H[6] * point.x + H[7] * point.y + H[8];\n  if (!Number.isFinite(denominator) || Math.abs(denominator) <= LUMA_RANGE_EPSILON) return null;\n  const x = (H[0] * point.x + H[1] * point.y + H[2]) / denominator;\n  const y = (H[3] * point.x + H[4] * point.y + H[5]) / denominator;\n  return finitePoint({ x, y }) ? { x, y } : null;\n}\n\nfunction multiplyHomographies(left, right) {\n  const out = new Float64Array(9);\n  for (let row = 0; row < 3; row += 1) {\n    for (let column = 0; column < 3; column += 1) {\n      for (let inner = 0; inner < 3; inner += 1) {\n        out[row * 3 + column] += left[row * 3 + inner] * right[inner * 3 + column];\n      }\n    }\n  }\n  return out;\n}\n\nfunction rotationHomography(angle) {\n  const cosine = Math.cos(angle);\n  const sine = Math.sin(angle);\n  return new Float64Array([\n    cosine, -sine, 0,\n    sine, cosine, 0,\n    0, 0, 1,\n  ]);\n}\n\nfunction makeAffineHomography(center, cellSize) {\n  return new Float64Array([\n    cellSize, 0, center.x,\n    0, cellSize, center.y,\n    0, 0, 1,\n  ]);\n}\n\nfunction homographyForOrientation(bullseye, orientation, options) {\n  const supplied = options.H || bullseye.baseHomography;\n  const base = supplied === undefined\n    ? makeAffineHomography(bullseye.center, bullseye.cellSize)\n    : assertHomography(supplied);\n  const sign = options.orientationSign === -1 ? -1 : 1;\n  return multiplyHomographies(\n    base,\n    rotationHomography(sign * orientation * (2 * Math.PI / 3)),\n  );\n}\n\nfunction projectCell(H, q, r) {\n  return applyHomography(H, axialToPixel(q, r));\n}\n\nfunction median(values) {\n  if (values.length === 0) return NaN;\n  const sorted = values.slice().sort((a, b) => a - b);\n  const middle = Math.floor(sorted.length / 2);\n  return sorted.length % 2 === 1\n    ? sorted[middle]\n    : (sorted[middle - 1] + sorted[middle]) / 2;\n}\n\nfunction rankStat(faces, tieEpsilon) {\n  if (faces.some((face) => !Number.isFinite(face.median))) {\n    return { digit: null, separation: NaN, tie: true, order: [] };\n  }\n  const order = [0, 1, 2].sort((a, b) => {\n    const difference = faces[a].median - faces[b].median;\n    return difference === 0 ? a - b : difference;\n  });\n  const sorted = order.map((index) => faces[index].median);\n  const separation = Math.min(sorted[1] - sorted[0], sorted[2] - sorted[1]);\n  const tie = separation < tieEpsilon;\n  if (tie) return { digit: null, separation, tie, order };\n  const ranks = {};\n  for (let i = 0; i < order.length; i += 1) ranks[FACE_NAMES[order[i]]] = i;\n  return {\n    digit: ranksToDigit(ranks),\n    separation,\n    tie,\n    order,\n  };\n}\n\nfunction geometryResidual(points, center, cellSize) {\n  const radii = points\n    .filter((point) => finitePoint(point))\n    .map((point) => Math.hypot(point.x - center.x, point.y - center.y));\n  if (radii.length === 0) return Infinity;\n  const target = median(radii);\n  let sum = 0;\n  for (const radius of radii) sum += (radius - target) ** 2;\n  return Math.sqrt(sum / radii.length);\n}\n\nfunction evaluate(luma, bullseye, canonicalAnchors, family, k, orientation, options) {\n  const sampleFraction = Number.isFinite(options.sampleRadiusFraction)\n    && options.sampleRadiusFraction > 0\n    && options.sampleRadiusFraction <= 1\n    ? options.sampleRadiusFraction\n    : DEFAULT_ANCHOR_SAMPLE_RADIUS_FRACTION;\n  const minSeparation = Number.isFinite(options.minSeparation)\n    ? Math.max(0, options.minSeparation)\n    : DEFAULT_ANCHOR_MIN_SEPARATION;\n  const tieEpsilon = Number.isFinite(options.tieEpsilon)\n    ? Math.max(0, options.tieEpsilon)\n    : DEFAULT_ANCHOR_TIE_EPSILON;\n  const minSampleCount = Number.isInteger(options.minSampleCount)\n    ? Math.max(1, options.minSampleCount)\n    : DEFAULT_ANCHOR_MIN_SAMPLE_COUNT;\n  const minProjectedMinorDiameter = Number.isFinite(options.minProjectedMinorDiameter)\n    ? Math.max(0, options.minProjectedMinorDiameter)\n    : DEFAULT_ANCHOR_MIN_PROJECTED_MINOR_DIAMETER_PX;\n  const H = homographyForOrientation(bullseye, orientation, options);\n  const pointList = [];\n  const measurements = [];\n  let allSamples = true;\n  let allRanks = true;\n  let allExpected = true;\n  let minCount = Infinity;\n\n  for (let i = 0; i < canonicalAnchors.length; i += 1) {\n    const anchor = canonicalAnchors[i];\n    const point = projectCell(H, anchor.q, anchor.r);\n    pointList.push(point || { x: NaN, y: NaN });\n    const sampled = point\n      ? sampleHexCell(\n        luma,\n        { H, canonicalSpace: HOMOGRAPHY_CANONICAL_SPACE },\n        anchor.q,\n        anchor.r,\n        {\n          discOptions: { fraction: sampleFraction, fractionOf: 'radius' },\n          minSampleCount,\n          minProjectedMinorDiameter,\n          tieEpsilon,\n        },\n      )\n      : fail(FRONTEND_FAILURE.HOMOGRAPHY_DEGENERATE, {\n        stage: 'anchor-project',\n        cause: 'anchor-crosses-projective-horizon',\n      });\n    const faces = sampled.ok\n      ? { T: sampled.T, L: sampled.L, R: sampled.R }\n      : {\n        T: { median: NaN, mad: NaN, count: 0 },\n        L: { median: NaN, mad: NaN, count: 0 },\n        R: { median: NaN, mad: NaN, count: 0 },\n      };\n    const orderedFaces = FACE_NAMES.map((face) => faces[face]);\n    const rank = rankStat(orderedFaces, tieEpsilon);\n    const expected = anchor.digit;\n    const sampleCheck = sampled.ok\n      && orderedFaces.every((face) => face.count >= minSampleCount);\n    const rankCheck = sampled.ok\n      && !rank.tie\n      && Number.isFinite(rank.separation)\n      && rank.separation >= minSeparation;\n    const expectedCheck = sampled.ok && rank.digit === expected;\n    allSamples = allSamples && sampleCheck;\n    allRanks = allRanks && rankCheck;\n    allExpected = allExpected && expectedCheck;\n    for (const face of orderedFaces) minCount = Math.min(minCount, face.count);\n    measurements.push({\n      canonical: { q: anchor.q, r: anchor.r },\n      expectedDigit: expected,\n      observedDigit: rank.digit,\n      separation: rank.separation,\n      tie: rank.tie,\n      faces,\n      sampleCheck,\n      rankCheck,\n      expectedCheck,\n      samplingFailure: sampled.ok ? null : {\n        reason: sampled.reason,\n        detail: sampled.detail,\n      },\n    });\n  }\n\n  const separations = measurements\n    .map((measurement) => measurement.separation)\n    .filter((value) => Number.isFinite(value) && value >= 0);\n  const meanSeparation = separations.length === 0\n    ? 0\n    : separations.reduce((sum, value) => sum + value, 0) / separations.length;\n  const score = clamp01(meanSeparation / Math.max(minSeparation, LUMA_RANGE_EPSILON));\n  const residual = geometryResidual(pointList, bullseye.center, bullseye.cellSize);\n\n  return {\n    family,\n    k,\n    orientation,\n    centerQr: bullseye.centerQr,\n    anchors: pointList,\n    canonicalAnchors: canonicalAnchors.map((anchor) => ({ q: anchor.q, r: anchor.r })),\n    H,\n    canonicalSpace: HOMOGRAPHY_CANONICAL_SPACE,\n    geometryResidual: residual,\n    anchorMargin: separations.length === 0 ? 0 : Math.min(...separations),\n    score,\n    hardChecks: {\n      sampleCount: allSamples,\n      rankSeparation: allRanks,\n      expectedPattern: allExpected,\n      all: allSamples && allRanks && allExpected,\n    },\n    measurements,\n    hypothesisId: family + '-' + k + '-' + orientation,\n    _minCount: Number.isFinite(minCount) ? minCount : 0,\n  };\n}\n\nfunction findHypotheses(luma, bullseye, ks, options, family, anchorFactory) {\n  const inputFailure = validateLuma(luma);\n  if (inputFailure) return inputFailure;\n  const normalizedBullseye = normalizeBullseye(bullseye, options);\n  if (!normalizedBullseye) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, {\n      family,\n      message: '불스아이 중심 또는 cellSize 가 없다',\n    });\n  }\n  const normalizedKs = normalizeKs(ks, options);\n  if (normalizedKs.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_ANCHORS, {\n      family,\n      message: '검사할 양의 k 목록이 없다',\n    });\n  }\n\n  const hypotheses = [];\n  const rejected = [];\n  for (const k of normalizedKs) {\n    let anchors;\n    try {\n      anchors = anchorFactory(k);\n    } catch (error) {\n      rejected.push({ k, reason: error.message });\n      continue;\n    }\n    for (const orientation of ORIENTATIONS) {\n      const evaluated = evaluate(\n        luma,\n        normalizedBullseye,\n        anchors,\n        family,\n        k,\n        orientation,\n        options,\n      );\n      if (evaluated.hardChecks.all) hypotheses.push(evaluated);\n      else rejected.push({\n        hypothesisId: evaluated.hypothesisId,\n        k,\n        orientation,\n        hardChecks: evaluated.hardChecks,\n        anchorMargin: evaluated.anchorMargin,\n      });\n    }\n  }\n\n  hypotheses.sort((a, b) => a.k - b.k || a.orientation - b.orientation);\n  const detail = {\n    family,\n    testedKs: normalizedKs,\n    testedOrientations: ORIENTATIONS.slice(),\n    evaluatedCount: normalizedKs.length * ORIENTATIONS.length,\n    rejected,\n  };\n  if (hypotheses.length === 0) {\n    return fail(FRONTEND_FAILURE.NO_ANCHORS, {\n      ...detail,\n      hypotheses: [],\n    });\n  }\n  return ok({\n    hypotheses,\n    diagnostics: detail,\n  });\n}\n\n/**\n * Type O의 교대 코너 앵커를 전수 평가한다.\n *\n * @param {import('__TLSCAN_BLOB_002__').LumaField} luma\n * @param {import('__TLSCAN_BLOB_002__').BullseyeCandidate} bullseye\n * @param {number[]|number} ks 지원 k 목록\n * @param {object} [options]\n * @returns {{ok:true, hypotheses: object[], diagnostics: object}|{ok:false, reason:string, detail?:object}}\n */\nexport function findOAnchorHypotheses(luma, bullseye, ks, options = {}) {\n  return findHypotheses(luma, bullseye, ks, options, 'hex', (k) => anchorCells(k));\n}\n\n/**\n * Type A의 주 꼭짓점 앵커를 전수 평가한다. Type O의 육각 코어 앵커는\n * placementA.js 규약상 보조 앵커이므로 여기서는 주 앵커 3점만 쓴다.\n *\n * @param {import('__TLSCAN_BLOB_002__').LumaField} luma\n * @param {import('__TLSCAN_BLOB_002__').BullseyeCandidate} bullseye\n * @param {number[]|number} ks 지원 k 목록\n * @param {object} [options]\n */\nexport function findAAnchorHypotheses(luma, bullseye, ks, options = {}) {\n  return findHypotheses(luma, bullseye, ks, options, 'tri', (k) => vertexAnchors(k));\n}\n\n/**\n * 화면 고정 T/L/R 이름으로 관측한 digit을 canonical digit으로 바꾸는\n * 물리 회전 전단사. 0=항등, 1=cw, 2=ccw 는 SPEC §5.2의 σ 표를 그대로\n * 반환하며, 매 호출마다 새 배열을 내어 호출자 변형이 전역 상수를 오염시키지 않게 한다.\n *\n * @param {0|1|2|'identity'|'cw'|'ccw'} direction\n * @returns {number[]} digit -> rotated digit\n */\nexport function physicalRotationSigma(direction) {\n  const normalized = normalizeDirection(direction);\n  const table = normalized === 0\n    ? IDENTITY_SIGMA\n    : normalized === 1\n      ? SIGMA_CW\n      : SIGMA_CCW;\n  return table.slice();\n}\n"],
  ["/src/layoutA.js", "// layoutA.js — Type A scan order-A(T3) + 레이아웃 통합 파사드\n// (ADR 0005 D3, docs/adr/0005_typeA_layout.md v1.1 / 0005b §3)\n//\n// placementA.js 가 이미 확정한 \"어디에 무엇을 놓는가\"(꼭짓점 앵커·패치 레퍼런스)\n// 위에 **데이터 셀의 순회 순서**만 얹는다. layout.js(Type O) 와 대칭 구조 —\n// 소비자가 placementA/placement 를 따로 import 하지 않도록 재-export 파사드를\n// 겸한다.\n//\n// [D3 채택 — T3 행 boustrophedon] scan order-A = 육각부 §5.7 순서(=\n// `layout.dataCellsInScanOrder(k)`) 그대로 접두 + 패치 꼬리 [top → BR → BL]:\n//   top 패치는 행 j=1..k (r=−k−j), 행 내 q∈[j,k], **홀수 행 오름차순·짝수 행\n//   내림차순(boustrophedon)**; BR = rotate120(top 순서) · BL = rotate240(top 순서).\n//   role === 'data' 인 셀만(앵커·레퍼런스 스킵).\n// 후보 4개(T1 링 연장·T2 행 고정방향·T3·B 전역 행 우선) 실측 비교에서 T3 만\n// 유일하게 양쪽 k(8·10)에서 \"전 그룹 인접쌍 보유 100%\" 계약을 보존하고 변\n// 스크레이프 터치 심볼도 최소였다(0005b §3 표). 하기 실계산이 그 채택 근거를\n// 회귀로 고정한다(layoutA.test.js sha256 스냅샷).\n//\n// 필러: A1(k=8) 잔여 0(필러 없음) · A2(k=10) 잔여 2 → scan 꼬리 마지막 2셀 =\n// (−19,10)·(−19,9) = BL 패치 최외곽 행(실루엣 가장자리, §5.6 취지 유지).\n//\n// 런타임 의존성 0 · ESM.\n\nimport { dataCellsInScanOrder as hexDataCellsInScanOrder } from '__TLSCAN_BLOB_021__';\nimport { rotate120, rotate240 } from '__TLSCAN_BLOB_019__';\nimport { occupiedCells } from '__TLSCAN_BLOB_009__';\nimport {\n  buildRoleSetsA,\n  roleOfA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n} from '__TLSCAN_BLOB_022__';\nimport {\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n} from '__TLSCAN_BLOB_019__';\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < 4) {\n    throw new RangeError(`k 는 4 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order-A (T3)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * top 패치를 행 j=1..k 로 훑되, 홀수 행은 q 오름차순 · 짝수 행은 q 내림차순\n * (boustrophedon). D3 이 채택한 T3 규칙의 핵심 — 인접 행끼리 끝점이 맞물려\n * 연속쌍 인접률이 T2(행 고정방향)보다 높다(0005b §3 실측표).\n */\nfunction topPatchBoustrophedon(k) {\n  const out = [];\n  for (let j = 1; j <= k; j += 1) {\n    const r = -k - j;\n    const rowQs = [];\n    for (let q = j; q <= k; q += 1) rowQs.push(q);\n    if (j % 2 === 0) rowQs.reverse();\n    for (const q of rowQs) out.push({ q: q + 0, r: r + 0 });\n  }\n  return out;\n}\n\n/**\n * 패치 꼬리(top → BR → BL, T3 boustrophedon) 중 role === 'data' 인 셀만.\n * 꼭짓점 앵커·패치 레퍼런스는 스킵된다.\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} roleSets\n */\nfunction patchDataTail(k, roleSets) {\n  const top = topPatchBoustrophedon(k);\n  const br = top.map((c) => rotate120(c.q, c.r));\n  const bl = top.map((c) => rotate240(c.q, c.r));\n  return [...top, ...br, ...bl].filter((c) => roleOfA(c.q, c.r, k, roleSets) === 'data');\n}\n\n/**\n * 데이터 셀을 캐노니컬 scan order-A(T3) 로. 육각부 접두(`layout.\n * dataCellsInScanOrder(k)`, 바이트 동일) + 패치 꼬리(top→BR→BL, boustrophedon,\n * role=='data' 만).\n * @param {number} k\n * @returns {{q:number, r:number}[]} 길이 = 데이터 셀 수 (A1(k=8) → 267 · A2(k=10) → 431)\n */\nexport function dataCellsInScanOrderA(k) {\n  assertRadius(k);\n  const hexPrefix = hexDataCellsInScanOrder(k);\n  const roleSets = buildRoleSetsA(k);\n  const tail = patchDataTail(k, roleSets);\n  return [...hexPrefix, ...tail];\n}\n\n/**\n * scan order-A 의 연속 3셀씩 묶은 심볼 그룹. §4.2 MSD-first 규약 그대로. 마지막\n * (C mod 3) 개는 그룹에 들지 않고 `fillerCellsA` 로 간다.\n * @param {number} k\n * @returns {{q:number, r:number}[][]}\n */\nexport function symbolCellGroupsA(k) {\n  const scan = dataCellsInScanOrderA(k);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let i = 0; i < groupCount; i += 1) {\n    groups.push([scan[3 * i], scan[3 * i + 1], scan[3 * i + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order-A 의 마지막 (C mod 3) 개 (§5.6 준용). A1 은 0개, A2 는\n * 2개 = (−19,10)·(−19,9)(BL 패치 최외곽 행, D3 KAT).\n * @param {number} k\n * @returns {{q:number, r:number}[]}\n */\nexport function fillerCellsA(k) {\n  const scan = dataCellsInScanOrderA(k);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점, layout.js `layoutMap` 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 영역 A(k) 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - bullseye  → `bullseye.occupiedCells()` 순서\n *   - anchor    → 육각 코너 3셀(`placement.anchorCells(k)`) + 꼭짓점 3셀\n *                 (`placementA.vertexAnchors(k)`), 이 순서로 이어붙여 인덱스 0..5\n *   - format    → `placement.formatCells(k)` 순서 (육각부 재사용, 무변경)\n *   - reference → 육각 레퍼런스(`placement.referenceCellsAll(k)`) + 패치\n *                 레퍼런스(`placementA.patchReferenceCells(k)`), 이 순서로 이어붙임\n *   - data      → `dataCellsInScanOrderA(k)` 순서 (= scan order-A 인덱스, 심볼\n *                 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는 `index % 3`)\n *\n * @param {number} k\n * @returns {Map<string, {role: 'bullseye'|'anchor'|'format'|'reference'|'data', index: number}>}\n */\nexport function layoutMapA(k) {\n  assertRadius(k);\n  const map = new Map();\n\n  occupiedCells().forEach((c, i) => map.set(key(c.q, c.r), { role: 'bullseye', index: i }));\n\n  const anchors = [...anchorCells(k), ...vertexAnchors(k)];\n  anchors.forEach((c, i) => map.set(key(c.q, c.r), { role: 'anchor', index: i }));\n\n  formatCells(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'format', index: i }));\n\n  const references = [...referenceCellsAll(k), ...patchReferenceCells(k)];\n  references.forEach((c, i) => map.set(key(c.q, c.r), { role: 'reference', index: i }));\n\n  dataCellsInScanOrderA(k).forEach((c, i) => map.set(key(c.q, c.r), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placementA/placement 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport {\n  roleOfA,\n  buildRoleSetsA,\n  regionCellsA,\n  vertexAnchors,\n  patchReferenceCells,\n  anchorCells,\n  formatCells,\n  referenceCellsAll,\n};\nexport { occupiedCells };\n"],
  ["/src/placementY.js", "// placementY.js — Type Y 레퍼런스 조 · 포맷 정보 15셀 · 역할 배치 (SPEC §14, ADR 0003 U8·U9)\n//\n// Type Y 는 인덱스 공간이다 — 셀은 3면 공통 좌표 (i,j), 0..n-1 정수 좌표일 뿐 기하가\n// 필요 없다(hexgrid.js/ygrid 미참조). 이 모듈은 \"n×n 격자 어디에 레퍼런스·포맷 정보가\n// 사는가\"만 다룬다. scan order(U7)는 layoutY.js, 용량 회계(생성물 표)는 capacityY.js\n// 소관.\n//\n// 런타임 의존성 0 · 순수 ESM (node: API 금지, Math.random/Date 금지).\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레퍼런스 4조 (U9) — SPEC §14 \"라틴 스퀘어 3셀 1조, 공간 분산 ≥ 3조\"\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 조 앵커(순서 고정): A = (2,2), (n-3,2), (2,n-3), (n-3,n-3). 네 앵커는 격자의 네\n// 모서리 근방(가장자리에서 inset 2)에 하나씩 놓여 \"공간 분산(비일직선) ≥ 3조\" 요건을\n// 코너 대각 배치로 만족한다.\n//\n// 조 내 3셀: L자형 [(p,q), (p+1,q), (p,q+1)] — 앵커 (p,q) 에서 i 방향으로 한 칸,\n// j 방향으로 한 칸. 이 3셀에 digit 을 그 순서대로 배정한다 — **어떤 digit 인지는\n// 톤 모드(tones)에 따라 갈린다** (ADR 0003 v3.1 §4b D9, 전환 비용 항목):\n//\n//   tones=2(2톤 메인) → REFERENCE_GROUP_DIGITS_2T = [0,1,2] : 조 내 3셀이 매 면마다\n//     밝음 1·어두움 2 를 갖는다(양 앵커 확보 — U14 θ_f 추정이 밝은/어두운 앵커 둘\n//     다 필요). 4조 구조는 3톤과 동일 — 공간 분산이 오염 방어선(§4b 근거 수치).\n//   tones=3(Y-T 옵션) → REFERENCE_GROUP_DIGITS_3T = [0,4,3] (구 REFERENCE_GROUP_DIGITS,\n//     ADR 0003 D3): 이 순위행이 세 면 모두에 레벨 {0,1,2} 전부를 준다.\n//\n// 조 좌표·L자형 셀 구조 자체는 톤 모드 무관 불변 — 바뀌는 것은 digit 배정뿐이다.\n\n/** 레퍼런스 조 내 3셀에 배정하는 digit(tones=2, 2톤 메인), L자형 셀 순서대로. */\nexport const REFERENCE_GROUP_DIGITS_2T = Object.freeze([0, 1, 2]);\n\n/** 레퍼런스 조 내 3셀에 배정하는 digit(tones=3, Y-T 옵션), L자형 셀 순서대로. */\nexport const REFERENCE_GROUP_DIGITS_3T = Object.freeze([0, 4, 3]);\n\nfunction referenceDigitsFor(tones) {\n  if (tones === 2) return REFERENCE_GROUP_DIGITS_2T;\n  if (tones === 3) return REFERENCE_GROUP_DIGITS_3T;\n  throw new RangeError(`지원하지 않는 tones: ${tones} (허용 2 또는 3)`);\n}\n\nfunction key(i, j) {\n  return `${i},${j}`;\n}\n\nfunction assertSize(n) {\n  // 하한 11: n=9·10 에서는 포맷 복제 2 가 레퍼런스 조와 실제로 충돌한다 (검증 라운드\n  // 전수 검산 — n=9 의 (2,7)·n=10 의 (2,8)). 그 범위를 허용하면 \"충돌 시 throw\" 계약이\n  // roleOf 우선순위에 은폐된다. n=11..20 은 무충돌이나 규범 버전은 21·25 뿐이다.\n  if (!Number.isInteger(n) || n < 11) {\n    throw new RangeError(`n 은 11 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n/** 레퍼런스 조 앵커 4개, 조 순서 고정: (2,2) · (n-3,2) · (2,n-3) · (n-3,n-3). */\nexport function referenceAnchors(n) {\n  assertSize(n);\n  return [\n    { p: 2, q: 2 },\n    { p: n - 3, q: 2 },\n    { p: 2, q: n - 3 },\n    { p: n - 3, q: n - 3 },\n  ];\n}\n\n/**\n * 레퍼런스 4조. 각 조 = {cells: [{i,j}×3], digits}. cells 순서 = [(p,q), (p+1,q),\n * (p,q+1)], digits[k] 가 cells[k] 에 대응. digits 는 tones 모드별\n * (REFERENCE_GROUP_DIGITS_2T | _3T) — 조 좌표·셀 구조는 tones 무관 불변.\n * @param {number} n\n * @param {2|3} [tones] 기본 2(2톤 메인, ADR 0003 v3.1 §4b).\n * @returns {{cells:{i:number,j:number}[], digits: number[]}[]} 길이 4\n */\nexport function referenceGroups(n, tones = 2) {\n  assertSize(n);\n  const digits = referenceDigitsFor(tones);\n  return referenceAnchors(n).map(({ p, q }) => ({\n    cells: [\n      { i: p, j: q },\n      { i: p + 1, j: q },\n      { i: p, j: q + 1 },\n    ],\n    digits,\n  }));\n}\n\n/**\n * 레퍼런스 12셀 전부(조 순 · 조 내 순 평탄화), 각 셀에 digit 을 얹은 목록.\n * @param {number} n\n * @param {2|3} [tones] 기본 2(2톤 메인) — referenceGroups 로 그대로 전달.\n * @returns {{i:number, j:number, digit:number}[]} 길이 12\n */\nexport function referenceCellsAll(n, tones = 2) {\n  const out = [];\n  for (const group of referenceGroups(n, tones)) {\n    group.cells.forEach((cell, idx) => {\n      out.push({ ...cell, digit: group.digits[idx] });\n    });\n  }\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 정보 15셀 (U8) — 3복제 × 5셀\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// §5.4 구조(12bit·CRC-6·5digit·3복제)를 승계한다. Type Y 는 링 구조가 없으므로\n// (인덱스 격자에는 \"링\"이라는 자연스러운 순회가 없다), 결정 규칙을 좌표 직접 서술로\n// 고정한다 — 전 셀 가장자리 inset ≥ 1(0 또는 n-1 좌표를 쓰지 않는다):\n//\n//   복제 0 = (2,1)..(6,1)         — i = 2..6 오름차순, j = 1 고정\n//   복제 1 = (1,2)..(1,6)         — i = 1 고정, j = 2..6 오름차순\n//   복제 2 = (n-8,n-2)..(n-4,n-2) — i = n-8..n-4 오름차순, j = n-2 고정\n//\n// 레퍼런스 4조(위)와 좌표가 절대 겹치지 않아야 하는 와이어 계약이다 — 겹치면\n// 조용히 시프트하지 않고 **모듈 로드 시점에 throw** 한다(아래 자기검증 블록).\n\nexport const FORMAT_BLOCK_LENGTH = 5;\nexport const FORMAT_REPLICAS = 3;\n\n/** 포맷 정보 15셀 (복제 3개 × 5셀), 복제 순 · 복제 내 오름차순으로 이어붙인 목록. */\nexport function formatCells(n) {\n  assertSize(n);\n  const cells = [];\n  for (let i = 2; i <= 6; i += 1) cells.push({ i, j: 1 });\n  for (let j = 2; j <= 6; j += 1) cells.push({ i: 1, j });\n  for (let i = n - 8; i <= n - 4; i += 1) cells.push({ i, j: n - 2 });\n  return cells;\n}\n\nfunction assertFormatInset(n) {\n  for (const { i, j } of formatCells(n)) {\n    if (i < 1 || i > n - 2 || j < 1 || j > n - 2) {\n      throw new RangeError(\n        `n=${n}: 포맷 셀 (${i},${j}) 이 가장자리 inset ≥ 1 을 위반한다`,\n      );\n    }\n  }\n}\n\nfunction assertNoReferenceFormatCollision(n) {\n  const refSet = new Set(referenceCellsAll(n).map((c) => key(c.i, c.j)));\n  for (const { i, j } of formatCells(n)) {\n    if (refSet.has(key(i, j))) {\n      throw new RangeError(\n        `n=${n}: 포맷 셀 (${i},${j}) 이 레퍼런스 셀과 충돌한다 — 결정 규칙을 다시 확정해야 한다`,\n      );\n    }\n  }\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경(격자 크기) n 전체의 역할 분류표를 한 번에 만든다 (layout.js `buildRoleSets`\n * 대칭 구조 — roleOf 를 셀마다 재계산하지 않도록 Set 을 미리 구성한다).\n * @param {number} n\n * @returns {{reference: Set<string>, format: Set<string>}}\n */\nexport function buildRoleSets(n) {\n  assertSize(n);\n  const reference = new Set(referenceCellsAll(n).map((c) => key(c.i, c.j)));\n  const format = new Set(formatCells(n).map((c) => key(c.i, c.j)));\n  return { reference, format };\n}\n\n/**\n * 셀 (i,j) 의 역할. Type O 와 달리 불스아이·앵커가 없다 — reference | format | data 뿐.\n * @param {number} i\n * @param {number} j\n * @param {number} n\n * @param {{reference:Set<string>, format:Set<string>}} [roleSets]\n * @returns {'reference'|'format'|'data'}\n */\nexport function roleOf(i, j, n, roleSets) {\n  const sets = roleSets || buildRoleSets(n);\n  const kk = key(i, j);\n  if (sets.reference.has(kk)) return 'reference';\n  if (sets.format.has(kk)) return 'format';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 모듈 로드 시점 자기검증 — n=21(Y1)·25(Y2) 무충돌·inset 전수 확인\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// \"충돌 시 조용히 시프트\" 금지(과제 지침) — 결정 규칙이 깨지면 import 시점에 즉시\n// 알아챈다. VERSIONS_Y(capacityY.js)와 별개로 이 모듈 자체가 자기 계약을 지킨다.\n\nfor (const n of [21, 25]) {\n  assertFormatInset(n);\n  assertNoReferenceFormatCollision(n);\n}\n"],
  ["/src/layoutY.js", "// layoutY.js — Type Y scan order-Y + 레이아웃 통합 파사드 (SPEC §14, ADR 0003 D5·U7)\n//\n// placementY.js 가 이미 확정한 \"어디에 무엇을 놓는가\"(레퍼런스 4조·포맷 15셀) 위에\n// **데이터 셀의 순회 순서**(scan order-Y)만 얹는다. layout.js(Type O) 와 대칭 구조 —\n// 소비자가 placementY 를 따로 import 하지 않도록 재-export 파사드를 겸한다.\n//\n// 캐노니컬 정의 (와이어 계약, ADR 0003 D5 \"좌표-국소 래스터\"의 구체화):\n//   j = 0..n-1 오름차순(행), 행 안에서 i = 0..n-1 오름차순, role === 'data' 인\n//   셀만(레퍼런스·포맷 스킵). 연속 3셀 = RS 심볼 1개 (d0,d1,d2 MSD-first, §4.2 승계).\n//   필러 = 마지막 (C mod 3) 개(§5.6 준용).\n//\n// 좌표-국소 래스터를 쓰는 이유(ADR D5): 분산 배치 대비 포화 글레어 임계 면적이\n// 3.95%→12%로 3배 커진다 — \"연속 3셀 = 1심볼 + 공간 인접\" 원칙(Type O §5.7)의 Type Y\n// 승계.\n// ⚠ 12% 는 \"심볼의 3셀 전멸\" 이상 모델의 상한이다. 부분 터치(셀 1개만 스쳐도 심볼\n// 오염) 기준 원판형 글레어 최악 배치 실측 임계는 Y1 7.12% / Y2 8.17% (검증 라운드\n// 실측 — 이상적 행내 그룹핑과의 격차는 0.2pp 이하라 국소성 자체는 실질 성립).\n// 리스크 등록·게이트에는 12% 가 아니라 이 실측 임계를 쓴다.\n//\n// 런타임 의존성 0 · ESM.\n\nimport {\n  buildRoleSets,\n  roleOf,\n  referenceGroups,\n  referenceCellsAll,\n  formatCells,\n} from '__TLSCAN_BLOB_025__';\n\nfunction key(i, j) {\n  return `${i},${j}`;\n}\n\nfunction assertSize(n) {\n  if (!Number.isInteger(n) || n < 9) {\n    throw new RangeError(`n 은 9 이상의 정수여야 한다: ${n}`);\n  }\n  return n;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// scan order-Y\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 데이터 셀을 캐노니컬 scan order-Y 로. j 오름차순(행), 행 안에서 i 오름차순,\n * role === 'data' 인 셀만.\n * @param {number} n\n * @returns {{i:number, j:number}[]} 길이 = 데이터 셀 수\n */\nexport function dataCellsInScanOrder(n) {\n  assertSize(n);\n  const roleSets = buildRoleSets(n);\n  const out = [];\n  for (let j = 0; j < n; j += 1) {\n    for (let i = 0; i < n; i += 1) {\n      if (roleOf(i, j, n, roleSets) === 'data') out.push({ i, j });\n    }\n  }\n  return out;\n}\n\n/**\n * scan order-Y 의 연속 3셀씩 묶은 심볼 그룹. 그룹 내부 순서 = (d0,d1,d2),\n * §4.2 MSD-first 규약 그대로. 마지막 (C mod 3) 개는 그룹에 들지 않고\n * `fillerCells` 로 간다.\n * @param {number} n\n * @returns {{i:number, j:number}[][]} 길이 = ⌊데이터 셀 수 / 3⌋\n */\nexport function symbolCellGroups(n) {\n  const scan = dataCellsInScanOrder(n);\n  const groupCount = Math.floor(scan.length / 3);\n  const groups = [];\n  for (let g = 0; g < groupCount; g += 1) {\n    groups.push([scan[3 * g], scan[3 * g + 1], scan[3 * g + 2]]);\n  }\n  return groups;\n}\n\n/**\n * 필러 셀 — scan order-Y 의 마지막 (C mod 3) 개 (§5.6 준용). scan order 꼬리에 온다.\n * @param {number} n\n * @returns {{i:number, j:number}[]}\n */\nexport function fillerCells(n) {\n  const scan = dataCellsInScanOrder(n);\n  const residual = scan.length % 3;\n  return residual === 0 ? [] : scan.slice(scan.length - residual);\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 통합 레이아웃 맵 (디코더 역독 진입점, layout.js `layoutMap` 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * n×n 인덱스 격자 전 셀의 역할 + (역할 내) 인덱스.\n *\n * 역할별 index 의 기준 목록:\n *   - reference → `placementY.referenceCellsAll(n)` 순서(조 순 · 조 내 순)\n *   - format    → `placementY.formatCells(n)` 순서(복제 순 · 복제 내 순)\n *   - data      → `dataCellsInScanOrder(n)` 순서(= scan order-Y 인덱스, 심볼\n *                 그룹 번호는 `Math.floor(index / 3)`, 그룹 내 위치는 `index % 3`)\n *\n * @param {number} n\n * @returns {Map<string, {role: 'reference'|'format'|'data', index: number}>}\n */\nexport function layoutMapY(n) {\n  assertSize(n);\n  const map = new Map();\n\n  referenceCellsAll(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'reference', index: i }));\n  formatCells(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'format', index: i }));\n  dataCellsInScanOrder(n).forEach((c, i) => map.set(key(c.i, c.j), { role: 'data', index: i }));\n\n  return map;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 재-export 파사드 — 소비자가 placementY 를 직접 import 하지 않아도 되게\n// ─────────────────────────────────────────────────────────────────────────────\n\nexport { roleOf, referenceGroups, referenceCellsAll, formatCells };\n"],
  ["/src/rs211.js", "/**\n * rs211.js — 체계적 Reed-Solomon 부호 over GF(211)\n *\n * ADR 0001 §6 / §8.3: RS 부호화를 **셀 도메인**으로 옮긴다 — RS 심볼 1개 =\n * 셀 3개(digit 3개, base-211). 코드워드 = 메시지 ‖ 패리티, n ≤ 210(체의\n * 곱셈군 위수).\n *\n * ⚠ GF(2^8) 용 `rs.js` 를 그대로 베끼면 안 된다. 표수가 2 가 아니므로:\n *   - 부호화의 \"몫 없이 나머지만\" 트릭에서 XOR 대신 진짜 뺄셈을 쓴다.\n *   - Berlekamp-Massey 의 갱신식이 뺄셈을 쓴다 (XOR 로는 GF(2^m) 에서만 우연히 맞는다).\n *   - Forney 공식에 **음의 부호가 실재한다** — GF(2^m) 은 -1=1 이라 안 보였을 뿐이다.\n *   - 형식적 미분 Λ'(x) 는 \"홀수항만 남는\" GF(2^m) 트릭이 아니라 일반 미적분과\n *     같다: d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1).\n *\n * 복호 실패는 절대 조용히 삼키지 않는다 — `{ ok:false, reason }` 을 돌려주거나\n * `RSDecodeError` 를 던진다. 오류가 t 개를 넘으면 원리적으로 다른 유효\n * 코드워드로 오정정될 수 있고(그때는 ok:true 지만 값이 다름) 이는 부호의\n * 한계이지 버그가 아니다 — 상위 계층(포맷 CRC 등)이 최종 방어선이다.\n *\n * 의존성 0. 브라우저 ESM 으로 그대로 로드된다.\n */\n\nimport { P, MULTIPLICATIVE_ORDER, add, sub, mul, div, inverse, alphaPow, polyEval } from '__TLSCAN_BLOB_006__';\n\n/** 코드워드 최대 길이. RS over GF(q) 는 n ≤ q − 1 — GF(211) 에서 210. */\nexport const MAX_CODEWORD_LEN = MULTIPLICATIVE_ORDER;\n\n/** 생성다항식 첫 근 지수 (first consecutive root) 기본값. */\nexport const DEFAULT_FCR = 0;\n\n/**\n * 규범 nsym 표 — **공식으로 유도하지 않는다** (ADR 0001 §3.3.3: 공식+플래그 조합이\n * 비대칭 비교 사고를 두 번 냈다).\n *\n * 출처를 정확히 가른다 (검증 라운드 지적 반영):\n * - **M 값 (7 / 14 / 23): ADR §3.3.2, 2026-07-29 사용자 확정.** V3 = 23 은 같은 t=11 을\n *   주는 22 대신 +1 B 를 오정정 검출 여유로 지출한 명시적 결정이다 (패리티율 정확히 25.0%).\n * - **V3 H = 37: ADR §8.1 ECC-H 실측 행** (nsym=37 · K=53 B · ε@95% 4.5~5.0%).\n * - **L 값 전부와 V1/V2 의 H 값: 오케스트레이터 파생** — SPEC §6 비율(L 12% / H 40%)을\n *   심볼 수에 곱해 반올림한 것 (V1: 27×0.12→3, 27×0.4→11 / V2: 55×0.12→7, 55×0.4→22 /\n *   V3: 92×0.12→11). ADR·PM 문서에는 없다. SPEC §5.5 재생성 시 이 파생값이 표와 함께\n *   규범으로 승격된다 — 그 전까지는 잠정.\n *\n * **M0 T8 오버헤드 대사 (통합자 사전 검산, placement.js `overheadBreakdown(k)` 실계산과\n * 일치)**: V2 의 overhead 가 잠정 50 → 실계산 49 로 정정되며 데이터 셀이 167 → 168 로\n * 늘고(3의 배수), 이에 따라 사용 심볼 S 가 55 → **56** 으로 바뀐다. **nsym(L7/M14/H22) 은\n * 하나도 바뀌지 않는다** — M=14 는 56 기준으로도 패리티율이 정확히 25.0%(14/56)라\n * ADR §3.3.2 확정값을 그대로 재사용해도 비율 요건이 깨지지 않는다. V1(overhead 45→45,\n * symbols 27 불변)·V3(overhead 55→53, dataCells 276→278, residual 0→2 지만 ⌊278/3⌋=92\n * 로 symbols 92 불변)는 usedSymbols 자체가 바뀌지 않아 nsym 표를 그대로 쓴다.\n */\nexport const NSYM_TABLE = Object.freeze({\n  V1: Object.freeze({ symbols: 27, L: 3, M: 7, H: 11 }),\n  V2: Object.freeze({ symbols: 56, L: 7, M: 14, H: 22 }),\n  V3: Object.freeze({ symbols: 92, L: 11, M: 23, H: 37 }),\n});\n\n/** 복호 실패 예외. `reason` / `syndromes` 를 함께 싣는다. */\nexport class RSDecodeError extends Error {\n  constructor(message, details = {}) {\n    super(message);\n    this.name = 'RSDecodeError';\n    Object.assign(this, details);\n  }\n}\n\n// ── 입력 검증 ───────────────────────────────────────────────────────────\n\nfunction toSymbols(input, label) {\n  if (!Array.isArray(input) && !ArrayBuffer.isView(input)) {\n    throw new TypeError(`${label} 는 배열이어야 한다`);\n  }\n  const out = new Uint8Array(input.length);\n  for (let i = 0; i < input.length; i++) {\n    const v = input[i];\n    if (!Number.isInteger(v) || v < 0 || v >= P) {\n      throw new RangeError(`${label}[${i}] 는 0..${P - 1} 정수여야 한다: ${v}`);\n    }\n    out[i] = v;\n  }\n  return out;\n}\n\nfunction validateNsym(nsym) {\n  if (!Number.isInteger(nsym) || nsym < 1 || nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(`nsym 은 1..${MAX_CODEWORD_LEN} 정수여야 한다: ${nsym}`);\n  }\n}\n\nfunction validateFcr(fcr) {\n  if (!Number.isInteger(fcr) || fcr < 0) {\n    throw new RangeError(`fcr 은 0 이상 정수여야 한다: ${fcr}`);\n  }\n}\n\n// ── 용량 헬퍼 ───────────────────────────────────────────────────────────\n\n/** nsym 패리티로 정정 가능한 최대 심볼 오류 수 t = ⌊nsym/2⌋ */\nexport function errorCapacity(nsym) {\n  validateNsym(nsym);\n  return Math.floor(nsym / 2);\n}\n\n/** 주어진 nsym 에서 한 블록에 실을 수 있는 최대 데이터 심볼 수. n > 210 은 거부된다. */\nexport function maxDataLen(nsym) {\n  validateNsym(nsym);\n  return MAX_CODEWORD_LEN - nsym;\n}\n\n// ── 부호화 ──────────────────────────────────────────────────────────────\n\n/**\n * 생성 다항식 g(x) = ∏_{i=0}^{nsym-1} (x - α^(fcr+i)) — big-endian, 모닉.\n * **뺄셈이 실재한다**: (x - α^k) 의 상수항은 `sub(0, α^k)` = p - α^k 다\n * (`rs.js` 의 GF(2^8) 버전은 이 자리에서 `+`를 썼는데 표수 2 라서 우연히 맞았다).\n * @returns {Uint8Array} 길이 nsym + 1, g[0] === 1\n */\nexport function rsGeneratorPoly(nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  validateNsym(nsym);\n  validateFcr(fcr);\n  let g = Uint8Array.of(1);\n  for (let i = 0; i < nsym; i++) {\n    const root = alphaPow(fcr + i);\n    const factor = Uint8Array.of(1, sub(0, root)); // (x - root)\n    g = polyMulBE(g, factor);\n  }\n  return g;\n}\n\n/** big-endian 다항식 곱 (로컬 — gfp.js 의 polyMul 과 동일하지만 순환 의존 피하려 인라인하지 않고 재사용) */\nfunction polyMulBE(p, q) {\n  const out = new Uint8Array(p.length + q.length - 1);\n  for (let i = 0; i < p.length; i++) {\n    const pi = p[i];\n    if (pi === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(pi, q[j]));\n  }\n  return out;\n}\n\n/**\n * 체계적 RS 부호화. 코드워드 = 메시지 ‖ 패리티(nsym 심볼).\n * 표준 LFSR 합성제법: `msg ‖ 0*nsym` 을 g(x) 로 나눈 나머지를 msg 뒤에 붙인다.\n * **`sub` 를 쓴다** — GF(2^8) 판은 XOR 라 add/sub 구분이 없었지만 여기선 다르다.\n * @param {Uint8Array|number[]} msg\n * @param {number} nsym\n * @param {{fcr?: number, generator?: Uint8Array}} [options]\n * @returns {Uint8Array} 길이 msg.length + nsym\n */\nexport function rsEncode(msg, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR, generator } = options;\n  const data = toSymbols(msg, 'msg');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (data.length + nsym > MAX_CODEWORD_LEN) {\n    throw new RangeError(\n      `msg.length(${data.length}) + nsym(${nsym}) = ${data.length + nsym} > ${MAX_CODEWORD_LEN}`,\n    );\n  }\n  const g = generator ?? rsGeneratorPoly(nsym, { fcr });\n  if (g.length !== nsym + 1) {\n    throw new RangeError(`generator 차수가 nsym 과 다르다: deg=${g.length - 1}, nsym=${nsym}`);\n  }\n\n  const out = new Uint8Array(data.length + nsym);\n  out.set(data, 0);\n  // 합성 나눗셈: g[0] === 1(모닉)이므로 나눗셈 없이 곱셈만으로 나머지를 구한다.\n  // out 은 P(x) = msg(x)·x^nsym 을 나타내고(꼬리가 0으로 채워져 있으므로),\n  // 이 루프가 끝나면 out[data.length:] 에는 P(x) 를 g(x) 로 나눈 **나머지 r(x)** 가 남는다.\n  for (let i = 0; i < data.length; i++) {\n    const coef = out[i];\n    if (coef === 0) continue;\n    for (let j = 0; j < g.length; j++) {\n      out[i + j] = sub(out[i + j], mul(g[j], coef));\n    }\n  }\n  // 코드워드 = P(x) − r(x) 라야 g(x) 로 나누어떨어진다 → 패리티 = **−r**.\n  // ⚠ 표수 2(GF(2^8))에서는 −r = r 이라 이 부호가 안 보였다. 여기서 빠뜨리면\n  // \"나머지를 그대로 패리티로 쓰는\" 조용한 부호 버그가 된다 — 실제로 처음엔\n  // 이걸 놓쳐서 신드롬이 0이 되지 않았다(개발 중 실측).\n  for (let j = data.length; j < out.length; j++) {\n    out[j] = sub(0, out[j]);\n  }\n  // out[0..data.length) 는 위 루프에서 뭉개졌으므로 원 메시지로 복원한다.\n  out.set(data, 0);\n  return out;\n}\n\n/**\n * 신드롬 S_i = C(α^(fcr+i)), i = 0..nsym-1.\n * 유효 코드워드면 전부 0 이다 (RS 의 정의적 성질) — 이 성질 자체를 테스트로 검증한다.\n * @returns {Uint8Array} 길이 nsym\n */\nexport function rsSyndromes(codeword, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  const cw = toSymbols(codeword, 'codeword');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  const s = new Uint8Array(nsym);\n  for (let i = 0; i < nsym; i++) s[i] = polyEval(cw, alphaPow(fcr + i));\n  return s;\n}\n\n// ── 복호 내부: little-endian 다항식 헬퍼 ────────────────────────────────\n// Λ(x) = 1 + Λ1·x + Λ2·x² + ... 형태가 자연스러운 알고리즘(BM/Forney)만\n// little-endian(index i = x^i 계수) 을 쓴다. gfp.js 의 poly* 는 big-endian.\n\nfunction polyEvalLE(p, x) {\n  let y = 0;\n  let xp = 1;\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] !== 0) y = add(y, mul(p[i], xp));\n    xp = mul(xp, x);\n  }\n  return y;\n}\n\nfunction polyMulLE(p, q) {\n  const out = new Array(p.length + q.length - 1).fill(0);\n  for (let i = 0; i < p.length; i++) {\n    if (p[i] === 0) continue;\n    for (let j = 0; j < q.length; j++) out[i + j] = add(out[i + j], mul(p[i], q[j]));\n  }\n  return out;\n}\n\n/**\n * 형식적 미분 Λ'(x). **GF(p), p ≠ 2 에서는 일반 미적분과 같다** —\n * d/dx(Λ_k x^k) = (k mod p)·Λ_k·x^(k-1). GF(2^m) 의 \"홀수항만 남는다\" 트릭은\n * 표수 2 의 우연(짝수 k 는 k mod 2 = 0 이라 소멸)이고 여기서는 성립하지 않는다.\n */\nfunction polyDerivLE(p) {\n  const out = new Array(Math.max(p.length - 1, 1)).fill(0);\n  for (let k = 1; k < p.length; k++) {\n    out[k - 1] = mul(k % P, p[k]);\n  }\n  return out;\n}\n\n/**\n * Berlekamp-Massey. 신드롬열을 만드는 최단 LFSR 의 연결다항식 Λ(x) 를 찾는다.\n * 판별식 d 는 합(연산상 항상 덧셈 — 어느 체에서나 그렇다), 갱신식은 **뺄셈**을 쓴다:\n *   Λ_new(x) = Λ(x) − (d/b)·x^m·B(x)\n * (`rs.js` 의 GF(2^8) 판은 이 자리에서 XOR 를 썼는데 표수 2 라서 우연히 맞았다.)\n * @param {Uint8Array} synd 저차→고차 신드롬\n * @returns {{lambda: number[], L: number}} lambda 는 little-endian, lambda[0] === 1\n */\nfunction berlekampMassey(synd) {\n  let lambda = [1];\n  let B = [1];\n  let L = 0;\n  let m = 1;\n  let b = 1;\n\n  for (let n = 0; n < synd.length; n++) {\n    let d = synd[n];\n    for (let i = 1; i <= L; i++) {\n      if (i < lambda.length && lambda[i] !== 0) d = add(d, mul(lambda[i], synd[n - i]));\n    }\n\n    if (d === 0) {\n      m += 1;\n      continue;\n    }\n\n    const coef = div(d, b);\n    const prev = lambda.slice();\n    const need = B.length + m;\n    if (lambda.length < need) lambda = lambda.concat(new Array(need - lambda.length).fill(0));\n    for (let i = 0; i < B.length; i++) {\n      if (B[i] !== 0) lambda[i + m] = sub(lambda[i + m], mul(coef, B[i]));\n    }\n\n    if (2 * L <= n) {\n      L = n + 1 - L;\n      B = prev;\n      b = d;\n      m = 1;\n    } else {\n      m += 1;\n    }\n  }\n\n  while (lambda.length > 1 && lambda[lambda.length - 1] === 0) lambda.pop();\n  return { lambda, L };\n}\n\n/**\n * Chien 탐색. Λ(x) 의 근 x = X_k^{-1} 를 찾아 **코드워드 배열 인덱스** 로 환산한다.\n * big-endian 코드워드에서 배열 인덱스 j 는 x^(n-1-j) 항이므로 X_k = α^(n-1-j).\n * @returns {number[]} 오름차순 오류 위치(배열 인덱스)\n */\nfunction chienSearch(lambda, n) {\n  const positions = [];\n  for (let j = 0; j < n; j++) {\n    const p = n - 1 - j;\n    if (polyEvalLE(lambda, alphaPow(-p)) === 0) positions.push(j);\n  }\n  return positions;\n}\n\n/**\n * Forney 알고리즘으로 오류 크기를 구한다.\n *   Ω(x) = S(x)·Λ(x) mod x^nsym\n *   Y_k = − X_k^(1-fcr) · Ω(X_k^-1) / Λ'(X_k^-1)\n *\n * ⚠ **음의 부호가 실재한다.** GF(2^m) 판(`rs.js`)의 주석은 \"표수 2 이므로\n * 부호는 사라진다\" 고 적었고 그 자리에서 부호 없이 반환했다 — 여기서 그걸\n * 그대로 베끼면 모든 정정값이 부호 반전으로 틀린다. `sub(0, ...)` 로 반드시 음화한다.\n * @returns {(number|null)[]} positions 와 같은 순서의 오류 크기. 분모가 0 이면 null.\n */\nfunction forney(synd, lambda, positions, n, fcr) {\n  const S = Array.from(synd);\n  const full = polyMulLE(S, lambda);\n  const omega = full.slice(0, synd.length);\n  const dLambda = polyDerivLE(lambda);\n\n  return positions.map((j) => {\n    const p = n - 1 - j;\n    const Xinv = alphaPow(-p);\n    const denom = polyEvalLE(dLambda, Xinv);\n    if (denom === 0) return null;\n    const num = polyEvalLE(omega, Xinv);\n    let scale = 1;\n    const e = 1 - fcr;\n    if (e !== 0) {\n      const ee = ((e % MULTIPLICATIVE_ORDER) + MULTIPLICATIVE_ORDER) % MULTIPLICATIVE_ORDER;\n      scale = alphaPow(p * ee);\n    }\n    const magnitude = mul(scale, div(num, denom));\n    return sub(0, magnitude); // ← 소수체의 실재하는 부호\n  });\n}\n\n/**\n * RS 복호. t = ⌊nsym/2⌋ 개까지의 심볼 오류를 정정한다.\n *\n * 실패 검출(조용한 오정정을 막는 4중 관문):\n *   1. L(=degΛ 추정) > t\n *   2. Λ 차수와 BM 이 보고한 L 불일치\n *   3. Chien 탐색이 찾은 근의 개수 ≠ L\n *   4. 정정 적용 후 신드롬 재검산이 0 이 아님\n *\n * @param {Uint8Array|number[]} received 수신 코드워드 (메시지 ‖ 패리티)\n * @param {number} nsym\n * @param {{fcr?: number}} [options]\n * @returns {{ok:true, codeword:Uint8Array, message:Uint8Array, parity:Uint8Array,\n *            errorPositions:number[], errorCount:number, syndromes:Uint8Array}\n *         | {ok:false, reason:string, syndromes:Uint8Array, errorPositions:null}}\n */\nexport function rsDecode(received, nsym, options = {}) {\n  const { fcr = DEFAULT_FCR } = options;\n  const cw = toSymbols(received, 'received');\n  validateNsym(nsym);\n  validateFcr(fcr);\n  if (cw.length > MAX_CODEWORD_LEN) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 ${MAX_CODEWORD_LEN} 을 넘는다`);\n  }\n  if (cw.length <= nsym) {\n    throw new RangeError(`코드워드 길이(${cw.length})가 nsym(${nsym}) 이하다 — 메시지가 없다`);\n  }\n\n  const n = cw.length;\n  const t = Math.floor(nsym / 2);\n  const syndromes = rsSyndromes(cw, nsym, { fcr });\n\n  const fail = (reason) => ({ ok: false, reason, syndromes, errorPositions: null });\n  const succeed = (out, positions) => ({\n    ok: true,\n    codeword: out,\n    message: out.slice(0, n - nsym),\n    parity: out.slice(n - nsym),\n    errorPositions: positions,\n    errorCount: positions.length,\n    syndromes,\n  });\n\n  let clean = true;\n  for (let i = 0; i < syndromes.length; i++) {\n    if (syndromes[i] !== 0) {\n      clean = false;\n      break;\n    }\n  }\n  if (clean) return succeed(cw.slice(), []);\n\n  const { lambda, L } = berlekampMassey(syndromes);\n  if (L === 0 || L > t) {\n    return fail(`오류 개수가 정정 한계를 넘었다 (Berlekamp-Massey deg Λ = ${L}, t = ${t})`);\n  }\n  if (lambda.length - 1 !== L) {\n    return fail(`Λ 차수(${lambda.length - 1})와 LFSR 길이(${L})가 불일치 — 정정 불가`);\n  }\n\n  const positions = chienSearch(lambda, n);\n  if (positions.length !== L) {\n    return fail(`Chien 탐색이 Λ 의 근을 전부 찾지 못했다 (${positions.length}/${L}) — 정정 불가`);\n  }\n\n  const magnitudes = forney(syndromes, lambda, positions, n, fcr);\n  if (magnitudes.some((m) => m === null)) {\n    return fail('Forney 분모 Λ′(X^-1) = 0 — 정정 불가');\n  }\n\n  const out = cw.slice();\n  const changed = [];\n  for (let k = 0; k < positions.length; k++) {\n    if (magnitudes[k] === 0) continue;\n    // e_k = magnitudes[k] 는 received = true + E 의 오류값이다 → true = received − e_k\n    out[positions[k]] = sub(out[positions[k]], magnitudes[k]);\n    changed.push(positions[k]);\n  }\n\n  const after = rsSyndromes(out, nsym, { fcr });\n  for (let i = 0; i < after.length; i++) {\n    if (after[i] !== 0) {\n      return fail('정정 후에도 신드롬이 0 이 아니다 — 오류가 정정 한계를 넘었다');\n    }\n  }\n\n  return succeed(out, changed);\n}\n\n/**\n * `rsDecode` 의 예외 던지는 래퍼. 성공 시 메시지 심볼만 돌려준다.\n * @throws {RSDecodeError}\n */\nexport function rsDecodeMessage(received, nsym, options = {}) {\n  const result = rsDecode(received, nsym, options);\n  if (!result.ok) {\n    throw new RSDecodeError(`RS 복호 실패: ${result.reason}`, {\n      reason: result.reason,\n      syndromes: result.syndromes,\n    });\n  }\n  return result.message;\n}\n"],
  ["/src/capacity.js", "// capacity.js — 버전별 용량 산출 (SPEC §5.5, GF(211) 심볼 회계 — ADR 0001)\n//\n// **SPEC §5.5 의 표는 이 모듈의 생성물이다. 수기로 유지하지 않는다.**\n//\n// ADR 0001 §3.3.2/§3.3.3 결정: **nsym 은 공식이 아니라 표**. `rs211.js` 가 export 하는\n// `NSYM_TABLE` (2026-07-29 사용자 확정)을 그대로 입력으로 쓴다. `fitCodeword` 식 탐색과\n// `forceEven` 류 플래그는 여기 두지 않는다 — 그 조합이 ADR 본문에서 비대칭 비교 사고를\n// 두 번 냈다(§3.3.3).\n//\n// 회계는 심볼 도메인이다:\n//   데이터 심볼(셀) C = 총 셀 − 오버헤드\n//   사용 심볼        S = ⌊C / 3⌋   (잔여 셀 = C − 3S, 3의 배수가 안 되는 나머지 셀)\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE 표에서)\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (BigInt 정확 계산)\n//   순 페이로드       = K − 1  (헤더 1 B, header.js 의 maxPayloadFor 와 정합)\n//\n// [T8 완료] `overhead` 는 더 이상 잠정 상수가 아니다 — 불스아이(§5.1)·앵커(§5.2)·\n//      포맷 정보(§5.4)·레퍼런스 셀(§5.3) 배치가 전부 확정됐으므로 `placement.js` 의\n//      `overheadBreakdown(k)` 실계산 합을 그대로 쓴다(구성요소별 유도, 아래 참조).\n\nimport { cellCount } from '__TLSCAN_BLOB_008__';\nimport { NSYM_TABLE, errorCapacity } from '__TLSCAN_BLOB_027__';\nimport { HEADER_BYTES, maxPayloadFor } from '__TLSCAN_BLOB_007__';\nimport { overheadBreakdown } from '__TLSCAN_BLOB_019__';\n\n/**\n * 버전 정의. `overhead` 는 `placement.overheadBreakdown(k).total` 로 **유도**한다\n * (T8 이전엔 잠정 상수였다 — [P1] 이력 참조, 이제 내려감). `symbolKey` 는 `rs211.js` 의\n * `NSYM_TABLE` 조회 키.\n * @type {ReadonlyArray<{version: number, k: number, overhead: number, symbolKey: string}>}\n */\nexport const VERSIONS = Object.freeze([\n  Object.freeze({\n    version: 1, k: 6, overhead: overheadBreakdown(6).total, symbolKey: 'V1',\n  }),\n  Object.freeze({\n    version: 2, k: 8, overhead: overheadBreakdown(8).total, symbolKey: 'V2',\n  }),\n  Object.freeze({\n    version: 3, k: 10, overhead: overheadBreakdown(10).total, symbolKey: 'V3',\n  }),\n]);\n\n/**\n * S 개의 GF(211) 심볼이 손실 없이 담는 **최대** 바이트 수 K.\n * 정의: K = max{ k : 211^S >= 2^(8k) }. BigInt 로 정확히 계산한다(부동소수 반올림 회피).\n *\n * 주의: 이것은 base211.js 의 청크 회계(27 B ↔ 28 심볼 단위)가 아니라 **RS 데이터 심볼\n * 전체를 하나의 큰 자릿수로 본 직접 부등식**이다 — ADR §3.3.2/§3.3.3 이 정의한 K 가 이 값이다.\n *\n * @param {number} symbolCount S (0 이상 정수)\n * @returns {number} K (0 이상 정수)\n */\nexport function maxBytesForSymbols(symbolCount) {\n  if (!Number.isInteger(symbolCount) || symbolCount < 0) {\n    throw new RangeError(`심볼 개수는 0 이상 정수여야 한다: ${symbolCount}`);\n  }\n  const cap = 211n ** BigInt(symbolCount);\n  let k = 0;\n  while ((1n << BigInt(8 * (k + 1))) <= cap) k += 1;\n  return k;\n}\n\n/**\n * 한 버전의 용량 전체.\n * @param {{version: number, k: number, overhead: number, symbolKey: string}} spec\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityFor(spec, level = 'M') {\n  const totalCells = cellCount(spec.k);\n  const dataCells = totalCells - spec.overhead;\n  if (dataCells <= 0) {\n    throw new RangeError(`V${spec.version}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\n  }\n\n  const usedSymbols = Math.floor(dataCells / 3);\n  const residualCells = dataCells - usedSymbols * 3;\n\n  const table = NSYM_TABLE[spec.symbolKey];\n  if (!table) {\n    throw new RangeError(`V${spec.version}: rs211.js NSYM_TABLE 에 키 ${spec.symbolKey} 가 없다`);\n  }\n  if (table.symbols !== usedSymbols) {\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 오버헤드·k 가 표와 따로 놀고 있다는\n    // 신호다. 조용히 맞추지 않고 여기서 던진다(과제 지침 절대 규칙 6).\n    throw new RangeError(\n      `V${spec.version}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE.${spec.symbolKey}.symbols `\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\n    );\n  }\n\n  const nsym = table[level];\n  if (!Number.isInteger(nsym)) {\n    throw new RangeError(`V${spec.version}: NSYM_TABLE.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\n  }\n  const dataSymbols = usedSymbols - nsym;\n  if (dataSymbols <= 0) {\n    throw new RangeError(`V${spec.version}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\n  }\n\n  const dataBytes = maxBytesForSymbols(dataSymbols);\n\n  return {\n    version: spec.version,\n    k: spec.k,\n    totalCells,\n    overhead: spec.overhead,\n    dataCells,\n    usedSymbols,\n    residualCells,\n    level,\n    nsym,\n    errorCapacity: errorCapacity(nsym),\n    dataSymbols,\n    dataBytes,\n    maxPayloadBytes: maxPayloadFor(dataBytes),\n    headerBytes: HEADER_BYTES,\n  };\n}\n\n/**\n * 전 버전 용량표.\n * @param {'L'|'M'|'H'} [level]\n */\nexport function capacityTable(level = 'M') {\n  return VERSIONS.map((v) => capacityFor(v, level));\n}\n\n/**\n * SPEC §5.5 에 붙일 마크다운 표. 단일 물결표는 쓰지 않는다 (규약 §6.11).\n * @param {'L'|'M'|'H'} [level]\n * @returns {string}\n */\nexport function renderMarkdownTable(level = 'M') {\n  const rows = capacityTable(level);\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\n  const body = rows.map((r) => `| V${r.version} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B** |`);\n  return [head, sep, ...body].join('\\n');\n}\n"],
  ["/src/capacityA.js", "// capacityA.js — Type A 버전별 용량 산출 (ADR 0005 D5·D6, capacity.js/capacityY.js 대칭)\r\n//\r\n// **이 모듈이 SPEC 생성물 표의 소스다.** 수기로 유지\r\n// 하지 않는다.\r\n//\r\n// [A-U1 ✅ 확정 — 사용자 비준 2026-08-09, hb-20260809-tlrat1] `NSYM_TABLE_A` 는\r\n// ADR 0005 D5 실계산 절차(기존 rs211.js NSYM_TABLE 표 규칙 승계: M = round(0.25·S),\r\n// 짝수면 +1 홀수화 / L = round(0.12·S) / H = round(0.40·S))를 따르되, **A2/H 만\r\n// 절차값 57 대신 59** 다 — 57·58 은 base-211 청킹 비정렬로 생성 불가(아래 chunkAligned\r\n// 참조), 59 는 정렬·홀수·절차 최근접(|59−57.2|=1.8) 3조건 동시 만족 (비준 확정값):\r\n//   A0 S=45  → L 5 · M 11 (24.4%) · H 18   [ADR 0006 D6, 2026-08-09 비준]\r\n//   A1 S=89  → L 11 · M 23 (25.8%) · H 36\r\n//   A2 S=143 → L 17 · M 37 (25.9%) · H 59 (41.3% — 절차값 57 은 비정렬로 대체)\r\n//\r\n// [ADR 0006 D6 — A0 변 스크레이프 딱지] A0(k=6) 는 변 하나(각 19셀 = 3k+1)가 통째로\r\n// 소실되면 터치 RS 심볼이 **9/8/10** (R/B/L 변)이라 **t(H)=9 로도 L 변을 못 산다** —\r\n// 어떤 ECC 레벨도 변 전체 소실을 오류-전용 복호로 보장하지 못한다. H 강제의 유일한\r\n// 명분이 변 방어인데 그걸 못 사면서 순 페이로드만 31→25 B 로 과세하므로 **기본 M 유지**\r\n// (A1 전례 승계). 소거 회계로는 e ≤ nsym 이라 M(11) ≥ 10 — **P4(소거 복호) 구현이\r\n// A0 변 방어의 전제 조건**이다. M1-A 결합 스윕에 A0 를 포함한다.\r\n//\r\n// 회계는 capacity.js 와 동형이다(심볼 도메인):\r\n//   총 셀           total = (3k+1)(3k+2)/2  (D1 — 육각 3k²+3k+1 + 패치 3·k(k+1)/2)\r\n//   오버헤드         overhead = 불스아이 19 + 포맷 15 + 앵커 6(육각3+꼭짓점3) +\r\n//                     육각 레퍼런스 2(k−2) + 패치 레퍼런스(규칙 R, D4) — 실계산 합\r\n//                     (k=8 → 58 · k=10 → 65, D5 검산값과 정확히 일치해야 한다)\r\n//   데이터 심볼(셀)  C = total − overhead\r\n//   사용 심볼        S = ⌊C / 3⌋  (잔여 셀 = C − 3S)\r\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE_A 표에서)\r\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (capacity.js 의\r\n//                     `maxBytesForSymbols` 재사용 — BigInt 정확 계산, 전용 재구현 아님)\r\n//   순 페이로드       = K − 1  (헤더 1B, header.js 승계)\r\n//\r\n// [ADR 0006 D3 네임스페이스 — 2026-08-09 비준] formatIndex 는 **tri 패밀리 표**의\r\n// 값이다(4bit 는 격자 수립 경로별 독립 표). 1=A0 · 12=A1 · 13=A2, 중앙 QR 변형은\r\n// +2 오프셋으로 3=A0Q · 14=A1Q · 15=A2Q (encodeA.js 가 centerQr 옵션으로 적용).\r\n//\r\n// **A0 가 0 이 아닌 이유 (설계 불변식)**: tri 는 hex 코어를 좌표까지 그대로 포함\r\n// 한다(`dataCellsInScanOrder(6)` 82셀 == `dataCellsInScanOrderA(6)` 접두). 그래서\r\n// A0(k=6) 를 hex 표의 k=6 값에 배정하면 삼각 패치가 마모·가림됐을 때 hex 로 오판된\r\n// 가설이 격자·앵커·포맷·CRC·인덱스를 전부 \"정상 V1\"으로 통과시키고 페이로드를 그대로\r\n// 읽는다 — 완전 도플갱어 (몬테카를로 실측 오수락 2.7e-5/L, 설계 불변식 10⁻²⁰ 대비\r\n// 15자릿수 위반). ADR 0006 D3 축 분리 검사: **격자 파라미터 k 가 반드시 달라야 한다**\r\n// (k 가 다르면 샘플링 격자 자체가 어긋나 구조적으로 실패). hex 에서 k=6 인 값은\r\n// **0(V1)·4(V1Q) 둘뿐**이고, +2 쌍 불변식을 지키는 최저 안전쌍이 **1·3** 이다.\r\n// 파인더 종류(불스아이 vs 중앙 QR) 상이는 **단독 근거로 쓰지 않는다** — centerQr 은\r\n// 셀 기하를 전혀 안 바꾸므로(19셀 슬롯 동일) 디코더의 명시적 비교에만 의존한다.\r\n\r\nimport { cellCount } from '__TLSCAN_BLOB_008__';\r\nimport { symbolCountForByteLength } from '__TLSCAN_BLOB_000__';\r\nimport { maxBytesForSymbols } from '__TLSCAN_BLOB_028__';\r\nimport { errorCapacity } from '__TLSCAN_BLOB_027__';\r\nimport { HEADER_BYTES, maxPayloadFor } from '__TLSCAN_BLOB_007__';\r\nimport { occupiedCells } from '__TLSCAN_BLOB_009__';\r\nimport { anchorCells, formatCells, referenceCellsAll } from '__TLSCAN_BLOB_019__';\r\nimport { vertexAnchors, patchReferenceCells } from '__TLSCAN_BLOB_022__';\r\n\r\n/**\r\n * Type A 오버헤드 실계산(불스아이 19 + 포맷 15 + 앵커 6 + 육각 레퍼런스 2(k−2) +\r\n * 패치 레퍼런스). 하드코딩이 아니라 placement.js/placementA.js 실계산 합이다.\r\n * @param {number} k\r\n * @returns {{k:number, bullseye:number, anchor:number, format:number,\r\n *            hexReference:number, patchReference:number, total:number}}\r\n */\r\nexport function overheadBreakdownA(k) {\r\n  const bullseye = occupiedCells().length; // 19 (hexDistance<=2, k 무관)\r\n  const anchor = anchorCells(k).length + vertexAnchors(k).length; // 3 + 3 = 6\r\n  const format = formatCells(k).length; // 15 (k 무관)\r\n  const hexReference = referenceCellsAll(k).length; // 2(k-2)\r\n  const patchReference = patchReferenceCells(k).length; // 규칙 R, D4\r\n  const total = bullseye + anchor + format + hexReference + patchReference;\r\n  return {\r\n    k, bullseye, anchor, format, hexReference, patchReference, total,\r\n  };\r\n}\r\n\r\n// ADR 0005 D5 검산값 — 58(k=8)/65(k=10) · ADR 0006 D6 검산값 — 54(k=6).\r\n// \"조용히 맞추지 않는다\"(과제 지침 절대 규칙): 모듈 로드 시점에 실계산이 검산값과\r\n// 어긋나면 즉시 던진다.\r\nfor (const [k, expectedTotal] of [[6, 54], [8, 58], [10, 65]]) {\r\n  const actual = overheadBreakdownA(k).total;\r\n  if (actual !== expectedTotal) {\r\n    throw new Error(\r\n      `overheadBreakdownA(${k}) 실계산 불일치: ${actual} !== ADR 0005 D5 검산값 ${expectedTotal}`,\r\n    );\r\n  }\r\n}\r\n\r\n/**\r\n * [A-U1 ✅ 확정] Type A 사용 심볼 수 대비 ECC 레벨별 nsym 표 (사용자 비준\r\n * 2026-08-09). 산출 근거는 위 모듈 헤더 주석 (ADR 0005 D5).\r\n * @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>}\r\n */\r\nexport const NSYM_TABLE_A = Object.freeze({\r\n  A0: Object.freeze({\r\n    symbols: 45, L: 5, M: 11, H: 18,\r\n  }),\r\n  A1: Object.freeze({\r\n    symbols: 89, L: 11, M: 23, H: 36,\r\n  }),\r\n  A2: Object.freeze({\r\n    symbols: 143, L: 17, M: 37, H: 59,\r\n  }),\r\n});\r\n\r\n/**\r\n * 버전 정의. `overhead` 는 `overheadBreakdownA(k).total` 로 유도한다(하드코딩\r\n * 아님). `formatIndex` 는 tri 패밀리 표(1=A0·12=A1·13=A2, ADR 0006 D3) —\r\n * centerQr(A*Q) 는 encodeA.js 가 +2 오프셋으로 적용한다(3=A0Q·14=A1Q·15=A2Q).\r\n *\r\n * 배열 순서는 **용량 오름차순** — `chooseVersionA` 가 앞에서부터 훑어 최소 버전을\r\n * 고르므로 A0 가 선두여야 한다.\r\n * @type {ReadonlyArray<{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}>}\r\n */\r\nexport const VERSIONS_A = Object.freeze([\r\n  Object.freeze({\r\n    name: 'A0', version: 0, k: 6, formatIndex: 1, overhead: overheadBreakdownA(6).total, symbolKey: 'A0',\r\n  }),\r\n  Object.freeze({\r\n    name: 'A1', version: 1, k: 8, formatIndex: 12, overhead: overheadBreakdownA(8).total, symbolKey: 'A1',\r\n  }),\r\n  Object.freeze({\r\n    name: 'A2', version: 2, k: 10, formatIndex: 13, overhead: overheadBreakdownA(10).total, symbolKey: 'A2',\r\n  }),\r\n]);\r\n\r\n/**\r\n * version → VERSIONS_A 항목.\r\n * @param {number} version 0 | 1 | 2\r\n * @returns {{name:string, version:number, k:number, formatIndex:number, overhead:number, symbolKey:string}}\r\n */\r\nexport function versionSpecA(version) {\r\n  const spec = VERSIONS_A.find((v) => v.version === version);\r\n  if (!spec) {\r\n    throw new RangeError(\r\n      `알 수 없는 Type A 버전: ${version} (허용 ${VERSIONS_A.map((v) => `${v.name}(v${v.version})`).join(', ')})`,\r\n    );\r\n  }\r\n  return spec;\r\n}\r\n\r\n/**\r\n * 한 버전의 용량 전체. capacity.js `capacityFor` 회계를 그대로 승계한다.\r\n * @param {{version:number, k:number, overhead:number, symbolKey:string}} spec\r\n * @param {'L'|'M'|'H'} [level]\r\n */\r\nexport function capacityForA(spec, level = 'M') {\r\n  const label = spec.name || `A${spec.version}`;\r\n  const totalCells = (3 * spec.k + 1) * (3 * spec.k + 2) / 2;\r\n  // hexgrid.cellCount(k) + 패치 3·k(k+1)/2 와 항등이어야 한다(placementA.test.js 가\r\n  // 이 항등을 회귀 고정) — 여기서는 닫힌 형태로 직접 계산(D1)한다.\r\n  const dataCells = totalCells - spec.overhead;\r\n  if (dataCells <= 0) {\r\n    throw new RangeError(`${label}: 오버헤드 ${spec.overhead} 가 총 셀 ${totalCells} 이상이다`);\r\n  }\r\n\r\n  const usedSymbols = Math.floor(dataCells / 3);\r\n  const residualCells = dataCells - usedSymbols * 3;\r\n\r\n  const table = NSYM_TABLE_A[spec.symbolKey];\r\n  if (!table) {\r\n    throw new RangeError(`${label}: NSYM_TABLE_A 에 키 ${spec.symbolKey} 가 없다`);\r\n  }\r\n  if (table.symbols !== usedSymbols) {\r\n    // 표가 전제한 심볼 수와 실계산이 어긋난다 — 조용히 맞추지 않고 던진다\r\n    // (capacity.js `capacityFor` 와 동일한 규약 · 과제 지침 절대 규칙 6).\r\n    throw new RangeError(\r\n      `${label}: 실계산 사용 심볼 ${usedSymbols} 이 NSYM_TABLE_A.${spec.symbolKey}.symbols `\r\n      + `(${table.symbols}) 과 어긋난다 — overhead(${spec.overhead})/k(${spec.k}) 와 표가 불일치한다`,\r\n    );\r\n  }\r\n\r\n  const nsym = table[level];\r\n  if (!Number.isInteger(nsym)) {\r\n    throw new RangeError(`${label}: NSYM_TABLE_A.${spec.symbolKey} 에 레벨 ${level} 이 없다`);\r\n  }\r\n  const dataSymbols = usedSymbols - nsym;\r\n  if (dataSymbols <= 0) {\r\n    throw new RangeError(`${label}/${level}: nsym ${nsym} 이 사용 심볼 ${usedSymbols} 이상이다`);\r\n  }\r\n\r\n  const dataBytes = maxBytesForSymbols(dataSymbols);\r\n\r\n  // [발견 — 검증 라운드 2026-08-09] \"S개 심볼 = 하나의 큰 base-211 수\" K 산정과\r\n  // base211.js 의 27B↔28심볼 청크 인코더는 효율이 미세하게 달라, K 를 실제 청크\r\n  // 인코딩하면 dataSymbols 와 어긋나는 조합이 존재할 수 있다 (구 A2/H=57 이 그랬고,\r\n  // A-U1 비준으로 59 로 교체해 현행 표는 전 조합 정렬이다). 그런 조합은 encodeA.js\r\n  // 자기검증이 throw 하므로 **생산 불가**다 — 표가 미래에 다시 어긋나면 소비자가\r\n  // 정상 용량으로 게시하지 않도록 플래그를 유지한다 (가드).\r\n  const chunkAligned = symbolCountForByteLength(dataBytes) === dataSymbols;\r\n\r\n  return {\r\n    name: spec.name,\r\n    version: spec.version,\r\n    k: spec.k,\r\n    formatIndex: spec.formatIndex,\r\n    totalCells,\r\n    overhead: spec.overhead,\r\n    dataCells,\r\n    usedSymbols,\r\n    residualCells,\r\n    level,\r\n    nsym,\r\n    errorCapacity: errorCapacity(nsym),\r\n    dataSymbols,\r\n    dataBytes,\r\n    chunkAligned,\r\n    maxPayloadBytes: maxPayloadFor(dataBytes),\r\n    headerBytes: HEADER_BYTES,\r\n  };\r\n}\r\n\r\n/**\r\n * 전 버전 용량표.\r\n * @param {'L'|'M'|'H'} [level]\r\n */\r\nexport function capacityTableA(level = 'M') {\r\n  return VERSIONS_A.map((v) => capacityForA(v, level));\r\n}\r\n\r\n/**\r\n * SPEC 에 붙일 마크다운 표(향후 §14 대칭 절 생성용). 단일 물결표는 쓰지 않는다\r\n * (규약 §6.11).\r\n * @param {'L'|'M'|'H'} [level]\r\n * @returns {string}\r\n */\r\nexport function renderMarkdownTableA(level = 'M') {\r\n  const rows = capacityTableA(level);\r\n  const head = '| 버전 | k | 총 셀 | 오버헤드 | 데이터 셀 C | 사용 심볼 S | 잔여 셀 | ECC-'\r\n    + level + ' nsym | t | 데이터 심볼 | K | 순 페이로드 |';\r\n  const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|';\r\n  const body = rows.map((r) => `| ${r.name} | ${r.k} | ${r.totalCells} | ${r.overhead} | `\r\n    + `${r.dataCells} | ${r.usedSymbols} | ${r.residualCells} | ${r.nsym} | ${r.errorCapacity} | `\r\n    + `${r.dataSymbols} | ${r.dataBytes} B | **${r.maxPayloadBytes} B**`\r\n    + `${r.chunkAligned ? '' : ' ⚠ 청킹 비정렬 — 인코딩 불가 (nsym 재조정 필요)'} |`);\r\n  return [head, sep, ...body].join('\\n');\r\n}\r\n\r\n// 대조용: hexgrid.cellCount 는 육각부만(패치 미포함) 계산한다 — capacityA.test.js\r\n// 가 \"totalCells - cellCount(k) === 3*k*(k+1)/2(패치 셀 수)\" 항등을 검증할 때 쓴다.\r\nexport { cellCount as hexCellCount };\r\n"],
  ["/src/capacityY.js", "// capacityY.js — Type Y 버전별 용량 산출 (SPEC §14, ADR 0003 D7·U3·U9·v3.1§4b — capacity.js 대칭)\r\n//\r\n// **이 모듈이 SPEC §14 생성물 표의 소스다.** 수기로 유지하지\r\n// 않는다.\r\n//\r\n// [v3.1 §4b 2톤 메인 전환] VERSIONS_Y 는 이제 4항목이다 — n=21·25 각각에 톤 모드\r\n// (tones=2 2톤 메인 · tones=3 Y-T 옵션)가 곱해진다. **용량 회계는 tones 무관 동일**\r\n// (동일 base-6 심볼 알파벳 — 오버헤드·NSYM_TABLE_Y·페이로드 전부 n 에만 의존, tones\r\n// 는 digit→면 매핑(sceneY.js/tonemap.js/verifyY.js)만 바꾼다). 그래서 Y1 과 Y1T,\r\n// Y2 와 Y2T 는 formatIndex 만 다르고 나머지 용량 수치는 항상 완전히 같다 — 이 항등을\r\n// capacityY.test.js 가 회귀로 고정한다.\r\n//\r\n// [U3 ✅ 확정 — 사용자 비준 (ADR 0003 v3.1, 2026-08-09)] `NSYM_TABLE_Y` 는 Type O V3 전례(ADR 0001 §3.3.3: 오정정\r\n// 검출 여유 +1 로 홀수 nsym)를 따라 산출한 확정표다. 절차 (재현 가능 — 검증 라운드 정정):\r\n// **M = Math.round(0.25·S) (JS half-up), 결과가 짝수면 +1 홀수화 (홀수면 유지)**:\r\n//   Y0 S=47  → round(11.75) = 12 (짝수 → +1) = 13   [ADR 0006 D5, 2026-08-09 비준]\r\n//   Y1 S=138 → round(34.5) = 35 (홀수 → 유지)\r\n//   Y2 S=199 → round(49.75) = 50 (짝수 → +1) = 51\r\n// L = round(0.12·S), H = round(0.40·S) (반올림, 홀짝 보정 없음 — Type O NSYM_TABLE 의\r\n// L/H 열도 동일 절차).\r\n//\r\n// 회계는 capacity.js 와 동형이다(심볼 도메인):\r\n//   총 좌표(셀)     total = n²  (Type Y 는 3면 공통 좌표 격자 — 기하 곱셈 없이 n×n)\r\n//   오버헤드         overhead = placementY 레퍼런스 12셀 + 포맷 15셀 실계산 합(=27)\r\n//   데이터 심볼(셀)  C = total − overhead\r\n//   사용 심볼        S = ⌊C / 3⌋  (잔여 셀 = C − 3S)\r\n//   RS               S = 데이터심볼 + nsym  (nsym 은 NSYM_TABLE_Y 표에서)\r\n//   데이터 바이트     K = max{k : 211^(S−nsym) >= 2^(8k)}  (capacity.js 의\r\n//                     `maxBytesForSymbols` 를 그대로 재사용 — BigInt 정확 계산, Type Y\r\n//                     전용으로 다시 구현하지 않는다)\r\n//   순 페이로드       = K − 1  (헤더 1B, header.js 승계)\r\n\r\nimport { maxBytesForSymbols } from '__TLSCAN_BLOB_028__';\r\nimport { errorCapacity } from '__TLSCAN_BLOB_027__';\r\nimport { HEADER_BYTES, maxPayloadFor } from '__TLSCAN_BLOB_007__';\r\nimport {\r\n  referenceCellsAll, formatCells, referenceGroups, FORMAT_BLOCK_LENGTH,\r\n} from '__TLSCAN_BLOB_025__';\r\n\r\n/**\r\n * Type Y 오버헤드 실계산(레퍼런스 12셀 + 포맷 15셀). capacity.js 의\r\n * `overheadBreakdown(k).total` 과 동형 — 하드코딩 27 이 아니라 placementY 실계산이다.\r\n * @param {number} n\r\n * @returns {{n:number, reference:number, format:number, total:number}}\r\n */\r\nexport function overheadBreakdownY(n) {\r\n  const reference = referenceCellsAll(n).length;\r\n  const format = formatCells(n).length;\r\n  return { n, reference, format, total: reference + format };\r\n}\r\n\r\n/**\r\n * [U3 ✅ 확정] Type Y 사용 심볼 수 대비 ECC 레벨별 nsym 표. 산출 근거는 위 모듈 헤더 주석.\r\n * @type {Readonly<Record<string, Readonly<{symbols:number, L:number, M:number, H:number}>>>}\r\n */\r\nexport const NSYM_TABLE_Y = Object.freeze({\r\n  Y0: Object.freeze({\r\n    symbols: 47, L: 6, M: 13, H: 19,\r\n  }),\r\n  Y1: Object.freeze({\r\n    symbols: 138, L: 17, M: 35, H: 55,\r\n  }),\r\n  Y2: Object.freeze({\r\n    symbols: 199, L: 24, M: 51, H: 80,\r\n  }),\r\n});\r\n\r\n/**\r\n * 버전 정의. `overhead` 는 `overheadBreakdownY(n).total` 로 유도한다(하드코딩 아님).\r\n * 포맷 정보 버전 인덱스는 **cube 패밀리 표**의 값이다(ADR 0006 D1 — 4bit 는 격자\r\n * 수립 경로별 독립 표다): 0·8·9 = Y0·Y1·Y2(tones=2, 2톤 메인) · 2·10·11 =\r\n * Y0T·Y1T·Y2T(tones=3, Y-T 옵션). **변형(T)은 기본형 + 2** (ADR 0006 D3-5 쌍\r\n * 불변식). cube 는 불스아이도 중앙 QR 도 없어 hex/tri 가설이 격자를 못 세우므로\r\n * 축 분리 검사가 면제된다(D3-1) — 그래서 Y0 가 hex V1 과 같은 값 0 을 써도 안전하다.\r\n * `symbolKey` 는 NSYM_TABLE_Y 조회 키 — n 이 같으면(=용량 회계가 같으면) tones 와\r\n * 무관하게 같은 키를 쓴다(Y1T 도 'Y1').\r\n *\r\n * 배열 순서는 **tones 별 용량 오름차순** — `chooseVersionY` 가 앞에서부터 훑어\r\n * 최소 버전을 고르므로 Y0 가 각 tones 블록의 선두여야 한다.\r\n * @type {ReadonlyArray<{name:string, version:number, n:number, tones:2|3, formatIndex:number, overhead:number, symbolKey:string}>}\r\n */\r\nexport const VERSIONS_Y = Object.freeze([\r\n  Object.freeze({\r\n    name: 'Y0', version: 0, n: 13, tones: 2, formatIndex: 0, overhead: overheadBreakdownY(13).total, symbolKey: 'Y0',\r\n  }),\r\n  Object.freeze({\r\n    name: 'Y1', version: 1, n: 21, tones: 2, formatIndex: 8, overhead: overheadBreakdownY(21).total, sy
