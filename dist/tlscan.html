  ["/src/i18n.js", "/**\n * i18n.js — 생성기·스캐너 공용 **런타임 언어 전환 기구**.\n *\n * ⚠ 여기엔 문구가 없다. 사전(dictionary)은 각 페이지가 갖고, 이 파일은 \"고르고·기억하고·\n *    DOM 에 적용하는\" 기계만 담는다. 포맷 의미론과 무관하다.\n *\n * ## 왜 허브(tl.estre.so)와 방식이 다른가\n *\n * 허브는 언어별 **HTML 3벌을 생성**한다(`tools/build-hub.mjs`). 문서라서 언어별 URL 이\n * SEO 상 유리하고, 정적 파일이라 나누는 비용이 없다.\n *\n * 생성기·스캐너는 그렇게 못 한다. 둘 다 **단일 HTML 파일**로 배포되고(SPEC §8 — 생성기는\n * `file://` 로도 열려야 한다), 배포도 파일 하나를 index.html 로 마운트하는 구조다.\n * 언어별로 쪼개면 그 성질이 깨지고 compose 마운트도 언어 수만큼 늘어난다.\n * 그래서 **한 파일 안에서 런타임 전환**한다 — 새로고침 없이 바뀌는 건 덤이다.\n *\n * ## 자동 선택 규약 (허브와 동일)\n *\n * 브라우저 언어로 **첫 방문에만** 맞춘다. 사용자가 고르면 그 선택을 기억하고 다시는\n * 자동으로 바꾸지 않는다 — 매번 브라우저 언어를 따르면 고른 언어로 돌아올 수 없다.\n *\n * @module i18n\n */\n\nexport const SUPPORTED_LANGUAGES = ['ko', 'en', 'ja'];\nexport const DEFAULT_LANGUAGE = 'ko';\nconst STORAGE_KEY = 'tlcube-lang';\n\n/** 저장소가 막혀 있어도(사파리 프라이빗 등) 페이지는 그대로 동작해야 한다. */\nfunction readStored() {\n  try {\n    const value = localStorage.getItem(STORAGE_KEY);\n    return SUPPORTED_LANGUAGES.includes(value) ? value : null;\n  } catch {\n    return null;\n  }\n}\n\nfunction writeStored(lang) {\n  try {\n    localStorage.setItem(STORAGE_KEY, lang);\n  } catch {\n    // 기억하지 못할 뿐, 이번 세션의 전환은 정상 동작한다.\n  }\n}\n\n/**\n * 브라우저가 선호하는 언어 중 지원하는 첫 번째. 지역 부호는 버린다(`en-US` → `en`).\n * @param {string[]} [preferred] 주입 가능 — 테스트에서 `navigator` 없이 쓴다.\n */\nexport function detectLanguage(preferred) {\n  const list = preferred\n    || (typeof navigator === 'undefined'\n      ? []\n      : navigator.languages || [navigator.language]).filter(Boolean);\n  for (const raw of list) {\n    const code = String(raw).toLowerCase().split('-')[0];\n    if (SUPPORTED_LANGUAGES.includes(code)) return code;\n  }\n  return DEFAULT_LANGUAGE;\n}\n\n/** 저장된 선택이 있으면 그것, 없으면 브라우저 언어. */\nexport function initialLanguage(preferred) {\n  return readStored() || detectLanguage(preferred);\n}\n\n/**\n * 사전에서 키를 찾는다. 없으면 **한국어로 폴백**한다 — 번역이 빠져도 빈 화면이 되지\n * 않게. 그마저 없으면 키 자체를 돌려줘서 누락이 눈에 띄게 한다.\n */\nexport function translate(dictionaries, lang, key) {\n  const table = dictionaries[lang];\n  if (table && key in table) return table[key];\n  const base = dictionaries[DEFAULT_LANGUAGE];\n  if (base && key in base) return base[key];\n  return key;\n}\n\n/**\n * `data-i18n*` 표시가 붙은 요소를 현재 언어로 채운다.\n *\n *   data-i18n=\"key\"            → textContent\n *   data-i18n-html=\"key\"       → innerHTML (강조·줄바꿈이 든 문구용)\n *   data-i18n-attr=\"placeholder:key;aria-label:key2\"\n *\n * 부분 갱신이 가능하도록 root 를 받는다(결과 패널처럼 나중에 그려지는 영역).\n */\nexport function applyTranslations(root, dictionaries, lang) {\n  const scope = root || document;\n  const t = (key) => translate(dictionaries, lang, key);\n\n  scope.querySelectorAll('[data-i18n]').forEach((el) => {\n    el.textContent = t(el.getAttribute('data-i18n'));\n  });\n  // ⚠ innerHTML 은 **번들에 박힌 정적 사전**만 받는다. 사용자 입력·URL·스캔 결과 등\n  //   외부에서 온 문자열을 사전에 넣지 마라 — 그 순간 XSS 경로가 된다.\n  //   (사용자 입력을 보여주는 자리는 전부 textContent 를 쓴다.)\n  //   `<strong>`·`<br>` 같은 강조/줄바꿈 때문에 필요한 것이지 임의 HTML 용이 아니다.\n  scope.querySelectorAll('[data-i18n-html]').forEach((el) => {\n    el.innerHTML = t(el.getAttribute('data-i18n-html'));\n  });\n  scope.querySelectorAll('[data-i18n-attr]').forEach((el) => {\n    for (const pair of el.getAttribute('data-i18n-attr').split(';')) {\n      const [attr, key] = pair.split(':').map((s) => s && s.trim());\n      if (attr && key) el.setAttribute(attr, t(key));\n    }\n  });\n}\n\n/**\n * 페이지 하나의 i18n 상태.\n *\n * @param {Record<string, Record<string, string>>} dictionaries\n * @param {{onChange?: (lang: string) => void, documentElement?: HTMLElement}} [options]\n */\nexport function createI18n(dictionaries, options = {}) {\n  let lang = initialLanguage();\n\n  const state = {\n    get lang() { return lang; },\n    t(key) { return translate(dictionaries, lang, key); },\n    apply(root) { applyTranslations(root, dictionaries, lang); },\n    setLanguage(next, { remember = true } = {}) {\n      if (!SUPPORTED_LANGUAGES.includes(next) || next === lang) return;\n      lang = next;\n      if (remember) writeStored(next);\n      const html = options.documentElement\n        || (typeof document === 'undefined' ? null : document.documentElement);\n      if (html) html.setAttribute('lang', next);\n      applyTranslations(null, dictionaries, lang);\n      if (options.onChange) options.onChange(lang);\n    },\n  };\n\n  return state;\n}\n\n/**\n * 언어 선택 버튼들을 붙인다. 컨테이너에 `<button data-lang=\"ko\">` 들이 있다고 가정하고,\n * 현재 언어에 `aria-current` 를 세운다(허브의 링크판과 같은 표시 규약).\n */\nexport function wireLanguageSwitch(container, i18n) {\n  if (!container) return;\n  const buttons = [...container.querySelectorAll('[data-lang]')];\n  const sync = () => buttons.forEach((b) => {\n    const on = b.getAttribute('data-lang') === i18n.lang;\n    b.classList.toggle('active', on);\n    if (on) b.setAttribute('aria-current', 'true');\n    else b.removeAttribute('aria-current');\n  });\n  buttons.forEach((b) => b.addEventListener('click', () => {\n    i18n.setLanguage(b.getAttribute('data-lang'));\n    sync();\n  }));\n  sync();\n}\n"],
  ["/src/lehmer.js", "// lehmer.js — base-6 digit ↔ (T,L,R) 휘도 순위 매핑\n//\n// SPEC §4.1 계약:\n//   셀당 3면(T=상단, L=좌측, R=우측)에 서로 다른 휘도 순위 {0=어두움, 1=중간, 2=밝음}을\n//   배정한다. 3! = 6 가지 → 심볼 알파벳 = base-6 digit {0..5}.\n//\n// 이 모듈은 SPEC §4.1 의 표를 **하드코딩하지 않는다.** 표준 Lehmer 코드\n// (factorial number system) 로부터 알고리즘적으로 유도한다. 유도 규약은 다음 셋의 조합이며,\n// 이 조합만이 SPEC 표 6행 전부를 재현한다 (test/lehmer.test.js 가 이를 단언한다):\n//\n//   (1) factoradic 자릿수는 **최상위 우선**(MSD-first):\n//         d = L[0]·2! + L[1]·1! + L[2]·0!,  L[i] ∈ [0, n-1-i]\n//   (2) 알파벳은 면의 **정준 오름차순** [T, L, R] (인덱스 0,1,2)\n//   (3) Lehmer 가 뽑아낸 순열은 \"**밝은 면부터 어두운 면 순서**\"로 읽는다.\n//         → 위치 i 에 놓인 면의 순위 = (n-1) - i\n//\n// (3) 이 핵심이다. Lehmer 순열을 \"면별 순위\"로 곧이곧대로 읽으면 SPEC 표와 어긋난다\n// (그 둘은 서로 역순열 관계). \"순위별 면의 나열\"로 읽고 내림차순 순위를 배정해야\n// SPEC 표가 나온다.\n//\n// 유도 예 (d=3):\n//   factoradic(3) = [1,1,0]\n//   pool=[T,L,R] → L 선택 → pool=[T,R] → R 선택 → pool=[T] → T\n//   밝기순 나열 = [L, R, T]  → L=2(밝음), R=1(중간), T=0(어두움)\n//   → (T,L,R) = (0,2,1)   == SPEC §4.1 digit 3 ✓\n\n/** 면 라벨 정준 순서. 인덱스가 곧 Lehmer 알파벳의 순서다 (SPEC §3.2). */\nexport const FACES = Object.freeze(['T', 'L', 'R']);\n\n/** 면의 개수 n. 순열 개수 = n! = 6. */\nexport const FACE_COUNT = FACES.length;\n\n/** 심볼 알파벳 크기 = 3! = 6 (SPEC §4.1). */\nexport const RADIX = factorial(FACE_COUNT);\n\n/** 최대 순위 값 (2 = 가장 밝음). */\nexport const MAX_RANK = FACE_COUNT - 1;\n\n/** 팩토리얼. n 이 3 이라 재귀 깊이 걱정 없음. */\nfunction factorial(n) {\n  let acc = 1;\n  for (let i = 2; i <= n; i += 1) acc *= i;\n  return acc;\n}\n\n/**\n * digit → factoradic (Lehmer) 자릿수 배열. 최상위 우선.\n * L[i] ∈ [0, n-1-i], 가중치 (n-1-i)!.\n * @param {number} digit 0..n!-1\n * @param {number} n 원소 개수\n * @returns {number[]} 길이 n 의 Lehmer 코드\n */\nexport function toLehmerCode(digit, n = FACE_COUNT) {\n  assertDigit(digit);\n  const code = new Array(n);\n  let rest = digit;\n  for (let i = 0; i < n; i += 1) {\n    const weight = factorial(n - 1 - i);\n    code[i] = Math.floor(rest / weight);\n    rest -= code[i] * weight;\n  }\n  return code;\n}\n\n/**\n * factoradic (Lehmer) 자릿수 배열 → digit. `toLehmerCode` 의 역.\n * @param {number[]} code\n * @returns {number}\n */\nexport function fromLehmerCode(code) {\n  const n = code.length;\n  let digit = 0;\n  for (let i = 0; i < n; i += 1) {\n    const limit = n - 1 - i;\n    if (!Number.isInteger(code[i]) || code[i] < 0 || code[i] > limit) {\n      throw new RangeError(`Lehmer 코드 자릿수 범위 위반: code[${i}]=${code[i]}, 허용 0..${limit}`);\n    }\n    digit += code[i] * factorial(limit);\n  }\n  return digit;\n}\n\n/**\n * digit → 밝은 면부터 어두운 면 순서로 나열한 **면 인덱스 배열**.\n * 위 규약 (3) 의 중간 산출물이며, 렌더러 디버깅에 유용해 공개한다.\n * @param {number} digit 0..5\n * @returns {number[]} 예: digit 3 → [1, 2, 0]  (L, R, T 순으로 밝음)\n */\nexport function digitToBrightnessOrder(digit) {\n  const code = toLehmerCode(digit, FACE_COUNT);\n  // pool: 아직 배치되지 않은 면 인덱스 (정준 오름차순 유지)\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const order = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    order[i] = pool.splice(code[i], 1)[0];\n  }\n  return order;\n}\n\n/**\n * 밝기순 면 인덱스 배열 → digit. `digitToBrightnessOrder` 의 역.\n * @param {number[]} order\n * @returns {number}\n */\nexport function brightnessOrderToDigit(order) {\n  assertPermutation(order, FACE_COUNT, '밝기 순서');\n  const pool = [];\n  for (let i = 0; i < FACE_COUNT; i += 1) pool.push(i);\n  const code = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    const at = pool.indexOf(order[i]);\n    code[i] = at;\n    pool.splice(at, 1);\n  }\n  return fromLehmerCode(code);\n}\n\n/**\n * SPEC §4.1: digit → 각 면의 휘도 순위.\n * @param {number} digit 0..5\n * @returns {{T: number, L: number, R: number}} 각 값은 {0,1,2} 의 순열\n */\nexport function digitToRanks(digit) {\n  const order = digitToBrightnessOrder(digit);\n  const byFace = new Array(FACE_COUNT);\n  for (let i = 0; i < FACE_COUNT; i += 1) {\n    // 위치 i 는 i 번째로 밝은 면 → 순위 = MAX_RANK - i\n    byFace[order[i]] = MAX_RANK - i;\n  }\n  // 키 삽입 순서는 반드시 정준 FACES 순서 ['T','L','R'] 여야 한다.\n  // 밝기 순서대로 삽입하면 digit 마다 키 순서가 달라져 (a) Object.values() 가\n  // 어떤 digit 이든 항상 [2,1,0] 을 내고 (b) JSON.stringify 결과가 digit 별로\n  // 갈린다. M0 완료 기준이 \"동일 입력 → 결정적 출력\" 이라 여기가 정확히 함정이다.\n  const ranks = {};\n  for (let i = 0; i < FACE_COUNT; i += 1) ranks[FACES[i]] = byFace[i];\n  return ranks;\n}\n\n/**\n * SPEC §4.1 의 역: 각 면의 휘도 순위 → digit.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number} 0..5\n */\nexport function ranksToDigit(ranks) {\n  const arr = ranksToArray(ranks);\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  // 순위 배열의 역: 순위 r 을 가진 면이 (MAX_RANK - r) 번째로 밝다\n  const order = new Array(FACE_COUNT);\n  for (let f = 0; f < FACE_COUNT; f += 1) {\n    order[MAX_RANK - arr[f]] = f;\n  }\n  return brightnessOrderToDigit(order);\n}\n\n/**\n * 순위 객체 → 정준 순서(T,L,R) 배열. 렌더러/디코더가 배열 형태를 선호할 때 사용.\n * @param {{T: number, L: number, R: number}} ranks\n * @returns {number[]}\n */\nexport function ranksToArray(ranks) {\n  if (ranks === null || typeof ranks !== 'object') {\n    throw new TypeError('순위는 {T,L,R} 객체여야 한다');\n  }\n  return FACES.map((face) => ranks[face]);\n}\n\n/**\n * 정준 순서(T,L,R) 배열 → 순위 객체.\n * @param {number[]} arr\n * @returns {{T: number, L: number, R: number}}\n */\nexport function arrayToRanks(arr) {\n  assertPermutation(arr, FACE_COUNT, '면 순위');\n  const ranks = {};\n  FACES.forEach((face, i) => { ranks[face] = arr[i]; });\n  return ranks;\n}\n\n/**\n * 순위 객체가 유효한가 ({0..2} 의 순열인가).\n * @param {unknown} ranks\n * @returns {boolean}\n */\nexport function isValidRanks(ranks) {\n  try {\n    assertPermutation(ranksToArray(/** @type {any} */ (ranks)), FACE_COUNT, '면 순위');\n    return true;\n  } catch {\n    return false;\n  }\n}\n\n/**\n * 유도된 매핑 표 전체 (digit 0..5). 테스트·문서·디버깅용.\n * @returns {{digit: number, ranks: {T: number, L: number, R: number}}[]}\n */\nexport function mappingTable() {\n  const rows = [];\n  for (let d = 0; d < RADIX; d += 1) rows.push({ digit: d, ranks: digitToRanks(d) });\n  return rows;\n}\n\nfunction assertDigit(digit) {\n  if (!Number.isInteger(digit) || digit < 0 || digit >= RADIX) {\n    throw new RangeError(`digit 범위 위반: ${digit} (허용 0..${RADIX - 1})`);\n  }\n}\n\nfunction assertPermutation(arr, n, what) {\n  if (!Array.isArray(arr) || arr.length !== n) {\n    throw new TypeError(`${what}는 길이 ${n} 배열이어야 한다`);\n  }\n  const seen = new Set();\n  for (const v of arr) {\n    if (!Number.isInteger(v) || v < 0 || v >= n) {\n      throw new RangeError(`${what} 원소 범위 위반: ${v} (허용 0..${n - 1})`);\n    }\n    if (seen.has(v)) throw new RangeError(`${what}에 중복 값: ${v}`);\n    seen.add(v);\n  }\n}\n"],
  ["/src/luminance.js", "/**\n * luminance.js — 휘도 레벨 프리셋 (SPEC §4.4, §5.1, §7.2)\n *\n * SPEC §4.4 계약 요지:\n * - 면의 휘도값은 §7.2 샘플 원판(내접원 부분 영역) 안의 상대휘도 **median** 이다.\n *   면 평균이 아니다. 이 모듈의 프리셋은 면을 평면 단색으로 채우는 것을 전제하므로\n *   (렌더러 책임 — 그라디언트·텍스처 없음) 원판 median = 그 색 자체의 상대휘도와 같다.\n *   즉 여기서 정의하는 레벨 Y 값이 곧 §7.2 계약 통계다.\n * - 순위 간 최소 분리폭: sRGB 상대휘도 Y 기준 Δmin >= 0.12 (0..1). 절대값·색상 선택은\n *   자유(§9) — 계약은 median 기준 순서와 분리폭뿐이다.\n * - SPEC §5.1: 불스아이는 파인더 마커라 Δmin 계약과 무관. 최대 대비 0.0/1.0 고정.\n *\n * RGB 리터럴은 런타임 솔버가 아니라 스크래치 계산(node -e, repo 밖)으로 실측해\n * 요건을 만족시킨 뒤 상수로 박아 넣었다 (결정성 — M0 완료 기준). 유도 근거는\n * 각 리터럴 옆 주석에 남긴다.\n */\n\nimport { digitToRanks } from '__TLSCAN_BLOB_014__';\n\n/** SPEC §4.4 계약: 순위 간 최소 분리폭 (sRGB 상대휘도 Y, 0..1). */\nexport const DELTA_MIN_CONTRACT = 0.12;\n\n/**\n * 프리셋 저자 품질 바 — SPEC 최소치(0.12)보다 여유를 둔 내부 기준. 기존\n * 'slate' 테스트가 이미 이 값을 관례로 썼다(>= 0.15) — 신규 프리셋도 동일 바를\n * 모듈 로드 시 자동 단언한다(수기 스크래치 검증에 의존하지 않는다).\n */\nexport const PRESET_DELTA_MIN = 0.15;\n\n/** SPEC §14 U17: 2톤 렌더용 최소 대비비 ρ = Y(levels[2]) / Y(levels[0]). */\nexport const RHO_MIN_CONTRACT = 10;\n\n/** 프리셋 배경과 각 레벨 사이 최소 분리 (Y, 0..1) — 기존 slate 관례를 일반화. */\nexport const PRESET_BG_SEPARATION_MIN = 0.05;\n\n/** SPEC §5.1: 불스아이 파인더 마커 — 최대 대비, Δmin 계약과 무관. */\nexport const BULLSEYE_DARK = Object.freeze({ r: 0, g: 0, b: 0 });\nexport const BULLSEYE_LIGHT = Object.freeze({ r: 255, g: 255, b: 255 });\n\n/**\n * sRGB 8bit 채널 → 선형 채널. IEC 61966-2-1 (sRGB 표준 EOTF).\n * @param {number} v8 0..255 정수\n * @returns {number} 0..1\n */\n/**\n * 0..255 정수 입력에 대한 사전 계산 표.\n *\n * 정의역이 **정확히 256개**라 표가 실수 계산을 완전히 대체한다 — 근사가 아니라 같은 식을\n * 미리 돌려 담은 것이므로 **비트 단위로 동일**하다.\n *\n * 왜 필요한가: 복호는 픽셀마다 이 함수를 3번 부른다. 1440×1920 프레임이면 약 830만 번의\n * `Math.pow` 다. 실측 프로파일에서 이 함수 하나가 self 7.5% 를 먹었다(2026-08-11).\n */\nconst SRGB_TO_LINEAR = new Float64Array(256);\nfor (let v = 0; v < 256; v += 1) {\n  const c = v / 255;\n  SRGB_TO_LINEAR[v] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;\n}\n\nexport function srgbChannelToLinear(v8) {\n  // 표는 0..255 **정수**에만 쓴다. 렌더 경로(sceneY 의 게인 보정 등)가 소수를 넘길 수\n  // 있는데, 그때 반올림해서 표를 쓰면 값이 조용히 달라진다.\n  if (Number.isInteger(v8) && v8 >= 0 && v8 <= 255) return SRGB_TO_LINEAR[v8];\n  const c = v8 / 255;\n  return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;\n}\n\n/**\n * sRGB 8bit {r,g,b} → 상대휘도 Y (ITU-R BT.709 계수, 선형화 후 가중합).\n * SPEC §4.4 의 \"sRGB 상대휘도\" 정의.\n * @param {{r: number, g: number, b: number}} rgb\n * @returns {number} 0..1\n */\nexport function relativeLuminance(rgb) {\n  return (\n    0.2126 * srgbChannelToLinear(rgb.r) +\n    0.7152 * srgbChannelToLinear(rgb.g) +\n    0.0722 * srgbChannelToLinear(rgb.b)\n  );\n}\n\n/**\n * `relativeLuminance` 의 8비트 전용 진입점 — 채널을 **0..255 정수로 이미 아는**\n * 자리에서만 쓴다 (canvas RGBA 등).\n *\n * 같은 `SRGB_TO_LINEAR` 표와 같은 계수·같은 덧셈 순서를 쓰므로 정수 입력에 대해\n * `relativeLuminance({r,g,b})` 와 **비트 단위로 같은 값**이다. 차이는 채널마다\n * 하던 `Number.isInteger` 가드와 인자 객체가 없다는 것뿐이다 — 픽셀당 3회씩,\n * 1440×1920 이면 830만 번의 가드였다.\n */\nexport function relativeLuminance8(r8, g8, b8) {\n  return (\n    0.2126 * SRGB_TO_LINEAR[r8] +\n    0.7152 * SRGB_TO_LINEAR[g8] +\n    0.0722 * SRGB_TO_LINEAR[b8]\n  );\n}\n\n/**\n * slate 프리셋 — 단색조 슬레이트 블루. 파랑 채널 우세·저채도로 \"어두운 배경 위에\n * 뜬 아이소메트릭 큐브 필드\" 인상을 노린다. 최상위 레벨(rank 2)은 흰색 쪽으로\n * 탈채도해 Y 를 끌어올렸다 (파랑 우세 색만으로는 Y 0.72 이상이 물리적으로 불가 —\n * 청색 BT.709 계수가 0.0722 로 가장 작기 때문).\n *\n * 실측 Y (node -e 스크래치 계산, repo 밖):\n *   background {14,16,24}   → Y ≈ 0.0053\n *   levels[0]  {58,68,108}  → Y ≈ 0.0612   (background 와 분리 ≈ 0.0559 >= 0.05)\n *   levels[1]  {110,135,190}→ Y ≈ 0.2436   (levels[0] 과 분리 ≈ 0.1824 >= 0.15)\n *   levels[2]  {220,228,240}→ Y ≈ 0.7699   (levels[1] 과 분리 ≈ 0.5263 >= 0.15)\n * presetDeltaMin('slate') = min(0.1824, 0.5263) ≈ 0.1824 >= 0.15 (계약 0.12 + 여유).\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.7699/0.0612 ≈ 12.58 >= 10 (U17).\n */\nconst SLATE = Object.freeze({\n  name: 'slate',\n  label: '슬레이트 블루 (Slate Blue)',\n  background: Object.freeze({ r: 14, g: 16, b: 24 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 58, g: 68, b: 108 }), // rank 0 (어두움)\n    Object.freeze({ r: 110, g: 135, b: 190 }), // rank 1 (중간)\n    Object.freeze({ r: 220, g: 228, b: 240 }), // rank 2 (밝음)\n  ]),\n});\n\n/**\n * ember 프리셋 — 웜 앰버·다크 브라운. 노을/불빛 톤 인상. 실측 Y (node -e 스크래치,\n * repo 밖):\n *   background {18,11,7}    → Y ≈ 0.0038\n *   levels[0]  {108,52,16}  → Y ≈ 0.0568  (bg 분리 ≈ 0.0530 >= 0.05)\n *   levels[1]  {200,120,40} → Y ≈ 0.2587  (levels[0] 분리 ≈ 0.2018)\n *   levels[2]  {255,210,140}→ Y ≈ 0.6925  (levels[1] 분리 ≈ 0.4338)\n * presetDeltaMin('ember') = min(0.2018, 0.4338) ≈ 0.2018 >= 0.15.\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.6925/0.0568 ≈ 12.19 >= 10 (U17).\n */\nconst EMBER = Object.freeze({\n  name: 'ember',\n  label: '엠버 (Ember)',\n  background: Object.freeze({ r: 18, g: 11, b: 7 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 108, g: 52, b: 16 }), // rank 0 (어두움)\n    Object.freeze({ r: 200, g: 120, b: 40 }), // rank 1 (중간)\n    Object.freeze({ r: 255, g: 210, b: 140 }), // rank 2 (밝음)\n  ]),\n});\n\n/**\n * mono 프리셋 — 무채색 그레이. 인쇄 안전(단색 인쇄에서도 순위 판별 가능). 실측 Y\n * (node -e 스크래치, repo 밖):\n *   background {16,16,16}   → Y ≈ 0.0052\n *   levels[0]  {70,70,70}   → Y ≈ 0.0612  (bg 분리 ≈ 0.0561 >= 0.05)\n *   levels[1]  {150,150,150}→ Y ≈ 0.3050  (levels[0] 분리 ≈ 0.2437)\n *   levels[2]  {245,245,245}→ Y ≈ 0.9131  (levels[1] 분리 ≈ 0.6081)\n * presetDeltaMin('mono') = min(0.2437, 0.6081) ≈ 0.2437 >= 0.15.\n * ρ = Y(levels[2])/Y(levels[0]) ≈ 0.9131/0.0612 ≈ 14.91 >= 10 (U17).\n */\nconst MONO = Object.freeze({\n  name: 'mono',\n  label: '모노 (Mono, 인쇄 안전)',\n  background: Object.freeze({ r: 16, g: 16, b: 16 }),\n  levels: Object.freeze([\n    Object.freeze({ r: 70, g: 70, b: 70 }), // rank 0 (어두움)\n    Object.freeze({ r: 150, g: 150, b: 150 }), // rank 1 (중간)\n    Object.freeze({ r: 245, g: 245, b: 245 }), // rank 2 (밝음)\n  ]),\n});\n\nexport const PRESETS = Object.freeze({\n  slate: SLATE,\n  ember: EMBER,\n  mono: MONO,\n});\n\n/** 기본 프리셋 이름. */\nexport const DEFAULT_PRESET = 'slate';\n\n/**\n * 프리셋 조회.\n * @param {string} name\n * @returns {{name: string, label: string, background: {r,g,b}, levels: {r,g,b}[]}}\n */\nexport function getPreset(name) {\n  if (!Object.prototype.hasOwnProperty.call(PRESETS, name)) {\n    throw new RangeError(`등록되지 않은 프리셋: ${name} (허용: ${Object.keys(PRESETS).join(', ')})`);\n  }\n  return PRESETS[name];\n}\n\n/**\n * 프리셋의 레벨 3개를 실측 상대휘도로 변환. rank 0→2 순서(오름차순)를 유지한다.\n * @param {string} name\n * @returns {[number, number, number]}\n */\nexport function presetLuminances(name) {\n  const preset = getPreset(name);\n  return preset.levels.map((rgb) => relativeLuminance(rgb));\n}\n\n/**\n * 프리셋의 인접 순위 간 최소 분리폭 (SPEC §4.4 Δmin 계약 검증용).\n * @param {string} name\n * @returns {number}\n */\nexport function presetDeltaMin(name) {\n  const [y0, y1, y2] = presetLuminances(name);\n  return Math.min(y1 - y0, y2 - y1);\n}\n\n/**\n * 프리셋의 2톤 대비비 ρ = Y(levels[2]) / Y(levels[0]) (SPEC §14 U17 계약 검증용).\n * @param {string} name\n * @returns {number}\n */\nexport function presetRho(name) {\n  const [y0, , y2] = presetLuminances(name);\n  return y2 / y0;\n}\n\n/**\n * 프리셋 배경과 레벨들 사이 최소 분리 (Y, 0..1).\n * @param {string} name\n * @returns {number}\n */\nexport function presetBackgroundSeparation(name) {\n  const preset = getPreset(name);\n  const bgY = relativeLuminance(preset.background);\n  const ys = presetLuminances(name);\n  return Math.min(...ys.map((y) => y - bgY));\n}\n\n/**\n * 프리셋 계약 3종을 단언한다 (① 3톤 Δmin >= PRESET_DELTA_MIN ② 2톤 ρ >=\n * RHO_MIN_CONTRACT ③ 배경 분리 >= PRESET_BG_SEPARATION_MIN). 위반 시 던진다 —\n * 모듈 로드 시(아래) 전 프리셋에 대해 자동 실행되므로, 신규 프리셋을 추가하면서\n * 계약을 어기면 import 시점에 즉시 드러난다(수기 스크래치 검증에만 의존하지 않는다).\n * @param {string} name\n */\nexport function assertPresetContract(name) {\n  const deltaMin = presetDeltaMin(name);\n  if (!(deltaMin >= PRESET_DELTA_MIN)) {\n    throw new Error(`프리셋 '${name}': Δmin=${deltaMin} 가 PRESET_DELTA_MIN(${PRESET_DELTA_MIN}) 미만이다`);\n  }\n  const rho = presetRho(name);\n  if (!(rho >= RHO_MIN_CONTRACT)) {\n    throw new Error(`프리셋 '${name}': ρ=${rho} 가 RHO_MIN_CONTRACT(${RHO_MIN_CONTRACT}) 미만이다`);\n  }\n  const bgSep = presetBackgroundSeparation(name);\n  if (!(bgSep >= PRESET_BG_SEPARATION_MIN)) {\n    throw new Error(`프리셋 '${name}': 배경 분리=${bgSep} 가 PRESET_BG_SEPARATION_MIN(${PRESET_BG_SEPARATION_MIN}) 미만이다`);\n  }\n}\n\n// 모듈 로드 시 전 프리셋 자동 단언 — 등록된 프리셋이 계약을 어기면 import 시점에\n// 즉시 터진다(런타임 호출 전에 잡는다, sceneY.js의 DEFAULT_FACE_GAINS 자기단언과\n// 동일 패턴).\nfor (const presetName of Object.keys(PRESETS)) {\n  assertPresetContract(presetName);\n}\n\n/**\n * digit → 각 면의 실제 색상. digitToRanks(digit) 로 (T,L,R) 순위를 얻어\n * 프리셋의 levels[rank] 에 매핑한다.\n * @param {number} digit 0..5\n * @param {string} name 프리셋 이름\n * @returns {{T: {r,g,b}, L: {r,g,b}, R: {r,g,b}}}\n */\nexport function faceColors(digit, name) {\n  const preset = getPreset(name);\n  const ranks = digitToRanks(digit);\n  return {\n    T: preset.levels[ranks.T],\n    L: preset.levels[ranks.L],\n    R: preset.levels[ranks.R],\n  };\n}\n"],
  ["/src/decoder/luma.js", "/**\n * luma.js — 입력 RGBA를 디코더 공통 상대휘도 필드로 변환한다.\n *\n * 상대휘도는 이 단계에서 한 번만 계산한다. 이후 검출기와 샘플러가 서로 다른\n * 회색조 공식을 쓰면, 같은 셀을 두고도 서로 다른 순위 결론에 이를 수 있기\n * 때문이다. 따라서 계산은 반드시 ../luminance.js의 relativeLuminance 경유로\n * 한다. 그 함수가 같은 모듈의 srgbChannelToLinear를 호출하므로, sRGB 전이\n * 함수도 렌더러와 정확히 하나의 구현을 공유한다.\n *\n * @module decoder/luma\n */\n\nimport { relativeLuminance8 } from '__TLSCAN_BLOB_015__';\nimport {\n  FRONTEND_FAILURE,\n  assertLumaField,\n  fail,\n} from '__TLSCAN_BLOB_002__';\n\n/** 설계 §4.2: 전체 정렬 대신 고정 histogram으로 percentile을 근사한다. */\nexport const PERCENTILE_HISTOGRAM_BINS = 4096;\n\n/** 설계 §4.1의 robust range 항목 순서. */\nexport const DEFAULT_ROBUST_QUANTILES = Object.freeze([0.01, 0.5, 0.99]);\n\n// [미검증] M1 calibration 에서 확정: 설계 §4.3의 초기 저동적범위 조기 실패값이다.\nexport const LOW_DYNAMIC_RANGE_MIN = 0.08;\n\n/**\n * RasterRGBA의 API 오류도 앞단 예외로 흘리지 않는다. contracts.js에 별도\n * INVALID_RASTER 코드가 아직 없으므로 EMPTY_INPUT의 detail에 정확한 원인을 남긴다.\n * @param {string} issue\n * @param {object} [detail]\n */\nfunction invalidRaster(issue, detail = {}) {\n  return fail(FRONTEND_FAILURE.EMPTY_INPUT, { issue, ...detail });\n}\n\n/**\n * LumaField는 alpha를 Uint8Array로 약속하지만 assertLumaField는 data 중심의\n * 최소 검사만 한다. percentile 계산 전에 alpha의 길이도 함께 확인해야 투명\n * 마스크가 한 픽셀씩 밀리는 조용한 오류를 막을 수 있다.\n * @param {object} luma\n * @returns {boolean}\n */\nfunction hasValidLumaField(luma) {\n  try {\n    assertLumaField(luma);\n  } catch {\n    return false;\n  }\n\n  return (\n    luma.alpha === null\n    || luma.alpha === undefined\n    || (luma.alpha instanceof Uint8Array && luma.alpha.length === luma.data.length)\n  );\n}\n\n/**\n * 입력 quantile을 결정적으로 정규화한다.\n * @param {readonly number[] | ArrayLike<number> | undefined} quantiles\n * @returns {number[] | null}\n */\nfunction normalizeQuantiles(quantiles) {\n  const source = quantiles === undefined ? DEFAULT_ROBUST_QUANTILES : quantiles;\n  if (\n    !Array.isArray(source)\n    && !(typeof ArrayBuffer !== 'undefined' && ArrayBuffer.isView(source))\n  ) {\n    return null;\n  }\n\n  const normalized = Array.from(source);\n  if (normalized.length === 0) return null;\n  for (const quantile of normalized) {\n    if (!Number.isFinite(quantile) || quantile < 0 || quantile > 1) return null;\n  }\n  return normalized;\n}\n\n/**\n * alpha=0은 배경 마스크다. RGB가 남아 있어도 합성 배경을 추측하지 않으므로\n * robust range의 표본으로 세지 않는다. alpha가 null이면 모든 표본이 유효하다.\n * @param {{data: Float32Array, alpha: Uint8Array | null | undefined}} luma\n * @returns {number}\n */\nfunction opaqueSampleCount(luma) {\n  if (luma.alpha === null || luma.alpha === undefined) return luma.data.length;\n  let count = 0;\n  for (let i = 0; i < luma.alpha.length; i += 1) {\n    if (luma.alpha[i] !== 0) count += 1;\n  }\n  return count;\n}\n\n/*\n * histogram 은 quantile 과 무관하다 — 같은 LumaField 면 같은 표다.\n *\n * 한 복호에서 `robustPercentiles` 는 최소 두 번 불린다(`toRelativeLuminance` 의\n * 동적범위 검사, `outlineEvidence` 의 전경 임계값). 그때마다 전 픽셀을 다시 훑을\n * 이유가 없다. grid-sample 의 표본 캐시와 같은 «LumaField = 불변» 전제를 따른다.\n */\nconst percentileHistogramCache = new WeakMap();\nconst PERCENTILE_HISTOGRAM_INVALID = Object.freeze({ invalid: true });\n\nfunction percentileHistogram(luma) {\n  const cached = percentileHistogramCache.get(luma);\n  if (cached !== undefined) return cached;\n\n  const histogram = new Uint32Array(PERCENTILE_HISTOGRAM_BINS);\n  const { data, alpha } = luma;\n  const length = data.length;\n  const hasAlpha = alpha !== null && alpha !== undefined;\n  let validCount = 0;\n  let computed = null;\n\n  // 픽셀마다 `alpha !== null && alpha !== undefined` 를 재평가하지 않도록 밖으로 뺐다.\n  // bin 은 `Math.min(BINS-1, Math.floor(value * BINS))` 와 같다 — 바로 위에서 value 가\n  // 유한하고 0..1 임을 확인했으므로 `| 0` 이 곧 floor 다 (음수·2^31 초과가 없다).\n  for (let i = 0; i < length; i += 1) {\n    if (hasAlpha && alpha[i] === 0) continue;\n    const value = data[i];\n    if (!Number.isFinite(value) || value < 0 || value > 1) {\n      computed = PERCENTILE_HISTOGRAM_INVALID;\n      break;\n    }\n\n    const scaled = value * PERCENTILE_HISTOGRAM_BINS;\n    const bin = scaled >= PERCENTILE_HISTOGRAM_BINS - 1\n      ? PERCENTILE_HISTOGRAM_BINS - 1\n      : scaled | 0;\n    histogram[bin] += 1;\n    validCount += 1;\n  }\n\n  if (computed === null) {\n    computed = validCount === 0\n      ? PERCENTILE_HISTOGRAM_INVALID\n      : { histogram, validCount };\n  }\n  percentileHistogramCache.set(luma, computed);\n  return computed;\n}\n\n/**\n * 고정 4096-bin histogram percentile. 반환 순서는 요청 quantile 순서와 같다.\n *\n * bin의 하한을 반환해 0과 1이라는 계약 경계값을 정확히 보존한다. 이 방식의\n * 최대 양자화 오차는 1 / (4096 - 1)이고, 정렬 구현·브라우저 sort 안정성에\n * 의존하지 않는다.\n *\n * @param {import('__TLSCAN_BLOB_002__').LumaField} luma\n * @param {readonly number[] | ArrayLike<number>} quantiles\n * @returns {number[] | null}\n */\nexport function robustPercentiles(luma, quantiles = DEFAULT_ROBUST_QUANTILES) {\n  if (!hasValidLumaField(luma)) return null;\n  const requested = normalizeQuantiles(quantiles);\n  if (requested === null) return null;\n\n  const prepared = percentileHistogram(luma);\n  if (prepared === PERCENTILE_HISTOGRAM_INVALID) return null;\n  const { histogram, validCount } = prepared;\n\n  const ranks = requested.map((quantile) => Math.max(1, Math.ceil(quantile * validCount)));\n  const results = new Array(requested.length);\n  const unresolved = new Set(results.keys());\n  let cumulative = 0;\n\n  for (let bin = 0; bin < histogram.length && unresolved.size > 0; bin += 1) {\n    cumulative += histogram[bin];\n    for (const index of Array.from(unresolved)) {\n      if (cumulative >= ranks[index]) {\n        results[index] = bin / (PERCENTILE_HISTOGRAM_BINS - 1);\n        unresolved.delete(index);\n      }\n    }\n  }\n\n  return results;\n}\n\n/**\n * 옵션의 미지/오류를 LumaField 생성 전 결정적으로 해석한다.\n * @param {object} options\n * @returns {{rejectLowDynamicRange:boolean, lowDynamicRangeThreshold:number} | null}\n */\nfunction normalizeOptions(options) {\n  if (options === null || typeof options !== 'object') return null;\n  const rejectLowDynamicRange = options.rejectLowDynamicRange === undefined\n    ? true\n    : options.rejectLowDynamicRange === true;\n  const lowDynamicRangeThreshold = options.lowDynamicRangeThreshold === undefined\n    ? LOW_DYNAMIC_RANGE_MIN\n    : options.lowDynamicRangeThreshold;\n\n  if (\n    !Number.isFinite(lowDynamicRangeThreshold)\n    || lowDynamicRangeThreshold < 0\n    || lowDynamicRangeThreshold > 1\n  ) {\n    return null;\n  }\n\n  return { rejectLowDynamicRange, lowDynamicRangeThreshold };\n}\n\n/**\n * RGBA 8-bit sRGB 래스터를 decoder/contracts.js의 LumaField로 바꾼다.\n *\n * 알파는 배경색으로 합성하지 않고 원값을 별도 버퍼에 보존한다. 후단의 면 표본은\n * alpha<255를 엄격히 거부할 수 있고, 탐색기는 alpha=0을 배경 마스크로 쓸 수 있다.\n *\n * @param {{width:number, height:number, pixels:Uint8ClampedArray}} raster\n * @param {{rejectLowDynamicRange?:boolean, lowDynamicRangeThreshold?:number}} [options]\n * @returns {import('__TLSCAN_BLOB_002__').LumaField | {ok:false, reason:string, detail:object}}\n */\nexport function toRelativeLuminance(raster, options = {}) {\n  const normalizedOptions = normalizeOptions(options);\n  if (normalizedOptions === null) return invalidRaster('invalid-options');\n  if (!raster || typeof raster !== 'object') return invalidRaster('raster-not-object');\n\n  const { width, height, pixels } = raster;\n  if (!Number.isInteger(width) || width <= 0 || !Number.isInteger(height) || height <= 0) {\n    return invalidRaster('invalid-dimensions', { width, height });\n  }\n  if (!Number.isSafeInteger(width * height)) {\n    return invalidRaster('pixel-count-overflow', { width, height });\n  }\n  if (!(pixels instanceof Uint8ClampedArray)) {\n    return invalidRaster('pixels-not-uint8clampedarray');\n  }\n\n  const pixelCount = width * height;\n  if (pixels.length !== pixelCount * 4) {\n    return invalidRaster('pixel-length-mismatch', {\n      expected: pixelCount * 4,\n      actual: pixels.length,\n    });\n  }\n\n  const data = new Float32Array(pixelCount);\n  const alpha = new Uint8Array(pixelCount);\n\n  for (let pixelIndex = 0, offset = 0; pixelIndex < pixelCount; pixelIndex += 1, offset += 4) {\n    // relativeLuminance8 은 relativeLuminance 와 같은 sRGB 표·계수·덧셈 순서를 쓴다.\n    // 여기서 식을 다시 쓰지 않아 렌더러와 디코더의 sRGB 경계가 갈라질 가능성을 없앤다.\n    // Uint8ClampedArray 원소는 항상 0..255 정수라 8비트 진입점의 전제가 성립한다.\n    data[pixelIndex] = relativeLuminance8(\n      pixels[offset],\n      pixels[offset + 1],\n      pixels[offset + 2],\n    );\n    alpha[pixelIndex] = pixels[offset + 3];\n  }\n\n  const luma = { width, height, data, alpha };\n  const percentiles = robustPercentiles(luma, DEFAULT_ROBUST_QUANTILES);\n  const opaquePixels = opaqueSampleCount(luma);\n  if (percentiles === null || opaquePixels === 0) {\n    return fail(FRONTEND_FAILURE.EMPTY_INPUT, {\n      stage: 'luma',\n      opaquePixels,\n    });\n  }\n\n  const [p01, p50, p99] = percentiles;\n  const robustSpan = p99 - p01;\n  if (\n    normalizedOptions.rejectLowDynamicRange\n    && robustSpan < normalizedOptions.lowDynamicRangeThreshold\n  ) {\n    return fail(FRONTEND_FAILURE.LUMA_DEGENERATE, {\n      stage: 'luma',\n      p01,\n      p50,\n      p99,\n      robustSpan,\n      threshold: normalizedOptions.lowDynamicRangeThreshold,\n      opaquePixels,\n    });\n  }\n\n  // 반환 직전 계약 단언은 내부 변경이 alpha/data 정렬을 깨도 이 모듈 안에서\n  // 드러나게 한다. 외부 입력 오류에는 위에서 이미 fail을 반환했다.\n  assertLumaField(luma);\n  return luma;\n}\n"],
  ["/src/decoder/cell-finder-detect.js", "/**\n * cell-finder-detect.js — 중앙 19셀 파인더의 공용 격자 정합 검출기.\n *\n * 후보마다 검출 코드를 만들지 않는다. 입력은 finder-patterns.js의 cellMasks이고,\n * 모든 후보를 같은 기하 가설에서 한 번 표본화한 뒤 정규화 상관으로 함께 비교한다.\n * 반환 H와 120/240도 방향 여유는 파인더 자체에서 나오며 앵커를 쓰지 않는다.\n */\nimport {\n  FINDER_CELL_ORDER, FINDER_FACE_BITS, FINDER_CELL_MASK_PATTERNS,\n} from '__TLSCAN_BLOB_012__';\nimport { FACES, faceCentroid, facePolygon } from '__TLSCAN_BLOB_008__';\nimport { robustPercentiles } from '__TLSCAN_BLOB_016__';\nimport { FRONTEND_FAILURE, assertLumaField, fail, ok } from '__TLSCAN_BLOB_002__';\n\nexport const UNVERIFIED_CELL_FINDER_CALIBRATION = Object.freeze({\n  minCellSize: 2.25,\n  maxCellSizeFraction: 1 / 9,\n  scaleRatio: 1.28,\n  coarseAngleStepDegrees: 15,\n  varianceWindowRadiusCells: 4.1,\n  varianceStepCells: 0.65,\n  varianceCentersPerScale: 0,\n  maxCoarseCandidates: 8,\n  maxRefinedCandidates: 1,\n  maxOutputCandidates: 2,\n  minCorrelation: 0.56,\n  minContrastRatio: 0.24,\n  minOrientationMargin: 0.035,\n});\n\nconst REFINED_FACE_FRACTIONS = Object.freeze([0.10, 0.90]);\nconst TURN_RADIANS = 2 * Math.PI / 3;\nconst EPSILON = 1e-12;\nconst FACE_SAMPLES = Object.freeze(FINDER_CELL_ORDER.flatMap((cell, cellIndex) =>\n  FACES.map((face) => {\n    const layout = { size: 1, originX: 0, originY: 0 };\n    const point = faceCentroid(cell.q, cell.r, face, layout);\n    const polygon = facePolygon(cell.q, cell.r, face, layout);\n    const origin = polygon[0];\n    const uVector = { x: polygon[1].x - origin.x, y: polygon[1].y - origin.y };\n    const vVector = { x: polygon[3].x - origin.x, y: polygon[3].y - origin.y };\n    const detailPoints = REFINED_FACE_FRACTIONS.flatMap((u) =>\n      REFINED_FACE_FRACTIONS.map((v) => Object.freeze({\n        x: origin.x + u * uVector.x + v * vVector.x,\n        y: origin.y + u * uVector.y + v * vVector.y,\n      })));\n    return Object.freeze({\n      cellIndex, face, bit: FINDER_FACE_BITS[face], x: point.x, y: point.y,\n      detailPoints: Object.freeze(detailPoints),\n    });\n  })));\n\nfunction clamp01(value) { return value <= 0 ? 0 : value >= 1 ? 1 : value; }\nfunction cfgFor(options) {\n  return {\n    ...UNVERIFIED_CELL_FINDER_CALIBRATION,\n    ...(options && typeof options.calibration === 'object' ? options.calibration : {}),\n  };\n}\nfunction assertMasks(cellMasks, label = 'cellMasks') {\n  if (!Array.isArray(cellMasks) || cellMasks.length !== FINDER_CELL_ORDER.length) {\n    throw new RangeError(label + '는 19개 마스크 배열이어야 한다');\n  }\n  for (const mask of cellMasks) {\n    if (!Number.isInteger(mask) || mask < 0 || mask > 7) {\n      throw new RangeError(label + ' 면 마스크 범위 오류: ' + mask);\n    }\n  }\n  return cellMasks;\n}\nfunction normalizePatterns(input, options) {\n  const source = input === undefined ? FINDER_CELL_MASK_PATTERNS : input;\n  if (Array.isArray(source) && source.length === 19 && source.every(Number.isInteger)) {\n    return [{ id: options.patternId || 'cell-mask', cellMasks: assertMasks(source) }];\n  }\n  if (!Array.isArray(source) || source.length === 0) {\n    throw new TypeError('patterns는 cellMasks 또는 패턴 객체 배열이어야 한다');\n  }\n  const cellPatterns = source.filter((pattern) => pattern && Array.isArray(pattern.cellMasks));\n  if (cellPatterns.length === 0) {\n    throw new TypeError('patterns에 이진 cellMasks 후보가 없다');\n  }\n  return cellPatterns.map((pattern, index) => ({\n    ...pattern,\n    id: typeof pattern.id === 'string' ? pattern.id : 'cell-mask-' + index,\n    cellMasks: assertMasks(pattern.cellMasks, 'patterns[' + index + '].cellMasks'),\n  }));\n}\nfunction centeredExpected(values) {\n  const expected = Float64Array.from(values);\n  let mean = 0;\n  let lightCount = 0;\n  for (const value of expected) {\n    mean += value;\n    lightCount += value;\n  }\n  mean /= expected.length;\n  let norm2 = 0;\n  for (let i = 0; i < expected.length; i += 1) {\n    expected[i] -= mean;\n    norm2 += expected[i] * expected[i];\n  }\n  if (!(norm2 > 0) || lightCount centiles[1] - percentiles[0] : 0;\n  if (!(span > EPSILON)) return fail(FRONTEND_FAILURE.NO_FINDER, { cause: 'luma-span-degenerate' });\n  const scored = scoreBest(luma, H, [template], span, options.detailed !== false);\n  return scored ? ok({ patternId: template.id, ...scored })\n    : fail(FRONTEND_FAILURE.NO_FINDER, { cause: 'pattern-outside-image' });\n}\n\nexport function detectCellFinders(luma, patternInput = FINDER_CELL_MASK_PATTERNS, options = {}) {\n  try { assertLumaField(luma); } catch (error) {\n    return fail(FRONTEND_FAILURE.NO_FINDER, { stage: 'cell-finder-input', message: error.message });\n  }\n  const templates = normalizePatterns(patternInput, options).map(templateOf);\n  const cfg = cfgFor(options);\n  const percentiles = robustPercentiles(luma, [0.01, 0.99]);\n  const span = percentiles ? percentiles[1] - percentiles[0] : 0;\n  if (!(span > EPSILON)) return fail(FRONTEND_FAILURE.NO_FINDER, { stage: 'cell-finder-search', cause: 'luma-span-degenerate' });\n  const integrals = cfg.varianceCentersPerScale > 0 ? integralsOf(luma) : null;\n  const scales = scaleSeeds(luma, options, cfg);\n  const coarse = [];\n  let evaluatedGeometry = 0;\n  for (const cellSize of scales) {\n    const variance = integrals ? varianceCenters(luma, integrals, cellSize, cfg) : [];\n    const centers = centerSeeds(luma, variance, options.centerSeeds);\n    for (const center of centers) {\n      for (let angle = 0; angle < 360; angle += cfg.coarseAngleStepDegrees) {\n        const params = {\n          centerX: center.x, centerY: center.y, logScale: Math.log(cellSize),\n          rotation: angle * Math.PI / 180, anisotropy: 0, shear: 0,\n          projectiveX: 0, projectiveY: 0,\n        };\n        const H = HFrom(params);\n        const scored = scoreBest(luma, H, templates, span, false);\n        evaluatedGeometry += 1;\n        if (scored && scored.fit > 0) insertTop(coarse, { ...scored, params, H }, cfg.maxCoarseCandidates);\n      }\n    }\n  }\n  const refined = coarse.slice(0, cfg.maxRefinedCandidates)\n    .flatMap((candidate) => [\n      refine(luma, candidate, span, 'affine'),\n      refine(luma, candidate, span, 'projective'),\n    ]).filter(Boolean);\n  const candidates = nms(refined.map((entry) => finishCandidate(luma, entry, templates, span, cfg))\n    .filter((entry) => entry && entry.hardChecksPassed), cfg.maxOutputCandidates);\n  if (candidates.length === 0) {\n    const best = refined[0];\n    return fail(FRONTEND_FAILURE.NO_FINDER, {\n      stage: 'cell-finder-search', evaluatedGeometry, evaluatedCoarse: coarse.length,\n      evaluatedRefined: refined.length, bestScore: best?.fit,\n      bestPatternId: best?.template?.id, bestCorrelation: best?.correlation,\n      bestContrastRatio: best?.contrastRatio,\n    });\n  }\n  return ok({ candidates, diagnostics: {\n    matcher: 'cell-mask-ncc', patternCount: templates.length, scaleCount: scales.length,\n    evaluatedGeometry, evaluatedCoarse: coarse.length, evaluatedRefined: refined.length,\n  } });\n}\n"],
  ["/src/mask.js", "// mask.js — 고정 마스크 m(q,r) (SPEC §4.3)\n//\n// SPEC §4.3: 고정 마스크 1종(QR 식 마스크 선택 없음). 데이터 digit 에 m(q,r) 을\n// mod-6 가산해 시각 균일화 + 레퍼런스와의 혼동 방지를 노린다.\n//\n// ── 선정 절차 (순서 고정 — 규칙 먼저, 측정 다음, 선택 마지막) ────────────────\n//\n//   ① 카이제곱 균등성: 측정 영역(regionCells(k) 중 중심 2링 19셀 제외)에서\n//      chi2(df=5) <= 15.086 (alpha=0.01 임계값)\n//   ② 이웃 상관: 6방향을 3 정준 방향으로 축약(대칭 쌍 중복 제거)해 각 방향의\n//      Cramér's V 를 재고, 후보의 대표값은 버전×방향 전체의 **최대값**. 이 최대값이\n//      가장 작은 후보가 승자 후보.\n//   ③ 축 방향 자기상관: 원점을 지나는 세 격자축 직선(t=-100..100)을 따라\n//      주기 <=6 인 반복이 있으면 FAIL. (아핀형은 mod-6 선형이라 필연적으로\n//      period | 6 이므로 여기서 항상 FAIL — 이것이 \"축 밴딩\" 예상 실패 모드다.)\n//\n//   ①③ 을 **둘 다** 통과한 후보만 ② 비교에 들어간다. ①③ 을 통과하는 후보가\n//   하나뿐이면 ② 비교는 자명하게 그 후보가 승자다(TLcube/test/mask.test.js 의\n//   실측이 이 상황임을 재확인한다). 동률이면 공식이 단순한 쪽.\n//\n// ── 실측 결과 요약 (T4 numbers_check 전문 참조) ───────────────────────────\n//\n//   candidate   ①(chi2<=15.086)      ③(주기<=6 없음)   ② maxV(참고, 비교 대상 아님)\n//   affine      PASS (전 버전 <1)     FAIL(선형 필연)    1.0 (탈락이라 무의미)\n//   quadratic   FAIL (전 버전 >>15)   FAIL              0.29~0.35 (탈락이라 무의미)\n//   hash        PASS (전 버전 <9)     PASS               0.12~0.22\n//\n//   → ①③ 을 모두 통과하는 후보는 **hash** 뿐이다. CHOSEN = 'hash'.\n//\n// 정수 연산 안전성: q, r 이 |q|,|r| <= 20 범위(V3 k=10 보다 넉넉한 여유)에서\n// ⚠ 첫 곱셈 `q * 0x9e3779b1` 은 int32 를 넘는다 (|q|=20 에서 ~5.3e10). 그래도 안전한\n// 이유: double 은 2^53 까지 정수를 정확히 표현하고(|q|,|r| ≤ 2^21 에서 곱이 2^53 미만),\n// 직후의 `| 0` / `^` 가 ToInt32 로 결정적으로 축약한다. 이후 단계는 `Math.imul` /\n// `>>> ` 로 JS 정수 연산의 브라우저·Node 결정성을 못 박는다.\n\nfunction mod6(n) {\n  return ((n % 6) + 6) % 6;\n}\n\n// ── 후보 ①: 아핀형 (대조군) ────────────────────────────────────────────────\n// (a·q + b·r) mod 6. mod-6 선형이라 계수 조합에 따라 반드시 어떤 축 방향으로\n// 등차수열(주기 | 6)이 나타난다 — 실측 ③이 이를 확인한다. 대조군으로만 남긴다.\nfunction affine(q, r) {\n  return mod6(1 * q + 2 * r);\n}\n\n// ── 후보 ②: 이차형 ─────────────────────────────────────────────────────────\n// (a·q + b·r + c·qr + d·q² + e·r²) mod 6. 짧은 주기는 피하지만(③ 통과 못함 —\n// 이차항도 mod 6 에서 결국 주기적이다) 균등성이 실측상 크게 무너진다(① FAIL).\nfunction quadratic(q, r) {\n  return mod6(1 * q + 2 * r + 3 * q * r + 1 * q * q + 5 * r * r);\n}\n\n// ── 후보 ③: 정수 해시형 (선정) ─────────────────────────────────────────────\n// 곱셈-시프트-XOR. 첫 곱은 double 정밀 정수 곱 + ToInt32 축약(위 헤더 주석 참조),\n// 이후는 `Math.imul` — 전 단계가 IEEE754/ECMA 규정 연산이라 브라우저·Node 동일 결과다\n// (테스트가 이를 단언한다). ⚠ 이 공식은 측정으로 확정됐다(SPEC §4.3) — 수정 금지.\nfunction hash(q, r) {\n  let h = (q * 0x9e3779b1) ^ (r * 0x85ebca77);\n  h |= 0;\n  h ^= h >>> 15;\n  h = Math.imul(h, 0xc2b2ae35);\n  h ^= h >>> 13;\n  h |= 0;\n  return mod6(h);\n}\n\n/** 재측정 가능하도록 전 후보를 노출한다 (T4 선정 규칙 재실행용). */\nexport const CANDIDATES = Object.freeze({ affine, quadratic, hash });\n\n/** 확정된 후보 이름. */\nexport const CHOSEN = 'hash';\n\n/**\n * 확정 마스크 공식. m(q, r) → {0..5}.\n * @param {number} q\n * @param {number} r\n * @returns {number}\n */\nexport function maskValue(q, r) {\n  return hash(q, r);\n}\n\n/**\n * 데이터 digit 에 마스크를 mod-6 가산한다 (인코더가 쓴다).\n * @param {number} digit 0..5\n * @param {number} q\n * @param {number} r\n * @returns {number} 마스킹된 digit 0..5\n */\nexport function maskAdd(digit, q, r) {\n  return mod6(digit + maskValue(q, r));\n}\n\n/**\n * 마스크를 걷어낸다 (디코더가 쓴다). maskAdd 의 역연산.\n * @param {number} maskedDigit 0..5\n * @param {number} q\n * @param {number} r\n * @returns {number} 원본 digit 0..5\n */\nexport function maskSub(maskedDigit, q, r) {\n  return mod6(maskedDigit - maskValue(q, r));\n}\n"],
  ["/src/placement.js", "// placement.js — 앵커 3셀 + 포맷 정보 15셀 + 레퍼런스 셀 배치 맵 (SPEC §5.2, §5.3, §5.4, §13 T6)\n//\n// 이 모듈은 \"어디에 무엇을 놓는가\"만 다룬다. 포맷 정보 12bit → base-6 5심볼 변환(§5.4,\n// T7 하드 블로커)이나 scan order(§13, T8)는 여기서 확정하지 않는다 — 이 모듈이 내는\n// 셀 좌표 목록이 그 두 작업의 입력이 된다.\n//\n// 불스아이 풋프린트는 SPEC 이 이미 고정했다: hexDistance ≤ 2 (19셀). bullseye.js 는\n// 동시 작성 중이라 import 하지 않고 여기서 직접 hexDistance 로 판정한다(과제 지침).\n//\n// ─────────────────────────────────────────────────────────────────────────────\n// 앵커 3셀 (§5.2, \"확정할 것 1\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 외곽 6개 코너는 axial 좌표로 (k,0)·(0,k)·(-k,k)·(-k,0)·(0,-k)·(k,-k) 이다. 이 순서를\n// `CORNER_DIRECTIONS` 로 고정한다 — 인접 코너 사이는 60°, 한 칸씩 건너뛰면 120°다.\n//\n// **rhombille 분할은 120° 대칭만 갖는다** (hexgrid.js 헤더 주석: 면 오프셋이 전 셀\n// 동일하고 spine 이 {0,2,4} 꼭짓점에 고정되므로, 60°/180°/240°/300° 회전은 T/L/R 면\n// 배정 자체를 깨뜨린다 — 유효한 대칭군은 항등·120°·240° 뿐이다). 따라서 앵커는\n// **교대(alternating) 3개**를 골라야 \"임의의 유효 회전에서 앵커 3점이 여전히 앵커\n// 위치 집합\"이라는 성질이 성립한다. 후보는 두 세트뿐이다:\n//   세트 A = 코너 인덱스 {0,2,4} = { (k,0), (-k,k), (0,-k) }\n//   세트 B = 코너 인덱스 {1,3,5} = { (0,k), (-k,0), (k,-k) }\n// 어느 쪽이든 120°-불변 성질은 동일하게 성립한다(대칭적인 선택지라 구조적 우열이\n// 없다). **세트 A를 채택한다** — `CORNER_DIRECTIONS` 열거 순서의 첫 코너 (k,0) 를\n// 포함해 \"정준 목록의 짝수 인덱스\"로 서술하기 가장 단순하고, 이후 §5.4 포맷 정보의\n// ring-3 순회 시작점·§5.3 레퍼런스 셀의 충돌 회피 규칙과 같은 인덱스 산술\n// (`ringWalk` 참조)을 그대로 재사용할 수 있어 코드 전체의 회전 산술이 한 가지\n// 공식으로 통일된다.\n//\n// 방향 기준점(어느 코너가 digit 5 인가): 세트 A 의 첫 원소 (k,0) 를 5, 나머지 두\n// 코너를 0 으로 둔다. **왜 유일하게 결정되는가**: 세 앵커 위치의 집합 자체는\n// 120°/240° 회전에 불변이지만, \"이 물리적 좌표에 이 digit 이 찍혀 있다\"는 배정\n// 함수는 항등 회전에서만 자기 자신과 같다 — 120°/240° 만큼 회전한 패턴은 5가 찍힌\n// 위치가 다른 코너로 옮겨가므로 원본과 달라진다(아래 `test/placement.test.js` 가\n// 전수로 단언). 즉 디코더가 \"5 찍힌 앵커가 어디 있는가\"만 읽으면 세 회전 후보 중\n// 정확히 하나만 남는다.\n\nimport { hexDistance, AXIAL_DIRECTIONS } from '__TLSCAN_BLOB_008__';\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 기본 상수\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 불스아이 풋프린트 반경 (SPEC §5.1: hexDistance ≤ 2, 19셀). */\nexport const BULLSEYE_RADIUS = 2;\n\n/**\n * 외곽 6 코너의 단위 방향 (k 를 곱하면 실제 코너 좌표). 60° 간격 정준 순서.\n * @type {ReadonlyArray<{q:number, r:number}>}\n */\nexport const CORNER_DIRECTIONS = Object.freeze([\n  Object.freeze({ q: 1, r: 0 }), //  0: (k, 0)\n  Object.freeze({ q: 0, r: 1 }), //  1: (0, k)\n  Object.freeze({ q: -1, r: 1 }), //  2: (-k, k)\n  Object.freeze({ q: -1, r: 0 }), //  3: (-k, 0)\n  Object.freeze({ q: 0, r: -1 }), //  4: (0, -k)\n  Object.freeze({ q: 1, r: -1 }), //  5: (k, -k)\n]);\n\n/** 앵커로 쓰는 코너 인덱스 — 세트 A(교대 인덱스, 위 주석 근거). */\nexport const ANCHOR_CORNER_INDICES = Object.freeze([0, 2, 4]);\n\n/** 앵커 중 digit 5 를 받는 코너 인덱스(= 방향 기준점). 나머지 앵커는 digit 0. */\nexport const ANCHOR_PRIMARY_INDEX = 0;\n\n/** 앵커 digit 값 (SPEC §5.2: (0,0,5)). */\nexport const ANCHOR_PRIMARY_DIGIT = 5;\nexport const ANCHOR_SECONDARY_DIGIT = 0;\n\n/** 포맷 정보가 사는 링 번호 (불스아이 인접 링, §5.4). */\nexport const FORMAT_RING = 3;\n\n/** 포맷 정보 반복 블록 길이(5셀) · 개수(3, 120° 간격) (§5.4). */\nexport const FORMAT_BLOCK_LENGTH = 5;\nexport const FORMAT_REPLICAS = 3;\n\n/** 레퍼런스 셀에 배정하는 알려진 digit — 앵커 값 {0,5} 와 달라야 한다(§5.3 \"확정할 것 3\"). */\nexport const REFERENCE_DIGIT = 3;\n\nfunction assertRadius(k) {\n  if (!Number.isInteger(k) || k < FORMAT_RING + 1) {\n    // FORMAT_RING(=3) 자체가 데이터 링이려면 앵커 링(k)보다 작아야 한다.\n    throw new RangeError(`k 는 ${FORMAT_RING + 1} 이상의 정수여야 한다: ${k}`);\n  }\n  return k;\n}\n\nfunction key(q, r) {\n  return `${q},${r}`;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 회전 (120°/240°, cube 좌표 기반 — rhombille 이 갖는 유일한 비자명 대칭)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** axial (q,r) 를 원점 기준 120° 회전. */\nexport function rotate120(q, r) {\n  return { q: -q - r, r: q };\n}\n\n/** axial (q,r) 를 원점 기준 240° 회전 (= rotate120 두 번). */\nexport function rotate240(q, r) {\n  return { q: r, r: -q - r };\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 외곽 코너 · 앵커\n// ─────────────────────────────────────────────────────────────────────────────\n\n/** 반경 k 영역의 외곽 코너 6개, `CORNER_DIRECTIONS` 순서대로. */\nexport function corners(k) {\n  assertRadius(k);\n  return CORNER_DIRECTIONS.map((d) => ({ q: d.q * k, r: d.r * k }));\n}\n\n/**\n * 앵커 3셀과 digit 배정.\n * @param {number} k\n * @returns {{q:number, r:number, digit:number}[]} 길이 3\n */\nexport function anchorCells(k) {\n  const all = corners(k);\n  return ANCHOR_CORNER_INDICES.map((idx) => ({\n    ...all[idx],\n    digit: idx === ANCHOR_CORNER_INDICES[ANCHOR_PRIMARY_INDEX]\n      ? ANCHOR_PRIMARY_DIGIT\n      : ANCHOR_SECONDARY_DIGIT,\n  }));\n}\n\n/** 앵커 좌표 집합 (Set<\"q,r\">). digit 무관, 위치만. */\nexport function anchorPositionSet(k) {\n  return new Set(anchorCells(k).map((c) => key(c.q, c.r)));\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 링 순회 (표준 hex-ring walk, 각도순 — format/reference 인덱스 산술의 기반)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 r 인 링(hexDistance == r)의 셀을, 코너 `CORNER_DIRECTIONS[2]·r` (= `(-r, r)`) 에서 시작해\n * `AXIAL_DIRECTIONS[0..5]` 순서로 각 변을 r 걸음씩 걸어 각도순으로 나열한다.\n * 길이 6r (r=0 이면 [{0,0}] 길이 1). 코너는 정확히 인덱스 0, r, 2r, 3r, 4r, 5r 에 온다\n * (증명: `test/placement.test.js` 가 이 성질과 §5.2 앵커 인덱스 일치를 검증한다).\n * @param {number} r\n * @returns {{q:number, r:number}[]}\n */\nexport function ringWalk(r) {\n  if (!Number.isInteger(r) || r < 0) {\n    throw new RangeError(`링 반경 r 은 0 이상의 정수여야 한다: ${r}`);\n  }\n  if (r === 0) return [{ q: 0, r: 0 }];\n  let cur = { q: AXIAL_DIRECTIONS[4].q * r, r: AXIAL_DIRECTIONS[4].r * r };\n  const cells = [];\n  for (let dir = 0; dir < 6; dir += 1) {\n    for (let step = 0; step < r; step += 1) {\n      cells.push({ q: cur.q, r: cur.r });\n      cur = { q: cur.q + AXIAL_DIRECTIONS[dir].q, r: cur.r + AXIAL_DIRECTIONS[dir].r };\n    }\n  }\n  return cells;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 포맷 정보 15셀 (§5.4, \"확정할 것 2\")\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 시작 위치·진행 방향: `ringWalk(FORMAT_RING)` 인덱스 0 = 코너 `CORNER_DIRECTIONS[2]·3`\n// = `(-3, 3)` 에서 시작해 `AXIAL_DIRECTIONS[0..5]` 순서로 진행한다.\n// (v1 주석은 CORNER_DIRECTIONS[4] 로 잘못 적었었다 — 검증 라운드 정정. 코드가 정본이고\n//  실측 ringWalk(3)[0] = (-3,3) 이다. 이 규약은 인코더/디코더 공통 와이어 계약이다.)\n// 링3 은 18셀(6·3). 5셀 블록 3개(=15셀)를 120° 간격(= 인덱스 +6, 18/3)으로 두면\n// 인덱스 [0-4], [6-10], [12-16] 이 포맷이고 [5, 11, 17] 세 칸이 남는다 — SPEC 이\n// 명시한 \"18셀 중 15개가 포맷, 3개만 남는다\"와 정확히 일치한다.\n\n/** 포맷 블록 하나의 시작 인덱스(링3 순회 기준), 120° 간격 3개. */\nexport function formatBlockStarts() {\n  const ringSize = 6 * FORMAT_RING;\n  const step = ringSize / FORMAT_REPLICAS;\n  return Array.from({ length: FORMAT_REPLICAS }, (_, i) => i * step);\n}\n\n/** 포맷 정보 15셀 (블록 3개 × 5셀, ring3 순회 순서 그대로 이어붙임). */\nexport function formatCells(k) {\n  assertRadius(k);\n  const ring = ringWalk(FORMAT_RING);\n  const cells = [];\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) {\n      cells.push(ring[(start + i) % ring.length]);\n    }\n  }\n  return cells;\n}\n\n/** 포맷 정보가 차지하지 않는 ring3 의 나머지 셀 (18 - 15 = 3개). */\nexport function formatRingLeftoverCells() {\n  const ring = ringWalk(FORMAT_RING);\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ring.length);\n  }\n  return ring.filter((_, idx) => !occupied.has(idx));\n}\n\nfunction formatOccupiedIndexSet() {\n  const ringSize = 6 * FORMAT_RING;\n  const occupied = new Set();\n  for (const start of formatBlockStarts()) {\n    for (let i = 0; i < FORMAT_BLOCK_LENGTH; i += 1) occupied.add((start + i) % ringSize);\n  }\n  return occupied;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 레퍼런스 셀 (§5.3, \"확정할 것 3\") — 데이터 링(ring 3..k)당 정확히 2개\n// ─────────────────────────────────────────────────────────────────────────────\n//\n// 규칙(오직 (k, ring) 으로 결정): `ringWalk(r)` 순회에서 인덱스 0 부터, 그리고\n// 인덱스 `3r`(= 정확히 180° 대척점) 부터 각각 정방향으로 선형 탐색해 \"점유되지\n// 않은\" 첫 인덱스를 잡는다. 점유 판정은 다음 두 경우뿐이다(그 외 링은 아무 것도\n// 점유하지 않으므로 정확히 대척점 쌍이 나온다 — \"각도상 최대 분리\" 요건 충족):\n//   - r === FORMAT_RING(3): 포맷 15셀이 점유 → 위 §5.4 의 occupied 인덱스 집합\n//   - r === k(앵커 링): 앵커 3셀이 점유 → 세트 A 코너가 이 순회에서 정확히\n//     인덱스 {0, 2r, 4r} 에 온다(§5.2 주석 · `ringWalk` docstring 의 코너 인덱스\n//     성질 + ANCHOR_CORNER_INDICES = {0,2,4} 조합)\n// r===3 인 경우 탐색 결과는 항상 {5, 11} 로 수렴한다 — 링3 여유 3칸 {5,11,17} 중\n// 앞의 두 칸. 결정적이며 앵커·포맷과 무충돌임이 알고리즘적으로 보장된다.\n\nfunction ringOccupiedIndexSet(k, r) {\n  const occupied = new Set();\n  if (r === FORMAT_RING) {\n    for (const idx of formatOccupiedIndexSet()) occupied.add(idx);\n  }\n  if (r === k) {\n    const ringSize = 6 * r;\n    for (const idx of ANCHOR_CORNER_INDICES) {\n      // corners()[idx] 는 ringWalk(r) 에서 인덱스 (idx 를 코너-슬롯 순서로 재사상)에\n      // 온다. corners() 순서 [0..5] ↔ ringWalk 코너 인덱스 [2r,r,0,5r,4r,3r]\n      // (docstring 유도: dir4·r 시작 = corners()[2], 이후 dir0 r걸음 = corners()[1], ...).\n      const cornerToRingIndex = [2 * r, r, 0, 5 * r, 4 * r, 3 * r];\n      occupied.add(cornerToRingIndex[idx] % ringSize);\n    }\n  }\n  return occupied;\n}\n\n/**\n * 링 r(3..k)의 레퍼런스 2셀. `ringWalk(r)` 인덱스 기준 0 과 `3r` 에서 점유 인덱스를\n * 건너뛰며 선형 탐색해 결정적으로 고른다.\n * @param {number} k\n * @param {number} r FORMAT_RING(3) 이상 k 이하\n * @returns {{q:number, r:number}[]} 길이 2\n */\nexport function referenceCells(k, r) {\n  assertRadius(k);\n  if (!Number.isInteger(r) || r < FORMAT_RING || r > k) {\n    throw new RangeError(`레퍼런스 링 r 은 ${FORMAT_RING}..${k} 범위여야 한다: ${r}`);\n  }\n  const ring = ringWalk(r);\n  const ringSize = ring.length;\n  const occupied = ringOccupiedIndexSet(k, r);\n\n  const taken = new Set();\n  function pickFrom(startIdx) {\n    for (let step = 0; step < ringSize; step += 1) {\n      const idx = (startIdx + step) % ringSize;\n      if (!occupied.has(idx) && !taken.has(idx)) {\n        taken.add(idx);\n        return idx;\n      }\n    }\n    throw new RangeError(`k=${k} r=${r}: 레퍼런스 셀을 배치할 빈 칸이 없다`);\n  }\n\n  const i1 = pickFrom(0);\n  const i2 = pickFrom(Math.floor(ringSize / 2));\n  return [i1, i2].map((idx) => ({ ...ring[idx], digit: REFERENCE_DIGIT }));\n}\n\n/** 데이터 링 전부(3..k)의 레퍼런스 셀을 이어붙인 목록. */\nexport function referenceCellsAll(k) {\n  assertRadius(k);\n  const out = [];\n  for (let r = FORMAT_RING; r <= k; r += 1) out.push(...referenceCells(k, r));\n  return out;\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 역할 분할 (§5.4 \"확정할 것 4\")\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 반경 k 영역 전체의 역할 분류표를 한 번에 만든다 (roleOf 를 셀마다 다시 계산하지\n * 않도록 Set 을 미리 구성 — 전수 테스트에서 O(k²) 반복이 O(k) 조회가 되게 한다).\n * @param {number} k\n * @returns {{bullseye: Set<string>, anchor: Set<string>, format: Set<string>, reference: Set<string>}}\n */\nexport function buildRoleSets(k) {\n  assertRadius(k);\n  const anchor = anchorPositionSet(k);\n  const format = new Set(formatCells(k).map((c) => key(c.q, c.r)));\n  const reference = new Set(referenceCellsAll(k).map((c) => key(c.q, c.r)));\n  return { anchor, format, reference };\n}\n\n/**\n * 셀 (q,r) 의 역할.\n * @param {number} q\n * @param {number} r\n * @param {number} k\n * @param {{anchor:Set<string>, format:Set<string>, reference:Set<string>}} [roleSets]\n *   `buildRoleSets(k)` 결과를 미리 넘기면 전수 테스트에서 재계산을 피한다.\n * @returns {'bullseye'|'anchor'|'format'|'reference'|'data'}\n */\nexport function roleOf(q, r, k, roleSets) {\n  const d = hexDistance(q, r);\n  if (d <= BULLSEYE_RADIUS) return 'bullseye';\n  const sets = roleSets || buildRoleSets(k);\n  const kk = key(q, r);\n  if (sets.anchor.has(kk)) return 'anchor';\n  if (sets.format.has(kk)) return 'format';\n  if (sets.reference.has(kk)) return 'reference';\n  return 'data';\n}\n\n// ─────────────────────────────────────────────────────────────────────────────\n// 오버헤드 집계 (§5.5 \"확정할 것 5\" — capacity.js 는 절대 건드리지 않는다)\n// ─────────────────────────────────────────────────────────────────────────────\n\n/**\n * 버전 k 의 비데이터 셀 실계산 합. capacity.js 의 `overhead` 잠정치(45/50/55)와\n * **대조만** 한다 — 이 함수는 capacity.js 를 읽지도 쓰지도 않는다.\n * @param {number} k\n */\nexport function overheadBreakdown(k) {\n  assertRadius(k);\n  const bullseye = 3 * BULLSEYE_RADIUS * BULLSEYE_RADIUS + 3 * BULLSEYE_RADIUS + 1; // cellCount(2)\n  const anchor = ANCHOR_CORNER_INDICES.length;\n  const format = FORMAT_BLOCK_LENGTH * FORMAT_REPLICAS;\n  const reference = 2 * (k - FORMAT_RING + 1); // 링 FORMAT_RING..k, 링당 2개\n  return {\n    k,\n    bullseye,\n    anchor,\n    format,\n    reference,\n    total: bullseye + anchor + format + reference,\n  };\n}\n"],
  ["/src/decoder/reference-validate.js", "/**\n * reference-validate.js — Type O digit-3 레퍼런스의 순서 검증과 선택적 국소 보정\n *\n * 레퍼런스는 절대 휘도를 맞추는 캘리브레이션 패치가 아니다. T < R < L이라는\n * 순서와 원판 내부 MAD 대비의 분리폭만 이용해, 잘못된 기하 가설을 거르고\n * 필요할 때만 작은 canonical 잔차장을 제안한다.\n */\n\nimport {\n  FACES,\n  axialToPixel,\n  cellSampleDiscs,\n  hexDistance,\n  normalizeLayout,\n} from '__TLSCAN_BLOB_008__';\nimport { REFERENCE_DIGIT, referenceCellsAll } from '__TLSCAN_BLOB_019__';\nimport {\n  FRONTEND_FAILURE,\n  assertHomography,\n  assertLumaField,\n  fail,\n  ok,\n} from '__TLSCAN_BLOB_002__';\nimport { rankConfidence, sampleProjectedDisc } from '__TLSCAN_BLOB_011__';\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_VALID_REFERENCES_PER_RING = 1;\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_REFERENCE_ORDER_FRACTION = 0.75;\n\n// [미검증] M1 calibration 에서 확정\nexport const LOCAL_WARP_SEARCH_RADIUS_CELLS = 0.20;\n\n// [미검증] M1 calibration 에서 확정\nexport const LOCAL_WARP_SEARCH_STEP_CELLS = 0.025;\n\n// [미검증] M1 calibration 에서 확정\nexport const MAX_LOCAL_WARP_CELLS = 0.25;\n\n// [미검증] M1 calibration 에서 확정\nexport const MIN_LOCAL_WARP_MARGIN_IMPROVEMENT = 0.10;\n\n// [미검증] M1 calibration 에서 확정\nexport const LOCAL_WARP_HUBER_DELTA_CELLS = 0.05;\n\n// 고정 반복 수는 wall-clock이 아니라 입력 크기에만 의존하도록 한다. 이 값 역시\n// 강건성 보장이 아니라 처음부터 재현 가능한 보정 경로를 만들기 위한 초기 설정이다.\n// [미검증] M1 calibration 에서 확정\nexport const LOCAL_WARP_IRLS_ITERATIONS = 4;\n\nconst AFFINE_PIVOT_EPSILON = 1e-12;\n\nfunction median(values) {\n  if (values.length === 0) throw new RangeError('median: 빈 표본');\n  const sorted = values.slice().sort((a, b) => a - b);\n  const middle = Math.floor(sorted.length / 2);\n  return sorted.length % 2 === 0\n    ? (sorted[middle - 1] + sorted[middle]) / 2\n    : sorted[middle];\n}\n\nfunction firstDefined(options, names, fallback) {\n  for (const name of names) {\n    if (options[name] !== undefined) return options[name];\n  }\n  return fallback;\n}\n\nfunction finiteInRange(value, label, minimum, maximum) {\n  if (!Number.isFinite(value) || value < minimum || value > maximum) {\n    throw new RangeError(label + '는 [' + minimum + ', ' + maximum + '] 범위의 유한수여야 한다: ' + value);\n  }\n  return value;\n}\n\nfunction positiveFinite(value, label) {\n  if (!Number.isFinite(value) || value <= 0) {\n    throw new RangeError(label + '는 양의 유한수여야 한다: ' + value);\n  }\n  return value;\n}\n\nfunction nonNegativeInteger(value, label) {\n  if (!Number.isInteger(value) || value < 0) {\n    throw new RangeError(label + '는 0 이상의 정수여야 한다: ' + value);\n  }\n  return value;\n}\n\nfunction gridSamplesMap(gridSamples) {\n  if (gridSamples instanceof Map) return gridSamples;\n  if (gridSamples && typeof gridSamples === 'object') {\n    if (gridSamples.ok === false) return null;\n    if (gridSamples.cells instanceof Map) return gridSamples.cells;\n    if (gridSamples.samples instanceof Map) return gridSamples.samples;\n  }\n  throw new TypeError('gridSamples 는 Map 또는 cells: Map을 가진 성공 결과여야 한다');\n}\n\nfunction cellSampleFrom(value) {\n  if (!value || typeof value !== 'object') return null;\n  if (value.ok === false) return null;\n  if (value.sample && typeof value.sample === 'object') return value.sample;\n  if (value.cell && typeof value.cell === 'object') return value.cell;\n  return value;\n}\n\nfunction geometryH(geometry) {\n  if (geometry instanceof Float64Array) return geometry;\n  if (!geometry || typeof geometry !== 'object') {\n    throw new TypeError('geometry 는 H를 가진 객체 또는 Homography 여야 한다');\n  }\n  return geometry.H || geometry.homography;\n}\n\nfunction geometryLayout(geometry, options = {}) {\n  const layout = options.layout !== undefined\n    ? options.layout\n    : geometry && typeof geometry === 'object'\n      ? geometry.layout || geometry.canonicalLayout\n      : undefined;\n  return normalizeLayout(layout);\n}\n\nfunction configuredReferences(options = {}) {\n  const minValidPerRing = firstDefined(\n    options,\n    ['minValidReferencesPerRing', 'minimumValidReferencesPerRing'],\n    MIN_VALID_REFERENCES_PER_RING,\n  );\n  const minOrderFraction = firstDefined(\n    options,\n    ['minReferenceOrderFraction', 'minimumReferenceOrderFraction', 'minOrderFraction'],\n    MIN_REFERENCE_ORDER_FRACTION,\n  );\n  nonNegativeInteger(minValidPerRing, 'minValidReferencesPerRing');\n  finiteInRange(minOrderFraction, 'minReferenceOrderFraction', 0, 1);\n  return { minValidPerRing, minOrderFraction };\n}\n\nfunction referenceMeasurement(reference, sample, confidenceOptions) {\n  const rank = rankConfidence(sample, confidenceOptions);\n  const orderValid =\n    sample.T.median < sample.R.median\n    && sample.R.median < sample.L.median;\n  const darkGap = sample.R.median - sample.T.median;\n  const lightGap = sample.L.median - sample.R.median;\n  const delta = Math.min(darkGap, lightGap);\n\n  return {\n    q: reference.q,\n    r: reference.r,\n    ring: hexDistance(reference.q, reference.r),\n    expectedDigit: REFERENCE_DIGIT,\n    order: rank.order,\n    orderValid,\n    confident: orderValid && rank.confident,\n    darkGap,\n    lightGap,\n    delta,\n    noise: rank.noise,\n    confidence: rank.confidence,\n    tie: rank.tie,\n    sample: {\n      T: sample.T,\n      L: sample.L,\n      R: sample.R,\n      separation: sample.separation,\n      tie: sample.tie,\n    },\n  };\n}\n\nfunction localScaleEntries(referenceRows) {\n  // localScaleField는 함수가 아니라 명시적 표본장으로 둔다. 함수 객체를 결과에\n  // 넣으면 같은 입력 두 번의 deep equality와 직렬 진단이 불필요하게 깨진다.\n  return referenceRows\n    .filter((row) => row.orderValid && Number.isFinite(row.delta) && row.delta > 0)\n    .map((row) => ({\n      q: row.q,\n      r: row.r,\n      ring: row.ring,\n      delta: row.delta,\n      noise: row.noise,\n    }));\n}\n\n/**\n * Type O의 알려진 digit-3 reference를 모두 평가한다. 한 reference가 실패했다고\n * 바로 끝내지 않아야 링별 coverage와 전체 실패 원인을 함께 진단할 수 있다.\n *\n * @param {Map<string, object>|{cells:Map<string, object>}} gridSamples\n * @param {number} k\n * @param {object} [options]\n * @returns {{ok:true,...object}|{ok:false,reason:string,detail:object}}\n */\nexport function validateOReferences(gridSamples, k, options = {}) {\n  if (!Number.isInteger(k) || k < 3) {\n    throw new RangeError('Type O k 는 3 이상의 정수여야 한다: ' + k);\n  }\n  const samples = gridSamplesMap(gridSamples);\n  if (samples === null) {\n    return fail(FRONTEND_FAILURE.REFERENCE_MISMATCH, {\n      stage: 'validate-o-references',\n      cause: 'grid-sampling-failed',\n    });\n  }\n\n  const config = configuredReferences(options);\n  const expected = referenceCellsAll(k);\n  const rings = new Map();\n  for (let ring = 3; ring <= k; ring += 1) {\n    rings.set(ring, {\n      ring,\n      total: 0,\n      validOrder: 0,\n      confident: 0,\n      missing: 0,\n      ok: false,\n      references: [],\n    });\n  }\n\n  const rows = [];\n  const violations = [];\n  for (const reference of expected) {\n    const key = reference.q + ',' + reference.r;\n    const bucket = rings.get(hexDistance(reference.q, reference.r));\n    bucket.total += 1;\n\n    const sample = cellSampleFrom(samples.get(key));\n    if (sample === null) {\n      const row = {\n        q: reference.q,\n        r: reference.r,\n        ring: bucket.ring,\n        expectedDigit: REFERENCE_DIGIT,\n        missing: true,\n        orderValid: false,\n        confident: false,\n      };\n      rows.push(row);\n      bucket.references.push(row);\n      bucket.missing += 1;\n      violations.push({ type: 'missing-reference-sample', key, ring: bucket.ring });\n      continue;\n    }\n\n    let row;\n    try {\n      row = referenceMeasurement(reference, sample, options);\n    } catch (error) {\n      row = {\n        q: reference.q,\n        r: reference.r,\n        ring: bucket.ring,\n        expectedDigit: REFERENCE_DIGIT,\n        invalidSample: true,\n        orderValid: false,\n        confident: false,\n        diagnostic: String(error.message || error),\n      };\n      violations.push({ type: 'invalid-reference-sample', key, ring: bucket.ring });\n    }\n\n    rows.push(row);\n    bucket.references.push(row);\n    if (row.orderValid) bucket.validOrder += 1;\n    if (row.confident) bucket.confident += 1;\n  }\n\n  for (const bucket of rings.values()) {\n    bucket.ok = bucket.confident >= config.minValidPerRing;\n    if (!bucket.ok) {\n      violations.push({\n        type: 'ring-coverage',\n        ring: bucket.ring,\n        confident: bucket.confident,\n        required: config.minValidPerRing,\n      });\n    }\n  }\n\n  const validOrder = rows.filter((row) => row.orderValid).length;\n  const confident = rows.filter((row) => row.confident).length;\n  const orderedRows = rows.filter((row) => row.orderValid && Number.isFinite(row.delta));\n  const orderFraction = expected.length === 0 ? 0 : validOrder / expected.length;\n  if (orderFraction < config.minOrderFraction) {\n    violations.push({\n      type: 'global-order-fraction',\n      orderFraction,\n      required: config.minOrderFraction,\n    });\n  }\n\n  const report = {\n    total: expected.length,\n    validOrder,\n    confident,\n    perRing: rings,\n    globalDeltaMedian: orderedRows.length === 0 ? null : median(orderedRows.map((row) => row.delta)),\n    globalNoiseMedian: orderedRows.length === 0 ? null : median(orderedRows.map((row) => row.noise)),\n    localScaleField: localScaleEntries(rows),\n    offsets: [],\n    correctionAccepted: false,\n    references: rows,\n    orderFraction,\n    thresholds: config,\n    ok: violations.length === 0,\n  };\n\n  if (!report.ok) {\n    return fail(FRONTEND_FAILURE.REFERENCE_MISMATCH, {\n      stage: 'validate-o-references',\n      report,\n      violations,\n    });\n  }\n  return ok(report);\n}\n\nfunction localWarpConfig(options = {}) {\n  const searchRadiusCells = firstDefined(\n    options,\n    ['searchRadiusCells', 'searchRadius'],\n    LOCAL_WARP_SEARCH_RADIUS_CELLS,\n  );\n  const searchStepCells = firstDefined(\n    options,\n    ['searchStepCells', 'searchStep'],\n    LOCAL_WARP_SEARCH_STEP_CELLS,\n  );\n  const maxWarpCells = firstDefined(\n    options,\n    ['maxWarpCells', 'maxWarp'],\n    MAX_LOCAL_WARP_CELLS,\n  );\n  const minImprovement = firstDefined(\n    options,\n    ['minMarginImprovement', 'minimumMarginImprovement'],\n    MIN_LOCAL_WARP_MARGIN_IMPROVEMENT,\n  );\n  const huberDeltaCells = firstDefined(\n    options,\n    ['huberDeltaCells', 'huberDelta'],\n    LOCAL_WARP_HUBER_DELTA_CELLS,\n  );\n  const iterations = firstDefined(\n    options,\n    ['irlsIterations', 'iterations'],\n    LOCAL_WARP_IRLS_ITERATIONS,\n  );\n\n  finiteInRange(searchRadiusCells, 'searchRadiusCells', 0, Infinity);\n  positiveFinite(searchStepCells, 'searchStepCells');\n  positiveFinite(maxWarpCells, 'maxWarpCells');\n  finiteInRange(minImprovement, 'minMarginImprovement', 0, Infinity);\n  positiveFinite(huberDeltaCells, 'huberDeltaCells');\n  nonNegativeInteger(iterations, 'irlsIterations');\n\n  const steps = Math.round(searchRadiusCells / searchStepCells);\n  if (Math.abs(steps * searchStepCells - searchRadiusCells) > 1e-12) {\n    throw new RangeError('searchRadiusCells 는 searchStepCells의 정수배여야 한다');\n  }\n\n  return {\n    searchRadiusCells,\n    searchStepCells,\n    maxWarpCells,\n    minImprovement,\n    huberDeltaCells,\n    iterations,\n    steps,\n  };\n}\n\nfunction nestedSampleOptions(options) {\n  if (options.sampleOptions === undefined) return options;\n  if (!options.sampleOptions || typeof options.sampleOptions !== 'object') {\n    throw new TypeError('sampleOptions 는 객체여야 한다');\n  }\n  return { ...options, ...options.sampleOptions };\n}\n\nfunction nestedDiscOptions(options) {\n  if (options.discOptions === undefined) return options;\n  if (!options.discOptions || typeof options.discOptions !== 'object') {\n    throw new TypeError('discOptions 는 객체여야 한다');\n  }\n  return options.discOptions;\n}\n\nfunction sampledCellAtOffset(luma, H, layout, q, r, dx, dy, options) {\n  const discs = cellSampleDiscs(q, r, layout, nestedDiscOptions(options));\n  const samples = {};\n  const failures = [];\n  const optionsForDisc = nestedSampleOptions(options);\n\n  for (const face of FACES) {\n    const disc = discs[face];\n    const result = sampleProjectedDisc(\n      luma,\n      H,\n      { x: disc.x + dx, y: disc.y + dy, radius: disc.radius },\n      optionsForDisc,\n    );\n    if (!result.ok) {\n      failures.push({ face, reason: result.reason, detail: result.detail });\n      continue;\n    }\n    samples[face] = {\n      median: result.median,\n      mad: result.mad,\n      count: result.count,\n    };\n  }\n\n  if (failures.length > 0) {\n    return fail(FRONTEND_FAILURE.SAMPLE_STARVED, {\n      stage: 'local-warp-offset-sample',\n      q,\n      r,\n      dx,\n      dy,\n      failures,\n    });\n  }\n\n  const rank = rankConfidence(samples, options);\n  const margin = Math.min(\n    samples.R.median - samples.T.median,\n    samples.L.median - samples.R.median,\n  );\n  return ok({\n    cell: {\n      T: samples.T,\n      L: samples.L,\n      R: samples.R,\n      separation: rank.separation,\n      tie: rank.tie,\n    },\n    margin,\n    confidence: rank.confidence,\n    tie: rank.tie,\n  });\n}\n\nfunction offsetIsBetter(candidate, current) {\n  if (current === null) return true;\n  if (candidate.margin !== current.margin) return candidate.margin > current.margin;\n  if (candidate.normSquared !== current.normSquared) return candidate.normSquared < current.normSquared;\n  if (candidate.dy !== current.dy) return candidate.dy < current.dy;\n  return candidate.dx < current.dx;\n}\n\nfunction bestOffsetForReference(luma, H, layout, reference, config, options) {\n  const unit = layout.size;\n  let best = null;\n  let evaluated = 0;\n  let starved = 0;\n\n  // 정수 격자 인덱스로 좌표를 만들면 0.025의 이진 부동소수 오차가 순회 순서를\n  // 흔드는 일을 막는다. 모든 후보를 끝까지 평가한 뒤에만 best를 고른다.\n  for (let iy = -config.steps; iy <= config.steps; iy += 1) {\n    const dy = iy * config.searchStepCells * unit;\n    for (let ix = -config.steps; ix <= config.steps; ix += 1) {\n      const dx = ix * config.searchStepCells * unit;\n      const result = sampledCellAtOffset(luma, H, layout, reference.q, reference.r, dx, dy, options);\n      evaluated += 1;\n      if (!result.ok) {\n        starved += 1;\n        continue;\n      }\n\n      const candidate = {\n        q: reference.q,\n        r: reference.r,\n        dx,\n        dy,\n        margin: result.margin,\n        confidence: result.confidence,\n        normSquared: dx * dx + dy * dy,\n      };\n      if (offsetIsBetter(candidate, best)) best = candidate;\n    }\n  }\n\n  return { best, evaluated, starved };\n}\n\nfunction solveThreeByThree(matrix, vector) {\n  const a = matrix.map((row) => row.slice());\n  const b = vector.slice();\n\n  for (let column = 0; column < 3; column += 1) {\n    let pivot = column;\n    for (let row = column + 1; row < 3; row += 1) {\n      if (Math.abs(a[row][column]) > Math.abs(a[pivot][column])) pivot = row;\n    }\n    if (Math.abs(a[pivot][column]) <= AFFINE_PIVOT_EPSILON) return null;\n    if (pivot !== column) {\n      [a[pivot], a[column]] = [a[column], a[pivot]];\n      [b[pivot], b[column]] = [b[column], b[pivot]];\n    }\n\n    const divisor = a[column][column];\n    for (let j = column; j < 3; j += 1) a[column][j] /= divisor;\n    b[column] /= divisor;\n\n    for (let row = 0; row < 3; row += 1) {\n      if (row === column) continue;\n      const factor = a[row][column];\n      if (factor === 0) continue;\n      for (let j = column; j < 3; j += 1) a[row][j] -= factor * a[column][j];\n      b[row] -= factor * b[column];\n    }\n  }\n\n  return b;\n}\n\nfunction fitAffineResidual(points, config) {\n  if (points.length < 3) return null;\n  let weights = new Array(points.length).fill(1);\n  let coefficients = null;\n\n  for (let iteration = 0; iteration <= config.iterations; iteration += 1) {\n    const normal = [\n      [0, 0, 0],\n      [0, 0, 0],\n      [0, 0, 0],\n    ];\n    const targetX = [0, 0, 0];\n    const targetY = [0, 0, 0];\n\n    for (let index = 0; index < points.length; index += 1) {\n      const point = points[index];\n      const basis = [1, point.u, point.v];\n      const weight = weights[index];\n      for (let row = 0; row < 3; row += 1) {\n        targetX[row] += weight * basis[row] * point.dx;\n        targetY[row] += weight * basis[row] * point.dy;\n        for (let column = 0; column < 3; column += 1) {\n          normal[row][column] += weight * basis[row] * basis[column];\n        }\n      }\n    }\n\n    const dx = solveThreeByThree(normal, targetX);\n    const dy = solveThreeByThree(normal, targetY);\n    if (dx === null || dy === null) return null;\n    coefficients = { dx, dy };\n    if (iteration === config.iterations) break;\n\n    const huberDelta = config.huberDeltaCells;\n    weights = points.map((point) => {\n      const predicted = displacementAt(coefficients, point.u, point.v);\n      const ex = point.dx - predicted.dx;\n      const ey = point.dy - predicted.dy;\n      const residual = Math.sqrt(ex * ex + ey * ey);\n      return residual <= huberDelta || residual === 0 ? 1 : huberDelta / residual;\n    });\n  }\n\n  return coefficients;\n}\n\nfunction displacementAt(coefficients, u, v) {\n  return {\n    dx: coefficients.dx[0] + coefficients.dx[1] * u + coefficients.dx[2] * v,\n    dy: coefficients.dy[0] + coefficients.dy[1] * u + coefficients.dy[2] * v,\n  };\n}\n\nfunction referenceRows(references) {\n  if (Array.isArray(references)) return references;\n  if (!references || typeof references !== 'object') {\n    throw new TypeError('references 는 ReferenceReport 또는 reference 배열이어야 한다');\n  }\n  if (references.ok === false) return null;\n  if (Array.isArray(references.references)) return references.references;\n  if (references.report && Array.isArray(references.report.references)) return references.report.references;\n  throw new TypeError('references 에 references 배열이 없다');\n}\n\nfunction marginValues(input) {\n  const source = Array.isArray(input)\n    ? input\n    : input && typeof input === 'object' && Array.isArray(input.references)\n      ? input.references\n      : input && typeof input === 'object' && Array.isArray(input.margins)\n        ? input.margins\n        : [input];\n\n  const values = [];\n  for (const item of source) {\n    const value = typeof item === 'number'\n      ? item\n      : item && typeof item === 'object'\n        ? item.margin !== undefined\n          ? item.margin\n          : item.delta\n        : undefined;\n    if (Number.isFinite(value)) values.push(value);\n  }\n  return values;\n}\n\n/**\n * leave-one-out 전후 margin의 중앙값만으로 국소 보정 채택 여부를 판단한다.\n * 보정 거부는 레퍼런스 순서 실패가 아니라 \"보정 없이 계속\"해야 하는 정상 진단이다.\n */\nexport function validateLocalWarp(before, after, options = {}) {\n  const beforeValues = marginValues(before);\n  const afterValues = marginValues(after);\n  const minImprovement = firstDefined(\n    options,\n    ['minMarginImprovement', 'minimumMarginImprovement'],\n    MIN_LOCAL_WARP_MARGIN_IMPROVEMENT,\n  );\n  finiteInRange(minImprovement, 'minMarginImprovement', 0, Infinity);\n\n  if (beforeValues.length === 0 || afterValues.length === 0) {\n    return {\n      accepted: false,\n      beforeMedian: null,\n      afterMedian: null,\n      improvement: null,\n      requiredImprovement: null,\n      compared: 0,\n      cause: 'no-comparable-margins',\n    };\n  }\n\n  const beforeMedian = median(beforeValues);\n  const afterMedian = median(afterValues);\n  const improvement = afterMedian - beforeMedian;\n  const requiredImprovement = minImprovement * Math.max(Math.abs(beforeMedian), 1 / 255);\n  return {\n    accepted: improvement >= requiredImprovement,\n    beforeMedian,\n    afterMedian,\n    improvement,\n    requiredImprovement,\n    compared: Math.min(beforeValues.length, afterValues.length),\n  };\n}\n\n/**\n * 레퍼런스 주변의 모든 고정 offset 후보를 평가하고, affine residual 후보를\n * leave-one-out로 검증한다. 이 함수는 H를 교체하지 않는다. 성공 correction은\n * canonical p에 D(p)를 더한 뒤 기존 H로 투영해야 한다.\n */\nexport function estimateLocalWarp(luma, geometry, references, options = {}) {\n  assertLumaField(luma);\n  const H = geometryH(geometry);\n  assertHomography(H);\n  const layout = geometryLayout(geometry, options);\n  const config = localWarpConfig(options);\n  const rows = referenceRows(references);\n  if (rows === null) {\n    return fail(FRONTEND_FAILURE.REFERENCE_MISMATCH, {\n      stage: 'estimate-local-warp',\n      cause: 'reference-validation-failed',\n    });\n  }\n\n  // 이미 expected order와 confidence를 잃은 reference의 offset은 기하가 아니라\n  // 텍스처/노이즈를 학습할 위험이 크다. 검증된 제어 셀만 fit 증거로 쓴다.\n  const usable = rows.filter((row) =>\n    Number.isInteger(row.q)\n    && Number.isInteger(row.r)\n    && row.orderValid !== false\n    && row.confident !== false,\n  );\n\n  const selected = [];\n  const searchDiagnostics = [];\n  for (const reference of usable) {\n    const searched = bestOffsetForReference(luma, H, layout, reference, config, options);\n    searchDiagnostics.push({\n      q: reference.q,\n      r: reference.r,\n      evaluated: searched.evaluated,\n      starved: searched.starved,\n      found: searched.best !== null,\n    });\n    if (searched.best !== null) selected.push(searched.best);\n  }\n\n  if (selected.length === 0) {\n    return fail(FRONTEND_FAILURE.SAMPLE_STARVED, {\n      stage: 'estimate-local-warp',\n      cause: 'no-reference-offset-sample',\n      searchDiagnostics,\n    });\n  }\n\n  const points = selected.map((offset) => {\n    const center = axialToPixel(offset.q, offset.r, layout);\n    return {\n      ...offset,\n      u: center.x,\n      v: center.y,\n    };\n  });\n  const coefficients = fitAffineResidual(points, {\n    ...config,\n    huberDeltaCells: config.huberDeltaCells * layout.size,\n  });\n\n  if (coefficients === null) {\n    return ok({\n      correction: null,\n      correctionAccepted: false,\n      offsets: selected,\n      searchDiagnostics,\n      validation: {\n        accepted: false,\n        cause: 'insufficient-or-degenerate-affine-points',\n      },\n    });\n  }\n\n  const jacobianDeterminant =\n    (1 + coefficients.dx[1]) * (1 + coefficients.dy[2])\n    - coefficients.dx[2] * coefficients.dy[1];\n  const predictedOffsets = points.map((point) => {\n    const displacement = displacementAt(coefficients, point.u, point.v);\n    return { q: point.q, r: point.r, ...displacement };\n  });\n  const maxDisplacement = predictedOffsets.reduce((maximum, offset) => {\n    const magnitude = Math.sqrt(offset.dx * offset.dx + offset.dy * offset.dy);\n    return Math.max(maximum, magnitude);\n  }, 0);\n\n  const before = [];\n  const after = [];\n  const validationFailures = [];\n  for (let index = 0; index < points.length; index += 1) {\n    const point = points[index];\n    const beforeSample = sampledCellAtOffset(luma, H, layout, point.q, point.r, 0, 0, options);\n    if (beforeSample.ok) {\n      before.push({ q: point.q, r: point.r, margin: beforeSample.margin });\n    } else {\n      validationFailures.push({ q: point.q, r: point.r, phase: 'before', detail: beforeSample.detail });\n    }\n\n    const leaveOneOut = fitAffineResidual(\n      points.filter((_, candidateIndex) => candidateIndex !== index),\n      {\n        ...config,\n        huberDeltaCells: config.huberDeltaCells * layout.size,\n      },\n    );\n    if (leaveOneOut === null) {\n      validationFailures.push({ q: point.q, r: point.r, phase: 'leave-one-out-fit' });\n      continue;\n    }\n\n    const displacement = displacementAt(leaveOneOut, point.u, point.v);\n    const afterSample = sampledCellAtOffset(\n      luma,\n      H,\n      layout,\n      point.q,\n      point.r,\n      displacement.dx,\n      displacement.dy,\n      options,\n    );\n    if (afterSample.ok) {\n      after.push({ q: point.q, r: point.r, margin: afterSample.margin });\n    } else {\n      validationFailures.push({ q: point.q, r: point.r, phase: 'after', detail: afterSample.detail });\n    }\n  }\n\n  const marginValidation = validateLocalWarp(before, after, {\n    minMarginImprovement: config.minImprovement,\n  });\n  const maxDisplacementAllowed = config.maxWarpCells * layout.size;\n  const geometricSafe = jacobianDeterminant > 0 && maxDisplacement <= maxDisplacementAllowed;\n  const correctionAccepted = marginValidation.accepted && geometricSafe;\n\n  const candidate = {\n    type: 'affine-residual',\n    coefficients,\n    jacobianDeterminant,\n    maxDisplacement,\n    maxDisplacementAllowed,\n  };\n  return ok({\n    correction: correctionAccepted ? candidate : null,\n    correctionCandidate: candidate,\n    correctionAccepted,\n    offsets: selected,\n    predictedOffsets,\n    searchDiagnostics,\n    before,\n    after,\n    validation: {\n      ...marginValidation,\n      geometricSafe,\n      validationFailures,\n    },\n  });\n}\n"],
