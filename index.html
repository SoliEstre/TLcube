<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilume — TLcube 인코더 (M0)</title>
<style>
  /* 테마: 다크 값이 기본. 라이트 세트는 [data-theme="light"] 또는
     (자동 모드 + OS 라이트) 에서 적용. 코드 렌더(프리셋 배경)와는 독립 — 페이지 크롬만. */
  :root {
    --bg: #101218;
    --panel: #191c26;
    --line: #2a2f40;
    --text: #dfe3ee;
    --dim: #8a91a6;
    --accent: #7fa3ff;
    --ok: #7fd8a4;
    --bad: #ff8f8f;
    --warn: #e8c56a;
  }
  :root[data-theme="light"] {
    --bg: #f2f4f8;
    --panel: #ffffff;
    --line: #d4d9e4;
    --text: #23293a;
    --dim: #6a7185;
    --accent: #3d6ae0;
    --ok: #1f9d5f;
    --bad: #d64545;
    --warn: #a8791a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #f2f4f8;
      --panel: #ffffff;
      --line: #d4d9e4;
      --text: #23293a;
      --dim: #6a7185;
      --accent: #3d6ae0;
      --ok: #1f9d5f;
      --bad: #d64545;
      --warn: #a8791a;
    }
  }
  .theme-toggle {
    display: flex; gap: 2px; padding: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .theme-toggle button {
    padding: 3px 10px; font-size: 11px; border: none; border-radius: 6px;
    background: transparent; color: var(--dim); cursor: pointer;
  }
  .theme-toggle button.active { background: var(--line); color: var(--text); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; padding: 18px 24px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  main {
    width: 100%; max-width: 1080px; padding: 8px 24px 40px;
    display: grid; grid-template-columns: 340px 1fr; gap: 20px;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
    align-self: start;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  textarea, select, input[type="text"], input[type="password"] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; font: inherit; font-size: 13px;
  }
  textarea { min-height: 84px; resize: vertical; }
  button {
    padding: 7px 0; font: inherit; font-size: 13px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .row > button { flex: 1; width: auto; }
  .check-row {
    display: flex; align-items: center; gap: 8px; margin: 12px 0 0;
    font-size: 12px; color: var(--text);
  }
  .check-row input { width: auto; margin: 0; }
  .hint { font-size: 11px; color: var(--dim); margin: 4px 0 0; line-height: 1.5; }
  fieldset.typeOptions { border: none; margin: 0; padding: 0; }
  #info { margin-top: 14px; font-size: 12px; line-height: 1.7; color: var(--dim); }
  #info b { color: var(--text); font-weight: 600; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 99px;
    font-size: 11px; border: 1px solid var(--line);
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  #error { color: var(--bad); font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  #stage {
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; min-height: 420px; overflow: auto;
  }
  canvas { display: block; border-radius: 4px; }
  footer { color: var(--dim); font-size: 11px; padding-bottom: 24px; }

  /* ── 모드 스위치 ─────────────────────────────────────────────── */
  .mode-switch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 99px;
    padding: 2px; gap: 2px;
  }
  .mode-switch button {
    border: none; border-radius: 99px; padding: 5px 14px; font-size: 12px;
    background: transparent; color: var(--dim);
  }
  .mode-switch button:hover { color: var(--text); border-color: transparent; }
  .mode-switch button.active { background: var(--accent); color: #0c1220; font-weight: 600; }

  /* ── 카드 토글 공용 ──────────────────────────────────────────── */
  .card-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .toggle-card {
    flex: 1 1 0; min-width: 64px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; padding: 10px 6px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; color: var(--dim); text-align: center; font-size: 11px;
    user-select: none;
  }
  .toggle-card svg { color: var(--dim); }
  .toggle-card:hover { border-color: var(--accent); color: var(--text); }
  .toggle-card.active {
    border-color: var(--accent); color: var(--text);
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  }
  .toggle-card.active svg { color: var(--accent); }
  .toggle-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── 스타일 스와치 ───────────────────────────────────────────── */
  .swatch-card { flex: 1 1 0; }
  .swatch-chips { display: flex; gap: 3px; }
  /* 칩 테두리는 중간 회색 반투명 — 밝은 칩(slate 최상위 등)이 선택 카드 배경·라이트
     테마 패널과 겹쳐도 구분된다 (사용자 지적: outline 필수). */
  .swatch-chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(128,128,128,.55); }
  .swatch-bg { width: 100%; height: 8px; border-radius: 3px; margin-top: 2px; border: 1px solid rgba(128,128,128,.4); }

  /* ── 콘텐츠 탭 입력 그룹 ─────────────────────────────────────── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .seg-buttons { display: flex; gap: 6px; margin-top: 4px; }
  .seg-buttons button {
    flex: 1; padding: 6px 0; font-size: 12px; border-radius: 6px;
  }
  .seg-buttons button.active { border-color: var(--accent); color: var(--accent); }

  /* ── 용량 게이지 ─────────────────────────────────────────────── */
  .gauge-track {
    width: 100%; height: 8px; border-radius: 99px; background: var(--bg);
    border: 1px solid var(--line); overflow: hidden; margin-top: 6px;
  }
  .gauge-fill { height: 100%; background: var(--ok); width: 0%; transition: width .15s ease; }
  .gauge-fill.warn { background: var(--warn); }
  .gauge-fill.bad { background: var(--bad); }
  .gauge-label { font-size: 11px; color: var(--dim); margin-top: 4px; }

  /* ── 고급 모드: 슬라이더 ─────────────────────────────────────── */
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .slider-value { font-size: 11px; color: var(--dim); margin-top: 2px; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 16px 0 4px;
  }
  .section-title:first-child { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Trilume <span style="color:var(--accent)">/ TLcube</span></h1>
  <span class="sub">3면 휘도 순위 2.5D 코드 — M0 인코더 프리뷰</span>
  <span class="spacer"></span>
  <div class="mode-switch" id="modeSwitch">
    <button type="button" id="modeNormalBtn" class="active">일반</button>
    <button type="button" id="modeAdvancedBtn">고급</button>
  </div>
  <div class="theme-toggle" id="themeToggle" title="페이지 테마 (코드 렌더와 무관)">
    <button type="button" data-theme-choice="auto" class="active">자동</button>
    <button type="button" data-theme-choice="light">라이트</button>
    <button type="button" data-theme-choice="dark">다크</button>
  </div>
</header>
<script>
// 테마 적용은 module 로드보다 먼저 (플래시 방지). localStorage 저장 — 페이지 크롬
// 설정일 뿐 출력 결정성과 무관하다. 자동 = data-theme 미부착 (media query 가 처리).
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('tlcube-theme'); } catch (e) { /* 프라이빗 모드 등 */ }
  var choice = saved === 'light' || saved === 'dark' ? saved : 'auto';
  if (choice !== 'auto') document.documentElement.setAttribute('data-theme', choice);
  var toggle = document.getElementById('themeToggle');
  var buttons = toggle.querySelectorAll('button');
  buttons.forEach(function (b) {
    b.classList.toggle('active', b.dataset.themeChoice === choice);
    b.addEventListener('click', function () {
      var c = b.dataset.themeChoice;
      if (c === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', c);
      try {
        if (c === 'auto') localStorage.removeItem('tlcube-theme');
        else localStorage.setItem('tlcube-theme', c);
      } catch (e) { /* 무시 */ }
      buttons.forEach(function (x) { x.classList.toggle('active', x === b); });
    });
  });
})();
</script>
<main>

<script type="module">
import { encode } from './src/encode.js';
import { encodeY } from './src/encodeY.js';
import { PRESETS, DEFAULT_PRESET, getPreset, BULLSEYE_DARK, BULLSEYE_LIGHT, presetDeltaMin } from './src/luminance.js';
import { buildScene } from './src/scene.js';
import { buildSceneY, DEFAULT_FACE_GAINS } from './src/sceneY.js';
import { rasterize } from './src/raster.js';
import { verifyRaster } from './src/verify.js';
import { verifyRasterY } from './src/verifyY.js';
import { payloadByteLength } from './src/header.js';
import { rasterToPng } from './src/png.js';
import { sceneToSvg } from './src/svg.js';
import { TL_READER_URL } from './src/qr.js';
import { wifiPayload, cardPayload } from './src/payloadform.js';

const $ = (id) => document.getElementById(id);
const els = {
  // 고급 모드
  payload: $('payload'), codeType: $('codeType'),
  versionWrapO: $('versionWrapO'), versionWrapY: $('versionWrapY'),
  versionO: $('versionO'), versionY: $('versionY'),
  ecc: $('ecc'), preset: $('preset'),
  optionsO: $('optionsO'), optionsY: $('optionsY'),
  qrCorner: $('qrCorner'), qrCenter: $('qrCenter'), qrCenterHint: $('qrCenterHint'),
  tone: $('tone'), faceGain: $('faceGain'), faceGainValue: $('faceGainValue'),
  qrUrl: $('qrUrl'),
  // 일반 모드
  panelNormal: $('panelNormal'), panelAdvanced: $('panelAdvanced'),
  modeNormalBtn: $('modeNormalBtn'), modeAdvancedBtn: $('modeAdvancedBtn'),
  contentTabs: $('contentTabs'), typeCards: $('typeCards'), presetSwatches: $('presetSwatches'),
  nTextPayload: $('nTextPayload'), nUrlPayload: $('nUrlPayload'),
  nWifiSsid: $('nWifiSsid'), nWifiPassword: $('nWifiPassword'), wifiSecButtons: $('wifiSecButtons'),
  nCardName: $('nCardName'), nCardPhone: $('nCardPhone'), nCardEmail: $('nCardEmail'),
  nCardOrg: $('nCardOrg'), nCardUrl: $('nCardUrl'),
  nGaugeFill: $('nGaugeFill'), nGaugeLabel: $('nGaugeLabel'),
  // 공통
  info: $('info'), error: $('error'), canvas: $('view'),
  exportPng: $('exportPng'), exportSvg: $('exportSvg'),
};

/** 일반 모드 전용 in-memory 상태 — localStorage 미사용(결정성·단순성, 새로고침 시 초기화). */
let mode = 'normal';
const normalState = { contentTab: 'text', type: 'O', preset: DEFAULT_PRESET, wifiSecurity: 'WPA' };

/** 마지막 성공 렌더 상태 — export 는 화면과 같은 입력에서 나간다. */
let current = null;

function download(bytes, mime, filename) {
  const blob = new Blob([bytes], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportFilename(ext) {
  const { type, encoded } = current;
  if (type === 'O') {
    const qMark = encoded.centerQr ? 'Q' : '';
    return `trilume-o-v${encoded.version}${qMark}-${encoded.eccLevel}.${ext}`;
  }
  return `trilume-y${encoded.version}${encoded.tones === 3 ? 't' : ''}-${encoded.eccLevel}.${ext}`;
}

els.exportPng.addEventListener('click', () => {
  if (!current) return;
  const raster = rasterize(current.scene, { pixelsPerUnit: 32, supersample: 2 });
  download(rasterToPng(raster), 'image/png', exportFilename('png'));
});

els.exportSvg.addEventListener('click', () => {
  if (!current) return;
  download(new TextEncoder().encode(sceneToSvg(current.scene)), 'image/svg+xml', exportFilename('svg'));
});

// ── 프리셋 목록 채우기 (고급 모드 select + 일반 모드 스와치 카드) ──────────

for (const name of Object.keys(PRESETS)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = PRESETS[name].label || name;
  if (name === DEFAULT_PRESET) opt.selected = true;
  els.preset.appendChild(opt);
}

els.qrUrl.value = TL_READER_URL;

function rgbCss(c) { return `rgb(${c.r},${c.g},${c.b})`; }

for (const name of Object.keys(PRESETS)) {
  const p = PRESETS[name];
  const card = document.createElement('div');
  card.className = 'toggle-card swatch-card' + (name === DEFAULT_PRESET ? ' active' : '');
  card.dataset.preset = name;
  const chips = document.createElement('div');
  chips.className = 'swatch-chips';
  for (const lvl of p.levels) {
    const chip = document.createElement('span');
    chip.className = 'swatch-chip';
    chip.style.background = rgbCss(lvl);
    chips.appendChild(chip);
  }
  const bgStrip = document.createElement('div');
  bgStrip.className = 'swatch-bg';
  bgStrip.style.background = rgbCss(p.background);
  const labelEl = document.createElement('div');
  labelEl.textContent = p.label || name;
  card.appendChild(chips);
  card.appendChild(bgStrip);
  card.appendChild(labelEl);
  card.addEventListener('click', () => {
    normalState.preset = name;
    for (const c of els.presetSwatches.children) c.classList.toggle('active', c.dataset.preset === name);
    schedule();
  });
  els.presetSwatches.appendChild(card);
}

// 카드 토글 UI 키보드 접근성 — 클릭 핸들러는 위에서 이미 붙었으니 Enter/Space 로
// 같은 click 을 재사용한다(동적 생성된 스와치 카드까지 포함해 한 번에 처리).
for (const card of document.querySelectorAll('.toggle-card')) {
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      card.click();
    }
  });
}

/**
 * @param {string} name 프리셋 이름
 * @param {{T:number,L:number,R:number}} [faceGains] Type Y 면 게인 (생략 시 기본값)
 */
function paletteOf(name, faceGains) {
  const p = getPreset(name);
  return {
    background: p.background, levels: p.levels,
    bullseyeDark: BULLSEYE_DARK, bullseyeLight: BULLSEYE_LIGHT,
    faceGains: faceGains === undefined ? DEFAULT_FACE_GAINS : faceGains,
  };
}

/** scene → canvas. 인접 도형 사이 AA 실선(헤어라인 심) 방지를 위해 동일색 얇은 스트로크를 겹친다. */
function drawScene(scene, canvas, ppu) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(scene.width * ppu * dpr);
  canvas.height = Math.round(scene.height * ppu * dpr);
  canvas.style.width = `${Math.round(scene.width * ppu)}px`;
  canvas.style.height = `${Math.round(scene.height * ppu)}px`;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ppu * dpr, 0, 0, ppu * dpr, 0, 0);
  ctx.fillStyle = rgbCss(scene.background);
  ctx.fillRect(0, 0, scene.width, scene.height);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.03;
  for (const s of scene.shapes) {
    ctx.fillStyle = rgbCss(s.color);
    ctx.beginPath();
    if (s.kind === 'polygon') {
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i += 1) ctx.lineTo(s.points[i].x, s.points[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = ctx.fillStyle;
      ctx.stroke();
    } else {
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ── 모드 전환 ───────────────────────────────────────────────────────────

function setMode(next) {
  mode = next;
  els.modeNormalBtn.classList.toggle('active', mode === 'normal');
  els.modeAdvancedBtn.classList.toggle('active', mode === 'advanced');
  els.panelNormal.style.display = mode === 'normal' ? '' : 'none';
  els.panelAdvanced.style.display = mode === 'advanced' ? '' : 'none';
  schedule();
}
els.modeNormalBtn.addEventListener('click', () => setMode('normal'));
els.modeAdvancedBtn.addEventListener('click', () => setMode('advanced'));

// ── 일반 모드: 콘텐츠 탭 ────────────────────────────────────────────────

function syncContentTabUi() {
  for (const card of els.contentTabs.children) {
    card.classList.toggle('active', card.dataset.tab === normalState.contentTab);
  }
  for (const name of ['text', 'url', 'wifi', 'card']) {
    $('tab' + name[0].toUpperCase() + name.slice(1)).classList.toggle('active', name === normalState.contentTab);
  }
}
for (const card of els.contentTabs.children) {
  card.addEventListener('click', () => {
    normalState.contentTab = card.dataset.tab;
    syncContentTabUi();
    schedule();
  });
}
syncContentTabUi();

for (const btn of els.wifiSecButtons.children) {
  btn.addEventListener('click', () => {
    normalState.wifiSecurity = btn.dataset.sec;
    for (const b of els.wifiSecButtons.children) b.classList.toggle('active', b === btn);
    schedule();
  });
}

// ── 일반 모드: 타입 카드 ────────────────────────────────────────────────

for (const card of els.typeCards.children) {
  card.addEventListener('click', () => {
    normalState.type = card.dataset.type;
    for (const c of els.typeCards.children) c.classList.toggle('active', c === card);
    schedule();
  });
}

// ── 고급 모드: 옵션 패널 표시 전환 + 중앙 QR 토글 시 코너 기본 OFF (ADR 0004 §1-4) ──

function syncTypeUi() {
  const isY = els.codeType.value === 'Y';
  els.versionWrapO.style.display = isY ? 'none' : '';
  els.versionWrapY.style.display = isY ? '' : 'none';
  els.optionsO.style.display = isY ? 'none' : '';
  els.optionsY.style.display = isY ? '' : 'none';
}

let lastQrCenter = els.qrCenter.checked;
els.qrCenter.addEventListener('change', () => {
  // 켜지는 순간(off→on)에만 코너 기본을 끈다 — 이후 사용자가 다시 켜면(cornerToo) 존중한다.
  if (els.qrCenter.checked && !lastQrCenter) {
    els.qrCorner.checked = false;
  }
  lastQrCenter = els.qrCenter.checked;
  els.qrCenterHint.style.display = els.qrCenter.checked ? '' : 'none';
});

els.codeType.addEventListener('change', () => { syncTypeUi(); schedule(); });
syncTypeUi();

// ── 고급 모드: 면 게인 슬라이더 (Type Y — 1.0(평면) ~ DEFAULT_FACE_GAINS(기본) 보간) ──

function currentFaceGains() {
  const t = Number(els.faceGain.value) / 100; // 0..1
  const L = 1 + t * (DEFAULT_FACE_GAINS.L - 1);
  const R = 1 + t * (DEFAULT_FACE_GAINS.R - 1);
  return { T: 1, L, R };
}
function gainRatio(g) { return Math.max(g.T, g.L, g.R) / Math.min(g.T, g.L, g.R); }
function syncFaceGainLabel() {
  const g = currentFaceGains();
  const ratio = gainRatio(g);
  els.faceGainValue.textContent =
    `T ${g.T.toFixed(2)} · L ${g.L.toFixed(2)} · R ${g.R.toFixed(2)} · γ=${ratio.toFixed(3)} (≤ 2)`;
}
syncFaceGainLabel();

// ── 페이로드 조립 ───────────────────────────────────────────────────────

function normalizeUrl(raw) {
  const v = raw.trim();
  if (v === '') return '';
  return /^https?:\/\//i.test(v) ? v : `https://${v}`;
}

/** 일반 모드: 활성 콘텐츠 탭에서 페이로드 문자열을 조립한다. */
function normalPayloadText() {
  switch (normalState.contentTab) {
    case 'text':
      return els.nTextPayload.value;
    case 'url':
      return normalizeUrl(els.nUrlPayload.value);
    case 'wifi':
      return wifiPayload({
        ssid: els.nWifiSsid.value,
        password: els.nWifiPassword.value,
        security: normalState.wifiSecurity,
      });
    case 'card':
      return cardPayload({
        name: els.nCardName.value,
        phone: els.nCardPhone.value,
        email: els.nCardEmail.value,
        org: els.nCardOrg.value,
        url: els.nCardUrl.value,
      });
    default:
      return '';
  }
}

/** 현재 모드에서 렌더 설정을 하나로 모은다 — 모드별 DOM 을 여기서만 읽는다. */
function buildConfig() {
  if (mode === 'advanced') {
    return {
      type: els.codeType.value,
      text: els.payload.value,
      eccLevel: els.ecc.value,
      presetName: els.preset.value,
      versionO: els.versionO.value === 'auto' ? undefined : Number(els.versionO.value),
      versionY: Number(els.versionY.value),
      qrCorner: els.qrCorner.checked,
      qrCenter: els.qrCenter.checked,
      tone: Number(els.tone.value),
      qrText: els.qrUrl.value.trim() === '' ? TL_READER_URL : els.qrUrl.value.trim(),
      faceGains: currentFaceGains(),
    };
  }
  return {
    type: normalState.type,
    text: normalPayloadText(),
    eccLevel: 'M',
    presetName: normalState.preset,
    versionO: undefined,
    versionY: undefined,
    qrCorner: true,
    qrCenter: false,
    tone: 2,
    qrText: TL_READER_URL,
    faceGains: DEFAULT_FACE_GAINS,
  };
}

// ── 렌더 ────────────────────────────────────────────────────────────────

function renderTypeO(cfg) {
  const opts = { eccLevel: cfg.eccLevel };
  if (cfg.versionO !== undefined) opts.version = cfg.versionO;
  opts.centerQr = cfg.qrCenter;
  const encoded = encode(cfg.text, opts);

  const qrEnabled = cfg.qrCenter || cfg.qrCorner;
  const sceneOpts = { palette: paletteOf(cfg.presetName), centerQr: cfg.qrCenter };
  if (qrEnabled) sceneOpts.qrText = cfg.qrText;
  if (cfg.qrCenter) sceneOpts.cornerToo = cfg.qrCorner;
  const scene = buildScene(encoded, sceneOpts);

  const raster = rasterize(scene, { pixelsPerUnit: 12, supersample: 2 });
  const check = verifyRaster(raster, scene, encoded);
  const bytes = payloadByteLength(cfg.text);
  const badge = check.ok
    ? `<span class="badge ok">자체검증 ✓ ${check.total}셀 · Δmin ${check.minDelta.toFixed(3)}</span>`
    : `<span class="badge bad">자체검증 ✗ 불일치 ${check.mismatches.length}건</span>`;
  const info =
    `타입 <b>O</b> · 버전 <b>V${encoded.version}${encoded.centerQr ? 'Q' : ''}</b> (k=${encoded.k}) · ECC <b>${encoded.eccLevel}</b><br>` +
    `페이로드 <b>${bytes}</b> / ${encoded.capacity.maxPayloadBytes} B · ` +
    `심볼 ${encoded.capacity.dataSymbols}+${encoded.capacity.nsym} · 프리셋 Δmin ${presetDeltaMin(cfg.presetName).toFixed(3)}<br>` +
    badge;
  return { type: 'O', encoded, scene, info };
}

function renderTypeY(cfg) {
  const opts = { eccLevel: cfg.eccLevel, tones: cfg.tone };
  if (cfg.versionY !== undefined) opts.version = cfg.versionY;
  const encoded = encodeY(cfg.text, opts);

  const scene = buildSceneY(encoded, { palette: paletteOf(cfg.presetName, cfg.faceGains), qrText: cfg.qrText });

  const raster = rasterize(scene, { pixelsPerUnit: 10, supersample: 2 });
  const check = verifyRasterY(raster, scene, encoded);
  const bytes = payloadByteLength(cfg.text);
  const marginLabel = cfg.tone === 2
    ? `logMargin ${check.logMargin.toFixed(3)}`
    : `Δmin-Y ${check.minDeltaY.toFixed(3)}`;
  const badge = check.ok
    ? `<span class="badge ok">자체검증 ✓ ${check.total}셀 · ${marginLabel}</span>`
    : `<span class="badge bad">자체검증 ✗ 불일치 ${check.mismatches.length}건 · 소거 ${check.erasures.length}건</span>`;
  const info =
    `타입 <b>Y</b> · 버전 <b>Y${encoded.version}${encoded.tones === 3 ? 'T' : ''}</b> (n=${encoded.n}) · ECC <b>${encoded.eccLevel}</b> · 톤 <b>${encoded.tones}</b><br>` +
    `페이로드 <b>${bytes}</b> / ${encoded.capacity.maxPayloadBytes} B · ` +
    `심볼 ${encoded.capacity.dataSymbols}+${encoded.capacity.nsym}<br>` +
    badge;
  return { type: 'Y', encoded, scene, info };
}

function updateGauge(encoded, text) {
  if (mode !== 'normal') return; // 게이지는 일반 모드 전용 UI 요소
  if (!encoded) {
    els.nGaugeFill.style.width = '0%';
    els.nGaugeFill.classList.remove('warn', 'bad');
    els.nGaugeLabel.textContent = '–';
    return;
  }
  const bytes = payloadByteLength(text);
  const max = encoded.capacity.maxPayloadBytes;
  const pct = max > 0 ? Math.min(100, (bytes / max) * 100) : 0;
  els.nGaugeFill.style.width = `${pct}%`;
  els.nGaugeFill.classList.toggle('warn', pct >= 70 && pct < 90);
  els.nGaugeFill.classList.toggle('bad', pct >= 90);
  els.nGaugeLabel.textContent = `${bytes} B / ${max} B (V${encoded.version}${encoded.tones !== undefined && encoded.tones === 3 ? 'T' : ''})`;
}

let timer = 0;
function schedule() { clearTimeout(timer); timer = setTimeout(render, 120); }

function render() {
  els.error.textContent = '';
  syncFaceGainLabel();
  const cfg = buildConfig();
  try {
    const result = cfg.type === 'Y' ? renderTypeY(cfg) : renderTypeO(cfg);
    current = { type: result.type, encoded: result.encoded, scene: result.scene };
    drawScene(result.scene, els.canvas, 26);
    els.info.innerHTML = result.info;
    updateGauge(result.encoded, cfg.text);
  } catch (err) {
    current = null;
    els.info.innerHTML = '';
    els.error.textContent = String(err && err.message ? err.message : err);
    updateGauge(null, '');
  }
}

for (const el of [
  els.payload, els.versionO, els.versionY, els.ecc, els.preset,
  els.qrCorner, els.qrCenter, els.tone, els.faceGain, els.qrUrl,
]) {
  el.addEventListener('input', schedule);
  el.addEventListener('change', schedule);
}
for (const el of [
  els.nTextPayload, els.nUrlPayload, els.nWifiSsid, els.nWifiPassword,
  els.nCardName, els.nCardPhone, els.nCardEmail, els.nCardOrg, els.nCardUrl,
]) {
  el.addEventListener('input', schedule);
  el.addEventListener('change', schedule);
}
render();
</script>
</body>
</html>
