# nginx.conf — TLcube 3사이트 + 수집 엔드포인트
#
# 적용:
#   1. repo 를 서버에 배치      (예: /srv/tlcube)
#   2. 이 파일을 sites-available 로 복사 → sites-enabled 심볼릭 링크
#   3. TL_CH_USER / TL_CH_KEY 를 실제 값으로 교체 (이 파일에 적어 커밋하지 않는다)
#   4. certbot 으로 3개 호스트 인증서 발급
#   5. nginx -t && systemctl reload nginx
#
# 전제: ClickHouse 는 127.0.0.1:8123 에만 바인딩돼 있다.

# 수집 요청 레이트 리밋 — IP 당 초당 10, 버스트 20.
limit_req_zone $binary_remote_addr zone=tl_ingest:10m rate=10r/s;

# ── 소개 허브 + 수집 엔드포인트 ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tl.estre.so;
    root /srv/tlcube/sites/tl;
    index index.html;

    # _shared 는 문서 루트 밖이라 alias 로 붙인다 (tl·tlscan 공용).
    location /_shared/ {
        alias /srv/tlcube/sites/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 수집 엔드포인트.
    # ⚠ 경로에 analytics·collect·track·event 를 쓰지 않는다 — 광고차단 필터가
    #   그 단어를 경로 패턴으로 잡은 사례가 있다. 그래서 `/i`.
    location = /i {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST)   { return 405; }

        limit_req zone=tl_ingest burst=20 nodelay;
        client_max_body_size 8k;
        access_log off;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Vary Origin always;

        # INSERT 쿼리를 **서버 설정에 고정**한다. 클라이언트는 JSONEachRow 본문만
        # 보낼 수 있고 임의 SQL 은 원천 차단된다.
        # async_insert=1 이 서버측에서 배칭하고, wait_for_async_insert=0 이라
        # 브라우저 연결을 잡아두지 않는다 (비콘은 응답을 안 본다).
        proxy_set_header X-ClickHouse-User TL_CH_USER;
        proxy_set_header X-ClickHouse-Key  TL_CH_KEY;
        proxy_pass http://127.0.0.1:8123/?async_insert=1&wait_for_async_insert=0&query=INSERT%20INTO%20tl_analytics.events%20FORMAT%20JSONEachRow;
    }
}

# ── 생성기 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tlcube.estre.so;
    root /srv/tlcube/dist;

    # 단일 파일 산출물을 루트로 서빙한다.
    location / {
        try_files /trilume.html =404;
        add_header Cache-Control "public, max-age=300";
    }
}

# ── 스캐너 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tlscan.estre.so;
    root /srv/tlcube/sites/tlscan;
    index index.html;

    location /_shared/ {
        alias /srv/tlcube/sites/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name tl.estre.so tlcube.estre.so tlscan.estre.so;
    return 301 https://$host$request_uri;
}
