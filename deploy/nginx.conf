# nginx.conf — TLcube 3사이트 + 수집 엔드포인트
#
# ⚠ 이 파일은 **인증서가 이미 존재할 때만** 올라간다. 인증서가 없으면 nginx 는
#   `no "ssl_certificate" is defined for the "listen ... ssl" directive` 로 설정 검증에서
#   실패한다 — certbot 이 내부적으로 돌리는 검사도 같이 터진다. 발급이 먼저다.
#   부트스트랩 절차는 `deploy/README.md`, 발급용 conf 는 `deploy/nginx.bootstrap.conf`.
#
# 적용:
#   1. repo 를 서버에 배치      (예: /srv/tlcube)
#   2. bootstrap conf 로 인증서 발급 (README 순서 참조)
#   3. TL_CH_USER / TL_CH_KEY 를 실제 값으로 교체 (이 파일에 적어 커밋하지 않는다)
#   4. 심볼릭 링크를 이 파일로 교체 → nginx -t && systemctl reload nginx
#
# 전제: ClickHouse 는 127.0.0.1:8123 에만 바인딩돼 있다.

# 수집 요청 레이트 리밋 — IP 당 초당 10, 버스트 20.
limit_req_zone $binary_remote_addr zone=tl_ingest:10m rate=10r/s;

# ── TLS 공통값을 http 레벨로 올리지 않는 이유 ────────────────────────────
#   이 파일은 sites-enabled/ 를 통해 http{} 안으로 include 된다. 그래서 여기 최상위에
#   쓴 `ssl_protocols` 같은 지시자는 **이 서버의 다른 사이트에도 전부 적용된다**.
#   estre.so 는 공용 호스트이므로 blast radius 를 0 으로 두려고 server 블록마다
#   반복한다. 5줄 중복이 남의 사이트 TLS 를 건드리는 것보다 싸다.
#   (`limit_req_zone` 은 이름 붙은 존이라 예외 — 공유해도 부작용이 없다.)

# ── 소개 허브 + 수집 엔드포인트 ──────────────────────────────────────────
server {
    # nginx 1.25.1+ 는 `listen 443 ssl;` + `http2 on;` 형태를 권한다. 다만 구형
    # (Debian 12 = 1.22, Ubuntu 24.04 = 1.24) 에서 `http2 on;` 은 unknown directive 로
    # **하드 실패**한다. 아래 구형 표기는 신형에서 deprecation 경고에 그치므로,
    # "어디서나 뜨는 쪽"을 기본값으로 둔다.
    listen 443 ssl http2;
    server_name tl.estre.so;
    root /srv/tlcube/sites/tl;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tlcube/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlcube/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLcubeTLS:10m;
    ssl_session_tickets off;

    # _shared 는 문서 루트 밖이라 alias 로 붙인다 (tl·tlscan 공용).
    location /_shared/ {
        alias /srv/tlcube/sites/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 수집 엔드포인트.
    # ⚠ 경로에 analytics·collect·track·event 를 쓰지 않는다 — 광고차단 필터가
    #   그 단어를 경로 패턴으로 잡은 사례가 있다. 그래서 `/i`.
    location = /i {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST)   { return 405; }

        limit_req zone=tl_ingest burst=20 nodelay;
        client_max_body_size 8k;
        access_log off;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Vary Origin always;

        # INSERT 쿼리를 **서버 설정에 고정**한다. 클라이언트는 JSONEachRow 본문만
        # 보낼 수 있고 임의 SQL 은 원천 차단된다.
        # async_insert=1 이 서버측에서 배칭하고, wait_for_async_insert=0 이라
        # 브라우저 연결을 잡아두지 않는다 (비콘은 응답을 안 본다).
        proxy_set_header X-ClickHouse-User TL_CH_USER;
        proxy_set_header X-ClickHouse-Key  TL_CH_KEY;
        proxy_pass http://127.0.0.1:8123/?async_insert=1&wait_for_async_insert=0&query=INSERT%20INTO%20tl_analytics.events%20FORMAT%20JSONEachRow;
    }
}

# ── 생성기 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tlcube.estre.so;
    root /srv/tlcube/dist;

    ssl_certificate     /etc/letsencrypt/live/tlcube/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlcube/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLcubeTLS:10m;
    ssl_session_tickets off;

    # 단일 파일 산출물을 루트로 서빙한다. dist/trilume.html 은 repo 에 커밋돼 있으므로
    # 서버에 Node 를 깔 필요가 없다 (빌드는 소스를 고칠 때만).
    location / {
        try_files /trilume.html =404;
        add_header Cache-Control "public, max-age=300";
    }
}

# ── 스캐너 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tlscan.estre.so;
    root /srv/tlcube/sites/tlscan;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tlcube/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tlcube/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLcubeTLS:10m;
    ssl_session_tickets off;

    location /_shared/ {
        alias /srv/tlcube/sites/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name tl.estre.so tlcube.estre.so tlscan.estre.so;

    # ⚠ ACME 갱신은 평문 80 을 탄다. 이 location 이 리다이렉트보다 **먼저** 잡히지
    #   않으면 90일 뒤 갱신이 조용히 실패한다 — 그때는 이미 사이트가 죽은 뒤다.
    #   `^~` 는 아래 `location /` 보다 우선권을 갖게 하려는 것이다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / { return 301 https://$host$request_uri; }
}
