# 정적 서빙 conf — **tlcube-stage 전용** (스테이징 스캐너).
#
# static.conf(정식 스캐너) 에서 뺀 것과 그 이유:
#   · /lab/ · /lab/ws — 스테이징의 존재 이유가 «수집 없는 정식 동일본» 이다.
#   · PWA(manifest·sw) — 스테이징 주소로 홈 화면 설치가 되면 후보 빌드가 사용자
#     기기에 눌러앉는다. 서비스 워커 캐시는 스테이징 평가(항상 최신 후보)와도 상충.
#   · SEO(sitemap·llms) — 검색·생성 엔진에 노출할 표면이 아니다. robots 는 전체 차단.
#
# 남긴 것: /src/ (스캐너의 ESM import — payloadform.js) · /_shared/ (정적 자산).
# index 는 no-store — 후보 빌드 평가에서 캐시가 끼면 «무엇을 재고 있는지» 가 흐려진다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /_shared/ {
        alias /srv/_shared/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /src/ {
        alias /srv/src/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
