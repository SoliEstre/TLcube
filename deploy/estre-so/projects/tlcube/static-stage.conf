# 정적 서빙 conf — **tlcube-stage 전용** (스테이징 스캐너).
#
# static.conf(정식 스캐너) 에서 뺀 것과 그 이유:
#   · /lab/ws — **수집 프록시만 뺀다** (운영자 정정 2026-08-17). /lab/ 자체는 서빙한다:
#     정식 스캐너는 셀 표면 검출이 isLabPath() 게이트로 꺼져 있어 (scanner.js:715),
#     실험 파인더 인식 테스트는 시험판에서만 가능하다. 스테이징 /lab/ = 같은 시험판
#     빌드 + WS 부재 → 수집이 조용히 실패하는 «무수집 시험판» — 속도 A/B 의 대조군.
#   · PWA(manifest·sw) — 스테이징 주소로 홈 화면 설치가 되면 후보 빌드가 사용자
#     기기에 눌러앉는다. 서비스 워커 캐시는 스테이징 평가(항상 최신 후보)와도 상충.
#   · SEO(sitemap·llms) — 검색·생성 엔진에 노출할 표면이 아니다. robots 는 전체 차단.
#
# 남긴 것: /src/ (스캐너의 ESM import — payloadform.js) · /_shared/ (정적 자산).
# index 는 no-store — 후보 빌드 평가에서 캐시가 끼면 «무엇을 재고 있는지» 가 흐려진다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 무수집 시험판 — static.conf 의 /lab/ 과 같은 서빙, /lab/ws 프록시만 없음.
    # 릴레이 부재로 수집 소켓이 실패해도 시험판 스캐너는 정상 동작한다 (dev 서버 전례).
    location = /lab/ {
        root /srv;
        try_files /_shared/lab-scan.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location /_shared/ {
        alias /srv/_shared/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /src/ {
        alias /srv/src/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
