# 정적 서빙 conf — tlcube-gen (생성기) 전용.
#
# hub·scan 이 쓰는 `static.conf` 와 **분리한 이유**: 그쪽은 `/manifest.webmanifest` 를
# 스캐너 매니페스트로 alias 한다. 생성기가 같은 conf 를 쓰면 홈 화면에 "TLcube 스캐너"
# 로 설치되어 버린다. 사이트마다 자기 매니페스트를 가리켜야 한다.
#
# server_name 이 없다 — Traefik 이 Host 로 이미 라우팅한다. TLS·리다이렉트도 엣지에서 끝난다.
#
# 생성기 본체는 `dist/trilume.html` **파일 하나**를 index.html 로 마운트한다. 그래서
# 이 conf 가 붙기 전에는 `/` 말고는 전부 404 였고, PWA 에 필요한 manifest·sw 를 서빙할
# 경로 자체가 없었다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # ── PWA ────────────────────────────────────────────────────────────
    # 실체는 `_shared` 에 있지만 **루트 경로로** 내보낸다.
    #   · manifest: start_url·scope 가 `/` 다.
    #   · sw.js: 서비스 워커의 제어 범위는 스크립트 경로에 종속되므로, `_shared/` 에서
    #     그대로 주면 루트를 제어하지 못한다. 루트 alias + `Service-Worker-Allowed` 로 푼다.
    location = /manifest.webmanifest {
        alias /srv/_shared/tlcube.webmanifest;
        default_type application/manifest+json;
        expires 1h;
    }
    location = /sw.js {
        alias /srv/_shared/tlcube-sw.js;
        default_type text/javascript;
        add_header Service-Worker-Allowed "/";
        # 워커 자체는 캐시하지 않는다 — 갱신이 막히면 배포가 사용자에게 안 간다.
        add_header Cache-Control "no-cache";
    }

    # 아이콘(매니페스트가 가리킨다)과 공용 정적 자산.
    location /_shared/ {
        alias /srv/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SEO ────────────────────────────────────────────────────────────
    location = /robots.txt {
        alias /srv/_shared/robots-tlcube.txt;
        default_type text/plain;
        expires 1h;
    }
    location = /sitemap.xml {
        alias /srv/_shared/sitemap-tlcube.xml;
        default_type application/xml;
        expires 1h;
    }
    # llms.txt — 생성형 엔진/에이전트가 사이트를 요약할 때 읽는 관례 파일.
    location = /llms.txt {
        alias /srv/_shared/llms-tlcube.txt;
        default_type text/plain;
        expires 1h;
    }
}
