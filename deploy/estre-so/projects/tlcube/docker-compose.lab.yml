# /lab/ WebSocket 릴레이 — 선택 overlay. 이 파일을 빼면 정적 시험판은 열리고
# /lab/ws 만 502가 된다. static-*.conf 는 Docker DNS를 요청 시점에 해석하므로
# 릴레이 부재가 생성기·스캐너 nginx의 기동 실패로 번지지 않는다.

services:
  tlcube-lab-relay:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      # 컨테이너의 0.0.0.0은 edge 내부 공개일 뿐 호스트 포트를 열지 않는다.
      # 브라우저는 nginx의 /lab/ws만 보고 이 포트에 직접 닿지 못한다.
      TL_LAB_HOST: "0.0.0.0"
      TL_LAB_PORT: "8787"
      TL_LAB_CH_URL: "http://clickhouse:8123"
      TL_LAB_CH_DATABASE: "tl_lab"
      TL_LAB_CH_USER: ${TLCUBE_LAB_CH_USER:-tl_lab_ingest}
      TL_LAB_CH_KEY: ${TLCUBE_LAB_CH_KEY:?TLCUBE_LAB_CH_KEY 미설정 — ~/.secrets/estre.so.env 에 넣으세요}
      # 인증(F-77): Origin 허용목록 — 콤마구분. 브라우저가 Origin 헤더를 위조할 수 없으므로
      #   이것이 교차사이트 구독의 실제 차단막이다. **미설정이면 릴레이는 localhost 계열만
      #   허용해 프로덕션 브라우저를 거부한다** — 프로덕션은 반드시 시험판 오리진을 명시한다.
      #   활성화하려면 아래 주석을 풀고 재기동한다(배포 몫):
      # TL_LAB_ALLOWED_ORIGINS: "https://tlscan.estre.so,https://tlcube.estre.so"
      # 선택(defense-in-depth): role 프레임 토큰까지 요구. 미설정이면 이 검사는 건너뛴다.
      #   설정 시 시험판 페이지가 같은 토큰을 클라이언트에 주입해야 한다(전역 __TL_LAB_TOKEN__).
      # TL_LAB_TOKEN: ${TLCUBE_LAB_TOKEN:-}
    volumes:
      - ${TLCUBE_SRC:-/srv/tlcube}/relay:/app:ro
    expose:
      - "8787"
    networks:
      # nginx 프록시는 edge에서 8787로, ClickHouse 호출은 analytics에서 8123으로 간다.
      # ports를 두지 않아 어느 쪽도 호스트/인터넷에 직접 열리지 않는다.
      - edge
      - analytics
    labels:
      traefik.enable: "false"

networks:
  edge:
    external: true
    name: edge
  analytics:
    external: true
    name: analytics
