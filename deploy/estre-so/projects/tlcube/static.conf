# 정적 서빙 conf — **tlcube-scan 전용**.
#
# ⚠ 예전엔 hub 와 공용이었는데 갈랐다. PWA·SEO 경로(`/manifest.webmanifest`·`/sw.js`·
#   `/robots.txt`·`/sitemap.xml`·`/llms.txt`)는 **사이트마다 내용이 달라야** 하는데,
#   `location = ...` 은 정확일치라 문서 루트의 파일보다 우선한다. 공용으로 두면 hub 가
#   스캐너의 robots.txt 와 매니페스트를 서빙해서 홈 화면에 "TLcube 스캐너" 로 설치된다.
#   hub 는 `static-hub.conf`, gen 은 `static-gen.conf` 를 쓴다.
#
# server_name 이 없다. Traefik 이 이미 Host 로 라우팅해서 컨테이너에는 자기 사이트 요청만
#   들어오므로, nginx 가 Host 를 한 번 더 판별할 이유가 없다. 기본 서버 하나면 된다.
#
# TLS 도 리다이렉트도 없다 — 둘 다 Traefik 이 엣지에서 끝낸다. 컨테이너 안은 평문 :80 이다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # 시험판은 기존 _shared 디렉터리 마운트를 재사용하되 /lab/ exact 경로에서
    # 내보낸다. _shared 의 7일 캐시가 시험판 HTML 에 번지지 않게 no-store 를 고정한다.
    location = /lab/ {
        # ⚠ alias 로 파일을 가리키지 않는다. 이 URI 는 슬래시로 끝나서 nginx 가
        # «디렉터리» 로 보고 index 모듈을 태우는데, alias 대상이 일반 파일이면
        # 거기서 **500** 이 난다(라이브 실측). 같은 conf 의 /sw.js · /manifest.webmanifest 는
        # 슬래시가 없어 alias 로 잘 동작한다 — 차이는 그것뿐이다.
        root /srv;
        try_files /_shared/lab-scan.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
    location = /lab/ws {
        # Docker DNS를 요청 시점에 해석한다. 릴레이가 없는 동안에도 nginx 는 기동하고,
        # 이 경로만 502가 된다. 릴레이는 edge 네트워크에서 이 이름과 8787을 쓴다.
        #
        # 인증: 릴레이가 핸드셰이크의 Origin 헤더를 허용목록과 대조한다(교차사이트 구독 차단).
        #   nginx 는 클라이언트 Origin 을 기본으로 업스트림에 전달하므로 별도 설정 불필요.
        #   프로덕션은 릴레이 컨테이너 env 에 TL_LAB_ALLOWED_ORIGINS 를 반드시 설정한다
        #   (예: "https://tlscan.estre.so,https://tlcube.estre.so"). 미설정이면 릴레이는
        #   localhost 계열만 허용해 프로덕션 브라우저를 거부한다 — docker-compose.lab.yml 참조.
        #   선택: TL_LAB_TOKEN 을 두면 role 프레임 토큰까지 요구한다(defense-in-depth).
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $lab_relay_upstream http://tlcube-lab-relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $lab_relay_upstream$request_uri;
    }

    # _shared 는 문서 루트 **밖**(/srv/_shared)에 마운트하고 alias 로 붙인다.
    #
    # 처음엔 문서 루트 안쪽(/usr/share/nginx/html/_shared)에 겹쳐 마운트해서 alias 를
    # 없앴는데, 그게 첫 배포에서 hub·scan 을 죽였다(2026-08-10, estreso-agent 보고).
    # 부모가 :ro 라 runc 가 read-only 뷰 안에 마운트포인트 디렉터리를 만들지 못한다 —
    # 즉 호스트에 `sites/tl/_shared/` 빈 디렉터리가 **미리 있어야** 뜬다. 그런데 git 은
    # 빈 디렉터리를 추적하지 않으므로 fresh clone 에선 없고, 인스턴스를 재구축하면
    # 같은 init 실패가 재발한다. `.gitkeep` 으로 그 의존을 만족시킬 수도 있지만,
    # **중첩을 그만두면 의존 자체가 사라진다** — 그래서 alias 로 되돌렸다.
    # (상위 `deploy/nginx.conf` 도 같은 이유로 alias 를 쓴다. 원래가 맞았다.)
    location /_shared/ {
        alias /srv/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── PWA (tlscan) ───────────────────────────────────────────────────
    # 실체는 `_shared` 에 있지만 **루트 경로로** 내보낸다.
    #
    #   · manifest: start_url·scope 가 `/` 라 루트에서 서빙돼야 자연스럽다.
    #   · sw.js: 서비스 워커의 제어 범위는 **스크립트 경로에 종속**된다. `_shared/` 에서
    #     그대로 주면 `/_shared/*` 밖을 제어하지 못한다. 루트 alias + `Service-Worker-Allowed`
    #     헤더로 루트 범위를 준다.
    #
    # 새 마운트를 추가하지 않는 이유: `_shared` 와 이 conf 는 **이미 마운트돼 있어서**
    # git pull + up -d 만으로 반영된다. compose 를 건드리면 운영 게이트가 하나 더 붙는다.
    location = /manifest.webmanifest {
        alias /srv/_shared/tlscan.webmanifest;
        default_type application/manifest+json;
        expires 1h;
    }
    location = /sw.js {
        alias /srv/_shared/tlscan-sw.js;
        default_type text/javascript;
        add_header Service-Worker-Allowed "/";
        # 워커 자체는 캐시하지 않는다 — 갱신이 막히면 배포가 사용자에게 안 간다.
        add_header Cache-Control "no-cache";
    }

    # ── SEO ────────────────────────────────────────────────────────────
    location = /robots.txt {
        alias /srv/_shared/robots-tlscan.txt;
        default_type text/plain;
        expires 1h;
    }
    location = /sitemap.xml {
        alias /srv/_shared/sitemap-tlscan.xml;
        default_type application/xml;
        expires 1h;
    }
    # llms.txt — 생성형 엔진/에이전트가 사이트를 요약할 때 읽는 관례 파일.
    location = /llms.txt {
        alias /srv/_shared/llms-tlscan.txt;
        default_type text/plain;
        expires 1h;
    }

    # 스캐너가 `/src/payloadform.js` 를 ESM 으로 import 한다 (그리고 그게 다시
    # `./vendor/jcodd.js` 를 부른다). 문서 루트가 `sites/tlscan` 자체라 상대 경로로는
    # 루트를 벗어나 404 가 되고, 정적 import 라 하나만 실패해도 모듈 전체가 죽는다.
    # 그래서 _shared 와 같은 방식으로 문서 루트 밖에 두고 alias 로 붙인다.
    # 공개 repo 의 소스라 노출 자체는 문제가 없다.
    location /src/ {
        alias /srv/src/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # /i (수집)은 여기 없다. 별도 컨테이너가 더 구체적인 Traefik 라우터로 가져간다.
    #   수집 스택을 안 올리면 이 경로는 그냥 404 이고, 비콘은 조용히 실패한다 —
    #   sites/_shared/site.js 가 애초에 그 전제로 쓰였다.
}
