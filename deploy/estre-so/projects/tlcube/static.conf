# 정적 서빙 conf — tlcube-hub · tlcube-scan 공용.
#
# server_name 이 없다. Traefik 이 이미 Host 로 라우팅해서 컨테이너에는 자기 사이트 요청만
#   들어오므로, nginx 가 Host 를 한 번 더 판별할 이유가 없다. 기본 서버 하나면 된다.
#
# TLS 도 리다이렉트도 없다 — 둘 다 Traefik 이 엣지에서 끝낸다. 컨테이너 안은 평문 :80 이다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # _shared 는 문서 루트 **밖**(/srv/_shared)에 마운트하고 alias 로 붙인다.
    #
    # 처음엔 문서 루트 안쪽(/usr/share/nginx/html/_shared)에 겹쳐 마운트해서 alias 를
    # 없앴는데, 그게 첫 배포에서 hub·scan 을 죽였다(2026-08-10, estreso-agent 보고).
    # 부모가 :ro 라 runc 가 read-only 뷰 안에 마운트포인트 디렉터리를 만들지 못한다 —
    # 즉 호스트에 `sites/tl/_shared/` 빈 디렉터리가 **미리 있어야** 뜬다. 그런데 git 은
    # 빈 디렉터리를 추적하지 않으므로 fresh clone 에선 없고, 인스턴스를 재구축하면
    # 같은 init 실패가 재발한다. `.gitkeep` 으로 그 의존을 만족시킬 수도 있지만,
    # **중첩을 그만두면 의존 자체가 사라진다** — 그래서 alias 로 되돌렸다.
    # (상위 `deploy/nginx.conf` 도 같은 이유로 alias 를 쓴다. 원래가 맞았다.)
    location /_shared/ {
        alias /srv/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 스캐너가 `/src/payloadform.js` 를 ESM 으로 import 한다 (그리고 그게 다시
    # `./vendor/jcodd.js` 를 부른다). 문서 루트가 `sites/tlscan` 자체라 상대 경로로는
    # 루트를 벗어나 404 가 되고, 정적 import 라 하나만 실패해도 모듈 전체가 죽는다.
    # 그래서 _shared 와 같은 방식으로 문서 루트 밖에 두고 alias 로 붙인다.
    # 공개 repo 의 소스라 노출 자체는 문제가 없다.
    location /src/ {
        alias /srv/src/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # /i (수집)은 여기 없다. 별도 컨테이너가 더 구체적인 Traefik 라우터로 가져간다.
    #   수집 스택을 안 올리면 이 경로는 그냥 404 이고, 비콘은 조용히 실패한다 —
    #   sites/_shared/site.js 가 애초에 그 전제로 쓰였다.
}
