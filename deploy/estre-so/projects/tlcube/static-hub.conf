# 정적 서빙 conf — **tlcube-hub (tl.estre.so) 전용**.
#
# ⚠ 예전엔 scan 과 공용(`static.conf`)이었는데 갈랐다. PWA·SEO 경로는 **사이트마다 내용이
#   달라야** 하는데 `location = ...` 은 정확일치라 문서 루트의 파일보다 우선한다.
#   공용으로 두면 hub 가 스캐너의 robots.txt·매니페스트를 서빙한다.
#
# hub 는 디렉터리 마운트(`sites/tl`)라 `robots.txt`·`sitemap.xml`·`llms.txt` 를
#   **문서 루트에 그냥 둔다** — 그래서 여기엔 그 정확일치 블록이 없다.
#   (scan·gen 은 단일 파일 마운트라 alias 가 필요하다.)
#
# hub 에는 PWA 를 붙이지 않는다. 소개 문서라 홈 화면 설치로 얻는 게 없고, 설치 가능한
#   표면을 늘리면 사용자가 생성기/스캐너와 혼동한다.
#
# server_name 이 없다 — Traefik 이 Host 로 이미 라우팅한다. TLS·리다이렉트도 엣지에서 끝난다.

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # _shared 는 문서 루트 **밖**(/srv/_shared)에 마운트하고 alias 로 붙인다.
    #
    # 처음엔 문서 루트 안쪽에 겹쳐 마운트했는데 그게 첫 배포에서 hub·scan 을 죽였다
    # (2026-08-10). 부모가 :ro 라 runc 가 read-only 뷰 안에 마운트포인트를 못 만든다 —
    # 호스트에 빈 디렉터리가 미리 있어야 하는데 git 은 빈 디렉터리를 추적하지 않아
    # fresh clone 에서 재발한다. 중첩을 그만두면 그 의존 자체가 사라진다.
    location /_shared/ {
        alias /srv/_shared/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
