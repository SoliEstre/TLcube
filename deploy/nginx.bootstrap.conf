# nginx.bootstrap.conf — 1회용. 인증서를 받기 전 ACME 챌린지만 받는다.
#
# 왜 파일이 두 개인가:
#   `nginx.conf` 는 `listen 443 ssl` + `ssl_certificate` 를 갖고 있다. 인증서 파일이
#   아직 없는 상태로 그 conf 를 올리면 nginx 는 설정 검증에서 바로 실패한다 —
#   `no "ssl_certificate" is defined for the "listen ... ssl" directive`.
#   그래서 순서가 뒤집힐 수 없다: **먼저 인증서, 그 다음 TLS conf.**
#
#   `certbot --nginx` 로 한 번에 끝내지 않는 이유는 그 플러그인이 conf 를 제자리에서
#   재작성하면서 주석과 서식을 날리기 때문이다. 이 파일들의 주석은 설계 근거이므로
#   보존한다. 대신 `certbot certonly --webroot` 를 쓴다.
#
# 이 파일은 인증서를 받고 나면 역할이 끝난다 — 심볼릭 링크를 `nginx.conf` 쪽으로 바꾼다.
# (갱신용 ACME location 은 `nginx.conf` 의 :80 블록이 그대로 이어받는다.)

server {
    listen 80;
    # IPv6 를 쓸 거면 아래를 켠다 (AAAA 레코드가 있을 때). 기본으로 꺼두는 이유는
    # IPv6 가 sysctl 로 비활성인 호스트에서 바인드 실패로 nginx 가 아예 안 뜨기 때문이다.
    # 켤 때는 `nginx.conf` 의 :443 블록 3개에도 `listen [::]:443 ssl http2;` 를 같이 넣는다.
    # listen [::]:80;
    server_name tl.estre.so tlcube.estre.so tlscan.estre.so;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 부트스트랩 동안 사이트는 아직 서빙하지 않는다 — 이 단계의 목적은 발급뿐이다.
    location / { return 404; }
}
